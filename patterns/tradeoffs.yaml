# 落とし所のパターン。限界がある中で、現実的にどう使うか。
# 新しい落とし所を見つけたら追記する。講座の財産になる部分。

screen_then_confirm:
  name: 絞り込みに使い、確定は現地で行う
  idea: 衛星で全体から候補を選び、人が現地で判定する
  good_when: 対象が広く、全部を見て回れない
  watch_out: 衛星が拾わなかった場所は「問題なし」ではない。見逃しがある前提で運用を決める

combine_with_existing:
  name: 既存の手法と併用する
  idea: 測量や点検を置き換えず、間を埋めたり範囲を広げたりする
  good_when: すでに基準となる計測があり、制度上もそれが求められている
  watch_out: 二重の費用になる。既存の手法の頻度や範囲をどこまで減らせるかを先に決める

right_target_first:
  name: 向いた対象と条件から始める
  idea: 衛星が得意な対象に絞って成果を出し、苦手な対象は後回しにする
  good_when: 対象の中に、条件の良いものと悪いものが混ざっている
  watch_out: 向いた対象だけの結果を、全体に当てはめて説明しない

change_not_absolute:
  name: 絶対値ではなく、変化と比較を見る
  idea: 「何ミリ」「何キロ」の正確さより、前回との違いや、周りとの違いを使う
  good_when: 優先順位を付けたい、異常に早く気づきたい
  watch_out: 数字が独り歩きしやすい。報告書では値の精度を必ず添える

free_data_first:
  name: 無償データで小さく試してから、商用データに進む
  idea: 無償の衛星データで使えるかを確かめ、足りない点が分かってから費用をかける
  good_when: 初めて取り組む、社内の理解がまだない
  watch_out: 無償データで駄目でも、商用データなら可能な場合がある。逆もある

routine_before_urgent:
  name: 即時性が要らない定期監視から使う
  idea: 年に数回の定期的な把握から始め、災害時の緊急利用は体制ができてから
  good_when: 撮影の時期を選べる業務がある
  watch_out: 緊急時に使うには、平時から手順と契約を用意しておく必要がある

state_what_cannot_be_said:
  name: 言えないことを先に明示する
  idea: 成果物や報告に「この結果から言えないこと」を書き、誤用を防ぐ
  good_when: 結果が顧客、上司、議会、住民に渡る
  watch_out: 書きすぎると使えない資料に見える。判断に影響する点に絞る

outsource_then_inhouse:
  name: まず外注し、分かってから内製を考える
  idea: 最初は解析会社に頼み、発注と結果の読み方を身につけてから体制を検討する
  good_when: 件数が少ない、専任を置けない
  watch_out: 外注でも、結果を説明する責任は自社に残る
