# 深さのパターン。章立てで depth: に指定する。

overview:
  name: 概要
  length: 1500〜2000字
  goal: 読み終えたら、人に一言で説明できる
  include: 結論、限界を1つ、落とし所を1つ
  omit: 手順、細かい条件、数字の根拠の詳細

standard:
  name: 標準
  length: 3500〜4500字
  goal: 読み終えたら、自分の現場で使えるか判断できる
  include: 型の全項目
  omit: 解析の内部処理

deep:
  name: 実務
  length: 6000〜8000字
  goal: 読み終えたら、仕様書や提案書の下書きが書ける
  include: 型の全項目、記入例、チェックリスト、事業者に聞く質問
  omit: なし
