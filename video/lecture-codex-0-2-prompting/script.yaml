# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第0部 第2章「AIへの頼み方」（learn/codex/codex-0-2-prompting.qmd）
title: 衛星データ解析のAIへの頼み方：指示に必ず入れる7項目と、途中の値で確かめる型
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 2
total: 30
thumb: AIへの頼み方 7項目
summary: 「Sentinel-2で、ため池の水を調べるコードを書いて」と頼むと、AIは場所も期間も処理の段階も雲の扱いも、黙って補います。目的、場所、期間、衛星と処理の段階、手順、出力、確かめ方の7項目を埋める指示文の型を、ため池の例で見ます。AIが「4と5が雲」と説明してきたコードを、公式のシーン分類の表と突き合わせて誤りを見つけるところまで、一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: AIへの頼み方：指示に必ず入れる7項目
    sub: あいまいな指示は、AIが勝手に補う
    say: AIに頼むたびに違うコードが返ってくる。何を書けば、毎回同じ前提で書かせられるでしょうか。答えは、7項目を埋めることです。目的、場所、期間、衛星と処理の段階、手順、出力、確かめ方。この7つを埋めると、AIが勝手に補う余地が減り、確かめる手がかりが指示文の中にできます。この動画では、7項目の中身と、あいまいな指示との違い、そしてAIが自信を持って返してきたコードを公式の表と突き合わせる手順を、章の内容に沿って見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 目的、場所、期間、衛星と処理の段階、手順、出力、確かめ方の7項目を埋めた指示文を書ける
      - あいまいな指示と直した指示で、AIが返すコードがどう変わるかが分かる
      - 途中の値を表示させ、答えの分かっている場所で試す、という確かめ方の型が分かる
    say: この章を終えると、3つのことができるようになります。目的、場所、期間、衛星と処理の段階、手順、出力、確かめ方の7項目を埋めた指示文を書けること。あいまいな指示と直した指示で、AIが返すコードがどう変わるかが分かること。そして、途中の値を表示させ、答えの分かっている場所で試す、という確かめ方の型が分かることです。

  - kind: figure
    heading: 指示に必ず入れる7項目
    image: figures/codex-0-2-prompting/seven.svg
    say: まず、しくみです。AIは、指示に書かれていないことを、最もありふれた選択で埋めます。衛星データの解析は、この埋める場所だらけです。たとえば、Sentinel-2の画像、とだけ書くと、処理の段階が決まりません。Sentinel-2には、大気の上端での反射率であるLevel-1Cと、大気の影響を補正した地表の反射率であるLevel-2Aがあります。どちらも画像は110キロメートル四方の区画で配られ、波長帯によって画素の大きさが10メートル、20メートル、60メートルと違います。段階が違えば値が違い、画素の大きさが違えば、そろえる処理が要ります。1つでも空欄があると、AIはそこを黙って決めます。決めた内容は、コードを読むまで分かりません。7項目は、この空欄を先に埋めるための一覧です。1、目的。何を決めるための材料か。2、場所。緯度と経度の範囲か、区画の境界のファイル。3、期間。開始日と終了日と、季節の意味。4、衛星と処理の段階。衛星の名前と、段階の正式な名前。5、手順。雲の扱い、計算、まとめ方の順番。6、出力。表、図、地図の形と単位。7、確かめ方。表示させる途中の値と、答えの分かっている場所。図で、確かめ方だけが人の色になっています。1から6は、AIが補えば済むように見えます。補えないのは、7の確かめ方です。AIは、自分のコードが正しいかを知る手段を持っていません。確かめ方は、人が書いて渡します。

  - kind: table
    heading: 空欄だとAIが補うこと
    columns: [項目, 何を書くか, 空欄だとAIが補うこと]
    widths: [0.22, 0.38, 0.40]
    rows:
      - [1. 目的, 業務の問い。何を決める材料か, 「指数を出す」が目的になる]
      - [2. 場所, 緯度と経度、区画の境界の資料, 適当な試験用の座標]
      - [3. 期間, 開始日と終了日。季節の意味, 「最新の1枚」]
      - [4. 衛星と段階, 衛星の名前と段階の正式な名前, 別の衛星や段階の決まり]
      - [5. 手順, 雲の扱い、計算、まとめ方の順番, 雲を除かない。順番が変わる]
      - [6. 出力, 表、図、地図の形と単位, 画面に数字が流れるだけ]
      - [7. 確かめ方, 表示させる途中の値。既知の場所, 何も確かめない]
    say: 空欄のままだと、AIが何で埋めるかを表で見ます。目的が空欄だと、指数を出すこと自体が目的になります。場所が空欄だと、適当な試験用の座標。期間が空欄だと、最新の1枚。衛星と処理の段階が空欄だと、別の衛星や段階の決まりが混ざります。手順が空欄だと、雲を除かず、計算の順番も変わります。出力が空欄だと、画面に数字が流れるだけ。確かめ方が空欄だと、何も確かめません。右の列はどれも、コードを読まなければ気づけないものです。

  - kind: figure
    heading: 手順：試してから広げる
    image: figures/codex-0-2-prompting/flow.svg
    say: 手順は4つです。1、7項目を埋めた指示文を書く。人の仕事です。1行でも空欄なら、埋まるまで書きません。2、途中の値を表示させる指示を足す。これも人です。使った画像の名前と日付、波長帯の番号と画素の大きさ、反射率に直した後の最小値と最大値、雲として除いた画素の数、の4つを表示させます。3、答えの分かっている場所で試す。ため池や森のように、結果が予想できる小さな範囲で動かし、予想どおりか、違うかを判定します。違えば、AIに直させて、もう一度試します。4、本番の範囲に広げる。ここはAIと人です。試験に通ったコードで全域を出し、途中の値も記録に残します。小さな範囲で先に試すのは、本番の範囲では、それらしい結果と正しい結果を見分けにくいからです。答えの分かっている場所なら、見分けられます。

  - kind: prompt
    heading: あいまいな指示の例
    label: 悪い例（7項目のうち6つが空欄）
    text: |
      Sentinel-2で、ため池の水を調べるコードを書いて。
    say: あいまいな指示の例です。Sentinel-2で、ため池の水を調べるコードを書いて。この指示には、7項目のうち、場所、期間、処理の段階、手順、出力、確かめ方の6つがありません。AIは、試験用の座標、最新の1枚、Level-1CかLevel-2Aのどちらか、雲を除かない計算、画面に流れる数字で埋めます。どれを選んだかは、コードを読むまで分かりません。

  - kind: prompt
    heading: 7項目を埋めた指示の例
    label: 良い例（ため池が夏に干上がっているかの候補出し）
    text: |
      目的：市内のため池が夏に干上がっているかの候補を出したい。
      　　　候補は現地で確かめる。
      場所：市のため池台帳の境界のファイル（別添）。範囲は市全域。
      期間：2025年7月1日〜8月31日。
      衛星と処理の段階：Sentinel-2のLevel-2A（大気の影響を補正した地表の反射率）。
      手順：画像ごとにシーン分類で雲、雲の影、薄い雲の画素を除く。
      　　　緑（B3）と近赤外（B8）から水の指数を計算し、
      　　　ため池ごとに期間内の中央値を出す。
      出力：ため池の番号、中央値、使えた画像の枚数の表。
      確かめ方：使った画像の名前と日付、波長帯の番号と画素の大きさ、
      　　　　　反射率に直した後の最小値と最大値、除いた画素の数を表示する。
      　　　　　常に水がある大きな湖と森の値を先に出し、
      　　　　　湖が高く、森が低く出ることを確かめる。
    say: 直した指示の例です。目的は、市内のため池が夏に干上がっているかどうかの候補を出すこと。候補は現地で確かめます。場所は、市のため池台帳の境界のファイルで、範囲は市全域。期間は、2025年7月1日から8月31日。衛星と処理の段階は、Sentinel-2のLevel-2A、大気の影響を補正した地表の反射率です。手順は、期間内の画像ごとに、シーン分類で雲、雲の影、薄い雲に分類された画素を除き、緑のB3と近赤外のB8から水の指数を計算して、ため池ごとに期間内の中央値を出す。出力は、ため池の番号、中央値、使えた画像の枚数の表。確かめ方は、使った画像の名前と日付、波長帯の番号と画素の大きさ、反射率に直した後の最小値と最大値、除いた画素の数を表示すること。そして、常に水があることが分かっている大きな湖の値と、森の値を先に出して、湖が高く、森が低く出ることを確かめることです。これでAIが補う余地は、関数の選び方や書き方に限られます。ここまで書いても、7項目で数百字です。AIは長い指示を読めます。読まれないのは、長い指示ではなく、あいまいな指示です。

  - kind: bullets
    heading: コードのレビュー観点4つ
    items:
      - 指示の7項目が、コードにそのまま現れているか。期間、段階、雲の扱いが違う値になっていないか
      - 途中の値を表示する行が、実際にあるか。頼んでもAIが省くことがある
      - 値の倍率とずらしが、製品の付属情報から読まれているか
      - 雲の分類の番号が、公式の表と合っているか
    say: 返ってきたコードを確かめるとき、この章で特に見るのは4つです。1つ目、指示の7項目が、コードにそのまま現れているか。期間、段階、雲の扱いが、指示と違う値で書かれていないか。2つ目、途中の値を表示する行が、実際にあるか。指示で頼んでも、AIが省くことがあります。3つ目、値の倍率とずらしが、製品の付属情報から読まれているか。Sentinel-2のLevel-2Aの画素の値は、整数で保存されています。反射率に直すには、画素の値にずらしを足し、倍率で割ります。ずらしと倍率は、製品の付属情報に書かれています。4つ目、雲の分類の番号が、公式の表と合っているか。この3つ目と4つ目を、ここから一緒にやってみます。

  - kind: code
    heading: 一緒に：AIのコードを見る
    code: |
      # Sentinel-2 Level-2A の雲を除き、反射率に直す
      scl = read_band(scene, "SCL")
      cloud = (scl == 4) | (scl == 5)      # 雲のつもり
      green = read_band(scene, "B3") / SCALE
      nir = read_band(scene, "B8") / SCALE
      green[cloud] = NODATA
      nir[cloud] = NODATA
    highlight: [3, 4, 5]
    notes:
      - 出てくる番号は 4 と 5
      - ずらしを足していない
      - 動かしても止まらない
      - 公式の表と突き合わせる
    say: ここからは、一緒にやってみましょう。やることは1つ。AIが返したコードに出てくる雲の分類の番号を、公式の表と突き合わせます。手元で数分でできます。用意するのは、AIが返したコードと説明、それからSentinel-2のLevel-2Aのシーン分類の公式の表です。章のページの出典3、SentiWikiのS2 Processingのページにあります。手順は3つ。コードに出てくる番号を書き出す。公式の表で、その番号の意味を見る。AIの説明と比べる。今回AIは、こう説明してきました。シーン分類では4と5が雲なので、これを除きます。反射率は、画素の値を倍率で割るだけで得られます。自信のある口調です。画面がそのコードです。7行で、一見正しく見えます。まず、出てくる番号を書き出します。3行目に、4と5。これを雲として除いています。次に、4行目と5行目。画素の値を、SCALEという倍率で割るだけで、ずらしを足していません。倍率も決め打ちです。ここで大事なことが1つ。このコードは、動かしても止まりません。4も5も実在する番号なので、値が出て、地図も描けます。だから、動いたかどうかでは誤りに気づけません。人が公式の表と突き合わせるしかありません。では、公式のシーン分類の表を開きます。

  - kind: table
    heading: 一緒に：公式の表と比べる
    columns: [番号, 公式の表（Level-2Aのシーン分類）, AIの説明, 判定]
    widths: [0.12, 0.44, 0.22, 0.22]
    rows:
      - [3, 雲の影, （除いていない）, 除くべき]
      - [4, 植物, 雲, 違う]
      - [5, 植物以外の地表, 雲, 違う]
      - [6, 水, （出てこない）, ため池はここ]
      - ["8・9", 雲（確からしさが中と高）, （除いていない）, 除くべき]
      - [10, 薄い雲, （除いていない）, 除くべき]
    say: 公式の表で、3から10の行を見ます。3は、雲の影。AIのコードは除いていません。4は、雲ではなく、植物です。5も、雲ではなく、植物以外の地表です。AIの説明と違います。6は水。ため池の画素は、ここに入ります。8と9が、確からしさが中と高の雲。10が、薄い雲。この3つが、本来除くべき番号ですが、コードは除いていません。つまりこのコードは、雲を残したまま、肝心の地表を除いてしまいます。正しくは、3、8、9、10を除きます。判定が出たので、AIに、3行目の番号を3、8、9、10に直してください、と伝えます。直し方を自分で書く必要はありません。何が違うかを伝えれば十分です。もう1つ、ずらしと倍率も確かめます。公式の資料では、反射率は、画素の値にずらしを足してから、倍率で割った値です。ずらしと倍率は、製品の付属情報に書かれています。ずらしは、処理の版04.00から入り、この版は2022年1月25日以降の観測分に使われています。倍率で割るだけのコードでは、ずらしの分だけ、値が全体に低くなります。ここもAIに、付属情報からずらしと倍率を読んで、足してから割る形に直してください、と伝えます。AIの説明は、番号もずらしも、自信のある口調でした。どちらも、公式資料を開けば1分で確かめられます。確かめずに信じると、地図は描けてしまいます。

  - kind: bullets
    heading: 結果の目視レビュー4つ
    items:
      - 反射率の最小値と最大値：おおむね0から1。最大値が数千なら倍率で割っていない
      - 除いた画素の数：0個なら雲を除く処理が働いていない。ほとんど全部なら番号が逆
      - 答えの分かっている場所：湖が高く、森が低いか。逆なら波長帯が逆
      - 使えた画像の枚数：約2か月に24回の観測で、晴天は8回という例がある
    say: コードを直したら、次は途中の値と地図を目で確かめます。見るのは4つ。1つ目、反射率の最小値と最大値。反射率は、おおむね0から1の間に収まる値です。最大値が数千なら、倍率で割っていません。最小値が負で、ずらしの分だけ全体が低いなら、ずらしを足していません。2つ目、除いた画素の数。0個なら、雲を除く処理が働いていません。ほとんど全部なら、分類の番号が逆です。3つ目、答えの分かっている場所。湖が高く、森が低く出るか。順番が逆なら、緑と近赤外を逆に入れています。指数の符号が反転し、水が低く、植物が高く出ます。地図は色がついて見えますが、湖を先に見れば気づけます。4つ目、使えた画像の枚数。農研機構の資料では、2018年4月から6月の約2か月に24回の観測があり、晴天は8回でした。夏の2か月で使える画像が0枚のため池があっても、不思議ではありません。最後に、言えることと言えないこと。この手順で言えるのは、指示の7項目のとおりにコードが動き、途中の値が妥当で、答えの分かっている場所で予想どおりの値が出た、ことです。候補のため池が実際に干上がっている、とは言えません。候補は、現地で確かめて初めて事実になります。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 目的が決まっていない。「何かを決めるための材料」が書けないと、1行目が埋まらない
      - 答えの分かっている場所がない。試す場所がないと、確かめ方が空欄になる
      - 期間内に使える画像がない。雲の多い季節や地域では、指示が正しくても結果は出ない
      - 有償の商用データを使うとき。7項目は変わらないが、利用条件の確認が加わる
    say: この型が向かない条件も、押さえておきます。1つ目、目的が決まっていないとき。何かを決めるための材料、が書けないと、7項目の1行目が埋まりません。埋まらないまま頼むと、AIが目的を補います。2つ目、答えの分かっている場所がないとき。試す場所がないと、確かめ方の項目が空欄になります。3つ目、期間内に使える画像がないとき。雲の多い季節や地域では、使える画像が0枚のことがあります。指示文が正しくても、結果は出ません。4つ目、有償の商用データを使うとき。7項目は変わりませんが、衛星と処理の段階に、利用条件の確認が加わります。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 7項目を埋めた指示文を書く（人）。1行でも空欄なら、埋まるまで書かない
      - 途中の値を表示させる指示を足す（人）。画像の日付、波長帯、最小と最大、除いた数
      - 答えの分かっている場所で試す（人）。湖が高く、森が低いか。違えば直させる
      - 本番の範囲に広げる（AIと人）。通ったコードで全域を出し、途中の値を記録に残す
    say: 手順をまとめます。1、7項目を埋めた指示文を書く。人の仕事です。1行でも空欄なら、埋まるまで書きません。2、途中の値を表示させる指示を足す。画像の日付、波長帯の番号、反射率の最小値と最大値、除いた画素の数。これも人です。3、答えの分かっている場所で試す。湖が高く、森が低く出るか。違えば、AIに直させて、もう一度試します。4、本番の範囲に広げる。ここはAIと人です。試験に通ったコードで全域を出し、途中の値を記録に残します。この4つを、どの解析でも繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      使った画像: 2025-07-03, 2025-07-18, 2025-08-12
      波長帯: B3 (10 m), B8 (10 m)
      反射率の最小値: 0.00   最大値: 0.61
      雲として除いた画素の数: 0
      湖の指数の中央値: 0.58   森の指数の中央値: -0.42

      問い：この表示から読み取れる、最も大きな問題点はどれか
      A. 緑と近赤外の波長帯が逆に入っている
      B. 反射率への変換で、倍率を掛け忘れている
      C. 雲を除く処理が働いていない
      D. 使った画像が3枚では、少なすぎる
    highlight: [7]
    notes:
      - 答えは動画では言いません
      - 答えと解説はサイトで
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、2025年7月から8月のため池の水の指数を出して、途中の値も表示して、と頼みました。AIが返したコードを動かすと、画面の途中の値が表示されました。使った画像は3枚。波長帯はB3とB8で、どちらも10メートル。反射率の最小値は0.00、最大値は0.61。雲として除いた画素の数は0。湖の指数の中央値は0.58、森は、マイナス0.42。問いは、この表示から読み取れる、最も大きな問題点はどれか、です。選択肢は4つ。A、緑と近赤外の波長帯が逆に入っている。B、反射率への変換で倍率を掛け忘れている。C、雲を除く処理が働いていない。D、使った画像が3枚では少なすぎる。この動画でやった、途中の値で見る4つを思い出して、選んでください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。あいまいな指示を直す問2の短答も、そこにあります。

