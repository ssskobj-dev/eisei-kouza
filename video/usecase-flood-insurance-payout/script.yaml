# ユースケース解説動画の台本。元の記事：casebook/flood-insurance-payout.qmd
title: SAR衛星で水害の保険金を早く払う：被害把握を数週間から約48時間に
series: CASEBOOK
kicker: ユースケース解説
number: 7
total: 221
thumb: 請求を待たず払う
summary: 損害保険会社が、SAR衛星の画像とAIで浸水の範囲と高さを推定し、契約者の所在地と照らして保険金の支払いを早める事例。2017年の実証から水災の支払い判定に使う段階に進み、被害の全容の把握は数週間から約48時間に。業務のどこに入れ、何を決める材料になるか、支払い基準の高さを衛星だけで決められない理由、無償衛星でどこまでできるか、有償画像の概算までを6分で解説します。
scenes:
  - kind: cover
    heading: SAR衛星で水害の保険金を早く払う
    sub: 浸水の範囲と高さを推定し、契約者の所在地と照らす
    say: 大きな水害のあと、契約者からの連絡を待たずに保険金を払う方法はあるか。答えは、雲を通して地面を見られるSAR衛星で浸水した場所を先に見つけ、契約者の住所と照らすことです。損害保険会社がこの方法を2017年の実証から始め、今は水災の支払いの判定に使っています。被害の全容をつかむ時間は、数週間から約48時間になったとされます。この動画では、業務のどこに入れて、何を決める材料にするのか。衛星だけでは決められないことは何か。無償の衛星でどこまでできて、有償の画像を使うといくらかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。損害保険会社の水災の支払い業務
      - 誰が：東京海上日動火災保険と、アビームコンサルティング
      - 何のために：被災した契約者を先に見つけ、請求の案内と支払いを早める
      - 困りごと：被害が広いと、誰が被災したか分からず、連絡がなければ請求を案内できない
    say: 事例の舞台は、日本の損害保険会社の水災の支払い業務です。取り組んだのは、東京海上日動火災保険とアビームコンサルティングで、2017年7月から実証実験を始めました。保険金を早く払うために衛星画像とAIを使う取り組みとして、業界で初めての試みとされています。困りごとはこうです。大きな水害では、査定の担当者や鑑定人が現地を調べ、見積書をもとに金額を決めるので、支払いまでに時間がかかります。しかも、被害が広い範囲に及ぶと、どの契約者が被災したかを把握しにくく、本人から連絡がなければ請求の案内すらできません。そこで、衛星で浸水した場所を先に見つけ、契約者の所在地と照らす使い方をしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-flood-insurance-payout/flow.svg
    caption: 水害の直後に撮影を要請し、契約物件と照らした一覧を作る
    say: 業務の流れを見ます。入る位置は、水害の直後、契約者からの連絡を待つ前です。まず平時に、衛星の撮影を要請できる仕組みと、契約物件の所在地のデータを整えておきます。大きな水害が起きたら、対象の地域のSAR画像の撮影を要請します。画像を解析して、浸水の範囲と高さを推定し、契約物件の所在地と照らして、被災の見込みがある物件の一覧を作ります。最後に、その一覧をもとに、立会の調査が要る物件を振り分け、連絡のない契約者に請求を案内します。実証では、まだ連絡のない契約者に案内をして、保険金を支払えた例があります。

  - kind: figure
    heading: 衛星に任せることと、保険会社が行うこと
    image: figures/usecase-flood-insurance-payout/split.svg
    say: 役割の分担はこうなります。衛星の解析が行うのは、雲や夜でも浸水の広がりを観測することと、浸水の範囲と高さを面で推定することです。雲を通せるSAR画像を主に使い、手に入る光学の画像を加えます。SAR画像は一般に入手しにくいので、指定した時間帯と地域で撮影できる仕組みを作りました。高さの推定には、国土地理院の標高データや、SNSの被災地の情報、過去の支払いの実績も使います。保険会社が行うのは、契約者の所在地と照らすこと、連絡のない契約者に請求を案内すること、そして支払いの可否と金額を決めることです。つまり、衛星が支払いを決めるのではなく、案内する先と見に行く順番を決める道具です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [浸水の範囲の推定図（GISの地図データ）, どの地域の契約者に請求を案内するか]
      - [物件ごとの推定浸水高と誤差の幅, 立会調査に行く物件と、書面で進める物件の振り分け]
      - [支払い基準を超える見込みの物件数, 査定担当者と鑑定人の配置、支払い見込み額の概算]
      - [観測の時刻と、水位のピークとのずれ, 推定を信用してよい地域と、現地確認が要る地域]
    say: 受け取るデータと、それで決められることを整理します。浸水の範囲の推定図は、どの地域の契約者に請求を案内するかの根拠になります。物件ごとの推定浸水高と誤差の幅があれば、立会の調査に行く物件と、書面で進める物件を振り分けられます。支払い基準を超える見込みの物件数からは、査定の担当者と鑑定人の配置や、支払い見込み額の概算を出せます。そして、観測の時刻と水位のピークとのずれは、推定を信用してよい地域と、現地確認が要る地域を分ける材料です。2024年の資料では、地上分解能3メートル以下のSAR画像で、数十平方キロの氾濫の範囲と、建物ごとの浸水高を解析できるとされています。浸水高が支払い基準に近い物件は、衛星の推定だけで決めず、現地確認に回す運用が要ります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-flood-insurance-payout/limits.svg
    say: 限界も、資料にはっきり書かれています。1つ目、支払い基準の高さを衛星だけで決めにくいことです。水災の支払い基準は、地盤面から45センチ以上の浸水、または床上浸水です。範囲だけでなく高さの推定が要り、どのデータを組み合わせれば精度が上がるかを試行錯誤したとあります。2つ目、精度と速さは両立しにくいことです。精度を上げると時間がかかり、速さを上げると精度が下がります。3つ目、光学の画像は雲があると使えません。SARを主にしたのは、このためです。4つ目、水が引く前に撮る必要があります。浸水は数時間で引くことがあり、衛星が通る時刻に合わなければ、最大の浸水を捉えられません。5つ目、衛星だけでは足りないことです。2024年の資料は、SNS、地形や水位のデータ、洪水のシミュレーション、機械学習との組み合わせが必要だとしています。なお、短縮できた日数や推定の精度の数字は、国の事例集には書かれていません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-1は無償のSAR衛星。浸水の範囲の抽出はできる
      - 観測の周期は1機あたり12日。撮る時刻と場所を選べない
      - 水が引く前に撮れるとは限らず、支払いの初動には向かない
      - 支払い業務に使うなら、撮影の時刻を指定できる商用SARが前提
    say: では、無償の衛星でどこまでできるでしょうか。欧州のSentinel-1は無償のSAR衛星で、浸水の範囲の抽出はできます。ただし、観測の周期は1機あたり12日で、撮る時刻と場所をこちらで選ぶことはできません。浸水は数時間で引くことがあるので、水が引く前に撮れるとは限りません。過去の水害を振り返る用途には使えますが、支払い業務の初動に使うなら、撮影の時刻を指定できる商用のSARを前提に費用を見ます。この事例でも、指定した時間帯と地域で撮影できる仕組みを作っています。

  - kind: table
    heading: 有償の画像を使うと、いくらか（概算）
    columns: [項目, 仮定と計算]
    widths: [0.3, 0.7]
    rows:
      - [この事例の費用, 非公開。国の事例集にも2024年の資料にも金額の記載はない]
      - [画像の公開価格, "商用SARの例（Umbra社の価格ページ、2025年12月更新）：5km四方、分解能1.0mの1回の撮像が675米ドルから"]
      - [範囲と回数, "仮定：市街地の約100km²を、5km四方の撮像4枚で2回撮る"]
      - [画像代, "675ドル × 4枚 × 2回 ＝ 5,400ドル。撮像が重ならず、追加の条件がない前提"]
      - [別にかかるもの, 解析のモデルの開発と災害ごとの解析の委託、契約データとの照合のシステム、平時の撮影の手配と現地確認]
    say: 有償の画像を使う場合の概算です。これは仮定を置いた計算で、見積もりではありません。この事例の費用は公開されていません。参考として、商用SARの公開価格の例を挙げます。5キロ四方、分解能1メートルの1回の撮像が、675米ドルからという掲載値があります。2025年12月に更新された価格ページの値です。市街地の約100平方キロを、5キロ四方の撮像4枚で2回撮ると仮定すると、画像代は5,400ドルになります。撮像が重ならず、追加の条件がない前提です。これとは別に、浸水の範囲と高さを推定するモデルの開発、災害ごとの解析の委託、契約データと照らすシステム、平時の撮影の手配と現地確認の費用がかかります。価格は変わるので、実際の金額は必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [水害の規模, 広く浸水し、契約者の把握が追いつかない, 局地的で、職員が回れる]
      - [浸水の続く時間, 日単位で水が残る, 数時間で引く]
      - [決めたいこと, 請求を案内する先、立会の優先順位, 支払い基準ぎりぎりの高さの確定]
      - [準備, 契約物件の座標と撮影の手配が整っている, 住所の表記が不ぞろいで照合できない]
      - [体制, 現地確認と組み合わせる, 衛星の推定だけで支払いを決めたい]
    say: 最後に、向き不向きです。向いているのは、広い範囲が浸水して契約者の把握が追いつかず、日単位で水が残る水害です。決めたいことが、請求を案内する先と立会の優先順位であること、契約物件の座標と撮影の手配が整っていること、現地確認と組み合わせる体制があることも条件です。逆に、局地的で職員が回れる、数時間で水が引く、支払い基準ぎりぎりの高さを確定したい、住所の表記が不ぞろいで照合できない、衛星の推定だけで支払いを決めたい、という場合は向きません。提案するときの要点は3つです。最初に、契約物件の位置データの状態を聞くこと。衛星で支払いが決まる、とは言わないこと。そして、災害の直後に撮る仕組みと、その費用を提案に含めることです。

  - kind: cta
    heading: 自社の業務で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：内閣官房 国土強靱化推進室「国土強靱化 民間の取組事例集」（令和2年）021 https://www.cas.go.jp/jp/seisaku/kokudo_kyoujinka/r2_minkan/pdf/021.pdf"
      - "出典：アビームコンサルティング「人工衛星を使った災害検知、保険金支払いの高度化への挑戦」（2024年3月18日、JAXA conseo 掲載）"
      - "　　　https://earth.jaxa.jp/conseo/news/20240402-2/community_document_4.pdf"
      - "価格：Umbra「Pricing」（2025年12月19日更新） https://umbra.space/pricing/"
      - "衛星の仕様：Copernicus SentiWiki「Sentinel-1 Mission」"
    say: この事例をもとに、自社の業務や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
