lang: en
voice: Ryan
title: "The satellite data market: who's who"
series: MARKET
kicker: Market report
thumb: Players in orbit
summary: The main overseas players in the satellite data market, sorted by the three roles - who collects and sells the data, who turns it into answers, and who buys. With named companies in each role, how to read the headline revenue and backlog numbers, and what a consultant should take from it. About 6 minutes.
scenes:
  - kind: cover
    heading: "The satellite data market: who's who"
    sub: Who sells the data, who turns it into answers, and who buys
    say: Who actually makes money in the satellite data market, and which companies will a consultant meet? The market has three roles. Some companies collect and sell the data. Others turn that data into answers. And then there are the buyers - and overseas, the largest buyers are national governments and defence agencies. In this report we name the main players in each role, show how the market is organised, how to read the headline numbers, and what a consultant should take from it.

  - kind: bullets
    heading: What this report covers
    items:
      - "The three roles: who sells data, who turns it into answers, who buys"
      - The main overseas players in each role, grouped by what they do
      - How to read the headline numbers, and what a consultant should take away
    say: Here is what this report covers. First, the three roles in the market - the companies that sell the data, the companies that turn it into answers, and the buyers. Second, the main overseas players in each role, grouped by what they actually do. And third, how to read the headline revenue and backlog numbers you will see quoted, and what a consultant should take away from all of it.

  - kind: bullets
    heading: Who collects and sells the data
    items:
      - "High-resolution optical: Vantor, formerly Maxar, and Airbus"
      - "Small optical constellations imaging often: Planet, BlackSky, Satellogic"
      - "Radar, or SAR - sees at night and through cloud: ICEYE, Capella, Umbra"
      - "Newer sensors: Pixxel for hyperspectral, GHGSat for methane, HawkEye 360 for radio"
    say: Start with the companies that collect and sell the raw data. The clearest way to sort them is by their sensor. First, high-resolution optical - the sharpest pictures from large satellites - led by Vantor, which was called Maxar until October 2025, and by Airbus in Europe. Second, small optical constellations that trade a little sharpness for frequent revisits, such as Planet, BlackSky and Satellogic. Third, radar, or synthetic aperture radar, which sees at night and straight through cloud - here Finland's ICEYE leads, alongside Capella and Umbra in the United States. And fourth, newer sensors that measure what the eye cannot see - Pixxel for hyperspectral, GHGSat for methane, and HawkEye 360 for radio signals.

  - kind: bullets
    heading: Who turns the data into answers
    items:
      - An end user wants an answer, not an image - that work happens downstream
      - "Cloud and GIS platforms: Google Earth Engine, Esri, Microsoft Planetary Computer"
      - "Marketplaces that resell many operators' imagery: UP42, SkyFi"
      - Specialist analytics firms that package data for one industry
    say: The second role is turning that data into answers. This matters because an end user - an insurer, a utility, a city - wants to know how many buildings flooded, not to own a radar image. So a whole layer of companies sits downstream. There are cloud and mapping platforms, such as Google Earth Engine, Esri and Microsoft's Planetary Computer, where the data is stored and analysed. There are marketplaces, such as UP42 and SkyFi, that let you search and order imagery from many operators in one place. And there are specialist analytics firms that package the data for a single industry. The company that sells the pixels and the company that delivers the answer are usually not the same.

  - kind: bullets
    heading: Who buys
    items:
      - Overseas, defence and national governments are the largest buyers
      - "'Sovereign' demand - countries want their own satellites or capacity"
      - In August 2026 the US NRO awarded radar contracts to Capella, ICEYE US and Umbra
      - "Commercial buyers - insurance, agriculture, infrastructure - are smaller but growing"
    say: The third role is the buyers, and this is where overseas markets differ most from the picture people expect. The growth is driven by defence and national governments, not by private companies. One concrete example is August 2026, when the United States National Reconnaissance Office awarded radar contracts to Capella, ICEYE's US arm and Umbra - and that followed an evaluation phase that began back in 2022, so this is operational procurement, not a pilot. Alongside this runs what the industry calls sovereign demand, where governments want their own satellites or guaranteed capacity rather than depending on another country. Commercial buyers in insurance, agriculture and infrastructure are real, but today they are smaller and growing more slowly.

  - kind: table
    heading: How to read the headline numbers
    columns: ["The headline number", "What it does not mean"]
    widths: [0.5, 0.5]
    rows:
      - ["Planet: revenue USD 308M, backlog USD 900M, FY2026", "The largest listed EO company, but still a small industry"]
      - ["ICEYE: over EUR 250M revenue, EUR 1.5bn backlog, 2025", "Unaudited, and ICEYE is private, so these are its own figures"]
      - ["'World's largest SAR constellation'", "A company's own claim; satellite counts mix launched and on-orbit"]
      - ["Maxar is now Vantor, since October 2025", "Names and owners change fast - always check the date"]
    say: Now, how to read the numbers without being misled. Planet is the listed Earth-observation company with the largest revenue - about three hundred and eight million dollars in the year to January 2026, with a backlog near nine hundred million. But the word largest hides how small this industry still is. ICEYE reports over two hundred and fifty million euros of revenue for 2025 and a backlog of one and a half billion euros - though those figures are unaudited, and because ICEYE is private, they are the company's own numbers, not an audited filing. When a company says it runs the world's largest radar constellation, that is its own claim, and satellite counts often mix the number launched with the number still working in orbit. And names change fast - Maxar became Vantor in October 2025, so always check the date on any source.

  - kind: bullets
    heading: What a consultant should take from this
    items:
      - No single company covers everything - match the player to the client's question
      - Who sells the pixels and who gives the answer are usually different firms
      - Growth is driven by government demand; do not read it as the commercial market
      - Check the date - names, owners and satellite counts change within months
    say: So what should a consultant take from this? First, no single company does everything well, so the job is to match the right player to the client's actual question, not to pick a favourite vendor. Second, remember that the company selling the pixels and the company giving the answer are usually different firms - decide which one the client really needs. Third, the headline growth is driven by defence and government demand, so do not quote it to a client as the size of the commercial market. And fourth, because names, owners and satellite counts change within months, every figure in a proposal needs a date and a source next to it.

