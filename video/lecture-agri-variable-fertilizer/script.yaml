# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第2部「可変施肥：生育ムラを追肥に反映する」（learn/agri/agri-variable-fertilizer.qmd）
title: 衛星データで可変施肥：小麦の収量6〜18%増に要る3つの条件
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 5
total: 30
thumb: 施肥マップの条件
summary: 衛星の生育マップは、そのままでは施肥マップになりません。十勝農業試験場の試験で秋まき小麦の製品収量が6〜18%増えた条件と、施肥マップ・対応農機・作業時期に間に合う画像の3つの準備、撮影日と作業日のずれをカレンダーで逆算する方法を、一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 可変施肥：生育ムラを追肥に反映する
    sub: 衛星の生育マップを、施肥マップにする3つの条件
    say: 衛星の生育マップがあれば、そのまま農機に入れて、場所ごとに肥料の量を変えて撒けるでしょうか。答えは、そのままでは撒けません。十勝農業試験場の試験では、前年までの衛星のマップをもとに秋まき小麦の追肥の量を変え、製品収量が6から18パーセント増えました。ただし、そこには施肥マップ、対応農機、作業時期に間に合う画像、という3つの条件がそろっていました。この動画では、その3つの条件と、営農指導員が農家に説明する順番を、章の内容に沿って見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 可変施肥に必要な3つのもの（施肥マップ、対応農機、作業時期に間に合う画像）を、農家に説明できる
      - 衛星の生育マップから施肥マップを作るときに、衛星が決めることと人が決めることを分けられる
      - 自分の管内の作物、圃場、農機が、衛星を使った可変施肥に向くかどうかを判定できる
    say: この章を終えると、3つのことができるようになります。可変施肥に必要な3つのもの、施肥マップ、対応農機、作業時期に間に合う画像を、農家に説明できること。衛星の生育マップから施肥マップを作るときに、衛星が決めることと人が決めることを分けられること。そして、自分の管内の作物、圃場、農機が、衛星を使った可変施肥に向くかどうかを判定できることです。

  - kind: figure
    heading: 結論：衛星と、人と農機の分担
    image: figures/agri-variable-fertilizer/conclusion.svg
    say: 先に結論です。衛星に任せられるのは、圃場の中と圃場の間の、生育の濃い薄いを地図にすること、前年までのムラの傾向を見ること、晴れた日ごとに更新することです。人と農機が行うのは、ムラの原因を見分けること、基準の施肥量と増減の幅を決めること、マップを農機に入れて撒くこと、散布のあとに画像と収量で確かめることです。衛星が出すのはムラの地図で、施肥量を決めるのも撒くのも、人と農機です。

  - kind: bullets
    heading: 現場が欲しい成果
    lead: 農家が欲しいのは、ムラを揃えることと、肥料を減らすことの2つ
    items:
      - 国の実証プロジェクト217地区のうち、可変施肥などに取り組んだのは61地区（28%）
      - ムラを地図にする手段は、ドローン39地区（64%）、収量コンバイン21地区（34%）、人工衛星10地区（16%）
      - 衛星は少数派。だからこそ、どんな条件なら衛星で足りるかを知っておく
    say: 可変施肥は、圃場の中や圃場の間の生育や収量のムラをつかみ、場所ごとに肥料の量を変える技術です。農家が欲しいのは、ムラを揃えることと、肥料を減らすことの2つです。農林水産省のスマート農業実証プロジェクトでは、217地区のうち61地区、28パーセントが可変施肥などに取り組みました。ムラを地図にする手段は、ドローンが39地区で64パーセント、収量コンバインが21地区で34パーセント、人工衛星は10地区で16パーセントです。衛星は少数派です。だからこそ、どんな条件なら衛星で足りるのかを知っておく価値があります。

  - kind: figure
    heading: 効く2つの強み
    image: figures/agri-variable-fertilizer/strengths.svg
    caption: 見えないものが見える、広く見られる
    say: この用途で効く強みは2つです。1つ目、見えないものが見える。葉が赤い光と近赤外の光をどう反射するかの差から計算する正規化植生指数、NDVIは、生育量の目安になります。十勝農業試験場は、前年以前の衛星のNDVIマップで圃場の中のばらつきをつかみ、圃場の平均を100とした生育相対値で、秋まき小麦の起生期の追肥の量を変えました。北海道の美瑛町では、小麦の衛星のマップをもとに窒素の量を加減する施肥が、令和3年に6戸で行われています。2つ目、広く見られる。無償の光学衛星Sentinel-2は、1回の観測で290キロメートルの幅を撮り、画像の細かさは10メートルです。十勝農業試験場のマニュアルは、約20キロメートル四方の地域が1枚に入ることを条件に、地域の全圃場を同じ基準で比べる方法を示しています。カタログに載る事業者の資料では、2023年に可変施肥マップを使ったのは約170名、約2,800ヘクタールでした。

  - kind: figure
    heading: 5つの限界
    image: figures/agri-variable-fertilizer/limits.svg
    say: 公的な試験の結果から、限界は5つあります。1つ目、施肥量は衛星からは出ない。衛星が出すのは生育の濃い薄いで、何キログラム増やすかは人が決めます。十勝農業試験場は、NDVIの変動10パーセントにつき窒素2キログラム・10アールあたりで増減しましたが、この割合は地域と作物の試験から決めたもので、別の作物には持ち込めません。2つ目、対応農機がないと撒けない。カタログに載る事業者の2022年末のアンケートでは、自動で可変施肥ができたと答えた個人農家は30パーセントでした。3つ目、撮影日と作業日がずれる。次の場面で詳しく見ます。4つ目、筆の中の細かいムラは苦手。10メートルの画素では、1筆の中の数メートルの違いは見えません。栃木県の現地試験では、衛星のゾーン分けと現地の生育量に相関が見られませんでした。5つ目、効果は年と圃場で違う。6から18パーセントの増収は、各年1圃場、計3圃場、3年の結果で、効果が大きかったのは登熟不良の年と穂数が過剰気味の年でした。

  - kind: figure
    heading: 撮影日と作業日のずれ
    image: figures/agri-variable-fertilizer/timeline.svg
    caption: 撮影から散布までの日数が、追肥の適期に収まるか
    say: 限界の3つ目、撮影日と作業日のずれです。光学の衛星は晴れた日しか撮れず、撮った画像は配信までに日数がかかります。栃木県の現地試験では、衛星データの取得日が調査日より3日から8日遅れました。カタログに載る事業者の資料では、生育マップは快晴時の撮影の翌日から数日後に配信されます。美瑛町では、令和4年に4戸が曇雨天のため、衛星画像を使った施肥ができませんでした。十勝農業試験場のマニュアルは、起生期の画像は3月下旬の融雪後から4月中下旬の追肥前に撮り、雲や雪のかかった画像と、凍結する時期の早朝の画像は使えないとしています。追肥の適期は数日から1週間ほどしかありません。その間に、晴れて、配信され、マップを作り、農機に入れるまでが必要です。

  - kind: figure
    heading: 落とし所：5つの手順と、誰が行うか
    image: figures/agri-variable-fertilizer/flow.svg
    caption: 基肥は前年までのマップで、追肥は当年の画像で
    say: 落とし所です。手順は5つです。1、前年までの衛星のマップで、圃場の中のムラが毎年同じ場所に出るかを見る。十勝農業試験場は、生育の良し悪しの場所が毎年同じ傾向なら、前年までのマップを起生期の可変追肥に使えるとしています。前年までのマップなら、撮影日と作業日のずれは問題になりません。2、ムラの原因を現地で見分ける。地力なら施肥で、水や病害虫なら別の対策です。3、基準の施肥量は慣行どおりにし、増減の幅は小さく決める。4、マップを農機の形式に変換して入れ、撒く。農機を持たない農家は委託します。5、散布の3週間後の画像と、収穫時の収量やタンパクで確かめる。美瑛町では施肥3週間後の生育の図で効果を見ています。もう1つ。絶対値ではなく相対値で増減します。NDVIが0.6だから何キログラム、ではなく、圃場の平均を100とした相対値で、低い場所を増やし、高い場所を減らします。

  - kind: table
    heading: 向き不向き
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [ムラの出方, 毎年同じ場所に出る（地力）, 年ごとに変わる（水、病害虫）]
      - [圃場の大きさ, 大区画で、筆の中に10m以上の違いがある, 小さい筆。筆の中の数mの違い]
      - [対応農機, 対応した農機を持つ、または委託できる, 農機がなく、委託先もない]
      - [使う画像, 前年までのマップ、適期の前に撮れた画像, 当年の画像を待たないと決められない]
      - [作物と時期, 秋まき小麦の起生期、水稲の基肥, 草丈の低い作物（玉ねぎなど）]
      - [確かめ方, 散布後の画像と収量で見る, 撒いて終わり]
    say: 向き不向きを表にまとめます。ムラの出方は、毎年同じ場所に出る地力のムラなら向き、水や病害虫で年ごとに変わるなら向きません。圃場は、大区画で筆の中に10メートル以上の違いがあるなら向き、小さい筆の数メートルの違いは見えません。対応農機は、持っているか委託できるなら向き、どちらもなければ向きません。使う画像は、前年までのマップや適期の前に撮れた画像なら向き、当年の画像を待たないと決められないなら向きません。作物は、秋まき小麦の起生期と水稲の基肥が向き、玉ねぎのような草丈の低い作物は向きません。そして、撒いて終わりにせず、散布後の画像と収量で確かめます。向いていないが多い場合は、圃場の間で追肥の有無を分ける使い方か、ドローンや車載センサでの可変施肥を考えます。

  - kind: figure
    heading: 費用を3つに分ける
    image: figures/agri-variable-fertilizer/cost.svg
    say: 始め方と費用です。最初の一歩は、対応農機を持つ農家1、2戸で、前年のマップから始めることです。費用は3つに分けて考えます。データと配信は、無償の衛星を自分で扱うか、事業者の配信を使うか。料金は面積に応じた年額の形で時点により変わるので、最新の条件は事業者に確かめます。対応農機は、持つか、委託するか。公開の例として、東北農業研究センターの収量マップによる基肥の可変施肥では、2016年の追加費用が10アールあたり3,440円、増収による効果が10アールあたり11,500円でした。宮城県の1地点、米価1キログラム180円の想定で、衛星ではなく収量コンバインの例です。マップの作成と設定の時間は、ソフトの選定、形式の変換、現地の確認にかかる時間です。愛知県の実証では、農家は画像の解析の手間を負担に感じました。委託の公開の例では、茨城県の法人がドローンで撮り、無人ヘリで可変追肥した外注費用が、2020年に10アールあたり3,575円でした。撮影から追肥まで13日の間があり、撮ってから撒くまでの日数の目安になります。

  - kind: steps
    heading: 一緒にやってみよう：カレンダーで逆算する
    items:
      - 自分の管内の作物を1つ選び、追肥の適期をカレンダーに書く（数日から1週間）
      - 適期の終わりから、農機に入れて撒くまでの日数を自分で見積もって、さかのぼる
      - さらに、マップを作る日数と、配信までの日数（翌日から数日。栃木県の試験では3〜8日遅れ）をさかのぼる
      - 残った日が「晴れが要る日」。その時期に晴れが続く年がどれだけあるか、記憶と記録で確かめる
      - 間に合わなかったときの決め方（慣行の量で撒く）を、先に1行で書いておく
    say: ここからは、一緒にやってみましょう。章の限界の3つ目、撮影日と作業日のずれを、手元のカレンダーで逆算します。数分でできます。まず、自分の管内の作物を1つ選び、追肥の適期をカレンダーに書きます。適期は数日から1週間ほどです。次に、適期の終わりの日から、マップを農機に入れて撒くまでに自分たちで何日かかるかを見積もり、さかのぼります。さらに、マップを作る日数と、配信までの日数をさかのぼります。配信は撮影の翌日から数日後、栃木県の試験では取得が3日から8日遅れました。残った日が、晴れが要る日です。その時期に晴れが続く年が、過去にどれだけあったかを、記憶と記録で確かめます。最後に、間に合わなかったときの決め方を、先に1行で書いておきます。慣行の量で撒く、です。美瑛町では令和4年に4戸が曇雨天で実施できませんでした。間に合わない年は、必ずあります。

  - kind: prompt
    heading: 紙に書く型
    label: 記入の型
    text: |
      作物と追肥：秋まき小麦、起生期の追肥　　適期：○月○日〜○月○日

      逆算（適期の終わりから、さかのぼる）
      　農機に入れて撒く　　：○日　←自分たちの見積もり
      　マップを作る　　　　：○日　←自分たちの見積もり
      　配信まで　　　　　　：翌日〜数日（試験では3〜8日遅れ）
      　→ 晴れが要る日：○月○日ごろ

      判定：この時期に晴れが続く年は多い → 当年の画像で試せる
      　　　少ない → 前年までのマップで、ムラが毎年同じ圃場から
      間に合わないとき：慣行の量で撒く
    say: 紙に、この型を書いてみてください。上に、作物と追肥の種類、適期の日付を書きます。十勝農業試験場のマニュアルでは、起生期の画像は3月下旬から4月中下旬です。その下に、逆算を書きます。農機に入れて撒く日数と、マップを作る日数は、自分たちの見積もりです。配信までの日数は、翌日から数日、試験では3日から8日の遅れでした。足し合わせると、晴れが要る日が出ます。判定は2つに分かれます。この時期に晴れが続く年が多ければ、当年の画像で試せます。少なければ、前年までのマップで、ムラが毎年同じ圃場から始めます。一番下に、間に合わないときの決め方を書きます。今日は日数の欄が空欄でも構いません。どの日数を誰に聞けばよいかが分かることが、最初の一歩です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 前年までのマップで、ムラが毎年同じ場所に出る圃場を選ぶ
      - ムラの原因を現地で見分ける。地力なら施肥、水や病害虫なら別の対策
      - 基準の量は慣行どおり、増減の幅は小さく。相対値で増減する
      - マップを農機の形式に変換して入れ、撒く。農機がなければ委託する
      - 散布の3週間後の画像と、収穫時の収量やタンパクで確かめる
      - 当年の画像は、カレンダーの逆算で間に合うときだけ使う
    say: 手順をまとめます。1、前年までのマップで、ムラが毎年同じ場所に出る圃場を選ぶ。2、ムラの原因を現地で見分ける。地力なら施肥、水や病害虫なら別の対策です。3、基準の量は慣行どおりにし、増減の幅は小さく、相対値で増減する。4、マップを農機の形式に変換して入れ、撒く。農機がなければ委託する。5、散布の3週間後の画像と、収穫時の収量やタンパクで確かめる。6、当年の画像は、カレンダーの逆算で間に合うときだけ使う。衛星が出すのはムラの地図で、量を決めるのも撒くのも、人と農機です。

  - kind: bullets
    heading: 宿題：事業者に最初に確認すべきこと
    bold: true
    items:
      - 場面：農業法人が衛星の生育マップの配信を契約し、小麦の起生期の追肥を圃場の中で変えたい。ブロードキャスタは10年前の機種で、位置情報と連動する機能はない
      - A. 配信されるマップを法人の農機が読める形式に変換できるか。できなければ、散布を委託できる先があるか
      - B. 衛星の画像の細かさが1m以下かどうか
      - C. 施肥マップに、何kg増やすかの数字が自動で入るか
      - D. 衛星が毎日撮影しているか
    say: 宿題です。ある農業法人が、衛星の生育マップを配信するサービスを契約し、小麦の起生期の追肥を圃場の中で変えたいと考えています。法人のブロードキャスタは10年前の機種で、位置情報と連動する機能はありません。営農指導員として、事業者に最初に確認すべきことはどれでしょうか。A、配信される施肥マップを、法人の農機が読める形式に変換できるか。できない場合、散布を委託できる先があるか。B、衛星の画像の細かさが1メートル以下かどうか。C、施肥マップに、何キログラム増やすかの数字が自動で入るか。D、衛星が毎日撮影しているか。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに2問あります。

  - kind: cta
    heading: カレンダーの逆算を書いたら、章のページへ
    action: 5つの限界の出典と、向き不向きの表、ケース問題3問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-variable-fertilizer.html
