# 日本語の合成音声（VOICEVOX）に渡す前の読み替え。字幕と画面の文字は元のまま。
#
# 使い方：
#   - from: 元の文字列   to: 読み（ひらがな・カタカナ）
#   - regex: true を付けると from を正規表現として扱う（to の中で \1 などが使える）
#   - 長い from から順に置き換える（「真値」は「値」より先に当たる）
#   - 台本（script.yaml）にも readings: を書けば、その動画だけの読み替えを足せる（この表より先に当たる）
#
# 足すとき：動画を聞いて読み違いを見つけたら、ここに1行足す。
# 2つ以上の読み方がある漢字は、助詞との組み合わせで狙いを絞る（例：「後を」→「あとを」。「災害後の」は「ご」のまま）。

readings:
  # ---- 英字・記号（略語は1文字ずつ、単位は日本語で）
  - {from: "Satellite to Decision", to: "サテライトトゥーディシジョン"}
  - {from: "Sentinel-1", to: "センチネルワン"}
  - {from: "Sentinel-2", to: "センチネルツー"}
  - {from: "Sentinel", to: "センチネル"}
  - {from: "Landsat", to: "ランドサット"}
  - {from: "InSAR", to: "インサー"}
  - {from: "SAR", to: "サー"}
  - {from: "NDVI", to: "エヌディーブイアイ"}
  - {from: "NDWI", to: "エヌディーダブリューアイ"}
  - {from: "NBR", to: "エヌビーアール"}
  - {from: "GNSS", to: "ジーエヌエスエス"}
  - {from: "GIS", to: "ジーアイエス"}
  - {from: "RFP", to: "アールエフピー"}
  - {from: "QR", to: "キューアール"}
  - {from: "API", to: "エーピーアイ"}
  - {from: "AI", to: "エーアイ"}
  - {from: "CSV", to: "シーエスブイ"}
  - {from: "PDF", to: "ピーディーエフ"}
  - {from: "JAXA", to: "ジャクサ"}
  - {from: "ESA", to: "イーサ"}
  - {from: "NASA", to: "ナサ"}
  - {from: "USGS", to: "ユーエスジーエス"}
  - {from: "EU", to: "イーユー"}
  - {from: "YouTube", to: "ユーチューブ"}
  - {from: "Python", to: "パイソン"}
  - {from: "Lバンド", to: "エルバンド"}
  - {from: "Cバンド", to: "シーバンド"}
  - {from: "Xバンド", to: "エックスバンド"}
  - {from: "ASTER", to: "アスター"}
  - {from: "JOGMEC", to: "ジョグメック"}
  - {from: "Terra", to: "テラ"}
  - {from: "eMAFF", to: "イーマフ"}
  - {from: "UN-SPIDER", to: "ユーエヌ スパイダー"}
  - {from: "GFM", to: "ジーエフエム"}
  - {from: "IW GRD", to: "アイダブリュー ジーアールディー"}
  - {from: "GRD", to: "ジーアールディー"}
  - {from: "SLC", to: "エスエルシー"}
  - {from: "RTC", to: "アールティーシー"}
  - {from: "DEM", to: "ディーイーエム"}
  - {from: "HAND", to: "ハンド"}
  - {from: "NESZ", to: "エヌイーエスゼット"}
  - {from: "Level-1", to: "レベルワン"}
  - {from: "Level-2", to: "レベルツー"}
  - {from: "L1C", to: "エルワンシー"}
  - {from: "L2A", to: "エルツーエー"}
  - {from: "VV", to: "ブイブイ"}
  - {from: "VH", to: "ブイエイチ"}
  - {from: "HH", to: "エイチエイチ"}
  - {from: "HV", to: "エイチブイ"}
  - {from: "σ0", to: "シグマゼロ"}
  - {from: "σ", to: "シグマ"}
  - {from: "dB", to: "デシベル"}
  - {from: "log10", to: "ログじゅう"}
  - {from: "GHz", to: "ギガヘルツ"}
  - {from: "MHz", to: "メガヘルツ"}
  - {from: "km²", to: "へいほうキロメートル"}
  - {from: "m²", to: "へいほうメートル"}
  - {from: "km", to: "キロメートル"}
  - {from: "mm", to: "ミリメートル"}
  - {from: "cm", to: "センチメートル"}
  - {from: "m級", to: "メートル級"}
  - {from: '(\d)ha(?![A-Za-z])', to: '\1ヘクタール', regex: true}
  - {from: '(\d)m(?![A-Za-z²])', to: '\1メートル', regex: true}
  - {from: '(\d)×(\d)', to: '\1かける\2', regex: true}
  - {from: '(\d)[%％]', to: '\1パーセント', regex: true}

  # ---- 専門用語（辞書に無い、または別の読みになりやすい）
  - {from: "短波長赤外", to: "たんはちょうせきがい"}
  - {from: "近赤外", to: "きんせきがい"}
  - {from: "赤外", to: "せきがい"}
  - {from: "帯域", to: "たいいき"}
  - {from: "反射率", to: "はんしゃりつ"}
  - {from: "正規化", to: "せいきか"}
  - {from: "裸地", to: "らち"}
  - {from: "湛水", to: "たんすい"}
  - {from: "植生", to: "しょくせい"}
  - {from: "畦", to: "あぜ"}
  - {from: "畝", to: "うね"}

  # ---- 読み方が2つ以上ある漢字（助詞との組み合わせで絞る）
  # 後：「あと」（後を前で割る）。漢字の直後の「後」（災害後、前後、直後、最後）は「ご」のまま
  - {from: '(?<![\u4e00-\u9fff])後(?=[のをはでにと、])', to: 'あと', regex: true}
  # 値：「あたい」（基準の値）。「真値」「数値」「価値」は除く
  - {from: "真値", to: "しんち"}
  - {from: '(?<![真数価])値(?=[をにでがのとは、。])', to: 'あたい', regex: true}
  # 数：「かず」（画素の数、月の数）
  - {from: 'の数(?=[をがはにでと、。])', to: 'のかず', regex: true}
  - {from: "暗い月", to: "くらいつき"}
  - {from: "水のある月", to: "みずのあるつき"}
  # 表：「ひょう」（表を開く、表に出す）。「表面」「表示」「図表」は除く
  - {from: '(?<![表発代図公])表(?=[をにでがのとへ、。])', to: 'ひょう', regex: true}
  # 人：「ひと」（人です、人が決める）。「法人」「本人」などは除く
  - {from: '(?<![\u4e00-\u9fff])人(?=です|が決め|が確か|と衛星|とAI)', to: 'ひと', regex: true}
  - {from: "（人）", to: "（ひと）"}
  # 分の：「ぶんの」（10分の1）。「10分」を「じゅっぷん」と読ませない
  - {from: '(\d)分の', to: '\1ぶんの', regex: true}
  # 行：「ぎょう」（2行目、2行以内）
  - {from: '(\d)行', to: '\1ぎょう', regex: true}
  # 縁・角・帯・粒：地図の見方で使う語
  - {from: '縁(?=[をにがはの、。])', to: 'ふち', regex: true}
  - {from: '(?<![三四直方視])角(?=[をにでがはの、。])', to: 'かど', regex: true}
  - {from: '(?<![地時熱寒温一])帯(?=[やでにをがは、。])', to: 'おび', regex: true}
  - {from: '粒(?=[をにがはで、。])', to: 'つぶ', regex: true}
  # 軌道の向き
  - {from: "降交", to: "こうこう"}
  - {from: "昇交", to: "しょうこう"}
  - {from: "上りと下り", to: "のぼりとくだり"}
  - {from: "上り", to: "のぼり"}
  - {from: "下り", to: "くだり"}
  # 専門用語で辞書に無いか、別の読みになりやすいもの
  - {from: "偏波", to: "へんぱ"}
  - {from: "較正", to: "こうせい"}
  - {from: "盛土", to: "もりど"}
  - {from: "緑被率", to: "りょくひりつ"}
  - {from: "材積", to: "ざいせき"}
  - {from: '(\d)時期', to: '\1じき', regex: true}
