# ユースケース解説動画の台本。元の記事：casebook/city-planning-landuse-survey.qmd
title: 衛星データで都市計画基礎調査の現地調査を絞る：国の実施要領が補助資料と明記
series: CASEBOOK
kicker: ユースケース解説
number: 80
total: 221
thumb: 現地調査を絞る
summary: 都道府県と市町村の都市計画課が、おおむね5年ごとの都市計画基礎調査の土地利用現況調査で、前回から変わった疑いのある区画を衛星画像で先に拾い、現地調査に行く区画を絞る使い方。国土交通省の令和5年の実施要領に「調査の補助資料」として書かれた位置づけ、業務のどこに入れて何を決める材料になるか、精度の数字がないことや建物の用途は上からでは分からないという限界、費用がかかる4つの所までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで都市計画の現地調査を絞る
    sub: 国の実施要領が「調査の補助資料」と明記。先に見る区画を決める
    say: おおむね5年ごとの都市計画基礎調査で、土地利用の現地調査を全区画で行わずに済む方法はあるか。答えは、前回から変わった疑いのある区画を衛星画像で先に拾い、現地に行く区画を絞ることです。国土交通省は令和5年の実施要領で、衛星画像を調査の補助資料として使うと現地調査の省力化が期待できる、と書いています。この動画では、都市計画課が業務のどこに入れて、何を決める材料にするのか。2026年時点の限界と、無償の衛星で成り立つのか、費用はどこにかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。特定の自治体の実証ではなく、国の制度の側から広がる使い方
      - 誰が：都道府県と市町村の都市計画課。受託する建設コンサルタント
      - 何のために：都市計画法第6条の基礎調査で、敷地ごとの土地利用の現況を調べる
      - 困りごと：現地調査による現況確認が望ましいとされ、全区画を回る負担が大きい
    say: 事例の舞台は日本です。ただし、特定の自治体の実証ではありません。国の制度の側から広がっている使い方です。使うのは、都道府県と市町村の都市計画課、そして基礎調査を受託する建設コンサルタントです。目的は、都市計画法第6条にもとづく都市計画基礎調査で、敷地ごとに位置、用途、面積、低未利用土地を集める、土地利用現況の調査です。実施要領は、現地調査、空中写真、固定資産課税台帳、登記簿、住宅地図などから収集するとし、現地調査による現況確認が望ましいとしています。困りごとは、都市計画区域の全区画を回る負担です。そこで、空中写真や台帳のデータで前回調査からの変化箇所を一次判定し、現地調査を省力化する考え方があり、衛星画像はその一次判定の材料の1つとして、要領の留意事項に書かれています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-city-planning-landuse-survey/flow.svg
    caption: 現地調査の前に、衛星の一次判定を入れる
    say: 業務の流れを見ます。入る位置は、現地調査の前です。まず、前回調査の土地利用ポリゴンと用途のデータを整え、敷地ごとに比べられる形にします。次に、前回調査の時点に近い衛星画像と、今回の画像を揃えます。空中写真があれば、そちらも使います。3つ目で、2時期の画像を比べ、建物の新築や除却、空地化など、見た目が変わった区画を抽出します。ここが衛星の仕事です。4つ目、変化の疑いがある区画を、固定資産課税台帳、登記簿、住宅地図と照合し、用途を一次判定します。最後に、現地調査で用途と面積を確定し、低未利用地を認定して、調書とGISデータに整えます。衛星は現地調査の代わりではなく、現地に行く区画を絞る道具です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-city-planning-landuse-survey/split.svg
    say: 役割の分担はこうなります。衛星の解析が担うのは、前回から見た目が変わった区画を拾うこと、低未利用地の候補を一次判定すること、現地調査に行く区画の一覧を出すことです。人が行うのは、用途と面積の確定、台帳と登記簿との照合、低未利用土地の認定、そして調書とGISデータの整備です。経緯を少し補います。内閣府の衛星リモートセンシングデータ利用タスクフォースが、令和4年3月の大臣会合で、この調査は衛星データで変化の有無を確かめて現地調査が必要な土地を絞り込むと効率化が期待されるとし、国土交通省が実施要領に記載して利用を促すと整理しました。国土交通省都市局は令和5年6月30日に、都道府県知事あてに実施要領の見直しを通知しています。実施要領は、地方自治法にもとづく技術的な助言です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [変化の疑いがある区画の地図, 現地調査に行く区画と、行かない区画]
      - [変化の種類（新築、除却、空地化）, 台帳と登記簿で先に照合する順番]
      - [低未利用地の候補の一覧, 空き家調査や空き地調査と突き合わせる対象]
      - [現地調査の結果（用途、面積、認定）, 調書、位置図、集計の確定]
    say: 受け取るデータと、それで決められることを整理します。変化の疑いがある区画の地図は、前回のポリゴンに変化の有無を付けたもので、現地調査に行く区画と行かない区画を決める根拠になります。変化の種類の一覧は、新築、除却、空地化などの区分で、台帳と登記簿で先に照合する順番を決める材料です。低未利用地の候補の一覧は、空地や駐車場らしい区画の抽出で、空き家調査や空き地調査と突き合わせる対象になります。そして、用途と面積を確定するのは、現地調査と台帳です。衛星の一覧は、現地調査の区画と順番を決める材料であって、調書の中身そのものではありません。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-city-planning-landuse-survey/limits.svg
    say: 限界は5つです。1つ目、位置づけは補助資料で、現地調査は残ります。実施要領は、現地調査による現況確認が望ましいとしたうえで、衛星画像は補助資料と書いています。衛星で変化がなさそうに見える区画を調査から外してよい、とは書かれていません。2つ目、精度や分解能の数字がありません。実施要領にも、タスクフォースの案件整理リストにも、どの程度の変化を拾えるか、どの分解能が要るかの数字はなく、リストは、分解能と観測頻度の高い次期光学衛星への期待を課題に挙げています。3つ目、建物の用途と階数は、上からでは分かりません。分かるのは建物や空地の有無と形の変化までで、住宅、商業、工業といった用途は、台帳、登記簿、住宅地図、現地で確かめます。4つ目、低未利用地の認定は、衛星では決まりません。空き家や空き店舗のある土地も当たるため、既存の空き家調査などの資料と現地で決めます。5つ目、調査主体は都道府県で、市町村との連携が要ります。画像の購入と判読を、県と市のどちらが担うかの整理が必要です。なお、どの自治体がどの衛星でどれだけ現地調査を減らしたかという結果は、確かめた範囲では公表されていません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 国のリストでは、主に活用している衛星は商用の光学衛星（国内・海外）
      - 敷地ごとの変化を見るには高い分解能が要る。無償の10m級の画像で成り立つかは、資料からは確認できない【要確認】
      - リストは、分解能と観測頻度の高い次期光学衛星への期待を課題に挙げている
      - 光学衛星は雲の下を写せず、密集した市街地では建物の影で地表が見えにくい【要確認】
    say: では、無償の衛星でどこまでできるでしょうか。この事例では、はっきりした答えはありません。タスクフォースの案件整理リストでは、主に活用している衛星は、国内と海外の商用の光学衛星です。敷地ごとの変化を見るには高い分解能が要り、無償の10メートル級の画像で成り立つかは、資料からは確認できません。リストが、分解能と観測頻度の高い次期光学衛星への期待を課題に挙げていることから、現行の衛星で十分とも書かれていません。さらに、光学衛星は雲の下を写せず、密集した市街地では建物の影で地表が見えにくくなります。この2点は、光学衛星の一般的な性質から書いていて、実施要領とタスクフォースの資料には記述がないため、記事では要確認としています。

  - kind: table
    heading: 費用は、どこにかかるか（金額は非公表）
    columns: [かかる所, 中身と仮定]
    widths: [0.3, 0.7]
    rows:
      - [衛星画像, "仮定：区域全体を2時期分、商用の光学画像で買う。費用の中心"]
      - [判読と解析, 2時期の画像の比較と、変化の疑いの抽出。AIなら学習と検証も]
      - [照合, 台帳、登記簿、住宅地図との突き合わせの人手]
      - [現地調査, 絞ったあとに残る区画の確認。なくならない]
      - [下げる工夫, 他部署のデータの利用と空中写真の共同利用（実施要領）]
    say: 費用の考え方です。この使い方の金額は公表されていません。この記事では、公開された画像の価格を引ける資料がなかったため、金額の概算は出さず、費用がかかる4つの所を整理します。1つ目は衛星画像です。仮定として、都市計画区域全体を2時期分、商用の光学画像で買うとすると、ここが費用の中心になります。2つ目は判読と解析で、2時期の画像の比較と、変化の疑いがある区画の抽出です。AIを使う場合は、学習と検証も要ります。3つ目は照合で、台帳、登記簿、住宅地図との突き合わせの人手です。4つ目は現地調査で、絞ったあとに残る区画の確認はなくなりません。比べる相手は、全区画を現地で確かめる従来の調査の人手です。実施要領は、都市計画以外の部署が持つデータの利用や、空中写真の共同利用で、費用の低減と高頻度化を図ることが考えられるとしています。衛星画像も、固定資産税や農地の部署と共同で買えば、1部署あたりの負担を下げられる可能性がありますが、これは記事の推測です。金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [対象の広さ, 都市計画区域全体、複数の市町村, 小さな区域で、現地を回れる]
      - [求めるもの, 変化の疑いがある区画の抽出, 用途と階数の確定、低未利用地の認定]
      - [変化の種類, 新築、除却、空地化など形の変化, 用途だけの変化（店舗が住宅になる）]
      - [前回のデータ, 前回調査のGISデータがある, 前回が紙の図面だけ]
      - [体制, 県と市で画像と判読の分担を決める, 分担が決まらない]
    say: 最後に、向き不向きです。向いているのは、対象が都市計画区域全体や複数の市町村にわたり、求めるものが変化の疑いがある区画の抽出で、新築、除却、空地化のように形が変わる変化を見たい、前回調査のGISデータがある、県と市で画像と判読の分担を決められる、という場合です。逆に、小さな区域で現地を回れる、用途と階数の確定や低未利用地の認定まで求める、店舗が住宅になるように用途だけが変わる変化を拾いたい、前回が紙の図面だけ、分担が決まらない、という場合は向きません。提案するときの要点は3つです。最初に、前回調査のGISデータの有無を聞くこと。令和5年の実施要領はGISデータでの整備を求めていて、次回以降の比較に効きます。次に、衛星で現地調査がなくなるとは言わないこと。そして、商用の光学画像が前提なので、画像の購入をほかの部署と相乗りで提案することです。

  - kind: cta
    heading: 自分の自治体で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：内閣府「衛星リモートセンシングデータ利用タスクフォース 案件整理リスト」（第3回大臣会合 資料1-1、令和6年3月）"
      - "　　　https://www8.cao.go.jp/space/taskforce/rs/dai3/siryou1_1.pdf"
      - "出典：国土交通省都市局「都市計画基礎調査実施要領（第5版）」（令和5年6月）C0302 土地利用現況"
      - "　　　https://www.mlit.go.jp/toshi/tosiko/content/001617949.pdf"
      - "出典：国土交通省都市局長「都市計画基礎調査実施要領の見直しについて」（令和5年6月30日）、内閣府 第2回タスクフォース大臣会合 資料2（令和4年3月28日）"
      - "費用：金額は非公表。記事に公開価格の引用がないため、画像代の概算は出していない"
    say: この事例をもとに、自分の自治体や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、画像の分解能や2時期の揃え方といった条件の整理と、比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
