    heading: Planning disaster response with satellite data?
    action: For an RFP and competitive quotes, contact us from the form
    url: ssskobj-dev.github.io/eisei-kouza/en/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/en/register.html
    credits:
      - "Source: International Charter, 'About the Charter' and '1,000 activations' (2025) https://disasterscharter.org/about-the-charter"
      - "Source: JAXA, Great East Japan EQ report; Sentinel Asia, Kumamoto EQ 2026 https://sentinel-asia.org/EO/2026/article20260728JP.html"
      - "Price: ALOS-2 reference, Ministry of the Environment Japan, satellite-use manual, Mar 2026 revision, Table 2-11"
    say: If you are planning disaster response and want to use satellite data around it, here is the next step. We help you write the request for proposal and gather competitive quotes, independent of any satellite operator or analytics company. Use the form in the description to get in touch. Thanks for watching.
