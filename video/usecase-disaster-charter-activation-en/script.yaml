# English use-case video. Same facts as casebook/disaster-charter-activation.qmd; English narration & slides.
lang: en
title: Free satellite imagery for big disasters (International Charter)
series: CASEBOOK
kicker: Use case
number: 53
total: 221
voice: Ryan
thumb: Free in a disaster
summary: How national disaster authorities get satellite imagery for free when a major disaster hits, through the International Charter. Who can request it, where it fits in the response, what decisions it supports, its 2026 limits, and the cost picture for the side that receives it. About 6 minutes.
scenes:
  - kind: cover
    heading: Free satellite imagery for big disasters
    sub: How the International Charter works, seen from the receiving side
    say: When a major disaster hits, can a country get satellite images of the whole affected area, for free, within a day or two? Often, yes. The answer is a standing agreement between the world's space agencies called the International Charter. In this video we look at what it is, who can request it, where it fits in the disaster response, what decisions it supports, its limits in 2026, and what it costs the side that receives the data.

  - kind: bullets
    heading: What it is
    items:
      - "A joint framework of 17 space agencies and satellite operators"
      - "Activated 1,000 times from 2000 to 2025, across 146 countries"
      - "On request, member satellites observe the disaster area and deliver imagery and damage maps"
      - "The data is free to the user; member agencies and data providers cover the imagery cost"
    say: First, what the Charter is. It is a joint framework of seventeen space agencies and satellite operators. Between the year two thousand and twenty twenty-five it was activated one thousand times, across one hundred and forty-six countries. When an authorised user requests it, the member agencies point their satellites at the disaster area and deliver imagery and damage maps. For the user, the data is free. The cost of the imagery is carried by the member agencies and by the commercial data providers that have joined. On average it is activated about forty times a year, and recently over fifty. Nearly eighty percent of activations are weather-driven, such as floods, storms and wildfires, and about sixteen percent are earthquakes or volcanoes.

  - kind: bullets
    heading: Who can request it
    items:
      - "Only registered national disaster authorities (Authorized Users)"
      - "98 bodies in 87 countries were registered as of August 2026"
      - "Municipalities and companies cannot request the Charter directly"
      - "In Japan, JAXA requested it in 2011; an Asian disaster centre in 2026"
    say: Now, who can actually pull the trigger. Only registered national disaster authorities, called Authorized Users, can request an activation. As of August twenty twenty-six, ninety-eight bodies in eighty-seven countries were registered. A city office or a private company cannot request the Charter directly. In Japan, for example, the space agency JAXA made the request in two thousand eleven on behalf of the Cabinet Office, and in twenty twenty-six an Asian disaster reduction centre made the request. So the first question for anyone on the ground is simple — who requests it for us, and how does the result reach our prefecture or town?

  - kind: steps
    heading: How it works
    items:
      - "In peacetime: register, agree the contact points, and run a drill"
      - "After a disaster: the authorised user requests, with date, location and disaster type"
      - "Member agencies observe the area as a priority and deliver imagery"
      - "A project manager coordinates the analysis into damage maps"
      - "The receiving side overlays the maps on its own mapping system"
    say: Here is how an activation flows. In peacetime, the country registers, agrees who the contact points are, and runs a drill of the request procedure. After a disaster, the authorised user sends a request with the date and time, the latitude and longitude of the area, the disaster type, and a contact. The Charter desk takes requests around the clock, every day of the year. Member agencies then observe the area as a priority and deliver imagery, and a project manager named for that activation coordinates the analysis into damage maps. The receiving side takes those maps and overlays them on its own mapping system. The satellite side provides the images and the maps; the receiving side has to get them to the field.

  - kind: table
    heading: "Example: two activations in Japan"
    columns: [Tohoku 2011, Kumamoto 2026]
    widths: [0.5, 0.5]
    rows:
      - ["Requested 38 minutes after the quake", "Activated the same day as the quake"]
      - ["Over 5,000 scenes delivered", "First map the next day (Sentinel-1)"]
      - ["Radar and optical from many countries", "ALOS-2 and others followed; 12 products"]
      - ["Cloud-free coast took 3 days", "Ground-displacement map came 8 days later"]
    say: Two real activations in Japan show the shape of it. After the twenty eleven Tohoku earthquake, JAXA requested the Charter just thirty-eight minutes after the quake. More than five thousand scenes were delivered, radar satellites from Germany, Canada and Italy and optical satellites from the United States, France, Korea, Germany, China and India. More than ninety analysis products were published. But cloud cover meant a cloud-free view of the whole coast only came together on the third day. In the twenty twenty-six Kumamoto earthquake, the Charter was activated the same day. The first product, the next day, was a damage estimate map built from Europe's free Sentinel-1 radar, marked version zero point nine. Maps from Japan's ALOS-2 and other satellites followed, twelve products in all, and the ground-displacement map came about eight days later. Both are real operations, not demonstrations.

  - kind: table
    heading: What decisions it supports
    columns: [What you receive, What you can decide]
    widths: [0.42, 0.58]
    rows:
      - ["Before and after imagery", "Extent of the damage, and where to survey"]
      - ["Damage estimate map", "Where to send rescue teams, which roads to clear first"]
      - ["Change and displacement maps", "Which ground moved, where to watch for secondary hazards"]
      - ["The product list, with dates", "At which stage you decide what"]
    say: Here is what you receive and what it lets you decide. Before-and-after imagery shows the extent of the damage and where to survey. A damage estimate map helps you decide where to send rescue teams and which roads to clear first. Change and displacement maps from radar show which ground moved and where to watch for secondary hazards. And the product list, with its dates and versions, tells you at which stage you decide what. Decide that order in advance, so you are not re-making decisions every time a new version of a map arrives.

  - kind: bullets
    heading: Limits as of 2026
    items:
      - "Only registered national bodies can request it; not cities or companies"
      - "Emergency phase only; not recovery design or peacetime monitoring"
      - "You cannot set the specs or accuracy; the first Kumamoto map was version 0.9"
      - "The first map comes the next day or later, and it is a wide-area estimate"
      - "It cannot confirm damage building by building, or what is inside"
    say: The limits are set by the framework itself. First, only registered national bodies can request it; a city or a company cannot. Second, it covers the emergency response phase only, not recovery design or peacetime monitoring. Third, you cannot specify the accuracy or the format; the products are made quickly by universities and analysis centres, and the first Kumamoto map carried a version zero point nine. Fourth, the first map comes the next day or later, and it is a wide-area estimate, not a survey. And finally, satellites show changes on the ground; whether a specific building is safe, and whether people are inside, is confirmed by search on the ground.

  - kind: bullets
    heading: How far do free satellites go?
    items:
      - "Europe's Sentinel-1 radar and Sentinel-2 optical are free to use"
      - "The first Kumamoto damage map was built from Sentinel-1"
      - "Radar sees through cloud and at night, useful right after a disaster"
      - "But you cannot choose the overpass time to match the disaster"
    say: So how far can free satellites take you, outside an activation? Europe's Sentinel-1 radar and Sentinel-2 optical data are free to use, and in fact the first Kumamoto damage map was built from Sentinel-1. Radar sees through cloud and at night, which matters in the hours after a disaster when optical images may be blocked. The limit is timing. With free satellites you take whatever overpass happens to fall near the disaster; you cannot order an observation at the moment you need it. That is part of why the Charter, which tasks many satellites at once, exists.

  - kind: table
    heading: What the receiving side pays (estimate)
    columns: [Item, Assumption and note]
    widths: [0.34, 0.66]
    rows:
      - ["Charter imagery and maps", "Free to the user; cost carried by member agencies and data providers"]
      - ["Analysis in an activation", "Coordinated by the project manager; no cost to the user"]
      - ["Receiving capability", "Registration, a drill, a mapping system, and staff time to read and relay the maps"]
      - ["Peacetime or recovery", "Normal procurement. Reference: ALOS-2 scene (50 km square) about 80,000 yen before tax"]
    say: Here is the cost, seen from the side that receives the data. This is a way of thinking, not a quote. The Charter imagery and maps are free to the user; the cost is carried by the member agencies and the data providers. The analysis done within an activation is coordinated by the project manager, at no cost to the user. What you do pay for is the capability to receive — the registration, a drill, a mapping system, and the staff time to read the English product list and relay the maps to the field. And if you want the same satellites for peacetime monitoring or recovery design, that is normal procurement that costs money. As a reference point, Japan's ALOS-2 radar has a public list price of about eighty thousand yen before tax for one scene of fifty kilometres square, as of March twenty twenty-six. Prices change, so confirm with a real quote.

  - kind: table
    heading: When it fits, and when it does not
    columns: [Factor, Fits, Does not fit]
    widths: [0.24, 0.38, 0.38]
    rows:
      - ["Scale", "Large national-scale disaster", "A local event, one building"]
      - ["Timing", "Days to weeks of response", "Recovery design, monitoring"]
      - ["Requester", "A registered national body", "A city or company directly"]
      - ["Question", "Where is the damage, what to see first", "Building-by-building confirmation"]
    say: Finally, where it fits. The Charter fits a large, national-scale disaster, in the first days to weeks of the response, when a registered national body can request it and the question is where the damage is and what to look at first. It does not fit a local event or a single building, the recovery-design or monitoring phase, a city or company that wants to request it directly, or a need to confirm damage building by building. When you advise on this, three points matter. Find out first who the imagery reaches you from. Never say the satellite confirms the damage. And treat the free emergency data and paid peacetime procurement as two separate conversations.

