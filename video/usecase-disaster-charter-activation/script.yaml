# ユースケース解説動画の台本。元の記事：casebook/disaster-charter-activation.qmd
title: 衛星データを無償で集める国際災害チャータ：発動1,000回の仕組みと限界
series: CASEBOOK
kicker: ユースケース解説
number: 53
total: 221
thumb: 災害時は無償で
summary: 大災害のとき、各国の防災機関の要請で世界の宇宙機関が衛星データを無償で出し合う「国際災害チャータ」の事例。2000年からの発動は1,000回、東日本大震災では5,000シーン超、2026年熊本地震では翌日に最初の被害推定図。受け取る側の業務のどこに入り、何を決める材料になるか、市町村は直接頼めないという限界と、平時や復旧期に使うなら費用がかかることまでを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 災害の衛星データを無償で集める仕組み
    sub: 国際災害チャータ：発動1,000回、東日本大震災で5,000シーン超。市町村は直接頼めない
    say: 大災害の直後に、世界の衛星の画像を無償で集める方法はあるか。答えは、あります。国際災害チャータという、宇宙機関どうしの約束です。2000年からの発動は1,000回。東日本大震災では5,000シーン以上の画像が日本に届き、2026年の熊本地震では、発生の翌日に最初の被害の推定図が出ました。この動画では、誰が要請できて、業務のどこに入り、何を決める材料になるのか。そして、市町村は直接頼めないという限界と、平時や復旧期に使うなら費用がかかることまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：世界。2000年から2025年までに146か国で発動
      - 誰が：各国の防災機関など、登録された利用者が要請する
      - 何のために：被害の全体像を、広い範囲で、その日のうちにつかむ
      - 困りごと：1つの国の衛星だけでは、被災地の上を通る機会が足りない
    say: 事例の舞台は、世界です。国際災害チャータは、2000年から2025年までに146か国の災害で1,000回発動されました。要請するのは、各国の防災機関など、あらかじめ登録された利用者です。目的は、被害の全体像を広い範囲で、できるだけ早くつかむことです。1つの国の衛星だけでは、その日のうちに被災地の上を通る機会は限られます。自国に衛星がない国は、画像を買う手段も時間もありません。そこで、17の宇宙機関と衛星運用者が、自分の衛星で被災地を優先して観測し、画像と被害の地図を無償で届ける約束をしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-disaster-charter-activation/flow.svg
    caption: 要請は国の防災機関。受け取る側は、平時の準備と発災後の判断
    say: 受け取る側の業務の流れで見ます。入る位置は、初動の判断の前です。まず、平時に自国の登録された利用者が誰かを確かめ、都道府県や市町村がどの経路で図を受け取るかを決めておきます。登録には、手順を定めた文書への署名と、発動を模擬する演習が含まれます。発災後、国の防災機関が、発生の日時、対象地域の緯度と経度、災害の種別、連絡担当者を添えて要請します。窓口は24時間365日受け付けています。届いた図を自分の組織の地図システムに重ね、救助や調査の優先順位を決めます。復旧の設計と被害の確定は、別の調達と現地調査で行います。

  - kind: figure
    heading: 宇宙機関と受け取る側の分担
    image: figures/usecase-disaster-charter-activation/split.svg
    say: 役割の分担はこうなります。宇宙機関側が行うのは、加盟機関の衛星で被災地を優先して観測すること、画像と被害の地図を無償で届けること、そして発動ごとに指名されるプロジェクトマネージャが成果物を調整することです。受け取る側が行うのは、平時に登録して窓口と手順を決めておくこと、届いた図を地図に重ねて救助と調査の範囲を決めること、復旧の設計と被害の確定を別の調達と現地で行うことです。利用者に費用はかかりません。ただし、受け取って現場に届ける体制は、自前です。

  - kind: figure
    heading: 事例：2026年熊本地震、発生から成果物まで
    image: figures/usecase-disaster-charter-activation/flow-timeline.svg
    caption: 東日本大震災では5,000シーン超、90以上の解析図が公開された
    say: 実際の発動を2つ見ます。東日本大震災では、2011年3月11日14時46分の地震の後、JAXAが内閣府の代理として15時24分に要請しました。各国の衛星から5,000シーン以上の画像が届き、90以上の解析図が公開されました。沿岸部のほぼ全域で雲のない画像がそろったのは、3日後の3月14日です。2026年7月28日の熊本地震では、アジア防災センターの要請で同じ日に発動されました。翌日の29日には、欧州の無償レーダー衛星センチネルワンの画像から被害の推定図が出ました。30日と31日には、だいち2号の変化の図とカナダのレーダー衛星の変位の図、8月3日から5日には被害の全体図と地盤の変位の図が続き、成果物は全部で12点でした。どちらも実証ではなく、2000年から続く本格運用です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.48, 0.52]
    rows:
      - [災害前後の衛星画像（加盟機関の衛星）, 被害の広がりの把握、現地調査の範囲]
      - [被害の推定図（地図、KMZなど）, 救助隊の派遣先、道路の啓開の順番]
      - [変化の図、変位の図（レーダー衛星の解析）, 地盤の動いた範囲、2次災害の警戒区域]
      - [成果物の一覧（日付、作成機関、版）, どの段階の図で、何を決めるか]
      - [現地調査の結果（自前で記録）, 被害の確定、国際支援の要請の規模]
    say: 受け取るものと、それで決められることを整理します。災害前後の衛星画像は、被害の広がりの把握と現地調査の範囲を決める材料です。被害の推定図は、救助隊の派遣先と道路の啓開の順番に使えます。レーダー衛星の解析による変化の図と変位の図は、地盤の動いた範囲と、2次災害の警戒区域の判断に使えます。成果物の一覧には日付と作成機関と版が並ぶので、どの段階の図で何を決めるかを先に決めておけます。被害の確定と国際支援の要請の規模は、自前の現地調査の結果で決めます。図が教えてくれるのは、どこの変化が大きいか、までです。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-disaster-charter-activation/limits.svg
    say: 限界を、制度と技術に分けて5つ挙げます。1つ目、要請できるのは登録された国の防災機関などです。2026年8月時点で87か国の98機関が登録されていますが、市町村や企業が直接頼む仕組みではありません。2つ目、対象は大規模な災害の緊急対応の段階だけです。復旧期の設計と平時の監視には使えません。3つ目、最初の図は翌日以降です。熊本地震では変位の図は8日後でした。4つ目、成果物の仕様と精度は受け取る側が決められません。急いで作られた図で、最初の図には0.9という版の番号が付いていました。5つ目、届くのは広域の推定図です。建物1棟の被害の確定や、人の安否は、現地で確かめます。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - チャータの発動そのものが無償。画像と図に、利用者の費用はかからない
      - 発動の外では、欧州のSentinel-1（レーダー）とSentinel-2（光学）が無償で使える
      - 熊本地震の最初の被害推定図も、Sentinel-1の画像から作られた
      - ただし、観測の時刻を災害に合わせて選べる仕組みではない
    say: では、無償の衛星でどこまでできるでしょうか。まず、チャータの発動そのものが無償です。届く画像と図に、利用者の費用はかかりません。画像の費用は加盟機関と、データ提供者として加わる民間の事業者が負担しています。発動の外では、欧州のセンチネルワンというレーダー衛星と、センチネルツーという光学衛星が無償で使えます。熊本地震の最初の被害の推定図も、センチネルワンの画像から作られました。ただし、無償の衛星は、観測の時刻を災害に合わせて選べる仕組みではありません。欲しい日に、欲しい場所の画像があるとは限りません。

  - kind: table
    heading: 平時や復旧期の費用の目安
    columns: [項目, 仮定と考え方]
    widths: [0.34, 0.66]
    rows:
      - [発動の中, 画像、被害の図、解析とも利用者の費用は0円]
      - [受け取る体制, 登録、演習、地図システム、担当者の時間。金額は非公開]
      - [平時・復旧期, チャータの対象外。同じ衛星でも通常の調達になる]
      - [公表価格の例, "だいち2号：1シーン（50km四方）税抜8万円。2026年3月時点"]
      - [概算の例, "仮定：前後1シーンずつ比べると8万円×2＝税抜16万円。解析は別"]
    say: 費用の考え方です。発動の中で届く画像と図と解析に、利用者の費用はかかりません。一方で、登録、演習、地図のシステム、図を現場に届ける担当者の時間は自前で、金額は公開されていません。平時の監視と復旧期の設計は、チャータの対象外です。同じ衛星のデータを使うなら通常の調達になります。目安として、日本のだいち2号は1シーン、50キロメートル四方で税抜8万円という公表価格があります。2026年3月時点の値です。仮定として、災害の前と後で1シーンずつ比べるなら、画像代は税抜16万円になります。解析の費用は別です。これは見積もりではありません。価格は変わるので、必ず配布事業者で確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [災害の規模, 国の防災機関が動く大規模災害, 局地的な災害、1棟の火災]
      - [時期, 発生から数日〜数週間の緊急対応, 復旧の設計、平時の監視]
      - [要請する組織, 登録された国の防災機関, 市町村、企業が直接]
      - [知りたいこと, 被害の広がりと、先に見る場所, 建物ごとの被害の確定]
      - [体制, 英語の図を読んで地図に重ねられる, 図を受け取って終わり]
    say: 最後に、向き不向きです。向いているのは、国の防災機関が動く大規模な災害で、発生から数日から数週間の緊急対応の段階、知りたいことが被害の広がりと先に見る場所で、英語の成果物を読んで地図に重ねられる体制があるときです。逆に、局地的な災害、復旧の設計や平時の監視、市町村や企業が直接要請したい、建物ごとの被害を確定したい、図を受け取って終わりにしたい、という場合は向きません。提案するときの要点は3つです。最初に、自分の町の図は誰から届くかを聞くこと。衛星で被害が分かる、と言わないこと。無償は緊急対応の段階だけ、と伝えることです。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：International Charter「1,000 activations」（2025年11月） https://disasterscharter.org/news/1000-activations-for-the-international-charter"
      - "出典：International Charter「Universal Access」（2026年8月時点） https://disasterscharter.org/universal-access"
      - "出典：JAXA「東日本大震災対応報告書」2.1.4 海外機関の協力 https://earth.jaxa.jp/files/antidisaster/20110311report/311report7.pdf"
      - "出典：Sentinel Asia「Earthquake in Kumamoto Prefecture, Japan on 28 July, 2026」、International Charter「Activation 1046」"
      - "価格：環境省「地盤沈下観測等における衛星活用マニュアル」令和8年3月改訂版 表2-11（だいち2号、2026年3月時点）"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。災害時の衛星データの受け取り方の整理と、平時や復旧期の調達に向けた仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
