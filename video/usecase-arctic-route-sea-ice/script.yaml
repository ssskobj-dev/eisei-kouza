# ユースケース解説動画の台本。元の記事：casebook/arctic-route-sea-ice.qmd
title: 衛星データで北極海航路の開通を読む：6月の見通しと実際の8月20日
series: CASEBOOK
kicker: ユースケース解説
number: 35
total: 221
thumb: 見通しと実績の差
summary: 海運会社が北極海航路の配船を決めるために、衛星の海氷観測から開通時期の見通しを受け取る事例。2019年は6月に「8月中旬」と見通され、実際の開通は8月20日でした。業務のどこに入れ、何を決める材料になるか、見通しの幅と衛星では分からないこと、無償データでどこまでできるかを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで北極海航路の開通を読む
    sub: 6月の見通し「8月中旬」と、実際の開通日8月20日
    say: 北極海航路が今年いつ通れるようになるかを、春のうちに知る方法はあるか。答えは、衛星の海氷の観測から、航路ごとの開通時期の見通しを受け取ることです。2019年は、6月に8月中旬と見通され、実際の開通は8月20日でした。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。見通しにはどれだけ幅があり、衛星では何が分からないのか。無償のデータでどこまでできるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 航路：北極海航路。南回りの約21,000kmに対し約13,000km、約6割の距離
      - 誰が：海運会社の配船の担当者。見通しを出すのは気象会社
      - 何のために：北極経由の航海を今年組むか、いつ出すかを決める
      - 困りごと：北極海は観測点が少なく、海氷の広がりを広く確かめる手段が限られる
    say: 舞台は北極海航路です。東アジアと欧州を北極海経由で結ぶ航路で、国土交通省の資料では、マラッカ海峡とスエズ運河を通る南回りの約21,000キロに対し、約13,000キロ、約6割の距離になります。海氷が減ったことで、夏の時期に航行できるようになりました。使うのは海運会社の配船の担当者で、見通しを出すのは気象会社です。目的は、北極経由の航海を今年組むか、いつ出すかを決めること。北極海は観測点が少なく、海氷の広がりを広く確かめる手段が限られていたので、衛星がその広く毎日の部分を担います。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-arctic-route-sea-ice/flow.svg
    caption: 初夏の見通しで候補を仮置きし、出航の直前に最新の分布で判断する
    say: 業務の流れを見ます。まず6月から7月に、航路ごとの開通時期の見通しを受け取ります。次に、北極経由にする航海の候補と、スエズ経由に戻す場合の期限を仮に置きます。3つ目に、航行許可の申請と、砕氷船の支援が要るかどうかを、船の等級と海域で確かめます。4つ目に、出航の判断の直前に、最新の海氷の分布で開通の状況を確かめます。最後に、航海中は氷の状況の更新を受けて、必要なら迂回や待機を決めます。衛星が入るのは、1つ目と4つ目です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-arctic-route-sea-ice/split.svg
    say: 分担はこうなります。衛星の観測が行うのは、海氷の分布を広く毎日捉えることと、航路ごとの開通の見通しを出すことです。人が行うのは、北極経由かスエズ経由かを決め、出航の時期と船を決め、航行許可と砕氷船の支援を確かめることです。事例の気象会社は、2017年に打ち上げた自社の超小型衛星の観測と、既存の衛星画像、マイクロ波の衛星AMSR2の解析画像を組み合わせています。2011年から続く本格運用で、2019年は13航海を支援したと公表されています。

  - kind: table
    heading: 2019年の見通しと実際
    columns: [項目, 6月28日の見通し, 実際（12月のまとめ）]
    widths: [0.30, 0.33, 0.37]
    rows:
      - [北東航路（ロシア側）の開通, 8月中旬, 8月20日に開通。10月21日まで約2か月]
      - [北西航路（カナダ側）の開通, 9月上旬, 9月1日に開通。9月29日まで約1か月]
      - [海氷面積の年間最小, 約440万km²（6番目に小さい）, 396万km²（2番目に小さい）]
    say: 2019年の数字を並べます。6月28日の発表では、ロシア側の北東航路は8月中旬、カナダ側の北西航路は9月上旬の開通が見込まれるとされました。ここでいう開通は、海氷の中に入らずに全航路を通れると衛星の観測から判断される状態です。実際には、北東航路は8月20日に開通し、10月21日まで約2か月続きました。北西航路は9月1日から9月29日まで、約1か月でした。海氷面積の年間最小は、見込みの約440万平方キロに対し、実際は396万平方キロで、観測開始以来2番目に小さい値でした。開通日はほぼ見通しのとおり、面積は見込みより小さくなったことになります。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [航路ごとの開通時期の見通し（初夏の発表）, 北極経由の航海を今年組むかどうか]
      - [海氷の分布図（日々の画像、密接度の格子）, 出航の時期。氷の縁をどこで避けるか]
      - [開通期間の実績（過去の年の年末のまとめ）, 来年の計画で見込む航行の窓]
      - [航行許可と砕氷支援の要否（航路局の審査）, その海域を自社の船で通れるか]
    say: 受け取るものと、それで決められることを整理します。初夏の開通時期の見通しは、北極経由の航海を今年組むかどうかの材料です。日々の海氷の分布図は、出航の時期と、氷の縁をどこで避けるかを決めるのに使います。過去の年の開通期間の実績は、来年の計画で見込む航行の窓になります。そして、航行許可と砕氷船の支援の要否は、ロシアの航路局の審査で決まり、その海域を自社の船で通れるかを左右します。見通しの8月中旬と、実績の8月20日の差を年ごとに記録しておくと、自社の判断に使う余裕の幅が決まります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-arctic-route-sea-ice/limits.svg
    say: 限界は4つです。1つ目、季節の見通しには幅があります。開通日は週の単位、面積は1割程度ずれることを見込んでおく必要があります。2つ目、マイクロ波放射計の格子は粗いことです。AMSR2の海氷密接度の標準プロダクトは概略15キロ、精度はプラスマイナス10パーセントです。氷の縁の細かな形や薄い氷の帯は、この格子では表しきれません。3つ目、航行できるかは氷の状況だけでは決まりません。ロシア側の北東航路は事前申請による許可制で、申請は入域予定日の120日前から15営業日前までです。砕氷船の支援が要るかは、海域、船の氷海船級、海氷の状況で定められています。4つ目、氷の厚さと流動は画像だけでは読みにくいことです。全面結氷していても流動が大きく厚くないと判断するには、海氷の知識が要ります。

  - kind: bullets
    heading: 無償のデータで、どこまでできるか
    items:
      - AMSR2の海氷密接度は公的機関が公開。NOAAは10km格子で日々公開している
      - 標準プロダクトの空間分解能は概略15km、精度は±10%。研究用でも5km
      - 自社で分布図を見るだけなら、データの費用は0円
      - 開通時期の見通しと個々の船の判断には、海域ごとの読み取りと海氷の知識が要る
    say: では、無償のデータでどこまでできるでしょうか。元になるマイクロ波放射計の海氷密接度は、公的機関が公開しています。アメリカのNOAAは、AMSR2の海氷密接度を10キロの格子で日々公開しています。自社で分布図を見るだけなら、データの費用はかかりません。一方で、標準プロダクトの分解能は概略15キロで、研究用の高解像度のものでも5キロです。そして、航路の開通を判断する解析と、海域ごとの読み取りは、分布図を眺めることとは別の仕事です。見通しと個々の船の判断には、海氷の知識を持つ人か、サービスの利用が要ります。

  - kind: table
    heading: 費用の考え方
    columns: [項目, 分かっていること]
    widths: [0.34, 0.66]
    rows:
      - [見通しと運航支援のサービス, 金額は公開されていない。発表資料にも料金はない]
      - [海氷の分布データ, 公的機関が無償で公開。NOAAは10km格子で日々公開]
      - [航海の費用, 砕氷船の料金は、総トン数と海域数に応じて上限が決まる]
      - [概算について, 公開価格がないので概算は出せない。見積もりで確かめる]
    say: 費用の考え方です。この事例では、有償の画像の概算を出せません。見通しと運航支援のサービスの金額は公開されておらず、発表資料にも料金はありません。元になる海氷の分布データは、公的機関が無償で公開しています。航海そのものの費用として、砕氷船の料金は、船の総トン数と支援を受ける海域の数に応じて上限が定められています。衛星の費用より、こちらの方が大きくなる場合があります。公開価格がないので、仮定を置いた概算も、この動画では出しません。金額は必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [荷物の性質, 夏に繰り返し運ぶ。時期をずらせる, 到着日が固定されている]
      - [計画の余裕, 週の単位のずれを織り込める, 開通日を1日単位で当てにする]
      - [船, 氷海船級があり、許可の要件を満たす, 耐氷性能がなく、海氷があると航行できない]
      - [社内の体制, 氷の状況の更新を受けて判断を変えられる, 一度決めた航海計画を変えにくい]
      - [見たいもの, 航路全体の開通の時期, 港の前の局所の氷の状態]
    say: 最後に、向き不向きです。向いているのは、夏に繰り返し運ぶ荷物で時期をずらせること、週の単位のずれを計画に織り込めること、船に氷海船級があって許可の要件を満たすこと、氷の状況の更新を受けて判断を変えられる体制があることです。見たいものが、航路全体の開通の時期であることも条件です。逆に、到着日が固定されている、開通日を1日単位で当てにする、耐氷性能がない、航海計画を変えにくい、港の前の局所の氷を知りたい、という場合は向きません。提案するときは、最初に船の等級と許可の要件を確かめること、開通日が分かるとは言わないこと、無償データだけで見通しは作れないと伝えることが要点です。

  - kind: cta
    heading: 自社の業務で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：ウェザーニューズ「『北極海の海氷傾向2019』を発表」（2019年6月28日） https://jp.weathernews.com/news/27812"
      - "出典：ウェザーニューズ「『北極海の海氷まとめ2019』を発表」（2019年12月18日） https://jp.weathernews.com/news/30086/"
      - "出典：国土交通省 海洋政策課「北極海航路の利用動向について」（2021年7月28日） https://www.mlit.go.jp/sogoseisaku/ocean_policy/content/001476544.pdf"
      - "衛星の仕様：JAXA「AMSR2ミッション要求」 https://www.eorc.jaxa.jp/AMSR/datacatalog/am2_mission_ja.html"
      - "データ：NOAA CoastWatch「AMSR2 Sea Ice Concentration」 https://coastwatch.noaa.gov/cwn/products/amsr2-sea-ice-concentration.html"
      - "費用：見通しのサービスの料金は非公開。この動画では概算を出していない"
    say: この事例をもとに、自社の配船や顧客の提案に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
