# ユースケース解説動画の台本。元の記事：casebook/farmland-auto-judge.qmd
title: 衛星データで農地パトロールの現地調査を98%減らす、舞鶴市の3段階
series: CASEBOOK
kicker: ユースケース解説
number: 41
total: 221
thumb: 現地調査98%減
summary: 京都府舞鶴市が、農地パトロール（利用状況調査）の現地調査を約67,000筆から約1,500筆に減らしたとされる事例。衛星の自動判別、画面での目視、現地の3段階に分ける使い方と、自動判別は約7割という限界、公表されている参考価格までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで農地パトロールを絞る
    sub: 舞鶴市は、現地調査を約67,000筆から約1,500筆へ
    say: 数万筆の農地を、全部見て回らずに調べる方法はあるか。答えは、衛星の自動判別、画面での目視、現地の3段階に分けて、現地に行く農地を絞ることです。京都府舞鶴市は、この方法で現地調査を約67,000筆から約1,500筆へ、98パーセント減らしたと公表されています。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。衛星では決まらないことは何で、費用はどこにかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。導入は京都府舞鶴市と山口県宇部市
      - 誰が：市町村の農業委員会（調査）と、山口県の事業者（解析とシステム）
      - 何のために：毎年の利用状況調査（農地パトロール）
      - 困りごと：数万筆を道路から見て回ると、時間の多くが移動と記録に消える
    say: 事例の舞台は日本です。導入の実績は京都府舞鶴市と山口県宇部市、実証は山口県内の18市町村です。市町村の農業委員会は、毎年、区域内の農地が耕作されているかを調べます。利用状況調査、通称、農地パトロールです。筆というのは、登記上の土地の1区画のことです。以前は、すべての農地を道路から目で見て回っていました。農地が数万筆ある市では、調査員の時間の多くが移動と記録に消えます。そこで、衛星で耕作されていると判定できる農地を先に分け、現地に行く農地を絞る、という使い方をしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-farmland-auto-judge/flow.svg
    caption: 現地に出る前に、衛星の自動判別と、画面での目視を入れる
    say: 業務の流れを見ます。農業委員会の事務局に入れる場合を想定した流れです。入る位置は、現地に出る前です。まず、農地の区画データと台帳の地番をそろえます。次に、衛星データの解析で、耕作されている農地を自動で判別します。自動で判別できなかった農地は、光学画像を画面で見て、人が判定します。それでも分からない、要調査の筆だけ、タブレットを持って現地で確かめます。最後に、結果を自治体の地図システムや台帳に戻し、翌年の重点地区を決めます。準備でいちばん重いのは、最初の区画データです。このサービスの機能の一覧では、農地と位置情報をひも付ける作業に印が付いていません。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-farmland-auto-judge/split.svg
    say: 役割の分担はこうなります。衛星の解析が行うのは、耕作されている農地を自動で判別することと、現地に行く候補を絞ることです。人が行うのは、残りの農地を光学画像で目視すること、要調査の筆に現地で行くこと、そして遊休農地かどうかを判断して台帳に戻すことです。舞鶴市では、農地の約70パーセントが自動で判別されました。宇部市は2023年度から本格運用していて、農地は約5万筆。一次判定で現地確認が要るとされたのは約20パーセント、最終的に現地で目視するのは全体の約2パーセントです。実証ではなく、導入の実績として載っている事例です。ただし、舞鶴市の数字は事業者の申告値で、どの年度の調査かは書かれていません。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [筆ごとの判定の地図と一覧, どの筆を画面で見るか、どの筆に現地で行くか]
      - [前年との差分の一覧, 判定が変わった筆の優先順位、調査員の人数と日数]
      - [現地の結果と写真（タブレットの記録）, 遊休農地とするか、利用意向調査の対象にするか]
      - [調査の進捗と履歴（システムの画面）, 進み具合の把握、監査のときの根拠]
    say: 受け取るデータと、それで決められることを整理します。筆ごとの判定の地図と一覧は、どの筆を画面で見るか、どの筆に現地で行くかの根拠になります。前年との差分の一覧からは、判定が変わった筆の優先順位と、調査員の人数や日数を決められます。現地の結果と写真は、遊休農地とするか、利用の意向を聞く調査の対象にするかの判断に使います。調査の進捗と履歴は、進み具合の把握と、監査のときの根拠になります。衛星が出すのは、耕作されているように見えるかどうかまでです。遊休農地とするかどうかは、農業委員会の判断として残ります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-farmland-auto-judge/limits.svg
    say: 限界を5つ挙げます。1つ目、自動で判別できるのは約7割です。残りは人が光学画像を見て判定するので、衛星の解析だけで調査は終わりません。2つ目、目視には細かく見える画像が要ります。宇部市は分解能約1メートルの画像を使っています。分解能の低い画像では、目視が要る農地が増え、省力の効果が薄れると指摘されています。3つ目、狭い農地、果樹園、茶畑は判定しにくく、現地の見回りが残ります。4つ目、田のあぜや水路の働きは、衛星の解析では直接判定しにくいとされています。5つ目、98パーセントは1つの市の結果です。削減率は、農地の形、作物、画像の細かさ、前年までの結果の蓄積で変わります。初年度から同じ数字が出るとは限りません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - このサービスのページに、使う衛星の名前は書かれていない
      - 参考価格に「衛星データ購入費用」があり、画像を買う構成
      - 無償の衛星データだけで組んだ場合の価格は、載っていない
      - 宇部市の目視は、分解能約1mの光学画像。粗い画像では目視が増える
    say: では、無償の衛星でどこまでできるでしょうか。このサービスのページには、使う衛星の名前が書かれていません。参考価格には衛星データの購入費用があり、画像を買う構成です。無償の衛星データだけで組んだ場合の価格は、載っていません。宇部市の目視は、分解能約1メートルの光学画像で行っていて、粗い画像に替えると、目視と現地が増えます。なお、同じサービス集の別の事業者のページには、山口県の事例の図にALOS-2とSentinel-2の名前があり、費用は使う衛星データが無償か有償か、高分解能かで変わるとされています。この事例でどの衛星を使ったかは、事業者に確かめる必要があります。

  - kind: table
    heading: 費用の考え方（公表の参考価格）
    columns: [項目, 公表の金額と仮定]
    widths: [0.26, 0.74]
    rows:
      - [初期費用, システム初期設定 30万円〜、圃場データ整備 50万円〜]
      - [運用費用, 衛星データ購入 50万円〜（面積で変動）、システム利用料 180万円〜]
      - [金額の読み方, "仮定：どれも下限。上限の記載はなく、面積が広いほど上がると見る"]
      - [料金の外, "仮定：区画データのひも付け、画面での目視、現地確認の人手は別"]
    say: 費用です。これは事業者が国のサービス集に載せた参考価格で、見積もりではありません。初期費用は、システムの初期設定が30万円から、農地の区画データの整備が50万円から。運用費用は、衛星データの購入が50万円からで、撮影する面積で変わります。システムの利用料は180万円からです。どれも下限だけで、上限は書かれていません。仮定として、対象の面積が広いほど、下限より上がると見ておきます。税込みか税別か、利用料が年額かどうかは、資料からは読み取れませんでした。そして料金の外に、区画データと台帳のひも付け、画面での目視、現地確認の人手が残ります。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [農地の数, 数万筆あり、全筆の見回りが続かない, 数千筆で、現状の見回りで回っている]
      - [農地の形, まとまった広さの田畑が多い, 狭い農地、細かい区画が多い]
      - [作っているもの, 田、畑, 果樹園、茶畑]
      - [区画データ, 区画データがあり、台帳とつながる, 紙の台帳だけ。地番がばらばら]
      - [体制, 目視と線引きの見直しを続けられる, 衛星の判定だけで調査を終えたい]
    say: 最後に、向き不向きです。向いているのは、農地が数万筆あって全部の見回りが続かない、まとまった広さの田や畑が多い、区画データがあって台帳とつながる、画面での目視と線引きの見直しを続けられる、という自治体です。逆に、数千筆で今の見回りで回っている、狭い農地や細かい区画が多い、果樹園や茶畑が中心、紙の台帳しかない、衛星の判定だけで調査を終えたい、という場合は向きません。提案するときの要点は3つ。最初に、区画データと台帳の状態を聞くこと。98パーセント削減を提案の見出しにしないこと。そして、画像の細かさと費用の関係を先に説明することです。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：農林水産省「衛星活用サービス集」10ページ https://www.maff.go.jp/j/kanbo/dx/attach/pdf/eisei-10.pdf"
      - "出典：農林水産省「衛星活用サービス集」2〜3ページ https://www.maff.go.jp/j/kanbo/dx/attach/pdf/eisei-14.pdf"
      - "出典：農林水産省「現地確認業務における衛星画像の活用について」（令和8年8月） https://www.maff.go.jp/j/kanbo/dx/attach/pdf/eisei-1.pdf"
      - "出典：マイナビニュース TECH+（2025年2月6日）宇部市の取材記事 https://news.mynavi.jp/techplus/article/20250206-3123078/"
      - "価格：上記サービス集10ページの参考価格（事業者の掲載値。2026年11月6日に確認）。見積もりではありません"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
