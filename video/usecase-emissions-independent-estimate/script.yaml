# ユースケース解説動画の台本。元の記事：casebook/emissions-independent-estimate.qmd
title: 衛星データで工場ごとの排出量を独立推計：Climate TRACEの276万か所
series: CASEBOOK
kicker: ユースケース解説
number: 46
total: 221
thumb: 自己申告と比べる
summary: 非営利の連合Climate TRACEは、300基を超える衛星と1万超のセンサーのデータをAIで解析し、世界の約276万か所の排出源の温室効果ガスを施設ごとに推計して無料で公開しています。投資家や自治体が企業の開示値と並べて使うときの工程、衛星がCO2を直接測っているのではないという限界、費用がかかる所を6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで、工場ごとの排出量を推計
    sub: 企業の開示値と並べて、差の大きい施設を見つける
    say: 企業が自分で申告した温室効果ガスの排出量を、別の物差しで確かめる方法はあるか。答えは、衛星データとAIで施設ごとに推計した値を、開示値と並べて見ることです。非営利の連合Climate TRACEは、世界の約276万か所の排出源について、施設ごとの推計を無料で公開しています。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。衛星は何を見ていて、何を見ていないのか。費用はどこにかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：世界。国内外の施設が対象
      - 誰が：投資家、金融機関、自治体、NGO、研究者。公開データを自分で取りに行く側
      - 何のために：企業が開示した排出量を、独立の推計と並べて確かめる
      - 困りごと：相手の計算の中身は見えない。未開示の施設や、報告の方法が違う海外の施設は比べる物差しがない
    say: 事例の舞台は世界です。国内外の工場や発電所が対象になります。使うのは、投資家、金融機関、自治体、NGO、研究者など、公開データを自分で取りに行く側です。目的は、企業が自分で計算して開示した排出量を、独立の推計と並べて確かめることです。困りごとは、相手の計算の中身が見えないこと。開示をしていない施設や、国ごとに報告の方法が違う海外の施設になると、比べる物差しがありません。そこで、衛星の観測から施設ごとの排出量を推計した公開データを、物差しとして使います。

  - kind: figure
    heading: 事例：Climate TRACE（非営利の連合）
    image: figures/usecase-emissions-independent-estimate/numbers.svg
    caption: 公開されている規模（2026年10月時点）
    say: 事例の主体は、2020年7月に始まった非営利の連合、Climate TRACEです。2026年時点で100を超える非営利団体、技術企業、大学、研究者が参加しています。300基を超える衛星と、1万1千を超えるセンサーのデータを、AIで解析しています。公開しているのは、世界の約276万か所の排出源の、施設ごとの推計です。対象は二酸化炭素、メタン、一酸化二窒素で、2024年11月からは二酸化硫黄などの大気汚染物質も出しています。2025年3月から月ごとの更新に移り、公開の遅れは60日です。2021年6月から、外部の科学者による検証も行っています。データは出どころを示せば商用を含めて自由に使えます。実証ではなく、公開のデータとして運用されている事例です。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-emissions-independent-estimate/flow.svg
    caption: 独立推計を、企業との対話につなぐ6つの手順
    say: 業務の流れを見ます。金融機関が、投融資先の気候リスクの評価と対話に入れる場合です。まず、投融資先の発電所や製鉄所、セメント工場などの一覧と所在地を作ります。次に、Climate TRACEの施設データと名寄せします。所有者名と所在地で検索できます。3つ目に、企業の開示値と推計の年間値を並べて、差を出します。4つ目に、差の大きい施設のうち、推計の信頼度が高いものを質問先として選びます。5つ目に、企業に差の理由を聞きます。稼働率の違い、燃料の違い、開示の範囲の違いなどです。最後に、答えを対話の記録と評価に反映します。推計の値そのものは、企業の開示値に置き換えません。自治体なら、管内の排出源の把握と対策の順番づけに置き換えて読めます。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-emissions-independent-estimate/split.svg
    say: 役割の分担はこうなります。衛星の解析が行うのは、発電所の冷却塔や煙突から出る水蒸気の筋、工場の熱、船の位置と速度といった、稼働の兆候を衛星画像から捉えること。その稼働の長さと規模を、実測値で学習したAIで排出量に換算すること。そして月ごとに更新することです。人が行うのは、投融資先の施設と名寄せすること、開示値と並べて差の大きい施設を選ぶこと、企業に理由を聞くこと、対策と対話の優先順位を決めることです。推計は対話の入口です。推計そのものが正しいと決めつけるのではなく、理由を企業に聞くための材料にします。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.52, 0.48]
    rows:
      - [施設ごとの年間と月ごとの排出量の推計（CO2、メタン、一酸化二窒素）, 開示値との差が大きい施設。対話の優先順位]
      - [施設ごと、ガスごと、月ごとの信頼度, 質問先として取り上げるか、保留にするか]
      - [国、部門、州や郡、都市の集計, 自治体の管内で、どの部門から対策するか]
      - [施設ごとの排出削減戦略（効果の大きい対策と削減量の推計）, 企業に提案する対策の候補]
    say: 受け取るデータと、それで決められることを整理します。施設ごとの年間と月ごとの排出量の推計は、開示値との差が大きい施設と、対話の優先順位を決める根拠になります。施設ごと、ガスごと、月ごとの信頼度は、質問先として取り上げるか保留にするかの判断に使います。国、部門、都市の集計は、自治体がどの部門から対策するかの材料になります。施設ごとの排出削減戦略は、企業に提案する対策の候補になります。決められるのは、誰に何を聞くか、です。推計値を企業の排出量として評価に書き込むのではなく、対話の入口と、答えの妥当性を見る物差しに使います。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-emissions-independent-estimate/limits.svg
    say: 限界を5つ挙げます。1つ目、衛星はCO2を直接測っていません。稼働の兆候を見つけ、実測値で学習したAIで排出量に換算した値です。精度は、学習に使った実測データが似た施設をどれだけ覆っているかで決まります。2つ目、施設ごとの推計があるのは、世界の排出量の75パーセントを占める部門だけです。鉄道やフッ素系ガスは国の単位にとどまります。3つ目、公開は60日遅れで、過去の推計が後から直されることが普通にあります。比べるときはデータのバージョンを記録します。4つ目、外部の研究と大きく食い違う例があります。2026年の米国の大学の研究は、米国の260都市の自動車からのCO2排出量について、Climate TRACEの値が別の推計より平均で約70パーセント低いと報告しました。Climate TRACE側は国全体の合計は公式の値と近いと反論しています。どちらが正しいかは別として、施設や都市の値をそのまま確定した数字として使えないことは確かです。5つ目、グローバルサウスなど実測データが少ない地域と部門では、精度が落ちます。

  - kind: bullets
    heading: 公開データで、どこまでできるか
    items:
      - Climate TRACEのデータは無料。CC BY 4.0で、出どころを示せば商用も可。衛星データを自分で買う必要はない
      - 取り方は4つ。ウェブの地図、ダウンロード、BigQuery、API（ベータ版）
      - 名寄せは、所有者名と所在地で検索できる
      - 注意：60日遅れ、過去の値の改訂、APIはベータ版で本番の用途には慎重に
    say: では、公開データでどこまでできるでしょうか。この事例では、衛星データを自分で買う必要がありません。Climate TRACEのデータは無料で、CC BY 4.0のライセンスです。出どころを示せば、商用を含めて使えます。取り方は4つ。ウェブの地図、ダウンロード、ベータ版のAPI、そしてGoogle BigQueryです。名寄せは、所有者名と所在地で検索できます。注意点は、公開が60日遅れること、過去の値が改訂されること、APIはベータ版で、本番の用途には慎重にと案内されていることです。つまり、データを取ることより、自社の施設の一覧と突き合わせる所に手間がかかります。

  - kind: table
    heading: 費用はどこにかかるか（概算）
    columns: [項目, 仮定と考え方]
    widths: [0.3, 0.7]
    rows:
      - [データ, 無料（CC BY 4.0）。BigQueryで使う場合は無料枠が月1TiB、超えると標準の料金（データのページ、2026年11月閲覧）]
      - [名寄せと分析, "仮定：施設の一覧が整っている金融機関なら、初回はアナリストの作業として数週間"]
      - [更新への追従, "仮定：以降は、月ごとの更新と過去の値の改訂に合わせて、比較をやり直す"]
      - [金額, この用途の金額は公開されていない。費用の中心は人件費]
    say: 費用の概算です。これは仮定を置いた考え方で、見積もりではありません。データは無料です。Google BigQueryで使う場合は、月1テビバイトの無料枠を超えると標準の料金がかかります。費用の中心は、名寄せと分析の人件費です。施設の一覧が整っている金融機関なら、初回の名寄せと分析はアナリストの作業として数週間、と仮定します。以降は、月ごとの更新と過去の値の改訂に合わせて、比較をやり直す運用が残ります。この用途についての金額は公開されていません。実際の規模は、自社の施設の数と、一覧の整い方で変わります。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.16, 0.42, 0.42]
    rows:
      - [部門, 発電、製鉄、セメント、油ガス、海運など、施設ごとの推計がある部門, 鉄道やフッ素系ガスなど、国の単位しかない部門]
      - [使い方, 開示値と並べ、差の大きい施設を対話の入口にする, 推計値を企業の排出量として評価に書き込む]
      - [対象, 開示のない海外の施設の目安, 煙突の実測値がある施設の代わり]
      - [時間, 年間と月ごとの推移を見る, 直近2か月の動きを見る（60日遅れ）]
      - [体制, 施設の一覧があり、バージョンを記録できる, 企業名しか持っていない]
    say: 最後に、向き不向きです。向いているのは、発電、製鉄、セメント、油ガス、海運など、施設ごとの推計がある部門で、開示値と並べて差の大きい施設を対話の入口にする使い方です。開示のない海外の施設の目安にも向きます。逆に、鉄道など国の単位しかない部門、推計値をそのまま企業の排出量として評価に書き込む使い方、煙突の実測値の代わり、直近2か月の動き、そして企業名しか持っていない体制には向きません。提案するときは、最初に投融資先の施設の一覧があるかを聞くこと。衛星で排出量を測った値、と言わないこと。推計を評価に直接書き込む設計を避けること。この3つが要点です。

  - kind: cta
    heading: 自社の業務で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：Climate TRACE「About」（2026年11月閲覧） https://www.climatetrace.org/about"
      - "出典：Climate TRACE「Data Downloads」（2026年11月閲覧、リリース5.12.0。無料、CC BY 4.0、BigQueryの無料枠） https://climatetrace.org/data"
      - "出典：Climate TRACE「Climate TRACE Begins Monthly Data Releases」（2025年3月） https://climatetrace.org/news/climate-trace-begins-monthly-data-releases-with-new"
      - "出典：Climate TRACE「The Bottom Line on Ground Truth Data」（2023年4月3日） https://climatetrace.org/news/the-bottom-line-on-ground-truth-data"
      - "出典：Northern Arizona University（2026年、Gurneyらの研究） https://in.nau.edu/news/gurney-2026/"
      - "費用：この用途の金額は公開されていない。「数週間」は仮定"
    say: この事例をもとに、自社の投融資先や管内の施設に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
