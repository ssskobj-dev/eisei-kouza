# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第1部 第2章「衛星データの光学とレーダーを同じ場所で並べて見る：日付・範囲・値の単位をそろえる3つの確認」（learn/codex/codex-1-2-optical-vs-radar-view.qmd）
title: 衛星データの光学とSARを並べる3つの確認：日付・座標・dBの単位
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 6
total: 30
thumb: 光学とSARを並べる
summary: 光学のSentinel-2とレーダーのSentinel-1を同じ場所で並べる前に、人が確かめる3つのこと。観測の日付と時刻、範囲と座標、値の単位（真値とデシベル）です。雲の日の見え方と水面が暗く写る理由を見たあと、AIが返した誤りを仕込んだコードを一緒にレビューして4つの誤りを見つけ、平均の順番で値がどれだけ変わるかを電卓で確かめます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 光学とレーダーを同じ場所で並べて見る
    sub: 日付と時刻、範囲と座標、値の単位。並べる前に人がそろえる3つ
    say: 大雨の日は雲で光学の画像が使えません。レーダーの画像で代わりになるでしょうか。同じ場所の同じ日を、そのまま並べてよいでしょうか。答えは、並べる前に、日付と時刻、範囲と座標、値の単位の3つをそろえる、です。そろっていない2枚を並べても、違いが場所の違いなのか、条件の違いなのか分かりません。この動画では、光学とレーダーが測っているものの違い、雲の日と水面の見え方を見たあと、AIが返したコードを一緒にレビューして、4つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 同じ場所、近い日の光学とレーダーの画像を並べ、日付と範囲がそろっているかと、値の単位を確かめられる
      - 光学とレーダーは測っているものが違うこと、雲の日と水面でどう見え方が変わるかが分かる
      - レーダーの値の「真値」と「デシベル」の違い、平均を取る順番でAIが間違える箇所に気づける
    say: この章を終えると、3つのことができるようになります。1つ目、同じ場所、近い日の光学とレーダーの画像を並べ、日付と範囲がそろっているかと、値の単位を確かめられること。2つ目、光学とレーダーは測っているものが違うこと、そして雲の日と水面で見え方がどう変わるかが分かること。3つ目、レーダーの値の真値とデシベルの違いと、平均を取る順番でAIが間違える箇所に気づけることです。たとえば、光学では湖が暗いのにレーダーでは明るい、という結果が出たとき、衛星の違いなのか、条件の違いなのかを、自分で切り分けられるようになります。

  - kind: figure
    heading: しくみ：測っているものが違う
    image: figures/codex-1-2-optical-vs-radar-view/compare.svg
    say: まず、しくみです。光学衛星のSentinel-2は、太陽の光が地表で反射した明るさを、波長帯ごとに測ります。値は、0から1の小数の反射率に直して使います。雲があれば、雲の上面の明るさを測ることになり、地表は見えません。水は近赤外を吸収するので、水面は近赤外で暗く写ります。レーダー衛星のSentinel-1は、自分で電波を出し、地表から跳ね返ってきた強さを測ります。合成開口レーダ、SARと呼ばれ、Cバンド、波長約5.6cmの電波を使います。天候に関係なく、昼でも夜でも観測できます。雲の日に地表が見えるのは、この性質のためです。レーダーの明るさは、地表のざらつきで決まります。静かな水面のような滑らかな面は、電波が衛星と反対の向きに跳ね返るので、画像では黒く写ります。ざらついた面は電波をあらゆる向きに返すので明るく、濡れているとさらに明るく写ります。建物や橋は、角で電波を返すので、明るい点になります。そして、風で波立った水面は、電波の波長に近い細かい波があると、明るく返ることがあります。つまり、光学の、水面が暗い、と、レーダーの、水面が暗い、は、理由が違います。

  - kind: table
    heading: 並べる前にそろえる3つ
    columns: [そろえるもの, 光学 Sentinel-2, レーダー Sentinel-1]
    widths: [0.20, 0.38, 0.42]
    rows:
      - [日付と時刻, 現地時間の午前10時30分ごろに赤道を通る。2機で5日に1回, 午後6時に赤道を通る軌道。観測は朝か夕方。1機で12日、2機で6日に1回]
      - [範囲と座標, Level-2Aは110km四方の区画。地図の座標（UTM）に載っている, Level-1 GRDは地球を楕円とみなした投影。山の斜面はずれて写る。地形の補正が要る]
      - [画素の細かさ, 10m, 画素の間隔は10mだが、分解能はおよそ20m×22m]
      - [値の単位, 反射率（0〜1の小数）, 画素の値は整数。較正の表でσ0の真値に直し、10×log10でdBに。0.1は−10dB、0.01は−20dB]
    say: 並べるときに、そろえるものが3つあります。表の左が光学のSentinel-2、右がレーダーのSentinel-1です。1つ目は、日付と時刻です。同じ日でも、同じ時刻ではありません。Sentinel-2は、現地時間の午前10時30分ごろに赤道を通る軌道です。Sentinel-1は、午後6時に赤道を通る軌道で、観測は現地時間の朝か夕方です。洪水のように数時間で変わる現象では、同じ日でも別の状態を見ています。頻度も違います。Sentinel-2は2機で5日に1回。Sentinel-1は1機で12日、2機で6日に1回です。同じ日の2枚は、いつでもあるわけではありません。2つ目は、範囲と座標です。Sentinel-2のLevel-2Aは、110km四方の区画に切られ、地図の座標に載っています。Sentinel-1のLevel-1 GRDは、電波の往復の距離を地面の距離に直した画像で、地球を楕円の形とみなして投影しています。山の斜面は、地図の位置からずれて写ります。これを直すのが地形の補正で、補正をしてから地図の座標に載せないと、光学と画素どうしで重なりません。画素の細かさも違います。GRDの画素の間隔は10mですが、分解能はおよそ20m掛ける22mで、Sentinel-2の10mと同じ細かさではありません。3つ目は、値の単位です。GRDの画素の値は、跳ね返りの大きさを表す整数で、そのままでは物理的な値ではありません。製品に付いた較正の表を使って、地表がどれだけ電波を返したかの値、後方散乱係数、シグマゼロに直します。較正の表は、シグマゼロを真値、つまりそのままの比率で与えます。真値は小さな小数で桁の幅が広いので、10掛けるlog10を当てた、デシベルで表すことが多いです。真値の0.1はマイナス10dB、0.01はマイナス20dBです。同じ値を2つの単位で書けるので、コードの中でどちらを扱っているかを、常に意識します。

  - kind: figure
    heading: 手順：5つ
    image: figures/codex-1-2-optical-vs-radar-view/align.svg
    say: 手順は5つです。1、場所と期間を決め、2つの衛星の製品の名前を取る。人の仕事です。入れるのは境界のファイルと期間で、出るのは製品の名前の一覧と、名前から読んだ観測の日時です。2、日付と時刻の差を表にさせる。AIです。組み合わせごとの時刻の差の表が出るので、差が小さい組を人が選びます。3、範囲と座標をそろえさせる。AIと人です。レーダー側に地形の補正をして、同じ地図の座標と同じ画素の大きさに直した2枚を出させます。画素の大きさをどちらに合わせたかを表示させます。4、値の単位をそろえさせる。AIと人です。較正の表を使って、シグマゼロの真値の画像と、dBに直した画像の両方を出させ、どの行で真値からdBに変えたかを表示させます。5、答えの分かっている場所で並べて見る。人です。湖、森、市街地の位置を入れて、光学で湖が近赤外で暗い、レーダーで静かな湖が黒い、市街地がレーダーで明るい、の3つが成り立つかを判定します。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.32, 0.68]
    rows:
      - [同じ日の光学とレーダーを並べて, 製品の名前から観測の日時を読み、時刻の差を表にして、最も小さい組を選んで]
      - [レーダーの値をdBにして, 較正の表でσ0の真値に直してから、10×log10でdBにして。変えた行を表示して]
      - [2枚を重ねて, レーダーに地形の補正をしてから、同じ地図の座標と画素の大きさに直して。どちらに合わせたかを表示して]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。同じ日の光学とレーダーを並べて、と頼むと、AIは日付の文字が同じ2枚を取ります。時刻は見ません。代わりに、製品の名前から観測の日時を読み、時刻の差を表にして、最も小さい組を選んで、と頼みます。レーダーの値をdBにして、ではなく、較正の表でシグマゼロの真値に直してから、10掛けるlog10でdBにして。どの行で変えたかを表示して。2枚を重ねて、ではなく、レーダーに地形の補正をしてから、同じ地図の座標と画素の大きさにして。どちらに合わせたかを表示して。指示の7項目のうち、手順と確かめ方に、こうした具体的な文を入れます。確かめ方には、選んだ組の時刻の差、地形の補正に使った標高のデータの名前、dBに直す行と平均を取る行の順番を、表示させることを書きます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 同じ場所の光学とレーダーを並べる（誤りあり）
      s2 = first(search(area, "2025-07-11", "S2 L2A"))
      s1 = first(search(area, "2025-07-11", "S1 GRD"))  # 同じ日
      nir = (read_band(s2, "B8") + offset["B8"]) / quant
      vv_db = read_band(s1, "VV")              # dB のσ0
      vv_mean = mean_window(vv_db, 5)          # 5画素の平均
      water_s2 = nir < 0.05
      water_s1 = vv_mean < -18
      show_side_by_side(water_s2, water_s1)
    highlight: [2, 3, 5, 6, 9]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。手元で数分でできます。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。Sentinel-1のGRDの画素の値は、すでにdBのシグマゼロです。同じ日付の製品なら同じ時刻の観測なので、そのまま重ねられます。自信のある口調です。画面がそのコードです。当てる観点は5つ。1、観測の日時を、日付ではなく時刻まで比べているか。2、GRDの画素の値を、較正の表でシグマゼロに直しているか。3、平均を、真値で取ってからdBにしているか。4、地形の補正をしてから重ねているか。5、雲の画素に印を付けているか。まず、2行目と3行目を見てください。日付の文字が同じ製品を、先頭から1つずつ取っています。次に、5行目。読んだ値を、そのままdBのシグマゼロとして扱っています。6行目は、そのdBの値を5画素で平均しています。最後に、9行目。地形の補正も、座標と画素の大きさをそろえる処理もなく、並べています。ここで1つ、大事なことがあります。このコードは、動かしても止まりません。2枚の地図が並んで出ます。だから、動いたかどうかでは、誤りに気づけません。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.07, 0.15, 0.36, 0.42]
    rows:
      - ["2-3", 比べる条件, 日付の文字が同じ製品を先頭から取る。「同じ日付なら同じ時刻」, 光学は午前10時30分ごろ、レーダーは朝か夕方で、数時間ずれる。名前から日時を読み、差を表にして人が選ぶ]
      - ["5", 値の倍率, 画素の値をそのまま「dBのσ0」, 画素の値は整数。較正の表でσ0の真値に直し、そのあと10×log10でdBに]
      - ["6", 値の倍率, dBにした値を平均, 平均は真値で取り、そのあとdBに。順番が違うと値が変わる]
      - ["9", 位置と座標, 補正も、座標と画素の大きさの統一もなく並べる, レーダーに地形の補正をして、同じ地図の座標と画素の大きさに直してから並べる]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、2行目と3行目。Sentinel-2は午前10時30分ごろ、Sentinel-1は朝か夕方の観測で、同じ日でも数時間ずれます。AIの、同じ日付なら同じ時刻、は誤りです。正しくは、製品の名前から観測の日時を読み、時刻の差を表にして、人が組を選びます。2つ目、5行目。GRDの画素の値をそのまま、dBのシグマゼロとして扱っています。画素の値は跳ね返りの大きさを表す整数で、較正の表でシグマゼロの真値に直し、そのあと10掛けるlog10でdBにします。AIの、すでにdB、は誤りです。3つ目、6行目。dBにした値を平均しています。平均は真値で取り、そのあとdBにします。順番が違うと、別の値になります。どれだけ変わるかは、次の場面で電卓で確かめます。4つ目、9行目。地形の補正をせず、座標も画素の大きさもそろえずに並べています。正しくは、レーダーに地形の補正をして、同じ地図の座標と画素の大きさに直してから並べます。もう1つ。しきい値の0.05とマイナス18には、出どころがありません。これは、答えの分かっている湖の値から人が決め、値と経緯を記録します。4つとも、動かしても止まりません。判定が出たので、AIに、4つの行について何が違うかを伝えて、直させます。

  - kind: table
    heading: 一緒に：平均の順番を電卓で確かめる
    columns: [手順, 計算, 結果]
    widths: [0.34, 0.40, 0.26]
    rows:
      - [2画素の真値を用意する, 0.01 と 0.1, −20dB と −10dB]
      - [真値で平均してからdBに, (0.01＋0.1)÷2＝0.055、これをdBに, 約 −12.6dB]
      - [dBにしてから平均, (−20＋(−10))÷2, −15dB]
      - [差を見る, −12.6 と −15 の差, 約 2.4dB]
    say: 3つ目の誤りを、電卓で確かめます。手元の電卓か表計算で、数分でできます。まず、2画素の真値を用意します。0.01と0.1です。dBにすると、マイナス20dBと、マイナス10dBです。次に、正しい順番。真値で平均します。0.01足す0.1、割る2で、0.055。これを10掛けるlog10でdBにすると、約マイナス12.6dBです。今度は、AIのコードの順番。dBにしてから平均します。マイナス20足すマイナス10、割る2で、マイナス15dBです。差は、約2.4dB。コードのしきい値はマイナス18dBでしたから、この差は、しきい値をまたぐ大きさです。平均の順番だけで、水と判定される画素が変わります。この例は、説明のための計算で、実際の画像の値ではありません。しかし、自分の手で一度計算しておくと、AIが、dBにしてから平均、と書いてきたときに、すぐ気づけます。

  - kind: bullets
    heading: 結果の目視観点5つ
    items:
      - 湖が、光学の近赤外で暗く、レーダーで黒いか。両方で暗ければ、座標がそろっている手がかり
      - 市街地が、レーダーで明るいか。暗ければ、座標か、単位の向き（真値とdB）を疑う
      - 山の尾根と川が、2枚で同じ位置にあるか。レーダー側だけ山の側にずれていれば、地形の補正をしていない
      - 光学の雲の画素が、レーダーの結果に影響していないか。雲の下は、レーダーだけで見た場所と分かる印を残す
      - 表の単位が、列ごとに書いてあるか。真値の列とdBの列が混ざった表は、しきい値の判断を狂わせる
    say: 直したら、並べた2枚の地図と、答えの分かっている場所の表を目で確かめます。見るのは5つ。1つ目、湖が、光学の近赤外で暗く、レーダーで黒いか。両方で暗ければ、座標がそろっている手がかりになります。2つ目、市街地が、レーダーで明るいか。建物は角で電波を返して明るい点になります。市街地が暗ければ、座標か、単位の向きを疑います。3つ目、山の尾根と川が、2枚で同じ位置にあるか。レーダー側だけ山の側にずれていれば、地形の補正をしていません。4つ目、光学の雲の画素が、レーダーの結果に影響していないか。雲の画素はシーン分類で印が付きます。雲の下は、レーダーだけで見ている場所だと分かるように、地図に印を残します。5つ目、表の単位が、列ごとに書いてあるか。真値の列とdBの列が混ざった表は、しきい値の判断を狂わせます。おかしな結果の例を2つ。例1、光学では湖が暗いのに、レーダーでは湖が明るい。まず、2枚の観測の時刻を見ます。次に、風を疑います。風で波立った水面は、細かい波があると明るく返ることがあります。原因は衛星の違いではなく、時刻と風の条件です。2枚とも正しく、見ている状態が違います。例2、並べた地図で、レーダー側の山の尾根が、光学の尾根より衛星の側にずれている。レーダーの画像で山が衛星の側に倒れて見える現象で、地形の補正をしていません。平地では目立たないので、平地だけで座標を確かめると見逃します。言えるのは、3つをそろえた2枚で、この場所がどう見えたか、です。言えないのは、片方だけで水に見える場所が本当に水か、です。レーダーの黒は、舗装や乾いた砂地のような滑らかな面でも起きます。光学の暗さは、雲の影でも起きます。片方だけの判定は候補です。現地か、別の日の画像で確かめます。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 同じ日の2枚がない期間。光学は5日に1回、レーダーは6〜12日に1回。差が大きければ、近い日だと報告に書き、変化の速い現象には使わない
      - 山が多く、標高のデータがない範囲。地形の補正ができず、レーダー側の位置がずれたまま
      - 風の強い日の水面。波立った水面はレーダーで明るくなることがあり、水の判定の物差しに使えない
      - 画面で切り抜いた画像。製品の名前と較正の表がないと、観測の時刻も、σ0への直し方も分からない
      - 有償の商用データ。3つの確認は同じ。観測の時刻を指定でき、値の単位と較正の方法は契約の仕様書で決まる
    say: 向かない条件も、押さえておきます。1つ目、同じ日の2枚がない期間。Sentinel-2は5日に1回、Sentinel-1は6日から12日に1回です。時刻の差が大きい組しかなければ、近い日であることを報告に書き、変化の速い現象には使いません。2つ目、山が多く、標高のデータがない範囲。地形の補正ができないと、レーダー側の位置がずれたままです。平地だけで座標を確かめても、山の部分は重なりません。3つ目、風の強い日の水面。波立った水面はレーダーで明るくなることがあり、水の判定の物差しとして使えません。4つ目、画面で切り抜いた画像。製品の名前と較正の表がないと、観測の時刻も、シグマゼロへの直し方も分かりません。5つ目、有償の商用データを使うとき。3つの確認は変わりません。変わるのは、観測の時刻を指定できることと、値の単位と較正の方法が契約の仕様書で決まることです。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 場所と期間を決め、2つの衛星の製品の名前と観測の日時を取る（人）
      - 時刻の差を表にさせ、差が小さい組を選ぶ（AIと人）
      - 地形の補正をして、同じ地図の座標と画素の大きさに直させる（AIと人）
      - 較正の表でσ0の真値に直し、平均してからdBにさせる（AIと人）
      - 湖、森、市街地で、光学とレーダーの見え方が物差しと合うかを見る（人）
    say: 手順をまとめます。1、場所と期間を決め、2つの衛星の製品の名前と、名前から読んだ観測の日時を取る。人です。2、時刻の差を表にさせ、差が小さい組を選ぶ。AIと人です。3、レーダーに地形の補正をして、同じ地図の座標と画素の大きさに直させる。AIと人です。4、較正の表でシグマゼロの真値に直し、平均してからdBにさせる。どの行で変えたかを表示させます。AIと人です。5、湖、森、市街地で、光学とレーダーの見え方が物差しと合うかを見る。人です。この5つを、光学とレーダーを並べるたびに、毎回繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      光学：  Sentinel-2 L2A  観測 2025-07-11T01:36（世界時） 雲 38%
      レーダー：Sentinel-1 GRD  観測 2025-07-11T09:12（世界時） VV
      湖の中心  光学の近赤外 0.03   レーダーのVV −21.4 dB
      市街地    光学の近赤外 0.21   レーダーのVV −22.8 dB
      山の尾根  レーダー側が衛星の側にずれて見える
      コード：vv_db = read_band(s1, "VV")  # dB のσ0

      問い：この結果から最初に疑うべきことはどれか
      A. 観測の時刻が約8時間ずれているので、洪水の状態が違う
      B. 市街地のレーダーの値が湖と同じくらい暗く、σ0に直していない
      C. 雲の画素が38%もあるので、光学の結果は使えない
      D. 尾根がずれているのは、レーダーの分解能が光学より粗いため
    highlight: [3, 4, 6]
    notes:
      - 答えは動画では言いません
      - 答えと解説はサイトで
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、大雨の翌日の光学とレーダーの画像を同じ場所で並べて、水に見える場所を出して、と頼みました。AIが返した地図と表が、画面のものです。光学はSentinel-2のLevel-2Aで、観測は7月11日の1時36分、世界時。雲の画素は38%。レーダーはSentinel-1のGRDで、観測は同じ日の9時12分、世界時。湖の中心は、光学の近赤外が0.03、レーダーのVVがマイナス21.4dB。市街地は、光学の近赤外が0.21、レーダーのVVがマイナス22.8dB。山の尾根は、光学と並べると、レーダー側が衛星の側にずれて見えます。コードの該当する行は、VVを読んでdBのシグマゼロとする、でした。この結果から、最初に疑うべきことはどれでしょうか。A、観測の時刻が約8時間ずれているので、洪水の状態が違う。B、市街地のレーダーの値が湖と同じくらい暗く、画素の値をシグマゼロに直していない。C、雲の画素が38%もあるので、光学の結果は使えない。D、山の尾根がずれているのは、レーダーの分解能が光学より粗いため。この動画で見た、市街地の見え方の物差しと、値の単位の確認を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。平均の順番の問題を2行で書く、問2の短答も、そこにあります。

