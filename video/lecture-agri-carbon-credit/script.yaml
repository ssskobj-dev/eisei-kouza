# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第2部「カーボンクレジット：中干しの延長を衛星データで証明できるか」（learn/agri/agri-carbon-credit.qmd）
title: 衛星データで中干しの延長を証明できるか：J-クレジットの証拠と5つの限界
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 8
total: 30
thumb: 中干しの証拠
summary: 水稲の中干しを7日間以上延ばすと、J-クレジット制度で削減量をクレジットにできます。その証拠に衛星データは使えるのか。制度が求める記録と写真、衛星による湛水の判定が実証段階であること、農業法人が今年から残す記録の表を、農林水産省、内閣府、JAXAの公開資料にもとづいて一緒に作ります。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 中干しの延長を衛星で証明できるか
    sub: 制度が求める証拠と、衛星データが今できることの線を引く
    say: 水稲の中干しを延ばしてJ-クレジットを得るとき、衛星データは証拠になるでしょうか。答えは、今はなりません。審査に出す証跡は記録と写真で、衛星によるモニタリングはまだ認められておらず、JAXAが実証を進めている段階です。この動画では、制度が求める証拠と、衛星データが今できることの線を引き、農業法人が今年から残す記録の表を一緒に作ります。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 衛星データが使われ始めている場面と、まだ実証段階の点を、事業者や買い手に説明できる
      - 制度が求める記録と写真を、自分の水田の管理の流れに組み込める
      - 衛星や水位センサーを「審査の証跡」ではなく「自分の記録の確かめ」として使う線引きができる
    say: この章を終えると、3つのことができるようになります。衛星データが証拠として使われ始めている場面と、まだ実証段階の点を、取りまとめ事業者や買い手に説明できること。制度が求める記録と写真を、自分の水田の管理の流れに組み込めること。そして、衛星や水位センサーを、審査の証跡ではなく、自分の記録の確かめとして使う線引きができることです。

  - kind: figure
    heading: 結論：衛星と人の分担
    image: figures/agri-carbon-credit/conclusion.svg
    say: 先に結論です。衛星でできるのは、全ての水田を同じ日に見ること、水が張られているかの目安を出すこと、過去の画像で自分の記録を確かめること。人が行うのは、中干しの開始日と終了日の写真を撮ること、直近2か年の記録を揃えること、取りまとめ事業者と証拠の形を決めることです。衛星は、審査の証跡ではなく、自分の記録の確かめに置きます。

  - kind: bullets
    heading: 制度の仕組みと欲しい成果
    lead: J-クレジットの方法論「水稲栽培における中干し期間の延長」
    items:
      - 直近2か年以上の実施日数の平均より7日間以上延ばすと、削減量をクレジットにできる
      - 7日間の延長でメタンの発生量を3割減。水田のメタンは日本全体の約4割
      - 2025年11月までの認証量は累計307,323 t-CO2、プロジェクト26件、令和7年度の面積は約79,700ha
      - 証跡は、全ての水田の開始日と終了日。写真は1組を、同一の管理の水田ごとに少なくとも1点
      - 7月の暑い時期に分散した水田を回る負担は小さくない。買い手に通る根拠も欲しい
    say: まず、制度の仕組みです。中干しは、出穂前に水田の水を抜いて田面を乾かす作業です。J-クレジットの方法論は、その水田の直近2か年以上の実施日数の平均より7日間以上延ばすと、削減量分のクレジットを認証します。7日間の延長でメタンの発生量を3割減らせることが確かめられていて、水田からのメタンは日本全体のメタン排出の約4割を占めます。2025年11月までの認証量は累計で307,323トン、プロジェクトは26件、令和7年度の取り組み面積は40道府県で約79,700ヘクタールです。農業法人が欲しいのは2つです。1つは、証拠を軽く残したいこと。クレジットには、全ての水田について開始日と終了日の証跡が要り、写真は開始日と終了日を1組として、同一の管理の水田ごとに少なくとも1点です。7月の暑い時期に、分散した水田を回って撮る負担は小さくありません。もう1つは、第三者に通る根拠が欲しいことです。クレジットは買い手に渡るので、自分の記録と写真のほかにも裏付けがあれば、説明が楽になります。

  - kind: figure
    heading: 強み：レーダ衛星の見え方
    image: figures/agri-carbon-credit/sar.svg
    say: 衛星の強みは2つです。1つ目は、客観的に示せること。合成開口レーダ、SARの衛星は、水面のような滑らかな面では電波が戻りにくく暗く写り、粗い面は明るく写ります。JAXAの資料は、秋田県大潟村の例で、2024年6月16日の画像では水田が暗く水が張られているのが分かり、9月8日の画像では水が抜けて明るく変わったことを示しています。全ての水田を同じ日に、誰が撮っても同じ条件で見られます。2つ目は、過去に遡れること。方法論は直近2か年以上の実施日数を基準にし、制度の案内は、現行の中干し期間を証明できないとクレジット化できないと明記しています。だいち2号の事業化実証では、過去の観測データから過去2年の中干し日数の平均を推定する試みが行われました。2年前の記録が手元にない法人にとって、記憶と記録を確かめる材料になります。

  - kind: figure
    heading: 現在の5つの限界
    image: figures/agri-carbon-credit/limits.svg
    say: 限界は5つです。1つ目、制度では衛星のモニタリングが認められていません。内閣府の資料、2025年11月時点では、この方法論で衛星を用いたモニタリングは認められておらず、JAXAが民間企業と連携して可能性を実証しているとあります。2つ目、湛水か非湛水かの判定は研究の途中です。JAXAは2025年6月に秋田県大潟村と宮城県登米市に水位センサーを置き、衛星データと突き合わせています。3つ目、観測の間隔が中干しの長さに対して粗いことです。中干しは1から2週間。Sentinel-1の回帰は1機あたり12日、だいち4号は14日です。1機の衛星が同じ水田を同じ向きから見る間隔は、中干しの期間と同じくらいか、それより長くなります。制度は7日間が連続していることを求め、途中で差し水をすると中干しは終了したとみなしますが、数日の空白の間に差し水があったかどうかは、衛星では言えません。4つ目、稲が茂った下の水面は、確かめている途中です。5つ目、減収の判断と差し水は衛星では分かりません。延ばすか止めるかは、稲の状態を見て人が決めることです。

  - kind: figure
    heading: 落とし所：5つの手順
    image: figures/agri-carbon-credit/flow.svg
    caption: 4つ目だけ衛星と解析。ほかは人が行う
    say: 限界を踏まえると、衛星の役割は、自分の記録と写真の確かめと、買い手への補足の説明です。手順は5つ。1、直近2か年の中干しの開始日と終了日、稲わらの持ち出し、堆肥の施用の記録を揃え、証明できない水田は対象から外す。2、プログラム型の取りまとめ事業者に参加するか自分で登録するかを決め、証拠の形を事業者と合わせる。3、開始日と終了日の写真を、同一の管理の水田ごとに撮る運用を決める。誰が、どの水田を、どの順で回るか。4、衛星の画像や水位センサーで、自分の記録と矛盾がないかを確かめ、食い違う水田は原因を記録に残す。5、制度が衛星のモニタリングを認めたら、写真から切り替えられるかを検討する。4つ目だけが衛星の仕事で、ほかは人が行います。写真が抜けた水田があったとき、衛星の画像で日付の見当を付けて記録を補う、という使い方です。

  - kind: table
    heading: 費用と収入を分けて考える
    columns: [項目, 中身, 章にある数字]
    widths: [0.22, 0.40, 0.38]
    rows:
      - [人の手間, 写真と記録が中心。日減水深の実測は水田1か所で開始年に1回, 認証に使ったデータは認証対象期間の終了後2年まで保存]
      - [事業者との契約, 単価は購入者との相対取引。手数料と配分は事業者ごとに違う, "2025年11月に農業区分で5,374円/t-CO2の取引例"]
      - [クレジットの収入, 量は地域、排水性、施用有機物で変わる, "約3.7 tCO2/ha/年、5,000円/tで約1.85万円/ha など。単価を仮定したモデルの数字"]
    say: 費用と収入は、3つに分けて考えます。人の手間は、写真と記録が中心です。排水性の区分に使う日減水深の実測は、管理する水田のうち1か所で、プロジェクト開始年に1回行えばよいとされています。認証に使ったデータは、認証対象期間の終了後2年経過するまで保存します。事業者との契約では、クレジットの単価は購入者との相対取引で決まり、取りまとめ事業者の手数料と配分は事業者ごとに違うので、契約の前に確かめます。2025年11月には、農業区分の中干し期間の延長が、1トンあたり5,374円で取引された例があります。クレジットの収入の量は、水田の所在地域、排水性、施用する有機物で変わります。農林水産省の資料の例では、排水性が十分よく稲わらを全量すき込んだ水田で年に1ヘクタールあたり約3.7トンが発行され、1トン5,000円で売れた場合に約1万8500円。別の資料は、1トン1万円の場合に10アールあたり1,100円から4,000円程度を想定しています。いずれも単価を仮定したモデルの数字で、実績ではありません。衛星の費用は、今は数えなくて構いません。制度の証跡にならないので、無償の衛星の画像を自分で見る範囲にとどめます。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 手順の1つ目「直近2か年の記録を揃える」を、紙1枚で始めます
    items:
      - 用意するもの：紙1枚か表計算のファイル。去年と今年の作業日誌
      - 水田を1枚ずつ行にして、中干しの開始日と終了日、稲わら、堆肥の欄を埋める
      - 日付が書けない水田は、空欄のまま「証明できない」と印を付ける
      - 衛星や水位センサーの欄は「確かめ」用。証跡の欄ではない
    say: ここからは、一緒にやってみましょう。5つの手順のうち1つ目、直近2か年の記録を揃える作業を、紙1枚で始めます。用意するものは、紙1枚か表計算のファイルと、去年と今年の作業日誌です。水田を1枚ずつ行にして、中干しの開始日と終了日、稲わらの持ち出し、堆肥の施用の欄を埋めていきます。日付が書けない水田は、空欄のまま、証明できないと印を付けます。その水田は今年の申請の対象から外し、記録を貯める水田にします。衛星や水位センサーの欄は確かめ用で、証跡の欄ではありません。

  - kind: table
    heading: 記録の表を作る
    columns: [欄, 書くこと, 誰が・何で]
    widths: [0.26, 0.42, 0.32]
    rows:
      - [去年の開始日・終了日, 作業日誌から。書けなければ「証明できない」, 人・日誌]
      - [今年の開始日・終了日, 水を抜いた日と、水を入れた日, 人・日誌]
      - [写真, 開始日と終了日を1組。同一の管理の水田ごとに少なくとも1点, 人・スマートフォン]
      - [稲わら・堆肥, 持ち出しの有無、施用の有無と量, 人・日誌]
      - [確かめ, 衛星や水位センサーと食い違ったら原因を書く, 衛星・センサー（証跡ではない）]
    say: 表の欄はこの5つです。1行目、去年の開始日と終了日。作業日誌から写し、書けなければ証明できないと書きます。2行目、今年の開始日と終了日。水を抜いた日と、水を入れた日です。3行目、写真。開始日と終了日を1組として、同一の管理の水田ごとに少なくとも1点。誰がどの水田をどの順で回るかも、ここで決めます。4行目、稲わらと堆肥。持ち出しの有無と、施用の有無と量です。5行目、確かめ。衛星の画像や水位センサーと食い違ったら、その原因を書きます。この行だけが衛星の出番で、証跡ではないことを欄の名前で分かるようにしておきます。数字が埋まらなくても構いません。空欄の場所を先に決めておくことが大切です。

  - kind: prompt
    heading: 買い手への説明を直す
    label: 悪い例
    text: |
      当社の水田は、衛星の画像で中干しが確認されています。
      この画像が証明なので、第三者の検証に耐えます。
    say: 表ができたら、買い手や取りまとめ事業者に衛星の画像を見せるときの言い方も直しておきます。悪い例です。当社の水田は、衛星の画像で中干しが確認されています。この画像が証明なので、第三者の検証に耐えます。衛星で証明したと受け取られる言い方です。後で、制度の証跡ではないと分かったときに、信頼を失います。

  - kind: prompt
    heading: 言えないこと3点を添える
    label: 良い例
    text: |
      証跡は、水田ごとの記録と、開始日と終了日の写真です。
      衛星の画像は、その記録と矛盾がないかを確かめた補足です。
      添える3点：
      ・制度の証跡ではありません
      ・湛水の判定は実証段階です
      ・観測日の間の状態は分かりません
    say: 良い例です。証跡は、水田ごとの記録と、開始日と終了日の写真です。衛星の画像は、その記録と矛盾がないかを確かめた補足です。そして3点を添えます。制度の証跡ではないこと。湛水の判定は実証段階であること。観測日の間の状態は分からないこと。この3点を省かないことが、買い手への説明で最も大切です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 直近2か年の記録を水田ごとに揃え、証明できない水田は外す
      - 取りまとめ事業者に参加するか決め、証拠の形を合わせる
      - 開始日と終了日の写真を、同一の管理の水田ごとに撮る運用を決める
      - 衛星や水位センサーで記録を確かめ、食い違いは原因を残す
      - 衛星の画像を見せるときは「言えないこと」3点を添える
      - 制度が衛星を認めたら、写真から切り替えられるか検討する
    say: 手順をまとめます。1、直近2か年の記録を水田ごとに揃え、証明できない水田は外す。2、取りまとめ事業者に参加するか自分で登録するかを決め、証拠の形を合わせる。3、開始日と終了日の写真を、同一の管理の水田ごとに撮る運用を決める。4、衛星や水位センサーで自分の記録を確かめ、食い違いは原因を残す。5、衛星の画像を見せるときは、言えないこと3点を添える。6、制度が衛星のモニタリングを認めたら、写真から切り替えられるか検討する。最初の一歩は、今年の中干しの記録を、水田ごとに日付と写真で残すことです。去年の記録がない法人は、今年から2年分を貯めます。

  - kind: bullets
    heading: 宿題：言えないことは？
    bold: true
    items:
      - 場面：水田40筆を、レーダ衛星の7月の2つの観測日（12日おき）で見比べた。1回目はほとんど暗く、2回目は30筆が明るい
      - A. 2回目の観測日には、30筆で水が抜けていた可能性が高い
      - B. 30筆の中干しは、2つの観測日の間に始まった可能性が高い
      - C. 30筆では7日間以上連続して中干しが行われ、途中の差し水はなかった
      - D. 2回目に暗いままの10筆は、まだ水が張られていた可能性がある
    say: 宿題です。ある農業法人が、自社の水田40筆について、レーダ衛星の画像を7月の2つの観測日、12日おきで見比べました。1回目はほとんどの筆が暗く、2回目は30筆が明るく写っていました。法人は、今年から中干し期間の延長でJ-クレジットの申請を考えています。この結果から、言えないことはどれでしょうか。A、2回目の観測日には、30筆で水が抜けていた可能性が高い。B、30筆の中干しは、1回目と2回目の観測日の間に始まった可能性が高い。C、30筆では、7日間以上連続して中干しが行われ、途中の差し水はなかった。D、2回目に暗いままの10筆は、まだ水が張られていた可能性がある。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに3問あります。

  - kind: cta
    heading: 記録の表を作ったら、章のページへ
    action: 向き不向きの表とケース問題4問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-carbon-credit.html
    credits:
      - "出典：農林水産省「『水稲栽培における中干し期間の延長』のJ－クレジット制度について」（令和8年7月）"
      - "出典：農林水産省「J－クレジット制度を活用して稲作の『中干し期間延長』に取り組んでみませんか？」（令和7年12月版）"
      - "出典：農林水産省「農林水産分野におけるカーボン・クレジットの推進について」（2026年3月、数字は2025年11月現在）"
      - "出典：内閣府「衛星リモートセンシングデータ利用タスクフォース 案件整理リスト」（令和7年11月現在）"
      - "出典：JAXA「地球にやさしいお米作り〜『だいち2号』、『だいち4号』によるカーボンクレジットへの貢献に向けた実証〜」（2025年7月14日）"
      - "収益の例は販売単価を仮定したモデルの数字で、実績ではありません。制度の方法論と衛星の扱いは変わる可能性があるので、申請の前に最新版を確かめてください"
    say: この章のページには、法人の条件ごとの向き不向きの表と、ケース問題4問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
