# ユースケース解説動画の台本。元の記事：casebook/defense-constellation-imagery.qmd
title: 衛星データを買う契約の組み方：防衛省と民間の衛星群、6年で約2,831億円
series: CASEBOOK
kicker: ユースケース解説
number: 10
total: 221
thumb: 衛星を買わずに
summary: 防衛省が2026年2月、民間企業が保有・運用する小型衛星群から画像を受け取る契約を結んだ事例。衛星を自前で持たずに画像の供給を長期契約で確保する仕組み、公表されている金額と期間、まだ公表されていないこと、同じ型をほかの発注者が検討するときに確かめることを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データを買う契約の組み方
    sub: 防衛省と民間の衛星群、6年で約2,831億円
    say: 衛星を自分で持たずに、欲しい場所の画像を途切れずに受け取る方法はあるか。答えは、民間の衛星群と長期の契約を結び、画像の供給そのものを買うことです。防衛省は2026年2月、この形で6年間、約2,831億円の契約を結びました。この動画では、契約の仕組み、公表されている金額と期間、まだ公表されていないこと、そして同じ型をほかの発注者が検討するときに確かめることを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。発注は防衛省
      - 受注：三菱電機、スカパーJSAT、三井物産が設立した特別目的会社「トライサット・コンステレーション」。協力企業を含めて7社
      - 何のために：脅威の圏外から目標に対処する能力を支える画像情報を、安定して得る
      - 困りごと：自前の衛星は整備に時間と費用がかかり、都度の購入は撮りたいときに撮れる保証がない
    say: 事例の舞台は日本、発注するのは防衛省です。受注したのは、三菱電機、スカパーJSAT、三井物産の3社が設立した特別目的会社、トライサット・コンステレーションで、協力企業を含めると7社の体制です。目的は、脅威の圏外から目標に対処する能力を支える画像情報を、安定して得ることです。従来は、国が自ら衛星を持つか、画像を必要なときに事業者から買うかのどちらかでした。前者は整備に時間と費用がかかり、後者は撮りたいときに撮れる保証がありません。そこで、民間が多数の小型衛星と専用の地上施設を保有・運用し、防衛省が優先して画像を受け取る形を選びました。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-defense-constellation-imagery/flow.svg
    caption: 画像の供給を長期契約で確保する6つの手順
    say: 同じ型を、ほかの官公庁や大きな組織が使うとしたら、業務の流れはこうなります。まず、撮りたい場所と、どのくらいの間隔で撮りたいかを決めます。次に、レーダーか光学か、夜間や雨天の扱い、届くまでの時間といった要件を仕様にまとめます。事業者を選び、衛星と地上施設を事業者が保有する形で契約します。衛星が順に打ち上がる間は、使える範囲で画像を受け取り、判読の体制を整えます。届いた画像を判読し、変化のあった地点に追加の撮影を指示します。最後に、衛星の寿命を見て、次の契約を準備します。発注する側に残る仕事は、1、2、5、6です。

  - kind: figure
    heading: 事業者が行うことと、発注者が行うこと
    image: figures/usecase-defense-constellation-imagery/split.svg
    say: 役割の分担を見ます。民間の事業者が行うのは、衛星と地上施設を保有して運用すること、高頻度に画像を撮って届けること、衛星の寿命まで維持することです。発注者が行うのは、撮る場所と頻度を指定すること、届いた画像を判読すること、次の契約を準備することです。経過も確かめておきます。2025年12月24日に入札で落札者が決まり、2026年2月19日に契約を結びました。方式は、民間の資金で整備し、民間が保有したまま運用するPFIという形です。衛星の構成は、電波で地表を捉えるレーダー衛星、SARを中心に、光学衛星を組み合わせるとしています。事業期間は6年間で、準備に1年、小型衛星の寿命を5年とみた組み立てです。実証ではなく本格運用を前提とした契約ですが、2026年10月の時点では、衛星群の構築はまだ途中です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [関心地域の時系列の画像（SARと光学）, どの地点に追加の撮影を当てるか]
      - [前回との変化の抽出結果, 判読の人員をどこに割くか]
      - [撮影の実績（回数、間隔、欠測）, 契約どおりの頻度が出ているか、仕様を見直すか]
      - [衛星の稼働の状況, 次の契約の時期と内容]
    say: 受け取るものと、それで決められることを整理します。関心のある地域の時系列の画像は、どの地点に追加の撮影を当てるかの根拠になります。前回との変化の抽出結果は、判読の人員をどこに割くかを決める材料です。撮影の実績、つまり回数、間隔、欠測の報告は、契約どおりの頻度が出ているか、仕様を見直すかの判断に使います。衛星の稼働の状況は、次の契約の時期と内容を決める材料です。この事例で防衛省が受け取る業務は、画像データの取得、専用の地上施設の運用、全般の管理の3つです。成果物がどこまで加工されたものかは、公表されていません。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-defense-constellation-imagery/limits.svg
    say: 限界は、技術そのものより、まだ公表されていないことと、仕組みの上の制約が中心です。1つ目、衛星の数と撮影の頻度は公表されていません。高頻度の中身は、外からは分かりません。2つ目、構築は2027年度までで、いまはその途中です。契約を結んだ時点で全部の能力が使えるわけではありません。3つ目、光学衛星は、雲があるときと夜間には撮れません。SARは雲や夜間でも撮れますが、光学と同じ見え方の画像にはなりません。4つ目、画像の取り扱いには法律の認定が要ります。日本の事業者が撮った細かいSAR画像は、取り扱う人に認定が必要です。5つ目、小型衛星の寿命は5年の見込みです。続けて受け取るには、次の契約や後継の衛星が要ります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-1は無償のSAR衛星。観測の間隔は1機あたり12日
      - 撮る場所と時期を、発注者が指定することはできない
      - 「指定した場所を、指定した頻度で撮る」ことに費用がかかっている
      - 公開画像や無償データで足りる用途なら、この型は要らない
    say: では、無償の衛星でどこまでできるでしょうか。欧州のSentinel-1は無償のSAR衛星で、観測の間隔は1機あたり12日です。ただ、撮る場所と時期を発注者が指定することはできません。この用途では、途切れずに短い間隔で、指定した場所を撮ることが求められるので、無償の衛星データでは成り立ちません。裏を返すと、この契約の費用は、指定した場所を指定した頻度で撮ることにかかっています。公開されている画像や無償データで足りる用途なら、この型は要らず、別の型になります。

  - kind: table
    heading: 費用は、いくらか（公表されている金額）
    columns: [項目, 公表されている値と仮定]
    widths: [0.3, 0.7]
    rows:
      - [契約金額, "283,117,137,600円（税込）（防衛省の資料）"]
      - [契約期間, "2026年2月19日から2031年3月31日まで"]
      - [予算, "2025年度の防衛関係予算に2,832億円（財務省、2025年4月）"]
      - [年あたり, "仮定：約5年で単純に割ると、年に約560億円。支払いの内訳は非公表"]
      - [費用の中身, 衛星と地上施設の整備と、5年間の運用が大半。民間が保有し、発注者は対価を払う]
    say: 費用は、この事例では公表されています。契約金額は2,831億1,713万7,600円、税込みです。契約期間は、2026年2月19日から2031年3月31日までです。2025年度の防衛関係予算には、衛星コンステレーションの構築の開始として、2,832億円が計上されています。ここからは仮定です。契約金額を、準備期間を含む約5年で単純に割ると、年あたり約560億円になります。実際の支払いの時期と内訳は公表されていないので、目安にとどめてください。費用の大半は、衛星と地上施設の整備と、5年間の運用です。衛星を自前で持つ場合と比べて、整備の費用を一度に払わなくてよい一方、事業期間の終わりに衛星は手元に残りません。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [撮りたい頻度, 同じ場所を短い間隔で撮り続けたい, 年に数回、1枚あればよい]
      - [期間, 5年以上の長期で使う, 単年度の事業]
      - [場所と時期, 発注者が指定したい, 公開されている画像で足りる]
      - [予算, 整備と運用をサービス料として長期で払える, 単年度の予算で買い切りたい]
      - [体制, 画像を判読する人を自前で持てる, 判読まで外に任せたい]
    say: 最後に、向き不向きです。向いているのは、同じ場所を短い間隔で撮り続けたい、5年以上の長期で使う、撮る場所と時期を自分で指定したい、整備と運用の費用をサービス料として長期で払える、そして画像を判読する人を自前で持てる発注者です。逆に、年に数回1枚あればよい、単年度の事業、公開画像で足りる、単年度の予算で買い切りたい、判読まで外に任せたい、という場合は向きません。提案するときの要点は3つです。最初に、頻度と場所の指定が本当に要るかを確かめること。契約したらすぐ使える、と言わないこと。そして、画像を受け取る側の認定の体制まで、提案に含めることです。

  - kind: cta
    heading: 自分の組織で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：三菱電機「『衛星コンステレーションの整備・運営等事業』の契約締結について」（2026年2月20日） https://www.mitsubishielectric.co.jp/ja/pr/2026/0220/"
      - "出典：防衛省「衛星コンステレーション構築について」（宇宙安全保障部会 第68回 資料1-2） https://www8.cao.go.jp/space/comittee/27-anpo/anpo-dai68/siryou1-2.pdf"
      - "金額：財務省「特集 令和7年度 防衛関係予算について」（『ファイナンス』2025年4月号） https://www.mof.go.jp/public_relations/finance/202504/202504d.html"
      - "法律：内閣府「衛星リモートセンシング記録の適正な取扱いの確保に関する法律に関するFAQ集」（2025年6月30日）"
      - "衛星の仕様：Copernicus SentiWiki「Sentinel-1 Mission」"
    say: この事例をもとに、自分の組織や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
