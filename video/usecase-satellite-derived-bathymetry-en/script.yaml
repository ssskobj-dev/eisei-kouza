    credits:
      - "Source: Japan Coast Guard, Hydrographic and Oceanographic Dept, research presentation (8 Mar 2017) https://www1.kaiho.mlit.go.jp/kenkyu/happyo/2016/O-5_Matsumoto_H290308.pdf"
      - "Source: Matsumoto et al., 'Outlook for ocean information work using satellite-derived bathymetry', Report of Hydrographic and Oceanographic Researches No.54 (27 Mar 2017) https://www1.kaiho.mlit.go.jp/kenkyu/report/rhr54/rhr54-TR01.pdf"
      - "Satellite specs: WorldView-2, 8 bands, 1.84 m, as cited in the report above"
      - "Note: the free-data (Sentinel-2) idea is our own assumption, not from the source study"
    say: To consider this for your own waters or your client, here is the next step. We help you write the RFP and gather competitive quotes, independent of any satellite operator or analytics company. Use the form in the description to get in touch. Thanks for watching.
