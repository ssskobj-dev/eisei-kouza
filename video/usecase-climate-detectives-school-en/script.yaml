# English use-case video. Same facts as casebook/climate-detectives-school.qmd; English narration & slides.
lang: en
voice: Ryan
title: "Satellite data in the classroom: ESA Climate Detectives for teens"
series: CASEBOOK
kicker: Use case
number: 12
total: 221
thumb: Satellites in class
summary: How schools let students study a local environmental problem with free satellite data, using Europe's Climate Detectives project as the model. Where it fits in a class, what it can and cannot show, how far free satellites go, and what it costs. About 6 minutes.
scenes:
  - kind: cover
    heading: Satellites in the classroom
    sub: Free Earth observation data as a school teaching tool
    say: Can students study a real local environmental problem with their own data? Yes. The answer is to let them collect and analyse free satellite data, the way the European Space Agency's Climate Detectives project does it. In this video we look at who uses this, where it fits in a class, what it can and cannot show, how far free satellites go, and what it costs.

  - kind: bullets
    heading: Where, who, and why
    items:
      - "Where: Europe and Canada run the project; the teaching model travels anywhere"
      - "Who: schools, education boards and science museums; teachers lead the teams"
      - "Why: let students show how their local area changed, using their own data"
      - "The example: ESA's Climate Detectives, for students aged 14 to 19"
    say: The example is the European Space Agency's Climate Detectives, a free school project run with the national space education offices. The users are schools, education boards and science museums, and teachers lead the student teams. The goal is to let students investigate a local environment or climate problem and show, with their own data, how their area has changed. It is built for students aged fourteen to nineteen, in teams of at least two students, up to a whole class.

  - kind: steps
    heading: How a project runs
    items:
      - Identify a local environment or climate problem
      - Investigate it with satellite images, ground measurements, or both
      - Propose actions and share the results as a poster, slides, and an optional video
    say: A project runs in three phases. First, each team identifies a local environment or climate problem. Second, they investigate it, using satellite images from the free Copernicus Browser, ground measurements the students take themselves, or both. Using data is required. Third, they propose actions they can take and share the results, as a poster, a slide presentation, and an optional video of no more than three minutes. The design runs up to eight months, so it suits a whole term or year rather than a single lesson.

  - kind: table
    heading: Satellite versus people
    columns: [The satellite shows, Students and teachers do]
    widths: [0.5, 0.5]
    rows:
      - [Change across a wide area, Pick the question to study]
      - [The same conditions across years, Measure and observe on the ground]
      - ["Free, open data", Work out the cause and propose actions]
      - ["", The teacher guides the method]
    say: The split of roles looks like this. The satellite data shows change across a wide area, under the same conditions across many years, and it is free and open. The students pick the question, measure and observe on the ground, work out what caused the change, and propose actions. The teacher guides the method. This is not a trial; it is a project that runs every year. The number of teams and students that have taken part is not stated in the sources we checked.

  - kind: table
    heading: What it supports a school to decide
    columns: [What you get, What you can decide]
    widths: [0.42, 0.58]
    rows:
      - [Students' change maps and graphs, Which local topics are worth studying next year]
      - [Each team's plan and final report, How to budget lesson time and teacher training]
      - ["Notes on what could not be seen", "Which questions to send to field work instead"]
      - [Proposals to the community, What the school takes to local government]
    say: Beyond the learning itself, here is what a school gets and what it lets you decide. The students' change maps and graphs tell you which local topics are worth studying next year. Each team's plan and final report helps you budget lesson time and teacher training. The notes on what could not be seen build a list of questions better sent to field measurement. And the proposals to the community become what the school can take to local government. Over the years, a school learns which local questions satellites can actually answer.

  - kind: bullets
    heading: Limits as of 2026
    items:
      - "At 10 m pixels, a schoolyard, a single house or one tree is too small to see"
      - Optical satellites cannot see the ground through cloud
      - The image you want may not exist for the day of the lesson
      - The satellite shows that something changed, not why it changed
      - "Japan's schools cannot enter the ESA project, but the free data and guides are open to all"
    say: The limits matter, and the source states them plainly. At ten metre pixels, a schoolyard, a single house or one tree is too small to see; anything smaller than a pixel blurs into the land around it. Optical satellites cannot see the ground through cloud. Because of revisit timing and cloud, the image you want may not exist for the exact day of the lesson, so comparing change across years works better than week to week. The satellite shows that something changed, not why, so ground measurement and interviews are still needed. And Japan's schools are not eligible for the ESA project itself, though the free data and the published guides are open to anyone.

  - kind: bullets
    heading: How far do free satellites go?
    items:
      - "Europe's Sentinel-2 is free: 10 m pixels, 13 bands, revisit every 5 days at the equator with two satellites"
      - Change in parks, farmland, rivers and cityscapes can be read from a vegetation index over years
      - At 10 m, small or single-object questions cannot be answered
      - Clouds block some days, so the record has gaps
    say: So how far can free satellites take a class? Europe's Sentinel-2 is free. It has ten metre pixels for its four visible and near-infrared bands, thirteen bands in all, and with two satellites it revisits every five days at the equator. Change in parks, farmland, river banks and the spread of a city can be read from how a vegetation index shifts across the years, at no data cost. But at ten metres, questions about a single small object cannot be answered, and clouds block some days, so the record has gaps.

  - kind: table
    heading: What it costs
    columns: [Item, Cost]
    widths: [0.38, 0.62]
    rows:
      - [Participation and data, "Free (ESA project; Copernicus Browser)"]
      - [Teacher training, Time to learn the tools and the limits]
      - [Class time, "The lesson hours; ESA's design runs up to 8 months"]
      - [Devices, Browser-capable devices and a connection]
      - [Design and advice, Optional, if the unit design is outsourced]
    say: Now the cost. This case is unusual because the data is free. Taking part in Climate Detectives is free, and the satellite data comes from free tools, so there is no imagery bill to estimate. The cost is human time. Teachers need time to learn the tools and the limits. The class needs lesson hours; the European design runs up to eight months. Students need browser-capable devices and a connection. And if a school outsources the unit design and advice, that is a fee. The amounts are not published, and they differ by school, so the main cost here is people's time, not data.

  - kind: table
    heading: When it fits, and when it does not
    columns: [Factor, Fits, Does not fit]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [Area, "Parks, farmland, rivers, cityscape", "A schoolyard, one house, one tree"]
      - [Time span, Years to a decade of change, Last week versus this week]
      - [Question, "Where, when and how it changed", Why it changed]
      - [Teacher setup, Time for training is available, Hand over materials and walk away]
    say: Finally, where it fits. It fits when the area is a park, farmland, a river or a cityscape, when the question spans years to a decade, and when what you want is where, when and how a place changed. It fits when teachers have time for training. It does not fit for a single schoolyard, house or tree, for a last-week-versus-this-week comparison, when you need to know why something changed, or when the plan is to hand teachers the materials and walk away. If you propose this, three points matter. Check first whether the question is one satellites can see, never say satellites can study anything, and always put teacher training in the plan.

