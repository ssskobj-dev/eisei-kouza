# ユースケース解説動画の台本。元の記事：casebook/basemap-change-detection.qmd
title: 衛星データとAIで地図の更新箇所を探す、国土地理院の建物検出は適合率75.8%
series: CASEBOOK
kicker: ユースケース解説
number: 27
total: 221
thumb: 地図の更新を衛星で
summary: 国土地理院が、電子国土基本図の更新で、2時期の衛星画像をAIで比べて建物と道路の変化を洗い出している事例。業務のどこに入れ、何を決める材料になるか、公表されている精度の読み方、2026年時点の限界、費用がかかる所までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データとAIで、地図の更新箇所を探す
    sub: 国土地理院の変化抽出、建物は適合率75.8%、道路は46.4%
    say: 全国の地図のどこが変わったかを、目で見比べずに探す方法はあるか。答えは、2時期の衛星画像をAIで比べて、変化がありそうな場所を先に洗い出すことです。国土地理院は、この方法を電子国土基本図の更新に使っています。公表されている精度は、建物の変化で適合率75.8パーセント、道路の変化で46.4パーセント。この動画では、業務のどこに入れて、何を決める材料にしているのか、どこまでが衛星の仕事で、どこからが人の仕事なのかを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。国土地理院の電子国土基本図（2009年から整備）
      - 誰が：国土地理院（発注）。画像は国産の光学衛星、AIは国内の企業
      - 何のために：道路の新設や建物の建て替えがあった場所を見つけ、地図を直す
      - 困りごと：従来は空中写真と地図を目視で比べていて、労力と時間がかかる
    say: 事例の舞台は日本の国土地理院です。電子国土基本図は、2009年から整備されているデジタルの基本図で、カーナビや地図アプリ、ハザードマップの基礎になっています。道路ができたり建物が建て替わったりすれば、地図を直さなければなりません。従来は、空中写真と既存の地図を目で見比べて変化を探していました。これには多大な労力と時間がかかり、変化の大きい場所を効率よく見つけることが課題でした。そこで、2時期の衛星画像をAIで比べて、変化がありそうな場所を先に洗い出す、という使い方をしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-basemap-change-detection/flow.svg
    caption: 「どこから更新するか」を決める前に、衛星の変化抽出を入れる
    say: 業務の流れを見ます。入る位置は、地図の更新計画を立てる前です。技術は2段階です。まず、分解能1.5メートルから2.5メートルの中分解能の画像で、全国を128画素四方の区画に分け、区画ごとに変化の確信度を出します。全国4,871メッシュで推論した結果は、面的な更新の事業計画の参考資料に使われました。次に、分解能0.8メートルの高分解能の画像で、おおむね200平方メートル以上の建物と、幅6メートル以上で長さおおむね50メートル以上の道路について、新設と滅失を地物の単位で抽出します。人は、確信度の高い場所から順に、空中写真や現地の資料で確かめて地図を直します。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-basemap-change-detection/split.svg
    say: 役割の分担はこうなります。衛星画像とAIが行うのは、2時期の画像を区画ごとに比べること、建物と道路の新設と滅失を確信度付きで示すこと、全国の変化の多い場所を一覧にすることです。地図を作る人が行うのは、確信度の高い場所から確かめること、空中写真や現地の資料で図化すること、そして誤抽出と抽出漏れを記録して学習データに戻すことです。国土地理院は2023年度と2024年度の2年間で技術開発を行い、学習データを16メッシュから197メッシュに増やして精度を上げました。衛星とAIが出すのは変化の候補で、地図を直す図化は人の工程です。

  - kind: figure
    heading: 公表されている精度の読み方
    image: figures/usecase-basemap-change-detection/accuracy.svg
    caption: テストデータでの値（2025年の国土地理院報告会）
    say: 公表されている精度は、北海道から九州までの18地域のテストデータでの値です。適合率は、変化ありと出した場所のうち、本当に変化があった割合。再現率は、本当の変化のうち、拾えた割合です。建物の変化は、適合率75.8パーセント、再現率70.9パーセント。4件に3件が当たり、10件に7件を拾えます。一方、道路の変化は、適合率46.4パーセント、再現率48.0パーセントで、半分に届きません。学習データの不足で、特殊な色の道路が検出できていないと報告されています。提案で精度を示すときは、建物と道路を分けて書くことが大事です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [区画ごとの変化の確信度（0〜1の地図）, どの地域の地図を先に更新するか、今年度の作業量]
      - [地物単位の変化の候補（建物と道路の新設・滅失）, どの場所を確かめに行くか、図化の順番]
      - [確かめた結果（当たり、外れ、見逃し）, しきい値を上げるか下げるか、学習データに何を足すか]
      - [雲のない合成画像（2時期）, 変化の目視の確認、季節のそろえ方]
    say: 受け取るデータと、それで決められることを整理します。区画ごとの変化の確信度は、どの地域の地図を先に更新するか、今年度の作業量を決める材料になります。地物単位の変化の候補は、どの場所を確かめに行くか、図化の順番を決める材料です。確かめた結果は、しきい値を上げるか下げるか、学習データに何を足すかの判断に使います。国土地理院は、見逃しを減らすことを優先して、確信度0.8をしきい値にしています。2025年の報告会の資料では、中分解能の選別の結果が、2025年度の事業計画の策定に活用されたとされています。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-basemap-change-detection/limits.svg
    say: 限界も、資料にはっきり書かれています。1つ目、分かるのは変化がありそうな場所までです。国土地理院は、図化の作業に使うには抽出精度の向上が必要だとしています。2つ目、道路の変化は建物より拾いにくく、適合率は46.4パーセントです。3つ目、小さな変化は対象外です。住宅1戸の建て替えや細い道は、この仕組みでは拾いません。4つ目、画像の写り方が誤抽出を生みます。衛星の入射角の違いで屋根の位置がずれたり、高層の建物の側面が別の建物と誤認識されたりします。5つ目、光学画像なので雲があれば写りません。複数回撮影した画像から雲のない画像を合成して補っていますが、合成した画像は複数日の寄せ集めになります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - この事例で使った画像は、中分解能も高分解能も、すべて商用の衛星
      - 対象は、おおむね200m²以上の建物と、幅6m以上の道路
      - 無償の衛星画像は分解能が粗く、この大きさの建物を拾うのは難しい
      - 公表資料に、無償データでの運用は示されていない
    say: では、無償の衛星でどこまでできるでしょうか。この事例で使った画像は、中分解能の1.5メートルから2.5メートルも、高分解能の0.8メートルも、すべて商用の衛星です。対象は、おおむね200平方メートル以上の建物と、幅6メートル以上の道路です。無償の衛星画像は分解能が粗く、この大きさの建物を拾うのは難しいと考えられます。公表資料にも、無償データでの運用は示されていません。つまり、この使い方は有償の画像を前提にしています。

  - kind: table
    heading: 費用がかかる所（金額は非公開）
    columns: [項目, 中身]
    widths: [0.34, 0.66]
    rows:
      - [衛星画像の調達, 中分解能（1.5〜2.5m）と高分解能（0.8m）の、2時期の商用画像]
      - [AIの開発と改良, 学習データの作成、モデルの改良、しきい値の調整。開発に2年度]
      - [確かめて図化する人件費, 候補を確かめて地図を直す。建物の候補は4件に1件が外れ]
      - [記録と学習の体制, 誤抽出と抽出漏れを記録し、学習データに戻す担当の時間]
    say: 費用の話です。国土地理院の衛星画像の調達額と、AIの開発費は、公表資料に金額がありません。事業者の発表にも契約額は載っていません。そのため、この動画では金額を出しません。費用がかかる所は4つです。1つ目、2時期の商用の衛星画像の調達。2つ目、AIの開発と改良。学習データの作成、モデルの改良、しきい値の調整です。3つ目、候補を確かめて図化する人件費。適合率が75.8パーセントなら、建物の候補の4件に1件は外れで、その確認も人の仕事です。4つ目、誤抽出と抽出漏れを記録して学習データに戻す体制です。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.18, 0.41, 0.41]
    rows:
      - [目的, 広い範囲で「どこから更新するか」を決めたい, 衛星の結果をそのまま地図にしたい]
      - [対象, 一定規模以上の建物の新設と滅失, 住宅1戸の建て替え、細い道]
      - [地物, 建物（適合率75.8%）, 道路（適合率46.4%）、特殊な色の道路]
      - [画像, 2時期の分解能と季節がそろっている, 片方しかない、季節が違う]
      - [体制, 確かめた結果を記録して学習に戻せる, 1回の結果で判断したい]
    say: 最後に、向き不向きです。向いているのは、広い範囲でどこから更新するかを決めたい、対象が一定規模以上の建物の新設と滅失である、2時期の画像の分解能と季節がそろっている、確かめた結果を記録して学習に戻せる、という場合です。逆に、衛星の結果をそのまま地図にしたい、住宅1戸の建て替えや細い道を拾いたい、道路の変化が主な対象、画像が片方しかない、1回の結果で判断したい、という場合は向きません。提案するときの要点は3つ。最初に拾いたい変化の最小の規模を聞くこと、地図が自動で更新されるとは言わないこと、精度は建物と道路を分けて示すことです。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：国土地理院「衛星画像及びAI画像分析技術を用いた変化抽出技術の開発」 https://www.gsi.go.jp/common/000272980.pdf"
      - "出典：国土地理院「衛星画像を活用した効率的な電子国土基本図の整備・更新」（2025年） https://www.gsi.go.jp/REPORT/HAPPYOU/2025/pdf/54_09.pdf"
      - "出典：アクセルスペース「電子国土基本図関連プロジェクトにAxelGlobeを採用」（2024年1月16日） https://axelspace.com/ja/news/axelglobe-gsi"
      - "費用：画像の調達額とAIの開発費は、公表資料に金額がないため、この動画では概算を出していません"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
