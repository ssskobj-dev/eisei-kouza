# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第1部 第1章「衛星データの画素の値は何を測っているか：反射率に直す倍率とずらし、波長帯の確かめ方」（learn/codex/codex-1-1-what-pixels-measure.qmd）
title: 衛星データの画素の値を反射率に直す：Sentinel-2の倍率10000とずらし
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 5
total: 30
thumb: 倍率とずらし
summary: AIに書かせた衛星データの解析の、最初の1枚で確かめることです。画像のファイルに入っている整数の「画素の値」を、公式の決まりで反射率に直す倍率とずらし、波長帯の名前と画素の大きさの確かめ方、植物と水の見え方による「もっともらしさ」の確認を見たあと、AIが返した誤りを仕込んだコードを一緒にレビューして3つの誤りを見つけます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 画素の値は何を測っているか：反射率に直す倍率とずらし
    sub: AIが出した数字は、反射率か、ただの整数か。最初の1枚で確かめる
    say: AIに書かせたコードが出した数字は、反射率でしょうか、それとも、ただの整数でしょうか。答えは、画素の値は整数で保存されていて、公式の決まりで反射率に直す。直したあとの値を、植物と水の見え方という物差しに当てて、もっともらしいかを見る、です。この確認を最初の1枚でやらないと、あとの指数も地図も、意味の分からない数字の上に積み上がります。この動画では、画素の値と反射率の違い、倍率とずらし、波長帯の確かめ方を見たあと、AIが返したコードを一緒にレビューして、3つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 衛星画像を1枚開き、波長帯ごとの値の分布を出して、値がもっともらしいかを確かめられる
      - 画素の値（整数）と反射率（0〜1の小数）の違い、整数を反射率に直す「倍率」と「ずらし」の意味が分かる
      - 植物と水の見え方を物差しにして、AIが書いたコードの波長帯の取り違えと、値の直し忘れに気づける
    say: この章を終えると、3つのことができるようになります。1つ目、衛星画像を1枚開き、波長帯ごとの値の分布を出して、値がもっともらしいかを確かめられること。2つ目、整数の画素の値と、0から1の小数の反射率の違い、そして整数を反射率に直す、倍率とずらしの意味が分かること。3つ目、植物と水の見え方を物差しにして、AIが書いたコードの波長帯の取り違えと、値の直し忘れに気づけることです。たとえば、森の値が水面より暗く出たとき、衛星の値がおかしいのか、コードがおかしいのかを、自分で切り分けられるようになります。

  - kind: figure
    heading: しくみ：値から反射率へ
    image: figures/codex-1-1-what-pixels-measure/pipeline.svg
    say: まず、しくみです。光学衛星は、太陽の光が地表で反射して返ってきた明るさを、波長帯、つまり色の帯ごとに測ります。Sentinel-2では、青がB2、緑がB3、赤がB4、近赤外がB8で、この4つは画素の大きさが10mです。目に見えない帯もあって、近赤外の別の帯B8A、短波赤外のB11とB12は、画素が20mです。測った明るさは、画像のファイルには整数で入っています。これを画素の値と呼びます。整数のままでは、画像どうしを比べられません。そこで、公式の決まりに従って、地表が光をどれだけ返したかの割合、0から1の小数の反射率に直します。Sentinel-2のLevel-2A、つまり大気の影響を補正した地表の反射率の製品では、反射率は、画素の値にずらしを足して、倍率で割った値です。倍率は10000。ずらしは波長帯ごとの負の定数で、2022年1月25日に導入された処理の版04.00から加わりました。暗い地表で反射率がわずかに負になることがあり、それを切り捨てないために入ったものです。ずらしと倍率は、製品の付属情報に書いてあります。そして、画素の値の0は、観測がない、欠けた値の印です。ずらしは、1以上の画素の値にだけ当てはめます。最後の、分布を見て確かめる段階は、人の仕事です。

  - kind: table
    heading: 衛星ごとの決まり
    columns: [項目, Sentinel-2 Level-2A, Landsat 8・9 Collection 2 Level-2]
    widths: [0.22, 0.40, 0.38]
    rows:
      - [赤の波長帯, B4（約665nm、10m）, Band 4（0.64〜0.67μm、30m）]
      - [近赤外の波長帯, B8（約833nm、10m）, Band 5（0.85〜0.88μm、30m）]
      - [似た名前, B8Aは約865nm・20mの別の帯, Band 4は赤。B4とは別の衛星]
      - [反射率への直し方, （画素の値＋ずらし）÷10000, 画素の値×0.0000275−0.2]
      - [ずらしと倍率, 製品の付属情報から読む, 上の式のとおり]
      - [欠けた値, 画素の値0, 画素の値0。有効は7273〜43636]
    say: 直し方は、衛星ごとに違います。表の左がSentinel-2のLevel-2A、右がLandsat 8と9の、Collection 2のLevel-2です。赤は、Sentinel-2ではB4、中心の波長が約665nmで10m。LandsatではBand 4、0.64から0.67マイクロメートルで30mです。近赤外は、Sentinel-2ではB8、約833nmで10m。似た名前のB8Aは約865nmで20mの、別の帯です。LandsatではBand 5です。反射率への直し方は、Sentinel-2が、画素の値にずらしを足して倍率の10000で割る。Landsatは、画素の値に0.0000275を掛けて、0.2を引く。欠けた値は、どちらも画素の値の0ですが、Landsatには、有効な画素の値の範囲が7273から43636という決まりもあります。番号も倍率も、衛星ごとに別です。B8とB8A、B4とBand 4のように、似た名前が別の帯や別の衛星を指すので、公式の表と突き合わせます。

  - kind: figure
    heading: 植物と水の見え方
    image: figures/codex-1-1-what-pixels-measure/signature.svg
    say: 反射率に直したあと、値がもっともらしいかを見る物差しが、植物と水の見え方です。健康な植物は、目に見える光の大半を吸収し、近赤外を強く反射します。葉の緑の色素が0.4から0.7マイクロメートルの光を吸収し、葉の構造が0.7から1.1マイクロメートルの近赤外を反射するためです。水は、近赤外と短波赤外を吸収するので、どちらの帯でも暗く写ります。裸の土は、短波赤外を反射します。つまり、森では、赤は低く、近赤外は高い。湖では、近赤外がとても低い。この2つが出ていれば、値は筋が通っています。逆に、森で赤と近赤外が同じくらいなら、波長帯の取り違えか、ずらしの直し忘れを疑います。湖の近赤外が森と変わらないなら、場所の座標か、波長帯が違います。

  - kind: steps
    heading: 手順：5つ
    items:
      - 1枚の製品の名前と処理の版を決める（人）。名前の中の Nxxyy が処理の版
      - 波長帯の名前と分解能を、公式の表で確かめる（人）
      - 付属情報からずらしと倍率を読み、反射率に直させる（AIと人）
      - 波長帯ごとの値の分布を出させる（AI）。最小、中央値、最大、欠けた値の画素の数
      - 答えの分かっている場所で見る（人）。森と湖の値が、物差しと合うか
    say: 手順は5つです。1、1枚の製品の名前と処理の版を決める。人の仕事です。入れるのは場所と日付、出るのは製品の名前で、名前の中のNに続く4桁が処理の版です。2、波長帯の名前と分解能を公式の表で確かめる。人です。B4、B8のような名前を、中心の波長と画素の大きさの表と突き合わせます。3、付属情報からずらしと倍率を読み、反射率に直させる。AIと人です。出るのは、波長帯ごとの反射率の画像と、付属情報から読んだずらしと倍率の表示です。4、波長帯ごとの値の分布を出させる。AIです。出るのは、波長帯ごとの最小、中央値、最大と、欠けた値の画素の数です。5、答えの分かっている場所で見る。人です。森と湖の位置を入れて、森は赤が低く近赤外が高い、湖は近赤外が低い、が成り立っているかを判定します。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.72]
    rows:
      - [画像を開いて値を見せて, 製品の名前を表示し、B4とB8を読み、付属情報のずらしと倍率で反射率に直してから、最小・中央値・最大を表にして]
      - [反射率にして, 付属情報からずらしと倍率を読んで表示し、画素の値0を除いてから（画素の値＋ずらし）÷倍率で直して]
      - [近赤外を使って, B8（約833nm、10m）を使って。B8A（20m）は使わないで]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。画像を開いて値を見せて、と頼むと、AIは整数のまま表を出すか、10000で割るだけの反射率を出します。どちらも見た目は数字の表なので、違いに気づきにくいです。代わりに、製品の名前を表示し、B4とB8を読み、付属情報のずらしと倍率で反射率に直してから、最小、中央値、最大を表にして、と頼みます。反射率にして、ではなく、付属情報からずらしと倍率を読んで表示し、画素の値0を除いてから、画素の値にずらしを足して倍率で割って。近赤外を使って、ではなく、B8を使って。B8Aは使わないで。指示の7項目のうち、手順と確かめ方に、こうした具体的な文を入れます。確かめ方には、読んだずらしと倍率を波長帯ごとに表示すること、製品の名前の中の処理の版を表示すること、直す前の画素の値の最小と最大も表示することを書きます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # Sentinel-2 Level-2A の波長帯ごとの値の分布を出す（誤りあり）
      scene = open_product("<製品の名前>")
      red = read_band(scene, "B4") / 10000          # 赤の反射率
      nir = read_band(scene, "B8A") / 10000         # 近赤外の反射率
      for name, band in [("red", red), ("nir", nir)]:
          band = band[band > 0]                     # 欠けた値を除く
          print(name, band.min(), median(band), band.max())
    highlight: [3, 4, 6]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。手元で数分でできます。用意するのは、AIが返したコードと説明、そして章のページの出典にある、Sentinel-2の公式資料です。今回、AIはこう説明してきました。ずらしはLevel-1Cだけの話で、Level-2Aは10000で割れば反射率になります。近赤外はB8Aです。B8より正確なので、10mのフォルダに入っています。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、波長帯の名前が公式の表と合っているか。2、ずらしを足してから倍率で割っているか。3、欠けた値を、反射率に直す前の画素の値で除いているか。4、ずらしと倍率を付属情報から読んでいるか。まず、3行目と4行目を見てください。どちらも、10000で割るだけです。次に、4行目の波長帯の名前。B8Aです。最後に、6行目。反射率に直したあとで、0より大きい値だけを残しています。ここで1つ、大事なことがあります。このコードは、動かしても止まりません。表は出ます。だから、動いたかどうかでは、誤りに気づけません。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.07, 0.15, 0.38, 0.40]
    rows:
      - ["3-4", 値の倍率, 10000で割るだけ。「ずらしはL1Cだけ」, 版04.00以降の L2A にもずらしがある。付属情報から読み、足してから割る]
      - ["4", 波長帯, B8A。「10mのフォルダにある」, B8Aは約865nm・20m。10mの近赤外はB8。10mのフォルダは B2・B3・B4・B8]
      - ["6", 欠けた値, 反射率にしたあと「0より大きい」だけ残す, 欠けた値の印は、直す前の画素の値0。負の反射率は本物。読んだ直後に0を除く]
    say: 判定の結果が、この表です。1つ目、3行目と4行目。10000で割るだけで、ずらしを足していません。AIの説明の、ずらしはLevel-1Cだけ、は誤りで、処理の版04.00以降のLevel-2Aにもずらしがあります。正しくは、付属情報から波長帯ごとのずらしと倍率を読み、足してから割ります。2つ目、4行目のB8A。近赤外の帯ではありますが、中心の波長は約865nmで、画素は20mです。10mの近赤外はB8、約833nmです。AIの、B8Aは10mのフォルダにある、も誤りで、10mのフォルダに入るのはB2、B3、B4、B8です。20mのB8Aと10mのB4を、そのまま画素どうしで比べることはできません。指示文でB8と決めたら、それが守られているかを見ます。3つ目、6行目。反射率に直したあとで、0より大きい値だけ残しています。欠けた値の印は、反射率ではなく、直す前の画素の値の0です。ずらしを足したあとの反射率は、暗い水面でわずかに負になることがあり、それは本物の値です。この行は、本物の暗い画素を、欠けた値と一緒に消します。正しくは、画素の値を読んだ直後に0を除き、残りを反射率に直します。3つとも、動かしても止まりません。1つ目で全体が一律にずれ、2つ目で画素の大きさが合わず、3つ目で湖の中が消えています。判定が出たので、AIに、3つの行について、何が違うか、どこを見るかを伝えて、直させます。

  - kind: bullets
    heading: 結果の目視観点5つ
    items:
      - 森で、赤が低く近赤外が高いか。同じくらいなら、波長帯の取り違えか、ずらしの直し忘れ
      - 湖で、近赤外がとても低いか。森と変わらないなら、座標か波長帯が違う
      - 欠けた値の画素の数が、画像の端の形と合っているか。真ん中に塊があれば、湖を消している
      - 最大の値が、雲の画素ではないか。シーン分類の8と9が雲、10が薄い雲、3が雲の影
      - 表示させたずらしと倍率が、付属情報の値と同じか。付属情報を開いて目で確かめる
    say: 直したら、分布の表と、答えの分かっている場所の値を目で確かめます。見るのは5つ。1つ目、森で、赤が低く近赤外が高いか。同じくらいなら、波長帯の取り違えか、ずらしの直し忘れを疑います。2つ目、湖で、近赤外がとても低いか。森と変わらないなら、座標か波長帯が違います。3つ目、欠けた値の画素の数が、画像の端の形と合っているか。画像の真ん中に欠けた値の塊があれば、湖を消している可能性があります。4つ目、最大の値が、雲の画素ではないか。雲は明るく写ります。Level-2Aの画素ごとのシーン分類で、雲は8と9、薄い雲は10、雲の影は3です。これらを除いた分布も出させます。5つ目、表示させたずらしと倍率が、付属情報の値と同じか。付属情報を開いて、目で確かめます。おかしな結果の例を2つ。例1、湖の中が、地図の上で穴になった。欠けた値の画素の数が、湖の面積の分だけ多い。反射率に直したあとで0以下を除いているので、わずかに負になった水面の本物の画素が消えています。例2、森の赤の値が、近赤外と同じくらい高い。分布の表で、全部の波長帯の最小が、ありえないほど高いところから始まっている。ずらしは負の値なので、足し忘れると、全部の値が一律に高く出ます。ただし、処理の版04.00より前の製品なら、10000で割るだけで合っています。製品の名前の中の版の番号を見て、どちらの決まりで直す製品かを確かめます。言えるのは、この1枚の値が、公式の決まりどおりに反射率に直され、植物と水の見え方と矛盾しない、ことです。言えないのは、反射率が正しい、ことです。大気の影響の補正がどれだけ合っているかは、この確認では分かりません。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 画面で切り抜いた画像や、名前を付け替えた複製。製品の名前と付属情報がないと、処理の版も、ずらしと倍率も分からない
      - 雲や雪が画像の大半を占める日。植物と水の見え方という物差しが使えない
      - 答えの分かっている場所がない範囲。範囲を少し広げて、森か湖を入れる
      - 有償の商用データ。考え方は同じだが、倍率とずらし、波長帯の名前、欠けた値の印は契約の仕様書で決まる
    say: 向かない条件も、押さえておきます。1つ目、画面で切り抜いた画像や、名前を付け替えた複製。製品の名前と付属情報がないと、処理の版も、ずらしと倍率も分かりません。2つ目、雲や雪が画像の大半を占める日。植物と水の見え方という物差しが使えません。シーン分類で雲と雪の画素を除いても、残りが少なすぎます。3つ目、答えの分かっている場所がない範囲。森も湖もない範囲では、値のもっともらしさを判断する物差しがありません。範囲を少し広げて、森か湖を入れます。4つ目、有償の商用データを使うとき。考え方は同じですが、倍率とずらし、波長帯の名前、欠けた値の印は、契約の仕様書で決まります。公式の表の代わりに、仕様書と突き合わせます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 製品の名前と処理の版を決める（人）
      - 波長帯の名前と分解能を公式の表で確かめる（人）
      - ずらしと倍率を付属情報から読み、反射率に直させる（AIと人）
      - 波長帯ごとの最小・中央値・最大と、欠けた値の画素の数を出させる（AI）
      - 森と湖で、植物と水の見え方と合うかを見る（人）
    say: 手順をまとめます。1、製品の名前と処理の版を決める。人です。2、波長帯の名前と分解能を公式の表で確かめる。人です。3、ずらしと倍率を付属情報から読み、画素の値0を除いてから反射率に直させる。AIと人です。4、波長帯ごとの最小、中央値、最大と、欠けた値の画素の数を出させる。AIです。5、森と湖で、植物と水の見え方と合うかを見る。人です。この5つを、解析の最初の1枚で、毎回繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      製品の名前に「N0511」が入っている
      コード：red = read_band(scene, "B4") / 10000
      波長帯  最小     中央値   最大     欠けた値の画素の数
      B4      0.1000   0.1420   0.9870   412,300
      B8      0.1000   0.3950   0.9910   412,300
      湖の中心  B4: 0.1120  B8: 0.1040
      森      B4: 0.1210  B8: 0.4380

      問い：この表から最も疑うべきことはどれか
      A. 雲の画素が混じっているので、最大が1に近い
      B. ずらしを足していないので、全部の値が一律に高く出ている
      C. B4とB8を取り違えているので、森の値が逆になっている
      D. 湖の中心の座標が間違っているので、湖の近赤外が高い
    highlight: [4, 5, 6]
    notes:
      - 答えは動画では言いません
      - 答えと解説はサイトで
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aを1枚開いて、赤のB4と近赤外のB8の反射率の分布を出して、と頼みました。製品の名前には、N0511が入っています。AIが返したコードを動かすと、画面の表が出ました。B4は、最小0.1000、中央値0.1420、最大0.9870。B8は、最小0.1000、中央値0.3950、最大0.9910。欠けた値の画素の数は、どちらも412,300。湖の中心は、B4が0.1120、B8が0.1040。森は、B4が0.1210、B8が0.4380。コードの該当する行は、B4を読んで10000で割る、でした。この表から、最も疑うべきことはどれでしょうか。A、雲の画素が混じっているので、最大が1に近い。B、ずらしを足していないので、全部の値が一律に高く出ている。C、B4とB8を取り違えているので、森の値が逆になっている。D、湖の中心の座標が間違っているので、湖の近赤外が高い。この動画で見た、植物と水の見え方の物差しと、製品の名前の中の版の番号を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。ずらしを直したあとに湖が穴になった理由を書く、問2の短答も、そこにあります。

