# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第1部 第5章「無料の衛星データの入手：Sentinel-2とLandsatを場所と期間で探し、雲の割合で絞り、利用の条件を付けて保存する」（learn/codex/codex-1-5-open-data-access.qmd）
title: 衛星データを無料で入手：Sentinel-2の検索でAIが誤る4点を見抜く
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 9
total: 30
thumb: 雲0%の落とし穴
summary: 無料の衛星データ（Sentinel-2、Landsat）を解析に使う前の「入手」の手順。場所と期間で探し、雲の割合で絞り、区画の端の切れを確かめ、利用の条件が求める出どころの表記を付けて保存するまでを、しくみから見ます。座標の順番（経度が先）、雲0%は「不明」を含む、区画の端で画像が途中まで、「© ESA」は利用の条件の文言ではない、という4つの誤りを、AIが返したコードを一緒にレビューして見つけます。検索に使った最初の点と候補の表を手元で確かめる練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 無料の衛星データの入手：検索を4点で確かめる
    sub: 座標の順番、雲の割合、区画の端、出どころの表記。AIの検索結果をそのまま信じない
    say: AIに、この市の2025年5月の、雲の少ないSentinel-2の画像を探して、と頼むと、数秒で、条件に合う画像が見つかりました、と返ってきます。その画像は、そのまま使えるでしょうか。答えは、座標の順番、雲の割合、範囲の切れ、出どころの表記、の4点を人が確かめてから、です。座標の順番を取り違えると別の場所が出てきます。雲の割合は区画ごとの値で、見たい場所の値ではありません。区画の端では画像が途中で切れます。この動画では、無料の衛星データの入手のしくみを見たあと、AIが返したコードを一緒にレビューして、4つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 場所と期間を指定して雲の少ない画像を探し、利用の条件と出どころの表記を付けて保存できる
      - 座標の順番（経度が先か、緯度が先か）、雲の割合の意味、区画の端の切れという3つの落とし穴が分かる
      - AIが「条件に合う画像が見つかりました」と返した結果を、座標、雲の割合、範囲の切れ、表記の4点で確かめられる
    say: この章を終えると、3つのことができるようになります。1つ目、場所と期間を指定して雲の少ない画像を探し、利用の条件と出どころの表記を付けて保存できること。2つ目、座標の順番、経度が先か緯度が先か、雲の割合の意味、区画の端の切れ、という3つの落とし穴が分かること。3つ目、AIが、条件に合う画像が見つかりました、と返した検索の結果を、座標、雲の割合、範囲の切れ、表記の4点で確かめられることです。検索は数秒で終わりますが、この確認を飛ばして解析を始めると、あとで全部やり直しになります。

  - kind: figure
    heading: しくみ：入手の流れと、人が確かめる点
    image: figures/codex-1-5-open-data-access/flow.svg
    say: まず、しくみです。無料で使える光学衛星の代表が、欧州のSentinel-2と、米国のLandsatです。どちらも、利用者は無料で全部のデータを手に入れられます。Sentinelのデータは、無償で、完全で、開かれた利用が認められ、複製、配布、改変、他のデータとの組み合わせができます。Landsatのデータは、米国地質調査所、USGSから取得したものに、利用や再配布の制限がありません。ただし、どちらにも、出どころの表記の決まりがあります。Sentinelは、そのまま使うなら、Copernicus Sentinel data、年、加工したなら、Contains modified Copernicus Sentinel data、年、と表記します。Landsatは、引用、複製、転載のときに、データの出どころを明記するよう求められています。無料であることと、表記が要ることは、別です。図が、入手の流れです。左の2つ、場所と期間で探すこと、雲の割合で絞ることは、AIに任せます。右の2つ、候補が範囲を全部覆うかを地図で見ること、利用の条件の文言と製品の名前を付けて保存することは、人の仕事です。

  - kind: bullets
    heading: しくみ：区画、座標の順番、雲の割合
    items:
      - 区画：Sentinel-2はUTM座標系の110km四方。中心は100km間隔で隣と重なる。Landsatはパスとロウ（233本×248）
      - 観測の幅はSentinel-2が290km、Landsat 9が185km。区画の境界をまたげば2枚以上
      - 帯の端や始まりと終わりの区画は、画像が途中まで。入っていない画素の値は0
      - 座標の順番：GeoJSONもCopernicusの検索も「経度、緯度」。地図アプリの表示は「緯度、経度」
      - 雲の割合は区画1枚ごとの値。分からない製品は0か−1なので、「雲0%」は「不明」も拾う
    say: しくみを、もう少し見ます。データは、区画という単位で配られます。Sentinel-2のLevel-1CとLevel-2Aは、UTM座標系の、110km四方の区画で、区画の中心は100km間隔に並び、隣と重なりを持ちます。Landsatは、パス、軌道の番号と、ロウ、軌道に沿った番号の組み合わせで1枚を決め、233本のパスと、248のロウがあります。観測の幅は、Sentinel-2が290km、Landsat 9が185kmです。見たい場所が区画の境界をまたげば、2枚以上を合わせる必要があります。さらに、Sentinel-2の区画は、観測の帯の端や、帯の始まりと終わりでは、画像が途中までしか入っていないことがあります。入っていない画素の値は、0です。次に、座標の順番。しくみの中で、最も取り違えやすい点です。地図のデータの標準の形式、GeoJSONでは、位置は、経度、緯度の順に書き、座標系はWGS 84の10進の度です。Copernicusのデータの検索でも、範囲の多角形は、経度、緯度の組で書き、最初の点と最後の点を同じにします。一方、日常の会話や地図アプリの表示は、緯度、経度の順です。どちらが先かは、使う形式ごとに決まっていて、覚え方では解決しません。最後に、雲の割合。これは、製品、区画1枚ごとに付いている値です。Copernicusの検索では、cloudCoverという属性で、10%以下、のように範囲で絞れます。この値が分からない製品は、0か、マイナス1の値になります。だから、雲0%、という条件は、雲がない、と、分からない、の両方に当たります。見たい場所に雲があるかは、この値では分かりません。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [この辺りの画像を探して, 別添の境界（経度、緯度の順、WGS 84）を全部含む製品を探して]
      - [雲のない画像を, 雲の割合が20%以下の製品を、割合の小さい順に。0と−1は「不明」として分けて]
      - [ダウンロードして, 製品の名前と取得した日と出どころの表記を記録に書き、画像の端に値0の帯がないか表示して]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。この辺りの画像を探して、と頼むと、AIは、地図アプリで見た、緯度、経度の順の数字を、そのまま検索の多角形に入れることがあります。日本の経度は90を超えるので、入れ替わると、緯度としてありえない値になり、検索は該当なしか、エラーになります。両方が90より小さい地域では、エラーにならず、別の場所が検索されます。だから、別添の境界、経度、緯度の順、WGS 84、を全部含む製品を探して、と、順番を指示文に書きます。雲のない画像を、ではなく、雲の割合が20%以下の製品を、割合の小さい順に。0とマイナス1は、不明として分けて。ダウンロードして、ではなく、製品の名前と取得した日と出どころの表記を記録に書き、画像の端に値0の帯がないか表示して。指示の7項目のうち、確かめ方には、検索に使った多角形の最初の点を、経度、緯度で表示すること、雲の割合が0かマイナス1の候補は不明と表示すること、保存のときに表記の文言と製品の名前を記録に書くことを入れます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 場所と期間で探し、雲の少ない1枚を保存する（誤りあり）
      aoi = polygon([(35.68, 139.76), (35.68, 139.90),
                     (35.58, 139.90), (35.58, 139.76)])          # 緯度, 経度の順
      hits = search(collection="Sentinel-2", level="L2A", area=aoi,
                    start="2025-05-01", end="2025-05-31",
                    cloud_cover=0)                                # 雲0%だけ
      best = first(sorted(hits, key=lambda h: h.cloud_cover))   # 最も雲の少ない1枚
      save(best, "scene.tif", credit="Sentinel-2 image © ESA")
    highlight: [2, 3, 6, 7, 8]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。座標系はEPSG:4326なので、緯度、経度の順で指定します。雲のない画像だけが欲しいので、cloud_coverは0にしました。最も雲の少ない1枚を選び、ESAの画像なので、©ESAを付けて保存します。自信のある口調です。画面がそのコードです。当てる観点は5つ。1、多角形の座標が、検索の形式が求める順番か。2、雲の割合を範囲で指定し、0とマイナス1を不明として扱っているか。3、候補の輪郭が、見たい範囲を全部含むかを判定しているか。4、出どころの表記が、利用の条件の文言と一致しているか。5、該当なしのときに止まらず、空の結果で先に進んでいないか。まず、2行目と3行目を見てください。最初の点が、35.68、139.76。緯度が先です。次に、6行目。cloud_cover、イコール、0。雲0%だけです。7行目。雲の割合だけで1枚を選んでいます。輪郭が範囲を含むかを見る行がありません。最後に、8行目。表記が、Sentinel-2 image、©ESA、です。ここで1つ、大事なことがあります。この4つのうち、1つ目だけは、該当なし、という形で気づけます。しかし、該当なしを、雲のない日がなかった、と読んで終わると、誤りは隠れます。2つ目から4つ目は、動かしても止まりません。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.09, 0.13, 0.30, 0.44]
    rows:
      - ["2〜3", 位置と座標, "緯度が先。「EPSG:4326なので緯度が先」", "検索の多角形は経度が先。139.76、35.68 の順にし、最初の点を最後にもう一度書いて閉じる"]
      - ["6", 雲と影, "cloud_cover=0。「雲のない画像だけ」", "0は「不明」も拾う。(0, 20) のように範囲で絞り、0と−1は「不明」として別に表示"]
      - ["7", 範囲の切れ, "雲の割合だけで1枚を選ぶ", "輪郭が範囲を全部含むかを判定し、含むものから選ぶ。足りなければ2枚を合わせる"]
      - ["8", 表記, "「ESAの画像なので © ESA」", "利用の条件の文言どおりに。加工したので「Contains modified Copernicus Sentinel data 2025」"]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、2行目と3行目。緯度が先に入っています。検索の多角形は、経度が先です。139.76を緯度と読むと、ありえない値なので、該当なしか、エラーになります。正しくは、139.76、35.68、のように経度を先にし、最初の点を最後にもう一度書いて閉じます。AIの、EPSG:4326なので緯度が先、は、座標系の定義の話と、検索の形式が求める順番を混ぜています。2つ目、6行目。cloud_cover、イコール、0は、雲が0%の製品だけでなく、割合が分からない製品も拾います。しかも、5月の1か月に、雲0%の製品はまれです。正しくは、0から20、のように範囲で絞り、0とマイナス1は、不明として別に表示します。3つ目、7行目。雲の割合だけで1枚を選び、輪郭が見たい範囲を全部含むかを見ていません。見たい範囲が区画の境界をまたげば、1枚では足りません。帯の端の製品は、途中までしか画像がありません。正しくは、候補ごとに輪郭が範囲を含むかを判定し、含むものの中から選びます。足りなければ、2枚を合わせます。4つ目、8行目。©ESAは、利用の条件が求める文言ではありません。保存した画像をそのまま使うなら、Copernicus Sentinel data 2025。切り出しや加工をしたなら、Contains modified Copernicus Sentinel data 2025、です。AIの、ESAの画像なので©ESA、は、ありそうな表記を作っています。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：最初の点と、候補の表を確かめる
    items:
      - 検索に使った多角形の、最初の点を「経度, 緯度」で表示させる
      - 日本なら、経度が130前後、緯度が30〜45前後。逆なら、座標の順番が入れ替わっている
      - 候補の数を見る。Sentinel-2は2機で赤道で5日ごと。1か月で該当なしなら、まず座標を疑う
      - 候補の表で、雲の割合が0か−1の行を数える。0が並ぶ表は「不明」が混ざっている
      - 上位の候補の輪郭と、見たい範囲の境界を地図に重ね、はみ出しがないかを見る
    say: 判定の1つ目と2つ目を、手元でやってみます。AIに検索を頼んだ人なら、候補の表を見ながら、数分でできます。まず、検索に使った多角形の、最初の点を、経度、緯度、の順で表示させます。次に、その値を見ます。日本なら、経度が130前後、緯度が30から45前後です。逆になっていれば、座標の順番が入れ替わっています。3つ目、候補の数を見ます。Sentinel-2は2機で、赤道で5日ごとに観測します。1か月なら、雲を絞る前に、数枚はあるはずです。該当なしなら、雲のない日がなかった、ではなく、まず座標を疑います。4つ目、候補の表で、雲の割合が0か、マイナス1の行を数えます。0が並ぶ表は、不明の製品が混ざっています。不明として分けて表示させます。最後に、上位の候補の輪郭と、見たい範囲の境界を地図に重ねて、範囲の一部が輪郭の外にはみ出ていないかを見ます。この5つを、ダウンロードの前にやります。確かめた最初の点と、不明の件数は、AIに頼むときの、確かめ方の項目に、そのまま使えます。

  - kind: figure
    heading: 結果の目視観点：4つの穴と、2つの例
    image: figures/codex-1-5-open-data-access/traps.svg
    say: 直したら、候補の表と、輪郭を重ねた地図、保存した画像を、目で確かめます。図の4枚が、入手のときに落ちやすい4つの穴です。座標の順番、雲の割合、区画の端、出どころの表記。見るのは6つ。1つ目、検索に使った多角形の最初の点が、経度、緯度の順で、見たい場所の値になっているか。2つ目、候補の数が、期間と観測の間隔から見て妥当か。3つ目、雲の割合が0かマイナス1の候補を、不明として分けているか。4つ目、輪郭が、見たい範囲を全部含んでいるか。5つ目、保存した画像の端に、値0の帯がないか。値0はデータが入っていない画素で、帯の端の製品を選ぶと、片側が黒く切れます。6つ目、記録に、製品の名前、取得した日、表記の文言が書いてあるか。製品の名前がないと、あとから同じ画像を取り直せません。おかしな結果の例を2つ。例1、候補の表に、雲の割合0の製品が10件並び、どれも地図で見ると真っ白だった。割合が分からない製品が、0の値で入っています。範囲で絞り直し、0とマイナス1を不明として扱います。例2、市の東半分だけが黒く、西半分は正常に見える画像が保存された。見たい範囲が区画の境界をまたいでいるか、帯の端で途中までしか画像のない製品を選んでいます。黒い部分の値は0です。隣の区画の同じ日の製品を足すか、範囲を全部含む製品を選び直します。言えるのは、この製品は、指定した範囲を全部含み、区画ごとの雲の割合が上限以下で、利用の条件に合う表記を付けて保存した、ことです。言えないのは、見たい場所に雲がない、ことです。雲の割合は区画1枚の値で、見たい場所の上に雲があるかは、画像を開いて見るまで分かりません。この画像で解析ができる、ことも、入手の段階では言えません。処理の段階が合っているか、画素の大きさが足りるかは、別の確認です。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 雲の多い季節に、特定の1日の画像がどうしても要るとき。期間を広げるか、雲を通して見られるレーダー衛星を検討する
      - 見たい範囲が、UTMの帯や区画の境界をまたぐとき。2枚を合わせるときに座標系をそろえる手間が要る
      - 観測の幅（Sentinel-2は290km、Landsat 9は185km）より広い範囲を、同じ日の画像でそろえたいとき。隣の軌道は別の日
      - 有償の商用データ。利用の条件と表記は契約で決まる。再配布の可否と報告書への掲載の条件を契約書で確かめる
    say: 向かない条件も、押さえておきます。1つ目、雲の多い季節に、特定の1日の画像がどうしても要るとき。光学衛星は、雲の下を見られません。期間を広げるか、雲を通して見られるレーダー衛星を検討します。2つ目、見たい範囲が、UTMの帯の境界や、区画の境界をまたぐとき。Sentinel-2の区画は、UTM座標系ごとに分かれています。2枚を合わせるときに、座標系をそろえる手間が要ります。3つ目、観測の幅より広い範囲を、同じ日の画像でそろえたいとき。Sentinel-2の観測の幅は290km、Landsat 9は185kmです。隣の軌道は別の日の観測なので、同じ日にはそろいません。4つ目、有償の商用データを使うとき。探し方の考え方は同じですが、利用の条件と表記は、契約で決まります。再配布の可否と、報告書への掲載の条件を、公式の利用の条件の代わりに、契約書で確かめます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 場所を、座標の順番を決めて用意する。「経度、緯度」の順の多角形と、座標系WGS 84の記録（人）
      - 期間と雲の割合の上限で、候補を検索させる。割合は範囲で指定。0は「不明」を含む（AI）
      - 候補の輪郭が範囲を全部覆うかを、地図で確かめる。「1枚」「2枚以上」「端が切れている」の判定（人）
      - 選んだ製品を、利用の条件に合う表記を付けて保存させる。製品の名前、取得した日、表記の文言を記録に（AI）
      - 保存した画像の端に、値0の帯がないかを見る（人）
    say: 手順をまとめます。1、場所を、座標の順番を決めて用意する。入れるのは、市の境界のファイルなど、見たい範囲の境界。出るのは、経度、緯度の順にそろえた多角形と、座標系WGS 84の記録です。人です。2、期間と雲の割合の上限で、候補を検索させる。出るのは、製品の名前、観測の日時、区画の番号、雲の割合の一覧です。割合は範囲で指定し、0は不明を含むことに注意します。AIです。3、候補の輪郭が、範囲を全部覆うかを、地図で確かめる。1枚で全部覆う、2枚以上が要る、端が切れている、の判定を出します。人です。4、選んだ製品を、利用の条件に合う表記を付けて保存させる。製品の名前、取得した日、表記の文言を、記録に書かせます。AIです。5、保存した画像の端に、値0の帯がないかを見る。Sentinel-2で値0は、データが入っていない画素です。人です。この5つを、解析の前に、毎回繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      製品の名前                       観測日       区画     雲の割合
      S2A_MSIL2A_20250503..._T54SUE   2025-05-03   54SUE    0
      S2B_MSIL2A_20250508..._T54SUE   2025-05-08   54SUE    0
      S2C_MSIL2A_20250513..._T54SUE   2025-05-13   54SUE    0
      S2A_MSIL2A_20250523..._T54SUE   2025-05-23   54SUE    0

      aoi  = polygon([(139.76, 35.68), (139.90, 35.68), (139.90, 35.58),
                      (139.76, 35.58), (139.76, 35.68)])
      hits = search(collection="Sentinel-2", level="L2A", area=aoi,
                    start="2025-05-01", end="2025-05-31", cloud_cover=0)
      AIの説明：「5月に雲0%の画像が4枚ありました。最も早い5月3日の1枚を使います」
      → 5月3日の画像を開くと、市の全体が白い雲で覆われていた

      問い：この結果から最初に疑うべきことはどれか
      A. 多角形の座標が緯度、経度の順で、別の場所を検索している
      B. 「雲0%」の条件が、割合が分からない製品（0か−1）を拾い、表の0は「不明」
      C. 5月3日の製品は区画の端にあり、画像が途中までしか入っていない
      D. Level-2Aではなく、Level-1Cを検索している
    highlight: [2, 3, 4, 5, 10, 11]
    say: 宿題です。章のケース問題の問1を出します。ある市の担当者が、AIに、市の全域について、2025年5月の雲の少ないSentinel-2の画像を探して、と頼みました。AIが返した候補の表とコードの抜粋が、画面のものです。4枚とも、区画は54SUE、雲の割合は0。コードの多角形は、139.76、35.68、から始まります。AIの説明は、5月に雲0%の画像が4枚ありました。最も早い5月3日の1枚を使います、でした。担当者が5月3日の画像を開くと、市の全体が、白い雲で覆われていました。この結果から、最初に疑うべきことはどれでしょうか。A、多角形の座標が緯度、経度の順になっていて、別の場所を検索している。B、雲0%の条件が、雲の割合が分からない製品、値が0かマイナス1、を拾っていて、表の0は不明である。C、5月3日の製品は区画の端にあり、画像が途中までしか入っていない。D、Level-2Aではなく、Level-1Cを検索している。この動画でやった、最初の点の読み方と、候補の表の見方を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が画像を市の境界で切り出して報告書に載せ、AIが©ESAと書いた、という場面で、表記の問題点と正しい表記を2行で書く、問2の短答も、そこにあります。

  - kind: cta
    heading: 宿題を解いたら、章のページへ
    action: 出典、指示文の例、誤りを仕込んだ抜粋の解説、ケース問題2問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/codex/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/codex/codex-1-5-open-data-access.html
    credits:
      - "出典：欧州連合「Copernicus Sentinel data licence (rev. 1)」（無償で開かれた利用。表記の文言）"
      - "出典：USGS「Are there any restrictions on the use or redistribution of Landsat data?」（利用や再配布の制限なし。出どころの明記）"
      - "出典：ESA「S2 Products」「S2 Mission」SentiWiki（110km四方の区画、帯の端の途中までの製品、画素の値0、観測の幅290km、5日ごと）"
      - "出典：NASA「The Worldwide Reference System」「Landsat 9 brochure」（233本のパスと248のロウ、観測の幅185km）"
      - "出典：IETF「RFC 7946」、ESA Copernicus Data Space Ecosystem「OData」「OpenSearch」、Copernicus Browserの新機能（経度が先、cloudCoverの0・−1）"
      - "ケース問題と抜粋の場面は架空です"
    say: この章のページには、公式資料の出典、7項目を埋めた指示文の例、誤りを仕込んだ抜粋の解説、そしてケース問題2問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
