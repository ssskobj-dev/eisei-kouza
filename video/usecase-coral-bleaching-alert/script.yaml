# ユースケース解説動画の台本。元の記事：casebook/coral-bleaching-alert.qmd
title: 衛星データでサンゴ白化の警報を毎日無料で：NOAAが世界の礁の95%を監視
series: CASEBOOK
kicker: ユースケース解説
number: 31
total: 221
thumb: 毎日の白化警報
summary: 米国NOAAのCoral Reef Watchは、衛星の海面水温から世界のサンゴ礁の95%の熱ストレスを5km格子で毎日計算し、無料で公開しています。保全の当局や観光の事業者が業務のどこに入れ、何を決める材料にするか、5km格子と水深0.2mという限界、データは無料でも費用が調査と対策に残る理由までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データでサンゴ白化の警報を毎日無料で
    sub: NOAAが世界のサンゴ礁の95%を、5km格子で監視している
    say: サンゴが白化しそうな海域を、船を出さずに毎日知る方法はあるか。答えは、衛星の海面水温から熱ストレスを読むことで、米国のNOAAが無料で公開しています。世界のサンゴ礁の95パーセントを5キロ格子で、毎日更新しています。この動画では、誰が使い、警報がどう作られ、業務のどこに入れて、何を決める材料にするのか。2026年時点の限界と、データが無料でも費用がどこに残るのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 範囲：世界。米国海洋大気庁（NOAA）のCoral Reef Watchが本格運用
      - 誰が：自然保護の当局（環境部局や海域公園）と、ダイビングや観光船の事業者
      - 何のために：熱ストレスの高まりを早く知り、調査と利用制限を準備する
      - 困りごと：水温計を置いた地点と、潜った場所しか分からなかった
    say: 事例の舞台は世界全体です。運用しているのは米国海洋大気庁、NOAAのCoral Reef Watchで、実証ではなく本格運用の製品です。使うのは、自治体の環境部局や海域公園の管理者といった自然保護の当局と、ダイビングや観光船の事業者です。目的は、白化の危険が高まった海域を早く知り、潜水調査の手配や利用の制限を準備することです。従来は、水温計を海中に置いた地点か、潜って見た場所しか分かりませんでした。衛星なら、国をまたいで毎日同じ基準で見られます。

  - kind: steps
    heading: 警報は、どう作られるか
    items:
      - 海面水温（CoralTemp）：複数の衛星の夜間の観測を合わせ、水深0.2mに合わせて較正
      - HotSpot：その日の水温が「最も暑い月の平年値」をどれだけ上回るか。1℃が白化の目安
      - 熱ストレスの積算値（DHW）：直近12週間の1℃以上のHotSpotを足して7で割る。単位は℃・週
      - 警報の段階：HotSpotとDHWの組み合わせで決まる（ストレスなし〜警報レベル5）
    say: 毎日の警報は、4つの段階で作られます。1つ目、海面水温です。複数の衛星の夜間の観測だけを合わせ、昼の日射の影響を避け、水深0.2メートルに合わせて較正しています。2つ目、ホットスポット。その日の水温が、その場所の最も暑い月の平年値をどれだけ上回るかで、1度が白化の目安です。3つ目、熱ストレスの積算値、DHW。直近12週間の、1度以上のホットスポットを足して7で割った値で、単位は度・週です。4つ目、この2つの組み合わせで、警報の段階が決まります。

  - kind: figure
    heading: 熱ストレスの積算値と、警報の段階
    image: figures/usecase-coral-bleaching-alert/levels.svg
    caption: NOAAの基準。4℃・週で礁全体の白化、8℃・週で熱に弱いサンゴの死亡が見込まれる
    say: 段階はこう決まります。DHWが4未満は警戒。4以上8未満が警報レベル1で、礁全体の白化が見込まれます。8以上12未満がレベル2で、熱に弱いサンゴの死亡が見込まれます。12以上20未満がレベル3と4。20以上がレベル5で、8割を超えるサンゴの死亡が見込まれます。日々の変動を抑えるため、警報の地図は直近7日間の最大値で示されます。規模の目安として、NOAAは2023年初めから2025年半ばまで続いた4回目の世界規模の白化で、白化レベルの熱ストレスが世界のサンゴ礁面積の84パーセントに及び、83以上の国と地域で大規模な白化が記録されたとしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-coral-bleaching-alert/flow.svg
    caption: 警報を「調査を出す引き金」にし、制限や対策は調査の結果で決める
    say: 業務の流れを見ます。入る位置は、調査や利用制限を決める前です。まず、対象の礁を決め、該当する5キロ格子と、近くの仮想観測点を確かめます。次に、無料の白化警報メールに登録し、毎週の会議で段階を確認します。警報レベル1になったら、潜水調査の日程と人員を決めます。調査の結果を受けて、立入やダイビングの制限、養殖サンゴの移動、観光客への案内を決めます。最後に、礁の中に置いた水温計の値と衛星の値を照合し、来季の判断の基準を直します。つまり、衛星は引き金で、動くかどうかは人が決めます。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-coral-bleaching-alert/split.svg
    say: 役割の分担はこうなります。衛星の解析が行うのは、海面水温を毎日5キロ格子で推定することと、熱ストレスの積算値と警報の段階を出すことです。人が行うのは、警報の上がった礁に潜水調査を出すこと、利用制限や養殖サンゴの移動を決めること、礁の中の水温を水温計で補うことです。衛星は白化そのものを確かめません。どこに、いつ見に行くかを教えてくれる道具です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.46, 0.54]
    rows:
      - [熱ストレスの積算値（DHW）の地図と時系列, どの礁に調査を出すか、その順番]
      - [警報の段階（直近7日間の最大値）, 利用制限や案内の変更を検討し始める時期]
      - [海域ごとの仮想観測点のゲージ, 海域単位で状況を関係者に共有する共通の指標]
      - [4か月先の白化の見通し, 調査や対策の予算と人員を、季節の前に確保するか]
      - [潜水調査の結果（自社で記録）, 衛星の警報を来季も同じ基準で使ってよいか]
    say: 受け取るデータと、それで決められることを整理します。熱ストレスの積算値の地図と時系列は、どの礁に調査を出すか、その順番の根拠になります。直近7日間の最大値で示される警報の段階は、利用制限や案内の変更を検討し始める時期を教えます。海域ごとの仮想観測点のゲージは、関係者と状況を共有するときの共通の指標になります。4か月先の見通しは、調査や対策の予算と人員を季節の前に確保するかの材料です。基本は二段構えです。警報の段階を調査を出す引き金にし、制限や対策は調査の結果で決めます。衛星の値だけで制限を決めると、礁の中の実態と合わない場面が出ます。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-coral-bleaching-alert/limits.svg
    say: 限界は、NOAA自身が使い方の注意として書いています。1つ目、格子は5キロです。礁池や湾の中、浅瀬と外洋の間の水温差は、格子より細かいので表れません。2つ目、測るのは夜間の、水深0.2メートル相当の水温で、深い場所に生えるサンゴの周りの水温は分かりません。3つ目、雲が多い高緯度では、精度が落ちます。4つ目、分かるのは熱ストレスで、白化そのものではありません。実際に白化したか、どの種が影響を受けたかは、潜水調査で確かめる必要があります。5つ目、病気や台風、陸からの濁りといった、熱以外の原因は対象外です。

  - kind: bullets
    heading: 無償の衛星データで、どこまでできるか
    items:
      - この事例は、無償データだけで成り立つ。NOAAの製品と警報メールは無料で公開
      - 1日1回、前日の観測の結果が出る。処理は米国東部時間の昼ごろ
      - 警報の段階を見るだけなら、解析も専門の技術も要らない
      - 自社の地図に重ねる、礁ごとに集計するなら、GISの作業者が要る
    say: では、無償の衛星データでどこまでできるでしょうか。この事例は、無償データだけで成り立つ使い方です。NOAAの製品と警報メールは無料で公開されていて、衛星データを買う必要はありません。更新は1日1回で、米国東部時間の昼ごろに前日の観測の結果が出ます。警報の段階を見るだけなら、解析も専門の技術も要りません。自社の地図に重ねたり、礁ごとに集計したりするなら、データを扱えるGISの作業者の時間が要ります。

  - kind: table
    heading: 費用の考え方（概算）
    columns: [項目, 考え方]
    widths: [0.3, 0.7]
    rows:
      - [データ, NOAAの製品と警報メールは無料。有償の衛星画像を買う場面はない]
      - [解析, 段階を見るだけなら不要。地図への重ね合わせや集計はGISの作業者の時間]
      - [現地の確認, 潜水調査の人件費と船の費用が中心。金額は公開されていない]
      - [対策, 利用制限による減収、養殖サンゴの移動、関係者への説明。金額は公開されていない]
      - [仮定, "一つの海域で、警報の確認（週1回、1人1時間）と、警報レベル1以降の潜水調査（年2〜3回）だけなら、費用のほぼ全部が調査の人件費と船代。データの費用はゼロ"]
    say: 費用の考え方です。この事例では、有償の衛星画像を買う場面がありません。データと警報メールは無料です。解析も、段階を見るだけなら要りません。費用が残るのは、現地の確認と対策です。潜水調査の人件費と船の費用、利用制限に伴う減収、養殖サンゴの移動、関係者への説明の費用で、金額は公開されていません。仮定として、一つの海域で、週1回1人1時間の警報の確認と、警報レベル1以降の年2〜3回の潜水調査だけを行うなら、費用のほぼ全部が調査の人件費と船代になります。データの費用はゼロです。無料のデータを、費用ゼロと言わないことが要点です。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [礁の位置, 外洋に面し、5km格子の水温で代表できる, 礁池や湾の奥で、格子の中の水温差が大きい]
      - [知りたいこと, 熱ストレスの高まりと、その時期, 実際の白化の有無、種ごとの影響、熱以外の原因]
      - [体制, 警報を受けて調査や制限に動ける, 衛星の警報だけで判断を終えたい]
      - [時間の単位, 週単位で状況を追う, 日の中の数時間の変化を追う]
      - [緯度, 熱帯から亜熱帯, 雲が多い高緯度]
    say: 最後に、向き不向きです。向いているのは、外洋に面して5キロ格子の水温で代表できる礁で、知りたいのが熱ストレスの高まりと時期であり、警報を受けて調査や制限に動ける体制があり、週単位で状況を追う場合です。逆に、礁池や湾の奥で格子の中の水温差が大きい、実際の白化の有無や種ごとの影響、熱以外の原因を知りたい、衛星の警報だけで判断を終えたい、日の中の数時間の変化を追いたい、雲が多い高緯度、という場合は向きません。提案するときは、最初に礁の位置と格子の関係を確かめること、白化を検知すると言わないこと、データ無料を費用ゼロと言わないことが要点です。

  - kind: cta
    heading: 自分の海域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：NOAA Coral Reef Watch「Daily Global 5km Satellite Coral Bleaching Heat Stress Monitoring (v3.1)」 https://coralreefwatch.noaa.gov/product/5km/"
      - "手法：NOAA Coral Reef Watch「Methodology, Product Description, and Data Availability」 https://coralreefwatch.noaa.gov/product/5km/methodology.php"
      - "4回目の世界規模の白化：NOAA NESDIS（2026年6月2日） https://www.nesdis.noaa.gov/news/worlds-fourth-mass-coral-bleaching-event-likely-ended-2025"
      - "費用：データと警報メールが無料であることは、上のNOAAのページで確認（2026年10月30日閲覧）。調査と対策の金額は公開されていない"
    say: この事例をもとに、自分の海域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
