# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第8章「衛星データの水と雪の指数：Sentinel-2の緑と短波赤外で基準を超えた範囲を数え、浸水や積雪の面積を災害データにする」（learn/codex/codex-2-8-water-snow-index.qmd）
title: 衛星データの水と雪の指数：Sentinel-2で浸水の面積を出す、誤り4つ
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 12
total: 30
thumb: NDWIは2つある
summary: 衛星データ（Sentinel-2）の緑B3、近赤外B8、短波赤外B11から水の指数（NDWI、MNDWI）と雪の指数（NDSI）を計算し、基準を超えた画素を数えて、浸水や積雪の面積を災害データにする章。同じ「NDWI」の名前で2つの別の式があること、基準の値は製品ごとに違い出どころが要ること、修正水指数と雪の指数が同じ帯の組で湖が雪になること、緯度経度のまま画素を数えると面積の桁が狂うことを、AIが返したコードと面積の表を一緒にレビューして見つけます。手元で数分でできる地図と表の確かめ方と、宿題つき。
scenes:
  - kind: cover
    heading: 水と雪の指数：範囲を数えて面積に
    sub: 緑B3と短波赤外B11。基準の出どころを書き、メートルの座標で数える
    say: 大雨の翌日の衛星画像から、浸水した範囲は何ヘクタールか、を出すことはできるでしょうか。答えは、目的に合う指数を1つ選び、基準の値とその出どころを書き、基準を超えた画素を数え、メートルの座標で面積に直して、知っている水面や雪で確かめれば、できる、です。指数の計算そのものは短いコードです。しかし、どの帯の組か、基準をいくつにするか、面積をどの座標で数えるか、の3つを人が決めないと、数字だけがそれらしく出ます。この動画では、水と雪の指数のしくみを見たあと、AIが返したコードと面積の表を一緒にレビューして、4つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 水と雪で使う帯の組を守り、基準の値の根拠を書き、基準を超えた範囲の面積を座標ごと確かめられる
      - 水の指数が「緑と近赤外」か「緑と短波赤外」、雪の指数が「緑と短波赤外」で、なぜその組になるのかが分かる
      - 「NDWIは近赤外と短波赤外」と別の式を書く誤り、緯度経度のまま画素を数える誤り、湖が雪になる誤りを、コードと表から見つけられる
    say: この章を終えると、3つのことができるようになります。1つ目、水と雪で使う帯の組を守り、基準の値の根拠を書き、基準を超えた範囲の面積を、座標ごと確かめられること。2つ目、水の指数が、緑と近赤外、または緑と短波赤外、雪の指数が、緑と短波赤外で、なぜその組になるのかが分かること。3つ目、AIが、水の指数は近赤外と短波赤外です、と別の指数の式を自信をもって書く誤り、緯度経度のまま画素を数えて面積にする誤り、湖が雪として数えられる誤りを、コードと表から見つけられることです。

  - kind: figure
    heading: しくみ：帯の組が違う
    image: figures/codex-2-8-water-snow-index/pairs.svg
    say: まず、しくみです。水は、近赤外と短波赤外を吸収して暗く写ります。植物は、近赤外を強く反射します。そこで、緑の反射率から近赤外の反射率を引き、2つの和で割ると、水だけが正の大きな値になり、土と植物は消えます。これが正規化水指数、NDWIです。1996年に、開いた水面を取り出す目的で作られました。この章では、水の指数と呼びます。図の左のカードです。ところが、市街地では、建物の反射が水と混ざり、水の面積を多めに数えてしまいます。そこで、近赤外の代わりに短波赤外を使う、修正正規化水指数、MNDWIが、2006年に作られました。真ん中のカードです。緑と短波赤外の組は、建物の混ざりを抑えます。日本でも、水田に水が入った時期を知るために、この修正水指数が使われています。右のカードが、雪です。雪は、目に見える光を強く反射し、短波赤外をほとんど反射しません。そこで、緑から短波赤外を引き、和で割った、正規化積雪指数、NDSIを使います。値が1に近いほど雪の確からしさが高く、範囲はマイナス1から1です。雲も目に見える光では白く写りますが、多くの雲は短波赤外でも明るいままなので、この指数で雪と分けられます。ただし、薄い巻雲は、必ずしも雪と区別できません。ここで、気づくべきことが1つあります。真ん中と右のカードは、同じ帯の組です。修正水指数と雪の指数は、どちらも緑と短波赤外。短波赤外で暗いものを拾うので、指数の値だけでは、湖と雪は分けられません。

  - kind: table
    heading: 帯と、基準の出どころ
    columns: [項目, Sentinel-2 Level-2A, 補足]
    widths: [0.24, 0.38, 0.38]
    rows:
      - [緑, B3（およそ560nm、10m）, 雪の指数はLandsat 8・9でBand 3、4〜7でBand 2]
      - [近赤外, B8（およそ833nm、10m）, 水の指数（NDWI）の相手。植物の水分の式とは違う]
      - [短波赤外, B11（およそ1614nm、20m）, 雪の指数はLandsat 8・9でBand 6、4〜7でBand 5]
      - [雪の基準, 分類（SCL）は0.35未満を雪でない、0.50以上を確からしさ1（版2.9.0）, MODISは0.4以上かつ近赤外が11%超。NSIDCは0より大きければ雪が少しはある]
      - [水の基準, 指数に付いてこない。場所と季節で確かめて決める, 出どころ（論文、製品の説明書、自分の記録）を必ず書く]
    say: 次に、使う帯と、基準の値の出どころです。表は、公式の資料から写した値です。Sentinel-2なら、緑がB3で、およそ560ナノメートル、10メートル。近赤外がB8で、およそ833ナノメートル、10メートル。短波赤外がB11で、およそ1614ナノメートル、20メートルです。Landsat 8と9の雪の指数は、Band 3とBand 6。Landsat 4から7では、Band 2とBand 5です。衛星が変わると番号が変わります。4行目と5行目が、基準の値です。基準の値は、指数に付いてくるものではありません。MODISの積雪は、指数が0.4以上で、かつ近赤外の反射率が11パーセントより大きい画素を雪とし、緑の反射率が10パーセント未満の画素は雪にしません。暗い水面は近赤外でも暗いので、この明るさの条件で外れます。Sentinel-2の分類では、版2.9.0で、0.35未満を雪でないとし、0.50以上を雪の確からしさ1とします。NSIDCの積雪の製品では、0より大きければ雪が少しはある、です。目的と製品ごとに、こんなに違います。水の指数も同じです。基準は、場所と季節で確かめて決めます。基準の値には、必ず出どころを書きます。論文か、製品の説明書か、自分で知っている水面と陸で決めた記録です。

  - kind: bullets
    heading: 面積の座標も人が決める
    items:
      - Level-2Aは、UTM/WGS84の座標で110km四方の区画。単位はメートル
      - 10mの画素は100平方メートル、20mの画素は400平方メートル
      - 緯度経度に直してから数えると、画素の大きさが「度」になり、10m×10mの計算は意味を失う
      - 面積は、メートルが単位の座標で数える。座標の名前と1画素の面積を表に書く
    say: 面積の座標も、人が決めます。Sentinel-2のLevel-2Aは、UTM、WGS84の座標で、110キロメートル四方の区画に切られています。この座標では、メートルが単位です。だから、10メートルの画素は100平方メートル、20メートルの画素は400平方メートルです。ところが、緯度経度の座標に直してから画素を数えると、画素の大きさが、度になります。10メートル掛ける10メートル、をかける計算は、意味を失います。面積は、メートルが単位の座標で数えます。使った座標の名前と、1画素の面積を、表に書きます。これだけで、あとで桁の誤りに気づけます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [NDWIで水を抜き出して, 緑B3と近赤外B8の正規化水指数（McFeeters 1996）で。近赤外と短波赤外の式（Gao 1996）ではない]
      - [水っぽい画素を数えて, 基準は0より大きい画素。湖の中央と屋根の値を見て基準を見直し、使った値を表に書いて]
      - [面積をヘクタールで出して, UTMの座標のまま、20m画素を400平方メートルとして数えて。座標の名前も表に出して]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。NDWIで水を抜き出して、だけでは危ないのには、理由があります。NDWIという名前には、2つの別の式があるからです。緑と近赤外から、開いた水面を取り出す、1996年のマクフィーターズの式と、近赤外と短波赤外から、植物の中の水分を見る、同じ1996年のガオの式です。後者は、正規化水分指数、NDMIとも呼ばれます。名前だけで頼むと、AIはどちらかを自信をもって選びます。だから、帯の番号で指示します。緑B3と近赤外B8の正規化水指数で。近赤外と短波赤外の式ではない、と書きます。水っぽい画素を数えて、ではなく、基準は0より大きい画素。湖の中央と屋根の値を見て基準を見直し、使った値を表に書いて、と頼みます。なお、0より大きい、は、この章の指示文の例で置いた値です。面積をヘクタールで出して、ではなく、UTMの座標のまま、20メートル画素を400平方メートルとして数えて。座標の名前も表に出して、と頼みます。指示の7項目のうち、確かめ方には、湖の中央の画素の指数と、市街地の屋根の画素の指数を表示すること、平常時の水の面積が、湖の面積として知られている値と近いことを示すこと、座標の名前を表示することを入れます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 水と雪の面積（誤りあり）
      g, n, s = read_bands(p, ["B3", "B8", "B11"])   # 緑, 近赤外, 短波赤外
      s = resample_to(s, g)                          # 20m → 10m
      ndwi = (n - s) / (n + s)                       # 近赤外と短波赤外
      ndsi = (g - s) / (g + s)                       # 緑と短波赤外
      water = ndwi > 0.4                             # 基準0.4（出どころなし）
      snow  = ndsi > 0.4                             # 湖も0.4を超える
      water, snow = to_latlon(water), to_latlon(snow)
      area_water_ha = count(water) * 100 / 10000     # 緯度経度のまま10m×10m
    highlight: [4, 6, 7, 8, 9]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。水の指数、NDWIは、近赤外と短波赤外から計算します。雪の指数は、緑と短波赤外です。基準は、標準的な0.4にしました。面積は、緯度経度に直して画素を数え、10メートル画素なので、100平方メートルをかけました。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、波長帯。帯の組が、目的の指数と合っているか。2、基準の値。出どころが、コードか記録に書いてあるか。そして、水と雪を、同じ帯の組だけで分けていないか。3、位置と座標。面積を、メートルが単位の座標で数えているか。4、面積。画素の大きさと、1画素の面積が合っているか。まず、2行目。B3、B8、B11。緑、近赤外、短波赤外を読んでいます。3行目。20メートルのB11を、10メートルにそろえています。ここまでは問題ありません。4行目。ndwi、イコール、n引くs、割る、n足すs。近赤外と短波赤外です。5行目。ndsi、イコール、g引くs、割る、g足すs。緑と短波赤外。これは雪の指数の式と合っています。6行目。water、イコール、ndwi、大なり、0.4。7行目。snow、イコール、ndsi、大なり、0.4。8行目。to_latlon。緯度経度に直しています。9行目。count、water、掛ける100、割る10000。このコードは、動かしても止まりません。地図も表も出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.09, 0.13, 0.30, 0.48]
    rows:
      - ["4", 波長帯, "(n - s) / (n + s)。「水の指数は近赤外と短波赤外」", "植物の水分の指数（Gao 1996）で、水面の式ではない。正しくは緑と近赤外 (g - n)/(g + n)。建物を抑えるなら緑と短波赤外"]
      - ["6", 基準の値, "ndwi > 0.4。「標準的な0.4」", "0.4はMODISの積雪の判定の値で、水の基準ではない。基準と出どころを書き、湖の中央と屋根の値を見て決める"]
      - ["7", 水と雪, "ndsi > 0.4。「雪は緑と短波赤外」", "式は合っているが、短波赤外で暗い湖も0.4を超える。近赤外の明るさの条件を足す：(ndsi > 0.4) & (n > 0.11)"]
      - ["8・9", 座標と面積, "to_latlon のあと count × 100。「緯度経度に直して10m画素」", "緯度経度の画素は度が単位。UTMのまま数える。座標を変えたなら、その座標の1画素の面積を計算し直す"]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、4行目。近赤外と短波赤外の組は、植物の中の水分を見る指数で、開いた水面を取り出す式ではありません。同じNDWIの名前で2つの別の式があることを、AIは知らないか、片方しか知りません。正しくは、g引くn、割る、g足すn。建物の混ざりを抑えたいなら、g引くs、割る、g足すs、です。2つ目、6行目。0.4は、MODISの積雪の判定で使われる値で、水の指数の基準ではありません。出どころの違う数字を、AIが標準的と言って当てています。正しくは、基準の値と出どころを書き、湖の中央と屋根の値を見て決めます。3つ目、7行目。雪の指数の式そのものは合っています。しかし、雪の指数は緑と短波赤外なので、短波赤外で暗い湖も、0.4を超えます。正しくは、近赤外の反射率が一定より大きい、という明るさの条件を足します。ndsi大なり0.4、かつ、n大なり0.11、のように、条件と出どころを書きます。4つ目、8行目と9行目。緯度経度に直したあとで画素を数え、10メートル掛ける10メートルをかけています。緯度経度の画素は、度が単位で、10メートルではありません。正しくは、UTMのまま数えます。座標を変えたなら、その座標の1画素の面積を、計算し直します。この4つのうち、3つ目は、地図を見れば気づきます。湖が雪の色になるからです。4つ目は、面積の桁が流域の大きさと合わないので、表を見れば気づけます。1つ目と2つ目は、地図も表も、もっともらしく見えるので、最も隠れやすい誤りです。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：地図と表を見る
    items:
      - 知っている湖が、水として拾われているか。拾われていなければ、帯の組か、引き算の向きが逆
      - 市街地の屋根や道路が、水になっていないか。緑と近赤外の式なら、緑と短波赤外に変えて比べる
      - 水田が、浸水として数えられていないか。水の入った田は指数では水。平常時の画像を引く
      - 湖が、雪になっていないか。同じ帯の組なので、明るさの条件がないと湖が雪になる
      - 雲が、雪になっていないか。薄い巻雲は分かれないことがある。分類の10を除いたか
      - 面積の桁が、地図の大きさと合っているか。流域100km²で水1,000km²なら、座標か1画素の面積
    say: 判定を、手元でやってみます。AIに頼んだ人なら、できた、基準を超えた画素の地図と、面積の表を見ながら、数分でできます。1つ目、知っている湖が、水として拾われているか。拾われていなければ、帯の組か、引き算の向きが逆です。2つ目、市街地の屋根や道路が、水になっていないか。緑と近赤外の式では、建物が水と混ざり、面積が多めになります。市街地の浸水なら、緑と短波赤外の式に変えて比べます。高い建物の北側に、細長い水が並ぶなら、それは建物の影です。3つ目、水田が、浸水として数えられていないか。水の入った田は、指数では水です。田植えの時期に浸水を数えるなら、同じ季節の平常時の画像を引きます。4つ目、湖が、雪になっていないか。同じ帯の組なので、明るさの条件がないと、湖が雪になります。5つ目、雲が、雪になっていないか。多くの雲は短波赤外で明るいので雪と分かれますが、薄い巻雲は分かれないことがあります。分類の10、薄い雲を、除いたかを見ます。6つ目、面積の桁が、地図の大きさと合っているか。流域が100平方キロメートルなのに、水が1,000平方キロメートルなら、座標か、1画素の面積の誤りです。この6つを、報告の前にやります。

  - kind: figure
    heading: 取り違えと、2つの例
    image: figures/codex-2-8-water-snow-index/confusions.svg
    say: 図は、水と雪の取り違えが起きる場所です。左が、水に見えてしまうもの。緑と近赤外の式での市街地の建物、高い建物の北側の影、水の入った田、雲の影。右が、雪に見えてしまうもの。短波赤外で暗い湖と川、薄い巻雲、凍った湖、そして、明るさの条件がない判定です。どちらも、基準の出どころと、明るさの条件と、平常時の画像との差で確かめます。おかしな結果の例を2つ。例1、浸水の面積が、流域の面積の3倍になった。面積の桁が、地図の大きさと矛盾しています。緯度経度に直してから画素を数え、10メートル掛ける10メートルをかけると、画素の数が座標の変換で変わるうえ、1画素の大きさが度になります。原因は、面積を数えた座標です。UTMのまま数え直し、1画素の面積と座標の名前を表に書きます。例2、5月の画像で、流域の平野部が一面、浸水になった。大雨はなく、平野部は水田です。水の入った田は、指数では水です。原因は、浸水と平常時の水を分けていないことです。同じ季節の平常時の画像の水を引くか、水田の区画を別に数えます。言えるのは、この帯の組とこの基準で、この座標で数えた、基準を超えた範囲の面積です。帯、基準、座標、除いた画素の割合を表に書けば、別の日と比べられます。言えないのは、浸水の深さと、雪の深さです。指数は、水や雪が画素を覆っているかを見る目安で、厚さは分かりません。雲の下も分かりません。基準の出どころが書いていない面積は、再現できないので、報告には使えません。日本の水田の例では、水の入った区画の判定を、同じ日の航空写真と照らし、面積で98パーセントが合っています。確かめる相手があって初めて、精度が言えます。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 水の深さや、雪の量を知りたいとき。指数は覆っているかの目安で、厚さは出ない
      - 木の下の水や、建物の間の細い水路。光学の画像には写らない。レーダーか現地の情報と組み合わせる
      - 雲の多い日。雲の下は分からない。薄い巻雲は雪と区別できないことがある
      - 凍った湖と、雪の区別。氷も短波赤外で暗い。季節と場所の知識で判断する
      - 有償の商用データ。短波赤外の帯がない衛星もある。帯の表を契約の仕様書で確かめる
    say: 向かない条件も、押さえておきます。1つ目、水の深さや、雪の量を知りたいとき。指数は覆っているかの目安で、厚さは出ません。深さは、地形の高さと水際の位置から、別に推定します。2つ目、木の下の水や、建物の間の細い水路。画素より細いもの、葉の下のものは、光学の画像には写りません。レーダーの画像か、現地の情報と組み合わせます。3つ目、雲の多い日。雲の下は分かりません。薄い巻雲は、雪と区別できないことがあります。別の日か、レーダーの画像を検討します。4つ目、凍った湖と、雪の区別。氷も短波赤外で暗いので、指数だけでは雪と分けられません。季節と場所の知識で判断します。5つ目、有償の商用データを使うとき。考え方は同じですが、短波赤外の帯がない衛星もあります。帯の表を契約の仕様書で確かめ、無い帯の指数は使えないと、先に決めます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 目的に合う指数と帯、基準の値と出どころを決める。指数の名前、帯の番号、基準の表（人）
      - 帯を読み、画素の大きさをそろえ、ずらしと倍率で反射率に直させる。使った座標の名前も（AI）
      - 雲と影（SCLの3、8、9、10）を除き、指数と、基準を超えた画素の地図を作らせる（AI）
      - メートルの座標で画素を数え、面積に直させる。画素の数、1画素の面積、合計、座標の名前の表（AI）
      - 知っている水面と雪で確かめる。湖が水か、屋根が水でないか、湖が雪でないか、面積の桁（人）
    say: 手順をまとめます。1、目的に合う指数と帯、基準の値と出どころを決める。入れるのは、見たいもの。開いた水面か、市街地の浸水か、積雪か。出るのは、指数の名前、帯の番号、基準の値と出どころの表です。人です。2、帯を読み、画素の大きさをそろえ、反射率に直させる。入れるのは、製品の名前と1の表。出るのは、同じ画素数にそろえた2枚と、ずらしと倍率で直した記録、使った座標の名前です。AIです。3、雲と影を除き、指数と、基準を超えた画素の地図を作らせる。入れるのは、分類の画像と除く番号、3、8、9、10。出るのは、指数の1枚、基準を超えた画素の地図、除いた画素の割合です。AIです。4、メートルの座標で画素を数え、面積に直させる。出るのは、基準を超えた画素の数、1画素の面積、合計の面積、使った座標の名前です。AIです。5、知っている水面と雪で確かめる。入れるのは、4の地図と、湖、川、市街地、山頂の位置。出るのは、湖が水として拾われているか、市街地の屋根が水になっていないか、湖が雪になっていないか、面積の桁が地図の大きさと合うか、の判定です。人です。この5つを、面積を出すごとに繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      n = read_band(p, "B8")                   # 近赤外
      s = resample_to(read_band(p, "B11"), n)  # 短波赤外 20m → 10m
      ndwi = (n - s) / (n + s)
      water = ndwi > 0.4
      water = to_latlon(water)
      area_ha = count(water) * 100 / 10000

      AIの説明：「浸水の面積は1,840ヘクタールです。水の指数（NDWI）は近赤外と
      　短波赤外から計算し、標準的な基準の0.4で水を抜き出しました。面積は
      　緯度経度に直してから画素を数え、10m画素なので100平方メートルをかけています」
      → 町の中央の湖（およそ120ヘクタール）が水として拾われず、
      　代わりに山の森の広い部分が「水」になった

      問い：この結果から最初に疑うべきことはどれか
      A. 基準の0.4が高すぎて、湖が水として拾われなかった
      B. 「水の指数」の式は、近赤外と短波赤外から植物の中の水分を見る別の指数で、
      　 開いた水面を取り出す式（緑と近赤外、または緑と短波赤外）ではない
      C. 緯度経度に直したときに画素がずれて、湖の位置が森に移った
      D. 短波赤外を10mに再標本化したので、湖の縁がぼやけた
    highlight: [3, 4]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、大雨の翌日の浸水した範囲の面積をヘクタールで出して、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。浸水の面積は1840ヘクタールです。水の指数、NDWIは、近赤外と短波赤外から計算し、標準的な基準の0.4で水を抜き出しました。面積は、緯度経度に直してから画素を数え、10メートル画素なので、100平方メートルをかけています。できた地図では、町の中央の湖、面積はおよそ120ヘクタールと知られています、が、水として拾われておらず、代わりに、山の森の広い部分が、水になっていました。この結果から、最初に疑うべきことはどれでしょうか。A、基準の0.4が高すぎて、湖が水として拾われなかった。B、水の指数として書かれた式は、近赤外と短波赤外から植物の中の水分を見る別の指数で、開いた水面を取り出す式ではない。C、緯度経度に直したときに画素がずれて、湖の位置が森に移った。D、短波赤外を10メートルに再標本化したので、湖の縁がぼやけた。この動画で見た、帯の組と、判定の表を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が式を直したあと、町の面積が約9000ヘクタールなのに、平常時の水の面積が約1万4000ヘクタールと出て、AIが、大雨の前から水が多い地域です、と説明した場面で、説明の問題点と確かめるべきことを2行で書く、問2の短答も、そこにあります。

