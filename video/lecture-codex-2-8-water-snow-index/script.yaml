# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第8章「衛星データの水と雪の指数：Sentinel-2の緑と短波長赤外で基準を超えた範囲を数え、浸水や積雪の面積を災害データにする」（learn/codex/codex-2-8-water-snow-index.qmd）
# 2026-11-27 修正版（ナレーションを話し言葉に。用語を NDWI・MNDWI・NDSI に統一。計算例を置いた。別の目の点検 A・B を反映）
title: 衛星データのNDWI・NDSI：Sentinel-2で浸水と積雪の面積、誤り4つ
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 12
total: 30
thumb: NDWIは2つある
summary: 衛星データ（Sentinel-2）の緑B3、近赤外B8、短波長赤外B11から、水を取り出すNDWIとMNDWI、雪を取り出すNDSIを計算し、基準を超えた画素を数えて、浸水や積雪の面積を災害データにする章。同じ「NDWI」の名前で2つの別の式があること、基準の値（0.4、0.35、0）は製品ごとに違い出どころが要ること、MNDWIとNDSIが同じ帯域の組で湖が雪になること、緯度経度のまま画素を数えると面積の桁が狂うことを、AIが返した擬似コードと面積の表を一緒に点検して見つけます。手元で数分でできる地図と表の確かめ方と、宿題つき。
scenes:
  - kind: cover
    heading: NDWIとNDSI：範囲を数えて面積に
    sub: 緑B3と短波長赤外B11。基準の出どころを書き、メートルの座標で数える
    say: 大雨の翌日の衛星画像から、浸水した範囲が何ヘクタールか。そんな数字を出せるでしょうか。答えは、出せます。やることは3つです。水を取り出す指数を1つ選んで計算する。基準の値を決めて、それを超えた画素を数える。そして、メートルの座標で面積に直す。ただし、ここがポイントです。指数の計算そのものは数行で済みます。ところが、どの帯域の組を使うか、基準をいくつにするか、どの座標で数えるか。この3つを人が決めないと、それらしい数字だけが出てきます。この動画では、まずNDWIとNDSIのしくみを見て、そのあとAIが返したコードと面積の表を一緒に点検して、4つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - Sentinel-2の緑B3と短波長赤外B11（20m）からMNDWIを計算し、基準を超えた画素を数えて浸水の面積をヘクタールで出せる
      - NDWI・MNDWI・NDSIの帯域の組を言え、湖がNDSIで0.4を超えて雪に数えられるしくみが分かる
      - 町が9,000haなのに水が14,000haのように桁が合わない表を見て、緯度経度のまま数えた誤りを疑える
    say: この動画を見終わると、3つのことができるようになります。1つ目は、浸水の面積を表にできるようになることです。緑B3と短波長赤外B11から、水を取り出すMNDWIという指数を計算して、基準を超えた画素を数え、何ヘクタールかを出します。Level-2Aには、20メートル用のフォルダにもB3が入っているので、章の指示文ではそちらのB3とB11を使い、20メートルの画素で数えます。画素1つが400平方メートル、という計算です。2つ目は、3つの指数の帯域の組を覚えて帰れることです。NDWIは緑と近赤外、MNDWIとNDSIは緑と短波長赤外。ここで気づきますよね。後ろの2つは同じ組です。だから、湖がNDSIでも0.4を超えて、雪に数えられてしまう。このしくみが分かります。3つ目は、桁のおかしな表に気づけることです。町の面積が9000ヘクタールなのに、水が1万4000ヘクタール。こんな表が出てきたら、面積を数えた座標を疑います。

  - kind: figure
    heading: しくみ：NDWIとMNDWI
    image: figures/codex-2-8-water-snow-index/pairs.svg
    say: まず、しくみから。衛星の画像は小さなマス目の集まりで、このマス目を画素と呼びます。画素ごとに、地面が光をどれだけ跳ね返したか、つまり反射率が分かります。ここで、水の性質を1つ。水は、近赤外と短波長赤外の光を吸収して、暗く写ります。逆に植物は、近赤外を強く跳ね返します。だから、緑の反射率から近赤外の反射率を引いて、2つの和で割る。水が正、土と植物が0以下になるように帯域を選んだ式です。これが正規化水指数、NDWIで、1996年に、開いた水面を取り出すために作られました。図の左のカードですね。実際に計算してみましょう。湖の画素で、緑が0.1、近赤外が0.02だとします。差は0.08、和は0.12。0.08割る0.12で、およそ0.67。正の値です。では畑はどうでしょう。緑が0.1、近赤外が0.4なら、差はマイナス0.3、和は0.5で、マイナス0.6。負になって消えます。ところが、市街地では話が変わります。建物の反射が水と混ざって、水の面積を多めに数えてしまうんです。そこで、近赤外の代わりに短波長赤外を使うのが、真ん中のカード、修正正規化水指数、MNDWIです。2006年に作られました。緑と短波長赤外の組は、建物の混ざりを抑えます。日本でも、水田に水が入った時期を知るのに、MNDWIが使われています。

  - kind: figure
    heading: しくみ：NDSIと、同じ組の落とし穴
    image: figures/codex-2-8-water-snow-index/pairs.svg
    say: 右のカードが雪です。雪は、目に見える光を強く跳ね返して、短波長赤外はほとんど跳ね返しません。だから、緑から短波長赤外を引いて、和で割る。これが正規化積雪指数、NDSIです。値はマイナス1から1の間で、1に近いほど雪の確からしさが高い。たとえば雪の画素で、緑が0.8、短波長赤外が0.1なら、0.7割る0.9で、およそ0.78です。雲も目に見える光では白いのですが、多くの雲は短波長赤外でも明るいままなので、NDSIで雪と分けられます。ただし、薄い巻雲、空の高いところにある薄い雲は、必ずしも分けられません。さて、ここで気づいてほしいことが1つあります。真ん中と右のカード、同じ組ですよね。MNDWIもNDSIも、緑と短波長赤外。どちらも、短波長赤外で暗いものを拾います。さっきの湖の画素で、短波長赤外も0.02だとすると、NDSIも0.08割る0.12で、0.67。雪と同じくらい高い値です。つまり、指数の値だけでは、湖と雪は分けられないんです。

  - kind: table
    heading: 帯域と、基準の出どころ
    columns: [項目, Sentinel-2 Level-2A, 補足]
    widths: [0.24, 0.38, 0.38]
    rows:
      - [緑, B3（およそ560nm、10m）, NDSIはLandsat 8・9でBand 3、4〜7でBand 2]
      - [近赤外, B8（およそ833nm、10m）, NDWIの相手。近赤外と短波長赤外の式は植物の水分の指数]
      - [短波長赤外, B11（およそ1614nm、20m）, NDSIはLandsat 8・9でBand 6、4〜7でBand 5]
      - [雪の基準, 分類（SCL）は0.35未満を雪でない、0.50以上を確からしさ1（版2.9.0）, MODISは0.4以上かつ近赤外が11%超。NSIDCは0より大きければ雪が少しはある]
      - [水の基準, 指数に付いてこない。場所と季節で確かめて決める, 出どころ（論文、製品の説明書、自分の記録）を必ず書く]
    say: 次に、使う波長の帯域、バンドの番号です。Sentinel-2では、緑がB3、近赤外がB8で、どちらも10メートルの画素。短波長赤外がB11で、こちらは20メートルです。ここで気をつけたいのは、衛星が変わると番号も変わること。Landsat 8と9のNDSIはBand 3とBand 6、もっと古いLandsatではBand 2とBand 5です。番号は、使う衛星の表で毎回確かめてください。それから、B11は20メートルで、B3は10メートル。大きさが違うので、そろえてから重ねます。やり方は2つ。B11を10メートルに引き伸ばすか、20メートル用のフォルダのB3を使うか。どちらにしても、数える画素の大きさに合わせて、1画素の面積も100か400に変えます。4行目と5行目が、基準の値です。これが今日の大事なところの1つです。基準の値は、指数に付いてくるものではありません。製品ごとに、こんなに違います。MODISの積雪では、NDSIが0.4以上で、かつ近赤外の反射率が11パーセントより大きい画素を雪とします。緑の反射率が10パーセント未満なら、雪にしません。なぜ明るさの条件が要るのでしょうか。さっきの湖を思い出してください。湖はNDSIが0.67と高いのですが、近赤外は0.02、つまり2パーセントしかない。11パーセントに届かないので、ここで外れます。Sentinel-2のLevel-2Aには、画素ごとに雲、水、雪などの種類を番号で付けた画像が付いてきます。これがSCLです。このSCLの雪の判定では、版2.9.0で、0.35未満を雪でない、0.50以上を雪の確からしさ1とします。NSIDCの積雪の製品では、0より大きければ雪が少しはある、です。同じNDSIでも、0.4、0.35、0。これだけ違うんです。水の基準も同じで、場所と季節で確かめて決めます。だから基準の値には、必ず出どころを書きます。論文か、製品の説明書か、自分で知っている水面と陸で決めた記録か。出どころのない数字は、AIが補った数字だと思ってください。

  - kind: bullets
    heading: 面積の座標も人が決める
    items:
      - Level-2Aは、UTM/WGS84の座標で110km四方の区画。単位はメートル
      - 10mの画素は100平方メートル、20mの画素は400平方メートル
      - 緯度経度に直してから数えると、画素の大きさが「度」になり、10m×10mの計算は意味を失う
      - 面積は、メートルが単位の座標で数える。座標の名前と1画素の面積を表に書く
    say: 面積をどの座標で数えるかも、人が決めます。Sentinel-2のLevel-2Aは、UTMという座標で、110キロメートル四方の区画に切られて配られます。この座標は、単位がメートルです。だから、10メートルの画素は100平方メートル、20メートルの画素は400平方メートル。たとえば、120ヘクタールの湖なら、120ヘクタールは120万平方メートルですから、20メートルの画素で3000個分、10メートルの画素なら1万2000個分です。画素を数えて1画素の面積をかければ、面積になりますよね。ところが、緯度経度の座標に直してから数えると、どうなるでしょうか。画素の大きさの単位が、メートルではなく、度になります。度に10メートル掛ける10メートルをかけても、意味のある数字にはなりません。つまり、面積はメートルが単位の座標で数える。そして、使った座標の名前と、1画素の面積を、表に書いておく。これだけで、あとから桁の誤りに気づけます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [NDWIで水を抜き出して, 緑B3と近赤外B8のNDWI（McFeeters 1996）で。近赤外と短波長赤外の式（Gao 1996）ではない]
      - [水っぽい画素を数えて, 基準は0より大きい画素。湖の中央と屋根の値を見て基準を見直し、使った値を表に書いて]
      - [面積をヘクタールで出して, UTMの座標のまま、20m画素を400平方メートルとして数えて。座標の名前も表に出して]
    say: では、AIにどう頼むか。左があいまいな頼み方、右が直した頼み方です。NDWIで水を抜き出して。これのどこが危ないのでしょうか。実は、NDWIという名前には、2つの別の式があります。1つは、さっき見た、緑と近赤外から開いた水面を取り出す式。もう1つは、近赤外と短波長赤外から、植物の中の水分を見る式です。後者は、正規化水分指数、NDMIとも呼ばれます。どちらも1996年に出て、どちらもNDWIと呼ばれる。だから、名前だけで頼むと、AIはどちらかを自信をもって選びます。帯域の番号で指示するのは、そのためです。2行目。水っぽい画素を数えて、では、基準をAIが決めてしまいます。基準は0より大きい画素、と値を書いて、湖の中央と屋根の値を見て見直すこと、使った値を表に書くことまで頼みます。この0より大きい、という値は、章の指示文の例で置いたものです。3行目。面積をヘクタールで出して、だけだと、座標をAIが変えてしまうかもしれません。UTMのまま、20メートル画素を400平方メートルとして数えて、座標の名前も表に出して、と頼みます。それから、確かめ方も先に頼んでおきましょう。まず、湖の中央の画素の値と、市街地の屋根の画素の値を表示してもらいます。次に、平常時の水の面積が、知られている湖の面積に近いことを示してもらいます。最後に、使った座標の名前を表示してもらう。この3つです。指示文の全文は、章のページにあります。

  - kind: code
    heading: 一緒に：擬似コードを読む
    code: |
      # 水と雪の面積（誤りあり・説明用の擬似コード）
      g, n, s = read_bands(p, ["B3", "B8", "B11"])   # 緑, 近赤外, 短波長赤外
      s = resample_to(s, g)                          # 20m → 10m
      ndwi = (n - s) / (n + s)                       # 近赤外と短波長赤外
      ndsi = (g - s) / (g + s)                       # 緑と短波長赤外
      water = ndwi > 0.4                             # 基準0.4（出どころなし）
      snow  = ndsi > 0.4                             # 湖も0.4を超える
      water, snow = to_latlon(water), to_latlon(snow)
      area_water_ha = count(water) * 100 / 10000     # 緯度経度のまま10m×10m
    highlight: [4, 6, 7, 8, 9]
    say: ここからは、一緒に点検していきましょう。AIはこう説明してきました。NDWIは近赤外と短波長赤外から計算します。NDSIは緑と短波長赤外です。基準は標準的な0.4にしました。面積は、緯度経度に直して画素を数え、10メートル画素なので100平方メートルをかけました。自信のある口調ですよね。画面に出ているのは、説明用に短くした擬似コードです。帯域、基準、座標、1画素の面積、の4つを上から見ていきます。2行目、B3、B8、B11の3つを読んでいます。3行目で、20メートルのB11を10メートルにそろえています。ここまでは大丈夫そうです。4行目、NDWIを計算していますが、使っているのは近赤外と短波長赤外です。ここ、引っかかりませんか。5行目はNDSI。緑と短波長赤外で、こちらは式が合っています。6行目と7行目、どちらも0.4より大きい画素を取っています。水も雪も、同じ0.4です。8行目で緯度経度に直して、9行目で画素の数に100をかけて、1万で割ってヘクタールにしています。さて、このコード、動かしても止まりません。地図も表もちゃんと出ます。だからこそ、確かめる手順を先に決めておくんです。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.09, 0.13, 0.30, 0.48]
    rows:
      - ["4", 帯域の組, "(n - s) / (n + s)。「近赤外と短波長赤外で計算」", "植物の水分の指数（Gao 1996）で、水面の式ではない。正しくは緑と近赤外 (g - n)/(g + n)。建物を抑えるなら緑と短波長赤外"]
      - ["6", 基準の値, "ndwi > 0.4。「標準的な0.4」", "0.4はMODISの積雪の判定の値で、水の基準ではない。基準と出どころを書き、湖の中央と屋根の値を見て決める"]
      - ["7", 水と雪, "ndsi > 0.4。「雪は緑と短波長赤外」", "式は合っているが、短波長赤外で暗い湖も0.4を超える。近赤外の明るさの条件を足す：(ndsi > 0.4) & (n > 0.11)"]
      - ["8・9", 座標と面積, "to_latlon のあと count × 100。「緯度経度に直して10m画素」", "緯度経度の画素は度が単位。UTMのまま数える。座標を変えたなら、その座標の1画素の面積を計算し直す"]
    say: 判定の結果がこの表です。行の順に、4つ見ていきます。まず4行目。近赤外と短波長赤外の組は、植物の中の水分を見る指数で、開いた水面を取り出す式ではありません。同じNDWIという名前で2つの式があることを、AIは片方しか知らないんです。この式だと、何が起きるでしょうか。たとえば森の画素で、近赤外が0.4、短波長赤外が0.15なら、0.25割る0.55で、およそ0.45。0.4を超えて、森が水になります。逆に湖は、近赤外も短波長赤外も0.02くらいで暗いので、差がほとんどなく、値は0の近くでふらつきます。0.4は超えにくいので、湖は拾われません。正しくは、緑と近赤外。建物の混ざりを抑えたいなら、緑と短波長赤外です。次に6行目、基準の0.4。これはMODISの積雪の判定で使われる値で、水の基準ではありません。出どころの違う数字を、AIが標準的と言って当てています。正しくは、基準の値と出どころを書いて、湖の中央と屋根の値を見て決めます。7行目。NDSIの式そのものは合っています。ところが、緑と短波長赤外の組なので、さっき計算したとおり、湖も0.67で0.4を超えますよね。だから、近赤外が0.11より大きい、という明るさの条件を足して、その出どころも書きます。最後に8行目と9行目。緯度経度に直してから画素を数えて、100平方メートルをかけています。でも、緯度経度の画素は度が単位で、10メートルではありません。UTMのまま数えるか、座標を変えたなら、その座標での1画素の面積を計算し直します。さて、この4つのうち、7行目は地図を見ればすぐ気づきます。湖が雪の色になるからです。8行目と9行目も、面積の桁が流域の大きさと合わないので、表を見れば気づけます。ところが4行目と6行目は、表の数字だけ見るともっともらしい。4行目は、知っている湖を地図で見に行って、初めて気づけます。6行目は、式が正しければ湖は0.67で拾われるので、地図では分かりません。湖の中央と屋根の画素の値を表示させて、初めて気づけます。いちばん隠れやすい誤りです。判定が出たら、AIに何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：地図と表を見る
    items:
      - 知っている湖が、水として拾われているか。拾われていなければ、帯域の組か、引き算の向きが逆
      - 市街地の屋根や道路が、水になっていないか。緑と近赤外の式なら、緑と短波長赤外に変えて比べる
      - 水田が、浸水として数えられていないか。水の入った田は指数では水。平常時の画像を引く
      - 湖が、雪になっていないか。同じ帯域の組なので、明るさの条件がないと湖が雪になる
      - 雲が、雪になっていないか。薄い巻雲は分かれないことがある。分類の10を除いたか
      - 面積の桁が、地図の大きさと合っているか。流域100km²で水1,000km²なら、座標か1画素の面積
    say: ここからは、手元でやってみましょう。用意するのは、基準を超えた画素を塗った地図と、面積の表。この2つがあれば、数分でできます。1つ目、知っている湖を地図で見に行きます。水になっていますか。なっていなければ、帯域の組が違うか、引き算の向きが逆です。2つ目、市街地です。屋根や道路が水になっていませんか。緑と近赤外のNDWIだと、建物が水と混ざって面積が多めに出ます。市街地の浸水を数えるなら、緑と短波長赤外のMNDWIに変えて、比べてみてください。それから、高い建物の北側に細長い水が並んでいたら、建物の影の可能性が高いです。ただし、これを数字で確かめた出典はまだありません。目で見るときの手がかりとして覚えておいてください。3つ目、水田。水の入った田は、指数では水そのものです。田植えの時期に浸水を数えるなら、同じ季節の平常時の画像を引かないと、田んぼが全部浸水になります。4つ目、湖が雪になっていませんか。さっき見たとおり、MNDWIとNDSIは同じ組なので、明るさの条件がないと湖が雪になります。5つ目、雲が雪になっていませんか。多くの雲はNDSIで分かれますが、薄い巻雲は分かれないことがあります。分類の10、薄い雲を除いたかを見ます。6つ目、面積の桁です。たとえば、流域が100平方キロメートルなのに、水が1000平方キロメートル。流域の10倍の水はありえませんよね。座標か、1画素の面積の誤りです。この6つを、報告の前に必ずやってください。

  - kind: figure
    heading: 取り違えと、2つの例
    image: figures/codex-2-8-water-snow-index/confusions.svg
    say: この図は、取り違えが起きる場所をまとめたものです。左が、水に見えてしまうもの。緑と近赤外のNDWIだと、市街地の建物が水と混ざります。高い建物の北側の影や、雲の影は、全部の帯域で暗いので、指数がふらついて水に見えることがあります。水の入った田は、指数では本当に水です。右が、雪に見えてしまうもの。短波長赤外で暗い湖と川は、さっき計算したとおり、NDSIが高く出ます。薄い巻雲は、NDSIでは必ずしも雪と分けられません。凍った湖も、氷が短波長赤外で暗いとされていて、雪に見えることがあります。そして、明るさの条件を付けていない判定そのものが、これらを全部雪にしてしまいます。どれも、基準の出どころと、明るさの条件と、平常時の画像との差で確かめます。では、おかしな結果の例を2つ。例1、浸水の面積が、流域の面積の3倍になった。流域より広い浸水は、ありえませんよね。緯度経度に直すと、画素が引き伸ばされたり縮められたりして、数も変わります。そのうえ、1画素の大きさが度になります。原因は、面積を数えた座標です。UTMのまま数え直して、1画素の面積と座標の名前を表に書きます。例2、5月の画像で、流域の平野部が一面、浸水になった。でも、大雨はなかった。平野部は水田です。水の入った田は、指数では水ですから、これは浸水ではなくて、田植えの時期の田んぼです。原因は、浸水と平常時の水を分けていないこと。同じ季節の平常時の画像の水を引くか、水田の区画を別に数えます。では、この表で何が言えて、何が言えないのでしょうか。言えるのは、この帯域の組と、この基準で、この座標で数えた、基準を超えた範囲の面積です。帯域、基準、座標、除いた画素の割合を表に書いておけば、別の日と比べられます。言えないのは、浸水の深さと雪の深さです。指数は、水や雪が画素を覆っているかどうかの目安で、厚さは分かりません。雲の下も分かりません。それから、基準の出どころが書いていない面積は、再現できないので、報告には使えません。日本の水田の例では、水の入った区画の判定を同じ日の航空写真と照らして、面積で98パーセントが合っていました。確かめる相手があって初めて、精度が言えるんです。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 水の深さや、雪の量を知りたいとき。指数は覆っているかの目安で、厚さは出ない
      - 木の下の水や、建物の間の細い水路。光学の画像には写らない。レーダーか現地の情報と組み合わせる
      - 雲の多い日。雲の下は分からない。薄い巻雲は雪と区別できないことがある
      - 凍った湖と、雪の区別。氷も短波長赤外で暗いとされる。季節と場所の知識で判断する
      - 有償の商用データ。短波長赤外の帯域がない衛星もある。帯域の表を契約の仕様書で確かめる
    say: 向かない条件も、押さえておきましょう。まず、深さです。浸水が何センチか、雪が何センチ積もったか。指数で分かるでしょうか。分かりません。指数が見ているのは、画素が水や雪に覆われているかどうかだけです。深さは、地形の高さと水際の位置から、別に推定します。次に、木の下の水や、建物の間の細い水路。画素より細いものや、葉っぱの下にあるものは、光学の画像には写りません。レーダーの画像か、現地の情報と組み合わせます。それから、雲の多い日。雲の下は見えませんし、薄い巻雲は雪と区別できないことがあります。別の日の画像か、レーダーの画像を検討します。凍った湖も要注意です。氷も短波長赤外で暗いとされていて、指数だけでは雪と分けられません。冬の山の湖なら氷かもしれない、という季節と場所の知識で判断します。最後に、有償の商用データを使うとき。考え方は同じですが、短波長赤外の帯域がない衛星もあります。その場合、MNDWIもNDSIも計算できません。契約の仕様書で帯域の表を確かめて、無い帯域の指数は使えないと、先に決めておきます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 目的に合う指数と帯域、基準の値と出どころを決める。指数の名前、帯域の番号、基準の表（人）
      - 帯域を読み、値0を欠けとして除き、画素の大きさをそろえ、ずらしと倍率で反射率に直させる（AI）
      - 雲と影（SCLの3、8、9、10）を除き、指数と、基準を超えた画素の地図を作らせる（AI）
      - メートルの座標で画素を数え、面積に直させる。画素の数、1画素の面積、合計、座標の名前の表（AI）
      - 知っている水面と雪で確かめる。湖が水か、屋根が水でないか、湖が雪でないか、面積の桁（人）
    say: 手順をまとめます。1は、人が決めるところです。見たいものが、開いた水面なのか、市街地の浸水なのか、積雪なのか。それに合わせて指数を選び、帯域の番号と、基準の値と出どころを、表にしておきます。2から4は、AIにやらせるところです。まず、帯域を読みます。画素の値が0のところは欠けなので、ずらしを足す前に除いてもらいます。そのうえで、20メートルと10メートルの画素の大きさをそろえ、付属情報に書いてあるずらしと倍率、章の指示文では BOA_ADD_OFFSET と QUANTIFICATION_VALUE という名前です、で反射率に直してもらいます。値は付属情報から読ませます。使った座標の名前も、ここで記録させます。次に、雲と影を除きます。SCLの番号で言うと、3が雲の影、8と9が雲、10が薄い雲です。そのうえで、指数と、基準を超えた画素の地図を作らせます。そして、メートルの座標のまま画素を数えて、面積に直させる。表には、画素の数、1画素の面積、合計の面積、座標の名前を並べます。5は、また人の仕事です。知っている湖が水になっているか。市街地の屋根が水になっていないか。湖が雪になっていないか。面積の桁が、地図の大きさと合っているか。ここを飛ばして報告していませんか。この5つを、面積を出すたびに繰り返してください。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      n = read_band(p, "B8")                   # 近赤外
      s = resample_to(read_band(p, "B11"), n)  # 短波長赤外 20m → 10m
      ndwi = (n - s) / (n + s)
      water = ndwi > 0.4
      water = to_latlon(water)
      area_ha = count(water) * 100 / 10000

      AIの説明：「浸水の面積は1,840ヘクタールです。NDWIは近赤外と短波長赤外から
      　計算し、標準的な基準の0.4で水を抜き出しました。面積は緯度経度に直してから
      　画素を数え、10m画素なので100平方メートルをかけています」
      → 町の中央の湖（およそ120ヘクタール）が水として拾われず、
      　代わりに山の森の広い部分が「水」になった

      問い：この結果から最初に疑うべきことはどれか
      A. 基準の0.4が高すぎて、湖が水として拾われなかった
      B. 式が近赤外と短波長赤外の組で、植物の水分を見る別の指数になっている
      C. 緯度経度に直すときに画素がずれて、湖の位置が森に移った
      D. 短波長赤外を10mに再標本化したので、湖の縁がぼやけた
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、大雨の翌日に浸水した範囲の面積をヘクタールで出して、と頼みました。画面に出ているのが、AIが返した説明と擬似コードです。AIはこう言いました。浸水の面積は1840ヘクタール。NDWIは近赤外と短波長赤外から計算し、標準的な基準の0.4で水を抜き出した。面積は緯度経度に直してから画素を数え、10メートル画素なので100平方メートルをかけた。ところが、できた地図を見ると、町の中央にある、およそ120ヘクタールと知られている湖が、水として拾われていません。代わりに、山の森の広い部分が水になっていました。この結果から、最初に疑うべきことはどれでしょうか。A、基準の0.4が高すぎて、湖が水として拾われなかった。B、式が近赤外と短波長赤外の組で、植物の水分を見る別の指数になっている。C、緯度経度に直すときに画素がずれて、湖の位置が森に移った。D、短波長赤外を10メートルに再標本化したので、湖の縁がぼやけた。この動画で見た、帯域の組と判定の表を思い出して、考えてみてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。問2の短答もそこにあります。町の面積が9000ヘクタールなのに、平常時の水が1万4000ヘクタールと出た、という場面です。

