# English market-report video (overseas). Theme: forests & carbon, angle: world-market.
# Facts verified against the primary sources listed in the closing credits. Numbers not verified were left out.
lang: en
voice: Ryan
title: Forest carbon from space - how big is the market, and who pays?
series: MARKET
kicker: Market report
thumb: Forest carbon market
summary: A plain look at the market for watching forests from space - why there is no single published number, how to size it from public figures, who the main buyers are, and what pushes demand up or holds it back. Figures are from EUSPA, Ecosystem Marketplace, Global Forest Watch and ESA, with the year and source stated for each. About 6 minutes.
scenes:
  - kind: cover
    heading: Forest carbon from space - how big is the market, and who pays?
    sub: The global numbers, where they come from, and how to read them
    say: How large is the global market for watching forests from space - mapping deforestation and measuring the carbon that forests hold? The honest answer is that there is no single reliable number, because this work is mostly paid for indirectly - through carbon markets, government programmes and new trade rules - rather than sold as one neat product. In this report we look at how to size this market from public figures, who estimates the pieces, who the main buyers are, and what is pushing demand up or holding it back.

  - kind: bullets
    heading: What this report covers
    items:
      - How to size this market when there is no single published number
      - Who the buyers are, and what they are really paying for
      - What drives demand up - carbon markets, policy and new trade rules
      - What holds it back - credit-quality concerns and free public data
    say: Here is what this report covers. First, how to size this market when there is no single published number to lean on. Second, who the buyers are, and what they are really paying for. Third, what is driving demand up - carbon markets, climate policy and new trade rules. And fourth, what is holding it back - concerns about carbon-credit quality, and free public data.

  - kind: bullets
    heading: How big is it?
    items:
      - "No clean standalone figure - forest monitoring sits inside the wider Earth observation market"
      - "EUSPA - the whole EO market was 3.5 billion euros in 2024, forecast 7.9 billion by 2034"
      - "Demand signal - the voluntary carbon market was about $723 million in 2023 (Ecosystem Marketplace)"
      - "Scale of the problem - 6.7 million hectares of tropical primary forest lost in 2024 (Global Forest Watch)"
    say: So how big is it? There is no clean, standalone figure for satellite forest monitoring, and you should be wary of anyone who quotes one. Instead, size it from three public numbers. First, the market it sits inside - the European Union space agency, EUSPA, in its EU Space Market Report dated May twenty twenty-six, put the whole Earth observation market at three and a half billion euros in twenty twenty-four, rising to seven point nine billion euros by twenty thirty-four. Forest and carbon is one slice of that. Second, the demand signal - Ecosystem Marketplace reported the voluntary carbon market at about seven hundred twenty-three million dollars in twenty twenty-three. Third, the scale of the problem that drives the spending - Global Forest Watch reported six point seven million hectares of tropical primary forest lost in twenty twenty-four, nearly twice the loss of the year before.

  - kind: bullets
    heading: Why there is no single number
    items:
      - "Forest monitoring is bundled into carbon, agriculture and government programmes"
      - "Do you count the data, the verification service, or the carbon credit it supports?"
      - "Free public platforms sit next to paid commercial data in the same workflow"
      - "Always state what a quoted figure includes, and for what year"
    say: Why is there no single number? Because forest monitoring is rarely bought on its own. It is bundled into carbon projects, agricultural services and government programmes, so the boundary you draw changes the figure completely. Do you count the raw satellite data, the measurement-reporting-and-verification service built on top, or the value of the carbon credits that the monitoring underpins? Each is a different market. And free public platforms, such as Global Forest Watch, sit right next to paid commercial data in the same workflow, which makes the paid part hard to price. The rule for a consultant is the same as always - state what a quoted figure includes, and for what year.

  - kind: bullets
    heading: Who is buying
    items:
      - "National governments - monitoring for REDD+ and deforestation reporting"
      - "Carbon project developers and registries - measurement and verification of credits"
      - "Companies importing into the EU - proving goods are deforestation-free (EUDR)"
      - "Commodity traders, banks and insurers - checking supply-chain and project risk"
    say: So who is actually buying? Four groups. First, national governments, which run satellite-based forest monitoring to report deforestation and to support REDD+, the United Nations framework for paying to reduce forest loss. Second, carbon project developers and the registries that certify credits, which need regular measurement and verification. Third, companies that import into the European Union, which - under the EU Deforestation Regulation - must prove that commodities such as soy, beef, cocoa, coffee, palm oil, rubber and wood are not linked to recent deforestation. And fourth, commodity traders, banks and insurers, which use the same data to check the risk in a supply chain or a project. Today, government and compliance demand is the base; companies buying for their own targets are the growth bet.

  - kind: bullets
    heading: What drives it up, and what holds it back
    items:
      - "Up - corporate net-zero targets and Article 6 of the Paris Agreement"
      - "Up - new rules such as the EU Deforestation Regulation, obligations from 30 Dec 2026"
      - "Up - new public capability, like ESA's Biomass radar satellite for forest carbon"
      - "Down - carbon-credit quality concerns; REDD+ credits lost 62% of their value in 2023"
      - "Down - free public data competes with paid data"
    say: What is pushing demand up, and what is holding it back? On the up side - corporate net-zero targets and Article Six of the Paris Agreement are creating demand for credible, measured carbon. New rules add to it - the EU Deforestation Regulation, whose main obligations for large companies are now set to apply from the thirtieth of December twenty twenty-six, after more than one postponement, will require geolocated, verifiable proof. And public capability is improving - the European Space Agency launched Biomass, the first space radar designed to measure the carbon stored in forests, in April twenty twenty-five, and it entered full operations in January twenty twenty-six. On the down side - concerns about the quality of forest carbon credits cut the voluntary market sharply; Ecosystem Marketplace reported REDD+ credits losing sixty-two percent of their value in twenty twenty-three. And free public data competes with paid data. These are the forces to weigh when a client asks whether this market will keep growing.

  - kind: table
    heading: How to read the numbers
    columns: [What the number is, What it does not mean]
    widths: [0.5, 0.5]
    rows:
      - ["EO market 3.5bn euros (2024)", "The whole EO market, not forest monitoring alone"]
      - ["Voluntary carbon market $723M (2023)", "Value of credits traded, not of the monitoring behind them"]
      - ["6.7M hectares lost in 2024", "Tropical primary forest - a measure of need, not market size"]
      - ["Biomass satellite, operational 2026", "A new public data source, not a finished commercial product"]
    say: Let me put the main numbers in context, so you do not oversell them. The three and a half billion euros is the whole Earth observation market, not forest monitoring on its own. The seven hundred twenty-three million dollar voluntary carbon market is the value of credits traded, not the value of the satellite monitoring that sits behind them. The six point seven million hectares lost in twenty twenty-four is tropical primary forest - it measures the need for monitoring, not the size of the market. And Biomass is a new public data source that has just reached operations; it is not a finished commercial product you can simply buy. Read each number with its boundary, and you will not oversell it.

  - kind: bullets
    heading: What a consultant should take from this
    items:
      - "Don't quote a single forest-monitoring market size - size it from carbon demand and policy"
      - "Separate three things - the data, the verification service, and the carbon credit"
      - "Government and compliance demand is the base; corporate buying is the growth bet"
      - "Free public data lowers the data cost; verification still takes real work"
    say: So what should a consultant take from this? First, do not quote a single forest-monitoring market size - there isn't a reliable one. Size the opportunity from the demand drivers instead - carbon markets, government programmes and trade rules. Second, keep three things separate in any proposal - the satellite data, the measurement-and-verification service, and the carbon credit the monitoring supports. They are different markets with different buyers. Third, remember that today government and compliance demand is the base, while companies buying to meet their own targets are the growth bet, not the current floor. And fourth, free public data lowers the cost of the data itself, but turning it into a verified, audit-ready answer still takes real work - free data does not mean a free result.

