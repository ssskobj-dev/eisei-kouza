# ユースケース解説動画の台本。元の記事：casebook/airport-pavement-insar-haneda.qmd
title: 衛星データのInSARで滑走路の沈下を測る：羽田で測量との差約1cm
series: CASEBOOK
kicker: ユースケース解説
number: 88
total: 221
thumb: 滑走路の沈下を面で
summary: 国土交通省の東京空港整備事務所が、羽田空港の滑走路とエプロンの沈下を衛星SARの時系列干渉解析（InSAR）で測り、水準測量と比べた検討の事例。測量との差はRMSE約1cmで、勾配の管理に要る4mmには届かず、3年に1回の測量は残ります。業務のどこに入れ、何を決める材料になるか、限界と費用の考え方までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データのInSARで滑走路の沈下を測る
    sub: 羽田空港の夜間測量約50kmに対し、衛星は測量との差約1cm
    say: 空港の滑走路の沈下を、夜中の測量に頼らずに面で捉える方法はあるか。答えは、衛星のレーダーで地面の上下をミリ単位で測る、干渉解析という方法です。国土交通省の東京空港整備事務所が、羽田空港で測量と比べたところ、差はRMSEで約1センチでした。ただし、勾配の管理に要る4ミリには届かず、3年に1回の測量は残ります。この動画では、誰が、業務のどこに入れて、何を決める材料にするのか。無償の衛星でどこまでできて、費用はどう考えるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。羽田空港（東京国際空港）
      - 誰が：国土交通省 関東地方整備局 東京空港整備事務所
      - 何のために：滑走路と誘導路の路面の、勾配の管理（3年に1回）と地盤沈下の管理（1年に1回）
      - 困りごと：延長約50kmを約5か月、運航の終わった夜間の約5〜6時間だけで測る
    say: 事例の舞台は、日本の羽田空港です。検討したのは、国土交通省の関東地方整備局、東京空港整備事務所です。羽田空港では、滑走路や誘導路の路面を、水準測量で毎年測っています。目的は2つ。路面の勾配の管理が3年に1回、地盤沈下の管理が1年に1回です。測る延長は約50キロで、約5か月かかります。しかも、飛行機の運航が終わってから翌朝までの、約5時間から6時間の夜間だけ。制限区域の中で行います。資料は、時間の制約による作業員の負担と、航空会社や管制との調整を課題に挙げています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-airport-pavement-insar-haneda/flow.svg
    caption: 3年に1回の測量は残し、間の2年を衛星で埋める
    say: 業務の流れを見ます。資料が提案する、段階的な導入の形です。まず、勾配の管理のための水準測量は、3年に1回、これまでどおり行います。測量と同じ年に、衛星の解析も行い、差を確かめて、許容する誤差を決めます。間の2年は、衛星の時系列解析で、地盤沈下の傾向を面で追います。沈下が進む区画を抜き出して、経年の変化を記録します。そして、必要な区画だけを詳しく測量し、補修の時期と範囲を判断します。つまり、衛星は測量の代わりではなく、測量と測量の間を面で埋める道具です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-airport-pavement-insar-haneda/split.svg
    say: 役割の分担はこうなります。衛星と解析が行うのは、10メートルのメッシュで路面の上下の動きを面で捉えること、測量のない年の沈下の傾向を追うこと、沈下が進む区画を見つけることです。人が行うのは、3年に1回の勾配の管理の水準測量、衛星の値と測量の値の継続性を確かめること、そして見つけた区画の詳細測量と補修の判断です。羽田の検討では、アスファルト舗装のC滑走路と、コンクリート舗装のエプロンで、測量と衛星の値を比べました。空港全体では、測量と衛星の両方で、同じ4か所に沈下の傾向が見えました。測量点に最も近いメッシュの値との差は、RMSEで、C滑走路が0.944センチ、エプロンが1.037センチ。測量点の8割以上が、誤差1センチ以内に収まりました。なお、これは「一提案」と題された検討で、業務としての運用はまだ書かれていません。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [路面の上下の変動量の地図（10mメッシュ）, 沈下が進む区画、詳細測量の範囲]
      - [メッシュごとの時系列の変動, 沈下の速さ、補修の時期の見込み]
      - [測量点と衛星の値の比較表, 許容する誤差、測量を減らしてよい年]
      - [詳細測量の結果, 補修の範囲と工法、翌年の観測計画]
    say: 受け取るデータと、それで決められることを整理します。10メートルのメッシュの変動量の地図は、沈下が進む区画と、詳細に測量する範囲を決める根拠になります。メッシュごとの時系列の変動からは、沈下の速さと、補修の時期の見込みが読めます。測量点と衛星の値の比較表は、許容する誤差と、測量を減らしてよい年を決める材料です。そして詳細測量の結果が、補修の範囲と工法、翌年の観測計画を決めます。衛星の地図は「どこを詳しく測るか」を決めるもので、勾配の管理の判定そのものは、水準測量の結果で決まります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-airport-pavement-insar-haneda/limits.svg
    say: 限界も、資料にはっきり書かれています。1つ目、勾配の管理に要る4ミリには届きません。測量との差は約1センチで、4級水準測量の精度に相当する、RMSE4ミリ以内という条件は満たしませんでした。2つ目、地上の点を正確に特定できません。衛星の値は10メートルのメッシュの値で、測量の鋲の位置そのものの値ではありません。3つ目、衛星の種類を選びます。波長の長いLバンドは、平滑な舗装面に対する感度が低く、無償のCバンドは分解能が足りないとされました。4つ目、Xバンドの画像は有償で、調達費が毎年かかります。5つ目、既存の測量との継続性です。許容する誤差は、既存の測量と比べて決める必要があります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 無償のCバンドは、この検討では「分解能が細部の把握に足りない」とされた
      - 波長の長いLバンドは、平滑な舗装面に対する感度が低く、画像の数も少ない
      - 選ばれたのは、スペインのXバンド衛星PAZ（波長約3.1cm）。画像は有償
      - 無償データだけで、空港の舗装の沈下の管理が成り立つ構成ではない
    say: では、無償の衛星でどこまでできるでしょうか。この検討では、衛星を、電波の波長、分解能、保存されている画像の数、費用の4つで比べています。無償のCバンドは、分解能が細部の把握に足りないとされました。波長の長いLバンドは、平滑な舗装面に対する感度が低く、画像の数も少ないため、選ばれませんでした。選ばれたのは、スペインのXバンド衛星PAZで、波長は約3.1センチです。画像は有償です。つまり、空港の舗装の沈下の管理は、無償データだけで成り立つ構成ではありません。提案するときは、最初から有償の画像の費用を入れる必要があります。

  - kind: table
    heading: 費用の考え方（金額は非公開）
    columns: [項目, 考え方]
    widths: [0.3, 0.7]
    rows:
      - [画像の調達, Xバンドの画像は有償。時系列解析は多数の画像を使うので、対象の広さと観測の回数で費用が決まる。金額は資料に無い]
      - [解析, 時系列の干渉解析、上下の動きへの変換、地図化。自前か委託かで分かれる]
      - [残る測量, 3年に1回の水準測量は残る。削減できるのは、間の2年の地盤沈下の管理の分]
      - [期待される縮減, 人員、機材、夜間の作業の費用。資料は金額を示していない]
    say: 費用の考え方です。この検討の費用と、画像の価格は公開されていないので、この動画では金額の概算を出しません。費用がかかるのは3つです。1つ目、画像の調達。Xバンドの画像は有償で、時系列解析は多数の画像を使うため、対象の広さと観測の回数で費用が決まります。2つ目、解析。時系列の干渉解析と、上下の動きへの変換、地図化で、自前か委託かで分かれます。3つ目、残る測量。3年に1回の水準測量は残り、削減できるのは、間の2年の地盤沈下の管理の分です。資料は、人員、機材、夜間の作業の費用の縮減が期待できるとしていますが、金額は示していません。実際の金額は、対象の広さと回数を決めたうえで、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [対象, 平坦な舗装が広い空港, 建物や植生が多く、舗装の面積が小さい施設]
      - [求める精度, 1cm程度で足りる地盤沈下の管理, 4mm以内が要る勾配の管理]
      - [測量の記録, 過去の記録があり、衛星の値と比べられる, 比べる記録がない]
      - [費用, 有償の画像を毎年調達できる, 無償データだけで成り立たせたい]
      - [体制, 測量を残し、間を衛星で埋める, 測量をすぐに全部置き換えたい]
    say: 最後に、向き不向きです。向いているのは、平坦な舗装が広い空港で、1センチ程度で足りる地盤沈下の管理です。過去の測量の記録があって衛星の値と比べられること、有償の画像を毎年調達できることも条件です。逆に、建物や植生が多い施設、4ミリ以内が要る勾配の管理、比べる記録がない、無償データだけで成り立たせたい、測量をすぐに全部置き換えたい、という場合は向きません。提案するときの要点は3つです。最初に、求める精度と過去の測量の記録を聞くこと。測量がいらなくなるとは言わないこと。無償の衛星で見積もらないことです。

  - kind: cta
    heading: 自分の施設で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：山田悠斗・有路隆一（関東地方整備局 東京空港整備事務所）「衛星SARを活用した羽田空港路面測量のDX化と実装可能性に関する一提案」"
      - "　https://www.ktr.mlit.go.jp/ktr_content/content/000948272.pdf"
      - "衛星の仕様：ESA Earth Online「PAZ」 https://earth.esa.int/eogateway/missions/paz"
      - "費用：この検討の費用と画像の価格は公開されていないため、金額の概算は示していません"
    say: この事例をもとに、自分の施設や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
