# ユースケース解説動画の台本。元の記事：casebook/flood-extent-emergency.qmd
title: SAR衛星で夜の浸水を夜のうちにつかむ：国交省の緊急観測、要請から約8時間40分
series: CASEBOOK
kicker: ユースケース解説
number: 6
total: 221
thumb: 夜の浸水を夜に
summary: 国土交通省が2023年の台風で、だいち2号の緊急観測から約8時間40分で浸水の推定範囲を受け取り、翌朝の排水ポンプ車の配置とヘリ調査の絞り込みに使った事例。業務のどこに入れ、何を決める材料になるか、判読できる大きさと時間の制約、無償衛星との違いまでを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 夜の浸水を、夜のうちにつかむ
    sub: SAR衛星の緊急観測で、翌朝の排水と調査の計画を立てる
    say: 夜に起きた浸水の広がりを、夜が明ける前につかむ方法はあるか。答えは、合成開口レーダ、SARを積んだ衛星の緊急観測です。国土交通省は2023年の台風で、要請から約8時間40分で浸水の推定範囲を受け取り、翌朝の排水ポンプ車の配置とヘリ調査の絞り込みに使いました。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。判読できる大きさと時間の制約、無償の衛星でどこまでできるかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。2023年6月の台風2号、愛知県周辺
      - 誰が：国土交通省（観測を要請）と、JAXA（観測と浸水範囲の抽出）
      - 何のために：夜間や雨の中で浸水の広がりをつかみ、翌朝の排水と調査を決める
      - 困りごと：ヘリや目視では、夜が明けて雨が上がるまで浸水の広がりが分からない
    say: 事例の舞台は、2023年6月の台風2号と前線による大雨で、愛知県周辺です。観測を要請するのは国土交通省、観測して浸水の範囲を抜き出すのは宇宙航空研究開発機構、JAXAです。大きな水害は、夜間や雨の中で起こります。ヘリコプターや目視では、夜が明けて雨が上がるまで、浸水の広がりが分かりません。その間に、排水ポンプ車をどこに送るか、朝一番のヘリをどの順に飛ばすかを決める必要があります。SAR衛星は、電波を自分で出して地表を測るので、夜でも雲の下でも観測できます。水面は電波をはね返さず暗く写るので、暗い場所を浸水の可能性がある範囲として抜き出せます。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-flood-extent-emergency/timeline.svg
    caption: 要請から提供まで約8時間40分。翌朝の配置と調査の前に結果が届く
    say: 業務の流れを、この事例の時刻で見ます。6月2日の18時、国土交通省がJAXAに緊急観測を要請しました。23時44分、だいち2号が観測しました。翌3日の2時40分、JAXAが自動抽出ツールによる浸水の推定を国土交通省に提供しました。要請から提供まで、約8時間40分です。入る位置は、翌朝の排水と調査の計画を立てる前です。推定された浸水範囲は、翌朝からのヘリ調査と地上調査の絞り込み、被害状況の速報に載せる推定浸水面積、そして面積から概略の排水量を出して排水ポンプ車の配置を検討する材料に使われました。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-flood-extent-emergency/split.svg
    say: 役割の分担はこうなります。衛星の緊急観測が行うのは、夜間や雨の中で広い範囲を一度に見ることと、浸水の可能性がある範囲を抜き出すことです。河川管理者が行うのは、撮像の約3.5時間前までに要請すること、推定面積から排水量を概算すること、翌朝のヘリと地上調査の行き先を決めることです。中部地方整備局の報告では、最も浸水が多かった豊川水系で判読を行い、後日の現地の痕跡調査4か所は、いずれも衛星で把握した浸水範囲の内側に収まっていました。2020年7月の九州の豪雨では、国土交通省と農林水産省の要請でだいち2号が10回の緊急観測を行い、ヘリの調査箇所と飛行ルートの選定に使われました。2016年の北海道、2018年の西日本、2022年の東北の大雨でも使われています。実証ではなく、国の河川管理の中で繰り返し使われている仕組みです。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 形式, 決められること]
    widths: [0.36, 0.28, 0.36]
    rows:
      - [浸水の可能性がある範囲, 速報図と判読図（GISのデータ）, 翌朝のヘリと地上調査の行き先]
      - [推定浸水面積, 数値, 概略の排水量。ポンプ車の台数と配置]
      - [浸水範囲に重なる建物の数, 数値（推定浸水家屋数）, 避難と支援の規模の見込み]
      - [災害前後の比較画像, 画像, 変化があった場所の確認。速報の説明]
    say: 受け取るデータと、それで決められることを整理します。浸水の可能性がある範囲は、速報図と判読図の形で、GISで開けるデータと図として届きます。翌朝のヘリと地上調査の行き先と順番の根拠になります。推定浸水面積からは、概略の排水量を出し、排水ポンプ車の台数と配置を決めます。浸水範囲に重なる建物の数は、避難と支援の規模の見込みになります。災害前後の比較画像は、変化があった場所の確認と、速報の説明に使えます。速報図は撮像の約2時間後に早く届き、精度は約3時間後の判読図が上です。朝までに決めることは速報図で、調査の詳しい計画は判読図で、と分けて使う形になります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-flood-extent-emergency/limits.svg
    say: 限界も、ガイドブックと報告にはっきり書かれています。1つ目、衛星が通る時刻まで待ちます。観測できるのは衛星がその場所の上を通るときだけで、要請は撮像の約3.5時間前までが目安です。2016年の北海道では、要請した当日の夜に観測の機会がなく、翌日の昼の観測になりました。2つ目、小さな浸水は判読できません。目安は概ね50メートル四方以上です。3つ目、市街地は判読が難しい。建物がすべて浸水しないと浸水域として抽出されません。4つ目、水田と風が誤りを生みます。田植えの時期の水田は水面に近く、拾いすぎたり、水害かどうか判断できなかったりします。5つ目、水が引いた後は分かりません。衛星が見るのは観測した瞬間の水面で、最大の浸水範囲や深さは別の方法で推定する必要があります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-1も、夜間や雲の下で観測できるSAR衛星。データは無償
      - 浸水域の抽出はできる。ただし観測は12日（1機あたり）の周期で決まる
      - 災害の夜に合わせて撮る仕組みではない。初動には、撮像時刻を決められる緊急観測の枠組みが要る
      - 事後の検証のような日単位の用途なら、無償データが選択肢になる
    say: では、無償の衛星でどこまでできるでしょうか。欧州のSentinel-1も、夜間や雲の下で観測できるSAR衛星で、データは無償です。浸水域の抽出はできます。ただし、観測は1機あたり12日の周期で決まり、災害の夜に合わせて撮る仕組みではありません。初動には、要請に応じて撮像時刻を決められる緊急観測の枠組みが要ります。一方で、事後の検証のような日単位の用途なら、無償データが選択肢になります。なお、この事例の資料はだいち2号だけを扱っています。無償データで同じ結果が出るとは言えません。

  - kind: table
    heading: 費用がかかる所（金額は非公開）
    columns: [項目, 中身]
    widths: [0.26, 0.74]
    rows:
      - [観測と解析, 国の枠組みは防災関係機関の要請に基づくJAXAの緊急観測で、金額は非公開。民間のSAR衛星に緊急撮影を頼む場合は、撮影と解析の費用がかかる]
      - [平時の準備, 災害前の画像の確認、要請の手順書、GISで受け取る体制。組織の内部の費用]
      - [翌朝以降の確認, ヘリ、ドローン、地上調査はなくならない。衛星は、その行き先を絞る道具]
    say: 費用の話です。この事例は、防災関係機関の要請に基づいてJAXAの緊急観測を使う形で、費用の金額は公開されていません。ガイドブックにも費用の記載はありません。そのため、この動画では金額を出しません。費用がかかる所は3つです。1つ目、観測と解析。国の枠組みの外で民間のSAR衛星に緊急の撮影を頼む場合は、撮影と解析の費用がかかり、金額は事業者と条件で変わります。2つ目、平時の準備。災害前の画像の確認、要請の手順書、GISで受け取る体制で、組織の内部の費用です。3つ目、翌朝以降の確認。ヘリ、ドローン、地上調査はなくなりません。衛星は、その行き先を絞る道具です。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [浸水の広さ, 50m四方以上の浸水が広がる平野, 道路や宅地の一部だけの浸水]
      - [土地の使い方, 農地、空き地、低い建物の地域, 建物が密集する市街地]
      - [時期, 田植え以外の時期, 水田に水が張られた時期]
      - [知りたいこと, 観測時点の浸水の広がり, 浸水の深さ、最大の浸水範囲]
      - [体制, 要請の基準と経路が決まっている, 被災してから初めて要請を考える]
    say: 最後に、向き不向きです。向いているのは、50メートル四方以上の浸水が広がる平野で、農地や空き地、低い建物の地域、田植え以外の時期、知りたいことが観測時点の浸水の広がりで、要請の基準と経路が決まっている組織です。逆に、道路や宅地の一部だけの浸水、建物が密集する市街地、水田に水が張られた時期、浸水の深さや最大の範囲を知りたい場合、被災してから初めて要請を考える体制には向きません。提案するときの要点は3つです。最初に、要請の経路と締め切りを確かめること。浸水を全部見られるとは言わないこと。翌朝のヘリと地上調査を前提に設計し、衛星の結果をそのまま被害の確定値として使わないことです。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：国土交通省「河川分野におけるDXの事例 衛星を活用した浸水状況の把握」 https://www.mlit.go.jp/river/gijutsu/dx/example/satellite.html"
      - "出典：JAXA・国土交通省「災害時の人工衛星活用ガイドブック 水害版・浸水編」（2023年9月更新） https://www.mlit.go.jp/river/shishin_guideline/bousai/jinkoueisei/"
      - "出典：林大世（国土交通省 中部地方整備局）「衛星画像を活用した浸水域判読」（2023年度） https://www.cbr.mlit.go.jp/kikaku/2023kannai/pdf/re02_07.pdf"
      - "出典：文部科学省「最近の衛星観測の実利用例」（内閣府 タスクフォース資料2-2、2020年12月） https://www8.cao.go.jp/space/taskforce/rs/dai1/siryou2_2.pdf"
      - "衛星の仕様：Sentinel-1 の観測周期（12日、1機あたり）は、サイトの _variables.yml の値"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、要請の経路と判断の基準の整理から、条件の比較までを行います。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
