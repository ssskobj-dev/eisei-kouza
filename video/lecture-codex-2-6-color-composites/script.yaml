# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第6章「衛星データの色の合成：Sentinel-2の3つの波長帯を赤・緑・青に割り当て、自然な色、近赤外、短波赤外の3種類を作って確かめる」（learn/codex/codex-2-6-color-composites.qmd）
title: 衛星データの色の合成：Sentinel-2の近赤外でAIが誤る4点を見抜く
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 10
total: 30
thumb: 近赤外はB8
summary: 衛星画像（Sentinel-2）の3つの波長帯を赤・緑・青に割り当てて1枚の色の画像にする「色の合成」の章。自然な色、植物が赤く写る近赤外、雪と雲を分ける短波赤外の3種類と、波長帯の番号（近赤外はB8で10m、B5は赤の端で20m）、画素の大きさのそろえ方、明るさの飛びとつぶれを、しくみから見ます。「Landsatと同じで近赤外はB5」という取り違え、画素数を0で埋める誤り、重ねる順番の逆、固定の上限を黙って当てる誤りの4つを、AIが返したコードを一緒にレビューして見つけます。できた画像と表を手元で確かめる練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 色の合成：3つの波長帯を赤・緑・青に重ねる
    sub: 近赤外はB8。番号、画素の大きさ、明るさの直し方を確かめる
    say: 衛星の画像で、市の全域の植物、水、裸地、雲がどこにあるか、ひと目で分かる地図は作れるでしょうか。答えは、3つの波長帯を赤、緑、青に割り当てて1枚の色の画像にし、割り当てと画素の大きさと明るさの直し方を記録して、目で確かめれば作れる、です。色の合成は解析の最初の一歩で、数字を出す手法ではありません。しかし、ここで波長帯を取り違えると、あとの植生指数や分類が全部ずれます。この動画では、3種類の合成のしくみを見たあと、AIが返したコードを一緒にレビューして、4つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 自然な色、近赤外、短波赤外の3種類の合成を作り、波長帯の割り当てと画素の大きさの違いを確かめられる
      - 近赤外の合成で植物が赤く、水が黒く写る理由と、短波赤外の合成で雪と雲を分けられる理由が分かる
      - 「Landsatと同じで近赤外はB5」という取り違え、10mと20mの画素の混在、明るさの飛びとつぶれを、コードと画像から見つけられる
    say: この章を終えると、3つのことができるようになります。1つ目、自然な色、近赤外、短波赤外の3種類の合成を作り、波長帯の割り当てと画素の大きさの違いを確かめられること。2つ目、近赤外の合成で植物が赤く、水が黒く写る理由と、短波赤外の合成で雪と雲を分けられる理由が分かること。3つ目、AIが、Landsatと同じで近赤外はB5です、と自信をもって言う波長帯の取り違え、10mと20mの画素の混在、明るさの飛びとつぶれを、コードと画像から見つけられることです。

  - kind: figure
    heading: しくみ：3種類の合成
    image: figures/codex-2-6-color-composites/composites.svg
    say: まず、しくみです。衛星の光学センサーは、波長の帯ごとに別の画像を記録します。人の目に見えるのは、青、緑、赤の帯だけで、近赤外や短波赤外の帯は目に見えません。色の画像を作るには、3つの帯を選び、それぞれを赤、緑、青の明るさとして重ねます。どの帯をどの色に割り当てるかで、同じ場所がまったく違う色で見えます。図の3枚のカードです。1枚目、自然な色。赤の帯を赤に、緑の帯を緑に、青の帯を青に割り当てます。人の目で見た色に近く、雲は白、水は暗い青、植物は緑に写ります。2枚目、近赤外の合成。近赤外の帯を赤に、赤の帯を緑に、緑の帯を青に割り当てます。健康な植物は、目に見える光の大半を吸収し、近赤外を強く反射します。だから、植物に覆われた土地は濃い赤に写ります。澄んだ水は黒、土砂で濁った水は青、都市や裸地は灰色か黄褐色です。3枚目、短波赤外の合成。短波赤外の帯を赤に、近赤外の帯を緑に、緑の帯を青に割り当てます。焼けた直後の土地は赤く、氷の雲と、雪と氷は、明るい青に写ります。目に見える光では、雲も雪も氷も白く写りますが、短波赤外を使うと区別がつきます。山の上の白い部分が雪なのか雲なのかは、この合成で見分けます。

  - kind: table
    heading: 波長帯の番号と画素の大きさ
    columns: [帯, Sentinel-2, 画素, Landsat 8と9]
    widths: [0.20, 0.34, 0.12, 0.34]
    rows:
      - [青, B2（およそ493nm）, 10m, Band 2（30m）]
      - [緑, B3（およそ560nm）, 10m, Band 3（30m）]
      - [赤, B4（およそ665nm）, 10m, Band 4（30m）]
      - [近赤外, B8（およそ833nm）。B5は赤の端（およそ704nm・20m）, 10m, Band 5（30m）。Landsat 7はBand 4]
      - [短波赤外, B11（およそ1614nm）、B12（およそ2202nm）, 20m, Band 6と7（30m）]
    say: ここで欠かせないのが、波長帯の番号と画素の大きさの確認です。表は、公式の表から写した値です。Sentinel-2では、青がB2、緑がB3、赤がB4、近赤外がB8で、この4つは10mの画素です。狭い近赤外のB8A、短波赤外のB11とB12は、20mの画素です。注意したいのがB5です。B5は、およそ704nmの、赤の端の帯で、画素は20mです。近赤外ではありません。これらはSentinel-2Aの値で、2Bと2Cは数nmの違いがあります。右の列が、無料のLandsat 8と9です。番号が違います。青がBand 2、緑がBand 3、赤がBand 4、近赤外がBand 5、短波赤外がBand 6と7で、すべて30mです。さらに古いLandsat 7では、近赤外はBand 4でした。近赤外は5番、という覚え方は、衛星が変わると通用しません。番号は、使う衛星の公式の表で、毎回確かめます。

  - kind: bullets
    heading: 画素の大きさと明るさの直し方
    items:
      - 10mと20mの帯は、同じ製品でも縦横の画素の数が違う。画素数を切り詰めたり0で埋めたりすると、場所がずれる
      - Level-2Aには10m用、20m用、60m用のフォルダ。20m用にはB2、B3、B4を20mに直したものが入り、B8の代わりにB8Aが入る
      - 10mで作るなら、20mの帯を再標本化（1画素を縦横2つずつに分ける）
      - 画素の値は反射率に倍率（既定で10000）をかけた整数。処理の版04.00以降は、ずらしを足してから倍率で割る
      - 上限を低く固定すると明るい場所が真っ白（飛び）、画像の最大値に合わせると大半が暗い（つぶれ）
    say: 次に、画素の大きさと、明るさです。Sentinel-2で10mと20mの帯を混ぜるときは、画素の大きさをそろえる必要があります。同じ製品でも、10mの帯と20mの帯では、縦横の画素の数が違います。画素数を切り詰めたり、端に0を足したりして同じ大きさにすると、場所がずれます。Level-2Aの製品には、10m用、20m用、60m用のフォルダがあります。20m用には、B2、B3、B4をあらかじめ20mに直したものが入っていて、B8はなく、代わりにB8Aが入っています。短波赤外の合成なら、20m用のフォルダの帯だけでそろえるのが簡単です。10mで作りたいなら、20mの帯を10mに再標本化、1画素を縦横2つずつに分けます。明るさの直し方も、合成の見え方を決めます。画素の値は、反射率に倍率をかけた整数で、Sentinel-2の倍率は既定で10000です。処理の版04.00以降は、画素の値にずらしを足してから、倍率で割ります。画面の明るさに直すとき、上限を低く固定すると、明るい場所が全部真っ白になります。これが飛びです。画像全体の最大値に合わせると、大半の場所が暗くつぶれます。これがつぶれです。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [カラー画像を作って, 自然な色（赤B4、緑B3、青B2）を10m用のフォルダの帯で作り、割り当てを画像の題に書いて]
      - [近赤外の画像を, 赤にB8、緑にB4、青にB3を割り当てた近赤外の合成を作って。B5ではない]
      - [見やすく明るくして, 3つの帯で共通の下限0と上限0.3で直して。上限を超えた画素の割合も表示して]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。カラー画像を作って、だけでは、AIは割り当てを自分で決めて、題に書きません。できた画像の植物が緑なのか赤なのかで、割り当てを推測することになります。だから、自然な色、赤B4、緑B3、青B2を、10m用のフォルダの帯で作り、割り当てを画像の題に書いて、と頼みます。近赤外の画像を、だけでは、AIは別の衛星の番号を使うことがあります。赤にB8、緑にB4、青にB3を割り当てた近赤外の合成を作って。B5ではない、と帯の番号と色の対応を書きます。見やすく明るくして、ではなく、3つの帯で共通の下限0と上限0.3で直して。上限を超えた画素の割合も表示して、と頼みます。指示の7項目のうち、確かめ方には、読んだ帯の名前と画素数を表示すること、割り当てた帯の名前を画像の題に書くこと、森の位置の3つの値と、湖の位置の3つの値を表示することを入れます。なお、上限の0.3は、この章で例として置いた目安です。固定の数字を黙って当てるのではなく、白くなった画素の割合を見て決めます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 近赤外の合成を作る（誤りあり）
      red = read_band(p, "B4")                       # 赤
      nir = read_band(p, "B5")                       # 近赤外（Landsatと同じ番号）
      grn = read_band(p, "B3")                       # 緑
      nir = pad_to(nir, red.shape, fill=0)           # 画素数を赤に合わせる
      rgb = stack([grn, red, nir])                   # 緑, 赤, 近赤外の順
      rgb = clip(rgb / 3000, 0, 1)                   # 3000で割って0〜1に
      show(rgb, title="近赤外の合成")
    highlight: [3, 5, 6, 7]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。Sentinel-2の帯の番号はLandsatと同じで、赤がB4、近赤外がB5です。同じ製品なので画素数は同じです。念のため、足りない分は0で埋めて大きさを合わせました。値は3000で割ると0から1に収まります。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、波長帯。帯の番号が、使っている衛星の表と合っているか。赤、緑、青に割り当てた順番が、表示の関数が期待する順番か。2、位置と座標。画素の大きさを、再標本化でそろえているか。3、値の倍率。ずらしと倍率を付属情報から読んでいるか。4、欠けた値と明るさ。値0を除き、下限と上限を記録しているか。まず、3行目を見てください。B5。さっきの表では、B5は赤の端の帯で、20mでした。次に、5行目。pad_to、fill、イコール、0。足りない分を0で埋めています。6行目。stack、括弧、grn、red、nir。緑、赤、近赤外の順です。7行目。3000で割って、clip。ずらしがなく、上限が固定です。このコードは、動かしても止まりません。画像は出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.08, 0.14, 0.30, 0.48]
    rows:
      - ["3", 波長帯, "B5。「Landsatと同じ番号」", "B5は赤の端（およそ704nm、20m）。近赤外はB8（10m）。B8を読む"]
      - ["5", 位置と座標, "pad_to(…, fill=0)。「足りない分は0で埋めた」", "左上の4分の1だけに値が入り、場所がずれる。再標本化か、20m用のフォルダでそろえる。B8なら不要"]
      - ["6", 波長帯, "stack([grn, red, nir])", "近赤外が青になり、植物が青く写る。赤、緑、青の順（nir、red、grn）に重ねる"]
      - ["7", 値の倍率、欠けた値, "rgb / 3000 と clip。「0〜1に収まる」", "ずらしを足していない。固定の上限で雲も屋根も真っ白（飛び）。反射率に直し、下限と上限と白の割合を記録"]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、3行目。Sentinel-2のB5は、およそ704nmの赤の端の帯で、画素は20mです。近赤外は10mのB8です。AIの、Landsatと同じ番号、は、Landsat 8と9の近赤外がBand 5であることを、別の衛星に当てはめています。正しくは、read_band、B8、です。2つ目、5行目。20mの帯は10mの帯より画素数が少ないので、足りない分を0で埋めると、画像の左上の4分の1にだけ値が入り、場所がずれます。画素数を合わせる、と、画素の大きさをそろえる、は別のことです。正しくは、20mの帯を10mに再標本化するか、20m用のフォルダの帯でそろえます。1つ目を直してB8を使えば、10mどうしなので、この行は要りません。3つ目、6行目。表示の関数は赤、緑、青の順で受け取るのに、緑、赤、近赤外の順で重ねています。近赤外が青に割り当てられ、植物が赤ではなく青く写ります。正しくは、stack、nir、red、grn、の順です。4つ目、7行目。ずらしを足していないうえ、3000という上限を固定で当てています。反射率0.3に当たる値を超える雲や明るい屋根は、全部真っ白になり、どこが雲でどこが屋根か分からなくなります。正しくは、ずらしと倍率で反射率に直してから、下限と上限を決めて記録し、上限を超えた画素の割合を出します。この4つのうち、2つ目は画像を見れば気づきます。1つ目と3つ目は、色がおかしいことで気づけますが、そういう合成なのだろう、と見過ごすと隠れます。4つ目は、見た目がきれいなので、最も隠れやすい誤りです。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：画像と表を確かめる
    items:
      - 植物が、合成の種類どおりの色か。近赤外の合成なら森や田畑は濃い赤。緑や青なら、帯の番号か割り当ての順番が違う
      - 水が黒いか。澄んだ水は黒、濁った水は青。水が赤や白なら割り当てを疑う
      - 都市と裸地が、灰色か黄褐色か。市街地が赤ければ割り当てが違う
      - 画像の一部だけに色が付いていないか。左上の4分の1だけなら、画素数を埋めている
      - 真っ白の画素の割合が、雲の量と合っているか。雲がないのに白が多ければ飛び。全体が暗く森と湖の区別がつかなければつぶれ
      - 帯ごとの中央値が、帯の性質と合っているか。近赤外の中央値が赤より低ければ、取り違えを疑う
    say: 判定を、手元でやってみます。AIに頼んだ人なら、できた画像と、帯ごとの値の表を見ながら、数分でできます。まず、植物が、合成の種類どおりの色かを見ます。近赤外の合成なら、森や田畑は濃い赤です。緑や青なら、帯の番号か、割り当ての順番が違います。2つ目、水が黒いか。澄んだ水は、近赤外と短波赤外を吸収して黒く写ります。濁った水は青です。水が赤や白なら、割り当てを疑います。3つ目、都市と裸地が、灰色か黄褐色か。近赤外の合成で市街地が赤く写れば、帯の割り当てが違います。4つ目、画像の一部だけに色が付いていないか。左上の4分の1だけ色があり、残りが黒なら、画素数を埋めて合わせています。5つ目、真っ白の画素の割合が、雲の量と合っているか。雲がほとんどないのに白い画素が多ければ、上限が低すぎる飛びです。全体が暗く、森と湖の区別がつかなければ、上限が高すぎるつぶれです。6つ目、帯ごとの中央値が、帯の性質と合っているか。近赤外の中央値が赤より低い画像は、植生のある地域ではまれです。帯の取り違えを疑います。この6つを、報告の前にやります。

  - kind: figure
    heading: 結果の目視観点と、2つの例
    image: figures/codex-2-6-color-composites/stretch.svg
    say: 図は、明るさの飛びとつぶれです。左が飛び。上限が低すぎて、雲も明るい屋根も裸地も全部真っ白になり、区別がつきません。白い画素の割合が雲より多いのが手がかりです。右がつぶれ。上限が高すぎて、森も湖も市街地も暗く、区別がつきません。画像の最大値に合わせて、雲の値に引きずられたときに起きます。どちらも、下限と上限を記録し、上限を超えた画素の割合を見て決めます。おかしな結果の例を2つ。例1、近赤外の合成なのに、森が青く、市街地が黄色っぽく写った。近赤外が青に割り当てられています。帯を正しく読んでも、重ねる順番が赤、緑、青の順になっていなければ、こうなります。画像の題に書いた割り当てと、コードの重ねる順番を突き合わせます。例2、山の上の白い部分が、自然な色でも近赤外の合成でも、雪なのか雲なのか分からない。これは誤りではなく、合成の種類の限界です。目に見える光では、雲も雪も氷も白く写ります。短波赤外の合成では、氷の雲と、雪と氷は明るい青に写り、青と2つの短波赤外の組み合わせは、雪、氷、雲の区別にとくに向きます。合成の種類を変えて見直します。言えるのは、3つの帯を記録どおりに割り当て、画素の大きさをそろえ、決めた下限と上限で明るさを直した画像で、植物、水、裸地、雲の見え方が、帯の性質と矛盾しない、ことです。言えないのは、赤い場所の面積や、植生の量です。色の合成は目で見るための画像で、画素ごとの数字を出す手法ではありません。面積や量は、植生指数や分類で、別に出します。また、雪と雲を分けられた、と言えるのは、短波赤外の合成で見たときだけです。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 面積や量を数字で報告したいとき。色の合成は見るための画像。数字は植生指数や分類で
      - 雲の下や、雲の影の中を見たいとき。光学の画像は雲の下を写さない。別の日の画像かレーダーを検討
      - 別の日の画像と、色で比べたいとき。同じ処理の段階、同じ割り当て、同じ下限と上限でそろえる
      - 有償の商用データを使うとき。帯の番号、画素の大きさ、倍率は衛星ごとに違う。契約の仕様書で確かめる
    say: 向かない条件も、押さえておきます。1つ目、面積や量を数字で報告したいとき。色の合成は見るための画像です。数字が要るなら、植生指数や分類に進みます。2つ目、雲の下や、雲の影の中を見たいとき。光学の画像は雲の下を写しません。影の中は暗くつぶれます。別の日の画像か、レーダーの画像を検討します。3つ目、別の日の画像と、色で比べたいとき。下限と上限が違えば、同じ場所でも色が変わります。比べるなら、同じ処理の段階、同じ割り当て、同じ下限と上限でそろえます。4つ目、有償の商用データを使うとき。考え方は同じですが、帯の番号、画素の大きさ、倍率は、衛星ごとに違います。公式の表の代わりに、契約の仕様書で確かめます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 目的に合う合成の種類と、波長帯の番号を決める。見たいものから、赤・緑・青に割り当てる番号と画素の大きさの表（人）
      - 製品から3つの帯を読み、画素の大きさをそろえさせる。同じ画素数の3枚と、元の画素の大きさと再標本化の方法の記録（AI）
      - ずらしと倍率で反射率に直し、欠けた値を除かせる。反射率の3枚と、帯ごとの最小・中央値・最大の表（AI）
      - 明るさの直し方を決めて、1枚の色の画像にさせる。使った下限と上限、上限を超えて白くなった画素の割合（AI）
      - 割り当てと見え方を、知っている場所で確かめる。植物が期待した色か、水が黒いか、飛びとつぶれが許せる範囲か（人）
    say: 手順をまとめます。1、目的に合う合成の種類と、波長帯の番号を決める。入れるのは、見たいもの、植生、水、雪と雲、焼け跡。出るのは、合成の種類と、赤、緑、青に割り当てる波長帯の番号と画素の大きさの表です。人です。2、製品から3つの帯を読み、画素の大きさをそろえさせる。出るのは、同じ画素数にそろえた3枚の画像と、それぞれの元の画素の大きさと、再標本化の方法の記録です。AIです。3、ずらしと倍率で反射率に直し、欠けた値を除かせる。入れるのは、製品の付属情報のずらしと倍率。出るのは、反射率の3枚と、帯ごとの最小、中央値、最大の表です。AIです。4、明るさの直し方を決めて、1枚の色の画像にさせる。出るのは、色の画像と、使った下限と上限、上限を超えて白くなった画素の割合です。AIです。5、割り当てと見え方を、知っている場所で確かめる。森、湖、市街地、雪や雲の位置で、植物が期待した色か、水が黒いか、飛びとつぶれが許せる範囲かを判定します。人です。この5つを、合成を作るごとに繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      red = read_band(p, "B4")
      nir = read_band(p, "B5")
      grn = read_band(p, "B3")
      nir = resample_to(nir, red)        # 20m → 10m
      rgb = stack([nir, red, grn])       # 赤, 緑, 青の順
      show(stretch(rgb, 0, 0.3))

      AIの説明：「Sentinel-2の帯の番号はLandsatと同じで、赤がB4、近赤外がB5です。
      　20mの帯なので、10mの赤と緑に合わせて1画素を縦横2つずつに分けました」
      → 森は赤みを帯びたが、自然な色より暗く、田畑と市街地の区別がはっきりしない。
      　帯ごとの中央値の表では「近赤外」の値が赤の2倍弱

      問い：この結果から最初に疑うべきことはどれか
      A. 20mの帯を10mに分けたので、画像がぼやけて区別がつかない
      B. 「近赤外」として読んだB5は、Sentinel-2では赤の端の帯で、近赤外（B8、10m）ではない
      C. 明るさの上限0.3が高すぎて、全体がつぶれている
      D. 赤、緑、青の重ねる順番が逆で、近赤外が青に割り当てられている
    highlight: [2, 4, 5]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、町の近赤外の合成を作って。植物が赤く見えるように、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。Sentinel-2の帯の番号はLandsatと同じで、赤がB4、近赤外がB5です。20mの帯なので、10mの赤と緑に合わせて、1画素を縦横2つずつに分けました。できた画像では、森は赤みを帯びていましたが、自然な色で見たときより暗く、田畑と市街地の区別がはっきりしませんでした。帯ごとの中央値の表では、近赤外とした帯の値が、赤の帯の2倍弱でした。この結果から、最初に疑うべきことはどれでしょうか。A、20mの帯を10mに分けたので、画像がぼやけて区別がつかない。B、近赤外として読んだB5は、Sentinel-2では赤の端の帯で、近赤外のB8ではない。C、明るさの上限0.3が高すぎて、全体がつぶれている。D、赤、緑、青の重ねる順番が逆で、近赤外が青に割り当てられている。この動画で見た、波長帯の表と、帯ごとの中央値の見方を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が、山の上の白い部分が雪か雲かを知りたいと言い、AIが、自然な色の画像を明るく直せば分かります、と答えて上限を0.6に上げた、という場面で、問題点と正しい進め方を2行で書く、問2の短答も、そこにあります。

