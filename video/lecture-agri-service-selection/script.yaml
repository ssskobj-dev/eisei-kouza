# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第3部「営農支援サービスの比べ方」（learn/agri/agri-service-selection.qmd）
title: 衛星データの営農支援サービスの比べ方：7つの観点と4つの入口
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 9
total: 30
thumb: サービスの比べ方
summary: 衛星の生育診断を配信する営農支援サービスは、一覧の価格と対応作物の名前では選べません。農林水産省のカタログは、価格が各企業の任意の表示で、効果を農林水産省が確認したものでもないと注記しています。事業者の配信、営農管理アプリ、県や産地の仕組み、無償データの4つの入口を、対応作物と草丈、料金の形、更新頻度、細かさ、連携、データと解約、現地の裏付けの7つの観点で比べる方法を、営農指導員が農家に説明できる形で見ていきます。サービスの資料を1つ開いて7つの観点を埋める作業を一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 営農支援サービスの比べ方
    sub: 衛星の生育診断を、作物、料金の形、更新頻度、連携、解約の7つで選ぶ
    say: 衛星の生育診断を配信するサービスは、価格と対応作物の一覧を見れば選べるでしょうか。答えは、選べません。農林水産省の製品・サービス集は、価格が各企業の任意の表示で、効果を農林水産省が確認したものでもない、と注記しています。この動画では、4つの入口を、7つの観点で、自分の作物と機械に当てはめて比べる方法を見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 衛星データを使う営農支援サービスを、7つの観点で、自分の作物と機械に当てはめて比べられる
      - 料金の金額ではなく「料金の形」と「解約の条件」で、続けられるかを判断できる
      - 事業者の配信、営農管理アプリ、県や産地の仕組み、無償データの4つの入口から、自分に合う組み合わせを選べる
    say: この章を終えると、3つのことができるようになります。衛星データを使う営農支援サービスを、7つの観点で、自分の作物と機械に当てはめて比べられること。料金の金額ではなく、料金の形と解約の条件で、続けられるかを判断できること。そして、事業者の配信、営農管理アプリ、県や産地の仕組み、無償データの4つの入口から、自分に合う組み合わせを選べることです。

  - kind: figure
    heading: 比べる対象：4つの入口
    image: figures/agri-service-selection/overview.svg
    say: まず、比べる対象です。衛星の画像から圃場ごとの生育の地図を出すサービスは、1つの形ではありません。この章では、入口を4つに分けます。1つ目、事業者の配信サービス。衛星の画像を解析し、生育や施肥の地図を圃場ごとに配信します。農林水産省のカタログに載る事業者の資料では、2023年に22のJAで約510名が利用し、総面積は約63,800ヘクタールでした。2つ目、営農管理アプリ。作業の記録と農機のデータの管理が中心で、衛星の地図は機能の1つです。農研機構の農業データ連携基盤、WAGRIを通じて、気象や衛星の情報を組み込むものがあります。3つ目、県や産地の仕組み。青森県では、津軽地域の「青天の霹靂」の圃場を対象に、6月下旬から8月下旬にかけて生育診断の情報を提供しています。4つ目、無償の衛星データを自分で見る。費用はかかりませんが、画像を探し、雲を避け、指標を計算する手間は自分で持ちます。令和6年度の白書は、農業支援サービスを利用する担い手が2,914人、利用を希望する担い手が5,077人と、どちらも増えていると示しています。選ぶ場面は、これから増えます。

  - kind: figure
    heading: 観点1〜3：作物、料金の形、更新頻度
    image: figures/agri-service-selection/criteria.svg
    say: 7つの観点のうち、まず3つです。1つ目、対応作物と草丈。対応作物の欄に名前があることと、自分の作物で診断が効くことは別です。カタログの事業者の資料は、玉ねぎのように草丈が低く、衛星では判定しにくい場合は、ドローンのデータを使う必要があったと書いています。名前の一致ではなく、中身で確かめます。2つ目、料金の形。金額は時点で変わるので、形で比べます。カタログの資料には、圃場の面積に応じた年額の形と、対象の圃場を含む範囲の面積で決まる診断料金の形が載っています。後者は、耕地の面積ではなく、圃場を包含する8角形の範囲の面積が対象です。分散した圃場では、同じ耕地面積でも範囲が広くなります。3つ目、更新頻度と配信時期。光学の衛星は晴れた日しか撮れません。カタログの資料では、生育の地図は快晴時にデータを取得した翌日から数日後に配信され、提供期間は3月中から11月中です。青森県の仕組みは、撮影時に雲があった地域は欠測になると明記しています。「何日おき」ではなく、「追肥の適期の前に、何回届く見込みか」「雲のときはどうなるか」を聞きます。

  - kind: bullets
    heading: 観点4〜7：細かさ、連携、解約、現地
    items:
      - 細かさと最小の圃場：1筆の中のムラは苦手。20a未満は欠測の場合がある
      - 連携：地図を農機の形式に出せるか。自分の農機のデータが入るか、出せるか
      - データと解約：目的外の利用と第三者提供の禁止、終了後の削除。補助事業は準拠が要件
      - 現地の裏付け：地図は推定。基準の圃場を誰が測るかは、サービスの外に残る
    say: 残りの4つです。4つ目、細かさと最小の圃場。栃木県の現地試験では、衛星のゾーン分けと現地の生育量に、すべての時期で相関が見られませんでした。青森県の収穫の仕組みは、面積20アール未満の圃場は欠測になる場合があるとしています。小さな田が多い管内では、地図に穴が開きます。5つ目、農機や営農アプリとの連携。地図を見るだけなら連携は要りません。可変施肥に使うなら、地図を農機の形式にして入れる必要があります。農機と作業機をつなぐ制御通信の国際標準、ISOBUSに対応した国産の汎用ECUは、2022年4月から市販されています。農林水産省の資料によると、WAGRIでは2026年3月時点で223のAPIが使え、会員は126の民間事業者等です。自分の農機のデータが、そのサービスに入るか、出せるかを確かめます。6つ目、データの扱いと解約。農林水産省の契約ガイドラインは、提供したデータの目的外の利用と第三者への提供を禁じ、契約終了後の提供データの削除等を定めることを示しています。補助事業で導入する場合は、令和3年度から、このガイドラインへの準拠が要件です。解約したとき、自分の圃場の地図と記録を持ち出せるか、残るデータは消されるかを、契約の前に文で確かめます。7つ目、現地の裏付け。どの入口でも、地図は推定です。青森県の仕組みは、最終的な判断は実際の圃場の状況を踏まえて行うよう求めています。基準の圃場を誰が測るかが、サービスの外に残ります。

  - kind: table
    heading: 比較表
    columns: [観点, 事業者の配信, 営農管理アプリ, 県や産地の仕組み, 無償データを自分で]
    widths: [0.14, 0.24, 0.2, 0.22, 0.2]
    rows:
      - [対応作物, 一覧はあるが、草丈の低い作物は判定しにくい, 記録はどの作物でも。衛星の地図は機能次第, 決まった品種と地域, 自分で指標を選ぶ]
      - [料金の形, 面積に応じた年額、範囲の面積の診断料など, 月額や年額。衛星は追加の場合も, 条件は県や団体による, データは無償。手間が費用]
      - [更新頻度, 快晴時の取得の翌日から数日後, 組み込む情報による, 決まった期間に定期配信, 雲を避けて自分で]
      - [細かさ, 1筆の中は苦手な場合, 組み込む衛星による, 20a未満は欠測の場合, 無償は10m]
      - [連携, 可変施肥機への出力。対応機は限られる, 農機データの管理が中心, 配信のみが多い, 自分で変換]
      - [データと解約, ガイドラインへの準拠を確かめる, 同左, 利用範囲が役割で決まる, 自分の手元]
    say: 7つの観点を、4つの入口で表にします。事業者の配信は、作物の一覧と可変施肥機への出力がありますが、草丈の低い作物と1筆の中のムラは苦手で、対応機は限られます。営農管理アプリは、記録と農機のデータの管理が中心で、衛星の地図は組み込む情報次第です。県や産地の仕組みは、決まった品種と地域に、決まった期間、定期配信されます。無償データは、費用の代わりに手間が自分に残ります。現地の裏付けは、どの入口でも、自分の基準の圃場で確かめることになります。金額は、時点と条件で変わるので、表に入れていません。最新の条件は、事業者と県に確かめます。

  - kind: figure
    heading: 条件別に、どの入口から考えるか
    image: figures/agri-service-selection/cases.svg
    say: 条件別に、どの入口から考えるかを4つに分けます。1つ目、県や産地の仕組みがある品種なら、そこから。個別に契約するより先に、自分の圃場が対象かを確かめます。利用の範囲は、県は全域、集荷団体は所属の団体、生産者は本人のデータ、のように役割で決まっています。2つ目、可変施肥まで使うなら、農機に出せる配信サービスから。地図を農機の形式にできるか、自分の農機が対応機に入っているかで決まります。対応していなければ、地図を見て手で撒く範囲にとどめるか、散布を委託します。3つ目、記録の整理が先なら、営農管理アプリから。新潟市の実証では、衛星の広域の診断で点在する圃場を同じ指標で一度に見られ、見回りを効率化できた一方、天候で画像が取得できない場合があるとされています。4つ目、まず試すなら、無償データから。1年目は、無償の衛星で自分の圃場の地図を見て、雲で欠けた回数と、現地の生育との合い方を記録します。合う見込みが立ってから、配信サービスの契約を検討します。入口は1つに決めなくて構いません。地図は県の仕組みか配信から、記録はアプリに、基準の圃場は人が測る、と役割を分けます。

  - kind: steps
    heading: 一緒にやってみよう
    items:
      - 候補のサービスの資料か契約書を1つ開く。カタログの掲載資料でもよい
      - 対応作物の欄で、自分の作物の名前のほかに、草丈や時期の説明があるかを書く
      - 料金の欄で、形を書く。面積の年額か、範囲の面積か。金額は書かない
      - 配信の欄で、取得から配信までの日数と、雲のときの扱い。無ければ「聞く」
      - 最小の圃場、農機の形式への出力、持ち出しと削除の条項を、同じように書く
    say: ここからは、一緒にやってみましょう。候補のサービスの資料を1つ、7つの観点で読みます。紙1枚で、数分でできます。まず、候補のサービスの資料か契約書を1つ開きます。農林水産省のカタログに載っている資料でも構いません。次に、対応作物の欄を見ます。自分の作物の名前があるかではなく、草丈や時期の説明があるかを書きます。3つ目に、料金の欄で、形を書きます。圃場の面積に応じた年額か、圃場を含む範囲の面積か。金額は書きません。4つ目に、配信の欄で、取得から配信までの日数と、雲のときの扱いを書きます。書いてなければ「聞く」と書きます。5つ目に、最小の圃場、農機の形式への出力、データの持ち出しと削除の条項を、同じように書きます。資料に無い欄が、そのまま、事業者に聞く質問の一覧になります。

  - kind: prompt
    heading: 紙に書く型
    label: 記入の型
    text: |
      サービス名：○○　　資料の日付：○年○月
      1 対応作物と草丈：名前あり ／ 草丈・時期の説明あり ／ 聞く
      2 料金の形：面積の年額 ／ 範囲の面積 ／ その他 ／ 聞く
      3 配信：取得から○日後　　雲のとき：欠測 ／ 再配信 ／ 聞く
      4 最小の圃場：○a　　1筆の中のムラ：見る ／ 見ない
      5 連携：農機の形式に出せる（対応機：○○）／ 出せない ／ 聞く
      6 データと解約：持ち出し ○ ／ 削除 ○ ／ 期間 ○年 ／ 聞く
      7 現地の裏付け：基準の圃場を測る人：○○

      「聞く」の数：○個　→ 次の打ち合わせで聞く
    say: 紙に、この型を書いてみてください。一番上に、サービス名と、資料の日付。金額は時点で変わるので、日付を残します。1から7が、観点です。それぞれ、資料に書いてあることを丸で囲み、書いてなければ「聞く」に丸をします。6のデータと解約は、持ち出し、削除、期間の3つを、文で確かめます。7の現地の裏付けは、基準の圃場を測る人の名前を書きます。ここだけは、どのサービスを選んでも、自分たちの側に残る仕事です。一番下に、「聞く」の数を数えます。今日は、丸が1つも付かなくても構いません。何を聞けばよいかが分かることが、最初の一歩です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 入口を4つに分ける。事業者の配信、営農管理アプリ、県や産地の仕組み、無償データ
      - 対応作物は名前ではなく中身で。料金は金額ではなく形で比べる
      - 「適期の前に何回届くか」「雲のときは」「最小の圃場は」を聞く
      - 農機の形式に出せるか、農機のデータが入るかを確かめる
      - 契約は、持ち出し、削除、期間、解約の条件を文で確かめる
      - 基準の圃場は人が測る。地図と合わない圃場は、原因を記録に残す
    say: 手順をまとめます。1、入口を4つに分ける。事業者の配信、営農管理アプリ、県や産地の仕組み、無償データです。2、対応作物は名前ではなく中身で、料金は金額ではなく形で比べる。3、適期の前に何回届くか、雲のときはどうなるか、最小の圃場はいくらかを聞く。4、農機の形式に出せるか、農機のデータが入るかを確かめる。5、契約は、持ち出し、削除、期間、解約の条件を文で確かめる。都道府県の知財総合支援窓口、INPITで、無料の相談が受けられます。6、基準の圃場は人が測り、地図と合わない圃場は原因を記録に残す。県や産地の仕組みがあればそこから、可変施肥まで使うなら農機に出せる配信から、記録が先ならアプリから、試すなら無償データから始めます。

  - kind: bullets
    heading: 宿題：この現場に最も合う進め方
    bold: true
    items:
      - 場面：水稲の集落営農法人。1筆30a前後、150筆が3つの集落に分散。県に主力品種の生育判定を配信する仕組みがあり、法人の品種の8割がその品種。可変施肥機は無い
      - A. 可変施肥機への出力ができる事業者の配信サービスを、全筆で契約する
      - B. 県の仕組みの対象かを先に確かめ、主力品種はそこから地図を受け取る。残りの2割は無償データで1年記録してから考える
      - C. 県の仕組みは使わず、無償データだけで全筆を自分で解析する
      - D. 可変施肥機を先に買ってから、サービスを選ぶ
    say: 宿題です。場面は架空です。ある水稲の集落営農法人が、衛星の生育診断を使いたいと考えています。圃場は1筆30アール前後、150筆が、3つの集落に分散しています。県には、その地域の主力品種を対象に、6月下旬から8月下旬に生育の判定を配信する仕組みがあります。法人の品種の8割は、その主力品種です。可変施肥機は持っていません。この現場に最も合う進め方は、どれでしょうか。A、可変施肥機への出力ができる事業者の配信サービスを、全筆で契約する。B、県の仕組みの対象に自分の圃場が入るかを先に確かめ、主力品種の圃場はそこから地図を受け取る。残りの2割は、無償データで雲の欠測と現地の合い方を1年記録してから考える。C、県の仕組みは使わず、無償データだけで全筆を自分で解析する。D、可変施肥機を先に買ってから、サービスを選ぶ。さきほどの4つの場合分けに、この場面を当てはめて考えてみてください。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに3問あります。

  - kind: cta
    heading: 資料を1つ読んだら、章のページへ
    action: 比較表の出典とケース問題4問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-service-selection.html
    credits:
      - "出典：農林水産省「農業新技術 製品・サービス集」（令和7年9月更新）、同「スマート農業技術カタログ」掲載資料（衛星データによる生育診断、可変施肥）"
      - "出典：農林水産省 技術政策室「農業データの利活用の推進について」（2026年7月）、同「令和6年度 食料・農業・農村白書」（令和7年5月）"
      - "出典：青森県産業技術センター「『青天ナビ』における生育診断システムの活用方法」、青森県「あおもり米収穫支援システムの使い方」（令和6年度）"
      - "出典：栃木県農業試験場 委託試験成績（2023年度）、農研機構 アジアモンスーン地域農林水産技術カタログ（ISOBUS対応農機）"
      - "出典：農林水産省「農業分野におけるAI・データに関する契約ガイドライン」（令和2年3月）と同Q&A（令和6年3月）"
      - "出典：農研機構 スマート農業実証プロジェクト（新潟市、2019年度採択）"
      - "22のJA、約510名、約63,800haと料金の形は、2023年の事業者の資料の数字です。現在の条件は事業者に確かめてください。出典の全件は章のページに"
    say: この章のページには、比較表の出典と、条件別のおすすめ、組み合わせ方、ケース問題4問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
