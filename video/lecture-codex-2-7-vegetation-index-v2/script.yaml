    url: ssskobj-dev.github.io/eisei-kouza/learn/codex/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/codex/codex-2-7-vegetation-index.html
    credits:
      - "出典：NASA Earth Observatory「Measuring Vegetation (NDVI & EVI)」（しくみ、−1〜+1、値の目安、雲は指数を低くする、密な葉で頭打ち）"
      - "出典：USGS「Landsat Normalized Difference Vegetation Index」（Landsat 8と9はBand 5とBand 4、Landsat 4〜7はBand 4とBand 3）"
      - "出典：ESA SentiWiki「S2 Mission」「S2 Products」（B4 665nm、B8 833nm、10m。版04.00以降：（画素の値＋BOA_ADD_OFFSET −1000）÷QUANTIFICATION_VALUE 10000）"
      - "出典：ESA「Sentinel-2 Level-2A ATBD」V2.10.0（SCL：0 データなし、1 不良、3 影、4 植物、5 植物以外、6 水、8・9 雲、10 薄い雲、11 雪）"
      - "出典：道総研 十勝農業試験場「衛星画像を用いた秋まき小麦『きたほなみ』の茎数推定…実施マニュアル」（2023年3月）"
      - "作例：NDVIの式で 0.5/0.1→0.67、0.22/0.20→0.05。−1000と10000で 画素の値6000/2000→0.50、(0−1000)÷10000＝−0.1"
      - "作例：「森0.8→0.45〜0.55」「区画12：0.72」「北側20区画」「除いた割合が3割」とケース問題の場面は、章で例として置いた値"
    say: 章のページには、公式資料の出典、指示文のひな形、擬似コードの解説、ケース問題があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
