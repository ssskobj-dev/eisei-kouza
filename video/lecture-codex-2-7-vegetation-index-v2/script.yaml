# 講義動画の台本（作り直し版）。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第7章「衛星データの植生指数：Sentinel-2の赤と近赤外から雲を除いて計算し、区画ごとに平均して生育診断の表を作る」（learn/codex/codex-2-7-vegetation-index.qmd）
# 2026-11-27 作り直し。前の動画（lecture-codex-2-7-vegetation-index）は残す。
# 直した点：「ずらし」「欠け」「反射率に直す」を、付属情報の名前（BOA_ADD_OFFSET、QUANTIFICATION_VALUE）と数字と計算例で説明する。
#           帯域の表と除く分類の表を分ける。絵のある図を7枚足す（figures/lecture-codex-2-7-vegetation-index-v2.yaml）。宿題は四肢択一。
title: 衛星データのNDVI入門：画素の値を反射率に直す−1000と10000
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 11
total: 30
thumb: −1000を足せ
summary: 衛星データ（Sentinel-2）の赤B4と近赤外B8からNDVIを計算し、雲と影を除いて区画ごとに平均し、生育診断や農地調査の表を作る章の講義動画（作り直し版）。葉が赤を吸って近赤外を返すしくみ、画素とは何か、配られる画素の値をBOA_ADD_OFFSET（−1000）とQUANTIFICATION_VALUE（10000）で反射率に直す計算、画素の値0は「データが無い」印であること、SCLの番号（3・8・9・10を除く、4は植物）、影のかかった画素を0にして平均すると順位が狂うことを、絵のある図で見ます。AIが返した擬似コードを一緒に点検して4つの誤りを見つけ、表と地図を手元で確かめる練習と、四肢択一の宿題つき。
scenes:
  - kind: cover
    heading: NDVI：画素の値を反射率に直してから計算する
    sub: 赤B4と近赤外B8。−1000を足して10000で割る。雲と影の画素は0にしない
    say: 市内の農地、たとえば100の区画について、6月の植物の茂り具合を1つの数字で並べて、現地に行く区画を絞りたい。衛星データでできるでしょうか。答えは、できます。赤と近赤外の光からNDVIという数字を計算し、雲と影を除いて、区画ごとに平均すればよい、です。ただし、いちばん大きな落とし穴が1つあります。衛星から配られる画素の値は、そのままでは使えません。マイナス1000を足して、10000で割る。この一手間を飛ばすと、表はもっともらしいのに、どの区画の値も0の側に縮んで出ます。この動画では、葉と光のしくみ、画素の値の直し方、雲と影の扱いを絵で見たあと、AIが返したコードを一緒に点検して、4つの誤りを見つけます。最後に四肢択一の宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - Sentinel-2の赤B4と近赤外B8からNDVIを計算し、雲と影を除いて、区画ごとの平均の表を作れる
      - 画素の値を反射率に直す計算（BOA_ADD_OFFSETの−1000を足し、10000で割る）と、飛ばすと値が縮む理由が分かる
      - 森が0.45、裸地が0.08のように全体が0の側に縮んだ表を見て、−1000を足していないと気づける
    say: この動画を見終わると、3つのことができるようになります。1つ目は、表を作れるようになります。農地100区画のNDVIを1枚の表にして、値の低い区画から現地に行く、という使い方です。2つ目は、画素の値の直し方が分かります。Sentinel-2から配られる値は、反射率そのものではありません。付属情報にあるマイナス1000を足して、10000で割って、初めて反射率になります。なぜそうなのか、飛ばすとどうなるのかを、計算で確かめます。3つ目は、おかしな表に気づけるようになります。森の区画が0.45、裸地が0.08。こんな表が出てきたら、どの区画も0の側に寄っていますよね。そのときは、マイナス1000を足していない、と疑えるようになります。

  - kind: figure
    heading: しくみ：葉は赤を吸い、近赤外を返す
    short: しくみ：葉と光
    image: figures/lecture-codex-2-7-vegetation-index-v2/leaf-light.svg
    say: まず、しくみから。図の左を見てください。太陽の光が葉に当たります。健康な葉は、赤い光を吸収して、近赤外という、目に見えない光を強く跳ね返します。葉緑素が赤を吸い、葉の内部の構造が近赤外を跳ね返すからです。衛星は、この跳ね返ってきた光の量を、色ごとに測っています。そこで、近赤外の反射率から赤の反射率を引いて、2つの和で割ります。これがNDVI、正規化植生指数です。たとえば、茂った葉で、近赤外が0.5、赤が0.1だとします。差は0.4、和は0.6。0.4割る0.6で、およそ0.67です。右の岩と砂はどうでしょうか。赤も近赤外も、似た量だけ跳ね返します。近赤外が0.22、赤が0.20なら、差は0.02、和は0.42で、およそ0.05。葉があるほど差が開くので、値が大きくなる。これがNDVIの考え方です。反射率はどちらも0以上なので、差が和を超えることはありません。だから値は、必ずマイナス1から1の間に収まります。

  - kind: figure
    heading: 値の目安：森は0.6〜0.8、裸地は0.1以下
    short: 値の目安
    image: figures/codex-2-7-vegetation-index/scale.svg
    say: この目盛りが、値の目安です。0.8から0.9が、いちばん密な緑の葉。0.6から0.8が森。0.2から0.3が低木や草地。岩や砂や雪は0.1以下。0は、緑の葉が無い、という意味です。近赤外より赤のほうが大きい場所では、マイナスになります。緑の葉のある場所では起きません。覚えて帰ってほしい数字は2つだけ。森なら0.6以上、裸地なら0.1以下。覚えられそうですか。あとで表を確かめるとき、この2つが物差しになります。

  - kind: figure
    heading: 画素とは：マス目ごとに値が1つ、区画はその平均
    short: 画素と区画の平均
    image: figures/lecture-codex-2-7-vegetation-index-v2/pixel.svg
    say: ここで、画素という言葉を押さえておきます。衛星の画像は、図の左のような小さなマス目の集まりです。このマス目を画素と呼びます。Sentinel-2の赤と近赤外では、1マスが10メートル四方です。マスごとに、赤の値と近赤外の値が1つずつ入っていて、そこからNDVIもマスごとに1つ計算できます。では、農地の区画の値とは何でしょうか。右の図です。1つの区画には、たくさんの画素が入ります。その画素のNDVIを平均したものが、表の1行になります。区画12は0.72、というように。つまり、区画の値を信用できるかどうかは、平均に入れた画素を信用できるか、で決まります。ここが、あとで雲と影の話につながります。

  - kind: table
    heading: 使う波長の帯域（バンド）
    short: 使う帯域（バンド）
    columns: [色, Sentinel-2, Landsat 8と9, Landsat 4〜7]
    widths: [0.16, 0.36, 0.24, 0.24]
    rows:
      - [赤, B4（中心およそ665nm、画素10m）, Band 4（30m）, Band 3]
      - [近赤外, B8（中心およそ833nm、画素10m）, Band 5（30m）, Band 4]
    say: 使う光の波長の帯域、バンドの番号です。Sentinel-2では、赤がB4、近赤外がB8。どちらも10メートルの画素です。気をつけたいのは、衛星が変わると番号も変わることです。Landsat 8と9では、赤がバンド4、近赤外がバンド5。もっと古いLandsatでは、赤がバンド3、近赤外がバンド4でした。近赤外は5番、と覚えていませんか。その覚え方は通用しません。番号は、使う衛星の公式の表で、毎回確かめてください。

  - kind: figure
    heading: 画素の値は反射率ではない：−1000を足して、10000で割る
    short: 反射率に直す
    image: figures/lecture-codex-2-7-vegetation-index-v2/offset-flow.svg
    say: ここが、今日いちばん大事なところです。Sentinel-2から配られる画素の値は、反射率そのものではありません。たとえば6000、という整数が入っています。反射率は、光を何割跳ね返したか、なので、0から1の間の数のはずですよね。では、6000をどう直すのか。図の流れです。データに付いてくる付属情報に、2つの数字が書いてあります。1つはBOA_ADD_OFFSET、足す数で、値はマイナス1000。もう1つはQUANTIFICATION_VALUE、割る数で、値は10000です。6000にマイナス1000を足す、つまり1000を引いて、5000。それを10000で割って、0.5。これで、光の5割を跳ね返した、という反射率になります。この決まりは、処理の版04.00、2022年1月25日以降に処理された、Level-2A、つまり地表の反射率まで処理した段階のデータのものです。それより前に処理されたデータや、入手先で直してあるデータでは、付属情報の値が違います。だから、毎回、付属情報とデータの説明を読んでから直してください。二重に1000を引かないためです。

  - kind: figure
    heading: 直さないとどうなるか：0.67が0.50に
    short: 直さないとどうなるか
    image: figures/lecture-codex-2-7-vegetation-index-v2/offset-vs.svg
    say: では、直さずに計算すると、どうなるでしょうか。左が、直してから計算した場合。近赤外0.5、赤0.1で、0.67です。右が、画素の値のまま計算した場合。反射率0.5と0.1は、画素の値で言うと6000と2000です。これをそのまま計算すると、差は4000、和は8000で、0.50。正しい値より低く出ています。なぜでしょうか。10000で割る方は、分子と分母の両方にかかるので、割り算で打ち消されます。あとで見るAIも、ここまでは正しく説明します。ところが、マイナス1000の方は足し算です。割り算では消えません。分子の差は変わらないのに、分母の和だけが大きくなるので、どの値も0に向かって縮みます。森くらいの明るさなら、0.8が0.45から0.55くらいになります。暗い画素ほど縮み方が大きいので、一律ではありません。やっかいなのは、表がもっともらしく見えることです。森は0.6以上、という目安を知らないと、気づけません。

  - kind: figure
    heading: 画素の値0は「データが無い」印
    short: 値0はデータなし
    image: figures/lecture-codex-2-7-vegetation-index-v2/nodata.svg
    say: もう1つ、画素の値の話です。画像の端や、撮れていない帯の部分では、画素の値が0になっています。この0は、暗い、という意味ではなく、データが無い、という印です。図の左、マス目の右端の列が、それです。ここで問題です。この0のまま、さっきの直し方を当てると、どうなるでしょうか。0にマイナス1000を足して、10000で割ると、マイナス0.1。右の図のように、ただの暗い値になってしまいます。こうなると、データが無かった場所と、本当に暗い場所の見分けがつきません。赤も近赤外もマイナス0.1なので、差は0。NDVIは0、つまり緑の葉が無い、という値で表に混ざります。だから、順番が大事です。値が0のうちに、データなし、の印を付ける。反射率に直すのは、そのあとです。

  - kind: table
    heading: 除く分類の番号（SCL、20mの画素）
    short: 除く分類の番号
    columns: [扱い, 番号, 意味]
    widths: [0.16, 0.24, 0.56]
    rows:
      - [除く, "0、1", データなし、不良画素]
      - [除く, "3", 雲の影]
      - [除く, "8、9、10", 雲（確からしさ中・高）、薄い雲]
      - [残す, "4、5、6、11", 植物、植物以外、水、雪]
    say: 次に、雲と影です。Level-2Aのデータには、画素ごとの分類が付いています。SCLと呼ばれる、20メートルの画素の地図です。番号で意味が決まっていて、除くのは、0のデータなし、1の不良画素、3の雲の影、8と9の雲、10の薄い雲です。残すのは、4の植物、5の植物以外、6の水、11の雪です。ここで取り違えやすいのが、4です。4は何だと思いますか。植物です。雲ではありません。4を除いてしまうと、植物を除いて雲を残す、という逆のことが起きます。番号は、AIに任せず、指示文に書きます。もう1つ。SCLは20メートルの画素なので、10メートルの赤と近赤外に重ねる前に、10メートルに合わせます。

  - kind: figure
    heading: 雲の影が区画にかかると、平均が下がる
    short: 雲の影と平均
    image: figures/lecture-codex-2-7-vegetation-index-v2/cloud-shadow.svg
    say: 雲と影が、なぜ区画の平均を狂わせるのか。図の左です。太陽の光を雲がさえぎると、雲の横にずれた位置に、影が落ちます。影の中の画素は暗く、赤も近赤外も小さな数になります。小さな数どうしの差と和から計算するので、わずかな誤差で値が大きく動き、NDVIは低く出やすくなります。真ん中の図。影のかかった画素を、除いたつもりで0にして、そのまま平均したらどうなるでしょうか。下半分が0なので、区画の平均はおよそ半分に下がります。0は、緑の葉が無い、という意味の値でしたよね。つまり、生育ではなく、雲のかかり具合で区画の順位が決まってしまいます。右の図が、正しい扱いです。除いた画素は、数に入れずに、残りの画素だけで平均します。そして、使った画素数と、除いた割合も、同じ表に出します。除いた割合が高い区画は、残った一部の画素の平均なので、順位に入れてよいかどうかを人が決めます。たとえば、100区画のうち北側の20区画に影がかかったら、その20区画は別扱いにします。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [NDVIを計算して, 赤B4と近赤外B8を、付属情報のBOA_ADD_OFFSETとQUANTIFICATION_VALUEで反射率に直してから、（近赤外−赤）÷（近赤外＋赤）を計算して]
      - [雲は除いて, SCLが0、1、3、8、9、10の画素を除いて。除いた割合も区画ごとに出して]
      - [区画ごとの平均を出して, 除いた画素とデータの無い画素を数に入れずに平均して。使った画素数も表に入れて]
      - [（確かめ方も先に）, 最小と最大、データなしと分母0の画素の数、除いた割合が3割超の区画の数、森と裸地の区画の平均を出して]
    say: では、AIにどう頼むか。左があいまいな頼み方、右が直した頼み方です。NDVIを計算して、とだけ頼むと、AIは画素の値をそのまま割り算しがちです。だから、付属情報のBOA_ADD_OFFSETとQUANTIFICATION_VALUEで反射率に直してから、と書きます。雲は除いて、で通じると思いますか。分類の番号をAIが自分で決めてしまいます。だから、0、1、3、8、9、10、と番号まで書きます。平均も、除いた画素とデータの無い画素を数に入れない、使った画素数も表に入れる、と書きます。それから、確かめ方も先に頼んでおきましょう。表の4行目です。まず、NDVIの最小と最大を出してもらいます。次に、データの無い画素と、分母が0になった画素を数えてもらいます。それから、除いた割合が3割を超える区画がいくつあるか。最後に、知っている森と裸地の区画の平均を、1つずつ出してもらいます。この3割は、この動画で例として置いた目安です。目的に合わせて決めてください。指示文のひな形は、章のページにあります。

  - kind: figure
    heading: 一緒に：AIの説明と、確かめる4つ
    short: 一緒に：確かめる4つ
    image: figures/lecture-codex-2-7-vegetation-index-v2/ai-claims.svg
    say: ここからは、一緒に点検していきましょう。AIが、区画ごとの表を作ってきました。説明はこうです。比なので倍率は打ち消されます、反射率に直す手間は省きました。雲はSCLの4で除きました。0で割った画素は0で埋めてあります。自信たっぷりですよね。でも、ここまで見てきたみなさんなら、もう引っかかるところがあるはずです。人が確かめるのは、右の4つです。マイナス1000、BOA_ADD_OFFSETを足しているか。雲と影の番号は3、8、9、10か、4は植物ではなかったか。値0のデータなしに印を付けず、数として計算に入れていないか。そして、平均に0を入れていないか。この4つを先に決めてから、コードを上から読みます。

  - kind: code
    heading: 一緒に：擬似コードを読む
    code: |
      # 区画ごとのNDVI（誤りあり・説明用の擬似コード）
      red = read_band(p, "B4")                       # 画素の値のまま
      nir = read_band(p, "B8")
      scl = read_band(p, "SCL")
      ok  = (scl != 4)                               # 4を雲と思い込む
      ndvi = (nir - red) / (nir + red)               # −1000を足していない
      ndvi = fill_nan(ndvi, 0)                       # 0で割った画素を0に
      ndvi = where(ok, ndvi, 0)                      # 除いた画素も0に
      table = mean_by_zone(ndvi, zones)              # 0も平均に入る
    highlight: [5, 6, 7, 8, 9]
    say: 画面が、説明用に短くした擬似コードです。関数の名前は仮のものです。上から読んでいきます。2行目と3行目で、赤と近赤外を読んでいます。番号はB4とB8で、表と合っていますね。ただし、読んだ値は画素の値のままです。4行目で分類を読み、5行目で、分類が4以外の画素を、使ってよい、としています。ここ、引っかかりませんか。6行目で、画素の値のまま、差を和で割っています。マイナス1000は、どこにも出てきません。7行目は、0で割って計算できなかった画素を、0にしています。8行目で、使わない画素も0にして、9行目で区画ごとに平均しています。さて、このコードは、動かしても止まりません。表はちゃんと出ます。だからこそ、確かめる手順を先に決めておくんです。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.10, 0.13, 0.29, 0.48]
    rows:
      - ["5", 雲と影, "scl != 4。「雲はSCLの4で除いた」", "4は植物。正しくは0・1・3・8・9・10を除く"]
      - ["6", 反射率, "画素の値のまま割り算。「倍率は打ち消される」", "−1000の足し算は消えない。先に反射率に直してから計算する"]
      - ["7", データなし, "fill_nan(ndvi, 0)。「0で割った画素は0で埋めた」", "0は「葉がない」の値。データなしのまま残す"]
      - ["8・9", 平均, "where(ok, ndvi, 0) のあと平均", "0が平均に入る。除いた画素は数に入れず、画素数と割合も表に"]
    say: 判定の結果が、この表です。行の順に、4つ見ていきます。まず5行目。SCLの4は植物でしたね。この行は、植物を除いて、雲と影のほうを残しています。茂った区画ほど画素が減って、雲の区画が残る。狙いと逆の結果です。正しくは、0、1、3、8、9、10を除きます。次に6行目。10000で割る方は消えますが、マイナス1000の足し算は残ります。1000を引いて、10000で割ってから計算します。直さないと、さっき見たように、0.67が0.50になります。7行目。0で割って計算できなかった画素を、0で埋めています。赤も近赤外も0、つまりデータが無い画素です。それを0にすると、緑の葉が無い、という値に化けます。データなしのまま残すのが正解です。そして、データなしの印は、反射率に直す前、画素の値が0のうちに付けます。最後に8行目と9行目。除いた画素を0にしてから平均しているので、雲や影のかかった区画ほど平均が下がります。生育ではなく、雲のかかり具合で順位が決まってしまう。除いた画素は数に入れず、使った画素数と除いた割合も表に出します。この4つのうち、5行目は地図を見ればすぐ気づきます。畑が灰色で、雲が色付きになるからです。ところが6行目と8行目は、表の数字がもっともらしいので、いちばん隠れやすい。判定が出たら、AIに何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：表と地図を確かめる
    items:
      - 最小と最大が−1〜1に収まっているか。外れていれば、直し方か、帯域の取り違え
      - 茂った区画が0.6以上か。森が0.45なら、−1000を足していない
      - 裸地や舗装が0.1以下か。裸地が0.5なら、赤と近赤外の取り違え
      - 除いた画素が、雲と影の形をしているか。灰色が畑の形なら、番号の取り違え
      - 除いた割合が高い区画（3割超）が、順位に入っていないか
      - 影の縁の区画の平均が、まわりより一段低くないか
    say: 直したら、手元で確かめます。できた表と、NDVIの地図、それから除いた画素を灰色で重ねた地図。この3つがあれば、数分でできます。1つ目、表の最小と最大を見ます。マイナス1から1に収まっていますか。外れていたら、反射率への直し方が違うか、別の帯域を読んでいます。2つ目、知っている森の区画を見ます。0.6以上ありますか。もし0.45なら、まず、マイナス1000を足していないことを疑います。3つ目、裸地や舗装。0.1以下ですか。裸地が0.5もあったら、赤と近赤外が逆です。4つ目、除いた画素の形。灰色が、雲と、その横にずれた影の形になっていれば、正しい扱いです。畑の形をしていたら、番号の取り違えです。5つ目、除いた割合が3割を超える区画。残った画素だけの平均なので、順位に入れてよいかは人が決めます。6つ目、影の縁の区画。まわりより一段低ければ、影が一部にかかっています。この6つを、報告の前に必ずやってください。

  - kind: figure
    heading: 影と生育不良の見分け方、2つの例
    short: 影と生育不良、例2つ
    image: figures/codex-2-7-vegetation-index/shadow.svg
    say: この図は、雲の影と生育不良の見分け方です。左が雲の影。低い値が、区画の境界とは関係なく、雲の横にずれた帯の形で並びます。そして、別の日には消えます。右が生育不良。低い値が区画の形に沿っていて、別の日にも同じ区画が低い。ただし、生育不良だと言えるのは、現地で確かめてからです。おかしな結果の例を2つ。例1、森の区画の平均が0.5前後、裸地が0.08だった。森が0.6に届いていなくて、全体が0の側に縮んでいますよね。マイナス1000を足さずに、画素の値のまま割り算すると、こうなります。例2、同じ日の地図で、北西から南東に、帯状に低い区画が並んだ。この帯の向き、区画の形とは関係なくて、雲の列と同じ向きです。影が区画の一部にかかって、残った画素の平均が下がっています。除いた割合の列を見て、3割を超える区画を外し、別の日の画像でも低いままかを確かめます。

  - kind: bullets
    heading: 言えること、言えないこと、向かない条件
    short: 言えること・向かない条件
    items:
      - 言える：同じ処理・同じ日の表なら、区画どうしの順位付けに使える
      - 言えない：収量。病気か水不足かという原因。現地で確かめる
      - 向かない：雲や雪の日。茂りきった時期（頭打ち）。10mの画素より細い区画
      - 商用データは、帯域の番号、足す数、割る数が衛星ごとに違う。仕様書で確かめる
    say: では、この表で何が言えて、何が言えないのでしょうか。言えるのは、同じ処理をした同じ日の表なら、区画どうしの順位付けに使える、ということ。言えないのは、収量や、病気なのか水不足なのかという原因です。NDVIは緑の葉の量の目安で、病気でも水不足でも刈り取りでも、同じように下がります。原因は現地で確かめます。章のページの出典にある北海道の小麦の例では、衛星で選んだ区画で茎数を実際に数えて、NDVIの意味を確かめています。向かない条件も3つ。雲や雪が区画にかかっている日は、残った画素で平均しても区画全体の値にはならないので、別の日を探します。茂りきった時期は、NDVIが頭打ちになって差が出ません。区画が10メートルの画素より細いと、隣の区画や道の値が混ざります。商用データを使うときは、帯域の番号も、足す数も、割る数も衛星ごとに違うので、契約の仕様書で確かめてください。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 区画と期間を決め、帯域と除く番号を表にする。赤B4、近赤外B8、除く0・1・3・8・9・10（人）
      - 画素の値0に「データなし」の印を付けてから、−1000を足し10000で割って反射率にする（AI）
      - 雲と影を除いてNDVIを計算する。データなしの数と除いた割合も出す（AI）
      - 区画ごとに平均する。平均、使った画素数、除いた割合の表（AI）
      - 目安と照らす。森が0.6以上か、裸地が0.1以下か、除いた割合が高い区画をどう扱うか（人）
    say: 手順をまとめます。1は、人が決めるところ。区画の境界と、生育の段階に合う期間を決めて、使う帯域と除く番号を表にします。2から4は、AIにやらせるところ。まず、画素の値0にデータなしの印を付けてから、マイナス1000を足し、10000で割って反射率にする。次に、雲と影を除いてNDVIを計算し、データなしの数と除いた割合も出す。そして、区画ごとに平均して、使った画素数と除いた割合を同じ表に出す。5は、また人の仕事です。森が0.6以上か、裸地が0.1以下か、除いた割合が高い区画を順位に入れてよいか。ここを飛ばして報告していませんか。この5つを、NDVIを出すたびに繰り返してください。

  - kind: code
    heading: 宿題：ケース問題 問1（四肢択一）
    short: 宿題：ケース問題
    code: |
      red = read_band(p, "B4")
      nir = read_band(p, "B8")
      scl = read_band(p, "SCL")
      bad = isin(scl, [3, 8, 9, 10])
      ndvi = (nir - red) / (nir + red)
      ndvi = where(bad, 0, ndvi)
      table = mean_by_zone(ndvi, zones)

      AIの説明：「比なので倍率は打ち消されます。反射率に直す手間は省きました。
      　雲の画素は、除いたあと0にしてから平均しています」
      → 森の区画が0.45、裸地の区画が0.08。雲が多かった北側の区画は、どれも0.1前後

      問い：この結果から最初に疑うべきことはどれか
      A. 近赤外にB8ではなくB8Aを使うべきで、帯域の取り違えで森の値が低い
      B. ずらし（BOA_ADD_OFFSET）を直さずに割り算し、除いた画素を0にして平均に入れている
      C. 除く分類の番号が違い、植物の画素を除いて雲を残している
      D. 6月は葉が茂りきって値が頭打ちになり、森と裸地の差が出ない
    say: 宿題です。章のケース問題の問1、四肢択一を出します。ある市の担当者が、AIに、Sentinel-2で農地の区画ごとに6月のNDVIの平均を出して、雲は除いて、と頼みました。AIの説明と擬似コードが、画面のものです。比なので倍率は打ち消されます。反射率に直す手間は省きました。雲の画素は、除いたあと0にしてから平均しています。できた表では、森の区画が0.45、裸地の区画が0.08。雲が多かった北側の区画は、どれも0.1前後でした。この結果から、最初に疑うべきことはどれでしょうか。A、近赤外にB8ではなくB8Aを使うべきで、帯域の取り違えで森の値が低い。B、ずらし、つまりBOA_ADD_OFFSETを直さずに割り算し、除いた画素を0にして平均に入れている。C、除く分類の番号が違い、植物の画素を除いて雲を残している。D、6月は葉が茂りきって値が頭打ちになり、森と裸地の差が出ない。表の数字と、コードの各行を、この動画の4つの観点で見比べて、考えてみてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。問2もそこにあります。

  - kind: cta
    heading: 宿題を解いたら、章のページへ
