# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第1部 第4章「衛星データの処理の段階と補正：Sentinel-2のLevel-1CとLevel-2Aを名前で選び、補正の前後で値を比べる」（learn/codex/codex-1-4-processing-levels.qmd）
title: 衛星データの処理段階：Sentinel-2の補正前後の値を比べ、誤り4つを見抜く
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 8
total: 30
thumb: 補正済みを確かめる
summary: AIが「Level-2Aは補正済みです」と言うとき、何が補正されていて、何が補正されていないのか。Sentinel-2のLevel-1C（大気上端の反射率）とLevel-2A（地表の反射率）、Landsatの段階と版ごとに違う倍率、レーダーのGRDに残る山の位置ずれを押さえたあと、ずらしの抜け、古い版の倍率、温度の帯の取り違え、地形の補正の抜けという4つの誤りを、AIが返したコードを一緒にレビューして見つけます。製品の名前と付属情報を手元で読む練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 処理の段階と補正：前後で値を比べる
    sub: 「補正済み」は、どの補正が済んでいるかの名前。同じ段階どうしで比べ、差を自分で見る
    say: AIが、Level-2Aは補正済みです、と言う。何が補正されていて、何が補正されていないのでしょうか。答えは、処理の段階は、どの補正が済んでいるかの名前である。段階ごとに倍率とずらしが違うので、同じ段階の製品どうしで比べ、補正の前後の差を自分で見る、です。段階の名前を確かめずに解析を始めると、大気の違いや山の位置ずれが、地表の変化として報告に混ざります。この動画では、処理の段階と2種類の補正のしくみを見たあと、AIが返したコードを一緒にレビューして、4つの誤りを見つけます。製品の名前と付属情報を手元で読む練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 処理の段階を名前で正しく選び、補正の前後で値がどう変わるかを確かめられる
      - 「大気上端の反射率」と「地表の反射率」の違い、段階ごとに違う倍率とずらし、かすみの除去と山の斜面の位置ずれという2種類の補正の意味が分かる
      - AIが「補正済みなので、そのまま使えます」と言う製品を、製品の名前と付属情報で確かめ、倍率の取り違えと地形の補正の抜けに気づける
    say: この章を終えると、3つのことができるようになります。1つ目、処理の段階を名前で正しく選び、補正の前後で値がどう変わるかを確かめられること。2つ目、大気上端の反射率と、地表の反射率の違い、段階ごとに違う倍率とずらし、そして、かすみの除去と、山の斜面の位置ずれという、2種類の補正の意味が分かること。3つ目、AIが、補正済みなので、そのまま使えます、と言う製品を、製品の名前と付属情報で確かめ、倍率の取り違えと、地形の補正の抜けに気づけることです。たとえば、去年はLevel-1C、今年はLevel-2Aで値を出したとき、その差が本当に地表の変化なのかを、自分で判断できるようになります。

  - kind: figure
    heading: しくみ：Sentinel-2の段階
    image: figures/codex-1-4-processing-levels/levels.svg
    say: まず、しくみです。衛星のデータは、生のままでは使えません。いくつかの補正を順に加えた段階があり、段階ごとに名前が付いています。名前は、どの補正までが済んでいるかを表します。図は、光学衛星Sentinel-2の段階です。左のLevel-1Bは、センサーの幾何のままの放射輝度で、専門家に求めに応じて配られるものです。利用者が普通に使うのは、真ん中の2つです。Level-1Cは、大気上端の反射率です。標高のデータを使って地図の座標に投影され、110km四方の区画で配られます。ただし、大気の影響は、まだ入ったままです。Level-2Aは、Level-1Cから大気の影響を補正した、地表の反射率です。画素ごとの分類、かすみの量、水蒸気の量、雲のマスクが付きます。そして、右のオレンジが人の仕事、補正の前後を比べることです。ここで大事なのが、段階ごとの倍率とずらしです。Level-1Cの反射率は、画素の値にRADIO_ADD_OFFSETを足して、QUANTIFICATION_VALUEで割ります。Level-2Aは、BOA_ADD_OFFSETを足して、同じく倍率で割ります。倍率は10000が既定で、ずらしは、処理の版04.00、2022年1月25日からの運用、以降の製品に付きます。値は、製品の付属情報に書いてあります。画素の値0は、欠けた値です。

  - kind: table
    heading: Landsatの段階と倍率
    columns: [製品, 反射率や温度に直す決まり, 欠けた値]
    widths: [0.34, 0.48, 0.18]
    rows:
      - [Level-1（L1TP、L1GT、L1GS）, 付属情報のMULTとADDで大気上端の反射率に。太陽の高度の正弦で割る, ""]
      - [Collection 2 Level-2 地表の反射率, 画素の値×0.0000275−0.2, "0"]
      - [Collection 2 Level-2 地表の温度, 画素の値×0.00341802＋149, "0"]
      - [Collection 1 地表の反射率（古い版）, 画素の値×0.0001。ずらしなし, "−9999"]
    say: 無償のLandsatは、名前の付け方が違います。Level-1には3つあります。地上の基準点と標高のデータで補正したL1TPが最も高い段階で、標高のデータだけで補正したL1GT、位置の精度が足りず地形の補正ができなかったL1GSがあります。Level-1の画素の値は、付属情報のREFLECTANCE_MULT_BAND_xとREFLECTANCE_ADD_BAND_xで、大気上端の反射率に直します。この値は太陽の角度の補正が入っていないので、太陽の高度の正弦で割って直します。表の2行目と3行目が、Collection 2のLevel-2です。地表の反射率は、画素の値掛ける0.0000275、引く0.2。地表の温度は、画素の値掛ける0.00341802、足す149。欠けた値はどちらも0です。同じ製品でも、反射率と温度で倍率が違います。4行目は、古いCollection 1の地表の反射率です。掛ける0.0001で、ずらしがなく、欠けた値はマイナス9999でした。つまり、段階と版の組み合わせごとに、倍率が全部違う、ということです。

  - kind: figure
    heading: 2種類の補正：値か、場所か
    image: figures/codex-1-4-processing-levels/corrections.svg
    say: 補正には、大きく2種類あります。図の左が、大気の補正です。大気は、青のような短い波長の光を、赤のような長い波長より多く散乱します。かすみや薄い雲も、地表からの光に重なります。Sentinel-2のLevel-2Aは、放射伝達の計算表を使って大気の影響を除きます。LandsatのLevel-2も、エアロゾルの散乱と薄い雲の影響を考慮して、地表の反射率を出します。この補正は、値を変えますが、画素の場所は変えません。図の右が、地形の補正です。衛星は斜めから地表を見るので、山の斜面は、本来の場所からずれて写ります。Sentinel-2のLevel-1Cは、30mの標高のデータを使って、地図の座標に投影済みです。LandsatのL1TPとL1GTも、標高のデータで地形による位置ずれを直しています。標高のデータなしには、地形の影響は直せません。ここで、レーダー衛星Sentinel-1のGRDです。GRDは、地球の楕円モデルに投影しただけで、標高は付属情報の定数を使います。斜面は幾何学的にゆがみ、山が衛星の側に倒れて見えます。つまり、GRDは、地図に載っているように見えても、山の斜面の位置ずれは残ったままです。地形の補正は、画素の場所を変える補正です。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [補正済みの画像を使って, Level-2Aを使い、製品の名前の処理の版と、付属情報のずらしと倍率を表示して]
      - [Landsatを反射率にして, Collection 2 Level-2の地表の反射率を、×0.0000275−0.2で直して。温度の帯には別の倍率を使って]
      - [レーダーを光学に重ねて, GRDに標高のデータで地形の補正をしてから、Level-2Aと同じ座標系と画素の大きさにそろえて重ねて]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。補正済みの画像を使って、とだけ頼むと、AIはLevel-1Cを、補正済み、地図に投影済み、と解釈することがあります。地図への投影は済んでいても、大気の補正は済んでいません。代わりに、Level-2Aを使い、製品の名前の処理の版と、付属情報のBOA_ADD_OFFSETとQUANTIFICATION_VALUEを表示して、と頼みます。Landsatを反射率にして、ではなく、Collection 2 Level-2の地表の反射率を、掛ける0.0000275、引く0.2で直して。温度の帯には別の倍率を使って。レーダーを光学に重ねて、ではなく、GRDに標高のデータで地形の補正をしてから、Level-2Aと同じ座標系と画素の大きさにそろえて重ねて。どの補正を指すのかを、段階の名前で言うのがこつです。指示の7項目のうち、確かめ方には、2つの製品の処理の版と、読んだずらしと倍率を並べて表示させること、差が全部の波長帯で同じ量ならその旨を表示させること、反射率に直す前の画素の値の最小と最大も表示させることを書きます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 補正の前後で値を比べ、レーダーを重ねる（誤りあり）
      l1c = read_band(open_product("<L1C製品>"), "B2") / 10000      # 大気上端の反射率
      l2a = read_band(open_product("<L2A製品>"), "B2") / 10000      # 地表の反射率
      print("青の差の中央値:", median(l1c - l2a))
      sr  = read_band(open_product("<Landsat L2>"), "SR_B2") * 0.0001   # 地表の反射率
      st  = read_band(open_product("<Landsat L2>"), "ST_B10") * 0.0001  # 地表の温度
      grd = read_band(open_product("<Sentinel-1 GRD>"), "VV")
      show_overlay(l2a, grd)                                   # GRDは地上に投影済み
    highlight: [2, 3, 5, 6, 8]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。Level-1CもLevel-2Aも10000で割れば反射率です。Landsatの地表の反射率は0.0001を掛けるのが標準で、温度の帯も同じ倍率です。GRDは地上に投影済み、ジオコーディング済みなので、地形の補正は不要で、そのまま光学に重ねられます。自信のある口調です。画面がそのコードです。当てる観点は5つ。1、段階の名前が、製品の名前と一致しているか。2、倍率とずらしを、段階と版に合わせて付属情報から読んでいるか。3、比べる2つの製品が、同じ段階か。4、レーダーのGRDに地形の補正をしているか。5、欠けた値を、段階ごとの印で除いているか。まず、2行目と3行目を見てください。どちらも、10000で割るだけです。ずらしを足す行がありません。次に、5行目。Landsatの地表の反射率に、0.0001を掛けています。6行目。温度の帯にも、同じ0.0001です。最後に、8行目。GRDを、そのまま光学に重ねています。ここで1つ、大事なことがあります。このコードは、動かしても止まりません。差の表も、重ねた地図も出ます。だから、動いたかどうかでは、誤りに気づけません。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.10, 0.14, 0.36, 0.38]
    rows:
      - ["2〜3", 値の倍率, 10000で割るだけ。「10000で割れば反射率」, 版04.00以降はずらしがある。付属情報からずらしと倍率を読み、画素の値0を除いてから直す]
      - ["5", 値の倍率, ×0.0001。「0.0001が標準」, Collection 1の倍率。Collection 2のLevel-2は×0.0000275−0.2。欠けた値0を先に除く]
      - ["6", 値の倍率, 温度の帯も×0.0001。「温度の帯も同じ倍率」, 温度は×0.00341802＋149。同じ製品でも帯の種類で倍率が違う]
      - ["8", 位置と座標, GRDをそのまま重ねる。「投影済みだから補正は不要」, 楕円モデルに投影しただけ。標高のデータで地形の補正をしてから、座標系と画素の大きさをそろえて重ねる]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、2行目と3行目。ずらしを足していません。処理の版04.00以降は、Level-1CはRADIO_ADD_OFFSET、Level-2AはBOA_ADD_OFFSETを足してから、倍率で割ります。2つの製品の版が違えば、ずらしの有無も違い、差が全部の波長帯で一律にずれます。正しくは、それぞれの付属情報からずらしと倍率を読み、画素の値0を除いてから直します。2つ目、5行目。0.0001は、古いCollection 1の倍率です。Collection 2のLevel-2の地表の反射率は、掛ける0.0000275、引く0.2です。AIの、0.0001が標準、は、古い版の決まりです。3つ目、6行目。地表の温度の帯に、反射率の倍率を使っています。温度は、掛ける0.00341802、足す149です。同じ製品でも、帯の種類で倍率が違います。4つ目、8行目。GRDは楕円モデルに投影しただけで、山の斜面の位置ずれは残っています。AIの、投影済みだから補正は不要、は、地図への投影と地形の補正を混同しています。正しくは、標高のデータで地形の補正をしてから、Level-2Aと座標系と画素の大きさをそろえて重ねます。この4つは、動かしても止まりません。1つ目で差に一律のずれが乗り、2つ目と3つ目で値の桁が狂い、4つ目で、山の尾根が光学とレーダーで別の場所に出ます。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：製品の名前を読む
    items:
      - 製品の名前の「MSIL1C」か「MSIL2A」を見る。L1Cなら大気上端、L2Aなら地表の反射率
      - 名前の「N」に続く4桁が処理の版。04.00（2022年1月25日運用開始）以降なら、ずらしがある
      - 付属情報のProduct_Image_Characteristicsで、倍率（既定10000）とずらしを読む。L1CはRADIO_ADD_OFFSET、L2AはBOA_ADD_OFFSET
      - 画素の値0は欠けた値。除いてから、（画素の値＋ずらし）÷倍率で反射率にする
      - 比べる2つの製品で、段階と版と、読んだ値を並べて書く。段階が違えば、比べない
    say: 判定の1つ目を、手元でやってみます。Sentinel-2の製品を1つ、手元で開ける人は、名前と付属情報を見ながら、数分でできます。まず、製品の名前を見ます。名前の中に、MSIL1C、か、MSIL2A、という文字があります。L1Cなら、大気上端の反射率。L2Aなら、地表の反射率です。コードの注釈に、地表の反射率、と書いてあっても、開いている製品がL1Cなら、大気上端の反射率です。次に、同じ名前の、Nに続く4桁の数字を見ます。これが処理の版です。04.00、2022年1月25日からの運用、以降なら、ずらしがあります。3つ目、付属情報のGeneral_Info、Product_Image_Characteristicsを開きます。そこに、QUANTIFICATION_VALUE、既定は10000、と、L1CならRADIO_ADD_OFFSET、L2AならBOA_ADD_OFFSETが書いてあります。この値を書き写します。4つ目、画素の値0は欠けた値です。先に除いてから、画素の値にずらしを足して、倍率で割ります。最後に、比べる2つの製品で、段階と版と、読んだ値を、横に並べて書きます。段階が違えば、その2つは比べません。どちらかにそろえ直すまで、差は大気の補正の量であって、地表の変化ではないからです。この並べた表を、AIに頼むときの、確かめ方の項目に、そのまま使います。

  - kind: bullets
    heading: 結果の目視観点：5つ
    items:
      - 差が、波長帯によって違うか。青の差が赤や近赤外より大きいのが自然。全部同じ量なら、ずらしの違いを疑う
      - 差が、かすみの量（AOT）の地図と合っているか。合わなければ、2つの製品の日付か区画が違う
      - 湖の近赤外が、補正後に0に近いか。わずかな負の値は、ずらしを足した結果としてありえる
      - 山の影の斜面が、補正後に青っぽく、おかしな値になっていないか
      - レーダーの尾根の線が、光学の尾根の線と重なっているか。ずれていれば、地形の補正が抜けている
    say: 直したら、補正の前後の差の表と、重ねた地図を、目で確かめます。見るのは5つ。1つ目、差が、波長帯によって違うか。大気は短い波長を多く散乱するので、青の差が、赤や近赤外の差より大きいのが自然です。全部の波長帯で同じ量の差なら、ずらしの違いを疑います。2つ目、差が、かすみの量の地図と合っているか。かすみの多い場所で差が大きいのが自然です。合っていなければ、2つの製品の日付か区画が違います。3つ目、湖の近赤外が、補正後に0に近いか。水は近赤外を吸収するので、補正後の値は低くなります。補正後に負の値がわずかに出るのは、ずらしを足した結果としてありえます。4つ目、山の影の斜面が、補正後に青っぽく、おかしな値になっていないか。Level-2Aでは、影の部分に強い地形の補正がかかり、青っぽい色と不正確な反射率になることがあります。5つ目、レーダーの尾根の線が、光学の尾根の線と重なっているか。ずれていれば、地形の補正が抜けています。おかしな結果の例を2つ。例1、去年と今年で、森も湖も裸地も、全部の波長帯が同じだけ低くなった。場所にも波長帯にもよらない一律の差は、地表の変化では説明がつきません。段階が違うか、片方だけ版04.00以降でずらしが付いているかです。例2、レーダーの明るい線が、光学の山の尾根から、数百m衛星の側にずれて並ぶ。GRDをそのまま重ねています。平野では目立たず、山で初めて見つかる誤りです。言えるのは、この製品は名前のとおりの段階で、倍率とずらしを付属情報どおりに当てた、ことと、差が補正の性質と矛盾しない、ことです。言えないのは、補正が正しい、ことです。段階の名前は、どの補正を試みたか、であって、補正が合っている保証ではありません。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 段階の違う製品を、どうしても混ぜて比べたいとき。差は大気の補正そのもの。どちらかにそろえ直すまで比べられない
      - 雲の下や、影の深い谷の値を使いたいとき。雲の画素には地形の補正がかからず、影の斜面では補正が強すぎることがある。画素ごとの分類で除く
      - レーダーのGRDを、山地でそのまま使いたいとき。地形の補正なしでは、斜面の位置と明るさが本来と違う
      - 有償の商用データ。段階の名前、倍率とずらし、どの補正が済んでいるかは契約の仕様書で決まる。仕様書と突き合わせる
    say: 向かない条件も、押さえておきます。1つ目、段階の違う製品を、どうしても混ぜて比べたいとき。Level-1CとLevel-2Aの差は、大気の補正そのものです。どちらかに片方をそろえ直すまで、比べられません。2つ目、雲の下や、影の深い谷の値を使いたいとき。Level-2Aは、雲とされた画素に地形の補正をかけず、影の斜面では補正が強すぎることがあります。画素ごとの分類で、雲と影を除いてから使います。3つ目、レーダーのGRDを、山地でそのまま使いたいとき。地形の補正なしでは、斜面の位置と明るさが本来と違います。標高のデータを使った地形の補正を、解析の前に入れます。4つ目、有償の商用データを使うとき。考え方は同じですが、段階の名前、倍率とずらし、どの補正が済んでいるかは、契約の仕様書で決まります。公式の表の代わりに、仕様書と突き合わせます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 問いに合う段階を名前で決める。地表の値を比べるならLevel-2A、Collection 2 Level-2。レーダーはGRDに地形の補正を加える（人）
      - 製品の名前と付属情報から、段階と版、倍率とずらしを表に読ませる（AI）
      - 同じ日、同じ区画の補正前と補正後を、同じ決まりで反射率に直させる（AI）
      - 補正の前後の差を、波長帯ごとと、森・湖・裸地の場所ごとに出させる（AI）
      - 差の向きと大きさが、補正の種類と合っているかを、かすみの量の地図と見比べて判定する（人）
    say: 手順をまとめます。1、問いに合う段階を、名前で決める。地表の値を比べたいなら、Sentinel-2はLevel-2A、LandsatはCollection 2のLevel-2。レーダーは、GRDに地形の補正を加えます。人です。2、製品の名前と付属情報から、段階と版、倍率とずらしを、表に読ませる。AIです。3、同じ日、同じ区画の補正前と補正後を、同じ決まりで反射率に直させる。使った倍率とずらしも表示させます。AIです。4、補正の前後の差を、波長帯ごとと、森、湖、裸地の場所ごとに出させる。AIです。5、差の向きと大きさが、補正の種類と合っているかを見る。かすみの量の地図と見比べて、差は大気の補正で説明できる、差が一律でずらしの違いを疑う、場所がずれていて地形の補正が要る、のどれかを判定します。人です。この5つを、画像の値を使う解析の前に、毎回繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      場所   波長帯        2021年   2025年   差
      森     B2（青）      0.024    0.124   +0.100
      森     B4（赤）      0.031    0.131   +0.100
      森     B8（近赤外）  0.312    0.412   +0.100
      湖     B8（近赤外）  0.018    0.118   +0.100

      last = read_band(open_product("S2A_MSIL1C_2021...N0301..."), b) / 10000
      this = read_band(open_product("S2C_MSIL2A_2025...N0511..."), b) / 10000
      AIの説明：「どちらも反射率に直してあります。森の赤が明るくなっているので、
                 植生が減った可能性があります」

      問い：この結果から最初に疑うべきことはどれか
      A. 森の赤が0.1も上がっているので、植生の減少は本当である
      B. 2021年と2025年で段階が違ううえ、差が場所にも波長帯にもよらず一律で、
         処理の段階とずらしの扱いがそろっていない
      C. 湖の近赤外が0.018と低すぎるので、2021年の画像は欠けた値が混ざっている
      D. 2021年がSentinel-2A、2025年がSentinel-2Cと衛星が違うので、比べられない
    highlight: [2, 3, 4, 5, 7, 8]
    say: 宿題です。章のケース問題の問1を出します。ある県の担当者が、AIに、2021年と2025年の5月の画像で、森の反射率がどう変わったかを出して、と頼みました。AIが返した表とコードの抜粋が、画面のものです。森の青、赤、近赤外、そして湖の近赤外、どれも差はプラス0.100。コードは、2021年の製品も2025年の製品も、10000で割るだけです。AIの説明は、どちらも反射率に直してあります。森の赤が明るくなっているので、植生が減った可能性があります、でした。この結果から、最初に疑うべきことはどれでしょうか。A、森の赤が0.1も上がっているので、植生の減少は本当である。B、2021年と2025年で段階が違ううえ、差が場所にも波長帯にもよらず一律で、処理の段階とずらしの扱いがそろっていない。C、湖の近赤外が0.018と低すぎるので、2021年の画像は欠けた値が混ざっている。D、2021年がSentinel-2A、2025年がSentinel-2Cと衛星が違うので、比べられない。この動画でやった、製品の名前の読み方と、差の表の見方を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。山地でレーダーの画像を光学に重ねたら尾根が数百mずれた、という場面で、AIの説明の問題点と正しい手順を2行で書く、問2の短答も、そこにあります。

