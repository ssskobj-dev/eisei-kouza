# English market-report video (overseas). Theme: forests & carbon, angle: players (who sells, who analyses, who buys).
# Facts verified against the primary sources listed in the closing credits. Numbers not verified were left out.
lang: en
voice: Ryan
title: Forest carbon from space - who sells it, who verifies it, who buys it
series: MARKET
kicker: Market report
thumb: Forest carbon players
summary: A plain map of the players in satellite forest and carbon monitoring - who provides the data, who turns it into carbon numbers, who sets the rules and grades the quality, and who pays. Company names are given only as documented examples, not recommendations. Figures are from Verra, NASA, ESA, Planet and WRI, with the source stated for each. About 6 minutes.
scenes:
  - kind: cover
    heading: Forest carbon from space - who sells it, who verifies it, who buys it?
    sub: Four roles, and how they connect
    say: Who are the players in satellite forest and carbon monitoring - and how do they fit together? It helps to picture four roles. Some organisations provide the raw satellite data. Others turn that data into carbon numbers. A third group sets the rules and grades the quality of a carbon credit. And a fourth group pays for the answer. In this report we walk through each role, name a few documented examples - not recommendations - and show how they connect, so you can tell a client exactly which kind of player they actually need.

  - kind: bullets
    heading: What this report covers
    items:
      - "Who provides the data - free public satellites and commercial ones"
      - "Who turns the data into carbon numbers - analytics and MRV"
      - "Who sets the rules and grades quality - registries and rating agencies"
      - "Who buys - and how the whole chain connects"
    say: Here is what this report covers. First, who provides the data - the free public satellites and the commercial ones on top. Second, who turns that data into carbon numbers - the analytics and measurement-reporting-and-verification groups, usually shortened to M-R-V. Third, who sets the rules and grades the quality - the carbon-crediting standards and the independent rating agencies. And fourth, who actually buys, and how the whole chain connects from a pixel to a decision.

  - kind: bullets
    heading: Who provides the data
    items:
      - "Free optical data - NASA and USGS Landsat, and ESA's Sentinel-2"
      - "NASA's GEDI lidar on the ISS - forest height and biomass"
      - "ESA's Biomass - first space P-band radar to weigh forest carbon"
      - "Commercial data on top - Planet and Airbus optical and radar"
    say: Start with who provides the data. A surprising amount of it is free and public. The workhorses for forest loss are Landsat, run by NASA and the US Geological Survey, and Sentinel-2, run by the European Space Agency under Copernicus - both open optical imagery. For the three-dimensional side, NASA's GEDI is a laser instrument on the International Space Station, flying since December twenty eighteen, that measures forest height, structure and the carbon stored in woody biomass. And ESA's Biomass satellite, launched in April twenty twenty-five, is the first in space to use long-wavelength P-band radar, designed to see through the canopy and weigh the wood beneath. On top of all this, commercial providers such as Planet and Airbus sell higher-resolution optical and radar imagery. The base layer is largely free; you pay for resolution, frequency, and for someone to turn it into an answer.

  - kind: bullets
    heading: Who turns the data into carbon numbers
    items:
      - "Analytics and MRV groups turn pixels into carbon estimates"
      - "Non-profit example - CTrees, led by a NASA-JPL scientist"
      - "Commercial example - Planet's Forest Carbon Diligence layer"
      - "Global Forest Watch maps forest loss, free, for anyone"
    say: The second role is turning raw pixels into carbon numbers - the analytics and M-R-V layer. These are the groups that estimate how much carbon a forest holds, and how it changes, from the satellite data. One documented example is CTrees, a non-profit led by a senior scientist from NASA's Jet Propulsion Laboratory, which uses artificial intelligence and satellite data to track carbon in forests worldwide, funded by philanthropy. A commercial example is Planet's Forest Carbon Diligence, a product that reports canopy height, canopy cover and aboveground carbon density, globally, at about thirty-metre resolution, one value per year back to twenty thirteen. And alongside the paid products sits Global Forest Watch, run by the World Resources Institute, which maps forest loss for free, for anyone. Again - these are examples of the role, not endorsements.

  - kind: bullets
    heading: Who sets the rules, and who grades quality
    items:
      - "Standards set methods and issue credits - Verra's VCS leads"
      - "Verra reports 1.3bn+ credits, 4,254+ projects, 134 countries"
      - "Rating agencies grade credit quality - e.g. Sylvera, BeZero"
      - "Ratings exist because issuance is not proof of real impact"
    say: The third role is the one newcomers miss - who sets the rules, and who grades the quality. Carbon-crediting standards define the methods a project must follow and issue the credits themselves. The most widely used is the Verified Carbon Standard, run by the non-profit Verra, founded in two thousand seven. Verra reports that its program has issued more than one point three billion carbon credits, across more than four thousand two hundred active projects, in one hundred thirty-four countries. But issuing a credit is not the same as proving it did any good. That is why a separate group exists - independent rating agencies, such as Sylvera and BeZero, which score the quality of individual credits with letter grades, roughly triple-A down to D, using satellite, radar and lidar data among other evidence. The ratings exist precisely because quality varies a great deal.

  - kind: bullets
    heading: Who is buying
    items:
      - "Governments - monitoring for REDD+ and deforestation reporting"
      - "Carbon project developers and registries - credit MRV"
      - "EU importers - geolocated proof under the EUDR"
      - "Traders, banks and insurers - supply-chain and project risk"
    say: The fourth role is the buyer - who actually pays. Four groups dominate. First, national governments, which run forest monitoring to report deforestation and to support REDD+, the United Nations framework for paying to reduce forest loss. Second, carbon project developers and the registries that certify credits, which need regular measurement and verification. Third, companies importing into the European Union, which - under the EU Deforestation Regulation - must attach geolocated proof that commodities like soy, beef, cocoa, coffee, palm oil, rubber and wood are not linked to recent deforestation. And fourth, commodity traders, banks and insurers, which use the same data to check the risk in a supply chain or a project. Government and compliance demand is the base today; companies buying for their own targets are the growth bet.

  - kind: table
    heading: How the roles connect
    columns: [The role, What it hands to the next step]
    widths: [0.42, 0.58]
    rows:
      - ["Data providers", "Imagery and biomass layers - mostly free, some commercial"]
      - ["Analytics / MRV", "Carbon estimates and change maps from that data"]
      - ["Standards / registries", "Methods, verification, and issued tradable credits"]
      - ["Rating agencies", "An independent quality score on those credits"]
      - ["Buyers", "Pay for the answer - to comply, report or offset"]
    say: Here is how the roles connect, top to bottom. Data providers hand over imagery and biomass layers - mostly free, some commercial. The analytics and M-R-V groups turn that into carbon estimates and change maps. The standards and registries wrap those estimates in an approved method, verify them, and issue a tradable credit. The rating agencies then put an independent quality score on that credit. And at the end, the buyers pay for the answer - to comply with a rule, to report to a government, or to offset their own emissions. One organisation can play more than one of these roles, so when you read a company's own description, ask which step it really owns.

  - kind: table
    heading: How to read the numbers
    columns: [What the number is, What it does not mean]
    widths: [0.5, 0.5]
    rows:
      - ["Landsat & Sentinel-2 are free", "A verified carbon answer still needs analysis and ground work"]
      - ["Verra: 1.3bn credits issued", "Total ever issued, not what's in use now, nor proof of impact"]
      - ["A rating such as triple-A", "One agency's opinion, not a guarantee; agencies can disagree"]
      - ["Satellites weigh forests", "Broad estimates with uncertainty, not plot-level legal proof"]
    say: Now, how to read the numbers behind these players without overselling them. Landsat and Sentinel-2 data is free, but a carbon answer a regulator or auditor will accept still needs analysis and ground checks - free data is not a free result. Verra's one point three billion credits is the total ever issued over the program's life, not the number in use today, and issuance is not proof that the climate benefit was real. A rating such as triple-A is one agency's considered opinion, not a guarantee - and two agencies can score the same credit differently. And when a satellite is said to weigh a forest, that is a broad, wall-to-wall estimate with real uncertainty, not a plot-level legal proof. Read each claim with its boundary, and you will not oversell it.

  - kind: bullets
    heading: What a consultant should take from this
    items:
      - "Name the role you need - data, analytics, a registry, or a rating"
      - "Free public data is cheap; the audit-ready answer is the paid work"
      - "A satellite estimate alone won't carry a credit - add ground truth"
      - "Don't tie a proposal to one vendor - the market keeps reshuffling"
      - "In Japan it's per project - lead with the decision and the rule"
    say: So what should a consultant take from this? First, name the role your client actually needs - raw data, analytics, a registry and method, or an independent rating. They are four different purchases with four different suppliers. Second, remember that free public data lowers the cost of the data itself, but the audit-ready answer is the work that costs money. Third, a satellite estimate on its own will not carry a carbon credit - pair it with independent ratings and with ground truth from the field. Fourth, do not tie a proposal to a single named vendor; this market reshuffles constantly through acquisitions and rebrands, so write the requirement, not the brand. And finally, in Japan this kind of monitoring is usually commissioned project by project rather than run as a public service, so lead with the decision and the rule it answers - the EU regulation, or REDD+ - not with the company logo.

