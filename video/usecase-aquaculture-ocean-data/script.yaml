# ユースケース解説動画の台本。元の記事：casebook/aquaculture-ocean-data.qmd
title: 衛星データで養殖の給餌と出荷を決める：20か国以上で使われる海の地図
series: CASEBOOK
kicker: ユースケース解説
number: 15
total: 221
thumb: 海の地図で決める
summary: 魚や貝の養殖事業者が、衛星と海洋モデルから作られる水温やクロロフィルの日次地図を見て、給餌と出荷の時期を決める事例。業務のどこに入れ、何を決める材料になるか、元データの格子の粗さから来る限界、無料の公的データと有料サービスの分け方までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで養殖の給餌と出荷を決める
    sub: 毎日の海の地図を、現場の計測と組み合わせる
    say: 湾の外から近づく高水温や赤潮を、現場に測定器を下ろさずに知る方法はあるか。答えは、衛星と海洋モデルから作られる、毎日更新の海の地図を見ることです。欧州の公的な海洋データを元にした養殖向けのサービスが、2022年の時点で20か国以上で使われています。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。限界はどこにあり、無料の元データと有料のサービスをどう分けて考えるかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本、オーストラリアなど。欧州の公的データを元に、世界で提供
      - 誰が：魚類、貝類、海藻の養殖事業者
      - 何のために：高水温や赤潮の被害を避け、給餌と出荷の時期を決める
      - 困りごと：測定器で測れるのは自分のいけすの周りだけ。湾の外の変化が分からない
    say: 事例の舞台は、欧州連合の海洋監視サービス、コペルニクス・マリンのデータを元にした、養殖向けのサービスです。使うのは、魚類、貝類、海藻の養殖事業者です。目的は、高水温や赤潮の被害を避けて、給餌と出荷の時期を決めることです。従来は、現場で測定器を海に下ろして水温や溶存酸素を測り、日報に書き写してきました。測れるのは自分のいけすの周りだけで、湾の外から何が近づいているかは分かりません。そこで、広い範囲を毎日更新する海の地図を、現場の計測と組み合わせています。利用者の例として、愛媛県宇和島市の真鯛の養殖事業者と、南オーストラリア州の牡蠣の養殖事業者が挙げられています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-aquaculture-ocean-data/flow.svg
    caption: 毎朝の判断の前に、海の地図を見る手順を入れる
    say: 業務の流れを見ます。入る位置は、毎朝の給餌と出荷の判断の前です。まず朝に、広い範囲の水温とクロロフィルの地図と、48時間先までの予測を見ます。次に、自分のいけすで水温と溶存酸素を測ります。表層と、いけすの底に近い深さの両方です。そして、地図の値と現場の値のずれを、日報に一緒に記録します。高水温やクロロフィルの上昇が近づいていれば、給餌を減らす、出荷を前倒しする、といった判断をします。数か月分のずれの記録から、この地図の値が何度なら、うちのいけすは何度、という補正の目安を作ります。つまり、地図は測定器の代わりではなく、注意する日と変化の向きを知る道具です。

  - kind: figure
    heading: 衛星と海洋モデルに任せることと、人が行うこと
    image: figures/usecase-aquaculture-ocean-data/split.svg
    say: 役割の分担はこうなります。衛星と海洋モデルが行うのは、広い範囲の水温やクロロフィルを毎日地図にすることと、48時間先までの変化を予測することです。養殖事業者が行うのは、自分のいけすの水温や溶存酸素を現場で測ること、給餌量と出荷の時期を決めること、そして日報に記録することです。宇和島の養殖事業者の声として語られているのは、従来は測定器で個別に測って転記していた水温、溶存酸素、塩分を、画面の値を見て日報に記載するようになった、ということです。実証ではなく、商用のサービスとして世界で使われている事例です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [水温やクロロフィルなど5項目の日次地図, 広い範囲の変化の向き、注意する日]
      - [48時間先までの予測, 給餌量の調整、出荷の前倒し、作業船を出す日]
      - [過去の推移（過去2年分まで）, 去年の同じ時期との比較、種付けや収穫の時期]
      - [現場の計測値とのずれの記録, 自分の養殖場の補正の目安。続けるかの判断]
    say: 受け取るデータと、それで決められることを整理します。水温、塩分、溶存酸素、クロロフィル、波高の日次地図は、広い範囲の変化の向きと、注意する日を知る材料になります。48時間先までの予測は、給餌量の調整、出荷の前倒し、作業船を出す日を決める材料です。過去2年分までの推移は、去年の同じ時期との比較や、種付けと収穫の時期に使えます。そして、現場の計測値とのずれの記録が、自分の養殖場の補正の目安と、サービスを続けるかの判断材料になります。地図が決めるのは、注意する日と変化の向きです。給餌量と出荷の判断は、現場の値と魚の様子を見た事業者が決めます。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-aquaculture-ocean-data/limits.svg
    say: 限界を5つ挙げます。1つ目、湾の奥や、いけす1基ごとの差は出ません。元データの海洋モデルの格子は12分の1度と4分の1度で、緯度1度を約111キロとすると、約9キロと約28キロの格子になります。同じ格子の中の養殖場は、同じ値になります。2つ目、塩分と溶存酸素は、海洋モデルの推定値です。衛星が直接測れるのは、海面の水温と海色です。3つ目、クロロフィルの元になる海色の観測は光学の衛星なので、雲の下は欠けます。4つ目、分かるのは表層の海で、いけすの深さごとの差は現場で測ります。5つ目、給餌量や被害額がどれだけ変わったか、という公表された効果の数字はありません。

  - kind: bullets
    heading: 無料の元データで、どこまでできるか
    items:
      - 元データのコペルニクス・マリンは、商用でも無料（出典の表示が条件）。少なくとも2028年6月30日まで
      - 元は5つの製品：海洋物理モデル（格子は1/12度と1/4度）、波浪モデル、生物地球化学モデル、衛星の海色観測
      - 広い範囲の水温やクロロフィルの変化の向きは、この元データから読める
      - 格子が粗いので、いけす1基ごとの値は出ない。現場の計測はなくならない
    say: では、無料の元データでどこまでできるでしょうか。元データの、コペルニクス・マリンは、商用かどうかを問わず無料で、出典の表示を条件に使えます。無料の提供は、少なくとも2028年6月30日までの計画として示されています。この事例が元データに挙げているのは、全球の海洋物理モデル、波浪モデル、生物地球化学モデル、衛星の海色観測の5つの製品です。広い範囲の水温やクロロフィルの変化の向きは、この元データから読めます。一方で、格子が粗いので、いけす1基ごとの値は出ません。現場の計測は、なくなりません。元データが無料で広く使えるため、同じ海洋データを使った別のサービスも作れます。

  - kind: table
    heading: 費用の考え方（金額は非公開）
    columns: [項目, 考え方]
    widths: [0.3, 0.7]
    rows:
      - [元データ, 無料。公的なデータを、出典の表示の条件を守って使う]
      - [サービスの利用料, 基本は無料。予測と過去のデータは有料（金額は非公開）]
      - [現場の計測器, なくならない。地図の値を補正する相手として要る]
      - [データを読む時間, 毎朝の確認と、ずれの記録。日報の作業に組み込む]
    say: 費用の考え方です。この事例には、有料の購読の金額が公開資料にありません。そのため、概算の金額は出さず、4つの項目に分けて考えます。1つ目、元データは無料です。公的なデータを、出典の表示の条件を守って使います。2つ目、サービスの利用料です。2020年の提供開始時点では、基本の機能は無料で、予測と過去のデータの閲覧が有料の購読でした。金額は公開されていません。2026年時点の料金の体系も、確かめていません。なお、愛媛県の2022年度の事業では、県のブイの観測データを同じ画面で見られるようにし、県内の養殖事業者は無料で使える形がとられました。3つ目、現場の計測器はなくなりません。4つ目、毎朝の確認とずれの記録の時間を、日報の作業に組み込みます。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [養殖場の位置, 外洋に開けた海域、湾の入口, 湾の奥、入り組んだ地形]
      - [知りたいこと, 高水温や赤潮が近づく向きと時期, いけす1基ごとの値、水深ごとの差]
      - [現場の計測, 続けていて、地図と比べられる, 計測をやめて地図だけで済ませたい]
      - [判断の種類, 給餌量の調整、出荷の前倒し, 保険や補償の根拠となる値]
      - [地域のデータ, 県のブイや試験場の観測が重ねられる, 周辺に観測点がない]
    say: 最後に、向き不向きです。向いているのは、外洋に開けた海域や湾の入口にある養殖場で、知りたいことが、高水温や赤潮が近づく向きと時期であることです。現場の計測を続けていて、地図と比べられることも条件です。逆に、湾の奥や入り組んだ地形、いけす1基ごとの値や水深ごとの差を知りたい、計測をやめて地図だけで済ませたい、保険や補償の根拠となる値が欲しい、という場合は向きません。提案するときは、最初に養殖場の位置と湾の形を聞くこと、現場の計測がいらなくなるとは言わないこと、無料の元データと有料のサービスを分けて説明することが要点です。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：Copernicus Marine Service「UMITRON PULSE: high-resolution ocean data map for aquaculture farmers」（2020年9月）"
      - "出典：Fish Farming Expert「New 'eye in the sky' service for fish farmers」（2020年7月28日）"
      - "出典：ウミトロン「UMITRON PULSE のiOS版アプリをリリース」（2020年12月22日、ASCII.jp掲載）"
      - "出典：ウミトロン「プレシリーズBで総額12.2億円を調達」（2022年6月7日）、UMITRON プレスリリース（愛媛県の2022年度事業）"
      - "費用：Copernicus Marine Service ヘルプセンター「will it still be free in 2, 3 or 5 years?」（2026年10月21日閲覧）。有料の購読の金額は公開資料にない"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
