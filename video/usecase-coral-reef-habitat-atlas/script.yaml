# ユースケース解説動画の台本。元の記事：casebook/coral-reef-habitat-atlas.qmd
title: 衛星データの無料地図で海洋保護区の候補を絞る：サンゴ礁5m・精度60〜90%
series: CASEBOOK
kicker: ユースケース解説
number: 39
total: 221
thumb: 無料のサンゴ礁地図
summary: 海洋保護区を計画する政府やNGOが、衛星データから作られた無料のサンゴ礁の地図（Allen Coral Atlas）で、底質と地形の分布を把握し、潜水調査の地点を選ぶ事例。水深10mまで、精度60〜90%という限界と、無料でも費用がかかる所、商用で使うときの利用条件までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データの無料地図で、海洋保護区の候補を絞る
    sub: サンゴ礁の底質と地形を5mで、水深10mまで、精度60〜90%
    say: 潜水調査の乏しい海域で、サンゴ礁がどこにどれだけあるかを、先に知る方法はあるか。答えは、衛星データから作られた無料のサンゴ礁の地図を使うことです。世界の浅いサンゴ礁を5メートルの画素で地図にした、Allen Coral Atlasという共同事業があります。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。水深10メートルまで、精度60から90パーセントという限界と、無料なのにお金がかかる所はどこかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：世界の熱帯。北緯30度から南緯30度の浅いサンゴ礁
      - 誰が：海洋保護区を計画する政府の環境当局やNGO、沿岸の開発事業者
      - 何のために：対象の海域に、サンゴ礁がどこにどれだけあるかを把握する
      - 困りごと：潜水や船からの調査は費用と時間がかかり、調査の乏しい海域には分布図がない
    say: 事例の舞台は、北緯30度から南緯30度の、世界の熱帯の浅いサンゴ礁です。使うのは、海洋保護区を計画する政府の環境当局やNGO、それに沿岸の開発で環境への配慮を求められる事業者です。目的は、対象の海域にサンゴ礁がどこにどれだけあるかを把握することです。従来は潜水や船からの目視、航空写真の判読で調べてきましたが、費用と時間がかかります。調査の乏しい海域には、そもそも分布図がありません。国や地域で調べ方が違えば、隣の海域と比べることもできません。

  - kind: bullets
    heading: 事例：世界のサンゴ礁の地図
    items:
      - アリゾナ州立大学が運営。クイーンズランド大学、Planet社、ナショナルジオグラフィック協会が参加
      - 衛星：PlanetScope（画素3.125m）が主。水深と濁りはSentinel-2（10m）、足りない所はLandsat-8
      - 地図：底質6区分と、礁の地形11区分。5m画素、2018〜2020年の画像から
      - 世界の浅いサンゴ礁は348,361km²、うちサンゴの生息地は80,213km²（2024年の論文）
      - スリランカ政府が新しい海洋保護区の基礎に、モザンビーク政府が国の行動計画に利用
    say: 事例を見ます。Allen Coral Atlasは、アリゾナ州立大学が運営し、クイーンズランド大学、Planet社、ナショナルジオグラフィック協会が加わる共同事業です。衛星画像は、Planet社のPlanetScope、画素3.125メートルを主に使い、水深と濁りの推定には欧州のSentinel-2、足りない所は米国のLandsat-8を補っています。地図は2種類です。底質を6区分、礁の地形を11区分に分け、いずれも5メートルの画素で、2018年から2020年の画像から作られています。この地図をもとにした2024年の論文では、世界の浅いサンゴ礁は34万8,361平方キロ、そのうちサンゴの生息地は8万213平方キロと推計されています。利用の例として、スリランカ政府は新しく設定した海洋保護区の基礎に、モザンビーク政府は同国で初めてのサンゴ礁の国の行動計画に、この地図のデータを使いました。実証ではなく、公開された地図が各国の計画に使われている段階です。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-coral-reef-habitat-atlas/flow.svg
    caption: 潜水調査の地点を決める前に、地図で全体像をつかむ
    say: 業務の流れを見ます。環境コンサルタントが、海洋保護区の区域案の作成を支援する場面を想定した例です。入る位置は、潜水調査の地点を決める前です。まず、無料の登録をして、対象の海域の底質と地形の地図をダウンロードします。次に、海域ごとに、サンゴ・藻類、海草、砂などの面積と、礁斜面や礁原などの地形の面積を集計します。3つ目に、その地域の既存の現地データや写真があれば地図と照らし、どの区分が当てにならないかを確かめます。4つ目に、区分と地形の組み合わせごとに潜水調査の地点を選び、サンゴの被度と種を現地で調べます。最後に、区域案を複数作り、それぞれで保護される生息地の割合を示して、関係者と比べます。地図をそのまま区域案にしない所に、専門性が要ります。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-coral-reef-habitat-atlas/split.svg
    say: 役割の分担はこうなります。衛星と解析が行うのは、浅い海の底質を5メートルの画素で分けること、礁の地形を区分すること、そして世界の海域を同じ方法で比べられるようにすることです。人が行うのは、地域の検証データで精度を確かめること、潜水調査の地点を選ぶこと、サンゴの健康と種を現地で調べること、そして保護区の境界を決めることです。地図は無償ですが、精度は地域で60から90パーセントと幅があるので、現地の検証は省けません。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [底質の分布図（6区分、5m画素）, サンゴ・藻類と海草の広がり。調査の層]
      - [礁の地形の分布図（11区分）, 礁斜面や礁嶺など、保護の優先度が高い地形の位置]
      - [水深と濁りの推定図（10m）, 地図の信頼できる範囲。潜水の計画]
      - [区域案ごとの生息地の面積と割合, 保護区の境界。開発の回避範囲]
      - [白化と水温の警報（ウェブの表示）, 現地調査の時期。緊急の規制]
    say: 受け取るデータと、それで決められることを整理します。底質の分布図は、サンゴ・藻類と海草の広がりと、調査の層を決める根拠になります。礁の地形の分布図は、礁斜面や礁嶺など、保護の優先度が高い地形の位置を示します。水深と濁りの推定図は、地図の信頼できる範囲と、潜水の計画に使えます。そして、区域案ごとに自分で集計した生息地の面積と割合が、保護区の境界と、開発の回避範囲を決める材料になります。区域案の比較は、保護区に含まれるサンゴ・藻類の面積の割合で示せます。ただし、その面積が生きたサンゴかどうかは、現地でしか分かりません。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-coral-reef-habitat-atlas/limits.svg
    say: 限界は5つあります。1つ目、底質の地図は水深10メートルまで、地形は15メートルまでです。浅いサンゴ礁は30メートル程度まで広がるため、深い場所のサンゴは地図に入らず、生息地を少なく見積もる可能性があります。2つ目、精度は地域で60から90パーセントと幅があります。ニューカレドニアで現地の写真と照らした研究では、底質の精度は20から67パーセントにとどまりました。3つ目、サンゴと藻類は同じ区分で、生きたサンゴと藻類に覆われた岩を分けていません。健康や種は分かりません。4つ目、濁った海と、緯度30度より極側は対象外です。日本の本州沿岸の多くは、この範囲の外になります。5つ目、画像は2018年から2020年のもので、その後の白化や台風、埋立てによる変化は反映されていません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 地図そのものが、無償のSentinel-2とLandsat-8、商用のPlanetScopeから作られ、完成品が無償で公開されている
      - 自前で画像を買って、同じ地図を作る必要はない
      - 無料の登録で、任意の範囲をダウンロードできる。大きな範囲は完成後30日間
      - 対象範囲の外（日本の本州沿岸など）で同じことをするなら、別途、画像の購入か独自の解析が要る
    say: では、無償の衛星でどこまでできるでしょうか。この事例では、地図そのものが、無償のSentinel-2とLandsat-8、それに商用のPlanetScopeから作られ、完成品が無償で公開されています。つまり、自前で画像を買って同じ地図を作る必要はありません。無料の登録をすれば、任意の範囲の地図をダウンロードできます。大きな範囲は作成に時間がかかり、完成後30日間ダウンロードできます。一方で、対象範囲の外、たとえば日本の本州沿岸で同じことをするなら、別途、画像の購入か独自の解析が要ります。

  - kind: table
    heading: 有償画像の概算
    columns: [項目, 考え方]
    widths: [0.32, 0.68]
    rows:
      - [地図のデータ費, "0円。無料の登録でダウンロードできる"]
      - [利用条件, "地図・水深・集計値は出典を示せば使える（CC BY 4.0）。衛星画像のモザイクはPlanet社の著作物で、商用利用と改変後の共有に制限がある"]
      - [注意, "全球の地図を丸ごと複製・公開するには、運営元の書面の承諾が要る。サイトの利用規約は個人の非商用に限るため、商用の成果物に使うときは運営元に確かめる"]
      - [お金がかかる所, "仮定：費用の中心は、現地の検証と潜水調査、集計と区域案の作成の人件費。金額は海域と規模により、この事例では非公開"]
      - [有償画像が要る場合, "仮定：対象範囲の外の海域（日本の本州沿岸など）。画像の購入か独自の解析が別途要る"]
    say: 有償の画像を使うと、いくらかかるか。この事例では、地図のデータ費は0円です。ただし、利用条件に注意が要ります。地図、水深、集計値は、出典を示せば使えるCC BY 4.0です。一方、衛星画像のモザイクはPlanet社の著作物で、商用利用と改変後の共有に制限があります。全球の地図を丸ごと複製や公開することは、運営元の書面の承諾なしには禁じられています。さらに、サイトの利用規約は、個人の非商用の利用に限るとしています。コンサルタントが顧客の成果物に使うときは、どちらが適用されるかを運営元に確かめるのが安全です。お金がかかる所は、仮定を置いて言うと、現地での検証と潜水調査、そして集計と区域案の作成の人件費です。金額は海域と規模によるため、この事例では公開されていません。有償の画像が要るのは、対象範囲の外の海域で同じことをする場合です。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.18, 0.41, 0.41]
    rows:
      - [海域, 熱帯の澄んだ浅い海, 濁った沿岸、水深15mより深い礁、緯度30度より極側]
      - [目的, 分布の全体像、区域案の比較、調査地点の選定, サンゴの被度、健康、種の評価]
      - [時点, 2018〜2020年の状態でよい, 最近の白化や台風の影響を見たい]
      - [精度, 地域の検証データで確かめられる, 地図をそのまま確定の分布とする]
      - [利用, 出典を示した公共や研究の利用, 利用条件を確かめない商用の成果物]
    say: 最後に、向き不向きです。向いているのは、熱帯の澄んだ浅い海で、分布の全体像をつかむ、区域案を比べる、調査地点を選ぶ、という目的です。地域の検証データで精度を確かめられること、出典を示した公共や研究の利用であることも条件です。逆に、濁った沿岸や水深15メートルより深い礁、緯度30度より極側は対象外です。サンゴの被度や健康、種を評価したい、最近の白化や台風の影響を見たい、地図をそのまま確定の分布にしたい、という場合は向きません。提案するときは、最初に対象の海域が範囲に入っているかを確かめること、衛星でサンゴの状態が分かるとは言わないこと、精度の数字を幅で伝えることが要点です。

  - kind: cta
    heading: 自分の海域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：Allen Coral Atlas「Resources」「Science & Methods」（2026年11月閲覧） https://allencoralatlas.org/resources/"
      - "出典：ICRI / Arizona State University「Allen Coral Atlas overview」（2021年9月、icriforum.org）"
      - "出典：Reef Resilience Network「New global area estimates for coral reefs」（Lyons et al. 2024 の要約、reefresilience.org）"
      - "出典：Andréfouët et al. 2024, Coral Reefs（ニューカレドニアでの精度の評価。Living Oceans Foundation の紹介ページ）"
      - "費用：地図は無償（Allen Coral Atlas「Resources」、2026年11月閲覧）。有償画像の価格は、この事例では使わないため示していない"
    say: この事例をもとに、自分の海域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
