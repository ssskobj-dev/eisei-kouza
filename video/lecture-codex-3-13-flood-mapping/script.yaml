# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第3部 第13章「衛星データで浸水の範囲と面積を出す：Sentinel-1の災害前後の2枚を同じ軌道でそろえ、比をとり、普段の水面と斜面を除いて浸水の候補を確かめる」（learn/codex/codex-3-13-flood-mapping.qmd）
title: 衛星データで浸水の面積を出す：Sentinel-1前後の比でAIが誤る4点
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 17
total: 30
thumb: 同じ軌道で比をとる
summary: 大雨の翌朝、Sentinel-1の災害前後の2枚から浸水の候補の範囲と地区ごとの面積を出す章。同じ軌道の2枚を較正した真値で比べ、後を前で割って暗くなった場所を候補にし、普段から水のある場所と傾斜地を除く手順を、しくみから見ます。日付だけで画像を選ぶ、dBの値どうしを割る、傾斜の単位を確かめない、画素を10m四方と決めつける、という4つの誤りと、「市街地に候補が出ないから浸水していない」という読み違いを、AIが返したコードと表を一緒にレビューして見つけます。地図と表を手元で確かめる練習と、宿題つき。
scenes:
  - kind: cover
    heading: 前後の比較で浸水を見る：同じ軌道、比、除外
    sub: 後を前で割り、暗くなった場所を候補に。市街地と木の下は抜ける
    say: 大雨の翌朝、レーダーの衛星画像で、町のどこがどれだけ浸水しているか分かるでしょうか。答えは、同じ軌道の災害前と災害後の2枚を、較正した真値で比べ、後を前で割って暗くなった場所を候補にし、普段から水のある場所と傾斜地を除けば、浸水の候補の範囲と面積が出せる、です。ただし、市街地と木の下の浸水は、この方法では原理的に抜けます。レーダーの画像は雲と夜に関係なく撮れるので、初動の絞り込みに向きます。この動画では、しくみと3つの前提を見たあと、AIが返したコードと面積の表を一緒にレビューして、4つの誤りと1つの読み違いを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - Sentinel-1の災害前後の2枚（同じ軌道）の比で浸水の候補を出し、普段の水面と傾斜地を除いて、地区ごとの面積の表を作れる
      - 候補は「前は明るく、後は暗くなった場所」で、同じ軌道の2枚でないと斜面に偽の変化が出ること、dBの画像なら引き算が比に当たることが分かる
      - 「山林が820haで最多」「市街地が0haで浸水なし」なら、軌道の向きの不一致、dBどうしの割り算、市街地は原理的に抜ける、と気づける
    say: この章を終えると、3つのことができるようになります。1つ目、Sentinel-1の災害前後の2枚、同じ軌道のものを、較正した真値で比べ、後を前で割った比が小さい場所を浸水の候補にして、普段の水面と傾斜地を除き、地区ごとの面積の表を作れること。たとえば、大雨の翌朝に、排水ポンプ車をどの地区に先に向けるかの材料にする、という使い方です。2つ目、候補は、前は明るく、後は暗くなった場所であり、同じ軌道の2枚でないと斜面に偽の変化が出ること、dBの画像なら引き算が比に当たることが分かること。3つ目、AIが返した表で、山林の地区が820ヘクタールと最も多かったり、市街地が0ヘクタールで浸水なしと書かれていたりしたら、軌道の向きの不一致、dBどうしの割り算、市街地が原理的に抜けること、に気づけることです。

  - kind: figure
    heading: しくみ：前後の比較で候補を出す5つの手順
    image: figures/codex-3-13-flood-mapping/flow.svg
    say: まず、しくみです。静かな水面は、電波を衛星と反対の向きに跳ね返すので、レーダーの画像で暗く写ります。浸水した畑や草地は、浸水する前はざらついた面として明るく、浸水すると水面になって暗くなります。だから、同じ場所の災害前と災害後の画像を比べ、明るかったのに暗くなった場所が、浸水の候補です。災害後の1枚だけで暗い場所を拾う方法もありますが、普段から暗い湖、川、滑らかな舗装、斜面の影が全部入ります。前後の比較は、変わった場所だけを拾うので、普段から暗い場所が外れます。たとえば、前の画像で真値が0.1だった畑が、浸水して0.01になれば、後を前で割った比は0.1、つまり10分の1です。普段から水面の湖は、前も後も0.01なので、比は1のままで候補に入りません。図の5つの手順のうち、1と5が人、2から4がAIです。ここに3つの前提があります。1つ目は、同じ軌道の2枚で比べることです。レーダーの明るさは、電波を当てる向きと角度で変わります。衛星に向いた斜面は明るく、反対側は暗く写ります。前と後で軌道の向き、北から南へ進む降交か、南から北へ進む昇交かや、角度が違うと、浸水と無関係な変化が斜面と建物に出ます。国土交通省とJAXAのガイドブックは、災害後と同じ観測の角度と向きのアーカイブを使うことで2時期の合成ができ、精度が上がる、と書いています。Sentinel-1は1機で12日の繰り返しの周期をもち、1周期に175本の軌道があります。同じ軌道の番号の画像は、同じ向きと角度で撮られています。2機なら6日で同じ軌道に戻ります。2つ目は、比と差の使い分けです。レーダーの明るさの真値は、明るい場所で大きく、暗い場所で小さい数です。差をとると、もとが明るい場所の変化が大きく出ます。比をとると、何分の1になったか、なので、もとの明るさに関係なく変化の大きさが並びます。浸水は、明るいものが暗くなる変化なので、比で見ます。国連の推奨の手順も、災害後の画像を災害前の画像で割った値に基準を当てています。なお、dBは真値の対数なので、真値の比をdBに直したものは、dBの差と同じです。dBの画像を持っているなら、引き算が比に相当します。dBの値どうしを割った数には、意味がありません。3つ目は、除外です。普段の水面は、風で波立つと明るく、静かだと暗いので、天候だけで変化が出ます。斜面の影とレイオーバーの場所は情報がありません。国連の手順は、年に10か月より長く水のある場所と、傾斜が5パーセントを超える場所を除いています。欧州の全球の浸水の監視は、都市と密な植生、水に見える場所、地形のゆがみ、影などを、除外の印として別の層で出しています。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.66]
    rows:
      - [災害の前と後の画像で浸水を出して, 同じ相対軌道の番号、同じ昇交か降交の2枚で。製品の名前と軌道の番号を表に]
      - [変化が大きい所を浸水にして, 較正した真値で、後を前で割る。比が基準より小さい（暗くなった）場所だけ。基準の値は知っている地区の比の分布から決め、根拠を書く]
      - [水じゃない所は除いて, 普段の水面（条件：暗い月の数）と、傾斜地（条件：度かパーセントかを書く）を除き、条件ごとに除いた画素の数を出す]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。災害の前と後の画像で浸水を出して、とだけ頼むと、AIは日付だけで2枚を選びます。軌道の向きが違えば、山の斜面と市街地の建物の明るさが前後で変わり、変化が斜面に広がります。見た目は浸水の地図です。しかし、知っている湖の周りと山の斜面に候補が出ていて、面積は数倍に膨らみます。だから、同じ相対軌道の番号、同じ昇交か降交の2枚で、製品の名前と軌道の番号を表に、と頼みます。変化が大きい所を浸水にして、ではなく、較正した真値で後を前で割り、比が基準より小さい、つまり暗くなった場所だけ。基準の値は、浸水したと分かっている地区と、浸水していない地区の比の分布から決め、根拠を書く。水じゃない所は除いて、ではなく、普段の水面は暗い月の数で、傾斜地は度かパーセントかを書いて除き、条件ごとに除いた画素の数を出す。指示の7項目のうち、衛星と処理の段階には、Sentinel-1のIW GRD、偏波はVVを主にVHも別の列で、と書きます。確かめ方には、東の湖が候補に入っていないこと、南の水田の候補は湛水の可能性ありと別の色で示すこと、北の山で影の印が付いた画素が候補に入っていないこと、市街地が候補にほとんど出ないことを地図で確かめ、報告に、市街地と木の下の浸水は抜ける、と書くことを入れます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 浸水の候補（誤りあり）
      before = s1.filter(date="2026-06-01/06-10").mosaic()   # 軌道をそろえていない
      after  = s1.filter(date="2026-06-12/06-20").mosaic()
      before_db, after_db = to_db(before), to_db(after)
      ratio  = after_db / before_db                            # dBの値を割っている
      flood  = ratio > 1.25                                   # 基準の単位と向きが不明
      flood  = flood & (slope(dem) < 5)                       # 5%のつもりで、関数は度を返す
      flood  = flood & ~permanent_water
      area_ha = flood.sum() * 0.01                            # 画素を10m四方と決めつけ
    highlight: [2, 3, 5, 6, 7, 9]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。災害の前後の画像を自動で選び、変化の比1.25で浸水を抽出しました。傾斜5パーセント以上と常時の水域を除外しています。市街地に浸水域が出ていないのは、市街地が浸水しなかったことを示しています。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、比べる条件。前後の2枚が同じ相対軌道の番号と向きか。2、値の倍率。比を較正した真値でとっているか。3、基準の値。向きと単位に根拠があるか、除外の条件と単位が書いてあるか。4、面積。実際の画素の大きさを使っているか。まず、2行目と3行目を見てください。filter、date。日付だけで前後の画像を選び、mosaicでつないでいます。軌道の番号も向きも、どこにもありません。4行目と5行目。to_dbでdBに直してから、after_db割るbefore_db。dBの値どうしを割っています。6行目。ratio大なり1.25。基準の単位と向きが分かりません。7行目。slope小なり5。説明では5パーセントですが、関数が返す単位を確かめていません。9行目。flood.sum、かける0.01。画素を10メートル四方と決めつけています。このコードは、動かしても止まりません。それらしい浸水の地図と、地区ごとの面積の表が出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.10, 0.13, 0.29, 0.44]
    rows:
      - ["2〜3", 比べる条件, "filter(date=…)。「前後の画像を自動で選び」", "日付だけで選び、違う軌道がつながる。相対軌道の番号と昇交・降交をそろえ、製品の名前と軌道の番号を記録に"]
      - ["4〜6", 値の倍率, "after_db / before_db > 1.25。「変化の比1.25」", "dBは対数で、割った数に意味がない。真値で後÷前（かdBの差）、暗くなった側を候補に。向きと単位をコードに"]
      - ["7", 基準の値, "slope(dem) < 5。「傾斜5%以上を除外」", "関数は度を返す。5度は約8.7%、5%は約2.9度。単位を確かめて記録し、除いた画素の数を条件ごとに出す"]
      - ["9", 面積, "flood.sum() * 0.01。", "画素10m四方の決めつけ。再投影した画像では画素の面積が場所で変わる。画素ごとの面積を座標から求める"]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、2行目と3行目。日付だけで前後の画像を選び、つないでいます。範囲が広いと、違う軌道の画像がつながり、前後で軌道の向きと角度が違う場所ができます。斜面と建物の明るさは向きで変わるので、浸水と無関係な変化が出ます。正しくは、相対軌道の番号と、昇交か降交かを前後でそろえ、製品の名前と軌道の番号を記録に出します。2つ目、4行目から6行目。dBの値どうしを割っています。dBは対数なので、割った数に意味はありません。たとえば前がマイナス10dB、後がマイナス20dBなら、真値では0.1から0.01へ10分の1になった、つまり比は0.1、dBの差はマイナス10なのに、dBの値の割り算は2.0です。しかも、dBは負の数なので、暗くなると割り算の値が大きくなり、1.25より大きい、が偶然それらしく働きます。正しくは、較正した真値で後を前で割るか、dBの差をとります。真値の比なら1より小さい側、dBの差なら負の側が、暗くなった場所です。基準の向きと単位を、コードの中に書かせます。3つ目、7行目。説明では傾斜5パーセントと言いながら、関数が返す単位を確かめていません。度を返す関数に5を当てると、5度、およそ8.7パーセントまでが残り、5パーセント、およそ2.9度とは違う範囲を除きます。正しくは、単位を確かめて、度かパーセントかを記録に書き、除いた画素の数を出します。4つ目、9行目。画素を10メートル四方、0.01ヘクタールと決めつけています。IW GRDの高分解能の画素の間隔は10メートルですが、緯度と経度の座標に再投影した画像では、画素の実際の面積は場所で変わります。正しくは、画素ごとの面積を座標から求めるか、面積を保つ投影に直してから数えます。そして、AIの説明の、市街地に浸水域が出ていないのは、市街地が浸水しなかったことを示しています。これは逆です。建物の壁と水面は角になって電波を衛星に返すので、浸水した市街地は暗くなりません。ガイドブックは、都市部では建物が全部浸水しないと浸水域として抽出されない、と書いています。出ていない、は、浸水していない、ではなく、この方法では見えない、です。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：地図と表を確かめる
    items:
      - 知っている湖と川が候補に入っていないか。入っていれば、普段の水面の除外が効いていないか、風。条件ごとに除いた画素の数を見る
      - 浸水したと分かっている地区が候補に出ているか。出ていなければ、基準が厳しすぎるか、その地区が市街地
      - 候補が山の斜面に帯や点で出ていないか。出ていれば、前後の軌道の向きが違うか、影とレイオーバーが除かれていない。軌道の番号を表で見る
      - 候補の縁が地形に沿っているか。四角く切れていれば、画像のつなぎ目か範囲の外
      - 南の水田が候補の多くを占めていないか。別の色で示し、面積の表で分ける
      - 面積の表に画素の数と画素の大きさがあるか。8画素に満たない粒は斑点のノイズの可能性
    say: 判定を、手元でやってみます。AIに頼んだ人なら、候補の地図と、地区ごとの面積の表を見ながら、数分でできます。まず、地図を開いて、知っている湖と川を見ます。候補に入っていれば、普段の水面の除外が効いていないか、風で前後の水面の明るさが変わっています。条件ごとに除いた画素の数を見ます。2つ目、浸水したと分かっている地区を見ます。候補に出ていなければ、基準の値が厳しすぎるか、その地区が市街地です。地区の土地の種類を地図で見ます。3つ目、山の斜面を見ます。候補が帯や点で出ていれば、前後の軌道の向きが違うか、影とレイオーバーの画素が除かれていません。製品の軌道の番号を、表で見ます。4つ目、候補の縁を見ます。浸水は低い所に広がるので、縁は標高の等しい線に沿います。地形と無関係に四角く切れていれば、画像のつなぎ目か、範囲の外です。5つ目、南の水田を見ます。田植えの時期の水田はほぼ水面で、浸水として多く抽出されるか、湛水か浸水か区別できません。別の色で示し、面積の表で分けます。6つ目、面積の表に、画素の数と画素の大きさがあるか。なければ、面積の出し方を確かめられません。8画素に満たない小さな粒は、斑点のノイズの可能性があります。小さな粒を除く条件を、記録に出します。この6つを、報告の前にやります。

  - kind: figure
    heading: 抜けるもの、紛れるもの、例2つ
    image: figures/codex-3-13-flood-mapping/miss-confuse.svg
    say: 直したら、地図と表を目で確かめます。図の左が、浸水しているのに候補から抜けるもの。市街地、建物と水面の角で明るく返します。木の下の浸水、葉で電波が返ります。風で波立った浸水面。そして、50メートル四方より小さい浸水です。右が、浸水していないのに候補に紛れるもの。普段の湖と川、風で明るさが変わります。田植えの時期の水田。斜面の影とレイオーバー。前後で軌道の向きが違う斜面と建物です。おかしな結果の例を2つ。例1、候補が山の東側の斜面に帯で広がり、面積が町の面積の3割になった。原因は、前後の軌道の向きです。前の画像が昇交、後の画像が降交で、衛星に向いた斜面が東西で入れ替わっています。前は明るく後は暗い斜面が、全部浸水になりました。製品の名前と軌道の番号を表で見れば、向きの違いが分かります。同じ軌道の前の画像で、やり直します。例2、浸水したと報道された中心の商店街が、候補に全く出ず、浸水なし、と表に出た。原因は、方法の限界です。市街地の浸水は、建物と水面の角で電波が返り、暗くなりません。欧州の全球の浸水の監視が、都市を除外の印にするのと同じ理由です。表の、浸水なし、を、判定できない、市街地、に直し、商店街は現地と報道で確かめます。言えるのは、この前後の2枚、同じ軌道で、較正した真値の比がこの基準より小さく、普段の水面と傾斜地を除いた場所が、この範囲と面積で、浸水の候補である、です。製品の名前、軌道の番号、基準の値と根拠、除外の条件と単位、画素の大きさを表に書けば、別の人がやり直せます。言えないのは、候補の外は浸水していない、と、面積が被害の面積、です。衛星の範囲は推定で、調査の箇所の絞り込みに使い、詳しい状況は現地で把握します。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 市街地の浸水。角で電波が返り暗くならない。現地、ドローン、通報で補う
      - 木の下、密な植生の下の浸水。葉で電波が返り、下の水面が見えない
      - 田植えの時期の水田が多い地域。湛水と浸水を区別できない
      - 狭い浸水と浅い浸水。概ね50m四方以上で判読可能。道路1本の冠水は周りと混ざる
      - 急な山地と、風の強い日。影と水面を区別しにくく、波立った水面は明るく返る
      - 災害前の同じ軌道の画像が無いとき。後の1枚で暗い場所を拾う方法に切り替え、精度が落ちることを報告に書く
    say: 向かない条件も、押さえておきます。1つ目、市街地の浸水の範囲を知りたいとき。建物と水面の角で電波が返り、暗くなりません。現地、ドローン、通報の情報で補います。2つ目、木の下、密な植生の下の浸水。電波が葉で返り、下の水面が見えません。3つ目、田植えの時期の水田が多い地域。普段から水面なので、浸水として多く抽出されるか、湛水と浸水を区別できません。4つ目、狭い浸水と、浅い浸水。ガイドブックは、概ね50メートル四方以上であれば判読できる、と書いています。IW GRDの分解能はおよそ20メートルかける22メートルで、道路1本の冠水は周りと混ざります。5つ目、急な山地と、風の強い日。影とレイオーバーの画素は情報が無く、斜面の影と水面を区別しにくいです。風で水面が波立つと明るく返り、浸水面が抜け、普段の湖が変化として出ます。6つ目、災害前の同じ軌道の画像が無いとき。前後の条件がそろいません。災害後の1枚だけで暗い場所を拾う方法に切り替え、普段から暗い場所を公開の水面の地図で除き、精度が落ちることを報告に書きます。有償の商用データを使うときは、考え方は同じですが、波長と分解能、軌道の繰り返しが違います。前後の2枚を同じ条件でそろえられるか、較正の方法と値の単位を、仕様書で確かめます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 目的と、範囲と、前後の画像の条件を決める。知りたいこと、境界、災害の日時、知っている場所。出るのは軌道の番号と向き、前後の画像の条件（人）
      - 前後の2枚を選び、較正した真値に直させる。IW GRD、偏波。出るのは製品の名前、軌道の番号と向き、σ0の真値の画像、ならした画像（AI）
      - 後を前で割り、暗くなった場所を候補にさせる。基準は知っている地区の比の分布から。出るのは比の画像と分布、基準と根拠、候補の画像（AI）
      - 普段から水のある場所と傾斜地を除かせる。水のある月の数、傾斜の値と単位。出るのは除いた後の候補と、条件ごとに除いた画素の数（AI）
      - 面積を出し、知っている場所と現地で確かめる。画素の大きさ、現地と報道。出るのは地区ごとの面積の表と、報告に書く注意（人）
    say: 手順をまとめます。1、目的と、範囲と、前後の画像の条件を決める。入れるのは、知りたいこと、範囲の境界、災害の日時、知っている場所。出るのは、使う軌道の番号と向き、災害後の画像の日時、災害前の画像の条件です。人です。2、前後の2枚を選び、較正した真値に直させる。入れるのは、1の条件と、IW GRDという製品の種類、偏波。出るのは、前後それぞれの製品の名前、軌道の番号と向き、σ0の真値の画像、ならした後の画像です。AIです。3、後を前で割り、暗くなった場所を候補にさせる。基準の値は、知っている浸水の地区と、浸水していない地区の比の分布から決めます。出るのは、比の画像、比の分布の図、基準の値とその根拠、候補の画像です。AIです。4、普段から水のある場所と傾斜地を除かせる。入れるのは、普段の水面の地図、標高のデータ、水のある月の数、傾斜の値と単位。出るのは、除いた後の候補と、条件ごとに除いた画素の数です。AIです。5、面積を出し、知っている場所と現地で確かめる。入れるのは、画素の大きさ、知っている場所の一覧、現地と報道の情報。出るのは、地区ごとの面積の表と、普段の湖が候補に入っていないか、浸水したと分かっている地区が出ているか、市街地が抜けている範囲はどこか、の判定、そして報告に書く注意、市街地と木の下は抜ける、です。人です。この5つを、大雨の翌朝の第一報を出す前にやります。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      before = s1.filter(date="2026-06-01/06-10").mosaic()
      after  = s1.filter(date="2026-06-12/06-20").mosaic()
      ratio  = to_db(after) / to_db(before)
      flood  = (ratio > 1.25) & (slope(dem) < 5) & ~permanent_water

      地区の候補の面積（ha）：北部（山林、斜面）820、南部（水田、田植え直後）610、
      　東部（湖と湖岸の畑）240、中心（市街地）0
      AIの説明：「中心市街地に浸水域は出ておらず、市街地は浸水を免れたと判断できます」

      問い：この結果から言えないことはどれか
      A. 北部の候補は、前後の軌道の向きがそろっていないため、斜面の明るさの変化を拾っている可能性がある
      B. 中心市街地の候補が0haなので、市街地は浸水していない
      C. 南部の候補には、田植え直後の水田の湛水が浸水として混ざっている可能性がある
      D. 比をdBの値どうしの割り算で出しているので、1.25という基準の意味を確かめる必要がある
    highlight: [1, 2, 3, 4]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、大雨の翌朝、AIに、Sentinel-1の災害前後の画像で、町の浸水の候補と地区ごとの面積を出して、と頼みました。AIが返した説明と表とコードの抜粋が、画面のものです。2026年6月13日の画像と、6月1日から10日の画像を自動で選び、変化の比1.25で浸水を抽出しました。常時の水域と傾斜5パーセント以上を除外しています。中心市街地に浸水域は出ておらず、市街地は浸水を免れたと判断できます。面積の表は、北部の山林と斜面が820ヘクタール、南部の田植え直後の水田が610ヘクタール、東部の湖と湖岸の畑が240ヘクタール、中心の市街地が0ヘクタールです。担当者は、北部の山に浸水の候補が最も多いことに違和感を持ちました。この結果から、言えないことはどれでしょうか。A、北部の候補は、前後の画像の軌道の向きがそろっていないために、斜面の明るさの変化を拾っている可能性がある。B、中心市街地の候補が0ヘクタールなので、市街地は浸水していない。C、南部の候補には、田植え直後の水田の湛水が浸水として混ざっている可能性がある。D、比をdBの値どうしの割り算で出しているので、1.25という基準の意味を確かめる必要がある。この動画でやった、出ていない、と、浸水していない、は別、という観点を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が、北部の候補と比の計算の問題を直すために、AIに頼み直すべきことを2行で書く、問2の短答も、そこにあります。

