# 講義動画の台本。解析教材 第0部 第2章「AIへの頼み方」（試作）
title: AIへの頼み方
series: CODEX
kicker: 第0部 第2章
number: 2
total: 30
thumb: AIへの頼み方
summary: 衛星データの解析をAIに頼むときに、指示に必ず入れる7項目。あいまいな指示と良い指示の違い、AIが書いたコードを3つの観点で確かめて直すところまでを、一緒にやってみます。宿題つき。
publish: false   # 解析教材（Codex）の試作。章の原稿ができるまで投稿しない
voice: もち子
scenes:
  - kind: cover
    heading: AIへの頼み方
    sub: 解析の指示に必ず入れる7項目と、一緒にやってみよう
    say: AIに「衛星画像で農地の生育を調べて」と頼むと、何が起きるでしょうか。コードは返ってきますが、どの衛星か、いつの画像か、何で測るかは、AIが勝手に決めます。答えは、指示に7つの項目を入れることです。この章では、その7項目と、AIが書いたコードを3つの観点で確かめる方法を、一緒にやってみます。最後に宿題があります。

  - kind: bullets
    heading: この章でできるようになること
    items:
      - 解析の指示に、必ず入れる7つの項目を書ける
      - あいまいな指示と、良い指示の違いを説明できる
      - AIが書いたコードを、3つの観点で確かめられる
      - 自分の地域の課題で、同じ手順を繰り返せる
    say: この章を終えると、4つのことができるようになります。解析の指示に必ず入れる7つの項目を書けること。あいまいな指示と良い指示の違いを説明できること。AIが書いたコードを3つの観点で確かめられること。そして、自分の地域の課題で同じ手順を繰り返せることです。

  - kind: bullets
    heading: 役割の分担
    items:
      - AIに任せる：コードを書く、直す、説明する
      - 人が決める：問い、データ、条件、合格の基準
      - 人が確かめる：コード、結果、言えること
      - AIは自信のある口調で誤る。確かめる手順を先に決めておく
    say: まず、役割の分担です。AIに任せるのは、コードを書く、直す、説明すること。人が決めるのは、問い、データ、条件、そして何をもって合格とするかです。人が確かめるのは、コード、結果、そしてそこから言えることです。AIは、自信のある口調で間違えます。だから、確かめる手順を先に決めておきます。

  - kind: steps
    heading: 指示に必ず入れる7項目
    items:
      - 目的：何を判断したいか
      - 場所：範囲の指定の仕方（座標、区画のデータ）
      - 期間：いつからいつまで
      - 使う衛星と、処理の段階
      - 手順：指数、比較の方法、基準
      - 出力：地図、表、単位
      - 確かめ方：途中の値を表示させる、答えの分かる場所で試す
    say: 指示に必ず入れる項目は7つです。1つ目、目的。何を判断したいか。2つ目、場所。範囲をどう指定するか。3つ目、期間。4つ目、使う衛星と、データの処理の段階。5つ目、手順。使う指数、比較の方法、基準の値。6つ目、出力。地図か表か、単位は何か。7つ目、確かめ方。途中の値を表示させることや、答えの分かる場所で試すことを、最初から指示に入れます。

  - kind: prompt
    heading: あいまいな指示の例
    label: 悪い例
    text: |
      衛星画像で、うちの市の農地の生育状況を調べるコードを書いて。
    say: あいまいな指示の例です。衛星画像で、うちの市の農地の生育状況を調べるコードを書いて。これでもAIはコードを返します。ただし、どの衛星か、いつの画像か、生育状況を何で測るか、結果をどう出すかは、すべてAIが勝手に決めます。その決め方は、たいてい説明されません。

  - kind: prompt
    heading: 直した指示の例
    label: 良い例
    text: |
      目的：農地の区画ごとに、夏の植生の指数を前年と比べ、下がった区画を拾いたい。
      場所：添付の区画データ（GeoJSON、座標系はWGS84）。
      期間：2025年7月1日〜8月31日と、2024年の同じ期間。
      データ：Sentinel-2 の地表反射率（Level-2A）。雲と雲の影は SCL で除く。
      手順：画素の値を反射率に直してから NDVI を計算し、期間の中央値を区画ごとに平均する。
      出力：区画ID、2024年の値、2025年の値、差、の表（CSV）。
      確かめ方：値の範囲と、雲を除いた画素の割合を表示する。水面の区画で値が低いことを確かめる。
    say: 直した指示の例です。目的は、農地の区画ごとに夏の植生の指数を前年と比べ、下がった区画を拾うこと。場所は、添付の区画データ。期間は、2025年と2024年の7月から8月。データは、Sentinel-2の地表反射率で、雲と雲の影は分類のデータで除く。手順は、画素の値を反射率に直してからNDVIを計算し、期間の中央値を区画ごとに平均する。出力は、区画ごとの表。確かめ方は、値の範囲と、雲を除いた画素の割合を表示し、水面の区画で値が低いことを確かめる。7項目がそろっています。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 小さな課題で、頼む、確かめる、直す、を一度通します
    items:
      - 課題：赤と近赤外の画素の値から、NDVIを計算する関数を書いてもらう
      - データ：Sentinel-2 Level-2A の画素の値（整数）と、分類のデータ（SCL）
      - 見る観点：値の直し方、雲の扱い、割り算の分母
    say: ここからは、一緒にやってみましょう。課題は小さくします。赤と近赤外の画素の値から、NDVIを計算する関数をAIに書いてもらいます。データは、Sentinel-2のLevel-2Aの画素の値と、雲などを分類したデータです。見る観点は3つ。値の直し方、雲の扱い、割り算の分母です。

  - kind: code
    heading: AIが書いた最初のコード
    code: |
      import numpy as np

      def ndvi(red, nir):
          """赤と近赤外からNDVIを計算する"""
          return (nir - red) / (nir + red)
    highlight: [3, 5]
    notes:
      - 画素の値を、反射率に直していない
      - 雲と雲の影を除いていない
      - 分母が0のとき、エラーか無限大になる
    say: AIが書いた最初のコードです。短くて、一見正しく見えます。しかし、レビューの観点を当てると、3つの問題があります。1つ目、画素の値をそのまま使っていて、反射率に直していません。2つ目、雲と雲の影を除いていません。3つ目、分母が0になる画素で、エラーか無限大が出ます。どれも、AIに「衛星データならでは」の前提を伝えていないために起きます。

  - kind: table
    heading: レビューの観点を当てる
    columns: [観点, 見ること, このコードでは]
    widths: [0.22, 0.44, 0.34]
    rows:
      - [値の倍率, 画素の値を、決まった倍率とずらしで反射率に直しているか, 直していない
      ]
      - [雲と影, 雲、雲の影、雪を除いているか, 除いていない]
      - [欠けた値, 分母が0の画素や、値のない画素の扱いが書かれているか, 書かれていない]
      - [実在するか, 関数や波長帯の名前が本当にあるか, 問題なし（numpyだけ）]
    say: 共通のレビュー観点の表で確かめます。値の倍率。画素の値を、決まった倍率とずらしで反射率に直しているか。このコードは直していません。雲と影。除いていません。欠けた値。分母が0の画素の扱いが書かれていません。実在するかどうか。使っているのはnumpyだけなので、ここは問題ありません。問題が3つ見つかったので、AIに直してもらいます。直し方を自分で書く必要はありません。何が問題かを伝えれば十分です。

  - kind: code
    heading: 直したコード
    code: |
      import numpy as np

      def ndvi(red, nir, scl, scale=0.0001, offset=-0.1):
          red = red * scale + offset          # 画素の値を反射率に直す
          nir = nir * scale + offset
          cloud = np.isin(scl, [3, 8, 9, 10, 11])   # 雲の影、雲、巻雲、雪
          d = nir + red
          out = np.where(d != 0, (nir - red) / np.where(d != 0, d, 1), np.nan)
          out[cloud] = np.nan                 # 雲の画素は「値なし」にする
          return out
    highlight: [4, 6, 8, 9]
    notes:
      - 倍率とずらしの値は、データの公式の説明で確かめる
      - 分類の番号も、公式の説明で確かめる
      - 「値なし」を0や平均で埋めない
    say: 直したコードです。4行目と5行目で、画素の値を反射率に直しています。倍率とずらしの値は、AIの答えをそのまま信じず、データの公式の説明で確かめます。6行目で、雲の影、雲、巻雲、雪の分類の番号を除いています。この番号も公式の説明で確かめます。8行目で、分母が0の画素を値なしにしています。9行目で、雲の画素を値なしにしています。値なしを0や平均で埋めないことが大切です。埋めると、雲が「生育不良」として集計されてしまいます。

  - kind: table
    heading: 結果の目視レビュー
    columns: [確かめたこと, 最初のコード, 直したコード]
    widths: [0.44, 0.28, 0.28]
    rows:
      - [茂った植物の画素（赤1200、近赤外4500）, "0.58", "0.89"]
      - [値のない画素（両方0）, エラーの警告と「値なし」, "値なし（0）"]
      - [雲と分類された画素, そのまま計算される, 値なし]
      - [値の範囲が −1〜1 に収まるか, 収まる, 収まる]
    say: 最後に、結果を目で確かめます。答えの分かる値を入れて試します。茂った植物に相当する画素では、最初のコードは0.58、直したコードは0.89になりました。倍率とずらしを直すだけで、値がこれだけ変わります。両方の値が0の画素では、最初のコードは警告を出し、直したコードは値なしを返します。雲と分類された画素は、最初のコードではそのまま計算され、直したコードでは値なしになります。値の範囲は、どちらもマイナス1から1に収まっています。このように、答えの分かる値で試すことを、指示の確かめ方に最初から入れておきます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 7項目をそろえた指示を書く
      - AIにコードを書かせ、1行ずつ説明させる
      - 共通のレビュー観点を上から当て、問題を書き出す
      - 問題を伝えて、AIに直させる
      - 答えの分かる値や場所で試し、結果を目で確かめる
      - 使ったデータ、条件、指示文を記録に残す
    say: 手順をまとめます。1、7項目をそろえた指示を書く。2、AIにコードを書かせ、1行ずつ説明させる。3、共通のレビュー観点を上から当て、問題を書き出す。4、問題を伝えて、AIに直させる。5、答えの分かる値や場所で試し、結果を目で確かめる。6、使ったデータ、条件、指示文を記録に残す。この6つを、どの解析でも繰り返します。

  - kind: bullets
    heading: 宿題
    bold: true
    items:
      - 自分の地域の農地か森林を1か所選び、「夏の植生の指数を前年と比べる」指示文を、7項目で書く
      - AIにNDVIを計算するコードを書かせ、レビュー観点の表を上から当てて、問題を3つ以上書き出す
      - 問題を伝えて直させ、答えの分かる値で試した結果を、表にまとめる
    say: 宿題です。1つ目、自分の地域の農地か森林を1か所選び、夏の植生の指数を前年と比べる指示文を、7項目で書いてください。2つ目、AIにNDVIを計算するコードを書かせ、レビュー観点の表を上から当てて、問題を3つ以上書き出してください。3つ目、問題を伝えて直させ、答えの分かる値で試した結果を表にまとめてください。次の章では、コードの読み方とレビューの基本を扱います。

  - kind: cta
    heading: 宿題を出したら、次の章へ
    action: この章のレビュー観点の一覧とケース問題は、サイトで
    url: ssskobj-dev.github.io/eisei-kouza/learn/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/index.html
    credits:
      - "この動画のコードは実際に動かして確かめています。倍率、ずらし、分類の番号は、Copernicus の公式資料で確かめてから使ってください"
    say: 共通のレビュー観点の一覧と、この章のケース問題は、説明欄のリンクから、サイトの学習プログラムで読めます。宿題の答え合わせも、そこでできます。ご視聴ありがとうございました。
