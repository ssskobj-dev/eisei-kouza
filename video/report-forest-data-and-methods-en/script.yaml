# English market-report video (overseas). Theme: forests & carbon, angle: data & methods.
# Facts verified against the primary sources listed in the closing credits. Numbers not verified were left out.
lang: en
voice: Joe
title: "Forests and carbon from orbit: the data and the methods"
series: MARKET
kicker: Market report
thumb: Data and methods
summary: Which satellites and which data actually sit behind forest and carbon monitoring - optical for where trees are lost, radar to see through tropical cloud, and lidar to measure what the carbon weighs. Much of it is free and open. The sensors, where paid data begins, how the analysis runs, and where the real cost sits. About 6 minutes.
scenes:
  - kind: cover
    heading: "Forests and carbon from orbit: the data and the methods"
    sub: Which satellites, which data, and how the analysis runs
    say: Which satellites, and which data, actually sit behind forest and carbon monitoring? The short answer is this - optical imagery shows where trees are lost, radar sees through tropical cloud, and newer lidar and radar missions measure what the forest actually weighs in carbon. And a large part of that data is free and open. In this report we look at the sensors that do the work, where free data ends and paid data begins, how the analysis runs, and where the real cost sits.

  - kind: bullets
    heading: What this report covers
    items:
      - "The sensors - optical for loss, radar through cloud, lidar for carbon"
      - "Free and open data, and where paid data begins"
      - "How the analysis runs, and where the cost really sits"
    say: Here is what this report covers. First, the sensors - optical to see where forest is lost, radar to see through cloud, and lidar and long-wave radar to weigh the carbon. Second, the data itself - how much of it is free and open, and the point where you start paying. And third, how the analysis actually runs, and where the real cost sits, because it is not where most people expect.

  - kind: bullets
    heading: The sensors that do the work
    items:
      - "Optical reads colour - mid-resolution Sentinel-2 and Landsat spot where forest is cleared"
      - "L-band radar sees through cloud - vital in the rainy tropics"
      - "Lidar and P-band radar measure canopy height and biomass, not just area"
      - "High-resolution optical, under one metre, resolves small plots"
    say: Start with the sensors. Optical sensors read colour and reflectance, like a camera, so they show where green forest has turned to bare ground. The workhorses here are mid-resolution and free - Europe's Sentinel-2 at ten metres, and the United States Landsat at about thirty. But optical cannot see through cloud, and the tropics are cloudy for months. That is where radar comes in. Longer L-band radar sees straight through cloud and rain - Japan's ALOS-2 is the example, and we will come back to it. Optical and radar tell you where forest was lost. They do not tell you how much carbon that forest held. For that, two newer methods measure the structure of the forest itself - NASA's GEDI, a laser, or lidar, instrument on the International Space Station that measures canopy height and above-ground biomass, and the European Space Agency's Biomass mission, launched in April twenty twenty-five, the first satellite to carry a P-band radar whose long wavelength reaches through the canopy to the woody mass below. And where you need to resolve a single small plot, there is commercial high-resolution optical, finer than one metre.

  - kind: table
    heading: Free data, and where paid data begins
    columns: [Free and open, Paid and commercial]
    widths: [0.5, 0.5]
    rows:
      - ["Sentinel-2 and US Landsat optical", "High-resolution optical, under one metre"]
      - ["ALOS-2 L-band alerts via JJ-FAST", "Tasking: a fresh image on demand"]
      - ["Global Forest Watch, a public map", "Commercial deforestation-risk services"]
      - ["Best for wide-area screening", "Needed for plot-level proof"]
    say: Now the data. A surprising share of it is free and open. The European Copernicus programme gives away Sentinel-2 optical imagery, and the United States has offered Landsat free since two thousand eight. The World Resources Institute runs Global Forest Watch, a public map of forest loss built on University of Maryland analysis. And Japan's space agency and its aid agency run J-J-FAST, a free alert service built on ALOS-2 radar, which we will see next. This free data is excellent for watching wide areas and long-term trends. You start paying when you need something free data cannot give - high-resolution optical finer than one metre to resolve a single farm plot, tasking, which means ordering a fresh image of a specific place at a specific time, or a commercial service that packages the analysis for you. The rule of thumb is simple - free data for screening, paid data for proof.

  - kind: steps
    heading: How the analysis runs
    items:
      - "Set a baseline - a reference date the law or the standard fixes"
      - "Detect change - compare optical over time, add L-band radar where there is cloud"
      - "Alert and screen - a map of suspected clearing, refreshed on a cycle"
      - "For carbon, add weight - height and biomass from lidar, calibrated with field plots"
      - "Confirm on the ground - the satellite ranks where to look, people verify"
    say: So how does the analysis actually run? Think of it in steps. First, set a baseline - a reference date. For Europe's deforestation rule that date is fixed in law - the end of twenty twenty. Second, detect change - compare optical images over time to find where forest became bare ground, and bring in L-band radar wherever cloud blocks the optical view. Japan's J-J-FAST does exactly this - ALOS-2 radar over seventy-eight tropical countries, refreshed about every one and a half months, flagging suspected clearing even through the rainy season. That is step three, the alert and the screening map. For carbon you need a fourth step - weight. Area alone does not tell you the carbon, so lidar and radar estimates of canopy height and biomass are combined and calibrated against measured field plots. And finally, confirm on the ground. The satellite ranks where to look and sets the scope; people still verify.

  - kind: table
    heading: How to read it, and where the cost sits
    columns: [What it is, What it is not]
    widths: [0.5, 0.5]
    rows:
      - ["2025 tropical loss down 36%", "One year off a record, not a trend - still 46% above a decade ago"]
      - ["Raw Sentinel and Landsat data is free", "A finished product is not - processing and checking cost"]
      - ["A deforestation alert", "A candidate to check, not proof of a violation"]
      - ["Area is easy to map", "Carbon is hard - estimates need ground calibration"]
    say: Here is how to read these methods without overselling them. Global Forest Watch reported that tropical primary forest loss fell thirty-six percent in twenty twenty-five - but that was one year coming off a record high, not a confirmed turning point, and the loss was still forty-six percent above where it sat a decade earlier. One year is not a trend. Next, the raw Sentinel and Landsat data is free, but a finished, reliable product is not - the cost moves into processing and validation, which is skilled work. A deforestation alert is a candidate to check, not proof that a law was broken. And mapping area is the easy part - estimating the carbon a forest holds is genuinely hard, and those estimates have to be calibrated against measurements on the ground. Free data does not mean a free answer.

  - kind: bullets
    heading: What a consultant should take from this
    items:
      - "Start from the rule or standard the data must answer - the calendar moves the budget"
      - "Free data for screening, commercial high-resolution only for plot-level proof"
      - "Budget for the analysis and the field work, not just the imagery"
      - "Present satellite carbon figures as evidence to be checked, not as proof"
    say: So what should a consultant take from this? First, start from the rule or the standard the data has to answer - a European deforestation requirement, or a carbon standard's measurement rules - because the regulatory calendar moves the client's budget. Europe's deforestation rule applies to large and medium operators from the end of December twenty twenty-six, and to smaller ones from the middle of twenty twenty-seven, so the demand is dated. Second, match the data to the job - free imagery for wide-area screening, and commercial high-resolution only where you must prove what happened on a single plot. Third, when you build the budget, the money is in the analysis and the field validation, not in the pixels. And fourth, be honest about carbon - present a satellite estimate as evidence to be checked against the ground, not as proof on its own.

