# ユースケース解説動画の台本。元の記事：casebook/flood-depth-roads.qmd
title: SAR衛星で浸水の深さと冠水道路を推定する：阿武隈川25.7km²の例
series: CASEBOOK
kicker: ユースケース解説
number: 18
total: 221
thumb: 深さと道路を推定
summary: SAR衛星で抜き出した浸水の範囲に標高データを重ね、浸水の深さと冠水した道路を推定する使い方を解説します。阿武隈川の解析例では浸水域25.72km²、浸水建物6,800棟以上と推計。救援の順番を決める材料にはなりますが、床上か床下かの境目は衛星だけでは決められません。無償衛星でどこまでできるか、有償画像の概算までを6分で。
voice: もち子
scenes:
  - kind: cover
    heading: SAR衛星で浸水の深さと冠水道路を推定
    sub: 浸水域25.7km²に標高データを重ねる。阿武隈川と六角川の解析例
    say: 水害の直後に、どこがどのくらい深く浸かり、どの道路が通れないかを、衛星で知る方法はあるか。答えは、SAR衛星で抜き出した浸水の範囲に標高データを重ねれば、深さと冠水した道路を「推定」できる、です。ただし推定であって、床上か床下かの境目までは決められません。この動画では、国内の解析例を使って、誰が、業務のどこに入れて、何を決める材料にできるのか。限界はどこで、無償の衛星でどこまでできて、有償の画像ならいくらかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。阿武隈川（2019年の台風19号）と、佐賀県六角川（2021年8月の大雨）
      - 誰が：国内のSAR衛星事業者が、2020年12月に洪水の被害評価のサービスを発表
      - 対象の利用者：保険会社、金融機関、政府機関
      - 何のために：浸水の範囲、深さ、被害を受けた道路と建物を早くつかむ
      - 注意：公表されているのは事業者の解析例で、業務で使った実績ではない
    say: 事例の舞台は日本です。2019年の台風19号で浸水した阿武隈川の流域と、2021年8月の大雨で浸水した佐賀県の六角川の流域。この2つを、国内のSAR衛星事業者が解析の例として公開しています。この事業者は2020年12月に、洪水の被害評価のサービスを発表しました。浸水の範囲、深さ、被害を受けた道路と建物を評価し、ソフトウェアの定額利用の形で提供するもので、対象は保険会社、金融機関、政府機関とされています。ひとつ注意があります。公表されているのは事業者の解析例で、自治体や保険会社が業務で使った実績として公表されたものではありません。本格運用ではなく、解析の例として見てください。

  - kind: figure
    heading: 阿武隈川の解析例で公表された推計
    image: figures/usecase-flood-depth-roads/numbers.svg
    caption: 建物と道路の数は、「半分以上が深さ1.8m以上」という仮定にもとづく推計
    say: 阿武隈川の例で公表された数字です。2019年10月12日、世界時の23時42分に観測された、無償のSentinel-1のデータを解析しました。浸水の範囲は約25.72平方キロ。その半分以上が、深さ1.8メートル以上と推定されています。そして、浸水した建物の半分以上が1.8メートル以上の深さだったと仮定すると、被害を受けた建物は6,800棟以上、道路は約1,800キロメートルと推計しています。大事なのは、建物と道路の数は仮定にもとづく推計だという点です。仮定が変わると、数字も変わります。六角川の例では、浸水した道路と建物を立体で表示していますが、事業者自身が、精度は検証中としています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-flood-depth-roads/flow.svg
    caption: 準備の中心は、平時のデータ整備
    say: 自治体の防災部局が、水害直後の救援と被害調査の順番決めに入れる場合を考えます。まず平時に、標高データ、道路網、建物の位置のデータを整え、推定の結果を受け取る形式を決めておきます。発災後は、観測データを取得します。無償衛星の観測日を待つか、商用衛星に撮像を要請するかを、ここで決めます。次に、浸水の範囲から深さと冠水した道路を推定した結果を受け取り、深い地区と通れない道路の一覧から、救援と調査に入る順番と経路を決めます。最後に現地で深さの痕跡を確かめ、被害を確定します。準備の中心は、最初のデータ整備です。標高データが粗いまま解析しても、深さの値は使えません。推定と実測の差を毎回記録すると、次の水害で推定値をどこまで信じるかの目安になります。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-flood-depth-roads/split.svg
    say: 役割の分担です。SAR衛星は、電波を自分で出して地表を測るので、夜間や雲の下でも観測できます。水面は電波をはね返さず暗く写るので、浸水した範囲を抜き出せます。ここまでは、国の河川管理でも使われている仕組みです。衛星と解析が行うのは、その範囲に標高データを重ねて浸水面の高さを推定し、地表との差から深さを求め、深さを道路と建物の位置に当てはめることです。国土地理院が災害のたびに作る浸水推定図も、同じ考え方です。担当者が行うのは、深い地区と通れない道路から救援の順番を決めること、現地で深さを確かめること、被害を確定することです。推定は順番を決める材料で、確定は現地で行う。この線引きが要です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.5, 0.5]
    rows:
      - [浸水域の地図（GISで重ねられる地図データ）, 被害の全体の広がり。調査に入る地区]
      - [浸水深の分布（深さごとに色分けした地図）, 深い地区を先に救援する順番]
      - [冠水した道路の区間（道路網の一覧）, 救援の経路。通行止めの候補]
      - [浸かった建物の数の推計（仮定付き）, 応援要員の規模。被害調査の人数]
      - [報告書（PDF）, 対策本部での共有、記録]
    say: 受け取るデータと、それで決められることを整理します。浸水域の地図は、被害の全体の広がりと、調査に入る地区を決める材料です。浸水深の分布は、深い地区を先に救援する順番の根拠になります。冠水した道路の区間は、救援の経路と通行止めの候補を選ぶのに使います。浸かった建物の数の推計は、応援要員の規模や被害調査の人数を見積もる材料です。そして報告書は、対策本部での共有と記録に使います。建物の数と道路の長さは「推計」です。受け取るときは、どの仮定で計算したかを一緒に受け取ってください。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-flood-depth-roads/limits.svg
    say: 限界は5つあります。1つ目、深さは標高データの精度と仮定で決まります。衛星が直接見せるのは水面の広がりだけで、深さは標高データとの差から求めるためです。2つ目、精度は検証中で、公表された検証の数値はありません。3つ目、床上か床下かの境目は、衛星だけでは決められません。救援の順番なら深い地区が分かれば足りますが、被害の認定や保険の支払いでは数十センチの差が区分を分けます。4つ目、住宅が密集する市街地の浸水は写りにくく、水が引いた後の場所は分かりません。国の地方整備局の報告でも、SARの判読の課題として挙げられています。5つ目、観測は衛星の通過を待ちます。無償のSentinel-1は1機あたり12日の周期で、観測日を選べません。観測がピークの水位を逃すと、推定される範囲と深さは最大のときより小さくなります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 公表された2つの解析例は、どちらも無償のSentinel-1のデータ
      - 範囲と深さの推定そのものは、無償データで可能。データ費は0円
      - 観測日は選べない。周期は1機あたり12日。ピークを逃しうる
      - すぐ結果が要るなら、商用衛星の撮像要請か緊急観測の枠組みが要る
    say: では、無償の衛星でどこまでできるでしょうか。公表されている2つの解析例は、どちらも無償のSentinel-1のデータで作られています。つまり、浸水の範囲と深さの推定そのものは、無償データで可能です。データの費用は0円です。一方で、観測日は選べません。1機あたりの周期は12日で、ピークの水位を逃すことがあります。発災からすぐに結果が要る業務には、商用衛星に撮像を要請するか、緊急観測の枠組みを別に用意する必要があります。

  - kind: table
    heading: 有償の画像を使うと、いくらか（概算）
    columns: [項目, 仮定と計算]
    widths: [0.24, 0.72]
    rows:
      - [画像, 商用SAR衛星の撮像要請。公開価格の例：1m分解能・5km四方の1枚 675米ドル（2025年12月更新）]
      - [範囲, "仮定：浸水域を5km四方の1〜2枚で覆う"]
      - [1回の画像代, "675ドル × 1〜2枚 ＝ 675〜1,350ドル。1ドル150円なら 約10万〜20万円"]
      - [別にかかるもの, 解析サービスの利用料（非公開、定額利用）、標高・道路・建物のデータ整備、現地確認]
      - [注意, この事例で使われた衛星や価格ではない。価格は変わるので、提案の前に確かめる]
    say: 有償の画像を使う場合の概算です。これは仮定を置いた計算で、見積もりではありません。解析サービスの料金は公開されていません。定額利用の形で提供されるとされています。商用のSAR衛星で撮像を要請する場合の参考として、ある事業者の公開価格は、1メートル分解能、5キロメートル四方の1枚で675米ドルです。2025年12月に更新された価格ページの値です。浸水域を5キロ四方の1枚から2枚で覆うと仮定すると、1回の画像代は675ドルから1,350ドル。1ドル150円なら、約10万円から20万円です。これに、解析サービスの利用料と、標高、道路、建物のデータの整備、そして現地確認が別にかかります。この価格は、この事例で使われた衛星や価格ではありません。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [使う判断, 救援と調査の順番、経路の選定, 被害の認定、保険金の支払いの確定]
      - [地形, 平野部で、標高データが整っている, 住宅密集地、標高データが粗い場所]
      - [時間, 観測の翌日以降に全体像を知りたい, 発災から数時間で確定値が要る]
      - [受け取る数字, 推計と仮定を一緒に受け取れる, 件数を確定値として扱いたい]
      - [体制, 現地で深さを確かめ、差を記録できる, 推定値だけで判断を終えたい]
    say: 最後に、向き不向きです。向いているのは、救援と調査の順番や経路を決める判断で、平野部で標高データが整っていて、観測の翌日以降に全体像を知りたい場合です。推計と仮定を一緒に受け取り、現地で深さを確かめて差を記録できる体制があることも条件です。逆に、被害の認定や保険金の支払いを確定したい、住宅が密集する市街地、標高データが粗い、発災から数時間で確定値が要る、件数を確定値として扱いたい、という場合は向きません。提案するときは、最初に顧客の標高データの精度を聞くこと。「浸水深が分かる」と言い切らず、「救援の順番を決める材料」と言うこと。無償データの限界を先に説明することが要点です。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：Synspective「Analysing the Abukuma River Flood (2019) with Flood Damage Assessment」（2020年12月11日） https://synspective.com/usecase/2020/fda1"
      - "出典：Synspective「Analyzing the flood damage from the Rokkaku River in Saga Prefecture (Kyushu)」（2021年8月19日） https://synspective.com/usecase/2021/fda2"
      - "出典：Synspective プレスリリース「SAR-based Flood Damage Assessment Solution Service」（2020年12月10日）"
      - "　https://synspective.com/press-release/2020/synspective-announces-the-release-of-sar-based-flood-damage-assessment-solution-service/"
      - "出典：国土地理院 関東地方測量部「国土地理院における災害対応支援の取組み」（2018年9月） https://www.ktr.mlit.go.jp/ktr_content/content/000717693.pdf"
      - "出典：国土交通省 中部地方整備局「衛星画像を活用した浸水域判読」（2023年度 管内技術研究発表会） https://www.cbr.mlit.go.jp/kikaku/2023kannai/pdf/re02_07.pdf"
      - "価格：Umbra「Pricing」（2025年12月19日更新） https://umbra.space/pricing/"
      - "衛星の仕様：Copernicus SentiWiki「Sentinel-1 Mission」"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
