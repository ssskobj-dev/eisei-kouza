# ユースケース解説動画の台本。元の記事：casebook/flood-forecast-nagano-cmap.qmd
title: 衛星データの洪水予測を保険会社が自治体に配信：長野県28市町村・30時間以上先
series: CASEBOOK
kicker: ユースケース解説
number: 62
total: 221
thumb: 30時間前の洪水予測
summary: 損害保険会社が、東京大学とJAXAの洪水予測（約1km格子、最大30時間以上先）を自社の地図サービスに載せ、長野県と28市町村の職員に配信している共同研究の事例。業務のどこに入れ、何を決める材料になるか、職員にしか配信できない法の制約と予測の空振りという限界、費用がかかる所までを6分で解説します。
scenes:
  - kind: cover
    heading: 洪水の予測を、保険会社が職員に届ける
    sub: 長野県の共同研究。約1km格子、最大30時間以上先
    say: 川の水位が上がる前に、施設の点検と人の配置を始める方法はあるか。答えは、研究機関の洪水予測を、保険会社の地図サービスに載せて職員に配信することです。長野県では、東京大学とJAXAが運用する約1キロメートル格子、最大30時間以上先の洪水予測が、県と28市町村の職員に届いています。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。職員にしか配信できない法の制約と、予測の空振りという限界、費用がどこにかかるかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。長野県と県内の市町村
      - 誰が：損害保険会社（配信）、東京大学とJAXA（予測）、長野県（検証）
      - 何のために：ダム、下水道施設、水位計などの点検と、職員の配置を前から準備する
      - 困りごと：2019年の東日本台風で千曲川が決壊。従来の洪水予報は最長でも6時間前
    say: 事例の舞台は、日本の長野県と、県内の市町村です。配信と画面を担うのは損害保険会社、予測を作るのは東京大学と宇宙航空研究開発機構、JAXA、検証と観測データの提供を担うのが長野県です。2021年10月に、名古屋大学も加えた共同研究として始まり、科学技術振興機構、JSTの支援を受けています。目的は、ダム、下水道施設、水位計などの施設の点検と、職員の配置を、もっと前から準備することです。長野県は2019年の東日本台風で千曲川が決壊しました。従来の洪水予報は、最長でも6時間前の発令です。その時間を、予測で前に伸ばそうという取り組みです。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-flood-forecast-nagano-cmap/flow.svg
    caption: 入る位置は、台風の前。点検と人員の配置を決める前に、危険度の地図とメールが届く
    say: 業務の流れを見ます。まず、自治体と共同研究の契約を結び、予測の利用者を職員に限る条件を決めます。次に、役割を分けます。予測は研究機関が作り、保険会社は配信と画面、自治体は観測データの提供と検証です。保険会社は、2019年6月から無償で公開してきた被害予測の地図サービスに、洪水予測のデータを載せ、2022年1月から県庁で検証を始めました。地図には水位計、ダム、下水道施設などの県有施設が表示され、予測の地点との距離を確かめられます。危険度が上がると、職員に警戒メールが自動で届きます。その後、2023年3月末に県庁と県内28市町村へ広がりました。入る位置は、台風の前です。点検と人員の配置を決める前に、危険度の地図とメールが届きます。

  - kind: figure
    heading: 衛星と予測に任せることと、職員が行うこと
    image: figures/usecase-flood-forecast-nagano-cmap/split.svg
    say: 役割の分担はこうなります。衛星と予測が行うのは、衛星の観測データと気象庁の予報から河川の流量を計算し、約1キロメートル格子で洪水の危険度を出し、危険度が上がったらメールで知らせることです。職員が行うのは、危険度の上がった川の近くの施設を確かめること、点検と人員の配置を前倒しすること、そして予測が外れたときの対応を決めておくことです。段階は実証、つまり共同研究です。長野県はこの地図を、災害対策の意思決定を支える参考情報と位置づけ、業務に不可欠な基盤システムとしては想定していないと述べています。共同研究は続いており、JSTの支援は2028年度まで、県内77市町村での活用の可能性を検証する予定です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 形式, 決められること]
    widths: [0.34, 0.30, 0.36]
    rows:
      - [河川ごとの洪水の危険度の予測, 地図上の色分け（約1km格子、最大30時間以上先）, どの川の周りの施設を先に確かめるか]
      - [危険度に応じた警戒メール, 自動配信のメール, 点検と人員の配置を、いつから前倒しするか]
      - [予測の地点と施設の距離, 地図上の表示, 水位計、ダム、下水道施設のうち、どこを先に見るか]
      - [予測の当たり外れの記録, 自治体と研究機関が記録, 翌年も同じ使い方を続けるか、警戒のレベルの基準を変えるか]
    say: 受け取るデータと、それで決められることを整理します。河川ごとの洪水の危険度の予測は、地図上の色分けで届き、どの川の周りの施設を先に確かめるかの根拠になります。危険度に応じた警戒メールは、点検と人員の配置をいつから前倒しするかを決める合図です。予測の地点と施設の距離は、水位計、ダム、下水道施設のうち、どこを先に見るかを決める材料です。4つ目の、予測の当たり外れの記録は、長野県の公表資料にはない、記事の提案です。空振りする予測を使い続けるには、どのレベルで動くかの基準を、記録をもとに見直すことが要ります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-flood-forecast-nagano-cmap/limits.svg
    say: 限界を5つ見ます。1つ目、配信できるのは、共同研究に参加する職員だけです。気象業務法に沿い、この予測は共同研究に参加する自治体などにしか提供されません。保険の契約者への配信はできません。2023年の法改正で、洪水の予報業務の許可基準が新設され、民間が予報を出す道は制度として整いつつありますが、この事例で契約者への配信が始まったという公表はありません。2つ目、予測は空振りします。2019年の東日本台風では、破堤した142地点のうち129地点で、平均32.3時間前から警報に相当する予測が出ていました。一方で、空振りの率は時点によって約60から90パーセントでした。参考として、気象庁の洪水警報の空振り率も70から90パーセント程度とされています。3つ目、約1キロメートル格子の予測なので、分かるのは、この川のこの区間で危険度が上がる、というところまでです。4つ目、使えるのは参考情報としてです。法律にもとづいて動く防災の部署は使いにくく、長野県ではDX推進課が主導しています。施設管理の部署では参考にしやすいという声があります。5つ目、長野県での運用の精度、つまり何回当たり、何回外れたかの数字は、公表されていません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 予測の入力は公的なデータ。衛星の観測データと、気象庁の予報
      - 予測そのものは研究機関のシミュレーション。誰でも使える形では提供されていない
      - 30時間以上先の予測は、法の制約で一般に公開できない
      - 無償の衛星データを集めてくれば成り立つ、という型ではない
    say: では、無償の衛星でどこまでできるでしょうか。この事例で衛星は、予測の入力の一部です。入力になる衛星の観測データと気象庁の予報は、公的なものです。しかし、予測そのものは研究機関のシミュレーションで、誰でも使える形では提供されていません。30時間以上先の予測は、法の制約で一般に公開できません。つまり、無償の衛星データを集めてくれば成り立つ、という型ではありません。衛星画像で浸水の広がりを見る使い方とは別物で、職員が見るのは河川の危険度の地図です。

  - kind: table
    heading: 費用がかかる所（金額は非公開）
    columns: [項目, 中身]
    widths: [0.28, 0.72]
    rows:
      - [予測の計算, 大学と宇宙機関が運用。共同研究の枠の外で使う場合の費用は非公表]
      - [地図サービスの開発と運用, 保険会社の側の費用。もとの地図サービスは2019年から無償で公開]
      - [自治体の観測データの整備, 長野県は水位と雨量のデータをまとめる連携基盤を2023年3月に構築]
      - [職員の時間, 勉強会、ワークショップ、当たり外れの記録。なくならない]
    say: 費用の話です。この事例は共同研究として行われ、費用は公表されていません。長野県は、地図サービスと連携基盤を県が所有、運営し、市町村は費用を負担していないと述べています。そのため、この動画では金額を出しません。費用がかかる所は4つです。1つ目、予測の計算。大学と宇宙機関が運用し、共同研究の枠の外で使う場合の費用は公表されていません。2つ目、地図サービスの開発と運用で、保険会社の側の費用です。3つ目、自治体の観測データの整備。長野県は、県と市町村がばらばらに持っていた水位と雨量のデータをまとめる連携基盤を作りました。4つ目、職員の時間。勉強会、ワークショップ、当たり外れの記録はなくなりません。長野県は、防災以外に広げて市町村が目的を持って使う段階になれば、費用負担の議論が要るとしています。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [配信の相手, 共同研究に参加する自治体の職員, 保険の契約者、住民、取引先]
      - [使う部署, 施設管理、人員配置を決める部署, 法律にもとづき警報を出す防災の部署]
      - [求めるもの, 「どの川の周りを先に見るか」の順番づけ, 家ごとの浸水の有無、浸水の深さ]
      - [空振りの扱い, 外れても動く、と決められる, 当たる予測だけを使いたい]
      - [体制, 研究機関、自治体と役割を分けられる, 保険会社だけで予測も作りたい]
    say: 最後に、向き不向きです。向いているのは、配信の相手が共同研究に参加する自治体の職員で、使う部署が施設管理や人員配置を決める部署、求めるものがどの川の周りを先に見るかの順番づけで、外れても動くと決められ、研究機関や自治体と役割を分けられる体制です。逆に、契約者や住民に配信したい、法律にもとづいて警報を出す防災の部署で使いたい、家ごとの浸水の有無や深さを知りたい、当たる予測だけを使いたい、保険会社だけで予測も作りたい、という場合は向きません。提案するときの要点は3つです。最初に、配信の相手が誰かを聞くこと。30時間前に分かる、を単独で言わず、空振りの率とセットで示すこと。そして、衛星が主役だと言わないことです。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：あいおいニッセイ同和損保「『予測データ活用型流域治水』の長野県での検証開始」（2022年1月26日） https://www.aioinissaydowa.co.jp/corporate/about/news/pdf/2022/news_2022012500936.pdf"
      - "出典：国土交通省 スマートシティ官民連携PF「自治体インタビュー 長野県」（令和4年度） https://www.mlit.go.jp/scpf/efforts/docs/interview/R4_%E9%95%B7%E9%87%8E%E7%9C%8C.pdf"
      - "出典：あいおいニッセイ同和損保「『流域治水オフィシャルサポーター』に認定」（2023年7月4日） https://www.aioinissaydowa.co.jp/corporate/about/news/pdf/2023/news_2023070301178.pdf"
      - "出典：芳村圭「Today's Earthについて」洪水及び土砂災害の予報のあり方に関する検討会 資料（気象庁、2021年5月） https://www.jma.go.jp/jma/kishou/shingikai/kentoukai/arikata/part3/siryou4-3_3.pdf"
      - "出典：気象庁「気象業務法及び水防法の一部を改正する法律の施行について（説明会資料）」（2023年10月5日） https://www.jma.go.jp/jma/kishou/minkan/setsumei231005/shiryo231005.pdf"
      - "出典：農林水産省「令和7年度 農山漁村振興への貢献活動に係る取組証明書」（2026年3月13日） https://www.maff.go.jp/j/nousin/kanmin_kyousou/panels/torikumi_certificate/attach/pdf/r7_shutoku-1.pdf"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、配信の相手と制度の整理から、条件の比較までを行います。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
