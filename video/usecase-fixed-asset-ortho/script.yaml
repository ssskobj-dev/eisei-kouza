# ユースケース解説動画の台本。元の記事：casebook/fixed-asset-ortho.qmd
title: 衛星データで固定資産の現況確認：約6km²の画像が約6万円
series: CASEBOOK
kicker: ユースケース解説
number: 17
total: 221
thumb: 6km²が約6万円
summary: 市町村の固定資産税の現況確認に、整備済みの衛星オルソ画像を使う事例。航空写真を撮らない年をどう埋めるか、業務のどこに入れ、何を決める材料になるか、公表されている費用の例と限界までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで固定資産の現況確認
    sub: 航空写真のない年を、約6km²で約6万円の衛星画像で埋める
    say: 航空写真を撮らない年の、土地と家屋の現況確認を、衛星データで埋められるか。答えは、埋められます。ただし、届くのは画像までで、変化を拾う作業と現地確認は残ります。公表されている例では、東京都狛江市の約6平方キロの画像の提供が約6万円でした。この動画では、市町村の資産税の担当者が、業務のどこに入れて、何を決める材料にするのか。無償の衛星でどこまでできて、有償の画像を買うといくらかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。市町村の資産税の担当課
      - 何のために：固定資産税を適正に課すための、土地と家屋の現況調査
      - 今のやり方：約9割の市町村が航空写真を使い、数年に1度、判読を委託する
      - 困りごと：航空写真のない年は、新築や取り壊し、土地の変化を拾えない
    say: 事例の舞台は日本の市町村、担当するのは資産税の担当課です。市町村は、固定資産税を適正に課すために、土地と家屋の現況を調べる義務があります。総務省の2024年4月の通知によると、約9割の市町村が航空写真を使っています。多くは数年に1度、写真を撮って判読を委託し、家屋の新築や取り壊し、土地の利用の変化を拾います。困りごとは、航空写真の間の年です。愛知県半田市は、3年に1度の航空写真では足りないとして、衛星画像を年6回撮り、2か月ごとの差分で市内全域の変化を把握しています。滋賀県甲賀市も、航空写真を補うために市内全域の衛星画像を取り、大きな開発の確認に使って、現地調査の回数を減らしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-fixed-asset-ortho/flow.svg
    caption: 航空写真を撮らない年に、机上で異動の候補を探す
    say: 業務の流れを見ます。入る位置は、航空写真を撮らない年の、現況調査の最初です。まず、市域の範囲と、画像の撮影時期を確かめて注文します。撮影が古い地区があれば、その地区は候補から外します。次に、受け取った画像を、地図のソフトで課税台帳の図面に重ねます。そして、前回の航空写真や前年の画像と見比べて、建物の形や土地の利用が変わった場所を候補として拾います。候補の場所を現地で確かめ、台帳を直し、翌年の航空写真の撮影計画に反映します。衛星の画像は、現地確認の代わりではなく、どこを見に行くかを決める材料です。

  - kind: figure
    heading: 衛星が担うことと、人が行うこと
    image: figures/usecase-fixed-asset-ortho/split.svg
    say: 役割の分担はこうなります。衛星の画像が担うのは、市域全体を同じ時期に写すことと、航空写真のない年を埋めることです。担当者が行うのは、課税の図面と重ねて異動の候補を探すこと、現地で確かめること、台帳を直すことです。ここで大事なのは、受け取るのが画像だという点です。家屋の新築や取り壊しを拾うには、人の判読か、画像解析の委託が別に要ります。狛江市の例も、画像を提供した事例として公表されているもので、どの年度に、どの手順で使い、現地確認が何件減ったかは公表されていません。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [市域のオルソ画像（地図のソフトで重ねられる形）, 航空写真のない年に、机上で現況を確かめる範囲]
      - [画像に付く撮影年の情報, 古い地区を候補から外すか、別の方法で確かめるか]
      - [前回との比較で拾った異動の候補の一覧, 現地確認に行く家屋と土地の順番]
      - [近赤外を含む4バンドの画像, 緑地や農地の利用の変化を拾う補助]
    say: 受け取るものと、それで決められることを整理します。市域のオルソ画像は、航空写真のない年に、机上で現況を確かめる範囲の根拠になります。オルソ画像とは、衛星の画像を地図と同じ位置に合うように補正したもので、課税の図面に重ねて使えます。画像に付く撮影年の情報は、古い地区を候補から外すか、別の方法で確かめるかの判断に使います。前回との比較で拾った異動の候補の一覧が、現地確認に行く家屋と土地の順番を決めます。近赤外を含む4バンドの画像は、緑地や農地の利用の変化を拾う補助になります。候補の一覧を誰がどの基準で作るかを、画像の注文より先に決めておくと、現地確認の件数を見積もれます。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-fixed-asset-ortho/limits.svg
    say: 限界は5つです。1つ目、異動の抽出は別の作業です。判読か解析を人が行うか委託します。総務省の通知が紹介する人工知能による判読は航空写真を対象にしたもので、100平方メートル以上を基準に差分を拾い、土地の判読の精度はまだ十分でないとされています。2つ目、航空写真より細かくは見えません。半田市の例でも、航空写真の方が高解像度で、目視で分かりにくい土地があるとされています。3つ目、光学の衛星なので、雲がかかるとその下は写せません。4つ目、撮影の時期は場所によってばらつきます。全国の整備済みデータは、国土の50パーセント以上が2022年、95パーセント以上が2020年以降の撮影で、場所によっては数年前の画像になります。5つ目、家屋の内部の構造、用途、所有者の変更は画像では分かりません。これらは申告、登記、現地で把握するものです。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 無償で使える衛星の画像は10m級。家屋1棟の形を見分けるには足りない
      - 家屋の現況確認には、30〜40cm級の商用の画像か航空写真が要る
      - 造成や太陽光発電所など大きな変化なら、無償の画像で足りる場合がある
      - 無償データの評価は出典に無く、記事の一般的な知識からの整理
    say: では、無償の衛星でどこまでできるでしょうか。無償で使える衛星の画像は、画素が10メートル級です。家屋1棟の形を見分けるには足りません。家屋の現況確認には、30から40センチ級の商用の画像か、航空写真が要ります。一方で、造成や太陽光発電所のような、市域の大きな変化を拾う用途なら、無償の画像で間に合う場合があります。なお、この整理は記事が一般的な知識から書いたもので、事例の出典に無償データの評価はありません。使う前に、自分の市域の画像で試してから決めてください。

  - kind: table
    heading: 有償の画像を使うと、いくらか（公表例と仮定）
    columns: [項目, 公表例と仮定]
    widths: [0.34, 0.66]
    rows:
      - [公表例1, "狛江市。約6km²（16メッシュ）の画像提供が約6万円（2021年の事例集）"]
      - [公表例2, "別府市。約125km²（151メッシュ）の画像提供が約38万円。緑の基本計画のため（同）"]
      - [年の画像代, "仮定：市域が約6km²で、航空写真のない年に1回買う。公表例なら約6万円"]
      - [画像の更新, 整備済みデータの更新は年1回が目安。同じ年に2回買っても新しい画像とは限らない]
      - [別にかかるもの, 判読か解析の委託費（金額は非公開）、現地確認、課税の図面を地図のソフトで扱える形にする整備]
    say: 有償の画像の費用です。公表されている金額は2つあります。狛江市の、約6平方キロ、16メッシュで、画像の提供が約6万円。別府市の、約125平方キロ、151メッシュで約38万円です。どちらも2021年の事例集の値で、現在の価格は提供元に確かめる必要があります。ここから仮定を置くと、市域が約6平方キロで、航空写真のない年に1回買うなら、公表例のとおりで約6万円です。これは見積もりではありません。注意点は、整備済みのデータの更新が年1回を目安という点です。同じ年に2回買っても、新しい画像とは限りません。この金額は画像の提供だけです。異動の候補を拾う判読か解析の委託費は公開されておらず、現地確認は候補の数に比例して残ります。課税の図面が紙だけなら、地図のソフトで扱える形にする整備が最初にかかります。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [目的, 航空写真のない年の、市域全体の変化の把握, 増築や小さな構造物の確認]
      - [対象の大きさ, 造成、太陽光発電所、建物の新築と取り壊し, 用途の変更、内部の構造]
      - [図面, 課税の図面が地図のソフトで扱える, 紙の図面だけ]
      - [時期, 撮影時期が新しい地区, 数年前の画像しかない地区]
      - [体制, 判読の基準と現地確認の担当が決まっている, 画像を買えば異動が分かると考えている]
    say: 最後に、向き不向きです。向いているのは、航空写真のない年に市域全体の変化を把握したい、造成や太陽光発電所、建物の新築と取り壊しのような大きさの対象を見たい、課税の図面が地図のソフトで扱える、撮影時期が新しい、判読の基準と現地確認の担当が決まっている、という自治体です。逆に、増築や小さな構造物を確かめたい、用途の変更や内部まで知りたい、紙の図面しかない、数年前の画像しかない、画像を買えば異動が分かると考えている、という場合は向きません。提案するときは、最初に航空写真の周期と図面の形を聞くこと、現地確認がなくなると言わないこと、画像の費用と判読の費用を分けて示すことが要点です。

  - kind: cta
    heading: 自分の自治体で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：総務省「固定資産の現況調査に係る実態調査の調査結果及び先進事例について」（総税評第17号、2024年4月1日） https://www.soumu.go.jp/main_content/000939731.pdf"
      - "価格：NTTデータ・RESTEC「自治体様の現地確認業務を効率化」（AW3D事例集、2021年） https://www.aw3d.jp/wp/wp-content/uploads/2021/12/Library_municipality.pdf"
      - "仕様：NTTデータ「AW3D日本全国データセット オルソ画像 2023年度版を提供開始」（2023年10月20日） https://www.nttdata.com/global/ja/news/topics/2023/102000"
    say: この事例をもとに、自分の自治体や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
