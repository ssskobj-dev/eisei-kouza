# ユースケース解説動画の台本。元の記事：casebook/eudr-plot-check.qmd
title: 衛星データでEUDRの調達地を確かめる：年3,990ユーロの照合と限界
series: CASEBOOK
kicker: ユースケース解説
number: 43
total: 221
thumb: 森林減少を照合
summary: EUの森林減少防止規則（EUDR）は2026年12月30日から適用。原料の生産区画の位置情報を、衛星データの森林減少の地図と照合する仕組みを、公表されている年額、日陰栽培のコーヒーやカカオを見分けられない限界まで6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データでEUDRの調達地を確かめる
    sub: 区画の位置情報を、森林減少の地図と照合する
    say: 数千、数万の生産区画について、森林が減っていないことを一つずつ確かめる方法はあるか。答えは、仕入先から集めた区画の位置情報を、衛星データから作られた森林減少の地図に重ねて、怪しい区画だけを拾い出すことです。EUの森林減少防止規則、EUDRは、2026年12月30日から適用されます。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。公表されている料金はいくらで、衛星では何が分からないのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 制度：EUの森林減少防止規則（EUDR）。適用は2026年12月30日から。零細・小規模の事業者は2027年6月30日から
      - 対象：牛、カカオ、コーヒー、パーム油、ゴム、大豆、木材と、それらから作る製品
      - 誰が：EUで売る、EUから輸出する企業の調達部門。事例はドイツの解析企業のサービス
      - 示すこと：原料の区画で、2020年12月31日より後に森林減少がないこと
    say: 事例の舞台は、EUに食品や木材を出す企業の調達部門です。EUDRの対象は、牛、カカオ、コーヒー、パーム油、ゴム、大豆、木材と、それらから作る製品です。企業は、原料が生産されたすべての区画の位置情報を集め、2020年12月31日より後にその土地で森林が減っていないことを示す必要があります。適用は2026年12月30日から、零細・小規模の事業者は2027年6月30日からです。従来は仕入先の証明書や自己申告でしたが、区画が数万になると、人が画像を1枚ずつ見る方法では間に合いません。そこで、ドイツの衛星データ解析企業が、区画を公開の森林減少データと照合するソフトウェアを定額で提供しています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-eudr-plot-check/flow.svg
    caption: 位置情報を集めた後、声明を出す前に、衛星の照合を入れる
    say: 業務の流れを見ます。衛星の照合が入るのは、仕入先から位置情報を集めた後、声明を出す前です。まず、対象の品目と、EUに出る製品の原料の仕入先を洗い出します。次に、仕入先から区画ごとの座標を集めます。牛以外の品目で4ヘクタールを超える区画は、点ではなく多角形で示します。集めた区画を、衛星データの森林減少の地図と照合し、基準日の後に減少の印が付いた区画を拾います。印の付いた区画は、書類と現地で確かめます。最後に、結果をデューデリジェンス声明にまとめて、EUの情報システムに提出します。準備で一番重いのは、2番目の位置情報の収集です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-eudr-plot-check/split.svg
    say: 役割の分担はこうなります。衛星データの照合が行うのは、区画ごとに基準日の後の森林減少の有無を判定することと、リスクの高い区画を拾い出すことです。人が行うのは、仕入先から区画の位置情報を集めること、疑わしい区画を現地や書類で確かめること、そして声明を提出することです。事例のサービスでは、仕入先が区画の位置情報を登録すると、公開の森林減少データとの照合で区画ごとのリスクが示されます。2024年3月には、位置情報を数の制限なく入れられる無料の試験版も発表されました。ただし同社は、公開の森林被覆データの精度は世界の地域によって不正確になりやすいと認めています。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [区画ごとの森林減少の有無と、リスクの点数の一覧, どの仕入先から買うか。どの区画に追加の確認を求めるか]
      - [印の付いた区画の、2時期の衛星画像の比較, 日陰栽培か伐採か。基準日の前か後かの見当]
      - [仕入先ごとの書類の提出状況, どの仕入先に催促するか。取引の継続]
      - [声明の提出記録（EUの情報システム）, 当局の照会への対応。監査の根拠]
    say: 受け取るデータと、それで決められることを整理します。区画ごとの森林減少の有無とリスクの点数は、どの仕入先から買うか、どの区画に追加の確認を求めるかの根拠になります。印の付いた区画の2時期の画像を比べると、日陰栽培なのか伐採なのか、基準日の前なのか後なのかの見当が付きます。仕入先ごとの書類の提出状況からは、どこに催促するか、取引を続けるかを決めます。声明の提出記録は、当局の照会や監査の根拠になります。注意したいのは、声明は仕入先ごとではなく、出荷ごとに要る点です。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-eudr-plot-check/limits.svg
    say: 限界を5つ挙げます。1つ目、日陰で育てるコーヒーやカカオの農園は、上から見ると森林に見えます。2つ目、地図の定義のずれです。2025年の研究が世界の21種類の森林の地図を調べたところ、EUDRの森林の定義に合う指標をすべて満たしたのは2つだけでした。メキシコの1から5ヘクタールのコーヒー農園600区画では、何十年も続く農園なのに、約4分の3が地図上では不適合と示されました。3つ目、多くの地図は過去の森林を多めに見積もるので、基準日より前に開かれた土地が、最近の森林減少として印が付くことがあります。4つ目、区画の位置情報がなければ照合は始まりません。5つ目、合法性は衛星では分かりません。EUDRは生産国の法令に従っていることも求めますが、土地の権利や労働の法令は画像からは分かりません。

  - kind: bullets
    heading: 無償の衛星データで、どこまでできるか
    items:
      - 事例のProfessional版は、公開（オープンソース）の森林減少データで照合する。衛星画像の購入費は含まれない
      - 無料の試験版は、位置情報の数に制限なく、森林被覆データにもとづくリスクの目安を出す
      - 公開データの精度は地域によって不正確になりやすい、と同社も認めている
      - 高分解能の画像をAIで解析する精査は上位版。誤分類を最大98%減らすと同社は説明（第三者の検証は未公表）
    say: では、無償の衛星データでどこまでできるでしょうか。この事例のProfessional版は、公開の森林減少データとの照合で成り立っていて、衛星画像の購入費は含まれていません。無料の試験版も、位置情報の数に制限なく、森林被覆データにもとづくリスクの目安を出します。つまり、怪しい区画を拾うところまでは、無償データで成り立つ構成です。一方で、公開データの精度は地域によって不正確になりやすいと、同社自身が認めています。高分解能の画像をAIで解析して土地利用の変化を見る精査は上位版で、誤分類を最大98パーセント減らすと同社は説明していますが、第三者の検証は公表されていません。

  - kind: table
    heading: 費用の考え方（公表されている年額）
    columns: [項目, 公表されている条件と仮定]
    widths: [0.3, 0.7]
    rows:
      - [Professional版, "年額3,990ユーロ（契約時に1,197ユーロ、3か月後に残額。3か月後に解約できる）"]
      - [含まれるもの, 仕入先のリスク判定は5社まで。声明の提出は年50件まで。区画と位置情報の数は無制限]
      - [追加, "仮定：仕入先が6〜20社なら、1社あたり月15ユーロを足す。21社以上はEnterprise版（金額は非公開）"]
      - [料金の外, "仮定：仕入先から座標を集める費用、印の付いた区画の確認、声明を作る人件費が別にかかる"]
    say: 費用です。これは1社の公表価格で、ほかの事業者の価格ではありません。Professional版は年額3,990ユーロ。契約時に1,197ユーロを払い、3か月後に残額を払う形で、3か月後に解約できます。含まれるのは、仕入先のリスク判定が5社まで、声明の提出が年50件まで、区画と位置情報の数は無制限です。仮定として、仕入先が6社から20社なら、1社あたり月15ユーロを足します。21社以上や、複数の利用者、API連携、専門チームの確認が要る場合はEnterprise版で、金額は公開されていません。そして料金の外に、仕入先から座標を集める費用、印の付いた区画の確認、声明を作る人件費が残ります。小農が多い産地では、座標の収集が最も大きな費用になります。価格は変わるので、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [仕入先, 大規模農園。座標を出せる仕入先, 座標のない小農が多く、集める仕組みがない]
      - [品目と栽培, 大豆、パーム油、牛の放牧地など開けた土地, 日陰栽培のコーヒー、カカオ、ゴム]
      - [区画の大きさ, 4ha超で、多角形の位置情報がある, 1ha未満の小さな区画]
      - [確かめたいこと, 基準日の後の森林減少の有無, 生産国の法令への適合、土地の権利]
      - [体制, 印の付いた区画を書類と現地で確かめられる, 衛星の判定だけで取引の可否を決めたい]
    say: 最後に、向き不向きです。向いているのは、大規模な農園や座標を出せる仕入先から、大豆、パーム油、牛の放牧地のような開けた土地の原料を買っていて、区画が4ヘクタールを超え、印の付いた区画を書類と現地で確かめられる体制がある企業です。逆に、座標のない小農が多くて集める仕組みがない、日陰栽培のコーヒーやカカオ、ゴムが主な品目、1ヘクタール未満の小さな区画ばかり、法令への適合や土地の権利まで衛星で確かめたい、衛星の判定だけで取引の可否を決めたい、という場合は向きません。提案するときの要点は3つ。最初に、仕入先の座標がどこまで集まっているかを聞くこと。衛星で適合を証明できるとは言わないこと。日陰栽培の産地では、地図の限界を先に伝えることです。印が付いた区画を自動で取引停止にすると、小農を排除する副作用があります。

  - kind: cta
    heading: 自社の調達で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：LiveEO「TradeAware」の料金とよくある質問のページ https://www.live-eo.com/tradeaware-pricing"
      - "出典：LiveEO プレスリリース「LiveEO launches free EUDR compliance tool TradeAware Lite」（2024年3月13日）"
      - "出典：Regulation (EU) 2023/1115（第2条、第9条）、European Commission「Deforestation Regulation implementation」"
      - "出典：Finnish Customs「Application of the Deforestation Regulation delayed another year」（規則(EU) 2025/2650、2025年12月19日採択）"
      - "出典：Mongabay（2025年12月19日）Freitas Beyer, Köthke & Lippe (2025) Remote Sensing 17(17), 3012 の紹介"
      - "価格：LiveEO の料金ページの公表価格（2026年11月4日に確認）。ユーロ建て。見積もりではありません"
    say: この事例をもとに、自社の調達や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
