# ユースケース解説動画の台本。元の記事：casebook/coastline-erosion-monitoring.qmd
title: 衛星データで海岸線の後退を追う：国総研が無償の10m画像で台風前後の侵食を捉えた
series: CASEBOOK
kicker: ユースケース解説
number: 82
total: 221
thumb: 海岸線を衛星で
summary: 国土技術政策総合研究所が、無償の約10mの衛星画像から海岸線を抜き出し、2019年の台風19号の前後の清水海岸の侵食を捉えた事例。海岸管理者の業務のどこに入り、何を決める材料になるか、高分解能にしても測量の精度に届かない理由、国の工程表での位置づけまでを6分で解説します。
scenes:
  - kind: cover
    heading: 海岸線の後退を衛星で追う
    sub: 国総研の試行と、測量の精度に届かない理由
    say: 全国の砂浜の後退を、測量を待たずに追い続ける方法はあるか。答えは、繰り返し撮られる衛星画像から海岸線を抜き出し、年ごとの推移を見ることです。国土技術政策総合研究所、国総研は、無償の約10メートルの画像で、2019年の台風19号の前後に起きた清水海岸の侵食を捉えました。ただし、画像を細かくしても、測量の精度には届いていません。この動画では、誰が、業務のどこに入れて、何を決める材料にするのか。無償の衛星でどこまでできて、費用はどこにかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。国総研の海岸研究室が2023年度から検討
      - 誰が：使うのは国や都道府県の海岸管理者。仕組みは研究機関が構築中
      - 何のために：砂浜の侵食の兆しを早くつかみ、海岸線を継続して見続ける
      - 困りごと：人力の測量は時間と費用がかかり、広く高頻度には把握できない
    say: 事例の舞台は日本です。国総研の河川研究部海岸研究室が、2023年度から、衛星画像を用いた海岸線モニタリングの実用化に向けた検討を進めています。使う側は、国や都道府県の海岸管理者です。目的は、砂浜の侵食の兆しを早くつかみ、海岸線を継続して見続けることです。海岸保全基本方針は2020年11月に変わり、気候変動の影響を考えに入れ、砂浜を順応的に管理する方向になりました。しかし、人力の測量は時間と費用がかかり、広い範囲を高い頻度で把握できません。従来の地形図の読み比べも、数年から十数年に1枚しか作られないため、台風の前後のような短い期間の変化は追えませんでした。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-coastline-erosion-monitoring/flow.svg
    caption: 定期の測量の合間に、衛星の海岸線を入れる
    say: 業務の流れを見ます。入る位置は、定期の測量の合間です。まず、管理する海岸に、海岸に垂直な評価線を決め、公開されている過去の画像から海岸線を抜き出して、地形図の判読の結果と並べます。次に、年に数回、雲のない画像から海岸線を抜き出し、評価線ごとの位置を記録します。画像ごとに、撮影時刻の潮位と波の高さも記録して、位置のぶれの目安を持ちます。後退の傾向が続く評価線や、台風の後に大きく動いた評価線を、現地の測量で確かめます。最後に、測量の結果と合わせて、養浜や施設の整備に早く着手する海岸と、観察を続ける海岸を分けます。衛星は測量の代わりではなく、測量する場所と時期を絞る道具です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-coastline-erosion-monitoring/split.svg
    say: 役割の分担です。衛星と解析が行うのは、繰り返し撮った画像から海岸線を抜き出すこと、評価線ごとに位置の推移を並べること、記録が残る限り過去にさかのぼることです。人が行うのは、潮位と波の影響を読むこと、測量で位置と標高を確かめること、整備の順番を決めることです。国総研の試行では、静岡県の清水海岸を対象に、2019年10月12日に台風19号が通過する前の9月と、通過した後の12月の画像から海岸線を抜き出しました。12月の海岸線は9月より後退しており、変化を捉えられることが確かめられました。抜き出した海岸線は、海岸管理者向けのウェブサイトで、評価線ごとの年ごとの推移として見られます。潮位の補正はしていませんが、傾向はおおむね把握でき、2020年以降に海岸線が前に出る様子も確認できたとされています。なお、これは本格運用ではなく、研究の段階です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [評価線ごとの海岸線の位置の推移（グラフ）, 後退が続く海岸、台風で大きく動いた海岸]
      - [画像ごとの海岸線（地図データの線）, 侵食の範囲、離岸堤などの施設の効果の見え方]
      - [過去の画像から抜き出した海岸線, 地形図の判読と合わせた長い期間の傾向]
      - [撮影ごとの潮位と波の条件（表）, 位置のぶれの目安、比べてよい画像の組み合わせ]
    say: 受け取るデータと、それで決められることを整理します。評価線ごとの海岸線の位置の推移は、後退が続く海岸と、台風で大きく動いた海岸を見つける根拠になります。画像ごとの海岸線の地図データからは、侵食の範囲と、離岸堤などの施設の効果の見え方が分かります。過去の画像から抜き出した海岸線は、地形図の判読と合わせて、長い期間の傾向を示します。撮影ごとの潮位と波の条件は、位置のぶれの目安と、比べてよい画像の組み合わせを決める材料です。受け取る位置には、潮位と波によるぶれが含まれます。1回の後退で判断せず、何回かの観測で傾向が続いているかを見るのが基本です。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-coastline-erosion-monitoring/limits.svg
    say: 限界も、国総研の報告にはっきり書かれています。1つ目、高分解能の画像にしても、測量の成果と比べた海岸線の精度は向上しません。画素を細かくすれば正確になる、とは言えないということです。2つ目、その要因は潮位と波の遡上と考えられています。撮影の瞬間の潮の高さと、波が砂浜のどこまで上がっていたかで、画像に写る水際の位置は変わります。3つ目、現在の抽出ツールは、沖合の施設を海岸線と誤認する課題があり、人が結果を確かめる作業が残ります。4つ目、標高や海底の地形は衛星画像からは分からず、砂の量や前浜の勾配は測量で測る必要があります。5つ目、光学衛星は雲の下を写せず、潮位の低い時刻を選んで撮ることもできません。この5つ目は一般的な知識から書いていて、記事では要確認としています。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 試行は、無償で公開されている約10mの光学衛星Sentinelの画像。画像の費用は0円
      - 台風の前後の大きな後退と、年ごとの傾向は捉えられた
      - 国総研の結果：50cm程度の有償の高分解能画像にしても、測量の精度に届かない
      - 雲のある日は使えない。確かめたい時期に、使える画像があるとは限らない
    say: では、無償の衛星でどこまでできるでしょうか。この事例は、無償データで成り立つ使い方です。国総研の試行は、公開されている約10メートルの光学衛星Sentinelの画像で行われ、画像の費用はかかっていません。それでも、台風の前後の大きな後退と、年ごとの傾向は捉えられました。一方、50センチ程度の有償の高分解能画像にしても、測量の精度には届かない、というのが国総研の結果です。高い画像を買う理由は限られます。ただし、雲のある日は使えないので、確かめたい時期に使える画像があるとは限りません。

  - kind: table
    heading: 費用は、どこにかかるか（金額は非公表）
    columns: [かかる所, 中身と仮定]
    widths: [0.3, 0.7]
    rows:
      - [衛星画像, "仮定：約10mの無償の画像で始める。画像代は0円"]
      - [有償の高分解能画像, 測量の精度に届かないという結果から、買う理由は限られる]
      - [抽出のツールと表示の仕組み, 国総研が構築中。情報提供サイトの運用は2028〜2030年度の工程]
      - [分析の人手, 沖合の施設の誤認を確かめる作業、潮位と波の条件の整理]
      - [測量, なくならない。衛星で絞った海岸に、回数を集中させる]
    say: 費用の考え方です。国総研の報告は、衛星画像の利点を比較的安価とするのみで、金額は公表されていません。この記事では、公開された画像の価格を引ける資料がなかったため、金額の概算は出さず、費用がかかる4つの所を整理します。1つ目は衛星画像です。仮定として、約10メートルの無償の画像で始めるとすれば、ここは0円です。50センチ程度の有償画像は、測量の精度に届かないという結果を踏まえると、買う理由が限られます。2つ目は、抽出のツールと表示の仕組みです。国総研が構築中で、国の工程表では、2026年度から2027年度に全国規模の海岸線の調査、2028年度から2030年度に情報提供サイトの運用が示されています。3つ目は分析の人手で、沖合の施設の誤認の確認と、潮位と波の条件の整理です。4つ目は測量で、これはなくなりません。国の仕組みが実務で使える形になるまでは、ツールの整備か、同じことを自分で行う人手が要ります。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [知りたいこと, 海岸線の位置の年ごとの傾向, 砂の量、標高、海底の地形]
      - [変化の大きさ, 台風の前後の大きな後退, 数mの小さな変化]
      - [海岸の形, 長く続く砂浜, 離岸堤や防波堤が多い海岸、岩礁]
      - [時間の幅, 過去にさかのぼった長い期間, 1枚の画像での判断]
      - [体制, 測量と組み合わせて続けられる, 衛星だけで測量を置き換えたい]
    say: 最後に、向き不向きです。向いているのは、長く続く砂浜で、海岸線の位置の年ごとの傾向や、台風の前後の大きな後退を知りたい場合です。過去にさかのぼって長い期間を見ること、測量と組み合わせて続けられる体制も条件です。逆に、砂の量や標高、海底の地形を知りたい、数メートルの小さな変化を捉えたい、離岸堤や防波堤が多い海岸や岩礁である、1枚の画像で判断したい、衛星だけで測量を置き換えたい、という場合は向きません。提案するときの要点は3つです。最初に、測量の代わりにしたいのかを聞くこと。1回の画像で何メートル後退したと言わないこと。そして、国の工程表を前提に、評価線と測量の計画を整える提案にすることです。

  - kind: cta
    heading: 自分の海岸で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：浜口耕平、柴田亮（国総研 河川研究部 海岸研究室）「衛星画像を用いた海岸線モニタリングの実用化に向けた検討」国総研レポート2025"
      - "　　　https://www.nilim.go.jp/lab/bcg/siryou/2025report/ar2025hp019.pdf"
      - "出典：国土交通省「国土交通省インフラ分野の衛星データ利用に関する取組方針」（令和8年8月）本文p.10、別冊p.25"
      - "　　　https://www.mlit.go.jp/tec/content/002020391.pdf"
      - "出典：吉田邦伸（国総研 河川研究部）「インフラ分野における衛星活用リモセン技術の社会実装に向けた検討状況」（2024年12月）"
      - "　　　https://adaptation-platform.nies.go.jp/ccca/conference/2024/1217/pdf/c/s03-nilim.pdf"
      - "費用：金額は非公表。記事に公開価格の引用がないため、画像代の概算は出していない"
    say: この事例をもとに、自分の海岸や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
