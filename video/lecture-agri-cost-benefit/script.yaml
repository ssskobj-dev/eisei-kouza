# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第3部「費用対効果の測り方」（learn/agri/agri-cost-benefit.qmd）
title: 衛星データの営農支援、費用対効果を自分の数字で測る6つの手順
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 11
total: 30
thumb: 費用対効果の測り方
summary: 衛星の生育マップを配信する営農支援サービスは、年間の利用料を払う価値があるのか。事業者の数字ではなく、自分の圃場の数字で測る手順を、導入前の記録から1年後の差し引きまで一緒にやってみます。補助事業と計画認定の調べ方、宿題つき。
voice: もち子
speed: 1.0
scenes:
  - kind: cover
    heading: 費用対効果の測り方
    sub: 導入の前後で比べる項目を決め、1年後に自分の数字で判断する
    say: 衛星の生育マップを配信する営農支援サービスは、年間の利用料を払う価値があるでしょうか。答えは、事業者の数字ではなく、自分の圃場の数字で測ることです。導入前の1年を圃場ごとに記録し、1年後に、減った費用と増えた収入から増えた費用を引きます。この動画では、その手順を6つに分けて、評価の計画を一緒に書いてみます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 導入の前後で比べる項目を決め、導入前の1年を基準として記録できる
      - 利用料だけでなく、農機、研修、通信、自分の時間を含めた費用を並べられる
      - 1年後に、減った費用と増えた収入から増えた費用を引いて、続けるか決められる
      - 補助事業と計画認定の調べ方と、相談先が分かる
    say: この章を終えると、4つのことができるようになります。導入の前後で比べる項目を決め、導入前の1年を基準として記録できること。利用料だけでなく、農機、研修、通信、自分や従業員の時間を含めた費用を並べられること。1年後に、減った費用と増えた収入から増えた費用を引いて、続けるかやめるかを決められること。そして、補助事業と計画認定の調べ方と、相談先が分かることです。

  - kind: figure
    heading: 6つの手順の全体
    image: figures/agri-cost-benefit/flow.svg
    caption: 衛星が行うのは生育の地図を出すところまで。記録と判断は人が行う
    say: 全体の流れです。目的を1つに絞る。導入前の1年を圃場ごとに記録し、比べ方を決める。費用を全部並べる。ここまでが導入前です。導入後は、生育の地図を使い、雲で届かなかった回数を記録し、1年後に先に決めた基準で差し引きで評価します。6つのうち、衛星のサービスが行うのは、生育の地図を出すところだけです。残りの5つは、人が決めて、人が記録します。

  - kind: bullets
    heading: 目的を絞り、基準を記録
    lead: 事業者の案内の数字は、農林水産省が効果を確認したものではありません
    items:
      - 目的は1つ：巡回の手間か、追肥のムラか、収穫の順番か
      - 巡回時間：誰が、どの圃場を、月に何回、1回何時間回ったか
      - 資材費：肥料と農薬の購入量と金額を、圃場ごとか品目ごとに
      - 収量と品質：圃場ごとの収量、等級、タンパク含量など出荷先の検査結果
      - 経営全体の合計だけでは、圃場ごとに出る衛星の効果は見えない
    say: 手順の1つ目は、何のために使うかを1つに絞ることです。巡回の手間を減らしたいのか、追肥のムラをなくしたいのか、収穫の順番を決めたいのか。農林水産省の製品・サービス集には、掲載した製品の効果を農林水産省が確認したものではない、という注記があります。自分の圃場で同じ結果が出るかは、自分で測るしかありません。2つ目は、導入前の1年を基準として記録することです。巡回時間は、誰が、どの圃場を、月に何回、1回あたり何時間回ったか。資材費は、肥料と農薬の購入量と金額を、圃場ごとか品目ごとに。収量と品質は、圃場ごとの収量、等級、タンパク含量など、出荷先の検査結果です。よくある抜けは、経営全体の合計しかないことです。衛星の効果は圃場ごとに出るので、合計だけでは見えません。

  - kind: table
    heading: 費用を全部並べる
    columns: [費用の項目, 数え方]
    widths: [0.36, 0.64]
    rows:
      - [利用料, 面積あたりか、診断1回あたりか。含まれるものを確かめる]
      - [農機（可変施肥に対応）, 買うなら減価償却費で1年分に直す]
      - [研修, データの見方を覚える費用]
      - [通信, データを受け取る回線の費用]
      - [自分や従業員の時間, データを見て判断する時間。雲で届かず自分で回った時間]
    say: 手順の3つ目は、費用を全部並べることです。利用料は、面積あたりの年額や、診断1回あたりの料金として示されることが多く、金額は時点で変わります。面積の単位と、何が含まれるかを事業者に確かめます。利用料のほかに、可変施肥に対応した農機、データの見方を覚える研修、通信、そして自分や従業員がデータを見て判断する時間がかかります。農機を買うなら、減価償却費で1年分の費用に直します。農研機構が公開した経営計画の試算の例では、経営規模が10.5ヘクタールのままスマート農業を導入すると、労働費は11.2万円減りますが、機械・施設費が54.3万円増え、差し引きの収支は32.6万円減ります。11.8ヘクタールまで規模を広げると、差し引きが現状と同じになります。労働が減っても、費用がそれを上回ることがあるのです。

  - kind: bullets
    heading: 比べ方と、欠測の記録
    lead: 前年と比べるだけでは、天候の差とサービスの効果を分けられません
    items:
      - 同じ品種で条件の近い圃場を2〜3枚選び、片方だけサービスの結果を使う
      - 公的機関の試験も、比べる相手を決めて測っている（十勝農試の可変追肥で小麦の製品収量6〜18%増）
      - 光学衛星の画像は、雲があると使えない。欠測の回数は、サービスの価値を決める数字の1つ
      - 追肥の判断に間に合わなかった回数と、そのとき自分で回った時間を数える
    say: 手順の4つ目は、比べ方を決めることです。収量と品質は、天候で年ごとに変わります。前年と比べるだけでは、天候の差とサービスの効果を分けられません。公的機関の試験は、比べる相手を決めて測っています。北海道の十勝農業試験場は、圃場内の生育不良の箇所と良好な箇所を含む調査点の平均収量を比べて、衛星の植生指数を使った可変追肥で、秋まき小麦の製品収量が6から18パーセント増えたとしています。自分の経営では、同じ品種で条件の近い圃場を2、3枚選び、片方だけサービスの結果を使うのが現実的です。手順の5つ目は、使えなかった日を記録することです。光学衛星の画像は、雲があると使えません。欠測の回数は、サービスの価値を決める数字の1つです。追肥の判断に間に合わなかった回数と、そのとき自分で回った時間を数えておきます。よくある抜けは、結局自分で回った時間が、費用に入らないことです。

  - kind: table
    heading: 1年後に差し引きで評価
    columns: [減った費用, 増えた収入, 増えた費用]
    widths: [0.34, 0.33, 0.33]
    rows:
      - [巡回時間の減少 × 時給, 収量の増加 × 単価, 利用料]
      - [減った肥料と農薬の金額, 等級が上がったことによる単価の差, 農機の減価償却費、研修、通信]
      - ["", "", データを見る時間、自分で回った時間]
    say: 手順の6つ目は、1年後に差し引きで評価することです。減った費用、増えた収入、増えた費用の3つを並べます。減った費用は、巡回時間の減少に時給を掛けた額と、減った肥料と農薬の金額。増えた収入は、収量の増加に単価を掛けた額と、等級が上がったことによる単価の差。増えた費用は、利用料、農機の減価償却費、研修、通信、データを見る時間です。農研機構の分析では、実証地区の稲作の労働時間は平均9パーセント減り、水稲の単収は平均9パーセント増えました。ただしこれは、複数のスマート農機を組み合わせた体系全体の数字で、衛星のサービス単体の効果ではありません。公表された数字は目安にとどめ、自分の数字と並べて、どこが違うかを見ます。

  - kind: bullets
    heading: 補助事業と計画認定
    lead: 補助事業は年度ごとに変わります。名前を覚えるより、調べ方と相談先を覚えます
    items:
      - 農林水産省の「逆引き事典」：分野と条件を選んで補助金、融資、税制を検索できる
      - 計画認定：労働生産性5%以上の向上が要件。特別償却、長期低利の融資、補助事業の優先採択
      - 相談先は地方農政局の環境・技術課と、全国361か所の普及指導センター
      - 農機の補助は出ても、サービスの利用料は対象外のことがある
      - 続ける基準とやめる条件は、契約の前に書いておく
    say: 補助事業と計画認定です。補助事業は年度ごとに変わるので、名前を覚えるより調べ方を覚えます。農林水産省の逆引き事典は、補助金、融資、税制などから分野を選び、条件を選んで検索できます。スマート農業技術活用促進法の計画認定は、計画全体で農業の労働生産性を5パーセント以上向上させることが要件です。認定を受けると、設備投資の特別償却、日本政策金融公庫の長期低利の融資、補助事業の優先採択などが受けられます。相談先は、地方農政局の環境・技術課と、全国に361か所ある都道府県の普及指導センターです。よくある抜けは、申請の締め切りを過ぎてから補助を探すことと、農機の補助は出てもサービスの利用料は対象外のことがある点です。もう1つ大切なのが、続けるかやめるかの基準を、導入前に書いておくことです。後から決めると、どんな結果でも効果があったことにできてしまいます。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 架空の農業法人の「評価の計画」を、悪い例から良い例に直します
    items:
      - 案件：水稲30ha、圃場60枚が2つの集落に分散
      - 困りごと：追肥前の巡回に時間がかかり、追肥の量も圃場ごとにばらつく
      - 検討中：衛星の生育マップを配信するサービス
      - 手元に用意するもの：紙1枚か表計算のファイル。今年の作業日誌と肥料の購入記録
    say: ここからは、一緒にやってみましょう。架空の農業法人の評価の計画を、悪い例から良い例に直します。案件は、水稲30ヘクタール、圃場60枚が2つの集落に分散している法人です。追肥前の巡回に時間がかかり、追肥の量も圃場ごとにばらつきます。衛星の生育マップを配信するサービスを検討しています。手元に、紙1枚か表計算のファイルを用意してください。今年の作業日誌と、肥料の購入記録があれば、なおよいです。

  - kind: prompt
    heading: 悪い例の評価計画
    label: 悪い例
    text: |
      衛星サービスを導入し、作業の効率化と収量の向上を図る。
      効果は導入後に検証する。
      費用は利用料のみ。
    say: まず、悪い例です。衛星サービスを導入し、作業の効率化と収量の向上を図る。効果は導入後に検証する。費用は利用料のみ。一見まともに見えますが、4つの問題があります。効率化と収量の向上では、何を測るかが決まっていません。導入後に検証するでは、導入前の基準がなく、比べられません。費用を利用料のみとすると、データを見る時間や、画像が届かず自分で回る時間が消えます。そして、続ける基準がないので、どんな結果でも更新されてしまいます。

  - kind: prompt
    heading: 良い例に直す（9行）
    label: 良い例
    text: |
      1. 目的：追肥前の巡回を減らし、追肥量のばらつきをなくす
      2. 比べる項目：巡回時間、追肥の肥料費、収量と等級（いずれも圃場ごと）
      3. 基準：今年の作業日誌、肥料の購入記録、検査結果を圃場ごとに残す
      4. 比べ方：条件の近い圃場を3組選び、各組の片方だけ生育マップで追肥量を決める
      5. 費用：利用料（単位と内容を確認）、研修、通信、データを見る時間（週1時間）
      6. 欠測：画像が届かず自分で回った回数と時間を記録する
      7. 評価日：翌年の収穫後、検査結果が出てから差し引きを出す
      8. 続ける基準：巡回時間が2割減り、組の中で追肥量のばらつきが小さいこと
      9. 補助：逆引き事典で検索し、普及指導センターに相談する
    say: 良い例に直します。紙に9行、同じ見出しで書いてみてください。1、目的。追肥前の巡回を減らし、追肥量のばらつきをなくす。2、比べる項目。巡回時間、追肥の肥料費、収量と等級。いずれも圃場ごとです。3、基準。今年の作業日誌と肥料の購入記録、出荷先の検査結果を、圃場ごとに分けて残す。4、比べ方。条件の近い圃場を3組選び、各組の片方だけ生育マップで追肥量を決める。5、費用。利用料は単位と含まれるものを確認。研修、通信、データを見る時間は週1回1時間。農機は買わない。6、欠測。画像が届かず自分で回った回数と時間を記録する。7、評価日。翌年の収穫後、検査結果が出てから。8、続ける基準。巡回時間が2割減り、組の中で追肥量のばらつきが小さくなっていること。9、補助。逆引き事典で検索し、普及指導センターに相談する。数字の欄は、今は空欄で構いません。空欄の場所を先に決めておくことが大切です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 何のために使うかを1つに絞る
      - 導入前の1年を、圃場ごとに記録する
      - 利用料、農機、研修、通信、自分の時間を全部並べる
      - 前年と比べるか、同じ年に使う圃場と使わない圃場を分けるか決める
      - 雲で届かなかった回数と、代わりに回った時間を記録する
      - 1年後に、減った費用、増えた収入、増えた費用を並べて差し引く
      - 補助事業は逆引き事典で調べ、普及指導センターか農政局に相談する
      - 続ける基準とやめる条件を、契約の前に決める
    say: 手順をまとめます。1、何のために使うかを1つに絞る。2、導入前の1年を、圃場ごとに記録する。3、利用料、農機、研修、通信、自分の時間を全部並べる。4、前年と比べるか、同じ年に使う圃場と使わない圃場を分けるかを決める。5、雲で届かなかった回数と、代わりに回った時間を記録する。6、1年後に、減った費用、増えた収入、増えた費用を並べて差し引く。7、補助事業は逆引き事典で調べ、普及指導センターか農政局に相談する。8、続ける基準とやめる条件を、契約の前に決める。図の6つの手順に、補助事業と続ける基準を足した8つです。評価の計画として、導入前に書いておきます。

  - kind: bullets
    heading: 宿題：更新するか決める
    bold: true
    items:
      - 場面：1年間使った。巡回時間は減った感触があるが記録はない。雲で届かず自分で回った日が何度かあった。更新の期限が近い
      - A. 感触として効果があったので、更新する
      - B. 作業日誌と購入記録を圃場ごとに整理し、届かなかった回数と回った時間を数えて、差し引きで決める
      - C. 効果が数字で示せないので、やめる
      - D. 事業者が示す他の農場の数字を根拠に、更新する
    say: 宿題です。ある農業法人が、1年間サービスを使いました。追肥前の巡回時間は減ったと感じていますが、記録はありません。雲で生育マップが届かず、自分で回った日が何度かありました。更新の期限が近づいています。次の進め方として、最も適切なものはどれでしょうか。A、感触として効果があったので、更新する。B、今年の作業日誌と肥料の購入記録を圃場ごとに整理し、届かなかった回数と自分で回った時間を数えたうえで、減った費用と増えた費用を差し引きして決める。C、効果が数字で示せないので、やめる。D、事業者が示す他の農場の効果の数字を根拠に、更新する。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに2問あります。

  - kind: cta
    heading: 評価の計画を書いたら、章のページへ
    action: チェックリスト11項目とケース問題3問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-cost-benefit.html
    credits:
      - "出典：農研機構「スマート農業導入の経済効果と採算規模」（2023年12月）、「農業経営計画策定支援システムの公開とプレスリリースについて」（2026年1月）"
      - "出典：北海道立総合研究機構 十勝農業試験場 成績概要書（令和2年度）、農林水産省「スマート農業技術活用促進法」チラシ（令和8年5月版）"
      - "出典：農林水産省「協同農業普及事業をめぐる情勢」（令和7年6月）、「農業新技術 製品・サービス集」（令和7年9月更新）"
      - "補助事業と税制は年度で変わります。申請の前に、普及指導センターか地方農政局で最新の条件を確かめてください"
    say: この章のページには、導入前に確かめる11項目のチェックリストと、事業者や相談先に聞く5つの質問、ケース問題3問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
