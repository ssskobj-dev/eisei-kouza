# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第2部「生育診断：圃場を回る順番を決める」（learn/agri/agri-growth-patrol.qmd）
title: 衛星データで圃場を回る順番を決める：営農指導員の5つの手順と5つの限界
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 4
total: 30
thumb: 回る順番を決める
summary: 衛星の生育マップは、管内の全圃場を同じ日に見て、見に行く順番を決める道具です。診断の代わりにはなりません。雲、生育の時期、草丈の5つの限界と、巡回の順番を決める5つの手順、答えの分かっている圃場で先に試す方法を、一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 生育診断：圃場を回る順番を決める
    sub: 衛星の生育マップから読めること、読めないこと
    say: 衛星の生育マップがあれば、圃場に入って草丈や茎数を測る生育調査は要らなくなるでしょうか。答えは、要らなくはなりません。衛星が出すのは、管内の全圃場を同じ日に見た、生育の濃い薄いの順番です。原因を見分けて対策を決めるのは、圃場を見た指導員です。この動画では、生育マップを巡回の順番決めに使う5つの手順と、雲や草丈など5つの限界を、章の内容に沿って見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 衛星の生育マップから読めることと、読めないことを、農家に説明できる
      - 管内の圃場を回る順番を、生育マップで決める手順を組める
      - 自分の管内の作物と時期が、衛星に向くかどうかを判定できる
    say: この章を終えると、3つのことができるようになります。衛星の生育マップから読めることと、読めないことを、農家に説明できること。管内の圃場を回る順番を、生育マップで決める手順を組めること。そして、自分の管内の作物と時期が、衛星に向くかどうかを判定できることです。

  - kind: figure
    heading: 結論：衛星と人の分担
    image: figures/agri-growth-patrol/conclusion.svg
    say: 先に結論です。衛星に任せられるのは、管内の全圃場を同じ日に見ること、生育の濃い薄いで回る順番を付けること、晴れた日ごとに更新することです。人が行うのは、現地で草丈、茎数、葉色を測ること、ムラの原因を見分けること、追肥や水管理を決めて伝えることです。生育マップは、診断の代わりではなく、見に行く順番を決める道具です。

  - kind: bullets
    heading: 現場が欲しい成果
    lead: 圃場に入って草丈、茎数、葉色を測る調査は、回れる圃場の数に限界があります
    items:
      - 効率化：管内の数百、数千の圃場を同じ密度で回るのをやめ、見に行くべき圃場に時間を集める
      - 先に知る：追肥の時期に、生育の遅れた圃場や進みすぎた圃場を、農家から相談が来る前に知る
      - 衛星で全圃場を同じ日に見られれば、巡回の順番を決める材料になる
    say: 営農指導員や普及指導員の生育調査は、圃場に入って草丈、茎数、葉色を測るのが基本です。富山県の農業研究所は、この方法では時間と労力の面から、調査できる圃場の数に限界があると述べています。千葉県の研究も、この調査には多大な労力がかかると書いています。現場が欲しいのは2つです。1つ目は効率化。管内の数百、数千の圃場を同じ密度で回るのをやめ、見に行くべき圃場に時間を集めたい。2つ目は、先に知ること。追肥の時期に、生育の遅れた圃場や進みすぎた圃場を、農家から相談が来る前に知りたい。衛星で管内の全部の圃場を同じ日に見られれば、巡回の順番を決める材料になります。農林水産省も、衛星の生育マップの用途として、多数の圃場の見回り時間の削減を挙げています。

  - kind: figure
    heading: 効く3つの強み
    image: figures/agri-growth-patrol/strengths.svg
    caption: 広く見られる、行かずに分かる、見えないものが見える
    say: この用途で効く強みは3つです。1つ目、広く見られる。無償の光学衛星Sentinel-2は、1回の観測で290キロメートルの幅を撮り、画像の細かさは10メートルです。管内の全圃場が1枚に入ります。青森県では、津軽地域の13市町村で特定の品種を栽培する圃場の全域を衛星で撮り、6月下旬から8月下旬に、圃場ごとの生育状況を判定して配信する仕組みを始めています。2つ目、行かずに分かる。北海道の十勝農業試験場は、秋まき小麦の追肥判断に衛星を使う方法をまとめ、衛星の植生指数から茎数を推定し、無追肥にしてよい圃場を判定できるとしています。3つ目、見えないものが見える。植物の葉は赤い光を吸収し、近赤外の光を反射します。この2つの反射の差から計算する値が、正規化植生指数、NDVIです。NDVIは植生の量や活性度を表し、作物の生育量の目安になります。

  - kind: figure
    heading: 5つの限界
    image: figures/agri-growth-patrol/limits.svg
    say: 便利な反面、限界も5つあります。1つ目、雲があると撮れない。光学の衛星は、晴れた日の画像しか使えません。農研機構の資料では、2018年の4月8日から6月7日までに24回の観測があったうち、晴天だったのは8回でした。岩手県の研究は、北上市の5年分の観測データを調べ、無償の衛星だけでは必要な時期に観測データを得られないことが多い、と結論しています。商用の衛星に頼んでも、天候には勝てません。2つ目、指標は生育そのものではない。NDVIは葉の量の目安であって、草丈や茎数の値そのものではありません。十勝農業試験場の方法でも、現地で測った茎数から推定式を作っていて、茎数の推定誤差は1平方メートルあたり越冬前で286本、起生期で300本、無追肥と判定した圃場の適合率は90パーセントです。3つ目、茂ると差が出なくなる。宮城県の研究では、水稲は7月中下旬以降にNDVIが0.8から0.9で飽和し、生育量の差を把握することは難しいとされました。4つ目、草丈が低いと土が混ざる。衛星の1画素は10メートル四方です。農林水産省のカタログの事例にも、玉ねぎのように草丈が低い作物は衛星では判定が難しい場合があり、ドローンの画像で補ったとあります。5つ目、圃場の中の細かいムラは苦手。栃木県の現地試験では、1筆の中の生育差と衛星データに相関が見られませんでした。筆と筆の違いを見るのには向き、筆の中の違いには向かない、と考えます。

  - kind: figure
    heading: 時期と読める範囲
    image: figures/agri-growth-patrol/ndvi-range.svg
    caption: 生育初期は土や水面が混ざり、繁茂期は値が頭打ちになる
    say: 限界の3つ目と4つ目を、時期で整理するとこうなります。生育初期は、作物が小さく、画素の中に土や水面が混ざるので、差が読みにくい。農研機構のマニュアルは、6月上旬以前は水稲の植被が小さく測定精度が低いと注意しています。栃木県の試験では、移植後30日と45日ではNDVIと生育量に相関がなく、幼穂形成期になって相関が見られました。中期は、葉が画素を覆い、差が読めます。繁茂期は、値が頭打ちになり、マップの色が似てきて順番が付けにくくなります。向いた時期は、水稲なら幼穂形成期の前後、秋まき小麦なら越冬前と起生期です。

  - kind: figure
    heading: 順番を決める手順
    image: figures/agri-growth-patrol/flow.svg
    caption: 前の3つは衛星と解析、後の2つは人が行う
    say: 落とし所は、絞り込みに使い、確定は現地で行うことです。手順は5つです。1、追肥の判断時期に近い、晴れた日の画像を選ぶ。雲や雪がかかった圃場は使わない。2、圃場ごとにNDVIの平均値を出す。筆の中のムラは見ない。3、管内の平均と比べて、目立って低い圃場と高い圃場を拾う。4、低い圃場と高い圃場から数筆ずつ選び、現地で草丈、茎数、葉色を測って関係式を作る。5、外れた圃場から順に回り、水不足、病害虫、施肥の遅れ、品種の違いといった原因を確かめて、対策を伝える。大切なのは、絶対値ではなく、変化と比較を見ることです。NDVIが0.6という値そのものより、管内の中でどの圃場が相対的に低いか、前回の画像から順位が動いたかを使います。十勝農業試験場の方法も、管内の平均と標準偏差で標準化した値を使い、その地域の実測で毎年関係式を作ります。値を他の地域や他の年に持ち込みません。

  - kind: table
    heading: 向き不向き
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [作物と時期, 水稲の幼穂形成期前後、秋まき小麦の越冬前と起生期, 移植直後、生育初期、繁茂した後期]
      - [草丈, 画素を葉が覆う高さ, 玉ねぎなど草丈の低い作物]
      - [見たい違い, 筆と筆の違い, 1筆の中の細かいムラ]
      - [時期の天候, 晴れた日が取れる, 梅雨や曇天が続き、画像が欠ける]
      - [検証, 前年の生育調査の記録がある, 比べる実測がない]
      - [使い方, 順番を決め、現地で確かめる, 値をそのまま追肥量にする]
    say: 向き不向きを表にまとめます。作物と時期は、水稲の幼穂形成期前後や、秋まき小麦の越冬前と起生期が向き、移植直後や生育初期、繁茂した後期は向きません。草丈は、画素を葉が覆う高さなら向き、玉ねぎのような低い作物は向きません。見たい違いは、筆と筆の違いなら向き、1筆の中の細かいムラは向きません。時期の天候は、晴れた日が取れるなら向き、梅雨や曇天が続くなら画像が欠けます。検証は、前年の生育調査の記録があるかどうか。使い方は、順番を決めて現地で確かめるのが正しく、値をそのまま追肥量にするのは誤りです。向いていないが多い管内では、衛星を主役にせず、ドローンや携帯型の測定機、従来の生育調査を中心に考えます。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 最初の一歩は、答えの分かっている圃場で試すことです。紙1枚で、試す計画を書きます
    items:
      - 用意するもの：前年の生育調査の記録（草丈、茎数、葉色）と、調査した日付
      - 圃場：前年に調査した圃場、十数筆
      - 画像：調査日に近い晴れた日の、無償のSentinel-2の画像
      - 見ること：NDVIの順位と、実測の順位が合うか
    say: ここからは、一緒にやってみましょう。章の始め方にある、答えの分かっている圃場で試す、を紙1枚でやります。用意するのは、前年の生育調査の記録です。草丈、茎数、葉色と、調査した日付。圃場は、前年に調査した十数筆。画像は、その調査日に近い晴れた日の、無償のSentinel-2の画像です。見ることは1つだけ。衛星のNDVIの順位と、実測の順位が合うかどうかです。順位が合えば、その管内、その作物、その時期で使える見込みが立ちます。合わなければ、栃木県の例のように、衛星に向かない条件かもしれません。

  - kind: prompt
    heading: 紙に書く表の型
    label: 記入の型
    text: |
      調査日：前年の○月○日　　画像の日：調査日に近い晴れた日
      作物と時期：水稲、幼穂形成期の前後

      書く欄（4列）：圃場名 ／ 実測の順位（茎数） ／ 衛星NDVIの順位 ／ 順位の差
      行：前年に調査した十数筆（A-1、A-2、…）

      判定：順位がおおむね合う → この管内、この時期で使える見込み
      　　　合わない → 時期、作物、草丈のどれが外れているか見直す
    say: 紙に、この表を書いてみてください。上に、調査日と、画像の日、作物と時期を書きます。表は4列です。圃場名、前年の実測の順位、衛星のNDVIの順位、そして順位の差。行は、前年に調査した十数筆です。NDVIの値そのものは書きません。管内の中の順位だけを使います。全部埋めたら、下に判定を書きます。順位がおおむね合えば、この管内、この時期で使える見込みが立ちます。合わなければ、時期、作物、草丈のどれが外れているかを見直します。梅雨で晴れた日の画像が無ければ、それ自体が、この時期は使いにくいという答えです。今日は、数字の欄は空欄で構いません。どの記録を取り出せばよいかが分かることが、最初の一歩です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 答えの分かっている圃場で、順位が合うかを先に試す
      - 追肥の判断時期に近い、晴れた日の画像を選ぶ
      - 圃場ごとにNDVIの平均値を出す。筆の中のムラは見ない
      - 管内の平均と比べて、外れた圃場を拾う
      - 高い圃場と低い圃場から数筆ずつ実測し、関係式を作る
      - 外れた圃場から順に回り、原因を確かめて対策を伝える
    say: 手順をまとめます。1、答えの分かっている圃場で、順位が合うかを先に試す。2、追肥の判断時期に近い、晴れた日の画像を選ぶ。3、圃場ごとにNDVIの平均値を出す。筆の中のムラは見ない。4、管内の平均と比べて、外れた圃場を拾う。5、高い圃場と低い圃場から数筆ずつ実測し、その地域、その作物、その時期の関係式を作る。6、外れた圃場から順に回り、原因を確かめて対策を伝える。衛星が出すのは順番で、診断の確定は現地で行います。

  - kind: bullets
    heading: 宿題：言えないこと
    bold: true
    items:
      - 場面：7月上旬の晴れた日の画像で、A集落はおおむね濃く、B集落の3筆だけが周りより目立って薄い
      - A. B集落の3筆は、周りと比べて葉の量が少ない可能性がある
      - B. B集落の3筆を、先に見に行く順番に入れるとよい
      - C. B集落の3筆の茎数は、周りより2割少ない
      - D. A集落の圃場は、この時期には筆ごとの大きな差が見えない
    say: 宿題です。ある営農指導員が、7月上旬の晴れた日の衛星画像から、管内の水稲の生育マップを作りました。画像では、A集落の圃場はおおむね濃く、B集落の圃場のうち3筆だけが、周りより目立って薄く見えます。この結果から、言えないことはどれでしょうか。A、B集落の3筆は、周りの圃場と比べて葉の量が少ない可能性がある。B、B集落の3筆を、先に見に行く順番に入れるとよい。C、B集落の3筆の茎数は、周りより2割少ない。D、A集落の圃場は、この時期には筆ごとの大きな差が見えない。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに3問あります。

  - kind: cta
    heading: 試す計画を書いたら、章のページへ
    action: 5つの限界の出典と、ケース問題4問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-growth-patrol.html
    credits:
      - "出典：富山県農林水産総合技術センター農業研究所 研究成果 vol.39（2024年1月）、千葉県農林総合研究センター 試験研究成果普及情報（2018〜2020年度）"
      - "出典：農研機構「Sentinel-2衛星データを用いた水田の取水開始時期の把握手法」（2019年8月）、青森県産業技術センター「青天ナビ」における生育診断システムの活用方法"
      - "出典：北海道立総合研究機構 十勝農業試験場「衛星画像を用いた秋まき小麦の茎数推定・起生期無追肥判定の実施マニュアル」（2023年3月）"
      - "出典：岩手県農業研究センター 東北農業研究 75（2022年）、宮城県古川農業試験場 東北農業研究 73（2020年）、栃木県農業試験場 委託試験成績（2022〜2023年度）"
      - "出典：農研機構「作物生育情報測定装置による水稲生育診断のための利用マニュアル」（2011年3月）、農林水産省「スマート農業技術カタログ」掲載資料"
      - "衛星だけの効果を金額で示した公開資料は確認できていません。費用は事業者に最新の条件を確かめてください"
    say: この章のページには、5つの限界の出典と、費用を3つに分けて考える方法、向き不向きの判定表、ケース問題4問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
