# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第7章「衛星データの植生指数：Sentinel-2の赤と近赤外から雲を除いて計算し、区画ごとに平均して生育診断の表を作る」（learn/codex/codex-2-7-vegetation-index.qmd）
title: 衛星データの植生指数：Sentinel-2で雲を除いて区画ごとに平均、誤り4つ
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 11
total: 30
thumb: ずらしを足す
summary: 衛星データ（Sentinel-2）の赤B4と近赤外B8から植生の指数（NDVI）を計算し、雲と影を除いて区画ごとに平均し、生育診断や農地調査の表を作る章。指数が−1〜1に収まるしくみと値の目安（森は0.6〜0.8、岩や砂は0.1以下）、「倍率は打ち消されるからずらしも不要」という誤り、分類の番号の取り違え、分母が0の画素、除いた画素を0にして平均する誤りの4つを、AIが返したコードを一緒にレビューして見つけます。できた表と地図を手元で確かめる練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 植生の指数：雲を除いて、区画ごとに平均する
    sub: 赤B4と近赤外B8。ずらしを足してから割り算、除いた画素は0にしない
    say: 市内の農地の区画ごとに、6月の植物の茂り具合を1つの数字で並べ、現地に行く区画を絞ることはできるでしょうか。答えは、赤と近赤外の反射率から植生の指数を計算し、雲と影の画素を除き、区画ごとに平均した表を作って、値の範囲と除いた画素の割合を確かめれば、できる、です。指数は1画素ごとに出る数字なので、色の合成と違って、区画の順位付けや年ごとの比較に使えます。ただし、1つの数字に縮めた分、何を除いたかが結果を左右します。この動画では、指数のしくみと値の目安を見たあと、AIが返したコードを一緒にレビューして、4つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 雲と影を除いたうえで植生の指数を計算し、区画ごとの平均を表にして、値の範囲と雲の影の影響を確かめられる
      - 指数が「近赤外と赤の差を、和で割った値」で、健康な植物でなぜ大きくなり、なぜ−1〜1に収まるのかが分かる
      - 「倍率は打ち消すので直さなくてよい」という誤り、分母が0の画素、雲の影が平均を下げる誤りを、コードと表から見つけられる
    say: この章を終えると、3つのことができるようになります。1つ目、雲と影を除いたうえで植生の指数を計算し、区画ごとの平均を表にして、値の範囲と雲の影の影響を確かめられること。2つ目、指数が、近赤外と赤の差を和で割った値で、健康な植物でなぜ大きくなり、なぜマイナス1から1に収まるのかが分かること。3つ目、AIが、倍率は分子と分母で打ち消すので直さなくてよい、と言う誤り、分母が0の画素の扱い、雲の影の画素が区画の平均を下げる誤りを、コードと表から見つけられることです。

  - kind: figure
    heading: しくみ：差を和で割る
    image: figures/codex-2-7-vegetation-index/scale.svg
    say: まず、しくみです。健康な植物の葉は、目に見える光の大半を吸収し、近赤外を強く反射します。葉緑素が目に見える赤を吸収し、葉の内部の構造が近赤外を跳ね返すためです。そこで、近赤外の反射率から赤の反射率を引き、2つの和で割ります。これが正規化植生指数、NDVIです。この章では、植生の指数と呼びます。差を和で割るので、値は必ずマイナス1からプラス1の範囲に収まります。図は、値の目安です。茂った植物は、近赤外が赤よりずっと大きいので、値がプラス1に近づきます。0.8から0.9が、最も密な緑の葉。0.6から0.8が、温帯と熱帯の森。0.2から0.3が、低木や草地。岩、砂、雪のように2つの帯の差が小さい場所は、0.1以下です。0は、緑の葉がないことを表します。この目安は、あとで表の数字を確かめるときの物差しになります。森の区画が0.3なら、どこかがおかしい、と気づけます。

  - kind: table
    heading: 使う帯と、除く分類の番号
    columns: [項目, Sentinel-2 Level-2A, 補足]
    widths: [0.22, 0.40, 0.38]
    rows:
      - [赤, B4（およそ665nm、10m）, Landsat 8と9はBand 4（30m）]
      - [近赤外, B8（およそ833nm、10m）, Landsat 8と9はBand 5。Landsat 4〜7はBand 4]
      - [反射率に直す, （画素の値＋ずらし）÷倍率, 処理の版04.00（2022年1月25日）以降。値0は欠け]
      - [除く分類（SCL）, 3 雲の影、8と9 雲、10 薄い雲, 4は植物、5は植物以外、6は水、11は雪]
    say: 次に、使う帯と、除く分類の番号です。表は、公式の資料から写した値です。Sentinel-2なら、赤がB4で、およそ665ナノメートル。近赤外がB8で、およそ833ナノメートル。どちらも10メートルの画素です。Landsat 8と9では、赤がBand 4、近赤外がBand 5で、30メートル。さらに古いLandsat 4から7では、赤がBand 3、近赤外がBand 4でした。衛星が変わると番号が変わるので、近赤外は5番、という覚え方は通用しません。3行目が、値の直し方です。Sentinel-2の画素の値は、反射率そのものではありません。処理の版04.00、2022年1月25日以降のLevel-2Aでは、画素の値にずらし、BOA_ADD_OFFSETを足し、倍率、QUANTIFICATION_VALUEで割って、反射率にします。画素の値0は、欠けた値です。4行目が、雲と影です。Level-2Aには画素ごとの分類、SCLが付きます。3が雲の影、8と9が雲、10が薄い雲です。この4つを、指数を計算する前に除きます。4は植物、5は植物以外、6は水、11は雪です。番号を取り違えると、植物を除いて影を残すことになります。

  - kind: bullets
    heading: なぜ「ずらし」と「影」が効くのか
    items:
      - 倍率は分子と分母の両方にかかるので、割り算で打ち消される
      - ずらしは足し算なので打ち消されない。足さずに計算した指数は、正しい値から一律にずれる
      - 雲は指数を実際より低くする。雲の影は、まわりより暗い画素として分類される
      - 暗い画素では赤も近赤外も小さく、わずかな誤差で値が大きく動く
      - 区画の一部が影にかかると、その区画の平均は、晴れた日の値とは比べられない
    say: なぜ、ずらしと影が効くのかを押さえます。倍率は、分子と分母の両方にかかります。だから割り算で打ち消されます。ここまでは、AIの説明どおりです。しかし、ずらしは足し算です。足し算は、割り算では打ち消されません。ずらしを足さずに計算した指数は、正しい値から一律にずれます。表の数字はもっともらしいので、気づきにくい誤りです。次に、雲と影です。雲は、指数を実際より低くします。雲の影の画素は、まわりより暗い画素として分類されます。暗い画素では、赤も近赤外も小さな数です。2つの小さな数の差と和から指数を計算するので、わずかな誤差で、値が大きく動きます。区画の一部が影にかかると、その区画の平均は、晴れた日の値とは比べられない値になります。生育不良と影は、地図では同じ色に見えます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [NDVIを計算して, 赤B4と近赤外B8を、ずらしと倍率で反射率に直してから、（近赤外−赤）÷（近赤外＋赤）を計算して]
      - [雲は除いて, SCLが3（雲の影）、8と9（雲）、10（薄い雲）の画素を除いて。除いた割合も区画ごとに出して]
      - [区画ごとの平均を出して, 除いた画素と欠けた画素を数に入れずに平均して。使った画素数も表に入れて]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。NDVIを計算して、だけでは、AIは画素の値をそのまま割り算します。倍率は打ち消されるので、ずらしの分だけ黙ってずれます。だから、赤B4と近赤外B8を、ずらしと倍率で反射率に直してから、近赤外引く赤、割る、近赤外足す赤、を計算して、と頼みます。雲は除いて、だけでは、AIは分類の番号を自分で決めます。4を雲と思い込んで植物を除き、3の影を残すことがあります。SCLが3、8と9、10の画素を除いて。除いた割合も区画ごとに出して、と番号を指示文に書きます。区画ごとの平均を出して、ではなく、除いた画素と欠けた画素を数に入れずに平均して。使った画素数も表に入れて、と頼みます。指示の7項目のうち、確かめ方には、指数の最小と最大を表示してマイナス1から1に収まることを示すこと、分母が0だった画素の数を表示すること、除いた割合が3割を超える区画の数を表示すること、森の区画1つと裸地の区画1つの平均を表示することを入れます。なお、3割は、この章で例として置いた目安です。対象と目的に合わせて決めます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 区画ごとの植生の指数（誤りあり）
      red = read_band(p, "B4")                       # 画素の値のまま
      nir = read_band(p, "B8")
      scl = read_band(p, "SCL")
      ok  = (scl != 4)                               # 4を雲と思い込む
      ndvi = (nir - red) / (nir + red)               # ずらしを足していない
      ndvi = fill_nan(ndvi, 0)                       # 0で割った画素を0に
      ndvi = where(ok, ndvi, 0)                      # 除いた画素も0に
      table = mean_by_zone(ndvi, zones)              # 0も平均に入る
    highlight: [5, 6, 7, 8, 9]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。反射率に直す必要はありません。指数は比なので、倍率は分子と分母で打ち消されます。雲はSCLの4で除きました。0で割った画素はエラーになるので、0で埋めてあります。自信のある口調です。画面がそのコードです。当てる観点は5つ。1、波長帯。赤と近赤外の番号が、使っている衛星の表と合っているか。2、値の倍率。ずらしを足してから割り算しているか。3、雲と影。除く分類の番号が、公式の表と合っているか。4、欠けた値。分母が0の画素を、欠けとして扱っているか。5、失敗の隠れ。区画の平均が、除いた画素を数に入れていないか。まず、2行目と3行目。B4とB8。表と合っています。ここは問題ありません。次に、5行目。scl、ノットイコール、4。4を除いています。6行目。nir引くred、割る、nir足すred。画素の値のまま、ずらしを足していません。7行目。fill_nan、ndvi、0。0で割った画素を、0にしています。8行目と9行目。where、ok、ndvi、0。そして、mean_by_zone。除いた画素を0にしてから、平均に入れています。このコードは、動かしても止まりません。表は出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.08, 0.14, 0.30, 0.48]
    rows:
      - ["6", 値の倍率, "画素の値のまま割り算。「倍率は打ち消される」", "倍率は打ち消されるが、ずらしは足し算なので残る。ずらしを足し、倍率で割ってから計算する"]
      - ["5", 雲と影, "scl != 4。「雲はSCLの4で除いた」", "4は植物。植物を除き、雲（8、9）、薄い雲（10）、影（3）を残している。正しくは3、8、9、10を除く"]
      - ["7", 欠けた値, "fill_nan(ndvi, 0)。「0で割った画素は0で埋めた」", "分母が0の画素は欠け。0は「緑の葉がない」の値に化ける。欠けのまま残し、平均の数に入れない"]
      - ["8と9", 失敗の隠れ, "where(ok, ndvi, 0) のあと平均。「除いたあと0にした」", "除いた画素が0として平均に入り、雲の多い区画ほど平均が下がる。欠けのまま残し、使った画素数と除いた割合も表に出す"]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、6行目。画素の値をそのまま割り算しています。倍率は分子と分母の両方にかかるので打ち消されますが、ずらしは足し算なので打ち消されません。AIの説明は、倍率だけを見て、ずらしを忘れています。正しくは、赤と近赤外のそれぞれに付属情報のずらしを足し、倍率で割ってから、指数を計算します。2つ目、5行目。SCLの4は植物です。この行は、植物の画素を除き、雲の8と9、薄い雲の10、雲の影の3を残しています。茂った区画ほど画素が減り、雲の区画が残る、という逆の結果になります。正しくは、ok、イコール、ノット、isin、scl、3、8、9、10、です。3つ目、7行目。分母が0の画素は、赤も近赤外も0、つまり欠けた値です。0で埋めると、緑の葉がない、という意味の値に化けます。正しくは、欠けのまま残し、平均の数に入れません。4つ目、8行目と9行目。除いた画素を0にしてから平均しているので、雲や影のかかった区画ほど平均が下がります。生育の良し悪しではなく、雲のかかり具合で順位が決まります。正しくは、除いた画素を欠けのまま残し、mean_by_zoneが欠けを数に入れない設定になっているかを確かめます。使った画素数と除いた割合も、同じ表に出します。この4つのうち、2つ目は地図を見れば気づきます。畑が灰色で、雲が色付きになるからです。3つ目は、画像の端や欠けた帯に0が並ぶので、地図の縁を見ると気づけます。1つ目と4つ目は、表の数字がもっともらしいので、最も隠れやすい誤りです。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：表と地図を確かめる
    items:
      - 最小と最大が−1〜1に収まっているか。外れていれば、ずらしか倍率の直し方か、帯の取り違え
      - 茂った区画が0.6以上か。森が0.3なら、ずらしを足していないか、赤と近赤外が逆
      - 裸地や舗装が0.1以下か。裸地が0.5なら、帯の取り違えを疑う
      - 除いた画素が、雲と影の形をしているか。灰色が畑の形なら、番号の取り違え
      - 除いた割合が高い区画（3割超）が、順位に入っていないか
      - 影の縁の区画の平均が、まわりより一段低くないか
    say: 判定を、手元でやってみます。AIに頼んだ人なら、できた区画ごとの表と、指数の地図、除いた画素を灰色で重ねた地図を見ながら、数分でできます。まず、表の最小と最大が、マイナス1から1に収まっているかを見ます。範囲を外れていれば、ずらしか倍率の直し方か、帯の取り違えです。2つ目、知っている茂った区画が、0.6以上の値を持っているか。森が0.6から0.8、密な葉が0.8から0.9の目安と、大きくずれていないかを見ます。森が0.3なら、ずらしを足していないか、赤と近赤外が逆です。3つ目、裸地や舗装が、0.1以下か。岩、砂、雪は0.1以下です。裸地が0.5なら、帯の取り違えを疑います。4つ目、除いた画素が、雲と影の形をしているか。灰色で重ねた地図で、灰色が雲と、その横にずれた影の形になっていれば、正しい扱いです。畑の形なら、番号の取り違えです。5つ目、除いた割合が高い区画が、順位に入っていないか。除いた割合が3割を超える区画は、残った画素だけの平均です。区画の一部の値で全体を代表させてよいかを、人が決めます。6つ目、影の縁の区画の平均が、まわりより一段低くないか。雲の影が区画の一部にかかると、平均が下がります。この6つを、報告の前にやります。

  - kind: figure
    heading: 結果の目視観点と、2つの例
    image: figures/codex-2-7-vegetation-index/shadow.svg
    say: 図は、雲の影と生育不良の見分け方です。左が雲の影。低い値が、区画の境界と関係なく、雲の横にずれた帯の形で並びます。同じ日の別の区画も、同じ向きに暗く、別の日には消えます。右が生育不良。低い値が、区画の形に沿います。別の日にも同じ区画が低く、除いた割合は低い。そして、現地で確かめて初めて言えることです。おかしな結果の例を2つ。例1、区画の表で、市内の森の区画の平均が0.25、裸地の区画が0.15だった。どちらも目安より低く、森と裸地の差が小さすぎます。ずらしを足さずに画素の値のまま割り算すると、こうなります。帯の順番が逆なら森が負になるので、この例はずらしの誤りです。付属情報のずらしと倍率を読み、反射率に直してから計算し直します。例2、同じ日の地図で、北西から南東に帯状に低い区画が並び、そこだけ生育不良の候補になった。帯の向きが区画の形と関係なく、雲の列と同じ向きにずれています。雲の影が区画の一部にかかり、残った画素の平均が下がっています。原因は、除いた割合を表に出していないか、影、SCLの3、を除いていないことです。除いた割合の列を見て、3割を超える区画を候補から外し、別の日の画像でその区画が低いままかを確かめます。言えるのは、雲と影を除き、反射率に直してから計算した指数の、区画ごとの平均と使った画素数です。同じ処理の同じ日の表なら、区画どうしの順位付けに使えます。言えないのは、区画の中の収量や、病気か水不足かという原因です。指数は緑の葉の量の目安で、茂った畑では値が頭打ちになります。生育不良と言うには、別の日の画像でも低いこと、または現地の確認が要ります。北海道の小麦の例では、衛星の指数で選んだ区画で茎数を実測して、指数の意味を確かめています。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 雲や雪が区画にかかっている日。残った画素で平均しても区画全体の値にはならない。別の日を探す
      - 茂りきった時期に、茂り具合の差を見たいとき。指数は密な葉で頭打ちになり、順位が安定しない
      - 区画が画素より小さいとき。10mより細い畦や畝は、隣の区画や道の値が混ざる
      - 原因を知りたいとき。病気、水不足、刈り取りを区別しない。原因は現地で確かめる
      - 有償の商用データを使うとき。帯の番号、ずらし、倍率は衛星ごとに違う。契約の仕様書で確かめる
    say: 向かない条件も、押さえておきます。1つ目、雲や雪が区画にかかっている日。雲や雪の被った画像は使えません。除いて残った画素で平均しても、区画全体の値にはなりません。別の日を探します。2つ目、茂りきった時期に、茂り具合の差を見たいとき。指数は密な葉で頭打ちになります。差が小さくなり、順位が安定しません。3つ目、区画が画素より小さいとき。10メートルの画素より細い畦や畝の区画は、隣の区画や道の値が混ざります。平均の画素数が数個の区画は、表から外すか、印を付けます。4つ目、原因を知りたいとき。指数は緑の葉の量の目安で、病気、水不足、刈り取りを区別しません。原因は現地で確かめます。5つ目、有償の商用データを使うとき。考え方は同じですが、帯の番号、ずらし、倍率は衛星ごとに違います。公式の表の代わりに、契約の仕様書で確かめます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 対象の区画と期間を決め、使う帯と分類の番号を表にする。赤B4、近赤外B8、除く番号3・8・9・10（人）
      - 帯と分類を読み、ずらしと倍率で反射率に直させる。値0は欠けとして記録（AI）
      - 雲と影の画素を除いて指数を計算させる。分母が0だった画素の数と、除いた画素の割合も出す（AI）
      - 区画ごとに平均させる。平均、使った画素数、除いた画素数、除いた割合の表（AI）
      - 値の範囲と除いた割合を確かめる。−1〜1か、茂った区画が0.6以上か、除いた割合が高い区画を順位に入れてよいか（人）
    say: 手順をまとめます。1、対象の区画と期間を決め、使う帯と分類の番号を表にする。入れるのは、区画の境界のファイルと、生育の段階に合う期間。出るのは、赤B4と近赤外B8、除く分類の番号、3、8、9、10の表です。人です。2、帯と分類を読み、反射率に直させる。入れるのは、製品の名前と1の表。出るのは、ずらしと倍率で直した赤と近赤外の2枚と、画素の値0を欠けとした記録です。AIです。3、雲と影の画素を除いて、指数を計算させる。入れるのは、分類の画像と除く番号。出るのは、指数の1枚と、分母が0だった画素の数、除いた画素の割合です。AIです。4、区画ごとに平均させる。出るのは、区画ごとの、平均、使った画素数、除いた画素数、除いた割合の表です。AIです。5、値の範囲と、除いた割合を確かめる。入れるのは、4の表と、知っている区画の様子。出るのは、値がマイナス1から1に収まるか、茂った区画が0.6以上か、除いた割合が高い区画を順位に入れてよいか、の判定です。人です。この5つを、指数を出すごとに繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      red = read_band(p, "B4")
      nir = read_band(p, "B8")
      scl = read_band(p, "SCL")
      bad = isin(scl, [3, 8, 9, 10])
      ndvi = (nir - red) / (nir + red)
      ndvi = where(bad, 0, ndvi)
      table = mean_by_zone(ndvi, zones)

      AIの説明：「指数は比なので、倍率は分子と分母で打ち消されます。反射率に直す
      　手間は省きました。雲の画素は、除いたあと0にしてから平均しています」
      → 最も茂っているはずの森の区画が0.28、裸地の区画が0.17。
      　同じ日の雲が多かった北側の区画は、どれも0.1前後

      問い：この結果から最初に疑うべきことはどれか
      A. 近赤外にB8ではなくB8Aを使うべきで、帯の取り違えで森の値が低い
      B. ずらし（BOA_ADD_OFFSET）を足さずに割り算し、森も裸地も一律にずれている。
      　 さらに、除いた画素を0にして平均に入れ、雲の多い区画ほど平均が下がる
      C. 除く分類の番号が違い、植物の画素を除いて雲を残している
      D. 6月は葉が茂りきって値が頭打ちになるので、森と裸地の差が出ない
    highlight: [5, 6]
    say: 宿題です。章のケース問題の問1を出します。ある市の担当者が、AIに、Sentinel-2のLevel-2Aで、農地の区画ごとに6月の植生の指数の平均を出して。雲は除いて、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。指数は比なので、倍率は分子と分母で打ち消されます。反射率に直す手間は省きました。雲の画素は、除いたあと0にしてから平均しています。できた表では、市内で最も茂っているはずの森の区画が0.28、裸地の区画が0.17でした。また、同じ日の雲が多かった北側の区画は、どれも0.1前後に並んでいました。この結果から、最初に疑うべきことはどれでしょうか。A、近赤外にB8ではなくB8Aを使うべきで、帯の取り違えで森の値が低い。B、画素の値にずらしを足さずに割り算しているので、森も裸地も一律にずれている。さらに、除いた画素を0にして平均に入れているので、雲の多い区画ほど平均が下がる。C、除く分類の番号が違い、植物の画素を除いて雲を残している。D、6月は葉が茂りきって値が頭打ちになるので、森と裸地の差が出ない。この動画で見た、値の目安と、判定の表を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が、直した表の地図で、北西から南東に帯状に低い区画が並ぶのを見つけ、AIが、この帯の区画は生育不良です、現地調査の候補にしてください、と答えた場面で、先に確かめるべきことと理由を2行で書く、問2の短答も、そこにあります。

