# ユースケース解説動画の台本。元の記事：casebook/embankment-change-screening-saga.qmd
title: 衛星データで盛土の候補地を洗い出す：佐賀市431km²で151か所
series: CASEBOOK
kicker: ユースケース解説
number: 85
total: 221
thumb: 盛土の候補151か所
summary: 佐賀県の2025年度の実証で、無償の光学衛星とLバンドSARから盛土と地形改変の候補地を抽出した事例。佐賀市約431km²で151か所を抽出し、従来の方法で把握した17か所のうち15か所を再現しました。業務のどこに入れ、何を決める材料になるか、限界と費用の読み方までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで盛土の候補地を洗い出す
    sub: 佐賀市約431km²で151か所。見に行く場所を絞る使い方
    say: 県全域の盛土や地形の改変を、人が歩いて回らずに見つける方法はあるか。答えは、無償の衛星データで変化のあった場所を先に拾い、現地で見る候補地のリストにすることです。佐賀県の実証では、佐賀市の約431平方キロで151か所の変化を抽出し、従来の方法で把握していた17か所のうち15か所を再現しました。この動画では、誰が、業務のどこに入れて、何を決める材料にするのか。限界と費用の読み方までを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。佐賀県の2025年度「衛星データの活用可能性実証事業」
      - 誰が：県の盛土規制の担当（発注の想定）と、衛星会社と建設コンサルタントの共同事業体（解析）
      - 何のために：盛土規制法の基礎調査と、パトロールと立入調査の対象を絞る
      - 困りごと：県全域を人が歩いて見て回ることは難しい。商用の光学画像は雲で隠れ、誤検出と見逃しが出る
    say: 事例の舞台は、日本の佐賀県です。2025年度の、衛星データの活用可能性実証事業として行われました。解析したのは、衛星会社と建設コンサルタントの共同事業体です。背景には、2023年に施行された盛土規制法があります。都道府県は規制区域を指定し、おおむね5年ごとの基礎調査と、平素からの監視を求められています。ところが、県全域を人が歩いて見て回ることは、現実には難しい。商用の光学画像を2つの時期で見比べる従来の方法も、雲で隠れて撮り直しが要り、誤検出と見逃しが出やすいとされています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-embankment-change-screening-saga/flow.svg
    caption: 年次の監視の計画を立てる前に、衛星の抽出を入れる
    say: 業務の流れを見ます。入る位置は、年次の監視とパトロールの計画を立てる前です。まず、規制区域を中心に、対象の範囲と比べる期間を決めます。次に、無償の光学画像とLバンドSARで、変化の候補地を抽出します。候補地は、許可と届出の記録、森林の伐採の届出、既存の盛土の台帳と照合し、説明のつく場所を外します。残った候補地に、パトロールと立入調査の順番を付けます。最後に、現地で確かめた結果を記録して、翌年の抽出の改善に戻します。衛星は、見に行く場所と順番を決める道具です。

  - kind: figure
    heading: 衛星と解析に任せることと、人が行うこと
    image: figures/usecase-embankment-change-screening-saga/split.svg
    say: 役割の分担です。衛星と解析が行うのは、3段構えの抽出です。1つ目、欧州の無償の光学衛星Sentinel-2で、植物の元気さを表す指数を2つの時期で比べます。2つ目、JAXAのだいち2号と4号、LバンドのSARで、電波の反射の強さの差から、盛土や切土のような地形の物理的な変化を拾います。3つ目、機械学習でノイズを除いて候補地に絞ります。人が行うのは、候補地を台帳と許可の記録と照合すること、現地のパトロールと立入調査で確かめること、そして是正の指導や命令を判断することです。変化が盛土かどうかは、衛星では決まりません。

  - kind: figure
    heading: 公表された数字
    image: figures/usecase-embankment-change-screening-saga/bar.svg
    caption: 佐賀市約431km²、2017年から2025年の変化
    say: 公表された数字を見ます。対象は佐賀市の約431平方キロ、期間は2017年から2025年です。従来の方法で把握していた17か所のうち、15か所を再現しました。さらに、従来の方法が見逃していた約130か所を新たに検出し、合計151か所の変化を抽出しました。ただし、これは県の実証事業で、本格運用ではありません。再現できなかった2か所の理由と、151か所のうち現地で地形の改変と確かめられた数、つまり誤検出の数は、公表されていません。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.5, 0.5]
    rows:
      - [変化の候補地の位置と範囲（GISの地図データ）, どこを見に行くか]
      - [候補地の一覧（検出した時期、光学とSARのどちらで拾ったか）, パトロールと立入調査の順番]
      - [許可と届出の記録との照合結果（自治体が作成）, 説明のつかない候補地の数、重点的に見る場所]
      - [現地で確かめた結果（自治体が記録）, 誤検出の割合、来年も同じ方法を続けてよいか]
    say: 受け取るデータと、それで決められることを整理します。候補地の位置と範囲は、どこを見に行くかの根拠になります。候補地の一覧は、検出した時期と、光学とSARのどちらで拾ったかが分かれば、パトロールと立入調査の順番を付ける材料になります。許可と届出の記録との照合結果が、説明のつかない候補地の数と、重点的に見る場所を示します。そして現地で確かめた結果が、誤検出の割合と、来年も続けてよいかの判断材料です。県全域に広げたときに候補地が何か所になり、そのうち何か所を現地で見られるか。これが、業務に入れるかどうかの判断の軸になります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-embankment-change-screening-saga/limits.svg
    say: 限界も、はっきり書かれています。1つ目、時間をかけて少しずつ広がる伐開は、今の方法では検出が難しい場合があります。2つ目、伐開や盛土のあとに草が生え戻った場所は、光学だけでは拾えません。SARが補うとされています。3つ目、無償のデータは、置き換える商用の光学画像より分解能が粗い。小さな盛土や幅の狭い改変がどこまで拾えるかの条件は、公表されていません。4つ目、誤検出の数と、再現できなかった理由は公表されていません。5つ目、変化が盛土かどうかは、衛星では決まりません。台帳との照合と現地の確認で決まります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-2は無償。10mの画素で、2機で5日に1回の観測
      - 植生の指数を2つの時期で比べれば、伐開や地表の変化の候補が拾える
      - 草が生え戻った場所は、光学だけでは見えにくい
      - 10mの画素では、小さな盛土や幅の狭い改変は拾いにくい
    say: では、無償の衛星でどこまでできるでしょうか。この実証の光学データは、無償のSentinel-2です。10メートルの画素で、2機で5日に1回観測しています。植生の指数を2つの時期で比べれば、伐開や地表の変化の候補は拾えます。データの費用は0円です。一方で、草が生え戻った場所は光学だけでは見えにくく、10メートルの画素では、小さな盛土や幅の狭い改変は拾いにくい。この実証では、地形の物理的な変化を拾うために、だいち2号と4号のLバンドSARを組み合わせています。

  - kind: table
    heading: SARのデータを使うと、いくらか（概算）
    columns: [項目, 仮定と計算]
    widths: [0.3, 0.7]
    rows:
      - [光学のデータ, Sentinel-2は無償。0円]
      - [SARのデータ（だいち2号・4号）, "公表価格：1シーン（50km四方）税抜8万円（環境省の資料、2026年3月）"]
      - [範囲, "仮定：佐賀市約431km²は、50km四方の1シーンに収まる"]
      - [時期, "仮定：比べる2つの時期で1シーンずつ、計2シーン"]
      - [SARのデータ代, "8万円 × 2シーン ＝ 税抜16万円。県全域なら、シーン数に比例して増える"]
      - [別にかかるもの, 解析の委託費（金額は非公開）、記録との照合、現地の確認（候補地の数に比例）]
    say: 費用の概算です。これは仮定を置いた計算で、見積もりではありません。この実証の契約金額は公開されていません。光学のSentinel-2は無償です。だいち2号と4号のデータは、実証の資料では商用SARデータの見出しの下にあり、無償か有償かは明記されていません。参考として、公表価格は1シーン、50キロ四方あたり税抜8万円です。環境省のマニュアルの、2026年3月時点の値です。佐賀市の約431平方キロが1シーンに収まると仮定し、2つの時期で2シーンなら、データ代は税抜16万円です。県全域なら、シーン数に比例して増えます。これに、解析の委託費、記録との照合、現地の確認が別にかかります。なお、県全域で従来の調査より50パーセント超の費用減という数字は、見積もりであって、実績ではありません。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [対象の広さ, 県全域など、人が見て回れない広さ, 市街地の一部など、見て回れる範囲]
      - [変化の起こり方, 短い期間に起きる伐開や盛土, 時間をかけて少しずつ広がる改変]
      - [変化の大きさ, 10mの画素で捉えられる広さ, 小さな盛土、幅の狭い改変]
      - [記録の整備, 許可と届出の記録を地図と重ねられる, 記録が紙で、位置と重ねられない]
      - [求めるもの, 現地で見る場所の候補と順番, 盛土かどうかの確定、違反の認定]
    say: 最後に、向き不向きです。向いているのは、県全域のように人が見て回れない広さで、短い期間に起きる伐開や盛土を、10メートルの画素で捉えられる大きさで探す場合です。許可と届出の記録が地図と重ねられることも条件です。逆に、見て回れる範囲、少しずつ広がる改変、小さな盛土、記録が紙のまま、盛土かどうかの確定まで求める、という場合は向きません。提案するときの要点は3つです。最初に、記録が地図と重ねられるかを聞くこと。50パーセント超の費用減を実績として言わないこと。見逃しがなくなるとは言わないことです。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：Synspective（佐賀県の2025年度実証における盛土・地形改変の抽出の報告。英語） https://www.synspective.com/news/embankment/"
      - "出典：佐賀県「令和7年度 衛星データの活用可能性実証事業 企画提案仕様書」"
      - "出典：国土交通省「盛土規制法」、国土交通省・農林水産省「盛土規制法の施行に当たっての留意事項について」（2023年5月26日）"
      - "価格：環境省「地盤沈下観測等における衛星活用マニュアル」（令和8年3月改訂版、表2-11、2026年3月現在） https://www.env.go.jp/content/000386973.pdf"
      - "衛星の仕様：Copernicus SentiWiki「Sentinel-2 Mission」"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
