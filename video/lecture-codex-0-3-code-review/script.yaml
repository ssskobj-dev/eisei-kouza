# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第0部 第3章「コードの読み方とレビューの基本」（learn/codex/codex-0-3-code-review.qmd）
title: 衛星データ解析コードの読み方：5つの塊と12の観点で、書けなくても確かめる
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 3
total: 30
thumb: 5つの塊 12の観点
summary: AIが書いた衛星データの解析コードを、コードを書けない人が確かめる型です。取る、選ぶ、計算する、まとめる、出すの5つの塊に区切り、塊の境目の行だけをAIに1行ずつ説明させ、12項目の観点で公式資料と突き合わせます。Sentinel-2のLevel-2AにLandsatの決まりが混ざった抜粋を、一緒にレビューして3つの誤りを見つけます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 解析コードの読み方：5つの塊と12の観点
    sub: 全部は読まない。境目の数行だけを見る
    say: AIが書いた数十行の解析コードを、コードを書けない自分がどこまで確かめられるでしょうか。答えは、全部を読まなくてよい、です。コードを、取る、選ぶ、計算する、まとめる、出すの5つの塊に区切り、塊の境目にある数行と、12項目の観点に当たる行だけを見ます。AIに正しいか確認してと聞いて、正しいですと返ってきても、それは確認ではありません。確認は、公式資料と突き合わせた人だけができます。この動画では、5つの塊、4つの手順、12項目の観点を見たあと、AIが自信たっぷりに返してきたコードを一緒にレビューして、3つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - AIが書いた解析コードを「取る、選ぶ、計算する、まとめる、出す」の5つの塊に分けて読み、要所を確かめられる
      - AIに1行ずつ説明させる方法と、別の頼み方でもう一度書かせて突き合わせる方法を使い分けられる
      - どの章の解析にも当てる、共通のレビュー観点12項目を一覧で持てる
    say: この章を終えると、3つのことができるようになります。1つ目、AIが書いた衛星データの解析コードを、取る、選ぶ、計算する、まとめる、出すの5つの塊に分けて読み、要所を確かめられること。2つ目、AIに1行ずつ説明させる方法と、別の頼み方でもう一度書かせて突き合わせる方法を、使い分けられること。3つ目、どの章の解析にも当てる、共通のレビュー観点12項目を、一覧で持てることです。

  - kind: figure
    heading: しくみ：5つの塊
    image: figures/codex-0-3-code-review/blocks.svg
    say: まず、しくみです。衛星データの解析コードは、長く見えても、やっていることは5つに分かれます。データを取る。使う画素を選ぶ。値を計算する。区画や期間でまとめる。表や地図に出す。どの衛星でも、どの指数でも、この順番は変わりません。図の左から、取るでは、衛星、処理の段階、波長帯、倍率とずらしを見ます。選ぶでは、雲と影、期間、範囲、座標。計算するでは、式の向き、分母、基準の値。まとめるでは、欠けた値、画素の数と面積。出すでは、表の単位と件数、隠れた失敗です。塊に分けると、見る場所が決まります。そして大事なのは、誤りの多くは塊の中ではなく、塊の境目で起きる、ということです。取った値の倍率が違うまま、計算に渡す。選んで除いたつもりの画素が、まとめる段で平均に混ざる。こうした境目の数行を見るだけで、大きな誤りの大半は拾えます。AIは、この境目を自信のある口調でつなぎます。たとえば、Sentinel-2のLevel-2A、大気の影響を補正した地表の反射率では、画素の値に波長帯ごとのずらしを足し、倍率の10000で割ると反射率になります。一方、Landsat 8と9のCollection 2 Level-2の地表反射率は、画素の値に0.0000275を掛けて、0.2を引きます。衛星が違えば、決まりが違います。AIは、この2つを混ぜて、どちらにも見える1行を書くことがあります。

  - kind: figure
    heading: 手順：確かめる4つ
    image: figures/codex-0-3-code-review/flow.svg
    say: 手順は4つです。1、5つの塊に区切る。人の仕事です。入れるのはAIのコードで、出るのは、ここまでが取る、ここからが選ぶ、と印を付けたコードです。区切れない行があれば、何をしているか分からない行なので、次の手順でまず聞きます。2、塊の境目を1行ずつ説明させる。AIと人です。境目の数行について、この行は何を入れて何を出すか、を説明させます。説明の中に出てくる数字や名前、波長帯の番号、倍率、分類の番号を書き出します。3、12項目の観点を当て、公式資料で確かめる。人です。書き出した数字と名前を資料と突き合わせ、合う、違う、を判定します。合わない行は、資料のどこを見て直すかを添えて、AIに直させます。4、別の頼み方でもう一度書かせ、突き合わせる。AIと人です。言い回しを変えた同じ指示文で2本目を書かせ、1本目と違う箇所を探します。違う箇所が、AIが補った箇所です。違いの1つ1つに、どちらが正しいかを資料で決めます。ここで注意が1つ。4の突き合わせで2本が同じだったからといって、正しいとは限りません。よくある誤りは、2本とも同じように誤ります。突き合わせは、違う箇所を見つけるための手順で、合っている箇所を信じるための手順ではありません。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.70]
    rows:
      - [このコードは正しい？, このコードを5つの塊に区切って、塊の境目の行だけ、何を入れて何を出すか説明して]
      - [反射率の計算は合ってる？, 反射率に直す行で使った、ずらしと倍率の値を書いて。それをSentinel-2の公式資料のどこで確かめたか、資料の名前を書いて]
      - [雲は除いてある？, 雲として除いた分類の番号を全部書いて。除いた画素は、平均の分母に入っているか、入っていないかを書いて]
    say: レビューのための頼み方は、コードを書かせる頼み方とは別に用意します。表の左が、あいまいな頼み方。右が、直した頼み方です。このコードは正しい、と聞くと、AIは正しいです、と答えます。AIは、自分のコードを疑う材料を持っていません。代わりに、このコードを5つの塊に区切って、塊の境目の行だけ、何を入れて何を出すか説明して、と頼みます。反射率の計算は合ってる、ではなく、反射率に直す行で使った、ずらしと倍率の値を書いて。それをSentinel-2の公式資料のどこで確かめたか、資料の名前を書いて。雲は除いてある、ではなく、雲として除いた分類の番号を全部書いて。除いた画素は、平均の分母に入っているか、入っていないかを書いて。何を入れて何を出すか、どの資料で確かめたか、と聞くと、答えの中に、人が資料と突き合わせられる数字と名前が現れます。これが、レビューの頼み方のコツです。

  - kind: table
    heading: レビュー観点1〜6
    columns: [観点, 何を見るか, 主に見る塊]
    widths: [0.20, 0.64, 0.16]
    rows:
      - [1. データ, 指示した衛星、処理の段階、期間のデータを読んでいるか, 取る]
      - [2. 実在するか, 関数、引数、データの名前が実在するか。AIは、ありそうな名前を作る, 取る]
      - [3. 波長帯, 波長帯の番号が、使う衛星の公式資料と合うか, 取る]
      - [4. 値の倍率, 画素の値を物理的な値に直す倍率とずらしが、その衛星の決まりか, 取る]
      - [5. 雲と影, 雲、雲の影、薄い雲を除いているか。分類の番号は公式の表と合うか, 選ぶ]
      - [6. 位置と座標, 範囲の座標の基準と、緯度と経度の順番が、データとそろっているか, 選ぶ]
    say: 共通のレビュー観点は12項目です。どの章の解析でも、この順に当てます。前半の6つを見ます。1、データ。指示した衛星、処理の段階、期間のデータを読んでいるか。2、実在するか。関数、引数、データの名前が実在するか。AIは、ありそうな名前を作ります。3、波長帯。波長帯の番号が、使う衛星の公式資料と合うか。4、値の倍率。画素の値を物理的な値に直す倍率とずらしが、その衛星の決まりか。ここまでの4つは、主に、取るの塊で見ます。5、雲と影。雲、雲の影、薄い雲を除いているか。分類の番号は、公式の表と合うか。6、位置と座標。範囲の座標の基準と、緯度と経度の順番が、データとそろっているか。5と6は、選ぶの塊です。

  - kind: table
    heading: レビュー観点7〜12
    columns: [観点, 何を見るか, 主に見る塊]
    widths: [0.18, 0.62, 0.20]
    rows:
      - [7. 比べる条件, 2時期を比べるとき、季節、衛星、処理の段階がそろっているか, 選ぶ]
      - [8. 基準の値, しきい値の出どころが書いてあるか。一般的に、で済ませていないか, 計算する]
      - [9. 欠けた値, 除いた画素を0にしていないか。欠けを平均の分母から外しているか, まとめる]
      - [10. 面積, 画素の数に掛ける1画素の面積が、使った波長帯の画素の大きさか, まとめる]
      - [11. 失敗の隠れ, エラーを握りつぶして0や空を返していないか。処理できた件数を出しているか, 出す]
      - [12. 学習と確認, 機械学習で、確認用のデータが学習に混ざっていないか, 計算する]
    say: 後半の6つです。7、比べる条件。2つの時期を比べるとき、季節、衛星、処理の段階がそろっているか。選ぶの塊です。8、基準の値。しきい値の出どころが書いてあるか。一般的に、で済ませていないか。計算するの塊です。9、欠けた値。除いた画素を0にしていないか。欠けは欠けのまま、平均の分母から外しているか。まとめるの塊です。10、面積。画素の数に掛ける1画素の面積が、使った波長帯の画素の大きさか。これも、まとめるです。11、失敗の隠れ。エラーを握りつぶして、0や空を返していないか。処理できた件数を出しているか。出すの塊です。12、学習と確認。機械学習で、確認用のデータが学習に混ざっていないか。計算するの塊です。この章で特に見るのは、4の値の倍率、5の雲と影、9の欠けた値の3つです。ここから、この3つを、実際のコードで一緒にやってみます。

  - kind: code
    heading: 一緒に：塊に区切る
    code: |
      # S2 L2A：区画ごとの植生の指数の平均（誤りあり）
      red = read_band(scene, "B4") * 0.0000275 - 0.2  # 取る
      nir = read_band(scene, "B8") * 0.0000275 - 0.2  # 取る
      scl = read_band(scene, "SCL")                   # 取る
      bad = (scl == 8) | (scl == 9)                   # 選ぶ
      index = (nir - red) / (nir + red)               # 計算する
      index[bad] = 0                                  # 選ぶのつもり
      table = mean_by_parcel(index, parcels)          # まとめる
      save_csv(table, "result.csv")                   # 出す
    highlight: [2, 3, 5, 7]
    notes:
      - 書き出す数字と名前
      - 0.0000275 と 0.2
      - 分類の 8 と 9
      - 除いた画素に 0
    say: ここからは、一緒にやってみましょう。やることは、手順の1から3です。AIのコードを5つの塊に区切り、境目の行から数字と名前を書き出して、公式資料と突き合わせます。手元で数分でできます。用意するのは、AIが返したコードと説明、そして、章のページの出典1と2にある、Sentinel-2の公式資料です。今回、AIはこう説明してきました。Level-2Aの反射率は、画素の値に0.0000275を掛けて0.2を引いて求めます。雲は分類の8と9なので、その画素は0にして平均から外します。自信のある口調です。画面がそのコードです。コメントの部分を見ると、2行目から4行目が、取る。5行目が、選ぶ。6行目が、計算する。7行目が、選ぶ、のつもり。8行目が、まとめる。9行目が、出す。まず、区切るのはここまででできました。次に、境目の行から、数字と名前を書き出します。2行目と3行目、0.0000275と、0.2。5行目、分類の8と9。7行目、除いた画素に0を入れている。この3つを、資料と突き合わせます。ここで1つ、大事なことがあります。このコードは、動かしても止まりません。表はできて、地図も描けます。だから、動いたかどうかでは、誤りに気づけません。

  - kind: table
    heading: 一緒に：資料と比べる
    columns: [行, 観点, AIの説明・コード, 公式資料, 判定]
    widths: [0.07, 0.15, 0.33, 0.29, 0.16]
    rows:
      - ["2-3", 4. 値の倍率, ×0.0000275 −0.2（Landsat）, S2 L2Aは（画素の値＋ずらし）÷10000, 別の衛星]
      - [5, 5. 雲と影, 8と9を除く, 8と9は雲。3の雲の影と10の薄い雲も除く, 足りない]
      - [7, 9. 欠けた値, 除いた画素を0にする, 0は「指数が0」という値。平均の分母に混ざる, 外れていない]
    say: 突き合わせの結果が、この表です。1つ目、2行目と3行目の値の倍率。コードは、0.0000275を掛けて0.2を引いています。これは、Landsat Collection 2 Level-2の地表反射率の決まりです。Sentinel-2のLevel-2Aでは、画素の値に、波長帯ごとのずらしを足し、倍率の10000で割ります。ずらしは、製品の付属情報に書かれていて、処理の版04.00から入りました。この版は、2022年1月25日に始まっています。判定は、別の衛星の決まり。正しくは、付属情報からずらしと倍率を読み、画素の値にずらしを足して、倍率で割る、と書きます。2つ目、5行目の雲と影。8と9は、確からしさが中と高の雲です。これは合っています。ですが、3の雲の影と、10の薄い雲が残っています。判定は、足りない。正しくは、3、8、9、10を除きます。3つ目、7行目の欠けた値。除いたつもりの画素を、0にしています。0は、値がない、ではなく、指数が0、という値です。だから8行目の平均に、分母ごと混ざります。判定は、外れていない。正しくは、欠けを示す印、欠損値を入れ、平均では欠けを分母から外し、使えた画素の数を表に出します。判定が出たので、AIに、3つの行について、何が違うか、資料のどこを見るかを伝えて、直させます。直し方を自分で書く必要はありません。AIの説明は、3つとも自信のある口調でした。1つ目は別の衛星の決まり、3つ目は、外します、と言いながら外していない書き方です。公式資料を開けば、どれも数分で確かめられます。

  - kind: bullets
    heading: 結果の目視レビュー観点4つ
    items:
      - 答えの分かっている区画の値：森が高く、ため池が低いか。逆なら倍率か波長帯が疑わしい
      - 値の範囲：植生の指数は−1から1。全部の区画が負なら、倍率とずらしが別の衛星の決まり
      - 使えた画素の数：区画ごとの画素の数が表にあるか。ないなら欠けた値の扱いを確かめられない
      - 雲の多い日の値：約2か月に24回の観測で晴天は8回という例。少ないのは異常ではなく記録すべき条件
    say: コードを直したら、表と地図を目で確かめます。見るのは4つ。1つ目、答えの分かっている区画の値。森が高く、ため池が低いか。順番が逆なら、倍率か波長帯が疑わしい。2つ目、値の範囲。植生の指数は、マイナス1から1の間の値です。全部の区画が負なら、倍率とずらしが、別の衛星の決まりです。3つ目、使えた画素の数。区画ごとの画素の数が表にあるか。ないなら、欠けた値の扱いを確かめられません。4つ目、雲の多い日の値。期間内の画像のうち、何枚を使ったか。農研機構の資料では、2018年4月から6月の約2か月に24回の観測があり、晴天は8回でした。使えた枚数が少ないのは、異常ではなく、記録すべき条件です。おかしな結果の例を2つ。例1、全部の区画が負の値で、森がため池より低い。Landsatの決まりで反射率に直したためです。Sentinel-2の画素の値は、反射率を10000倍した整数なので、0.0000275を掛けて0.2を引くと、赤も近赤外も負の小さな値になります。負どうしで指数を計算すると符号が反転し、森が低く出ます。例2、雲の縁にかかった区画だけ、平均が0に近い。除いたつもりの画素が、0として平均に混ざったためです。雲に半分かかった区画の平均は、本当の値の半分近くまで下がり、茂りが少ない候補の上位に、雲の縁の区画が並びます。最後に、言えることと言えないこと。言えるのは、5つの塊の境目の行が指示どおりに書かれ、12項目で公式資料と合い、答えの分かっている区画で予想どおりの値が出た、ことです。言えないのは、コードに誤りがない、ことです。レビューは、見た観点について誤りがなかったことしか保証しません。見ていない観点は、見ていないと書きます。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - コードが5つの塊に区切れない。1行に取る・選ぶ・計算するがまとまっていると、境目がない
      - 公式資料が見つからない仕様。出どころを確かめられない行は「確かめていない」として残す
      - AIが参照先を示せない。資料の名前が返ってこない値は、AIが補った値
      - 有償の商用データを使うとき。塊と観点は同じ。倍率と波長帯の出どころが契約の仕様書になる
    say: この型が向かない条件も、押さえておきます。1つ目、コードが5つの塊に区切れないとき。1つの行で、取る、選ぶ、計算するをまとめて書いてあると、境目がありません。AIに、塊ごとに分けて書き直して、と頼んでから読みます。2つ目、公式資料が見つからない仕様。倍率や分類の番号の出どころが資料で確かめられないときは、その行は、確かめていない、として残します。3つ目、AIが参照先を示せないとき。どの資料で確かめたか、に資料の名前が返ってこないときは、AIが補った値です。人が資料を探すか、その値を使わない設計に変えます。4つ目、有償の商用データを使うとき。5つの塊と12項目は変わりません。変わるのは、値の倍率と波長帯の出どころが、公式の公開資料ではなく、契約で受け取った仕様書になることです。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 5つの塊に区切る（人）。取る、選ぶ、計算する、まとめる、出す。区切れない行はまず聞く
      - 塊の境目を1行ずつ説明させる（AIと人）。何を入れて何を出すか。数字と名前を書き出す
      - 12項目の観点を当て、公式資料で確かめる（人）。合わない行は資料のどこを見るかを添えて直させる
      - 別の頼み方でもう一度書かせ、突き合わせる（AIと人）。違う箇所がAIの補った箇所。同じでも信じない
    say: 手順をまとめます。1、5つの塊に区切る。人の仕事です。取る、選ぶ、計算する、まとめる、出す。区切れない行は、まず聞きます。2、塊の境目を1行ずつ説明させる。AIと人です。何を入れて何を出すかを説明させ、数字と名前を書き出します。3、12項目の観点を当て、公式資料で確かめる。人です。合わない行は、資料のどこを見るかを添えて、AIに直させます。4、別の頼み方でもう一度書かせ、突き合わせる。AIと人です。違う箇所が、AIの補った箇所。同じだったからといって、信じません。この4つを、どの解析でも繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      AIの説明：「反射率は、Sentinel-2の決まりどおり、
      画素の値を10000で割って求めます。雲は分類の3、8、9、10
      なので除きます。除いた画素は平均に入りません。」

      red = read_band(scene, "B4") / 10000
      nir = read_band(scene, "B8") / 10000
      scl = read_band(scene, "SCL")
      bad = (scl == 3) | (scl == 8) | (scl == 9) | (scl == 10)
      index = (nir - red) / (nir + red)
      index[bad] = 0
      table = mean_by_parcel(index, parcels)

      問い：このコードに残っている誤りとして正しいものは
      A. 波長帯の番号が別の衛星の決まりで、B4とB8は近赤外と赤ではない
      B. 雲の分類の番号が公式の表と合っていない
      C. 反射率に直す行にずらしがなく、除いた画素が0として平均に混ざる
      D. 誤りはない。AIの説明どおりに動く
    highlight: [13]
    notes:
      - 答えは動画では言いません
      - 答えと解説はサイトで
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、2025年5月から6月の区画ごとの植生の指数の平均を出して、雲は除いて、と頼みました。AIは、画面のコードと、この説明を返しました。反射率は、Sentinel-2の決まりどおり、画素の値を10000で割って求めます。雲は分類の3、8、9、10なので除きます。除いた画素は平均に入りません。問いは、5つの塊と12項目の観点で見たとき、このコードに残っている誤りとして正しいものはどれか、です。選択肢は4つ。A、波長帯の番号が別の衛星の決まりで、B4とB8は近赤外と赤ではない。B、雲の分類の番号が公式の表と合っていない。C、反射率に直す行にずらしがなく、除いた画素が0として平均に混ざる。D、誤りはない。AIの説明どおりに動く。この動画で一緒にやった、取るの塊と、選ぶとまとめるの境目を思い出して、説明とコードを見比べてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。2本目のコードと突き合わせる問2の短答も、そこにあります。

