# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第1部 第3章「衛星データの分解能と撮影の間隔：Sentinel-2の画像を数え、使える枚数と対象の画素数を確かめる」（learn/codex/codex-1-3-resolution-revisit.qmd）
title: 衛星データの使える枚数の数え方：Sentinel-2は2か月24回観測で晴天8回
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 7
total: 30
thumb: 使える画像を数える
summary: 「分解能10m、5日に1回」という仕様の数字と、手元で実際に使える画像の枚数は、なぜ大きく違うのか。Sentinel-2とLandsatの分解能と撮影の間隔を押さえたあと、雲の割合の単位、範囲を一部しか覆わない区画、同じ日の2製品、季節の偏りという落とし穴を、AIが返した誤りを仕込んだコードを一緒にレビューして見つけます。幅30mの農道が何画素分に写るかを電卓で確かめる練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 使える画像を数える：分解能と撮影の間隔
    sub: 全部で何枚、使えるのは何枚、対象は何画素分か。仕様の数字から推測しない
    say: 田植えの時期の変化を見たい。5月に使える衛星の画像は、本当にあるでしょうか。答えは、仕様の数字から枚数を推測せず、期間内の画像を実際に一覧にして、範囲を覆うか、範囲の中に雲がどれだけあるか、季節ごとに何枚残るかを数える、です。この数え方を飛ばすと、あとの解析は、あるはずの画像を前提に組まれ、肝心の月だけ結果が出ない、ということが起きます。この動画では、分解能と撮影の間隔のしくみと、数字の読み違いを見たあと、AIが返したコードを一緒にレビューして、4つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 期間内の画像の一覧と雲の割合を出し、使える枚数と、対象が何画素分かを確かめられる
      - 「分解能10m」「5日に1回」という仕様の数字と、実際に使える枚数が、なぜ大きく違うのかが分かる
      - 雲の割合の基準、範囲を一部しか覆わない画像、季節の偏り、対象の大きさと画素の数という4つの落とし穴に、コードの段階で気づける
    say: この章を終えると、3つのことができるようになります。1つ目、期間内の画像の一覧と雲の割合を出し、使える枚数と、対象が何画素分かを確かめられること。2つ目、分解能10m、5日に1回、という仕様の数字と、手元で実際に使える枚数が、なぜ大きく違うのかが分かること。3つ目、雲の割合の基準、範囲を一部しか覆わない画像、季節の偏り、対象の大きさと画素の数、という4つの落とし穴に、AIのコードの段階で気づけることです。たとえば、AIが、使える画像は18枚です、と言ったとき、その18枚が自分の範囲を全部覆っていて雲がないのかを、自分で確かめられるようになります。

  - kind: table
    heading: しくみ：2つの「間隔」
    columns: [項目, Sentinel-2（無償の光学）, Landsat 8と9（無償の光学）]
    widths: [0.16, 0.40, 0.44]
    rows:
      - [10mの帯, 青、緑、赤、近赤外の4つ, なし（30mが基本）]
      - [ほかの帯, 20mが6つ、60mが3つ, 白黒の帯15m、熱の帯100m]
      - [撮影の間隔, 1機で10日、2機で赤道上5日, 1機で16日、2機で8日ずれ]
      - [運用の体制, 2Cが2Aと交代（2025年1月）, 8号と9号の2機]
    say: まず、しくみです。光学衛星の画像には、2つの間隔があります。1つは分解能で、1つの画素が地表の何メートルを表すかです。もう1つは撮影の間隔で、同じ場所を次に撮るまでの日数です。この2つは、衛星ごとに決まっています。表の左が、無償の光学衛星Sentinel-2です。13の波長帯のうち、4つが10m、6つが20m、3つが60mの画素です。10mなのは、青、緑、赤、近赤外の4つです。撮影の幅は290kmで、衛星1機だと同じ場所に10日ごと、2機の体制で、赤道上は5日ごとに戻ります。2025年1月21日にSentinel-2CがSentinel-2Aと交代し、以後は2Bと2Cが基本の2機です。2Aは2025年3月から延長の運用に入り、2機を補っています。表の右が、無償のLandsat 8と9です。画素は30mで、白黒の帯は15m、熱の帯は100mです。1機で16日ごと、2機が8日ずらして回っています。ここまでが、仕様の数字です。問題は、この数字をそのまま、使える枚数だと読んでしまうことです。

  - kind: bullets
    heading: 数字の読み違い2つ
    items:
      - 撮影の間隔は晴れの日の間隔ではない。約2か月に24回の観測で晴天は8回。田植えと稲刈りの時期は画像が得にくい
      - 画像の単位は自分の範囲と一致しない。110km四方の区画で配られ、帯の端は一部しか埋まらず、つなぎ目は同じ日に2製品
      - 雲の割合も区画の単位。Sentinel-2もLandsatも区画・シーン全体の値。自分の範囲の雲は、範囲を切り出して自分で数える
    say: ここで、数字の読み違いが2つ起きます。1つ目は、撮影の間隔は、晴れの日の間隔ではない、ことです。光学衛星は、雲の上から地表を撮れません。農研機構の資料では、2018年4月8日から6月7日までの約2か月に、Sentinel-2の観測が24回あり、晴天だったのは8回でした。岩手県の調査では、2018年から2022年の5月から10月を旬ごとに見たとき、市の全域が雲なしで使える旬は少なく、田植えと稲刈りの時期に画像が得られないことが多かった、と報告されています。つまり、使える枚数は季節に偏ります。2つ目は、画像の単位が、自分の範囲と一致しない、ことです。Sentinel-2の製品は、100kmごとの格子に沿った、110km四方の区画、タイルで配られます。区画には、画像データで全部が埋まっているものと、一部しか埋まっていないものがあります。一部しか埋まっていないのは、撮影の帯の端にある区画です。さらに、帯のつなぎ目にある区画では、同じ日に2つの製品ができることがあります。製品の数を数えると、同じ日を2回数えたり、自分の範囲が欠けた製品を1枚と数えたりします。雲の割合も、同じ単位の問題があります。Sentinel-2の雲の割合は、雲の分類で雲とされた画素の数を、区画の全画素で割った値です。110km四方の区画の値であって、その中の自分の範囲の値ではありません。Landsatも同じで、付属情報のCLOUD_COVERはシーン全体、CLOUD_COVER_LANDはシーンの陸の画素だけで計算した割合です。どちらも、自分の範囲の雲の割合は、範囲を切り出して、自分で数える必要があります。

  - kind: figure
    heading: 手順：6段階
    image: figures/codex-1-3-resolution-revisit/count.svg
    say: 手順は6段階です。図の青がAIに任せる段階、オレンジが人が判断する段階です。1、期間と範囲を決め、製品の一覧を出させる。入れるのは、範囲の境界のファイルと、期間、衛星と処理の段階です。出るのは、製品の名前、観測の日時、区画の番号、相対軌道の番号、区画の雲の割合の表です。2、日付でまとめさせる。同じ日に2つの製品があるときは、1日として数えます。3、範囲を全部覆うかを調べさせる。範囲の中で欠けた値、画素の値が0の画素の数と、その割合を出させます。帯の端の区画は、ここで見つかります。4、範囲の中の雲の割合を数えさせる。範囲を切り出した雲の分類で、雲が8と9、薄い雲が10、雲の影が3とされた画素の割合を出させます。区画全体の割合ではなく、この値で判断します。5、月ごとに数える。人の仕事です。月ごとの、全部の枚数、範囲を全部覆う枚数、雲が基準以下の枚数を出します。使える枚数が0の月があれば、その月は解析できない、と先に決めます。6、対象の画素数を計算する。これも人です。対象の幅と長さを、画素の大きさで割ります。この計算は、あとで一緒にやります。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.66]
    rows:
      - [雲のない画像を探して, 範囲を切り出し、雲の分類の8、9、10、3の割合を数え、10%以下の日付を一覧にして]
      - [使える枚数を数えて, 製品の数ではなく観測の日付の数で数えて。欠けた値がある日付は別に数えて]
      - [対象は写りますか, 幅30m、長さ100mの対象が10mの画素で縦横何画素か、縁を除くと何画素かを表にして]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。雲のない画像を探して、とだけ頼むと、AIは区画全体の雲の割合で絞ります。110km四方のどこかに雲が多いだけで、自分の範囲が晴れている画像を捨てます。逆に、区画全体では晴れでも、自分の範囲の上だけ雲がある画像を拾います。代わりに、範囲を切り出し、雲の分類で8、9、10、3の画素の割合を数え、10%以下の日付を一覧にして、と頼みます。使える枚数を数えて、ではなく、製品の数ではなく観測の日付の数で数えて。範囲に欠けた値がある日付は別に数えて。対象は写りますか、ではなく、幅30m、長さ100mの対象が、10mの画素で縦横それぞれ何画素か、縁を除くと何画素かを表にして。指示の7項目のうち、確かめ方には、製品の一覧の件数と日付でまとめたあとの件数を両方表示させること、区画全体の雲の割合と範囲の中の雲の割合を並べて表示させることを書きます。対象の画素数は、自分で別に計算して、突き合わせます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 2025年4〜7月の使える画像を数える（誤りあり）
      scenes = search("Sentinel-2 L2A", bbox=aoi,
                      start="2025-04-01", end="2025-07-31")
      usable = []
      for s in scenes:
          if s.cloud_cover < 20:       # 雲の割合20%未満
              usable.append(s)
      print("使える枚数:", len(usable))
      print("対象の画素数:", 30 / 10)   # 幅30mを10mで割る
    highlight: [6, 8, 9]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。手元で数分でできます。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。cloudCoverは、検索した範囲の中の雲の割合です。範囲が小さいので、そのまま使えます。Sentinel-2は日本では毎日撮影しているので、20%未満で絞っても十分な枚数が残ります。幅30mなら3画素あるので、問題なく写ります。自信のある口調です。画面がそのコードです。当てる観点は5つ。1、雲の割合を、自分の範囲で数え直しているか。2、範囲の中の欠けた値を見ているか。3、製品の数ではなく、日付の数で数えているか。4、月ごとに数えているか。5、対象の画素数を、面と縁で計算しているか。まず、6行目を見てください。カタログの雲の割合で絞っています。次に、コード全体を見ても、範囲の欠けた値を数える行がありません。8行目。製品の数を、そのまま使える枚数として表示しています。月ごとの集計もありません。最後に、9行目。幅30mを10mで割った、3という数だけです。ここで1つ、大事なことがあります。このコードは、動かしても止まりません。使える枚数、18、のような、もっともらしい数字が出ます。だから、動いたかどうかでは、誤りに気づけません。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.07, 0.15, 0.36, 0.40]
    rows:
      - ["6", 雲と影, カタログの雲の割合で絞る。「検索した範囲の中の雲の割合」, 区画全体の値。日付ごとに雲の分類を範囲で切り出し、8、9、10、3の画素の割合で絞る]
      - [なし, 欠けた値, 範囲の欠けた値を数える行がない, 帯の端の区画は一部しか画像がない。画素の値0の割合を数え、0でない日付は別に扱う]
      - ["8", 比べる条件, 製品の数を枚数にする。「日本では毎日撮影」, つなぎ目の区画は同じ日に2製品。観測の日付でまとめてから数える。公式の数字は1機10日、2機で赤道上5日]
      - ["9", 面積, 30÷10＝3。「3画素あるので問題なく写る」, 幅の方向だけの数。面は3×10で30画素、縁を除くと8画素。幅と長さの両方を割り、縁を除いて表にする]
    say: 判定の結果が、この表です。誤りは4つです。1つ目、6行目。cloud_coverは、区画全体の雲の割合です。AIの、検索した範囲の中の雲の割合、は誤りです。正しくは、日付ごとに雲の分類を範囲で切り出し、8、9、10、3の画素の割合を数えて、その値で絞ります。2つ目、範囲の欠けた値を見ていないことです。帯の端の区画では、範囲の一部に画像がありません。正しくは、範囲の中の画素の値0の割合も数え、0でない日付を、一部しか覆わない、として別に扱います。3つ目、8行目。製品の数を枚数にしています。帯のつなぎ目の区画では同じ日に2つの製品があり、2倍に数えます。正しくは、観測の日付でまとめてから数えます。AIの、日本では毎日撮影、にも裏付けがありません。公式の資料にあるのは、1機で10日、2機で赤道上5日、という数字です。4つ目、9行目。30割る10イコール3は、幅の方向の画素数だけです。長さ100mなら、面としては30画素、縁を除くと8画素です。3画素あるので問題なく写る、は、縁の混ざりを無視しています。正しくは、幅と長さの両方を画素で割り、縁を除いた数を表にします。この4つは、動かしても止まりません。使える枚数18、のような数字の中に、自分の範囲だけ雲の日と、範囲が欠けた日と、同じ日の2製品が混ざり、5月が0枚でも分かりません。判定が出たので、AIに、何が違うかを伝えて、直させます。4つ目の計算は、次の場面で電卓でやってみます。

  - kind: table
    heading: 一緒に：対象の画素数を電卓で確かめる
    columns: [手順, 計算, 結果]
    widths: [0.36, 0.38, 0.26]
    rows:
      - [対象の寸法を決める, 農道。幅30m、長さ100m, ""]
      - [幅の方向の画素数, 30÷10, 3画素]
      - [長さの方向の画素数, 100÷10, 10画素]
      - [面で数える, 3×10, 30画素]
      - [縁を除く（周りと混ざらない画素）, 幅は真ん中の1列、長さは両端を除いて8, 1×8＝8画素]
      - [Landsatの30mの画素なら, 30÷30＝1。縁を除くと, 0画素]
    say: 4つ目の誤りを、電卓で確かめます。手元の電卓か、紙と鉛筆で、数分でできます。まず、対象の寸法を決めます。農道で、幅30m、長さ100mです。次に、幅の方向の画素数。30割る10で、3画素。これがAIの答えでした。ここで止めずに、長さの方向も割ります。100割る10で、10画素。面で数えると、3掛ける10で、30画素分です。次が大事です。縁の画素は、農道と周りの畑が混ざります。混ざらない画素は、幅の方向は真ん中の1列だけ、長さの方向は両端を除いて8。1掛ける8で、8画素分しかありません。最後に、同じ農道を、画素が30mのLandsatで見るとどうなるか。30割る30で、幅の方向に1画素。混ざらない画素は、ありません。つまり、幅30mの対象は、Landsatでは縁の混ざりだけになります。1つ、注意があります。この計算は、画素の格子と対象の縁がそろった場合の例です。実際は格子と縁がずれるので、混ざらない画素はこれより少なくなります。それでも、仕様の数字と対象の寸法だけでできる計算なので、解析の前に、必ず自分で一度やっておきます。

  - kind: figure
    heading: 結果の目視観点：絞り込みの各段を見る
    image: figures/codex-1-3-resolution-revisit/funnel.svg
    say: 直したら、日付ごとの表と月ごとの表を、目で確かめます。図は、使える画像が絞り込まれていく段階です。製品の数、日付の数、範囲を全部覆う枚数、範囲の中の雲が基準以下の枚数、そして肝心の月に残る枚数。各段で何が減るかを見ます。見るのは5つ。1つ目、区画全体の雲の割合と、範囲の中の雲の割合が、大きく違う日付があるか。違うのが正常です。同じ値が並んでいたら、範囲で切り出していません。2つ目、欠けた値の割合が0でない日付が、相対軌道の番号ごとに固まっているか。帯の端は、軌道ごとに決まった側に出ます。ばらばらに出ていたら、範囲の座標か切り出しが間違っています。3つ目、同じ日付に2行あるか。あれば、日付でまとめる前の表です。4つ目、月ごとの枚数が、季節に偏っているか。偏るのが正常です。4か月とも同じ枚数なら、雲で絞っていません。5つ目、対象の画素数の計算が、自分の手計算と合うか。さっきの電卓の結果と突き合わせます。おかしな結果の例を2つ。例1、4月から7月まで、毎月6枚ずつ使える、と出た。約2か月の24回のうち晴天は8回、田植えの時期に得られないことが多い、のに、偏りがありません。原因は、雲で絞っていないことです。コードを見ると、製品の一覧をそのまま月ごとに数えています。例2、範囲の中の雲の割合が0%なのに、画像の東半分が真っ黒。雲の画素を数えると0%ですが、欠けた値の画素を数えていません。帯の端の区画で、範囲の東半分に画像がない日付です。欠けた値の割合を、雲とは別の列で出します。言えるのは、この期間に、この範囲を全部覆い、範囲の中の雲が基準以下の画像が、月ごとに何枚あるか、と、対象が何画素分に写るか、です。言えないのは、使える画像で対象の変化が見える、ことです。雲が基準以下でも、薄いかすみや雲の影は残ります。対象が8画素分に写ることと、8画素で変化を判定できることは、別です。この章は、解析の材料が何枚あるかを数える章です。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 数日のうちの変化を追いたいとき。10日や5日の間隔に雲の日が重なる。雲を通すレーダー衛星か、頻度の高い有償の衛星を検討
      - 幅が画素の大きさに近い対象。幅10m以下の道や水路は、10mの画素では縁の混ざりだけ。混ざらない画素が0なら見られない
      - 梅雨や雪の季節だけを見たいとき。使える枚数が0の月がある。期間を広げるか、別の季節で答えられる問いに置き換える
      - 有償の商用データ。考え方は同じ。撮影の間隔、区画の形、雲の割合の計算は契約の仕様書で決まる。仕様書と突き合わせる
    say: 向かない条件も、押さえておきます。1つ目、数日のうちの変化を追いたいとき。1機で10日、2機で赤道上5日の間隔に、雲の日が重なります。無償の光学衛星では、特定の日の画像は期待できません。雲を通すレーダー衛星か、撮影の頻度の高い有償の衛星を検討します。2つ目、幅が画素の大きさに近い対象。幅10m以下の道や水路は、10mの画素では縁の混ざりだけになります。画素数の計算で、混ざらない画素が0になるなら、その衛星では対象を見られません。3つ目、梅雨や雪の季節だけを見たいとき。季節の偏りで、使える枚数が0の月があります。期間を前後に広げるか、別の季節の画像で代わりに答えられる問いに置き換えます。4つ目、有償の商用データを使うとき。考え方は同じですが、撮影の間隔、区画の形、雲の割合の計算の仕方は、契約の仕様書で決まります。公式の表の代わりに、仕様書と突き合わせます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 期間と範囲を決め、製品の一覧（名前、日時、区画、相対軌道、区画の雲の割合）を出させる（人とAI）
      - 観測の日付でまとめさせる。同じ日の2製品は1日に（AI）
      - 範囲の中の欠けた値（画素の値0）の割合を数えさせる（AI）
      - 範囲の中の雲（8、9）、薄い雲（10）、影（3）の画素の割合を数えさせる（AI）
      - 月ごとに数え、0枚の月を先に見つける。対象の画素数を幅と長さと縁で計算する（人）
    say: 手順をまとめます。1、期間と範囲を決め、製品の一覧を出させる。製品の名前、観測の日時、区画の番号、相対軌道の番号、区画の雲の割合の表です。人とAIです。2、観測の日付でまとめさせる。同じ日の2製品は1日に数えます。AIです。3、範囲の中の欠けた値、画素の値0の割合を数えさせる。AIです。4、範囲の中の雲、薄い雲、影の画素の割合を数えさせる。区画全体の値ではなく、この値で絞ります。AIです。5、月ごとに数え、0枚の月を先に見つける。そして、対象の画素数を、幅と長さと縁で計算する。人です。この5つを、画像を使う解析の前に、毎回繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      月     製品の数   使える枚数（雲20%未満）
      4月       12          7
      5月       12          7
      6月       12          6
      7月       12          7
      合計      48         27

      コード：usable = [s for s in scenes if s.cloud_cover < 20]
      AIの説明：「cloud_coverは範囲の中の雲の割合なので、そのまま使えます。
                 6月も6枚あるので、梅雨でも解析できます」

      問い：この結果から最初に疑うべきことはどれか
      A. 製品の数が毎月12で使える枚数もほぼ同じ。範囲の中で数えておらず、季節の偏りが出ていない
      B. 4か月で48製品は多すぎるので、検索の期間の指定が誤っている
      C. 使える枚数が27枚もあるので、しきい値の20%が緩すぎる
      D. 5月の7枚は田植えの時期なので、このまま解析に進んでよい
    highlight: [2, 3, 4, 5, 8]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、2025年4月から7月で、町の農地、約2km四方を解析に使える画像を月ごとに数えて、と頼みました。AIが返した表とコードの抜粋が、画面のものです。製品の数は、4月から7月まで毎月12。使える枚数は、雲20%未満で、7、7、6、7の合計27枚。コードは、cloud_coverが20未満の製品を使える枚数にしています。AIの説明は、cloud_coverは範囲の中の雲の割合なので、そのまま使えます。6月も6枚あるので、梅雨でも解析できます、でした。この結果から、最初に疑うべきことはどれでしょうか。A、製品の数が毎月12で、使える枚数も毎月ほぼ同じなので、雲の割合を範囲の中で数えておらず、季節の偏りが出ていない。B、4か月で48製品は多すぎるので、検索の期間の指定が誤っている。C、使える枚数が27枚もあるので、しきい値の20%が緩すぎる。D、5月の7枚は田植えの時期なので、このまま解析に進んでよい。この動画で見た、雲の割合の単位と、季節の偏りを思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。幅30mの農道の画素数について、AIの答えの問題点と正しい数え方を2行で書く、問2の短答も、そこにあります。

