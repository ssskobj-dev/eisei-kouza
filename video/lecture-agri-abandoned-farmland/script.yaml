# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第2部「農地利用状況調査：衛星データで荒廃農地の候補を先に絞る」（learn/agri/agri-abandoned-farmland.qmd）
title: 衛星データで農地パトロールの筆を約50%減らす：農業委員会の5つの手順と限界
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 7
total: 30
thumb: 見回る筆を絞る
summary: 農業委員会の農地利用状況調査（農地パトロール）に衛星データを入れると、見回る筆を減らせます。伊万里市は約4,000筆、約50%の削減でした。ただし衛星が出すのは「おそれの推定」で、遊休農地の判定は現地で一筆ごとに行います。5つの限界、5つの手順、費用の3つの分け方、1年目の実証で何を測るかを、章の内容に沿って一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 農地利用状況調査：荒廃農地の候補を先に絞る
    sub: 衛星の「推定」と、現地の「判定」を分ける
    say: 衛星データがあれば、農業委員会の農地パトロールで、区域の全部の農地を見回らなくてよくなるでしょうか。答えは、見回る筆は減らせますが、判定は現地です。佐賀県伊万里市は、衛星の解析を使って、見回る筆を約4,000筆、約50パーセント減らしました。ただし衛星が出すのは、荒廃農地の「おそれがある」という推定で、遊休農地かどうかの判定は、現地で一筆ごとに行います。この動画では、衛星にどこまで任せ、どこから現地で判定するかを、章の内容に沿って見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 衛星の「おそれがある農地の推定」と、現地の「遊休農地の判定」の違いを、委員と議会に説明できる
      - 自分の区域の筆数、区画データ、調査員の体制から、衛星で絞り込む運用を設計できる
      - 公開されている費用の事例をもとに、1年目に何を試し、何を測るかを決められる
    say: この章を終えると、3つのことができるようになります。衛星による「おそれがある農地の推定」と、現地での「遊休農地の判定」の違いを、委員と議会に説明できること。自分の区域の筆数、区画データ、調査員の体制から、衛星で絞り込む運用を設計できること。そして、公開されている費用の事例をもとに、1年目に何を試し、何を測るかを決められることです。

  - kind: figure
    heading: 結論：衛星と人の分担
    image: figures/agri-abandoned-farmland/conclusion.svg
    say: 先に結論です。衛星に任せられるのは、区域の全筆を同じ時期に見ること、おそれのない筆とある筆に分けること、見回る筆の候補を出すことです。人が行うのは、おそれのある筆を現地で一筆ごとに判定すること、判別しにくい農地を見回りに残すこと、そして省いた筆の理由を台帳に残すことです。衛星は「おそれの推定」、遊休農地の「判定」は現地で一筆ごとに行います。

  - kind: bullets
    heading: 現場が欲しい成果
    lead: 農業委員会は、農地法第30条にもとづいて、毎年1回、区域内の全ての農地の利用状況を調査します
    items:
      - 従来は、原則として全ての農地を道路から目視。時期は夏に重なる
      - 効率化：見回る筆を減らし、委員と事務局の夏の負担と日数を減らしたい
      - 先に知る：おそれのある筆を先に絞り、判定と地権者への働きかけに時間を集めたい
      - 2022年7月の改正で、画像でおそれがないと確認した農地は現地確認を省けるようになった
    say: 農業委員会は、農地法第30条にもとづいて、毎年1回、区域内の全ての農地の利用状況を調査します。従来は、原則として全ての農地を、道路から目で確かめる方法でした。時期は夏に重なります。広島県尾道市の資料は、農業委員が酷暑の中で紙の地図を使い、毎年8月から9月に農地を一筆ごとに確認し、山間地の坂道や飛び地の巡回が体力的な負担になっていると書いています。長崎県雲仙市の実証でも、8月ごろの調査での委員の熱中症への不安が課題でした。現場が欲しいのは2つです。1つ目は効率化。見回る筆を減らし、委員と事務局の夏の負担と日数を減らしたい。2つ目は、先に知ること。荒廃農地のおそれがある筆を先に絞り、委員の時間をその筆の判定と、地権者への働きかけに集めたい。国も、この方向で制度を直しています。2022年7月に、農地法の運用の通知と、農地パトロールの実施要領が改正され、衛星などの画像で遊休農地のおそれがないことを確認した農地は、現地確認を省けるようになりました。

  - kind: figure
    heading: 効く2つの強み
    image: figures/agri-abandoned-farmland/strengths.svg
    caption: 広く見られる、客観的に示せる
    say: この用途で効く強みは2つです。1つ目、広く見られる。区域の全筆が、同じ時期の画像に入ります。農林水産省のeMAFF農地ナビは、農地の地目や面積、権利の設定を衛星写真に重ねて無料で公開しており、衛星写真は原則として年1回更新されます。栃木県野木町は、この無償のツールで耕作の状況を目視し、見回りの担当者を2名から1名に、期間を2週間から1週間にしました。令和7年度の農林水産省のアンケートでは、回答1,264件のうち、現地確認に衛星画像を使えることを73パーセントの自治体が知っていて、そのうち205の自治体が実際に活用していました。2つ目、客観的に示せる。衛星の解析結果は、筆ごとに区分の付いたデータとして残ります。伊万里市では、事業者が区画を4段階に色分けしたデータで納品します。見回りを省いた筆について、なぜ省いたかを示せるので、委員会や議会への説明の根拠になります。農林水産省の資料は、見回りを省く場合は理由を明示し、関係する組織と事前に調整して合意を得ることが重要だとしています。

  - kind: figure
    heading: 5つの限界
    image: figures/agri-abandoned-farmland/limits.svg
    say: 衛星は候補を絞る道具で、遊休農地を判定する道具ではありません。限界は5つです。1つ目、「おそれ」の推定であって、判定ではない。制度の線がここにあります。福島県のマニュアルが示す手順では、衛星の画像で一筆ごとに調査し、遊休農地に該当するおそれのある農地とされたものは、一筆ごとに現地調査を行います。精度も事業者ごとに違います。福島市では、AIが見回り「不要」と判定した農地の精度が90パーセントを超えたとされますが、農林水産省の資料は、サービスにより異なると注記しています。2つ目、判別しにくい農地がある。狭小な農地、果樹園や茶畑、田の畦畔の有無は、判定が難しい例に挙げられています。伊万里市の4区分にも、微小な区画で解析できない「解析対象外」があります。3つ目、画像の時期と細かさに条件がある。使える画像は、調査の実施時期に撮影された、十分な解像度のものに限られます。衛星画像は天候の影響などで、必ずしも毎年最新に更新されるとは限りません。4つ目、筆の区画データが要る。農地台帳の地番に緯度と経度を付けるひも付け率は、全国平均で81パーセントです。残りの筆は、位置が決まらなければ解析できません。5つ目、小さい筆が多い区域では効果が小さい。狭小な農地が多い中山間の集落では、現地に残る筆が多く、効率化の効果が小さい場合があります。

  - kind: figure
    heading: 分けられる農地、残す農地
    image: figures/agri-abandoned-farmland/judge.svg
    caption: 畦畔やかんがいの機能は、衛星で直接は判定しにくい
    say: 限界の2つ目を、農地の種類で整理するとこうなります。水稲や畑作で、作付けや水張りが見える筆は、衛星で分けやすい。草地や、管理の程度が分かりにくい筆は、要確認に回す。果樹園、茶畑、狭小な筆、畦畔の有無は、最初から現地に残します。畦畔やかんがいの機能は衛星で直接判定しにくいため、水稲の作付けや水張りがあれば田と判定している自治体が多いとされます。

  - kind: figure
    heading: 落とし所：確定は現地で
    image: figures/agri-abandoned-farmland/funnel.svg
    caption: 省いた筆も、数%を抜き取って見回る
    say: 落とし所は、「全筆を道路から目視する」調査を、「おそれのある筆を現地で判定する」調査に組み替えることです。衛星で「おそれがない」とされた筆は現地確認を省き、「おそれがある」筆と「判別しにくい」筆は、現地で一筆ごとに判定します。省いた筆も、数パーセントを抜き取って見回り、精度を確かめます。伊万里市はこの検証を行っています。雲仙市の実証では、アプリが耕作放棄地の可能性を70パーセント以上と判定した農地を委員が一筆ずつ目視し、70パーセント未満の農地も見落としがないか確かめました。もう1つ大切なのは、言えないことを先に明示することです。衛星の区分は「おそれの推定」であり、「遊休農地の判定」ではないことを、調査の計画と台帳の記録に書きます。衛星で省いた筆と、現地で判定した筆が台帳の上で区別できないと、翌年の調査で何を見直すべきか分からなくなります。

  - kind: figure
    heading: 絞り込む調査の5つの手順
    image: figures/agri-abandoned-farmland/flow.svg
    caption: 最初の2つは衛星と解析、残りの3つは人が行う
    say: 手順は5つです。1、筆の区画データを整える。eMAFF農地ナビのデータか、自治体の地番図を使います。2、衛星の解析で、おそれのない筆、おそれのある筆、判別しにくい筆に分ける。3、現地で判定する筆を、委員と推進委員の担当区域ごとに割り当てる。4、調査員が端末で、一筆ごとに判定と写真を記録する。5、台帳に反映し、衛星で省いた筆には省いた理由を残す。最初の2つは衛星と解析、残りの3つは人が行います。絞り込んだ後の現地確認は、紙の地図から端末に替えると効果が出ます。農林水産省の現地確認アプリは、タブレット1台で現地確認ができ、入力した内容が農地台帳のシステムに自動で連携します。愛知県蒲郡市の事業では、衛星の解析結果から現地調査のアカウントを作り、調査員がタブレットで現状の確認、地権者への意向の聞き取り、写真の撮影、判定の入力を行います。端末が別々のシステムだと二重の入力になるので、台帳への戻し方を先に決めます。

  - kind: figure
    heading: 始め方と費用感
    image: figures/agri-abandoned-farmland/cost.svg
    caption: 最初の一歩は、1年間の実証
    say: 最初の一歩は、1年間の実証です。伊万里市は導入の前に1年間の実証を行い、大分県玖珠町は2年間の実証で精度を確かめてから、現地に行く箇所を隔年で分ける方針にしました。実証の年は、全筆の現地調査を従来どおり行い、衛星の区分と現地の判定を、筆ごとに突き合わせます。これで、自分の区域での見逃しと空振りの割合が分かります。費用は3つに分けて考えます。1つ目、衛星の解析。無償のツールで目視する方法から、委託の解析まで幅があります。伊万里市は年50万円前後で、中山間地域等直接支払交付金の推進交付金を使っています。福島市は3つの制度を横断して衛星の解析サービスを入れ、費用は年約267万円で、補助金は使っていません。蒲郡市の事業費は2,079千円です。2つ目、区画データの整備。地番と位置のひも付けを、自治体で行うか、委託に含めるか。3つ目、端末と現地。タブレットの台数と通信費、残る見回りの人手です。尾道市は、1日4時間の調査の時間を1時間程度に短縮し、年間の経費を45パーセント削減する見込みとしています。効果の測り方は、筆数と日数です。伊万里市は見回り筆数で約4,000筆、約50パーセント。福島市は3つの制度の合計で約23,000筆の削減でした。なお、伊万里市と福島市の数字は、多面的機能支払や中山間地域等直接支払の現地確認の資料にあるものです。農業委員会の調査とは制度が違いますが、絞り込みの考え方は同じです。課をまたいで1つの解析を使えないかを、先に相談します。

  - kind: table
    heading: 向き不向き
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [農地の種類, 田と畑が中心で、作付けや水張りが見える, 果樹園、茶畑が多い]
      - [筆の大きさ, 1筆が大きく、筆数が多い, 狭小な筆が多い中山間]
      - [区画データ, 地番と位置のひも付けが済んでいる, ひも付けが遅れ、地番図もない]
      - [画像, 調査の時期に撮った画像が得られる, その年の画像がない]
      - [体制, 現地の判定と検証を続ける委員がいる, 衛星で現地確認をなくそうとしている]
      - [台帳との接続, 端末の記録が台帳に戻る, 紙とシステムの二重入力]
      - [使い方, 候補を絞り、現地で一筆ごとに判定する, 衛星の区分をそのまま判定にする]
    say: 向き不向きを表にまとめます。農地の種類は、田と畑が中心で作付けや水張りが見えるなら向き、果樹園や茶畑が多いと向きません。筆の大きさは、1筆が大きく筆数が多いなら向き、狭小な筆が多い中山間は向きません。区画データは、地番と位置のひも付けが済んでいるかどうか。画像は、調査の時期に撮った画像が得られるかどうか。体制は、現地の判定と検証を続ける委員がいるなら向き、衛星で現地確認をなくそうとしているなら向きません。台帳との接続は、端末の記録が台帳に戻るかどうか。使い方は、候補を絞って現地で一筆ごとに判定するのが正しく、衛星の区分をそのまま遊休農地の判定にするのは誤りです。向いていないが多い区域では、衛星を主役にせず、無償のツールで目視して重点を決める方法から始めます。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 実証の年に何を測るかを、紙1枚で決めます。衛星の区分と現地の判定を突き合わせる表です
    items:
      - 用意するもの：区域の筆数と、前年の利用状況調査の結果（筆ごとの判定）
      - 表の縦：衛星の区分（おそれなし／おそれあり／要確認／解析対象外）
      - 表の横：現地の判定（耕作されている／遊休農地のおそれ）
      - 見ること：「おそれなし」なのに現地で遊休農地だった筆（見逃し）の数
    say: ここからは、一緒にやってみましょう。章の始め方にある、実証の年に衛星の区分と現地の判定を突き合わせる、を紙1枚でやります。用意するのは、区域の筆数と、前年の利用状況調査の結果です。筆ごとに、耕作されていたか、遊休農地のおそれがあったかの判定が台帳にあるはずです。表の縦は、衛星の区分です。伊万里市の例にならって、おそれなし、おそれあり、要確認、解析対象外の4つ。表の横は、現地の判定です。耕作されている、遊休農地のおそれ、の2つ。見ることは1つだけ。衛星が「おそれなし」としたのに、現地では遊休農地だった筆、つまり見逃しが、何筆あるかです。

  - kind: prompt
    heading: 紙に書く表の型
    label: 記入の型
    text: |
      区域の筆数：約○○筆　　前年の調査日：○月○日

      　　　　　　　　　　　現地：耕作されている ／ 現地：遊休農地のおそれ
      衛星：おそれなし　　　　（省ける筆）　　　　　（見逃し ← ここを数える）
      衛星：おそれあり　　　　（空振り）　　　　　　（当たり）
      衛星：要確認　　　　　　　現地で判定する筆
      衛星：解析対象外　　　　　現地で判定する筆

      判定：見逃しが少ない → 「おそれなし」を省ける見込み。数%の抜き取りは続ける
      　　　見逃しが多い → 農地の種類、画像の時期、区画データのどれが外れているか見直す
    say: 紙に、この表を書いてみてください。上に、区域の筆数と、前年の調査日を書きます。表は、縦が衛星の4つの区分、横が現地の2つの判定です。衛星が「おそれなし」で、現地も耕作されている筆は、来年から省ける筆です。衛星が「おそれなし」なのに、現地では遊休農地のおそれがあった筆が、見逃しです。ここを数えます。衛星が「おそれあり」で、現地では耕作されていた筆は、空振りです。見回る手間は増えますが、見逃しほど問題ではありません。要確認と解析対象外は、どちらにしても現地で判定する筆です。全部埋めたら、下に判定を書きます。見逃しが少なければ、「おそれなし」を省ける見込みが立ちます。ただし、数パーセントの抜き取りは続けます。見逃しが多ければ、農地の種類、画像の時期、区画データのどれが外れているかを見直します。今日は、数字の欄は空欄で構いません。実証の年に、この表を埋めるために何を記録しておくかが分かることが、最初の一歩です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 1年目は実証にして、全筆の現地調査と衛星の区分を筆ごとに突き合わせる
      - 筆の区画データを整える。ひも付けを誰が進めるかを先に決める
      - 衛星で、おそれのない筆、ある筆、判別しにくい筆に分ける
      - 果樹園、茶畑、狭小な筆は、最初から現地に残す
      - 現地で一筆ごとに判定し、端末の記録を台帳に戻す
      - 省いた筆には理由を残し、数%を抜き取って精度を確かめる
    say: 手順をまとめます。1、1年目は実証にして、全筆の現地調査と衛星の区分を、筆ごとに突き合わせる。2、筆の区画データを整える。ひも付けを誰が進めるかを先に決める。3、衛星で、おそれのない筆、ある筆、判別しにくい筆に分ける。4、果樹園、茶畑、狭小な筆は、最初から現地に残す。5、現地で一筆ごとに判定し、端末の記録を台帳に戻す。6、省いた筆には理由を残し、数パーセントを抜き取って精度を確かめる。衛星が出すのはおそれの推定で、遊休農地の判定は現地で行います。

  - kind: bullets
    heading: 宿題：言えないこと
    bold: true
    items:
      - 場面：約6,000筆の区域で、「おそれなし」4,200筆、「おそれあり」900筆、「要確認」600筆、「解析対象外」300筆
      - A. 現地で一筆ごとに判定する候補は、まず「おそれあり」と「要確認」の筆である
      - B. 「解析対象外」の300筆は、衛星では分けられていないので、現地で見る必要がある
      - C. 「おそれなし」の4,200筆は、遊休農地ではないと判定された
      - D. 「おそれなし」の筆からも、数%を抜き取って見回れば精度を確かめられる
    say: 宿題です。ある町の農業委員会事務局が、衛星解析の委託の結果を受け取りました。区域の約6,000筆のうち、「おそれなし」が4,200筆、「おそれあり」が900筆、「要確認」が600筆、「解析対象外」が300筆でした。この結果から、言えないことはどれでしょうか。A、現地で一筆ごとに判定する候補は、まず「おそれあり」と「要確認」の筆である。B、「解析対象外」の300筆は、衛星では分けられていないので、現地で見る必要がある。C、「おそれなし」の4,200筆は、遊休農地ではないと判定された。D、「おそれなし」の筆からも、数パーセントを抜き取って見回れば精度を確かめられる。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに3問あります。

