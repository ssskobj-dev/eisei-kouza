# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第2部「収穫適期：衛星データで刈り取りの順番を決める」（learn/agri/agri-harvest-order.qmd）
title: 衛星データで刈り取りの順番を決める：成熟期マップの5つの手順と5つの限界
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 6
total: 30
thumb: 刈る順番を決める
summary: 衛星の成熟期マップは、管内の圃場を早い順に並べ、実測する圃場と収穫順を決める道具です。水分計の代わりにはなりません。青森県の収穫時期の予測は誤差が従来法の半分。雲、圃場の大きさ、倒伏など5つの限界と、穂水分の実測と組み合わせる5つの手順、前年の収穫日で先に試す方法を、一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 収穫適期：刈り取りの順番を決める
    sub: 衛星の成熟期マップを、穂水分の実測と組み合わせる
    say: 衛星の成熟期マップがあれば、穂を抜いて水分を測る実測は要らなくなるでしょうか。答えは、要らなくはなりません。衛星が出すのは、管内の圃場を同じ日に見た、成熟の早い遅いの並びです。青森県の津軽地域では、8月下旬の衛星画像から水田1枚ごとの収穫時期を予測していて、誤差は3年間の平均で2.0日、従来法の4.0日の半分でした。それでも、水分計の代わりにはなりません。この動画では、成熟期マップを収穫順に使う5つの手順と、雲や倒伏など5つの限界を、章の内容に沿って見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 衛星の成熟期マップと、穂水分やタンパクの推定が、収穫順の判断にどこまで使えるかを説明できる
      - 衛星の推定と、現地の穂水分や青味籾の実測を、どの順で組み合わせるかを決められる
      - 自分の管内の作物、圃場の大きさ、天候が、この使い方に向くかを判定できる
    say: この章を終えると、3つのことができるようになります。衛星の成熟期マップと、穂水分やタンパクの推定が、収穫順の判断にどこまで使えるかを説明できること。衛星の推定と、現地の穂水分や青味籾の実測を、どの順で組み合わせるかを決められること。そして、自分の管内の作物、圃場の大きさ、天候が、この使い方に向くかを判定できることです。

  - kind: figure
    heading: 結論：衛星と人の分担
    image: figures/agri-harvest-order/conclusion.svg
    say: 先に結論です。衛星に任せられるのは、管内の全圃場を同じ日に見ること、成熟の早い遅いで圃場を並べること、穂水分やタンパクの目安を出すことです。人が行うのは、早い群と遅い群から数筆を実測すること、乾燥施設の能力と照らして順番を決めること、倒伏や病害の圃場を並びから外すことです。成熟期マップは、水分計の代わりではなく、実測する圃場と順番を決める道具です。

  - kind: bullets
    heading: 現場が欲しい成果
    lead: 収穫期の指導員は、どの圃場から刈るかを毎日のように聞かれます
    items:
      - 共同の乾燥施設では、コンバインと乾燥機の能力に合わせて、筆ごとの順番を組む
      - 刈り遅れは、胴割米や茶米の原因になる
      - 従来の収穫予測は、出穂後の積算気温から市町村ごとに出すもの。圃場ごとの早い遅いは分からない
      - 欲しいのは、穂を抜かずに順番を組む効率化と、早く熟す圃場を1〜2週間前に知ること
    say: 収穫期の営農指導員は、どの圃場から刈るかを毎日のように聞かれます。共同の乾燥施設を使う地域では、コンバインと乾燥機の能力に合わせて、筆ごとの順番を組まなければなりません。北海道新篠津村の乾燥施設の利用組合では、4戸が秋まき小麦30ヘクタール、32筆と、水稲41ヘクタール、72筆を共同で収穫と乾燥をしています。従来は穂水分や整粒の割合と目視で順番を決めていましたが、筆数が多く労力がかかっていました。刈り遅れは品質に響きます。青森県の資料は、収穫の遅れが胴割米や茶米の原因になる地域での活用を想定しています。従来の収穫予測は、出穂後の積算気温から市町村ごとに出すものでした。市町村単位では、圃場ごとの早い遅いは分かりません。現場が欲しいのは2つです。数十から数百の筆の順番を、穂を抜いて乾かす手間をかけずに組むこと。そして、どの圃場が早く熟すかを収穫の1、2週間前に知り、乾燥施設の計画と農家への連絡に使うことです。

  - kind: figure
    heading: 効く2つの強み
    image: figures/agri-harvest-order/strengths.svg
    caption: 広く見られる、見えないものが見える
    say: この用途で効く強みは2つです。1つ目、広く見られる。無償の光学衛星Sentinel-2は、1回の観測で290キロメートルの幅を撮り、画像の細かさは10メートルです。青森県の仕組みは、津軽地域の水田3,000平方キロメートルを衛星で撮っています。管内の全圃場が同じ日の1枚に入るので、圃場ごとの早い遅いを同じ物差しで並べられます。2つ目、見えないものが見える。衛星が測るのは、稲や麦の色と、葉の反射から計算する指標です。青森県の仕組みは、8月下旬の衛星画像の稲の色の違いから、水田1枚ごとの収穫時期を予測します。令和6年度に普及に移された「はれわたり」と「まっしぐら」の収穫支援では、成熟期の推定の誤差は平均で2.7日と2.5日。従来法の誤差は5.8日と7.2日でした。穂水分やタンパクも、目安が出ます。新篠津村の事例では、衛星の植生指数NDVIと、穂水分や整粒の割合の間に関係が見られました。福井県の試験では、県の衛星のNDVIと大麦の水分含有量に直線的な相関があるとしています。

  - kind: figure
    heading: 5つの限界
    image: figures/agri-harvest-order/limits.svg
    say: 限界は5つあります。1つ目、雲があると欠測になる。光学の衛星は、晴れた日の画像しか使えません。青森県の資料は、撮影時に雲で覆われた圃場は欠測になると明記しています。岩手県の研究では、北上市の5月から10月の観測を5年分、90旬調べたところ、市全域が使えた旬は12旬でした。収穫期の天候が悪い年は、マップが出ないか遅れる前提で、現地の方法を残しておきます。2つ目、推定するのは色の変化であって、水分そのものではない。岡山県の試験では、NDVIで籾の水分を推定して収穫適期を判断するのは難しいと結論しています。その年は倒伏の影響で水分が下がらず、2品種とも約29パーセントの水分で収穫期を迎えました。一方で、NDVIと青味籾の割合の相関は高く、相関係数は0.84と0.85でした。3つ目、小さい圃場は欠測か、精度が落ちる。青森県の資料は、面積20アール未満の圃場は欠測になる場合があるとしています。北海道の研究でも、細かさ20メートルのデータでは、0.4ヘクタール以下で推定の精度が下がりました。4つ目、倒伏、病害、雑草で誤差が増える。北海道の研究では、いもち病が出た地点の推定値は使えず、成熟期が周りより7日以上遅れる地点では、タンパクの推定値が実測より0.5から1.0パーセント高く出ました。画像は稲と雑草を区別できません。5つ目、画像の時期が決まっていて、間に合わないことがある。青森県では8月下旬の画像を使い、マップの公開は例年8月下旬から9月上旬です。刈り取りの直前に撮り直す使い方ではありません。タンパクと収量の判定は翌年の2月なので、今年の収穫順には使えず、次の年の指導に回ります。

  - kind: figure
    heading: 衛星が出す値と、知りたい値
    image: figures/agri-harvest-order/signal.svg
    caption: 並びには使える。水分の値そのものは難しい
    say: 限界の2つ目を、もう少し整理します。衛星が出す値と、現場が知りたい値には、3つの段階があります。成熟期の早い遅いは、色の変化から読み替えやすく、並びにそのまま使えます。穂水分や青味籾の割合は、基準の圃場でその年の実測との関係式を作れば、目安になります。籾水分の値そのものは、NDVIからの推定は難しい。岡山県の試験は、NDVIは相対的な値なので、基準になる圃場を設けて、その年のNDVIと青味籾の割合を調べてから予測に使う方法を提案しています。

  - kind: figure
    heading: 収穫順を決める手順
    image: figures/agri-harvest-order/flow.svg
    caption: 最初の1つは衛星と解析、残りの4つは人が行う
    say: 落とし所は、衛星を水分計の代わりにせず、実測する圃場と順番を決める道具にすることです。手順は5つです。1、成熟期マップで、管内の圃場を早い順に並べる。欠測の圃場は別に書き出す。2、乾燥施設とコンバインの処理能力と照らし、仮の順番を組む。3、早い群と遅い群から数筆ずつ選び、穂水分か青味籾の割合を実測して、その年の関係を確かめる。4、実測とのずれが大きければ、マップの並びをその分だけ動かす。5、倒伏、病害、雑草の多い圃場は、マップの値を使わず現地の判断に戻し、順番を農家に伝える。穂水分の実測は、衛星があっても残します。北海道の中央農業試験場の方法では、平均的な株を約20本採って穂水分を測り、穂水分40パーセントの日を成熟期とします。1日あたりの水分の減少を1.5パーセントとして成熟期までの日数を出し、予測が実測のプラスマイナス1日に収まった割合は、十勝で82パーセント、檜山で83パーセントでした。この実測を全筆で行うのが従来の負担で、衛星はその筆数を減らすために使います。新篠津村の事例では、衛星をもとに決めた順番で収穫しても、乾燥の燃料は従来と同等で、順番の決定は従来より省力的でした。雲や小さい圃場で欠けたところは、ドローンで補えます。岩手県は、ドローンの可視光の画像から計算する指標が籾の黄化の割合と相関するとしています。

  - kind: table
    heading: 向き不向き
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [筆数, 数十筆以上を共同で刈る, 十数筆で、穂を抜いて回れる]
      - [圃場の大きさ, 20a以上、0.4haより大きい, 20a未満の小さな田が多い]
      - [知りたいこと, 圃場の早い遅いの並び, 筆ごとの籾水分の値]
      - [圃場の状態, 倒伏、病害、雑草が少ない, 倒伏や雑草が多い]
      - [収穫期の天候, 8月下旬に晴れた日がある, 曇天が続き、欠測が多い]
      - [使い方, 並びを見て、数筆を実測する, 値をそのまま刈取日にする]
    say: 向き不向きを表にまとめます。筆数は、数十筆以上を共同で刈るなら向き、十数筆で穂を抜いて回れるなら、衛星は要りません。圃場の大きさは、20アール以上、0.4ヘクタールより大きければ向き、20アール未満の小さな田が多いと欠測が増えます。知りたいことは、圃場の早い遅いの並びなら向き、筆ごとの籾水分の値は向きません。圃場の状態は、倒伏、病害、雑草が少なければ向き、多いと誤差が増えます。収穫期の天候は、8月下旬に晴れた日があるかどうか。使い方は、並びを見て数筆を実測するのが正しく、値をそのまま刈取日にするのは誤りです。向いていないが多い管内では、衛星を主役にせず、穂水分の実測とドローンを中心に考えます。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 最初の一歩は、前年の収穫日が分かる圃場で確かめることです。紙1枚で、試す計画を書きます
    items:
      - 用意するもの：前年の収穫日の記録がある圃場、十数筆
      - 画像：前年の8月下旬ごろの、晴れた日の無償のSentinel-2の画像
      - 出すもの：圃場ごとの、稲の色の指標
      - 見ること：早い順の並びが、実際の収穫日の順と合うか
    say: ここからは、一緒にやってみましょう。章の始め方にある、前年の収穫日が分かる圃場で確かめる、を紙1枚でやります。用意するのは、前年の収穫日の記録がある圃場、十数筆です。画像は、前年の8月下旬ごろの、晴れた日の無償のSentinel-2の画像。そこから、圃場ごとに稲の色の指標を出します。見ることは1つだけ。衛星の早い順の並びが、実際の収穫日の順と合うかどうかです。合えば、その管内、その品種で使える見込みが立ちます。合わなければ、圃場が小さいか、倒伏や雑草が多いかなど、向かない条件を疑います。

  - kind: prompt
    heading: 紙に書く表の型
    label: 記入の型
    text: |
      画像の日：前年の8月下旬ごろの晴れた日　　品種：○○

      書く欄（4列）：圃場名 ／ 前年の収穫日の順位 ／ 衛星の指標の順位 ／ 順位の差
      行：前年の収穫日が分かる十数筆（A-1、A-2、…）
      欠測の圃場：別に書き出す（雲、20a未満）

      判定：順位がおおむね合う → この管内、この品種で使える見込み
      　　　合わない → 圃場の大きさ、倒伏、雑草のどれが外れているか見直す
    say: 紙に、この表を書いてみてください。上に、画像の日と、品種を書きます。表は4列です。圃場名、前年の収穫日の順位、衛星の指標の順位、そして順位の差。行は、前年の収穫日が分かる十数筆です。雲や20アール未満で欠測になった圃場は、表に入れず、別に書き出します。全部埋めたら、下に判定を書きます。順位がおおむね合えば、この管内、この品種で使える見込みが立ちます。合わなければ、圃場の大きさ、倒伏、雑草のどれが外れているかを見直します。前年の8月下旬に晴れた日の画像が無ければ、それ自体が、この管内では欠測の年がある、という答えです。今日は、数字の欄は空欄で構いません。どの記録を取り出せばよいかが分かることが、最初の一歩です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 前年の収穫日が分かる圃場で、並びが合うかを先に試す
      - 成熟期マップで早い順に並べる。欠測は別に書き出す
      - 乾燥施設とコンバインの能力と照らし、仮の順番を組む
      - 早い群と遅い群から数筆ずつ、穂水分か青味籾を実測する
      - 実測とのずれの分だけ、並びを直す
      - 倒伏、病害、雑草の圃場は現地の判断に戻し、農家に伝える
    say: 手順をまとめます。1、前年の収穫日が分かる圃場で、並びが合うかを先に試す。2、成熟期マップで早い順に並べる。欠測は別に書き出す。3、乾燥施設とコンバインの能力と照らし、仮の順番を組む。4、早い群と遅い群から数筆ずつ、穂水分か青味籾を実測して、その年の関係を確かめる。5、実測とのずれの分だけ、並びを直す。6、倒伏、病害、雑草の圃場は現地の判断に戻し、順番を農家に伝える。衛星が出すのは並びで、乾燥施設の能力と合わせて順番を決め、農家に伝えるのは指導員です。

  - kind: bullets
    heading: 宿題：言えないこと
    bold: true
    items:
      - 場面：8月下旬の成熟期マップで、A集落はおおむね早く、B集落の5筆だけが周りより目立って遅い。今年の穂水分の実測はまだ
      - A. B集落の5筆は、周りの圃場より成熟が遅れている可能性がある
      - B. A集落から先に実測の圃場を選び、仮の収穫順を組むとよい
      - C. B集落の5筆の籾水分は、今日の時点で28%である
      - D. 欠測の圃場があれば、別に書き出して現地で見る必要がある
    say: 宿題です。ある営農指導員が、8月下旬の衛星画像から、管内の水稲の成熟期マップを受け取りました。マップでは、A集落の圃場はおおむね早く、B集落の圃場のうち5筆が、周りより目立って遅いと表示されています。管内では、まだ今年の穂水分の実測をしていません。この結果から、言えないことはどれでしょうか。A、B集落の5筆は、周りの圃場より成熟が遅れている可能性がある。B、A集落から先に実測の圃場を選び、仮の収穫順を組むとよい。C、B集落の5筆の籾水分は、今日の時点で28パーセントである。D、欠測の圃場があれば、別に書き出して現地で見る必要がある。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに3問あります。

  - kind: cta
    heading: 試す計画を書いたら、章のページへ
    action: 5つの限界の出典と、ケース問題4問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-harvest-order.html
    credits:
      - "出典：農研機構 東北農業研究センター・青森県産業技術センター「衛星画像によるブランド米の生産支援」（実証は2017〜2019年）"
      - "出典：青森県産業技術センター「あおもり米収穫支援システムの使い方」（令和6年度）、同「青天ナビ」ポスター、同 研究成果概要"
      - "出典：農林水産省 スマート農業技術の導入事例（北海道新篠津村、令和2年導入）、岡山県 備前広域農業普及指導センター 委託試験成績（令和3年度）"
      - "出典：福井県農業試験場ほか「宇宙からモニタリングする Part3」（撮影は2022年）、北海道立中央農業試験場「小麦の穂水分測定による成熟期予測」"
