# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第9章「衛星データの焼け跡の指数：Sentinel-2とLandsatの近赤外と短波長赤外で火災の前後の差を出し、焼けた範囲を段階に分けて災害データにする」（learn/codex/codex-2-9-burn-index.qmd）
# 2026-11-27 修正版（ナレーションを話し言葉に。用語を NBR・dNBR に統一。計算例を置いた）
title: 衛星データのNBRとdNBR：Sentinel-2で焼損面積を出す、誤り3つ
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 13
total: 30
thumb: 前から後を引く
summary: 衛星データ（Sentinel-2、Landsat）の近赤外と短波長赤外から焼け跡を見る指数NBRを火災の前後で計算し、その差dNBRを段階に分けて、林野火災の焼損面積を災害データにする章。短波長赤外が2つあって波長の長いほう（B12、Band 7）を使うこと、差は前から後を引くこと、段階の区切り（0.1、0.27、0.44、0.66）はUSGSの手引きの目安で出どころを書くこと、刈り取った畑・水面・煙を除くこと、公的な記録は速報から確定へ変わることを、AIが返した擬似コードと段階の地図を一緒に点検して見つけます。手元で数分でできる確かめ方と、宿題つき。
scenes:
  - kind: cover
    heading: NBR：前後の差を段階に分ける
    sub: 近赤外B8Aと短波長赤外B12。前から後を引き、区切りの出どころを書く
    say: 先月の林野火災で焼けた範囲は、何ヘクタールか。衛星の画像から、そんな数字を出せるでしょうか。答えは、出せます。やることは3つです。火災の前と後の2枚の画像で、NBRという、焼け跡を見るための指数を計算する。前から後を引いて、差の大きさで段階に分ける。そして、面積を数えて、公的な記録と照らす。ただし、ここがポイントです。短波長赤外の帯域をどちらにするか。引き算の向きはどちらか。段階の区切りはどこから来た数字か。この3つを人が決めないと、それらしい数字だけが出てきます。この動画では、まずNBRのしくみを見て、そのあとAIが返したコードと段階の地図を一緒に点検して、3つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - Sentinel-2の近赤外B8Aと短波長赤外B12からNBRを火災の前後で計算し、差dNBRで焼けた範囲と程度の面積の表を作れる
      - 焼けるとNBRが下がる理由（近赤外が下がり短波長赤外が上がる）と、dNBRの区切り0.1〜0.66の出どころを言える
      - 焼けた山が「焼けていない」、畑が「重度」のdNBRの地図を見て、B11の取り違え、引き算の向き、刈り取りや水面を疑える
    say: この動画を見終わると、3つのことができるようになります。1つ目、焼けた範囲の表を作れる。Sentinel-2の近赤外B8Aと短波長赤外B12からNBRを火災の前と後で計算して、その差、dNBRで段階に分けて、何ヘクタールかを出す。鎮火して雲と煙が晴れたあとに、復旧計画の第一報として出す、という使い方です。2つ目、理由と出どころを言える。焼けると、なぜNBRが下がるのか。そして、段階の区切りの0.1、0.27、0.44、0.66は、どこから来た数字なのか。この2つを覚えて帰ってください。3つ目、おかしな地図に気づける。焼けたはずの山が、焼けていない、になっている。火災と関係ない畑が、重度、になっている。こんな地図が出てきたら、どこかが違いますよね。そのときに、帯域の取り違えか、引き算の向きか、刈り取りや水面の混ざりか、と当たりを付けられるようになります。

  - kind: figure
    heading: しくみ：前から後を引く
    image: figures/codex-2-9-burn-index/dnbr.svg
    say: まず、しくみから。衛星の画像は小さなマス目の集まりで、このマス目を画素と呼びます。画素ごとに、地面が光をどれだけ跳ね返したか、つまり反射率が分かります。ここで、葉っぱの性質を1つ。葉のある植物は、近赤外の光を強く跳ね返します。そして水分を含んでいるので、短波長赤外の光は吸収します。では、焼けるとどうなるでしょうか。葉が失われて、乾いた灰と土が出てきます。すると、近赤外の反射は下がり、短波長赤外の反射は上がります。だから、近赤外の反射率から短波長赤外の反射率を引いて、2つの和で割ります。植物が元気なら正の大きな値になり、焼けると下がります。これが正規化燃焼指数、NBRです。実際に計算してみましょう。火災前の森で、近赤外が0.4、短波長赤外が0.1だとします。差は0.3、和は0.5。0.3割る0.5で、0.6です。焼けたあとは、たとえば近赤外が0.15、短波長赤外が0.3だとしましょう。差はマイナス0.15、和は0.45で、およそマイナス0.33。はっきり下がりましたよね。図の1番目と2番目が、ここまでです。ところが、1枚の画像のNBRだけでは足りません。もともと植物が少ない岩場も、低い値になるからです。たとえば岩場で、近赤外が0.25、短波長赤外が0.2なら、差は0.05、和は0.45で、およそ0.11。焼けた森も低い値になるので、1枚では、岩場と焼けた森を分けられません。そこで、火災の前と後の2枚でNBRを計算して、前から後を引きます。これが図の3番目で、この差をdNBRと呼びます。さっきの森なら、0.6引くマイナス0.33で、およそ0.93。焼けた場所は、前が高くて後が低いので、正の大きな値になります。岩場は、前も後も0.11ですから、差は0。焼けていない場所は、こうして0の近くに集まります。逆に、火災のあとに草が生えた場所は、後のほうが高くなるので、差は負の値です。4番目と5番目は、人の仕事です。段階に分けるときは、区切りの出どころを書きます。記録と照らすときは、発表の日付と、速報か確定かを添えます。ここは、このあと詳しく見ます。

  - kind: table
    heading: 帯域と、区切りの出どころ
    columns: [項目, Sentinel-2 Level-2A, Landsat 8・9]
    widths: [0.15, 0.50, 0.35]
    rows:
      - [近赤外, B8A（865nm・20m）。B8は幅が広く10mで別, Band 5（0.85〜0.88µm・30m）]
      - [短波長赤外, B12（2190nm・20m）。B11は短波長赤外1で別, Band 7（2.11〜2.29µm・30m）]
      - [差の向き, 前のNBR − 後のNBR。焼けた場所が正の大きな値, 同じ]
      - [区切り（1）, −0.1〜0.1 焼けていない／0.1〜0.27 軽度／0.27〜0.44 中程度の低, USGSの手引きの目安。場所と火災で変わる]
      - [区切り（2）, 0.44〜0.66 中程度の高／0.66超 重度／−0.1未満 植物の増加, 出どころを書く。できれば現地で確かめる]
    say: 次に、使う波長の帯域、バンドの番号と、段階の区切りの出どころです。表の上の2行は公式の帯域の表の値、差の向きと区切りは、USGSの手引きをもとに国連の手引きなどが示す値です。Sentinel-2の、大気の影響を直した地表の反射率の製品、Level-2Aでは、近赤外がB8A、およそ865ナノメートルで、画素は20メートル。短波長赤外がB12、およそ2190ナノメートルで、こちらも20メートルです。近赤外にはB8もあります。でもB8は、帯域の幅が広くて、画素が10メートル。B12と画素の大きさが違うので、この章ではB8Aを使います。ここで、気づいてほしいことが1つあります。短波長赤外は、2つあるんです。B11は、およそ1610ナノメートルで、短波長赤外1と呼ばれます。NBRで使うのは、波長の長いほうの短波長赤外2、つまりB12です。では、B11とB12の組は何に使うのでしょうか。これはNBR2という別の指数で、火災のあとの回復を見る目的で使われます。Landsat 8と9なら、近赤外がBand 5、短波長赤外2がBand 7で、どちらも30メートル。Band 6のほうが短波長赤外1です。衛星が変わると番号も変わるので、毎回、公式の表で確かめてください。3行目、差の向き。前のNBRから、後のNBRを引きます。焼けた場所が、正の大きな値になる向きですね。4行目と5行目が、段階の区切りです。これが今日の大事なところの1つです。区切りの値は、指数に付いてくるものではありません。米国地質調査所、USGSの山火事の調査の手引きをもとにした区切りが広く使われていて、dNBRがマイナス0.1から0.1なら焼けていない、0.1から0.27が軽度、0.27から0.44が中程度の低、0.44から0.66が中程度の高、0.66より大きければ重度です。さっき計算した森のdNBRは0.93でしたから、0.66より大きくて、重度に入ります。岩場の0は、マイナス0.1から0.1の間なので、焼けていない、ですね。それから、マイナス0.1より小さい値は、火災のあとに植物が増えた場所です。ただし、この区切りはあくまで最初の目安です。差の値は場所と火災ごとに変わるので、できれば現地の調査で確かめるべきだと、国連の手引きは述べています。だから、区切りの値には必ず出どころを書きます。出どころのない数字は、AIが補った数字だと思ってください。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [NBRで焼け跡を出して, 近赤外B8Aと短波長赤外B12（波長の長いほう）のNBRで。短波長赤外1のB11ではない]
      - [前後の差を取って, 前のNBRから後のNBRを引いて。焼けた場所が正の大きな値になる向き]
      - [焼け方を段階に分けて, 区切りは0.1、0.27、0.44、0.66（USGSの手引きの目安）。出どころと、見直したなら理由を表に書いて]
    say: では、AIにどう頼むか。左があいまいな頼み方、右が直した頼み方です。NBRで焼け跡を出して。これのどこが危ないのでしょうか。NBRという名前だけで頼むと、AIは短波長赤外が2つあることを気にせず、どちらかを自信をもって選びます。選んだのがB11でも、AIはそれをNBRと呼び続けます。だから、帯域の番号で指示します。近赤外B8Aと短波長赤外B12、波長の長いほう。B11ではない、とまで書きます。2行目。前後の差を取って、だけだと、どちらから引くかはAIまかせですよね。前のNBRから後のNBRを引いて、焼けた場所が正の大きな値になる向きで、と頼みます。3行目。焼け方を段階に分けて、だけだと、区切りの値をAIが決めてしまいます。0.1、0.27、0.44、0.66という値と、USGSの手引きの目安だという出どころを書いて、見直したなら理由も表に書いて、と頼みます。それから、確かめ方も先に頼んでおきましょう。2つあります。1つ目、貯水池の中央、水田の中央、焼けていない山林。この3か所の画素について、前と後のNBRと差を表示してもらう。2つ目、合計の面積が、林野庁の発表と同じ桁であることを示してもらう。このとき、発表の日付と、速報か確定かを添えます。指示文の全文は、章のページにあります。そこには、画素ごとの分類、SCLが3、6、8、9、10の画素を除くことと、面積は、単位がメートルの座標、UTMのまま、20メートル画素を400平方メートルとして数えることも書いてあります。

  - kind: code
    heading: 一緒に：擬似コードを読む
    code: |
      # 焼け跡の段階（誤りあり・説明用の擬似コード）
      n0, s0 = read_bands(pre,  ["B8", "B11"])    # 火災前：近赤外, 短波長赤外1
      n1, s1 = read_bands(post, ["B8", "B11"])    # 火災後
      s0, s1 = resample_to(s0, n0), resample_to(s1, n1)
      nbr0 = (n0 - s0) / (n0 + s0)
      nbr1 = (n1 - s1) / (n1 + s1)
      dnbr = nbr1 - nbr0                           # 後 − 前
      severe = dnbr > 0.66                         # 「USGSの表」
      area_ha = count(severe) * 100 / 10000        # 雲・煙・水を除かず数える
    highlight: [2, 3, 7, 9]
    say: ここからは、一緒に点検していきましょう。AIはこう説明してきました。NBRは近赤外B8と短波長赤外B11から計算します。変化を見るので、火災後から火災前を引きました。段階は標準的なUSGSの表で分け、0.66より大きい値を重度としました。自信のある口調ですよね。画面に出ているのは、説明用に短くした擬似コードです。見るところは5つです。短波長赤外が、波長の長いほうになっているか。引き算の向きが、前から後になっているか。区切りの出どころが書いてあるか。雲と煙と水の画素を除いているか。そして、1画素の面積が、画素の大きさと合っているか。上から読んでいきます。2行目と3行目、前と後の画像から、B8とB11を読んでいます。ここ、引っかかりませんか。4行目は、20メートルのB11を10メートルのB8に、画素の大きさをそろえています。5行目と6行目は、近赤外から短波長赤外を引いて、和で割る。式の形は、NBRと合っています。7行目、後のNBRから前のNBRを引いていますね。8行目、差が0.66より大きい画素を重度にしています。9行目、重度の画素を数えて、100をかけて、1万で割って、ヘクタールにしています。さて、このコード、動かしても止まりません。地図も表もちゃんと出ます。だからこそ、確かめる手順を先に決めておくんです。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.09, 0.13, 0.30, 0.48]
    rows:
      - ["2・3", 帯域, "[\"B8\", \"B11\"]。「近赤外B8と短波長赤外B11」", "B11は短波長赤外1。使うのは波長の長いB12。正しくは [\"B8A\", \"B12\"]。同じ20mなので4行目のそろえる処理は不要。1画素は400m²に"]
      - ["7", 引き算の向き, "nbr1 - nbr0。「火災後から火災前を引いた」", "後から前なので、焼けた場所が負の値になり、区切りの表が使えない。正しくは nbr0 - nbr1"]
      - ["8", 区切り, "dnbr > 0.66。「USGSの標準的な表」", "値は手引きの目安と合う。出どころと、場所ごとに見直すべきことをコードか記録に書く"]
      - ["9", 雲と水・面積, "count(severe) × 100。雲・煙・水を除かない", "後の煙と雲はNBRを下げ、焼け跡に見える。水面は値が不安定。前後のSCLで3、6、8、9、10を除き、除いた割合を表に書く"]
    say: 判定の結果がこの表です。4つの行を順に見ます。誤りは3つで、8行目は、値は合っていて書き足りない行です。まず2行目と3行目。B11は短波長赤外1でしたね。NBRで使うのは、波長の長いB12です。出典では、焼けると2マイクロメートル帯域、つまりB12のほうの短波長赤外が上がると述べられています。1.6マイクロメートル帯域のB11では変化が小さく、差も小さく出ると考えられます。しかも、AIはNBRと呼び続けるので、名前からは気づけません。正しくは、B8AとB12です。そうすると、どちらも20メートルなので、4行目の、画素の大きさをそろえる処理は要らなくなります。ただし、ここで1つ連動することがあります。画素が10メートルから20メートルになるので、9行目の1画素の面積は、100平方メートルではなく400平方メートルです。係数を変え忘れると、どうなるでしょうか。面積が4分の1に出ます。帯域を変えたら、面積の係数も変える。セットで覚えてください。次に7行目、引き算の向きです。後から前を引いているので、焼けた場所が負の値になります。さっきの森で言えば、0.93ではなく、マイナス0.93です。だから焼けた場所は、焼けていない、に入ってしまいます。では、8行目の、0.66より大きい、で拾われるのは何でしょうか。焼けていない場所は、向きが逆でも0の近くのままです。拾われるのは、火災のあとに植物が増えた場所だけです。正しくは、前のNBRから後のNBRを引く向きに直します。地図を見れば、焼けたはずの山が重度に入らず、関係ない場所が重度になるので気づけます。ところが、面積の表だけ見ると、それらしい数字が並ぶので隠れます。8行目の0.66という値そのものは、手引きの目安と合っています。足りないのは、出どころと、場所ごとに見直すべきだという記録です。最後に9行目。雲と煙と水の画素を、除かずに数えています。後の画像に残った煙や雲は、NBRを下げますよね。すると差が正になって、焼け跡として数えられます。水面は、近赤外も短波長赤外も暗いので値が安定せず、水位の変化で差が正にも負にも動くことがあると考えられます。正しくは、前と後の両方の分類SCLで、3、6、8、9、10のどれかに当たる画素を、差を計算する前に外します。片方の分類だけでは足りません。除いた画素の割合も、表に出します。さて、この3つのうち、AIが自信をもって間違えたのは、1つ目です。NBRは近赤外と短波長赤外、という説明は正しい。だから、2つある短波長赤外のどちらかを問わずに、ありそうな組を書いてしまう。防ぐには、帯域の番号を指示文に書いて、コードの番号と公式の表を見比べるしかありません。判定が出たら、AIに何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：地図と表を見る
    items:
      - 焼けたはずの山が、重度か中程度に入っているか。入っていなければ、引き算の向きが逆か、帯域が違う
      - 水田や畑が、焼け跡になっていないか。刈り取りは火災と同じ向きの変化。収穫の前後なら畑が並ぶ
      - 貯水池や川が、焼け跡になっていないか。水は値が安定しない。分類の6で除く
      - 雲と煙の縁が、焼け跡になっていないか。風下に段階の色が帯状に伸びていれば煙
      - 焼けた範囲の縁が、報道の地図や消防の発表と合うか。区画の境界で直線に切れていれば前後で区画が違う
      - 合計の面積が、公的な記録と同じ桁か。どの記録と、どの日付で照らしたかを表に書く
    say: ここからは、手元でやってみましょう。用意するのは、できた段階の地図と、面積の表。この2つがあれば、数分でできます。1つ目、焼けたはずの山を地図で見に行きます。重度か中程度になっていますか。なっていなければ、引き算の向きが逆か、帯域が違います。2つ目、水田や畑です。火災と関係ないのに、焼け跡になっていませんか。刈り取りの前後では、葉が減って近赤外が下がり、土が出て短波長赤外が上がると考えられます。これ、火災と同じ向きの変化ですよね。すると、差が火災と同じ向きに出ます。前の画像が収穫前で、後が収穫後なら、畑が軽度から中程度で並びます。3つ目、貯水池や川。水は、近赤外も短波長赤外も吸収して暗いので、NBRの分母が小さく、値が安定しません。水位の変化や波で、差が正になることがあります。水の画素は、分類の6で除きます。4つ目、雲と煙の縁。後の画像の煙は、NBRを下げます。焼けた範囲の風下に、段階の色が帯状に伸びていたら、それは煙です。5つ目、焼けた範囲の縁の形です。報道の地図や消防の発表と合っていますか。縁が道路や尾根で止まっていれば、現実に近い形です。もし縁が、画像の区画の境界で直線に切れていたら、前と後で区画が違います。6つ目、合計の面積の桁。公的な記録と同じ桁ですか。たとえば大船渡市の火災なら、林野庁の3月7日の被害報告が2900ヘクタール、消防白書が約3370ヘクタールの速報値です。衛星の合計が300ヘクタールや3万ヘクタールなら、桁が違いますよね。どの記録と、どの日付で照らしたかを、表に書きます。この6つを、報告の前に必ずやってください。

  - kind: figure
    heading: 取り違えと、2つの例
    image: figures/codex-2-9-burn-index/confusions.svg
    say: この図は、取り違えが起きる場所をまとめたものです。左は、焼けていないのにdNBRが正に出るものです。たとえば刈り取った畑は、葉が減って土が出るので、火災と同じ向きに変わります。水面は、水位や波で値が動きます。後の画像の煙や雲の縁は、NBRを下げます。伐採や造成で土が出た場所も、畑と同じ向きです。右は、焼けていても差が見えない条件です。雲と煙の下は写りません。前後で季節や、衛星や処理の段階が違うと、火災以外の差が混ざります。火災から時間がたって草が生えると、差は小さくなります。どちらも、前後の撮影日と、除いた画素の割合と、公的な記録との照合で確かめます。では、おかしな結果の例を2つ。例1、市の南側の水田が、一面、中程度の低になった。火災は山林で、水田は焼けていません。調べると、前の画像が9月の収穫前で、後の画像が10月の収穫後でした。刈り取りで葉が減って土が出たので、差が火災と同じ向きに出たと考えられます。原因は、火災の前後だけでなく、季節の変化も差に入ることです。前の画像をできるだけ火災の直前にして、水田の区画は別に数えるか、段階の地図を山林の範囲に絞ります。例2、重度の面積が、林野庁の発表の10分の1しかない。地図を見ると、焼けた範囲の中央だけが重度で、周りは、焼けていない、になっている。コードを見ると、短波長赤外にB11を使っていました。短波長赤外1では焼けた場所の変化が小さくて、差が区切りに届かないと考えられます。原因は、帯域の取り違えです。B12に直して、面積の係数も20メートルに合わせて直します。では、段階の地図と面積の表で、何が言えて、何が言えないのでしょうか。言えるのは、この条件で出した面積、です。条件というのは、帯域、引き算の向き、区切りとその出どころ、前後の撮影日、除いた画素の割合の5つです。これを表に書いておけば、別の火災と比べられます。言えないのは、木が枯れたかどうかと、焼けた原因です。dNBRは焼け方の目安で、木が生き残るかどうかは、次の生育期にならないと分かりません。雲と煙の下も分かりません。それから、公的な記録の面積と衛星の面積が違っても、どちらが正しいとは言えません。記録は速報から確定へ変わりますし、衛星は雲と季節の影響を受けるからです。違いの理由を書くのが、報告の役目です。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 火災の直後で、煙と雲が残っているとき。光学の画像は煙と雲の下が写らない。後の画像を待つか、レーダーを検討する
      - 小さな火災。2020〜2024年の平均は年約1,167件・約752ha。20m画素では1haが25画素。1ha未満の焼け跡は十数画素
      - 草地や畑の火災。草はすぐ生え、刈り取りと区別がつかない。区切りは森を前提にした目安
      - 火災から時間がたったとき。草が生えると差が小さくなる。鎮火直後と次の生育期の評価は別のもの
      - 有償の商用データ。短波長赤外2の帯域がない衛星もある。帯域の表を契約の仕様書で確かめる
    say: 向かない条件も、押さえておきましょう。1つ目、火災の直後で、煙と雲がまだ残っているとき。光学の画像は、煙と雲の下が写りません。後の画像を待つか、レーダーの画像を検討します。2つ目、小さな火災。日本の林野火災の多くは小さくて、2020年から2024年の5年の平均は、年に約1167件、焼損面積は約752ヘクタールです。2024年だけなら831件で、1073ヘクタール。単純に割ると、1件あたり1ヘクタールに届きません。1ヘクタールは1万平方メートルですから、20メートルの画素で25個分。それより小さい焼け跡は、十数画素にしかなりませんよね。2025年2月の岩手県大船渡市の火災は、速報値で約3370ヘクタールでしたが、これは例外的な大きさです。無償の画像で範囲が読めるのは、こうした大きな火災に限られます。3つ目、草地や畑の火災。草は焼けてもすぐ生えますし、刈り取りと区別がつきません。段階の区切りも、森を前提にした目安です。4つ目、火災から時間がたったとき。草が生えると差が小さくなって、植物が増えた場所は負の値になります。鎮火の直後の評価と、次の生育期の評価は、別のものとして扱います。5つ目、有償の商用データを使うとき。考え方は同じですが、短波長赤外2の帯域がない衛星もあります。無ければ、NBRは計算できません。契約の仕様書で帯域の表を確かめて、無い帯域の指数は使えないと、先に決めておきます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 火災の前と後の画像を選ぶ。火災の直前と鎮火の直後、雲と煙のない日。同じ衛星、同じ処理の段階（人）
      - 帯域を読み、反射率に直し、NBRを2枚作らせる。B8AとB12。ずらしと倍率の記録（AI）
      - 前から後を引き、段階に分けさせる。区切りの値と出どころ。SCLの3、6、8、9、10を除き、除いた割合も（AI）
      - 面積に直させる。UTMのまま20m画素を400m²。段階ごとの面積、合計、座標の名前（AI）
      - 公的な記録と、地図で確かめる。同じ桁か、焼けていない場所が入っていないか、縁が合うか（人）
    say: 手順をまとめます。1は、人が決めるところです。火災の前と後の画像を選びます。前は火災の直前、後は鎮火の直後で、どちらも対象の範囲に雲と煙がない日。そして前と後は、同じ衛星、同じ処理の段階にそろえます。前が大気の影響を直す前のLevel-1Cで、後が直したあとのLevel-2Aだと、その分だけ差が出てしまうからです。2から4は、AIにやらせるところ。まず、B8AとB12を読んで、付属情報の、ずらしのBOA_ADD_OFFSETと、倍率のQUANTIFICATION_VALUEで反射率に直し、前と後のNBRを2枚作らせる。使った帯域と、直した記録も残させます。次に、前から後を引いて、区切りの値と出どころを渡して、段階に分けさせる。このとき、前後の分類SCLで3、6、8、9、10を除いて、除いた割合も出させます。そして、面積に直させる。Level-2Aは、単位がメートルのUTMという座標なので、20メートルの画素は400平方メートルとして数えます。段階ごとの面積と、合計と、座標の名前を表にします。5は、また人の仕事です。合計が公的な記録と同じ桁か。焼けていない場所が段階に入っていないか。焼けた範囲の縁が、報道の地図と合うか。ここを飛ばして報告していませんか。この5つを、火災のたびに繰り返してください。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      n0, s0 = read_bands(pre,  ["B8A", "B12"])   # 火災前
      n1, s1 = read_bands(post, ["B8A", "B12"])   # 火災後
      nbr0 = (n0 - s0) / (n0 + s0)
      nbr1 = (n1 - s1) / (n1 + s1)
      dnbr = nbr1 - nbr0
      severe   = dnbr > 0.66
      moderate = (dnbr > 0.27) & (dnbr <= 0.66)

      AIの説明：「重度の焼け跡は420ヘクタール、中程度は310ヘクタールです。
      　NBRは近赤外B8Aと短波長赤外B12から計算し、変化を見るために
      　火災後の指数から火災前の指数を引きました。段階はUSGSの標準的な表です」
      → 消防の発表で焼けたとされる尾根が「焼けていない」になり、
      　冬に伐採され春に下草が伸びた南側の谷（火災と無関係）が「重度」に
      問い：この結果から最初に疑うべきことはどれか
      A. 区切りの0.66が高すぎて、尾根の焼け跡が重度の段階にまで届かなかった
      B. 引き算の向きが後から前なので、焼けた尾根が負の値、草の伸びた谷が正の値になった
      C. B8Aは20mで粗いので、尾根の細い焼け跡が1つの画素の中に収まらなかった
      D. 火災後の画像に煙が残っていて、尾根のNBRが火災前より下がりきらなかった
    say: 宿題です。章のケース問題の問1を出します。場面は架空で、数字は丸めてあります。ある県の担当者が、AIに、Sentinel-2のLevel-2Aで、3月の林野火災で焼けた範囲を段階に分けて、面積をヘクタールで出して、と頼みました。画面に出ているのが、AIが返した説明と、説明用に短くした擬似コードです。重度の焼け跡は420ヘクタール、中程度は310ヘクタール。NBRは近赤外B8Aと短波長赤外B12から計算し、変化を見るために、火災後の指数から火災前の指数を引いた。段階は、USGSの標準的な表で分けた。ところが、できた地図を見ると、消防の発表で焼けたとされる尾根の一帯が、焼けていない、になっています。代わりに、火災と関係のない南側の谷の一部が、重度、になっていました。この谷は、火災の前の冬に伐採されて、春に下草が伸びた場所です。この結果から、最初に疑うべきことはどれでしょうか。A、区切りの0.66が高すぎて、尾根の焼け跡が重度の段階にまで届かなかった。B、引き算の向きが後から前なので、焼けた尾根が負の値、草の伸びた谷が正の値になった。C、B8Aは20メートルで粗いので、尾根の細い焼け跡が1つの画素の中に収まらなかった。D、火災後の画像に煙が残っていて、尾根のNBRが火災前より下がりきらなかった。この動画で見た、判定の表の観点を思い出して、考えてみてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。問2の短答もそこにあります。向きを直したあと、衛星の合計が約2600ヘクタールで、県の報告の約2900ヘクタール、消防白書の約3400ヘクタールと違った、という場面です。

  - kind: cta
    heading: 宿題を解いたら、章のページへ
    action: 出典、指示文の例、ケース問題2問は章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/codex/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/codex/codex-2-9-burn-index.html
    credits:
      - "出典：USGS「Landsat NBR」「NBR 2」（式、Landsatの帯域、NBR2は回復の研究に）／Humboldt State Univ. GSP 216（USGS FireMonの区切り 0.1／0.27／0.44／0.66、−0.1）"
      - "出典：Key & Benson（2006）FIREMON（dNBR＝前−後、次の生育期の評価は別）／UN-SPIDER「NBR」「burn-severity」（B8AとB12、区切りは目安）"
      - "出典：USGS EROS「Sentinel-2」／USGS「Landsat band designations」（B8 842nm 10m、B8A 865nm 20m、B11 1610nm、B12 2190nm、Band 5・6・7）"
      - "出典：ESA「L2A ATBD」V2.10.0（SCLの番号）／「S2 Products」SentiWiki（UTM/WGS84、BOA_ADD_OFFSET）／消防庁「令和7年版 消防白書」（大船渡市 約3,370ha 速報値）"
      - "出典：林野庁「林野火災の発生状況」（2024年 831件・1,073ha、2020〜24年平均 約1,167件・約752ha）／林野庁 大船渡市 被害状況 第6報（3月7日 2,900ha）"
      - "作例：NBR 森 0.4・0.1→0.3÷0.5=0.6、焼けた後 0.15・0.3→−0.15÷0.45=−0.33、dNBR=0.6−(−0.33)=0.93（0.66超で重度）。岩場 0.25・0.2→0.11、dNBR=0"
      - "作例：係数100のまま20m画素→100÷400=1/4。1ha=10,000m²÷400m²=25画素。752ha÷1,167件≈0.64ha。300ha／3万ha、例1・2、ケース問題は架空"
    say: この章のページには、公式資料の出典、目的・場所・期間など7つの項目を埋めた指示文の例、誤りを仕込んだ擬似コードの解説、そしてケース問題2問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
