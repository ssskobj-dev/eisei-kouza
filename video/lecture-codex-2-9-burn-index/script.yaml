    say: この章のページには、公式資料の出典、7項目を埋めた指示文の例、誤りを仕込んだ抜粋の解説、そしてケース問題2問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
