# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第9章「衛星データの焼け跡の指数：Sentinel-2とLandsatの近赤外と短波長赤外で火災の前後の差を出し、焼けた範囲を段階に分けて災害データにする」（learn/codex/codex-2-9-burn-index.qmd）
title: 衛星データの焼け跡の指数：Sentinel-2で焼損面積を出す、誤り3つ
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 13
total: 30
thumb: 前から後を引く
summary: 衛星データ（Sentinel-2、Landsat）の近赤外と短波長赤外から焼け跡の指数（NBR）を計算し、火災の前後の差（dNBR）を段階に分けて、林野火災の焼損面積を災害データにする章。短波長赤外が2つあって波長の長いほう（B12、Band 7）を使うこと、差は前から後を引くこと、段階の区切り（0.1、0.27、0.44、0.66）は手引きの目安で出どころを書くこと、刈り取った畑・水面・煙を除くこと、公的な記録は速報から確定へ変わることを、AIが返したコードと段階の地図を一緒にレビューして見つけます。手元で数分でできる確かめ方と、宿題つき。
scenes:
  - kind: cover
    heading: 焼け跡の指数：前後の差を段階に分ける
    sub: 近赤外B8Aと短波長赤外B12。前から後を引き、区切りの出どころを書く
    say: 先月の林野火災で焼けた範囲は、何ヘクタールか。衛星画像から出すことはできるでしょうか。答えは、火災の前と後の2枚で焼け跡の指数を計算し、前から後を引き、差の大きさで段階に分け、面積を数えて、公的な記録と照らせば、できる、です。2024年の日本の林野火災は831件、焼損面積は1073ヘクタール。2025年2月の岩手県大船渡市の火災は、速報値で約3370ヘクタールでした。この大きさなら、無償の衛星画像でも範囲が読めます。ただし、短波長赤外の帯域をどちらにするか、引き算の向き、段階の区切りの出どころ、の3つを人が決めないと、それらしい数字だけが出ます。この動画では、しくみを見たあと、AIが返したコードと段階の地図を一緒にレビューして、3つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - Sentinel-2の近赤外B8Aと短波長赤外B12から焼け跡の指数（NBR）を火災の前後で計算し、差（dNBR）で焼けた範囲と程度の表を作れる
      - 焼け跡の指数が「近赤外と短波長赤外」の組で、焼けると近赤外が下がり短波長赤外が上がるので値が下がる、という理由が分かる
      - 「焼けた山が重度に入らない」「畑が重度」なら、帯域の取り違え（B11）、引き算の向き、刈り取りや水面の混ざり、と気づける
    say: この章を終えると、3つのことができるようになります。1つ目、Sentinel-2の近赤外B8Aと短波長赤外B12から、焼け跡の指数、NBRを火災の前後で計算し、その差、dNBRで、焼けた範囲と程度の表を作れること。たとえば、山火事の翌週に、焼けた面積が何ヘクタールで、重度の範囲がどこかを、復旧の計画の第一報として出す、という使い方です。2つ目、焼け跡の指数が近赤外と短波長赤外の組で、焼けると近赤外が下がり、短波長赤外が上がるので、値が下がる、という理由が分かること。3つ目、AIが返した地図と表で、焼けたはずの山が重度に入っていなかったり、火災と関係ない畑が重度になっていたりしたら、帯域の取り違えか、引き算の向きか、刈り取りや水面の混ざりだと気づけることです。

  - kind: figure
    heading: しくみ：前から後を引く
    image: figures/codex-2-9-burn-index/dnbr.svg
    say: まず、しくみです。葉のある植物は、近赤外を強く反射し、水分を含むので短波長赤外を吸収します。焼けると葉が失われ、乾いた灰と土が露出します。すると、近赤外の反射が下がり、短波長赤外の反射が上がります。そこで、近赤外から短波長赤外を引き、2つの和で割った値を、正規化燃焼指数、NBRと呼びます。この章では、焼け跡の指数と呼びます。植物が元気なら正の大きな値、焼けると値が下がります。たとえば、火災前の森で近赤外の反射率が0.4、短波長赤外が0.1なら、0.3割る0.5で0.6です。焼けたあとは近赤外が0.15、短波長赤外が0.3のようになり、マイナス0.15割る0.45で、およそマイナス0.33です。前から後を引くと、0.6引くマイナス0.33で、差はおよそ0.93。手引きの区切りで、0.66より大きい重度に入ります。図の1番目と2番目です。ただし、1枚の画像の指数だけでは、もともと植物が少ない岩場と、焼けた森を分けられません。そこで、火災の前と後の2枚で指数を計算し、前から後を引きます。これが図の3番目で、この差をdNBRと呼びます。焼けた場所は、前の値が高く、後の値が低いので、差は正の大きな値になります。焼けていない場所は、差が0の近くに集まります。火災の後に植物が増えた場所は、負の値になります。4番目、段階に分けるときは、区切りの出どころを書きます。5番目、公的な記録と照らすときは、発表の日付と、速報か確定かを添えます。4番目と5番目は、人の仕事です。

  - kind: table
    heading: 帯域と、区切りの出どころ
    columns: [項目, Sentinel-2 Level-2A, Landsat 8・9]
    widths: [0.18, 0.44, 0.38]
    rows:
      - [近赤外, B8A（865nm・20m）。B8は帯域が広く10mで違う, Band 5（0.85〜0.88µm・30m）]
      - [短波長赤外, B12（2190nm・20m）。B11は短波長赤外1で別の帯域, Band 7（2.11〜2.29µm・30m）]
      - [差の向き, 前の指数 − 後の指数。焼けた場所が正の大きな値, 同じ]
      - [区切り（1）, 0.1未満は焼けていない。0.1〜0.27は軽度、0.27〜0.44は中程度の低, USGSの手引きの目安。場所と火災で変わる]
      - [区切り（2）, 0.44〜0.66は中程度の高、0.66超は重度。−0.1未満は植物の増加, 出どころを書く。できれば現地で確かめる]
    say: 次に、使う帯域と、段階の区切りの出どころです。表は、公式の資料から写した値です。Sentinel-2なら、近赤外はB8Aで、およそ865ナノメートル、20メートル。短波長赤外はB12で、およそ2190ナノメートル、20メートルです。B8も近赤外ですが、帯域の幅が広く、画素が10メートルで、B12と大きさが違います。ここで、気づくべきことが1つあります。短波長赤外には、2つの帯域があります。B11は、およそ1610ナノメートルの短波長赤外1で、焼け跡の指数の帯域ではありません。焼け跡の指数で使うのは、波長の長いほうの、B12です。短波長赤外1と短波長赤外2の組は、別の指数で、火災の後の回復を見る目的で使われます。Landsat 8と9では、Band 5とBand 7で、どちらも30メートル。Band 6は短波長赤外1です。Landsat 4から7では、Band 4とBand 7です。3行目、差の向きです。前の指数から、後の指数を引きます。焼けた場所が、正の大きな値になる向きです。4行目が、段階の区切りです。区切りの値は、指数に付いてくるものではありません。米国地質調査所、USGSの山火事の調査の手引きをもとに、0.1未満を焼けていない、0.1から0.27を軽度、0.27から0.44を中程度の低、0.44から0.66を中程度の高、0.66より大きい値を重度とし、マイナス0.1より小さい値を植物の増加とする区切りが、広く使われています。ただし、この区切りは最初の目安で、差の値は場所と火災ごとに変わり、できれば現地の調査で確かめるべきだと、国連の手引きは述べています。区切りの値には、必ず出どころを書きます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.28, 0.68]
    rows:
      - [NBRで焼け跡を出して, 近赤外B8Aと短波長赤外B12（波長の長いほう）の焼け跡の指数で。短波長赤外1のB11ではない]
      - [前後の差を取って, 前の指数から後の指数を引いて。焼けた場所が正の大きな値になる向き]
      - [焼け方を段階に分けて, 区切りは0.1、0.27、0.44、0.66（USGSの手引きの目安）。出どころと、見直したなら理由を表に書いて]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。NBRで焼け跡を出して、だけでは危ないのには、理由があります。NBRという名前だけで頼むと、AIは、短波長赤外に2つの帯域があることを気にせず、どちらかを自信をもって選ぶからです。だから、帯域の番号で指示します。近赤外B8Aと短波長赤外B12、波長の長いほう、の焼け跡の指数で。短波長赤外1のB11ではない、と書きます。前後の差を取って、ではなく、前の指数から後の指数を引いて。焼けた場所が正の大きな値になる向き、と頼みます。焼け方を段階に分けて、ではなく、区切りは0.1、0.27、0.44、0.66、USGSの手引きの目安。出どころと、見直したなら理由を表に書いて、と頼みます。指示の7項目のうち、衛星と処理の段階には、Sentinel-2のLevel-2Aで、20メートル用のフォルダのB8AとB12を使うこと。手順には、分類、SCLが3、6、8、9、10の画素を除くこと、面積はUTMの座標のまま、20メートル画素を400平方メートルとして数えること。確かめ方には、貯水池の中央と、水田の中央と、焼けていない山林の画素の、前と後の指数と差を表示すること、合計の面積が、林野庁の発表と同じ桁であることを示すこと、を入れます。発表には、日付と、速報か確定かを添えます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 焼け跡の段階（誤りあり）
      n0, s0 = read_bands(pre,  ["B8", "B11"])    # 火災前：近赤外, 短波長赤外1
      n1, s1 = read_bands(post, ["B8", "B11"])    # 火災後
      s0, s1 = resample_to(s0, n0), resample_to(s1, n1)
      nbr0 = (n0 - s0) / (n0 + s0)
      nbr1 = (n1 - s1) / (n1 + s1)
      dnbr = nbr1 - nbr0                           # 後 − 前
      severe = dnbr > 0.66                         # 「USGSの表」
      area_ha = count(severe) * 100 / 10000        # 雲・煙・水を除かず数える
    highlight: [2, 3, 7, 9]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。焼け跡の指数、NBRは、近赤外B8と短波長赤外B11から計算します。変化を見るので、火災後から火災前を引きました。段階は標準的なUSGSの表で分け、0.66以上を重度としました。自信のある口調です。画面がそのコードです。当てる観点は、この章では5つ。1、波長帯。短波長赤外が、波長の長いほうになっているか。2、比べる条件。引き算の向きが、前から後か。前と後が、同じ衛星と同じ処理の段階か。3、基準の値。区切りの出どころが、コードか記録に書いてあるか。4、雲と影。雲、煙、水の画素を除いているか。5、面積。画素の大きさと、1画素の面積が合っているか。まず、2行目と3行目。B8とB11。近赤外と、短波長赤外1を読んでいます。4行目。20メートルのB11を、10メートルのB8にそろえています。5行目と6行目。n引くs、割る、n足すs。式の形は、焼け跡の指数と合っています。7行目。dnbr、イコール、nbr1引くnbr0。後から前です。8行目。severe、イコール、dnbr、大なり、0.66。9行目。count、severe、掛ける100、割る10000。このコードは、動かしても止まりません。地図も表も出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.09, 0.13, 0.30, 0.48]
    rows:
      - ["2・3", 波長帯, "[\"B8\", \"B11\"]。「近赤外B8と短波長赤外B11」", "B11は短波長赤外1。使うのは波長の長いB12。正しくは [\"B8A\", \"B12\"]。同じ20mなので4行目の再標本化は不要。1画素は400m²に"]
      - ["7", 比べる条件, "nbr1 - nbr0。「火災後から火災前を引いた」", "後から前なので、焼けた場所が負の値になり、区切りの表が使えない。正しくは nbr0 - nbr1"]
      - ["8", 基準の値, "dnbr > 0.66。「USGSの標準的な表」", "値は手引きの目安と合う。出どころと、場所ごとに見直すべきことをコードか記録に書く"]
      - ["9", 雲と影・面積, "count(severe) × 100。雲・煙・水を除かない", "後の煙と雲は指数を下げ、焼け跡に見える。水面は値が不安定。前後のSCLで3、6、8、9、10を除き、除いた割合を表に書く"]
    say: 判定の結果が、この表です。誤りは3つです。1つ目、2行目と3行目。B11は、短波長赤外1です。焼け跡の指数は、波長の長い短波長赤外2、B12を使います。B11とB8の組では、焼けた場所の短波長赤外の上がり方が弱く、差が小さく出ます。しかも、AIはNBRと呼び続けるので、名前からは気づけません。正しくは、B8AとB12です。B8Aを使えば、B12と同じ20メートルなので、4行目の再標本化も要りません。ただし画素が20メートルになるので、9行目の1画素の面積は、400平方メートルに変えます。帯域を変えたら、面積の係数も変えます。2つ目、7行目。後から前を引いているので、焼けた場所が負の値になります。8行目の、0.66より大きい、は、焼けていない場所か、植物が増えた場所を拾います。正しくは、nbr0引くnbr1です。地図を見れば、焼けたはずの山が重度に入らず、逆に火災と関係ない場所が重度になるので、気づけます。しかし、面積の表だけを見ると、それらしい数字が並ぶので、隠れます。8行目の0.66という値そのものは、手引きの目安と合っています。足りないのは、出どころと、場所ごとに見直すべきことの記録です。3つ目、9行目。雲、煙、水の画素を除かずに数えています。後の画像の煙と雲は、指数を下げるので、差が正になり、焼け跡として数えられます。水面は、値が安定せず、水位の変化で差が正にも負にもなります。正しくは、前と後の分類、SCLで、3、6、8、9、10のどちらかに当たる画素を、差の計算の前に外します。両方の分類を使います。除いた画素の割合も、表に出します。この3つのうち、1つ目が、AIが自信をもって誤った例です。焼け跡の指数は近赤外と短波長赤外、という説明は正しいので、2つある短波長赤外のどちらかを問わずに、ありそうな組を書きます。帯域の番号を指示文に書き、コードの帯域の番号と、公式の表を見比べるしかありません。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：地図と表を見る
    items:
      - 焼けたはずの山が、重度か中程度に入っているか。入っていなければ、引き算の向きが逆か、帯域が違う
      - 水田や畑が、焼け跡になっていないか。刈り取りは火災と同じ向きの変化。収穫の前後なら畑が並ぶ
      - 貯水池や川が、焼け跡になっていないか。水は値が安定しない。分類の6で除く
      - 雲と煙の縁が、焼け跡になっていないか。風下に段階の帯が伸びていれば煙
      - 焼けた範囲の縁が、報道の地図や消防の発表と合うか。区画の境界で直線に切れていれば前後で区画が違う
      - 合計の面積が、公的な記録と同じ桁か。どの記録と、どの日付で照らしたかを表に書く
    say: 判定を、手元でやってみます。AIに頼んだ人なら、できた段階の地図と、面積の表を見ながら、数分でできます。1つ目、焼けたはずの山が、重度か中程度に入っているか。入っていなければ、引き算の向きが逆か、帯域が違います。2つ目、水田や畑が、焼け跡になっていないか。刈り取りの前後では、葉が減って近赤外が下がり、土が出て短波長赤外が上がります。火災と同じ向きの変化なので、差が正になります。火災の前が収穫前、後が収穫後なら、畑が、軽度から中程度で並びます。3つ目、貯水池や川が、焼け跡になっていないか。水は、近赤外も短波長赤外も吸収して暗いので、指数の分母が小さく、値が安定しません。水位の変化や波で、差が正になることがあります。水の画素は、分類の6で除きます。4つ目、雲と煙の縁が、焼け跡になっていないか。後の画像の煙は、指数を下げます。焼けた範囲の風下に、段階の帯が伸びていれば、煙です。5つ目、焼けた範囲の縁が、報道の地図や消防の発表と合うか。縁が道路や尾根で止まっているなら、現実に近い形です。縁が画像の区画の境界で直線に切れているなら、前と後で区画が違います。6つ目、合計の面積が、公的な記録と同じ桁か。大船渡市の例では、林野庁の3月7日の被害報告が2900ヘクタール、消防白書が約3370ヘクタールの速報値です。どの記録と、どの日付で照らしたかを、表に書きます。この6つを、報告の前にやります。

  - kind: figure
    heading: 取り違えと、2つの例
    image: figures/codex-2-9-burn-index/confusions.svg
    say: 図は、焼け跡の取り違えが起きる場所です。左が、焼け跡に見えてしまうもの。刈り取った畑、水位や波が変わった水面、後の画像の煙と雲の縁、伐採や造成で土が出た場所。右が、焼け跡が見えない条件。雲と煙の下、前後で季節が違う、前後で衛星や処理の段階が違う、火災から時間がたち草が生えた。どちらも、前後の撮影日と、除いた画素の割合と、公的な記録との照合で確かめます。おかしな結果の例を2つ。例1、市の南側の水田が、一面、中程度の低になった。火災は山林で、水田は焼けていません。前の画像が9月の収穫前で、後の画像が10月の収穫後でした。刈り取りで葉が減り、土が出たので、差が火災と同じ向きに出ました。原因は、火災の前後だけでなく、季節の変化も差に入ることです。前の画像をできるだけ火災の直前にし、水田の区画を別に数えるか、段階の地図を山林の範囲に絞ります。例2、重度の面積が、林野庁の発表の10分の1しかない。地図では、焼けた範囲の中央だけが重度で、周りは、焼けていない、です。コードを見ると、短波長赤外にB11を使っていました。短波長赤外1では、焼けた場所の変化が小さく、差が区切りに届きません。原因は、帯域の取り違えです。B12に直し、面積の係数も20メートルに合わせて直します。言えるのは、この帯域と、この引き算の向きと、この区切りで、前と後のこの日付の間に、指数の差がこの段階に入った範囲の面積、です。帯域、向き、区切りの出どころ、撮影日、除いた画素の割合を表に書けば、別の火災と比べられます。言えないのは、木が枯れたかどうかと、焼けた原因です。差の値は焼け方の目安で、木が生き残るかは、次の生育期にならないと分かりません。雲と煙の下も分かりません。公的な記録の面積と、衛星の面積が違っても、どちらが正しいとは言えません。記録は速報から確定へ変わり、衛星は雲と季節の影響を受けるからです。違いの理由を書くのが、報告の役目です。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 火災の直後で、煙と雲が残っているとき。光学の画像は煙と雲の下が写らない。後の画像を待つか、レーダーを検討する
      - 小さな火災。2020〜2024年の平均は年約1,167件・約752ha。20mや30mの画素では数ヘクタール未満は数画素
      - 草地や畑の火災。草はすぐ生え、刈り取りと区別がつかない。区切りは森を前提にした目安
      - 火災から時間がたったとき。草が生えると差が小さくなる。鎮火直後と次の生育期の評価は別のもの
      - 有償の商用データ。短波長赤外2の帯域がない衛星もある。帯の表を契約の仕様書で確かめる
    say: 向かない条件も、押さえておきます。1つ目、火災の直後で、煙と雲が残っているとき。光学の画像は、煙と雲の下が写りません。後の画像を待つか、レーダーの画像を検討します。2つ目、小さな火災。20メートルや30メートルの画素では、数ヘクタール未満の焼け跡は、数画素にしかなりません。日本の林野火災の多くは小さく、2020年から2024年の5年の平均は、年に約1167件で、焼損面積は約752ヘクタールです。無償の画像で範囲を読めるのは、大きな火災に限られます。3つ目、草地や畑の火災。草は焼けてもすぐ生え、刈り取りと区別がつきません。段階の区切りは、森を前提にした目安です。4つ目、火災から時間がたったとき。草が生えると差が小さくなり、植物が増えた場所は負の値になります。鎮火の直後の評価と、次の生育期の評価は、別のものとして扱います。5つ目、有償の商用データを使うとき。考え方は同じですが、短波長赤外2の帯域がない衛星もあります。帯の表を契約の仕様書で確かめ、無い帯域の指数は使えないと、先に決めます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 火災の前と後の画像を選ぶ。火災の直前と鎮火の直後、雲と煙のない日。同じ衛星、同じ処理の段階（人）
      - 帯域を読み、反射率に直し、指数を2枚作らせる。B8AとB12。ずらしと倍率の記録（AI）
      - 前から後を引き、段階に分けさせる。区切りの値と出どころ。SCLの3、6、8、9、10を除き、除いた割合も（AI）
      - 面積に直させる。UTMのまま20m画素を400m²。段階ごとの面積、合計、座標の名前（AI）
      - 公的な記録と、地図で確かめる。同じ桁か、焼けていない場所が入っていないか、縁が合うか（人）
    say: 手順をまとめます。1、火災の前と後の画像を選ぶ。入れるのは、火災の日付、対象の範囲、雲の条件。出るのは、前の1枚と後の1枚の製品の名前、撮影日、雲の割合です。前は火災の直前で、後は鎮火の直後で、どちらも雲と煙がない日を選びます。前と後は、同じ衛星、同じ処理の段階にそろえます。人です。2、帯域を読み、反射率に直し、指数を2枚作らせる。入れるのは、製品の名前と、帯域の番号。出るのは、前と後の指数の画像、使った帯域、ずらしと倍率で直した記録です。AIです。3、前から後を引き、段階に分けさせる。入れるのは、2の2枚と、区切りの値と出どころ。出るのは、差の画像、段階の地図、段階ごとの画素数です。雲と影と水の画素は、分類の番号で除き、除いた割合も出します。AIです。4、面積に直させる。入れるのは、段階ごとの画素数と、画素の大きさ。出るのは、段階ごとの面積、合計、使った座標の名前です。Level-2AはUTMの座標なので、20メートルの画素は、400平方メートルとして数えます。AIです。5、公的な記録と、地図で確かめる。入れるのは、4の面積と、消防や林野庁の発表、焼けていないことが分かっている場所。出るのは、合計が発表の面積と同じ桁か、焼けていない場所が段階に入っていないか、焼けた範囲の縁が報道の地図と合うか、の判定です。人です。この5つを、火災ごとに繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      n0, s0 = read_bands(pre,  ["B8A", "B12"])   # 火災前
      n1, s1 = read_bands(post, ["B8A", "B12"])   # 火災後
      nbr0 = (n0 - s0) / (n0 + s0)
      nbr1 = (n1 - s1) / (n1 + s1)
      dnbr = nbr1 - nbr0
      severe   = dnbr > 0.66
      moderate = (dnbr > 0.27) & (dnbr <= 0.66)

      AIの説明：「重度の焼け跡は420ヘクタール、中程度は310ヘクタールです。
      　NBRは近赤外B8Aと短波長赤外B12から計算し、変化を見るために
      　火災後の指数から火災前の指数を引きました。段階はUSGSの標準的な表です」
      → 消防の発表で焼けたとされる尾根が「焼けていない」になり、
      　冬に伐採され春に下草が伸びた南側の谷（火災と無関係）が「重度」に
      問い：この結果から最初に疑うべきことはどれか
      A. 区切りの0.66が高すぎて、尾根の焼け跡が重度に届かなかった
      B. 引き算の向きが「後から前」なので、焼けた場所が負の値になって
      　 「焼けていない」に入り、植物が増えた場所が正の値になって「重度」に入っている
      C. B8Aは20mで粗いので、尾根の細い焼け跡が画素に収まらなかった
      D. 火災後の画像に煙が残っていて、尾根の指数が下がらなかった
    highlight: [5]
    say: 宿題です。章のケース問題の問1を出します。ある県の担当者が、AIに、Sentinel-2のLevel-2Aで、3月の林野火災で焼けた範囲を段階に分けて、面積をヘクタールで出して、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。重度の焼け跡は420ヘクタール、中程度は310ヘクタールです。焼け跡の指数、NBRは、近赤外B8Aと短波長赤外B12から計算し、変化を見るために、火災後の指数から火災前の指数を引きました。段階は、USGSの標準的な表で分けています。できた地図では、消防の発表で焼けたとされる尾根の一帯が、焼けていない、になり、代わりに、火災と関係のない南側の谷の一部が、重度、になっていました。谷は、火災の前の冬に伐採され、春に下草が伸びた場所です。この結果から、最初に疑うべきことはどれでしょうか。A、区切りの0.66が高すぎて、尾根の焼け跡が重度に届かなかった。B、引き算の向きが、後から前、なので、焼けた場所が負の値になって、焼けていない、に入り、植物が増えた場所が正の値になって、重度、に入っている。C、B8Aは20メートルで粗いので、尾根の細い焼け跡が画素に収まらなかった。D、火災後の画像に煙が残っていて、尾根の指数が下がらなかった。この動画で見た、差の向きと、判定の表を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が向きを直したあと、合計が約2600ヘクタールになり、県の被害報告の約2900ヘクタール、消防白書の約3400ヘクタールの速報値と違ったとき、AIが、衛星の面積が小さいので発表が過大です、と説明した場面で、説明の問題点と、報告に書くべきことを2行で書く、問2の短答も、そこにあります。

