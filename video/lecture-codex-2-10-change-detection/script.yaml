# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第10章「衛星データの変化検出：Sentinel-2とLandsatの同じ季節の2枚から造成や伐採の変化を拾い、位置のずれと雲の縁の「変化」を除く」（learn/codex/codex-2-10-change-detection.qmd）
title: 衛星データの変化検出：Sentinel-2の2枚でAIが誤る3点を見抜く
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 14
total: 30
thumb: 季節をそろえる
summary: 去年と今年の衛星画像（Sentinel-2、Landsat）を比べて、造成や伐採の候補を出す「変化検出」の章。同じ季節・同じ衛星・同じ処理の段階の2枚を選び、位置のずれの公式の仕様（Sentinel-2は5m未満、LandsatのTier 1は12m以下）を押さえ、前と後の両方で雲のない画素だけで差を出すまでを、しくみから見ます。月を見ずに雲の少なさだけで前の画像を選ぶ、後の画像の雲だけを除く、差の絶対値で増減を混ぜる、という3つの誤りを、AIが返したコードを一緒にレビューして見つけます。候補の地図と件数の表を手元で確かめる練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 変化検出：同じ季節の2枚から変化を拾う
    sub: 季節、衛星と段階、位置、雲と影の4つをそろえる
    say: 去年と今年の衛星画像を比べれば、森が切られた場所や、土が出た場所は分かるでしょうか。答えは、同じ季節、同じ衛星、同じ処理の段階の2枚を選び、位置が合っていることを確かめ、両方で雲のない画素だけで差を出せば、候補が分かる、です。差の計算そのものは1行です。しかし、何と何を比べるかを人が決めないと、季節の違いと雲の縁が「変化」として数えられ、本当の変化が埋もれます。この動画では、2枚をそろえる4つの条件を見たあと、AIが返したコードを一緒にレビューして、3つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 季節と条件をそろえた2枚から差を出し、位置のずれと、雲のない画素の扱いを確かめられる
      - 位置の公式の仕様（Sentinel-2は5m未満、LandsatのTier 1は12m以下）と、縁に「変化」が出る理由が分かる
      - 「同じ区画なので位置合わせは不要」、後の雲だけ除く、収穫した畑を造成と数える、の3つの誤りを見つけられる
    say: この章を終えると、3つのことができるようになります。1つ目、季節と条件をそろえた2枚の画像から差を出し、位置のずれと、雲のない画素の扱いを確かめられること。2つ目、2枚の画像の位置が公式の仕様でどれだけ合っているか、Sentinel-2は5m未満、LandsatのTier 1は12m以下、ということと、それでも地物の縁に「変化」が出るのはなぜかが分かること。3つ目、AIが、同じ区画なので画素は完全に一致します、と自信をもって位置合わせを省く誤り、後の画像の雲だけを除く誤り、収穫で色が変わった畑を造成として数える誤りを、コードと地図から見つけられることです。

  - kind: figure
    heading: しくみ：2枚でそろえる4つの条件
    image: figures/codex-2-10-change-detection/conditions.svg
    say: まず、しくみです。同じ場所を、同じ条件で2回撮れば、変わっていない場所の画素の値はほぼ同じで、変わった場所だけ値が動きます。これが2時期の比較の土台です。ただし、同じ条件、は4つあります。図の4枚のカードです。1つ目、季節。葉の量と、土の湿りです。落葉樹は冬に葉を落とし、水田は春に水が入り、秋に刈られます。春と秋の画像を比べれば、土地は何も変わっていなくても、画面の大半が「変化」になります。火災の評価の手引きでも、前後の画像は水分と季節の状態をできるだけそろえ、撮影の時期が最大の落とし穴になりうる、と述べられています。2つ目、衛星と処理の段階。Level-1CとLevel-2Aでは、大気の影響の分だけ値が違います。同じ衛星、同じ段階、同じ区画でそろえます。3つ目、位置。画素が同じ地面を指しているかです。公式の仕様では、Sentinel-2のLevel-1Cは、別の日の画像どうしのずれが5m未満。LandsatのCollection 2でTier 1に入る画像は、12m以下です。10mの画素で5mのずれは、半画素です。ずれは0ではないので、道路、畑の縁、建物の輪郭のように、値が急に変わる場所では、半画素のずれだけで差が出ます。地図に細い線の「変化」が並んでいたら、位置のずれです。4つ目、雲と影。どちらかの画像で雲なら、その画素は比べられません。Sentinel-2のLevel-2Aには分類、SCLが付いていて、3が雲の影、8と9が雲、10が薄い雲です。Landsatには画素ごとの品質、QA_PIXELが付いていて、雲、雲の影のほかに、雲を一回り広げた範囲の印があります。雲の縁は、分類が雲にならないのに、明るさが変わっている薄い帯です。だから、Sentinel-2の分類をそのまま使うなら、雲の画素を数画素分広げてから除きます。使う値は、森や畑の変化なら、近赤外と赤から計算する植生の指数、NDVIの差。Sentinel-2ではB8とB4、Landsat 8と9ではBand 5とBand 4です。建物や土の変化なら、短波赤外、Sentinel-2のB11の差も見ます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.66]
    rows:
      - [去年と今年で変わった場所を出して, 2025年8月と2026年8月の、同じ区画、同じ段階の2枚で。月を合わせられないなら前後2週間まで]
      - [雲は除いて, 前と後の両方のSCLで除いて。雲は3画素分広げてから。残った画素の割合も表に]
      - [差の大きい場所を出して, 前から後を引いた符号付きの差で。基準0.3は届出のある造成の値で見直し、出どころを表に]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。去年と今年で変わった場所を出して、とだけ頼むと、AIは手元にある、最も雲の少ない2枚を選びます。それが4月と10月なら、町の畑の全部が「変化」です。だから、2025年8月と2026年8月の、同じ区画、同じ段階の2枚で。月を合わせられないなら、前後2週間まで、と月を指示します。雲は除いて、ではなく、前と後の両方のSCLで除いて。雲は3画素分広げてから。残った画素の割合も表に。差の大きい場所を出して、ではなく、前から後を引いた、符号付きの差で。基準の0.3は、届出のある造成の差の値で見直し、出どころを表に。指示の7項目のうち、確かめ方には、届出のある造成が候補に入ることを示すこと、道路の交差点3か所で前と後の画素の位置が同じことを示すこと、候補のうち、幅が1画素の細長いものと、雲の縁に沿うものの件数を別に数えることを入れます。なお、3画素、0.3、前後2週間は、この章で例として置いた値です。基準は、知っている変化で見直します。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 2時期の変化の候補（誤りあり）
      pre  = least_cloudy(tile="T54SUE", year=2025)         # 月を見ていない
      post = least_cloudy(tile="T54SUE", year=2026, month=8)
      ndvi0 = ndvi(pre,  "B8", "B4")
      ndvi1 = ndvi(post, "B8", "B4")
      bad   = isin(scl(post), [3, 8, 9, 10])                # 後の分類だけ
      diff  = abs(ndvi1 - ndvi0)                            # 符号が消える
      cand  = (diff > 0.3) & ~bad                           # 0.3の出どころなし
      n_cand = count_regions(cand)
    highlight: [2, 6, 7, 8]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。前の画像は、去年で最も雲の少ない日を自動で選びました。同じ区画なので画素は完全に一致し、位置合わせは不要です。後の画像のSCLで雲を除いたので、雲の影響はありません。変化の大きさは、差の絶対値で評価しました。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、比べる条件。前と後の撮影日が同じ季節か。同じ衛星、同じ段階、同じ区画か。2、位置と座標。位置のずれを確かめる手順があるか。3、雲と影。前と後の両方で除いているか。縁を広げているか。4、基準の値。差の符号を残しているか。基準の出どころがあるか。まず、2行目を見てください。前の画像は、year、イコール、2025、だけ。月がありません。3行目の後の画像には、month、イコール、8、があります。次に、6行目。scl、括弧、post。後の分類だけです。7行目。abs。絶対値です。8行目。0.3、という基準に、出どころがありません。そして、コードのどこにも、位置を確かめる行がありません。このコードは、動かしても止まりません。地図と件数の表は出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.10, 0.13, 0.31, 0.42]
    rows:
      - ["2", 比べる条件, "year=2025 だけ。「去年で最も雲の少ない日」", "月を見ていない。前にも month=8 を付け、合わなければ前後2週間まで。撮影日を表に出す"]
      - ["6", 雲と影, "scl(post) だけ。「後の雲を除いたので影響なし」", "前の雲が「変化」になる。前と後の両方の分類を使い、雲を数画素分広げてから除く"]
      - ["7〜8", 基準の値, "abs(...) と 0.3。「絶対値で評価」", "増えた場所と減った場所が混ざる。前から後を引いて符号を残し、基準は届出のある造成の値で決めて記録に"]
      - ["なし", 位置と座標, "「同じ区画なので完全に一致、位置合わせは不要」", "仕様は5m未満のずれ。「完全に一致」は仕様に無い言葉。道路の交差点で前後の画素を見比べる手順を足す"]
    say: 判定の結果が、この表です。誤りは3つと、自信をもって誤った説明が1つです。1つ目、2行目。前の画像を、最も雲の少ない日、で選んでいて、月を見ていません。2025年で雲が最も少なかった日が11月なら、落葉した森と、刈り取った田が、8月の画像との差で、一面「変化」になります。正しくは、前にもmonth、イコール、8を付け、合わなければ前後2週間まで広げる、と範囲を指示します。撮影日を表に出させれば、地図を見る前に気づけます。2つ目、6行目。後の画像の分類だけで雲を除いています。前の画像に雲があれば、その雲の画素は植生の指数が低いので、後の森との差が大きく、「変化」になります。正しくは、前と後の両方の分類を使い、雲の縁のために、数画素分広げます。3つ目、7行目と8行目。差の絶対値を取っているので、植物が減った場所、造成と、増えた場所、植林や草の繁茂が、同じ候補になります。基準の0.3にも出どころがありません。正しくは、前から後を引いて符号を残し、減った候補と増えた候補を分け、基準は届出のある造成の差の値で決めて、記録に書きます。最後に、AIの説明の、同じ区画なので画素は完全に一致し、位置合わせは不要です。同じ区画で同じ座標なら、画素の格子は同じです。しかし、画像の中身が地面のどこを指すかには、公式の仕様でも、5m未満のずれがあります。「完全に一致」は、仕様に無い言葉です。コードに、道路の交差点などで、前後の画素を見比べる手順を足します。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：候補の地図と表を確かめる
    items:
      - 表の前と後の撮影日を見る。月がそろっているか。前が10月や11月なら、季節の差
      - 届出のある造成や、報道された伐採が候補に入っているか。無ければ基準が高いか、季節に埋もれている
      - 幅1画素の細い線が、道路や畑の縁に並んでいないか。並んでいれば位置のずれ
      - 候補が雲の形に弧を描いていないか。水田や畑が区画の形のまま一面候補になっていないか
      - 件数が町の大きさと合うか。造成が年に数件なのに候補が数千件なら、季節か雲か位置の誤り
    say: 判定を、手元でやってみます。AIに頼んだ人なら、候補の地図と件数の表を見ながら、数分でできます。まず、表の、前と後の撮影日を見ます。月がそろっているか。前が10月や11月なら、収穫の後の畑と落葉した森を、8月と比べています。季節の差です。2つ目、知っている変化が候補に入っているかを見ます。届出のある造成や、報道された伐採が候補に無ければ、基準が高すぎるか、季節の違いに埋もれています。3つ目、地図を広げて、幅1画素の細い線が、道路や畑の縁に並んでいないかを見ます。地物の輪郭に沿う細い候補は、位置のずれです。候補を3画素以上のまとまりに絞ると減ります。4つ目、候補が雲の形に沿って、弧を描いていないか。描いていれば雲の縁です。前と後のどちらの雲かを、撮影日ごとの分類で確かめます。そして、水田や畑が、区画の形のまま一面候補になっていないか。区画の形のままなら、作付けや収穫の違いです。造成なら、区画の形と関係なく、道路に沿った形や、不規則な形になります。5つ目、候補の件数が、町の大きさと合うか。町の造成の届出が年に数件なのに、候補が数千件なら、季節か雲か位置の誤りです。この5つを、報告の前にやります。

  - kind: figure
    heading: 結果の目視観点と、2つの例
    image: figures/codex-2-10-change-detection/confusions.svg
    say: 直したら、候補の地図と件数の表を、目で確かめます。図の左が、変化に見えてしまうもの。季節の違い、位置のずれによる縁の細い線、片方の画像の雲と雲の縁、そして、入射角の違いによる屋根のずれです。斜めから撮った画像では、建物の屋根の位置が、入射角の違いでずれ、誤抽出の原因になります。図の右が、本当の変化が埋もれる条件。基準が高すぎる、雲で両方とも見えない、画素より小さい変化、絶対値で増減が混ざる、です。表には、両方で晴れの画素の割合があるかも見ます。残った画素が5割なら、残りの5割は「分からない」であり、「変化なし」ではありません。おかしな結果の例を2つ。例1、町の南半分の畑が、区画ごとに一面「変化」になった。前の画像は2025年10月、後は2026年8月でした。10月の畑は収穫の後で土が出ていて、8月は作物が茂っています。差は、作物の有無を拾っています。原因は、季節のずれです。前の画像を8月に取り直すか、畑の区画は別に扱い、候補を山林と宅地に絞ります。例2、候補の件数は少ないが、川に沿って幅1画素の線が延々と続く。前と後で、片方がLevel-1C、もう片方がLevel-2Aでした。処理の段階が違うと、位置が半画素ずれることがあり、川岸のように値が急に変わる場所で、線の「変化」が出ます。同じ段階にそろえ、道路の交差点で前後の画素の位置を確かめます。言えるのは、この2つの撮影日の間に、両方で晴れていた画素のうち、この値の差が、この基準を超えてまとまった場所、です。言えないのは、変化の原因と、変化が起きた日です。土が出た理由が、造成か、伐採か、災害かは、画像の差だけでは分かりません。候補は、現地か、届出の台帳か、別の日の画像で確かめます。国土地理院が中分解能の衛星画像とAIで建物の変化を抽出した検証では、適合率、候補のうち本当に変化だった割合は、75.8%でした。候補の4つに1つは、現地で見ると変化ではない。候補は「見に行く順番」で、「変化の件数」ではありません。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 2枚の間に季節をそろえられないとき（災害の直前と直後）。季節の差を引く別の手順が要る
      - 画素より小さい変化。10mの画素では、幅数mの道路や小さな建物は1画素に混ざる
      - 雲の多い地域と季節。両方で晴れの画素が少ない。残った割合を表に書き、足りなければレーダーを検討
      - 変化の原因や日付を知りたいとき。2枚の差は原因も日付も教えない。時系列か現地の確認が要る
      - 有償の商用データ。撮影の角度が日ごとに違う衛星では、屋根の位置がずれて誤抽出が増える
    say: 向かない条件も、押さえておきます。1つ目、2枚の間に季節をそろえられないとき。災害の直前と直後のように、月を選べないときは、同じ季節の平常時の差を引くなど、季節の差を「変化」から引く別の手順が要ります。2つ目、画素より小さい変化。10mの画素で、幅数メートルの道路や、小さな建物の変化は、1画素の中に混ざります。無償の画像では、変化の候補は、数画素以上のまとまりに限ります。3つ目、雲の多い地域と季節。両方で晴れの画素が少ないと、比べられる範囲が小さくなります。残った割合を表に書き、足りなければ、レーダーの画像を検討します。4つ目、変化の原因や日付を知りたいとき。2枚の差は、原因も日付も教えません。複数の日の画像を並べる時系列の解析か、現地の確認が要ります。5つ目、有償の商用データを使うとき。考え方は同じですが、撮影の角度が日ごとに違う衛星では、建物の屋根の位置が角度でずれ、誤抽出が増えます。前と後の入射角を仕様書で確かめ、できるだけそろえます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 比べる2枚の条件を決める。知りたい変化、範囲、知っている変化の場所から、前後の月、衛星、段階、区画、雲の上限（人）
      - 2枚を選び、位置を確かめさせる。製品の名前と撮影日、同じ区画と座標の記録、交差点など数か所の画素の比較（AI）
      - 両方で雲と影のない画素だけを残させる。前後のSCLと除く番号、広げる画素数。「両方で晴れ」の地図と割合（AI）
      - 差を出し、基準で候補に分けさせる。符号付きの差、候補の地図、件数と面積、基準の出どころ、座標の名前（AI）
      - 知っている変化と地図で確かめる。細い線、雲の縁、一面の畑が無いか。候補は「見に行く順番」（人）
    say: 手順をまとめます。1、比べる2枚の条件を決める。入れるのは、知りたい変化、対象の範囲、届出のある造成など、知っている変化の場所。出るのは、前と後の月の範囲、衛星、処理の段階、区画の番号、雲の上限の表です。人です。2、2枚を選び、位置を確かめさせる。出るのは、前と後の製品の名前と撮影日、同じ区画と座標であることの記録、道路の交差点など数か所の画素の位置の比較です。AIです。3、両方で雲と影のない画素だけを残させる。入れるのは、前と後の分類と、除く番号、雲を広げる画素数。出るのは、両方で晴れの画素の地図と、残った画素の割合です。AIです。4、差を出し、基準で候補に分けさせる。出るのは、符号付きの差の画像、候補の地図、候補の件数と面積、基準の値と出どころ、使った座標の名前です。AIです。5、知っている変化と、地図で確かめる。知っている変化が候補に入っているか、細い線の候補が無いか、雲の縁に候補が並んでいないか、畑が一面候補になっていないか、を判定します。人です。この5つを、2枚を比べるごとに繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      pre  = least_cloudy(tile="T54SUE", year=2025)
      post = least_cloudy(tile="T54SUE", year=2026, month=8)
      d    = ndvi(pre, "B8", "B4") - ndvi(post, "B8", "B4")
      bad  = isin(scl(post), [3, 8, 9, 10])
      cand = (d > 0.3) & ~bad

      AIの説明：「候補は2,140件。前は2025年で最も雲の少ない日、後は2026年8月で
      　最も雲の少ない日を自動で選びました。同じ区画なので位置合わせは不要です」
      → 地図では、町の南半分の水田と畑が、区画の形のまま、ほぼ全部が候補。
      　届出のある北東の造成も候補に入っている。町の造成の届出は年に数件

      問い：この結果から最初に疑うべきことはどれか
      A. 基準の0.3が低すぎて、わずかな差まで候補に入った
      B. 前の画像の撮影日が8月ではなく、作付けの違いが区画ごとの「変化」になった
      C. 位置合わせをしていないので、水田の区画が1つずつずれて候補になった
      D. 前の画像の雲を除いていないので、雲のあった場所が候補になった
    highlight: [1, 4, 9]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、去年と今年の画像を比べて、森や畑が土に変わった場所の候補を出して、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。候補は2,140件。前の画像は2025年で最も雲の少ない日、後の画像は2026年8月で最も雲の少ない日を、自動で選びました。同じ区画なので、位置合わせは不要です。後の画像のSCLで雲を除いたので、雲の影響はありません。できた地図では、町の南半分の水田と畑が、区画の形のまま、ほぼ全部が候補になっていました。届出のある北東の造成も、候補に入っています。町の造成の届出は、年に数件です。この結果から、最初に疑うべきことはどれでしょうか。A、基準の0.3が低すぎて、わずかな差まで候補に入った。B、前の画像の撮影日が8月ではなく、収穫の後や水の入る前の季節で、作付けの違いが、区画ごとの「変化」として数えられている。C、位置合わせをしていないので、水田の区画が1つずつずれて候補になった。D、前の画像の雲を除いていないので、雲のあった場所が候補になった。この動画でやった、撮影日の見方と、区画の形のまま候補になる、という目視の観点を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が季節をそろえて候補が38件になり、表に、両方で晴れの画素は52%、とあるのに、AIが、残りの48%は変化なしです、と説明した、という場面で、問題点と報告に書くべきことを2行で書く、問2の短答も、そこにあります。

