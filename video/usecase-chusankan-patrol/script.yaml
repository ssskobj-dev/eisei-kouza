# ユースケース解説動画の台本。元の記事：casebook/chusankan-patrol.qmd
title: 中山間地の見回りを衛星で減らす
series: CASEBOOK
kicker: ユースケース解説
voice: もち子
speed: 1.0
scenes:
  - kind: cover
    heading: 中山間地の見回りを衛星で減らす
    sub: 直接支払の現地確認を、色分け図で絞り込む
    say: 衛星データのユースケース解説です。今回は、農地の現地確認を衛星で減らした、日本の自治体の事例を取り上げます。どこの、誰が、何のために使い、業務のどこに入れて、何を決める材料にしているのか。そして、無償の衛星でどこまでできて、有償の画像を使うといくらかかるのかまで見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。佐賀県伊万里市
      - 誰が：市の農政の担当者（発注）と、地場の企業（解析）
      - 何のために：中山間地域等直接支払の対象農地が、耕作、管理されているかの確認
      - 困りごと：対象が数千筆になると、全部を見て回る負担が大きい
    say: 事例の舞台は、日本の佐賀県伊万里市です。発注するのは市の農政の担当者、解析するのは地場の企業です。目的は、中山間地域等直接支払という制度で、対象の農地が実際に耕作、管理されているかを確かめることです。対象が数千筆になると、職員が全部を見て回る負担が大きくなります。そこで、見に行かなくてよい農地を衛星で先に外す、という使い方をしています。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-chusankan-patrol/flow.svg
    caption: 見回りの計画を立てる前に、衛星の判定を入れる
    say: 業務の流れを見ます。入る位置は、見回りの計画を立てる前です。まず、市が農地の区画の地図データを企業に渡します。企業は、農林水産省のマニュアルに沿って衛星データを解析し、農地を4段階に色分けした地図を納品します。市は、調査不要と判定された農地を計画から外し、残りを見回ります。最後に、不要と判定された農地の数パーセントを抜き取りで見回り、判定が合っているかを確かめます。つまり、衛星は見回りの代わりではなく、見に行く順番と範囲を決める道具です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-chusankan-patrol/split.svg
    say: 役割の分担はこうなります。衛星の解析が行うのは、農地を4段階に色分けすることと、見回り不要の農地を外すことです。職員が行うのは、要確認の農地を見回ること、抜き取りで精度を確かめること、そして集落に説明することです。伊万里市では、本導入の前に1年間の実証を行い、現地の見回りは約4,000筆、約50パーセント減りました。実証ではなく、業務として運用されている事例です。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [農地ごとの4段階の色分け（GISの地図データ）, どの農地を見回り、どの農地を省くか]
      - [「耕作放棄地」と判定された農地の一覧, 先に現地を確かめる場所。集落との話し合いの対象]
      - [「解析対象外」の農地の一覧, 衛星では判定できず、従来どおり見回る農地の数]
      - [抜き取りの見回りの結果, 来年も同じ方法を続けてよいか]
    say: 受け取るデータと、それで決められることを整理します。農地ごとの4段階の色分けは、どの農地を見回り、どの農地を省くかの根拠になります。耕作放棄地と判定された一覧は、先に現地を確かめる場所と、集落との話し合いの対象になります。解析対象外の一覧は、衛星では判定できず、従来どおり見回る農地の数を示します。そして抜き取りの結果が、来年も同じ方法を続けてよいかの判断材料になります。解析対象外と要調査の合計が、見回りの残る量です。導入の前に小さな範囲でこの割合を出しておくと、効果を見積もれます。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-chusankan-patrol/limits.svg
    say: 限界も、資料にはっきり書かれています。1つ目、小さな区画は解析できません。衛星の画素より小さい農地は、周りの土地と混ざって見えるためです。2つ目、狭い農地が多い集落では、見回りの要る農地が多く残り、効果が小さくなります。3つ目、分かるのは耕作や管理の有無までで、作物の種類や活動の中身は分かりません。4つ目、衛星だけで確認を終えてはいません。抜き取りの見回りは、本導入の後も続いています。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-2は無償。10mの画素で、2機で赤道付近なら5日ごとに撮る
      - 作付けや管理の有無は、植生の指数の季節変化で読める。データ費は0円
      - 10mの画素では、小さな区画や細長い区画は判定しにくい。「解析対象外」が増える
      - 雲で使えない日がある。確認したい時期に、使える画像があるとは限らない
    say: では、無償の衛星でどこまでできるでしょうか。欧州のSentinel-2は無償で、10メートルの画素、2機で赤道付近なら5日ごとに撮っています。作付けや管理の有無は、植物の元気さを表す指数の季節の変化から読めます。データの費用は0円です。一方で、10メートルの画素では小さな区画や細長い区画は判定しにくく、解析対象外が増えます。雲で使えない日もあります。なお、この事例の資料には使った衛星の種類は書かれていないので、無償データで同じ結果が出るとは言えません。

  - kind: table
    heading: 有償の画像を使うと、いくらか（概算）
    columns: [項目, 仮定と計算]
    widths: [0.36, 0.64]
    rows:
      - [画像, 3m級の光学画像のアーカイブ。公開価格 1.80米ドル/km²、最小発注 250km²（Apollo Mapping、2022年12月の公開記事）]
      - [範囲, "仮定：対象の農地を含む範囲が最小発注量の 250km² に収まる"]
      - [回数, "仮定：年2回（作付けの時期と、収穫の後）"]
      - [年の画像代, "250km² × 1.80ドル × 2回 ＝ 900ドル。1ドル150円なら 約13.5万円。年4回なら約27万円"]
      - [別にかかるもの, 解析の委託費（伊万里市の例は解析を含めて年50万円前後）、地図データの整備、抜き取りの見回り]
    say: 有償の画像を使う場合の概算です。これは仮定を置いた計算で、見積もりではありません。3メートル級の光学画像のアーカイブに、1平方キロあたり1.80米ドル、最小発注250平方キロという公開価格があります。2022年12月の公開記事の値です。対象の農地を含む範囲が最小発注量に収まると仮定し、年2回解析すると、画像代は900ドル。1ドル150円なら、年に約13.5万円です。年4回なら約27万円になります。これに、解析の委託費が別にかかります。伊万里市の例は、解析を含めて年50万円前後でした。価格は変わるので、実際の金額は必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [農地の大きさ, まとまった広さの農地が多い, 狭い農地、細かく分かれた区画が多い]
      - [対象の数, 数千筆以上で、見回りの負担が大きい, 数百筆で、見て回れる]
      - [地図データ, 農地の区画のデータが整っている, 紙の台帳だけ]
      - [確かめたいこと, 耕作、管理されているかどうか, 作物の種類、活動の中身]
      - [体制, 抜き取りの確認を続けられる, 衛星の判定だけで終えたい]
    say: 最後に、向き不向きです。向いているのは、まとまった広さの農地が多く、対象が数千筆以上で、区画の地図データが整っている自治体です。確かめたいことが、耕作、管理の有無であることも条件です。逆に、狭い農地が多い、数百筆で見て回れる、紙の台帳しかない、作物の種類まで知りたい、衛星の判定だけで終えたい、という場合は向きません。提案するときは、最初に農地の大きさの分布を聞くこと、見回りがなくなるとは言わないこと、財源とセットで話すことが要点です。

  - kind: cta
    heading: 導入を検討する方へ
    items:
      - 仕様書（RFP）の作成と、相見積もりの取り方をお手伝いします
      - どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします
      - 記事の全文と出典は、サイトのユースケース集にあります
    url: ssskobj-dev.github.io/eisei-kouza
    credits:
      - "出典：農林水産省「衛星画像活用の動きが広がっています！」 https://www.maff.go.jp/j/kanbo/dx/attach/pdf/eisei-3.pdf"
      - "価格：Apollo Mapping, Product Update（2022年12月6日） https://apollomapping.com/blog/product-update-simplified-ordering-options-for-3-m-planetscope-satellite-imagery"
      - "衛星の仕様：Copernicus SentiWiki「Sentinel-2 Mission」"
    say: この事例をもとに、自分の地域や顧客に合わせて導入を検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。希望の方は、サイトの相談フォームからご連絡ください。記事の全文と出典は、サイトのユースケース集にあります。ご視聴ありがとうございました。
