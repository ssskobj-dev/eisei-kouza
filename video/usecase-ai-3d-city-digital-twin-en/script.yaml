# English use-case video. Same facts as casebook/ai-3d-city-digital-twin.qmd; English narration & slides.
lang: en
voice: Ryan
title: Building 3D cities from satellites to show flood risk to residents
series: CASEBOOK
kicker: Use case
number: 65
total: 221
thumb: AI 3D cities
summary: How satellite imagery plus AI builds photoreal 3D cities so flood and sea-level-rise scenarios can be shown to residents, used in Tonga and Ghana with UN and Commonwealth partners. Where it fits, what it decides, and why it is not a substitute for survey. About 6 minutes.
scenes:
  - kind: cover
    heading: 3D cities from satellites, to show flood risk
    sub: Tonga and Ghana disaster-preparedness digital twins
    say: Can you build a 3D city to show residents what a flood would do, without sending a survey crew? Yes, up to a point. Satellite imagery and elevation data are fed to an AI that generates a photoreal 3D city, and flood or sea-level-rise scenarios are laid on top. A Japanese company has done this in Tonga and Ghana with the United Nations and the Commonwealth. In this video we look at who uses it, where it fits, what it can decide, and why, as of 2026, it is not a replacement for survey.

  - kind: bullets
    heading: Where, who, and why
    items:
      - "Where: Tonga, and the capital of Ghana, Accra. Partners across the Commonwealth"
      - "Who: national disaster agencies, with the UN Office for Outer Space Affairs"
      - "The maker: a Japanese company, SpaceData, generates the 3D city with AI"
      - "Why: flat maps make it hard to see what a flood does to your own home"
    say: The cases are set in Tonga, in the Pacific, and in Accra, the capital of Ghana. The buyers are national disaster agencies, working with the United Nations Office for Outer Space Affairs. The 3D city is generated by a Japanese company, SpaceData, using AI. The reason is simple. On a flat map, it is hard for a resident to picture what a flood means for their own house. A 3D city makes it land.

  - kind: steps
    heading: How the 3D city is made
    items:
      - Take high-resolution satellite imagery and elevation data of the area
      - AI estimates building height, land cover, and surface material
      - 3D software adds texture; a game engine adds light and shadow for a photoreal look
      - Flood or sea-level-rise scenarios are laid on top
      - People review it against local survey and drainage information
    say: Here is how it is made. First, you take high-resolution satellite imagery and elevation data of the area. The AI estimates each building's height, the land cover, and the surface material. 3D software adds texture, and a game engine adds light and shadow so it looks photoreal. Then flood or sea-level-rise scenarios are laid on top. Finally, people review the result against local survey and drainage data. The satellite captures the shape of the city, fast and from a distance. The water modelling, the evacuation routes, and the explanation to residents stay human work.

  - kind: table
    heading: Satellite and AI versus people
    columns: [Satellite and AI do, People do]
    widths: [0.5, 0.5]
    rows:
      - [Capture the city shape from imagery, Set the sea-level and rainfall assumptions]
      - ["Estimate height, land cover, material", Review against survey and drainage]
      - [Generate a photoreal 3D city, Revise evacuation routes and drills]
    say: The split of roles looks like this. The satellite and the AI capture the shape of the city, estimate building height, land cover and material, and generate the photoreal 3D model. People set the sea-level and rainfall assumptions, check the result against survey and drainage information, and revise evacuation routes and drill plans. The Tonga material lists one clear benefit of the satellite approach. It needs almost no on-site infrastructure to get started.

  - kind: bullets
    heading: The cases, Tonga and Ghana
    items:
      - "Tonga: a CEOS and UN-SPIDER pilot. Pleiades Neo imagery at 15 cm and 30 cm"
      - "Nukuleka village: a sea-level-rise view marking buildings red at 0.5 m flood depth"
      - "Accra, Ghana: a city digital twin with flood scenarios, with UN and Commonwealth"
      - "June 2026: Space4Resilience launched for all 56 Commonwealth countries, pilots from July"
    say: Here are the cases. In Tonga, a pilot project run by the Committee on Earth Observation Satellites and UN-SPIDER used very high-resolution imagery, fifteen and thirty centimetres, from the Pleiades Neo satellites. For the village of Nukuleka, a sea-level-rise view marked buildings in red where flooding reaches half a metre deep. In Accra, the capital of Ghana, a city digital twin with flood scenarios was built with United Nations and Commonwealth partners. And in June 2026, a framework called Space4Resilience was launched for all fifty-six Commonwealth countries, with pilots starting in July. Note the stage. Everywhere, this is a pilot, not day-to-day operation.

  - kind: table
    heading: What decisions it supports
    columns: [What you receive, What you can decide]
    widths: [0.42, 0.58]
    rows:
      - [A 3D city model, Which districts to prioritise for drills and briefings]
      - [A flood simulation video and map, Which evacuation routes may be blocked]
      - [A sea-level-rise view, Candidate sites for coastal protection to study]
      - [Briefing material using the 3D view, How to word the evacuation message]
    say: Here is what you receive and what it lets you decide. The 3D city model helps you decide which districts to prioritise for drills and briefings. The flood simulation tells you which evacuation routes may be blocked, and which scenarios to rehearse. The sea-level-rise view points to candidate sites for coastal protection to study further. And the briefing material helps you word the evacuation message. What it decides is priority and framing, which area to look at first, which scene to rehearse. It does not decide, building by building, whether a given house floods.

  - kind: bullets
    heading: Limits as of 2026
    items:
      - No accuracy or validation figures are published in the sources
      - Building sides and material are AI estimates, not the real facades
      - It relies on 15 cm and 30 cm imagery, which is paid and high-resolution
      - The flood view is a visual; the water calculation behind it is not shown
      - Interiors, foundations, drains and levee detail are not visible from space
    say: The limits matter, and they are plain. First, the sources publish no accuracy or validation figures, so there is no basis to call it a substitute for survey. Second, buildings are shot from near-overhead, so the sides and the material are AI estimates, not the real facades. Third, it relies on fifteen and thirty centimetre imagery, which is paid and high resolution. Fourth, the flood view is a picture to show people; the sources do not state the sea-level value assumed, or whether rainfall and drainage were in the calculation. So you cannot look at it and declare that a specific house will flood. Fifth, interiors, foundations, drains and levee detail are not visible from space, and must come from local plans and survey.

  - kind: bullets
    heading: How far do free satellites go?
    items:
      - The Tonga case used paid 15 cm and 30 cm imagery, not free data
      - Free imagery such as Sentinel-2 is about 10 m per pixel
      - Whether 10 m data yields the same photoreal 3D is not stated in the sources
      - A 2021 announcement mentioned a free base; its 2026 status is unconfirmed
    say: So how far could free satellites take you? Honestly, the sources do not answer this. The Tonga case used paid fifteen and thirty centimetre imagery, not free data. Free imagery, such as Europe's Sentinel-2, is around ten metres per pixel. Whether ten-metre data could produce the same photoreal 3D city is not stated anywhere we could verify. A 2021 announcement did mention offering a free base, but how that applies to the 2026 disaster projects is not confirmed in the public material. So treat high-resolution, paid imagery as the assumption here.

  - kind: bullets
    heading: What it costs
    items:
      - "The project costs are not public in the sources"
      - "Cost driver 1: high-resolution imagery, 15 cm and 30 cm, paid by area"
      - "Cost driver 2: elevation data; cheaper if aerial survey already exists"
      - "Cost driver 3: the 3D generation and rendering work"
      - "Cost driver 4: the viewing setup and the briefing sessions"
    say: Now cost. We will not invent a number. The sources do not publish the project cost, and they do not state whether free data alone would do. What we can say is where the money goes. One, the high-resolution imagery, fifteen and thirty centimetre, priced by area. Two, the elevation data, which is cheaper if an aerial survey already exists. Three, the 3D generation and rendering work. Four, the viewing setup and the briefing sessions. For developing countries, the Commonwealth framework pairs with a climate finance hub, so the cost is often met through international funding rather than the agency alone.

  - kind: table
    heading: When it fits, and when it does not
    columns: [Factor, Fits, Does not fit]
    widths: [0.24, 0.38, 0.38]
    rows:
      - [Goal, Show flood risk to residents and staff, Confirm flooding house by house]
      - [Region, Places with no existing 3D map, Cities with aerial survey and 3D models]
      - [Imagery, Can source 15 cm or 30 cm imagery, Only free 10 m imagery]
      - [Accuracy, "City shape is enough", Centimetre survey accuracy needed]
    say: Finally, where it fits. It fits when the goal is to show flood or sea-level risk to residents and staff, in regions with no existing 3D map, where you can source high-resolution imagery, and where knowing the shape of the city is enough. It does not fit when you need to confirm flooding house by house, where a city already has aerial survey and 3D models, where only free ten-metre imagery is available, or where centimetre survey accuracy is required. When you propose it, three things matter. Ask first whether the client wants to show or to decide. Never call it the real city; it is a photoreal estimate. And always put the assumptions next to the video.

