# 案内役の声の一覧。台本の voice に名前を書く。書かなければ、同じ言語の中から動画ごとに選ぶ（idで決まるので再生成しても同じ声）。
# lang：ja は Style-Bert-VITS2（engine: sbv2）か VOICEVOX（engine: voicevox）、en は Piper（model に声のモデル名）。
# credit は動画末尾に自動で入る表記。random: false の声は、ランダムの選択から外す（台本で名前を指定したときだけ使う）。
#
# engine: sbv2 の声（AivisSpeech と同じ仕組み。scripts/sbv2_tts.py）
#   source  aivishub:<UUID>（https://hub.aivis-project.com の声。ACML 1.0 は商用可・表記任意）
#           hf:<repo>/<folder>/<weights>（Hugging Face）
#   style   話し方の調子（モデルにある名前。無ければ最初の調子）。style_weight で強さ
#   sdp     声の揺れ（0〜1。大きいほど抑揚が付く）。noise / noise_w も揺れ。assist は雰囲気の指示文（任意）
