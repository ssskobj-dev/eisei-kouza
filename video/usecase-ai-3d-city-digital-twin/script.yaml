# ユースケース解説動画の台本。元の記事：casebook/ai-3d-city-digital-twin.qmd
title: 衛星データとAIで3Dの街を自動生成：15cm画像で浸水を見せたトンガの防災
series: CASEBOOK
kicker: ユースケース解説
number: 65
total: 221
thumb: 浸水を3Dで見せる
summary: 衛星画像と標高データからAIで3Dの街を自動生成し、浸水や海面上昇の模擬を重ねて住民に見せる防災の事例。トンガの試行事業、ガーナの首都アクラ、2026年6月に英連邦と国連宇宙部が始めた枠組みをもとに、業務のどこに入れ、何を決める材料になるか、精度の数字が公表されていないという限界と費用のかかる所までを6分で解説します。
scenes:
  - kind: cover
    heading: 衛星データとAIで3Dの街を自動生成し、浸水を見せる
    sub: トンガとガーナの防災デジタルツイン。測量の代わりにはならない
    say: 3Dの地図がない国や島で、浸水の想定を住民に分かる形で見せる方法はあるか。答えは、衛星画像と標高データからAIで3Dの街を自動で作り、その上に水を重ねることです。国連宇宙部と英連邦が、日本企業の技術でトンガやガーナに広げています。ただし、精度の数字は公表されておらず、測量の代わりにはなりません。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。限界と費用のかかる所までを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：トンガ、ガーナ（首都アクラ）、トリニダード・トバゴ。段階は実証
      - 誰が：国連宇宙部と英連邦事務局。トンガでは国家災害リスク管理局が現地を主導
      - 技術：日本の企業が、衛星画像と標高データからAIで3Dの街を自動生成
      - 何のために：浸水や海面上昇の想定を、住民と職員に分かる形で見せる
    say: 事例の舞台は、トンガのトンガタプ島、ガーナの首都アクラ、トリニダード・トバゴです。進めているのは国連宇宙部と英連邦事務局で、トンガでは国家災害リスク管理局が現地を主導しています。技術を提供したのは日本の企業です。この会社は2021年に、衛星画像と2種類の標高データから東京の一部の3Dを実験的に作ったと発表し、2024年9月に国連宇宙部と共同事業を始めました。目的は、平面の地図では伝わりにくい浸水の想定を、3Dの街に重ねて住民や職員に見せることです。段階はどの国も実証で、日常の防災業務に組み込まれて運用されているという公表はありません。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-ai-3d-city-digital-twin/flow.svg
    caption: 浸水の想定を伝える資料づくりに入れる場合の例（仮の手順）
    say: 業務の流れを見ます。これは、防災機関を支援するコンサルタントが、浸水の想定を伝える資料づくりに入れる場合の仮の手順です。実在のサービスの手順ではありません。まず、どの地区の、どの高さの浸水を、誰に見せるかを決めます。全市の3Dを作る必要はありません。次に、高分解能の衛星画像と標高データを手配します。トンガでは15センチと30センチの画像が使われました。3つ目に、AIで3Dの街を生成します。ここは事業者に任せる部分です。4つ目に、海面上昇の値や雨の規模を防災の担当者と決めて、模擬を重ねます。最後に、排水路や堤防、避難所の位置を現地の図面で確かめ、映像は想定の1つとして示します。

  - kind: figure
    heading: 衛星とAIに任せることと、人が行うこと
    image: figures/usecase-ai-3d-city-digital-twin/split.svg
    say: 役割の分担です。衛星とAIが行うのは、高分解能の画像と標高データから、建物の高さ、土地の被覆、表面の材質を推定し、写実的な3Dの街を作ることまでです。トンガでは、NeRFやガウシアン・スプラッティングと呼ばれるAIの手法で街の形を推定し、3DCGのソフトで質感を付け、ゲーム用の描画エンジンで光や影を加えています。人が行うのは、浸水や海面上昇の条件を決めて模擬を重ねること、避難経路と訓練の内容を見直すこと、測量や排水の情報で確かめることです。衛星は街の形を面で捉えるまでで、水の計算と住民への説明は人の仕事として残ります。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.5, 0.5]
    rows:
      - [3Dの街のモデル（3DCGのデータ、閲覧用の映像）, どの地区を優先して訓練や説明の対象にするか]
      - [浸水の模擬の図（浸水深0.5m以上の建物を赤で色分け）, 避難経路のどこが使えなくなるか。訓練で想定する場面]
      - [海面上昇の模擬（海岸線ごとの浸水の範囲）, 沿岸の防護や施設の配置を検討する候補の場所]
      - [3Dの映像を使った説明会の資料, 啓発の内容と、避難の呼びかけの言い方]
    say: 受け取るものと、それで決められることを整理します。3Dの街のモデルは、どの地区を優先して訓練や説明の対象にするかの材料になります。浸水の模擬の映像は、トンガでは浸水深0.5メートルに達する建物を赤で示した図が公開されています。これは、避難経路のどこが使えなくなるか、訓練でどの場面を想定するかを考える材料です。海面上昇の模擬は、沿岸の防護や施設の配置を検討する候補の場所を示します。決められるのは、どこを先に見るか、どの場面を訓練するかという優先順位と伝え方です。建物ごとの浸水の有無を確定したり、堤防や排水路の設計の根拠にしたりする用途には、精度の数字が公表されていない以上、使えません。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-ai-3d-city-digital-twin/limits.svg
    say: 限界は5つあります。1つ目、精度と検証の数字が公表されていません。建物の高さや位置の誤差、面積の一致率はなく、模擬が実際の浸水と比べられたかも書かれていません。2つ目、建物の側面と材質はAIの推定です。衛星は真上に近い向きから撮るので、壁面はそのまま写りません。見た目が写実的なことと、実物と一致していることは別の話です。3つ目、15センチと30センチという高分解能の有償画像が前提です。4つ目、浸水の模擬は見せる映像で、どの海面上昇の値を仮定したか、雨や排水を計算に入れているかは示されていません。この家は浸水する、と断定はできません。5つ目、建物の内部、地下の排水路、堤防の高さの細かな差は衛星には写らず、現地の図面や測量で補う必要があります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - この事例で使われたのは、欧州の事業者が提供した15cmと30cmの有償の光学画像
      - 無償で使える10m前後の画像で同じ品質の3Dが作れるかは、公表資料にない
      - 標高データは、航空レーザ測量のものが既にあれば、それを優先できる
      - 2021年の「基盤を無料で提供する予定」が、今の防災の事業でどう扱われているかは不明
    say: では、無償の衛星でどこまでできるでしょうか。この事例で使われたのは、欧州の事業者が提供した15センチと30センチの高分解能の光学画像で、有償です。無償で使える10メートル前後の衛星画像で同じ品質の3Dが作れるかは、公表資料に書かれていません。つまり、この使い方は高分解能の有償画像を前提にしています。一方、標高データは、航空レーザ測量のデータが既にあれば、それを優先できます。なお、2021年の発表では、デジタルツインの基盤を無料で提供する予定とされていましたが、2026年時点の防災の事業で何が無償なのかは、公表資料から確かめられません。

  - kind: table
    heading: 費用がかかる所（金額は非公開）
    columns: [項目, 中身]
    widths: [0.34, 0.66]
    rows:
      - [高分解能の衛星画像, トンガでは15cm・30cm。有償で、面積と、新規撮影か既存かで変わる]
      - [標高データ, DSMとDEMの2種類。航空レーザ測量のデータがあれば、その分は下がる]
      - [3Dの生成と描画, AIの計算、3DCGのソフト、ゲームエンジンでの描画。事業者の作業費]
      - [見せる仕組みと説明会, 映像を閲覧する環境と、説明会の運営。なくならない費用]
    say: 費用の話です。この事例の費用は公表されていません。国土交通省の調査業務の受託額も、受賞事例の資料には書かれていません。そのため、この動画では金額を出しません。費用がかかる所は4つです。1つ目、高分解能の衛星画像。有償で、面積と、新しく撮るかアーカイブを使うかで変わります。2つ目、標高データ。航空レーザ測量のデータが既にあれば、その分は下がります。3つ目、3Dの生成と描画で、事業者の作業費になります。4つ目、映像を見せる仕組みと説明会の運営で、これはなくなりません。英連邦の枠組みでは、各国が国際機関の資金を得られるよう事業の準備を支援するとされています。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.18, 0.41, 0.41]
    rows:
      - [目的, 浸水を住民・職員に伝える。訓練の場面を作る, 建物ごとの浸水の有無を確定する。設計の根拠]
      - [地域, 3Dの地図や航空写真の整備が進んでいない国や島, 航空レーザ測量と3D都市モデルが既にある都市]
      - [画像, 15cm・30cm級の高分解能の画像を手配できる, 無償の10m級の画像だけで作りたい]
      - [求める精度, 「街の形が分かる」で足りる, 測量の精度（cm単位）が要る]
      - [体制, 現地の防災機関が主導し、国際機関と組める, 事業者の映像だけで住民に断定的に伝えたい]
    say: 最後に、向き不向きです。向いているのは、浸水や海面上昇を住民や職員に伝えたい、訓練の場面を作りたいという目的で、3Dの地図や航空写真の整備が進んでいない国や島です。高分解能の画像を手配でき、街の形が分かれば足りる、現地の防災機関が主導して国際機関と組める、という条件もそろうと効きます。逆に、建物ごとの浸水の有無を確定したい、設計の根拠にしたい、無償の画像だけで作りたい、センチ単位の精度が要る、事業者の映像だけで住民に断定的に伝えたい、という場合は向きません。提案するときは、最初に顧客が見せたいのか決めたいのかを聞くこと、実物と同じ3Dと言わないこと、模擬の前提を映像と一緒に出すことが要点です。

  - kind: cta
    heading: 自分の地域で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：内閣府「第7回宇宙開発利用大賞 外務大臣賞 受賞事例（株式会社スペースデータ）」 https://www8.cao.go.jp/space/prize/seventh/04.pdf"
      - "出典：UN-SPIDER「Digital Twin for Sea Level Rise Simulation in Tonga」 https://www.un-spider.org/es/node/13461"
      - "出典：The Commonwealth「Space4Resilience」（2026年6月18日） https://thecommonwealth.org/news/space4resilience-launched-strengthen-climate-response"
      - "費用：この事例の費用は公表資料に金額がないため、この動画では概算を出していません"
    say: この事例をもとに、自分の地域や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
