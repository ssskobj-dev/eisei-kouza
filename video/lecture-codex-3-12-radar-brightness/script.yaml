# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第3部 第12章「衛星データのSAR解析の入口：Sentinel-1の明るさの単位（真値とdB）と偏波（VV・VH）を確かめ、ノイズをならして水面・市街地・斜面を比べる」（learn/codex/codex-3-12-radar-brightness.qmd）
title: 衛星データのSAR解析入門：Sentinel-1の明るさでAIが誤る3点
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 16
total: 30
thumb: 平均は真値で
summary: Sentinel-1のレーダー画像で、水面、森、畑、市街地、斜面の明るさを偏波ごとに表にする「SAR解析の入口」の章。画素の値は較正の表で真値に直してから使うこと、平均は真値でとって最後にdBに直すこと、VVとVHは別の基準で見ること、斜面の明るさは土地の種類ではなく向きで決まることを、しくみから見ます。較正せずにdBにする、dBで平均する、出どころのない基準をVHに当てる、という3つの誤りを、AIが返したコードを一緒にレビューして見つけます。表と地図を手元で確かめる練習と、宿題つき。
scenes:
  - kind: cover
    heading: SAR解析の入口：明るさの単位と偏波を確かめる
    sub: 真値とdBを混ぜない。平均は真値で。斜面は向きで決まる
    say: レーダーの衛星画像で、水面や市街地や畑の明るさを比べれば、浸水の基準が作れるでしょうか。答えは、画素の値を較正の表で真値に直し、偏波を目的で選び、ノイズをならし、土地の種類ごとに真値で平均してからdBに直し、斜面の向きと水面の風を地図で確かめれば、作れる、です。ただし、レーダーの画像は、光学の画像と明るさの意味が違います。同じ土地でも、単位、偏波、斜面の向きで値が変わります。これを押さえないまま浸水の解析に進むと、暗い、イコール、水、と決めつけて、影と滑らかな舗装を浸水に数えます。この動画では、明るさを決める4つのことと、値の単位を見たあと、AIが返したコードを一緒にレビューして、3つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - レーダー画像の値の単位と偏波を確かめ、ノイズをならして、土地の種類ごとの明るさを比べられる
      - Sentinel-1の画素の値は、較正した真値と、その対数のdBの2つの書き方があり、平均は真値でとらないとずれることが分かる
      - 対数で平均する誤り、VVとVHを同じ基準で比べる誤り、斜面の明るい側を「市街地」と読む誤りを、表と地図から見つけられる
    say: この章を終えると、3つのことができるようになります。1つ目、レーダー画像の値の単位と偏波を確かめ、ノイズをならして、土地の種類ごとの明るさを比べられること。2つ目、Sentinel-1の画素の値は、そのままでは明るさではなく、較正の表で直した真値と、その対数であるdBの、2つの書き方があり、平均は真値でとらないとずれることが分かること。3つ目、AIが、dBの平均を取りました、と自信をもって対数で平均する誤り、VVとVHを同じ基準で比べる誤り、斜面の明るい側を市街地と読む誤りを、表と地図から見つけられることです。

  - kind: figure
    heading: しくみ：明るさを決める4つのこと
    image: figures/codex-3-12-radar-brightness/factors.svg
    say: まず、しくみです。レーダーの衛星は、自分で電波を出し、地面から返ってきた電波の強さを測ります。だから、雲と昼夜に関係なく撮れます。図の4枚が、明るさを決めることです。1つ目、面の滑らかさ。静かな水面のように滑らかな面では、電波が衛星と反対の向きに跳ね返るので、暗く写ります。ざらついた面は、電波をあらゆる向きに散らすので明るく、濡れているとさらに明るくなります。2つ目、角。建物は、壁と地面の角で電波を衛星に返すので、明るい点になります。風で波立った水面も、細かい波で明るく返ることがあります。3つ目、偏波。Sentinel-1はCバンド、周波数5.405ギガヘルツ、波長およそ5.55センチのレーダーで、陸上の主なモードはIW、幅250キロ、偏波はVVとVHです。偏波は、電波を縦か横の向きで出し、縦か横で受ける組み合わせです。VVは縦で出して縦で受け、VHは縦で出して横で受けます。NASAの資料では、森や作物のように体積で散らす散乱がVHの主な源で、ざらついた面や建物の角の散乱では、VVの方がVHより強いとされています。だから、同じ場所でもVVとVHの値は違います。VHは一般にVVより暗く、衛星自身のノイズの影響が出やすいです。Sentinel-1のノイズと同じ大きさの明るさは、マイナス22dB以下と仕様で決まっていて、静かな水面のVHは、このノイズの近くまで下がります。4つ目、斜面の向き。衛星に向いた側は明るく、圧縮されて写ります。これがレイオーバーです。反対側は暗く、急な斜面では電波が返らず、完全に暗くなります。これが影です。この明るさは、土地の種類ではなく、地形の向きです。標高のデータで地形の補正をしても、レイオーバーと影の場所は情報が無いので、補正した製品にはその印、マスクが付きます。

  - kind: bullets
    heading: 値の単位：真値とdB、ノイズの2種類
    items:
      - GRDの画素の値は検出した振幅。annotation/calibrationの較正の表でσ0などの真値に直す
      - 真値は0.001から1くらいの小さな数。見やすくdB（10×log10）で書く。−20dBは0.01、−10dBは0.1
      - 平均は真値でとる。0.01と0.1の平均は、真値で0.055（およそ−12.6dB）、dBで平均すると−15dB
      - 斑点（スペックル）はマルチルックやフィルタで減るが、分解能も下がる。IW GRD高分解能は画素10m、分解能およそ20m×22m
      - 熱雑音はnoise-*.xmlの表を強度から引く。負になった値は0に。暗い場所とVHで目立つ
    say: 値の単位が、この章の中心です。Sentinel-1のLevel-1 GRDは、検出してマルチルックし、地球の楕円のモデルで地上の距離に投影したデータで、画素の値は、検出した大きさ、振幅です。この値は、そのままでは明るさの単位ではありません。製品のannotation、calibrationフォルダにある較正の表で、σ0、面積あたりの明るさなどの真値に直します。真値は0.001から1くらいの小さな数で、見づらいので、対数にしたdB、10かけるlog10で書くのが普通です。マイナス20dBは真値の0.01、マイナス10dBは真値の0.1です。ここで決まりが1つあります。平均は真値でとります。ESAの較正の資料は、振幅を強度に直してから平均すると書いています。dBの平均は、真値の平均と一致しません。たとえば、真値0.01と0.1の2画素の平均は、真値では0.055、およそマイナス12.6dBですが、dBで平均するとマイナス15dBです。暗い画素が多い水面の縁ほど、dBの平均は真値の平均より低く出ます。ノイズは2種類あります。1つは斑点、スペックルで、複数の散らばった電波が干渉して生じる粒状の模様です。マルチルックや空間のフィルタで減りますが、分解能も下がります。IW GRDの高分解能は、画素の間隔が10メートルで、分解能はおよそ20メートルかける22メートル、ルック数は5かける1です。もう1つは、衛星自身の熱雑音で、annotation、calibrationのnoise、xmlにある表を、強度から引いて除きます。引いた後に負になった値は0にします。静かな海や湖のような暗い場所と、VHで目立ちます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.66]
    rows:
      - [レーダー画像で土地の種類ごとの明るさを出して, IW GRDの画素の値を、annotation/calibrationの較正の表でσ0の真値に直してから。熱雑音も引いて]
      - [dBで平均して, 真値で平均し、平均をdBに直す。表には真値とdBの両方を]
      - [一番見やすい偏波で, VVとVHの両方を別の列に。目的（面の違いならVV、植物の量の違いならVH）を書く]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。レーダー画像で土地の種類ごとの明るさを出して、とだけ頼むと、AIは画素の値をそのまま、またはdBに直してから平均します。見た目の地図は似ています。しかし表の数字は、単位が違うか、平均の取り方で数dBずれていて、後の浸水の基準に使えません。だから、IW GRDの画素の値を、annotation、calibrationの較正の表でσ0の真値に直してから、熱雑音も引いて、と頼みます。dBで平均して、ではなく、真値で平均し、平均をdBに直す。表には真値とdBの両方を。一番見やすい偏波で、ではなく、VVとVHの両方を別の列に。目的、面の違いならVV、植物の量の違いならVH、を書く。指示の7項目のうち、確かめ方には、湖の真値の平均が全部の土地の種類で最も小さいこと、工業団地が最も大きいこと、VHの平均がVVの平均より小さいこと、山の明るい側が衛星の側にあることを、標高の地図と重ねて示すこと、を入れます。手順には、製品の名前と絶対軌道番号、昇交か降交かを記録することと、レイオーバーと影の印を別の画像で出すことも書きます。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 土地の種類ごとの明るさ（誤りあり）
      dn   = read_tiff("measurement/*-vh-*.tiff")      # 偏波はVHだけ、較正の表を読んでいない
      db   = 10 * log10(dn)                             # 振幅をそのままdBに
      db_s = smooth(db, window=5)                       # dBのままならす
      for lc in landcover:
          table[lc] = mean(db_s[lc])                    # dBで平均
      water = db_s < -18                                # 基準の出どころなし、VHで−18
    highlight: [2, 3, 4, 6, 7]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。GRDの画素の値をdBに変換しました。土地の種類ごとにdBの平均を取り、水面をマイナス18dB以下で判定しました。偏波はVHを使いました。VHは地表の情報をより多く含むため、水面の検出に最適です。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、値の倍率。画素の値を較正の表で真値に直しているか。真値とdBを混ぜていないか。2、比べる条件。偏波を区別し、VVとVHを同じ基準で比べていないか。3、位置と座標。製品の名前と軌道の向きを記録しているか。4、失敗の隠れ。基準の値に出どころがあるか。まず、2行目を見てください。read、tiff、vh。VHのファイルだけを読んでいて、較正の表を読んでいません。3行目。10かけるlog10、dn。振幅を、そのままdBにしています。4行目。smooth、db。dBのままならしています。6行目。mean、db、s。dBで平均しています。7行目。db、s、小なり、マイナス18。基準の出どころが無く、VHに当てています。製品の名前も、軌道の向きも、どこにも出ていません。このコードは、動かしても止まりません。湖が暗く、工業団地が明るい、それらしい表が出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.10, 0.13, 0.31, 0.42]
    rows:
      - ["2〜3", 値の倍率, "read_tiff、10*log10(dn)。「画素の値をdBに変換しました」", "振幅をそのまま対数に。dBの形でも明るさの単位ではない。較正の表でσ0の真値に直し、熱雑音を引いてからdBに"]
      - ["4、6", 値の倍率, "smooth(db)、mean(db_s)。「dBの平均を取りました」", "dBの平均は真値の平均と一致しない。真値のままならして平均し、最後にdBに。表には真値とdBの両方を"]
      - ["7", 比べる条件, "db_s < -18、VHだけ。「VHは地表の情報をより多く含む」", "出どころのない基準をVHに。VHは暗く、水面はノイズの近く。偏波ごとに知っている湖の値で基準を決め、出どころを表に"]
    say: 判定の結果が、この表です。誤りは3つです。1つ目、2行目と3行目。画素の値、振幅を、較正の表で真値に直さずに、そのまま対数にしています。GRDの画素の値は検出した大きさで、σ0ではありません。できた数字は、dBの形をしていますが、明るさの単位ではなく、別の日の画像や別の場所と比べられません。正しくは、annotation、calibrationの表でσ0の真値に直し、noise、xmlの熱雑音を引いてから、dBに直します。2つ目、4行目と6行目。dBに直した後にならし、dBで平均しています。dBは対数なので、dBの平均は、真値の平均をdBにした値と一致しません。さっきの例のとおり、0.01と0.1の平均は、真値ではおよそマイナス12.6dB、dBで平均するとマイナス15dBです。暗い画素が多い水面の縁ほど、低く出ます。正しくは、真値のまま平均してならし、最後にdBに直します。表には、真値とdBの両方を出します。3つ目、7行目。水面はマイナス18dB以下、という基準に出どころがなく、しかもVHに当てています。VHはVVより暗く、静かな水面ではノイズの水準の近くまで下がります。VHでマイナス18dB以下なら、水面だけでなく、滑らかな舗装や乾いた裸地も入ります。正しくは、偏波ごとに、知っている湖の値を見て基準を決め、出どころを表に書きます。AIの説明の、VHは地表の情報をより多く含むため、水面の検出に最適です。NASAの資料が述べているのは、VHの主な源は植物のように体積で散らす散乱で、面での散乱はVVの方が強い、という点です。水面のような面の違いを見るなら、むしろVVの方が返りが強く、ノイズから離れています。地表の情報をより多く含む、は、出典のない言い方です。偏波の選び方は、目的と、知っている場所の値で決めます。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：表と地図を確かめる
    items:
      - 湖が、全部の土地の種類の中で最も暗いか。湖より暗い種類があれば、区画の取り違えか影。湖が暗くなければ風の日
      - 工業団地や市街地が最も明るいか。市街地より明るい場所が山にあるなら、斜面の向き
      - VHがVVより暗いか。表に真値とdBの両方があるか。VHの方が明るい種類があればファイルの取り違え
      - 山の明るい側が衛星の側を向いているか。標高の地図と重ね、レイオーバーと影の印が山の両側に出ているか
      - 表の画素の数が区画の面積と合うか。10mの画素で1haは100画素。合わなければ座標の取り違え
    say: 判定を、手元でやってみます。AIに頼んだ人なら、土地の種類ごとの表と、dBの地図を見ながら、数分でできます。まず、表を開いて、湖の行を見ます。湖が、全部の土地の種類の中で最も暗いか。湖より暗い種類があれば、区画の取り違えか、影を含んでいます。湖が暗くなければ、風で波立った日です。別の日の画像で確かめます。2つ目、工業団地や市街地の行。最も明るいか。市街地が暗いなら、建物の向きが電波の向きと合っていないか、偏波の取り違えです。市街地より明るい場所が山にあるなら、斜面の向きです。3つ目、VVの列とVHの列を見比べます。VHがVVより暗いか。表に真値とdBの両方があるか。VHがVVより明るい種類があれば、ファイルの取り違えです。真値の列がなければ、平均をどちらで取ったか、確かめられません。4つ目、dBの地図を、標高の地図と重ねます。山の明るい側が、衛星の側を向いているか。降交軌道と昇交軌道で、明るい側は逆になります。レイオーバーと影の印が、山の両側に出ているかも見ます。5つ目、表の画素の数が、区画の面積と合うか。10メートルの画素で、1ヘクタールは100画素です。数が合わなければ、座標の取り違えです。ならす前後で、湖の値の散らばりが減っているかも見ます。減っていなければ、ならしが効いていないか、dBの後にならしています。この5つを、報告の前にやります。

  - kind: figure
    heading: 暗く写るもの、明るく写るもの、と2つの例
    image: figures/codex-3-12-radar-brightness/dark-bright.svg
    say: 直したら、表と地図を目で確かめます。図の左が、暗く写るもの。静かな水面、滑らかな舗装や乾いた裸地、斜面の衛星と反対の側、つまり影、ノイズを引いて0にした画素。右が、明るく写るもの。建物の角、つまり市街地、風で波立った水面、濡れたざらついた面、斜面の衛星に向いた側。どちらも、土地の種類ではなく、面の滑らかさ、角、偏波、斜面の向きで決まります。おかしな結果の例を2つ。例1、山の東側の斜面が、工業団地と同じくらい明るく、市街地の区画に入れると平均が上がった。原因は、斜面の向きです。衛星に向いた側は明るく、圧縮されて写ります。降交軌道で東から西を見る向きなら、東向きの斜面が明るくなります。土地の種類の区画を、標高の地図と重ね、レイオーバーの印が付いた画素を、平均から除きます。例2、湖のVHの平均がマイナス24dBと出て、ノイズの水準より暗いので、データに問題があります、とAIが説明した。原因は、熱雑音を引いた後の、0の画素です。熱雑音を引いて負になった値は、0にします。真値の0はdBにできないので、処理の仕方によって、極端に小さい値や欠けた値になり、平均を引き下げます。データの問題ではなく、水面のVHがノイズの近くまで下がる、という当たり前の結果です。0の画素の数を表に出し、VHの水面の値は、ノイズの水準の近く、とだけ書きます。言えるのは、この日、この軌道、この偏波で、較正した真値の平均が、土地の種類ごとにこの値で、湖が最も暗く、市街地が最も明るい、です。言えないのは、暗い場所は全部水面、と、明るい場所は全部建物、です。土地の種類は、明るさだけでは決まりません。標高、別の偏波、別の日の画像、光学の画像と合わせて初めて言えます。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 画素より小さい対象。分解能およそ20m×22mで、建物1棟、道路1本の明るさは周りと混ざる
      - 急な山地。レイオーバーと影の画素は情報が無く、地形の補正でも戻らない
      - 風の強い日の水面と、雨の直後の畑。水面が明るく、畑が濡れて明るくなる。日付を選び直す
      - 偏波を1つしか持たない製品。製品の名前の偏波の記号を確かめる
      - 有償の商用データ。波長と分解能が違い、明るさの出方が変わる。較正の方法と単位を仕様書で確かめる
    say: 向かない条件も、押さえておきます。1つ目、画素より小さい対象。IW GRDの分解能はおよそ20メートルかける22メートルで、建物1棟、道路1本の明るさは、周りと混ざります。2つ目、急な山地。レイオーバーと影の画素は情報が無く、地形の補正でも戻りません。斜面の土地の種類は、明るさで比べられません。3つ目、風の強い日の水面と、雨の直後の畑。水面が明るく、畑が濡れて明るくなり、普段の値と違います。日付を選び直します。4つ目、偏波を1つしか持たない製品。陸上はVVとVHが主ですが、場所と時期によっては、1つの偏波しかありません。製品の名前の、偏波の記号を確かめます。5つ目、有償の商用データを使うとき。考え方は同じですが、XバンドやLバンドでは波長と分解能が違い、同じ土地でも明るさの出方が変わります。較正の方法と、値の単位を、仕様書で確かめます。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 目的と、比べる土地の種類を決める。知りたいこと、区画の地図、知っている場所。出るのは区画と使う偏波の表（人）
      - 画像を1枚選び、真値に直させる。日付、軌道の向き、IW GRD、偏波。出るのは製品の名前、σ0の真値の画像、熱雑音を引いた記録（AI）
      - ノイズをならさせる。ならし方（窓の大きさかフィルタ）。出るのはならした真値の画像と、前後の湖の散らばり（AI）
      - 土地の種類ごとに真値で平均し、dBに直させる。出るのは種類×偏波の表（真値、dB、画素の数、散らばり）とdBの地図（AI）
      - 知っている場所と地形で確かめる。標高の地図、風の記録。出るのは「湖が最も暗いか」「VHがVVより暗いか」などの判定（人）
    say: 手順をまとめます。1、目的と、比べる土地の種類を決める。入れるのは、知りたいこと、比べる土地の種類の地図、知っている場所。出るのは、土地の種類ごとの区画と、使う偏波の表です。人です。2、画像を1枚選び、真値に直させる。入れるのは、日付、軌道の向き、IW GRDという製品の種類、偏波。出るのは、製品の名前、較正の表で直したσ0の真値の画像、熱雑音を引いたかどうかの記録です。AIです。3、ノイズをならさせる。入れるのは、真値の画像と、ならし方。出るのは、ならした真値の画像と、ならす前後の湖の値の散らばりです。AIです。4、土地の種類ごとに真値で平均し、dBに直させる。出るのは、土地の種類と偏波の表、真値の平均、そのdB、画素の数、散らばり、と、dBに直した地図です。AIです。5、知っている場所と、地形で確かめる。入れるのは、表と地図、標高の地図、風の記録。出るのは、湖が最も暗いか、工業団地が最も明るいか、斜面の明るい側が衛星に向いているか、VHがVVより暗いか、の判定です。人です。この5つを、浸水や変位の解析に進む前に、1枚の画像ごとにやります。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      for pol in ["vv", "vh"]:
          dn   = read_tiff(f"measurement/*-{pol}-*.tiff")
          db   = 10 * log10(dn)
          db_s = smooth(db, window=5)
          for lc in landcover:
              table[lc][pol] = mean(db_s[lc])

      AIの説明：「VVとVHをそれぞれdBに変換し、5×5の窓でならしてから、土地の
      　種類ごとにdBの平均を取りました。湖はVVで−21.5dB、VHで−27.8dBと最も暗く、
      　工業団地はVVで−3.2dB、VHで−9.5dBと最も明るく、期待どおりです」

      問い：この表を浸水の基準に使う前に、最初に疑うべきことはどれか
      A. VHがVVより暗いのは異常で、ファイルを取り違えている
      B. 較正せずにdBにし、dBのままならして平均しているので、
      　 数字は明るさの単位でなく、平均の取り方でもずれている
      C. 湖の−27.8dBはノイズの水準より暗いので、画像そのものが壊れている
      D. 工業団地が明るいのは斜面の向きのせいで、区画が間違っている
    highlight: [2, 3, 4, 6]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-1のIW GRDで、町の湖、森、畑、工業団地の明るさを偏波ごとに表にして、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。VVとVHをそれぞれdBに変換し、5かける5の窓でならしてから、土地の種類ごとにdBの平均を取りました。湖はVVでマイナス21.5dB、VHでマイナス27.8dBと最も暗く、工業団地はVVでマイナス3.2dB、VHでマイナス9.5dBと最も明るく、期待どおりです。湖が最も暗く、工業団地が最も明るいという並びは、担当者の知っている土地と合っていました。それでも、この表を浸水の基準に使う前に、最初に疑うべきことはどれでしょうか。A、VHがVVより暗いのは異常で、ファイルを取り違えている。B、画素の値を較正の表で真値に直さずにdBにし、さらにdBのままならして平均しているので、表の数字は明るさの単位ではなく、平均の取り方でもずれている。C、湖のマイナス27.8dBはSentinel-1のノイズの水準より暗いので、画像そのものが壊れている。D、工業団地が明るいのは斜面の向きのせいで、土地の種類の区画が間違っている。この動画でやった、並びが合っていることと数字が正しいことは別、という観点を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が較正をやり直したら、AIが、水面の基準はVHでマイナス18dB以下とします、VHは地表の情報をより多く含み、水面の検出に最適です、と説明した、という場面で、問題点と頼み直すべきことを2行で書く、問2の短答も、そこにあります。

