# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第0部 第1章「役割の分担」（learn/codex/codex-0-1-roles.qmd）
title: 衛星データ解析の役割分担：AIに任せる3つ、人が決める4つ、人が確かめる3つ
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 1
total: 30
thumb: AIと人の分担
summary: コードが書けなくても、AIに書かせれば衛星データの解析は進められます。ただし、問いと条件と合格の基準を決めることと、コードと結果を確かめることは、人の仕事として残ります。AIが自信のある口調で誤る例（Sentinel-2とLandsatの波長帯の混同）を、公式の表と突き合わせて見つけるところまで、一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 役割の分担：AIに任せる、人が決める、人が確かめる
    sub: AIにコードを書かせて進める、衛星データ解析の土台
    say: コードが書けなくても、AIに書かせれば、衛星データの解析は自分で進められるでしょうか。答えは、進められます。ただし、何を知りたいかを決めることと、コードと結果を確かめることは、人の仕事として残ります。この動画では、AIに任せる3つ、人が決める4つ、人が確かめる3つの分担と、AIが自信のある口調で間違える例を、章の内容に沿って見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - AIに任せること、人が決めること、人が確かめることを分けられる
      - AIが自信のある口調で誤る箇所を、衛星の仕様を例に具体的に知る
      - 確かめる手順を先に決める型と、AIに任せてはいけない判断が分かる
    say: この章を終えると、3つのことができるようになります。衛星データの解析で、AIに任せること、人が決めること、人が確かめることを分けられること。AIが自信のある口調で誤る箇所を、衛星の仕様を例に具体的に知ること。そして、確かめる手順を先に決める型と、AIに任せてはいけない判断が分かることです。

  - kind: figure
    heading: 結論：3つの役割の分担
    image: figures/codex-0-1-roles/roles.svg
    say: 先に結論です。役割は3つに分けます。AIに任せるのは、コードを書くこと、エラーを直すこと、コードを1行ずつ説明すること。人が決めるのは、何を知りたいかという問い、どの衛星とデータを使うか、期間や範囲や雲の条件、そして何が出れば合格か。人が確かめるのは、コードが決めたとおりか、結果の値と地図がもっともらしいか、結果から何が言えて何が言えないか、です。決めることと確かめることは、AIに渡しません。

  - kind: bullets
    heading: なぜ人に残るのか
    lead: AIは、大量の文章やコードから「次に来そうな言葉」を学んだ道具です
    items:
      - よく出てくる書き方は上手。めったに出ない細部は、それらしく埋める
      - 衛星ごとに違う細かい決まりが、この「埋める」癖の落とし穴になる
      - 問いは現場にしかなく、合格の基準は業務の責任で決まる
      - AIは仕上げることはできても、頼んだ人の代わりに責任は持てない
    say: なぜ、決めることと確かめることが人に残るのでしょうか。AIチャットにコードを頼むと、もっともらしいコードが数十秒で返ってきます。AIは、大量の文章やコードから、次に来そうな言葉を学んだ道具です。だから、よく出てくる書き方は上手で、めったに出てこない細部は、それらしく埋めます。衛星データには、衛星ごとに違う細かい決まりがあります。この、それらしく埋める癖が、落とし穴になります。そして、問いは現場にしかなく、合格の基準は業務の責任で決まります。AIは、頼まれたことを仕上げることはできても、頼んだ人の代わりに責任を持つことはできません。

  - kind: table
    heading: AIが混ぜやすい衛星の決まり
    columns: [衛星, 赤, 近赤外, 画素の大きさ]
    widths: [0.28, 0.22, 0.22, 0.28]
    rows:
      - [Sentinel-2, B4（約665nm）, B8（約833nm）, どちらも10m]
      - [Landsat 8・9, Band 4, Band 5, 30m]
    say: 具体例です。光学衛星Sentinel-2の波長帯は、赤がB4で中心の波長は約665ナノメートル、近赤外がB8で約833ナノメートル、どちらも画素の大きさは10メートルです。一方、Landsat 8と9では、赤がバンド4、近赤外がバンド5で、画素は30メートルです。番号も、画素の大きさも違います。AIは、この2つの決まりを混ぜて、自信のある口調で説明することがあります。

  - kind: figure
    heading: 確かめ方を先に決める手順
    image: figures/codex-0-1-roles/flow.svg
    say: 手順は5つです。1、問い、データ、条件、合格の基準を決める。これは人の仕事で、出てくるのは、Sentinel-2のLevel-2A、2025年5月から6月、雲のない画素だけ、この区画の指数の平均、というような1枚の条件書きです。2、確かめる手順を先に書く。これも人です。水面の指数が低く出るか、波長帯の番号が仕様と合うか、という確認の一覧を、コードを見る前に書きます。3、AIにコードを書かせる。条件書きと確認の一覧を渡します。4、コードを確かめる。違えば直させて、もう一度確かめます。5、結果と、そこから言えることを確かめる。確かめる手順を先に決めるのは、後から決めると、出てきた結果に合わせて基準がゆるむからです。もっともらしい地図が出たから合格、は確認ではありません。

  - kind: prompt
    heading: AIへの頼み方：7項目
    label: 指示の例（確かめ方は、人が先に決めた一覧を渡す）
    text: |
      目的：区画ごとに植物の茂り具合を比べ、茂りの少ない区画の候補を出したい。
      場所：市の中心から東の農地。緯度と経度の範囲は別紙のとおり。
      期間：2025年5月1日〜6月30日。
      衛星と処理の段階：Sentinel-2のLevel-2A（大気の影響を補正した地表の反射率）。
      手順：雲のない画素だけを使い、赤（B4）と近赤外（B8）から植生の指数を計算し、
      　　　区画ごとに平均する。
      出力：区画の番号と平均値の表。値の分布の図。
      確かめ方：使った波長帯の番号と画素の大きさを表示する。
      　　　　　水面の区画の値が低く出ることを確認する。
      　　　　　雲のある画素を何個除いたかを表示する。
    say: AIへの指示には、目的、場所、期間、衛星と処理の段階、手順、出力、確かめ方の7項目を入れます。この章の型では、7項目のうち確かめ方を、人が先に決めた確認の一覧として渡します。例を見てください。目的は、区画ごとに植物の茂り具合を比べ、茂りの少ない区画の候補を出すこと。場所と期間を書き、衛星と処理の段階は、Sentinel-2のLevel-2A。手順は、雲のない画素だけを使い、赤のB4と近赤外のB8から植生の指数を計算して、区画ごとに平均する。出力は表と図。確かめ方は、使った波長帯の番号と画素の大きさを表示すること、水面の区画の値が低く出ることを確認すること、雲のある画素を何個除いたかを表示することです。あいまいな指示と比べてみます。衛星画像で農地の状態を調べるコードを書いて、では、AIが条件を勝手に補います。補った内容は、言われなければ見えません。雲は適当に除いて、ではなく、処理の段階に付いている分類の画像で、雲と雲の影の画素を除き、除いた数を表示させます。ここで1つ注意です。Level-2Aは雲が除かれている、とAIが言うことがありますが、補正されているのは大気の影響で、雲は残っています。雲は、付いている分類の画像で、自分で除きます。

  - kind: bullets
    heading: コードのレビュー観点3つ
    items:
      - 波長帯の番号が、使う衛星の公式資料と合っているか
      - AIが作った関数や引数が、実在するか
      - 失敗が隠れていないか。「エラーが出たら0を返す」は失敗を隠す
    say: コードを確かめるときに、この章で特に見るのは3つです。1つ目、波長帯の番号が、使う衛星の公式資料と合っているか。別の衛星の番号が混ざるのが、最もよくある誤りです。2つ目、AIが作った関数や引数が、実在するか。ありそうな名前の関数を、AIは作ります。動かなければ気づけますが、たまたま同じ名前の別の機能があると、気づけません。3つ目、失敗が隠れていないか。エラーが出たら0を返す、のような書き方は、失敗を、値が0、に変えて隠します。

  - kind: code
    heading: 一緒に：AIのコードを見る
    code: |
      # Sentinel-2 Level-2A から植生の指数を計算する
      red = read_band(scene, "B4")
      nir = read_band(scene, "B5")   # 近赤外のつもり
      index = (nir - red) / (nir + red)
    highlight: [3]
    notes:
      - 出てくる番号は B4 と B5
      - このコードは止まらずに動く
      - 人が公式の表と突き合わせる
    say: ここからは、一緒にやってみましょう。やることは1つ。AIが返したコードの波長帯の番号を、公式の表と突き合わせます。手元で数分でできます。用意するのは、AIが返したコードと説明、それから、Sentinel-2の公式の波長帯の表です。章のページの出典1、SentiWikiのS2 Missionのページにあります。手順は3つ。コードに出てくる波長帯の番号を書き出す。公式の表で、その番号の中心の波長と画素の大きさを見る。AIの説明と比べる。今回AIは、こう説明してきました。Sentinel-2の近赤外はバンド5です。赤のバンド4と組み合わせて指数を計算します。自信のある口調です。画面がそのコードです。4行で、一見正しく見えます。まず、出てくる波長帯の番号を書き出します。2行目がB4、3行目がB5です。ここで大事なことが1つ。このコードは、動かしても止まりません。B5は実在する帯なので、値が出て、地図も描けます。だから、動いたかどうかでは誤りに気づけません。人が公式の表と突き合わせるしかありません。では、公式の表を開きます。

  - kind: table
    heading: 一緒に：公式の表と比べる
    columns: [番号, 公式の表（Sentinel-2）, AIの説明, 判定]
    widths: [0.12, 0.38, 0.28, 0.22]
    rows:
      - [B4, 赤。約665nm、画素10m, 赤, 合っている]
      - [B5, レッドエッジ。約704nm、画素20m, 近赤外, 違う]
      - [B8, 近赤外。約833nm、画素10m, （出てこない）, これを使う]
    say: 公式の表で、B4、B5、B8の行を見ます。B4は赤、中心の波長は約665ナノメートル、画素は10メートル。AIの説明と合っています。B5は、近赤外ではありません。中心の波長が約704ナノメートルの、レッドエッジと呼ばれる帯で、画素は20メートルです。AIの説明と違います。近赤外として使うのはB8、約833ナノメートル、画素10メートルです。近赤外がバンド5、というのは、Landsat 8と9の決まりでした。AIは、2つの衛星の決まりを混ぜていたのです。判定が出たので、AIに、3行目をB8に直してください、と伝えます。直し方を自分で書く必要はありません。そして、波長帯の番号を公式資料のどの表で確かめたかをAIに聞き、資料のアドレスを自分で開く。これが、確かめる、ということです。

  - kind: bullets
    heading: 結果の目視レビュー3つ
    items:
      - 答えの分かっている場所の値：森が高く、水面が低く出るはず
      - 値の範囲：範囲が決まっている指数が、範囲を外れていないか
      - 除いた画素の数：雲を除いたなら何個か。0個なら処理が働いていない
      - 言えるのは「条件のもとで妥当に動いた」。現場との一致は現地確認でしか言えない
    say: コードを直したら、次は結果を目で確かめます。見るのは3つ。1つ目、答えの分かっている場所の値。水面、森、建物の密集地のように、どう出るはずかが分かる場所を先に見ます。植生の指数なら、森が高く、水面が低く出るはずです。赤と近赤外を逆に入れると、符号が反転して、森が低く、水面が高くなります。地図は色がついて、それらしく見えますが、答えの分かっている場所を見れば、すぐに気づけます。2つ目、値の範囲。3つ目、除いた画素の数。雲を除いたなら、何個除いたか。0個なら、除く処理が働いていません。雲の影が残ると、田んぼの一角に、まっすぐな帯で低い値が出ることがあります。農研機構の資料では、ある地域で2018年4月から6月の約2か月に24回の観測があり、晴天だったのは8回でした。雲と影を除かずに平均すると、生育不良に見える帯が残ります。最後に、言えることと言えないこと。この手順で言えるのは、使った条件のもとで、コードが決めたとおりに動き、答えの分かっている場所で妥当な値が出た、ことです。結果が現場の事実と一致する、とは言えません。それは、現地確認か、別の記録との照合でしか確かめられません。

  - kind: bullets
    heading: 任せてはいけない判断
    items:
      - 答えの分かっている場所がない。「それらしい」と「正しい」を区別できない
      - 合格の基準を決める人がいない。AIの出した値がそのまま基準になる
      - 判断そのものを任せたいとき。遊休農地の認定、斜面の危険の判定、支払いの決定
      - AIは判断の材料（候補、順位、値）を作る。判断は、業務の責任を持つ人が行う
    say: この型が働かない条件も、押さえておきます。1つ目、答えの分かっている場所がないとき。確かめる手がかりがないと、それらしい結果と、正しい結果を区別できません。2つ目、合格の基準を決める人がいないとき。精度は十分か、を誰も決めないまま進めると、AIの出した値がそのまま基準になります。3つ目、判断そのものを任せたいとき。この区画を遊休農地と認定する、この斜面を危険と判定する、この結果を根拠に支払いを決める。こうした、結果の外側に責任のある判断は、AIに任せてはいけません。AIは判断の材料、つまり候補、順位、値を作ります。判断は、業務の責任を持つ人が行います。これは技術の限界ではなく、責任の所在の問題です。有償の商用データを使う場合も、この分担は変わりません。変わるのは、利用条件の確認が、決めることに加わる点です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 問い、データ、条件、合格の基準を決める（人）
      - 確かめる手順を先に書く（人）。答えの分かる場所、波長帯の番号
      - AIにコードを書かせる（AI）。条件書きと確認の一覧を渡す
      - コードを確かめる（人）。公式資料と突き合わせ、違えば直させる
      - 結果と言えることを確かめる（人）。地図と数字、報告に書いてよい文
    say: 手順をまとめます。1、問い、データ、条件、合格の基準を決める。人の仕事です。2、確かめる手順を先に書く。答えの分かる場所と、波長帯の番号。これも人です。3、AIにコードを書かせる。条件書きと確認の一覧を渡します。4、コードを確かめる。公式資料と突き合わせ、違えば直させます。5、結果と、そこから言えることを確かめる。地図と数字を見て、報告に書いてよい文と、書いてはいけない文を決めます。1、2、4、5が人、3がAIです。

  - kind: bullets
    heading: 宿題：ケース問題 問1
    bold: true
    lead: ある市の担当者がAIに「Sentinel-2のLevel-2Aで、2025年5〜6月の農地の植生の指数を区画ごとに平均して」と頼み、次の説明が返ってきました
    items:
      - 「Sentinel-2の近赤外はバンド5、赤はバンド4です。どちらも30mの画素なので、そのまま計算できます」
      - 「雲はLevel-2Aで補正済みなので、除く処理は要りません」
      - 問い：このコードと説明の、最も大きな問題点はどれか（四肢択一）
      - 答えは動画では言いません。答えと解説は、サイトのケース問題で
    say: 宿題です。章のケース問題の問1を出します。ある市の担当者が、AIチャットに、Sentinel-2のLevel-2Aで、2025年5月から6月の農地の植生の指数を、区画ごとに平均して、と頼みました。AIは、コードと一緒に、こう説明してきました。Sentinel-2の近赤外はバンド5、赤はバンド4です。どちらも30メートルの画素なので、そのまま計算できます。雲はLevel-2Aで補正済みなので、除く処理は要りません。問いは、このコードと説明について、最も大きな問題点はどれか、です。選択肢は4つ。計算式の順番、波長帯の番号と画素の大きさ、平均か合計か、処理の段階。この動画でやった、公式の表との突き合わせを思い出して、選んでください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。問2の短答も、そこにあります。

  - kind: cta
    heading: 宿題を解いたら、章のページへ
    action: 役割の表、7項目の指示の例、ケース問題2問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/codex/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/codex/codex-0-1-roles.html
    credits:
      - "出典：ESA「S2 Mission」「S2 Products」「S2 Processing」SentiWiki（Sentinel-2の波長帯の中心波長と画素の大きさ、処理の段階、シーン分類）"
      - "出典：米国地質調査所（USGS）「What are the band designations for the Landsat satellites?」（Landsat 8・9のBand 4が赤、Band 5が近赤外、30m）"
      - "出典：農研機構 農村工学研究部門「Sentinel-2衛星データを用いた水田の取水開始時期の把握手法」（2019年8月。2018年4〜6月に24回の観測、うち晴天8回）"
      - "波長帯の中心波長は、2A号機の値を丸めたものです。衛星（2A、2B、2C）ごとに少し違います"
    say: この章のページには、3つの役割の表、7項目をそろえた指示の例、コードのレビュー観点、そしてケース問題2問があります。説明欄のリンクから開いて、宿題の答え合わせをしてください。ご視聴ありがとうございました。
