# ユースケース解説動画の台本。元の記事：casebook/alteration-mapping-exploration.qmd
title: 衛星データで探鉱の候補地を絞る：無償ASTERの変質帯地図、JOGMECの実務
series: CASEBOOK
kicker: ユースケース解説
number: 30
total: 221
thumb: 探鉱を衛星で絞る
summary: 資源会社や資源機関が、権益を取る前の広い範囲から有望な地区を絞るために、無償の衛星データ（ASTER）で変質帯の地図を作る事例。JOGMECの実務をもとに、業務のどこに入れ、何を決める材料になるか、2008年以降の短波長赤外が使えないという限界と費用の考え方までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで探鉱の候補地を絞る
    sub: 無償のASTERで変質帯の地図を作る、JOGMECの実務
    say: 広い範囲から、地質調査を入れる地区を先に絞る方法はあるか。答えは、無償の衛星データで、鉱床の周りにできる「変質帯」の分布を地図にすることです。日本の資源機関JOGMECは、この手法を資源探査の実務で使ってきました。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。無償のデータでどこまでできて、2026年時点で何ができないのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本の資源機関が、チリなど海外の鉱床の周りで解析
      - 誰が：資源会社、資源機関、商社の探鉱の担当者
      - 何のために：権益を取る前に、広い範囲から有望な地区を絞る
      - 困りごと：広い範囲を人が歩いて調べることはできない
    say: 事例の舞台は、資源探査です。独立行政法人の石油天然ガス・金属鉱物資源機構、JOGMECの担当者が、2012年のJAXAのワークショップで報告した手法です。使うのは、資源会社、資源機関、商社の探鉱の担当者。目的は、権益を取る前に、広い範囲から有望な地区を絞ることです。金属の鉱床を探す探鉱は、まず広い範囲を概査して地区を絞り、次に地質調査と物理探査で候補を詰め、最後にボーリングで確かめます。広い範囲を人が歩いて調べることはできないので、最初の絞り込みに衛星データを使います。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-alteration-mapping-exploration/flow.svg
    caption: 探鉱の最初の段階、地質調査の前に入れる
    say: 業務の流れを見ます。入る位置は、探鉱の最初の段階、地質調査を入れる前です。まず、対象地域の2008年4月以前のASTERの保存画像を探し、雲と雪のない場面を選びます。次に、その地域の既知の鉱床の周りで解析を試し、変質帯が知られているとおりに出るかを検証します。それから、鉄酸化物の分布、変質鉱物の分布、断層や割れ目の向きを示すリニアメントの図を作ります。変質帯が重なる地区や、構造の交点に近い地区を候補として、地質調査と物理探査の範囲を決めます。最後に、現地で露頭と試料を確かめて、図を更新します。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-alteration-mapping-exploration/split.svg
    say: 役割の分担はこうなります。衛星データの解析が行うのは、鉄酸化物と変質鉱物の分布を地図にすること、地形とリニアメントを抽出すること、そして広い範囲を一度に見ることです。探鉱の担当者が行うのは、既知の鉱床の周りで解析を検証すること、地質調査と物理探査の範囲を決めること、ボーリングで鉱化を確かめることです。変質帯の地図は「ここに変質帯がある」という情報で、「ここに鉱床がある」という情報ではありません。品位、埋蔵量、深さは、現地の調査で確かめるものです。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.5, 0.5]
    rows:
      - [鉄酸化物の分布図（バンド比）, 酸化帯の広がり。候補地区の第一候補]
      - [変質鉱物の分布図（短波長赤外の合成とバンド比）, 変質帯の種類と中心。地質調査を入れる地区]
      - [リニアメント図と地形の解析図, 構造の交点。物理探査の測線の向き]
      - [既知の鉱床での検証の結果, この地域で解析をどの程度信じるか]
      - [候補地区の優先順位と現地調査の計画, 現地調査の範囲。権益の交渉に入る地区]
    say: 受け取るデータと、それで決められることを整理します。鉄酸化物の分布図は、酸化帯の広がりと、候補地区の第一候補の根拠になります。短波長赤外から作る変質鉱物の分布図は、変質帯の種類と中心を示し、地質調査を入れる地区を決める材料になります。リニアメント図と地形の解析図は、構造の交点と、物理探査の測線の向きを決めるのに使います。既知の鉱床での検証の結果は、この地域で解析をどの程度信じてよいかの目安です。これらをまとめた候補地区の優先順位が、現地調査の範囲と、権益の交渉に入る地区を決めます。地図を受け取る側は、検証の結果と一緒に読む必要があります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-alteration-mapping-exploration/limits.svg
    say: 限界を5つ挙げます。1つ目、変質鉱物を見分ける短波長赤外のバンドは、検出器の温度の異常で、2008年4月以降の観測が使えません。復旧の試みはすべて失敗し、それ以上の対応は予定されていません。使えるのは2000年から2008年の保存画像だけで、最近の地表の変化は追えません。2つ目、希土類の鉱物や炭酸塩岩は、ASTERの波長では見分けられず、数百の細かい波長帯で観測するハイパースペクトルのデータが要ります。3つ目、JOGMECの報告は、新たに有望な変質帯を見つけることは難しいとしています。データは誰でも使えるので、衛星データだけで差がつく余地は小さいと考えるのが安全です。4つ目、植生や土壌、雪に覆われた所では、岩石の情報が届きません。5つ目、ASTERを載せたTerra衛星の運用は終わりが近く、保存画像を使う前提で計画する必要があります。

  - kind: bullets
    heading: 無償の衛星データで、どこまでできるか
    items:
      - ASTERは2016年4月1日からすべての製品が無償。295万以上の保存画像を公開
      - 分解能は、可視近赤外が15m、短波長赤外が30m、熱赤外が90m。観測幅は60km
      - 鉄酸化物は可視近赤外のバンド比、変質鉱物は短波長赤外のバンド4〜9で捉える
      - この事例は無償データで成り立つ。ただし短波長赤外は2008年4月以前の画像に限る
    say: この事例は、無償のデータで成り立つ使い方です。ASTERは、米国のTerra衛星に載った日本の経済産業省のセンサで、2016年4月1日からすべての製品が無償になり、295万以上の保存画像が公開されています。分解能は、可視近赤外が15メートル、短波長赤外が30メートル、熱赤外が90メートル、観測幅は60キロです。鉄酸化物は可視近赤外のバンド2をバンド1で割ったバンド比で、変質鉱物は短波長赤外のバンド4から9の合成やバンド比で捉えます。ただし、繰り返しになりますが、変質鉱物に使う短波長赤外は、2008年4月以前の画像に限られます。最近の変化を追う目的には、別のデータが要ります。

  - kind: table
    heading: 費用の考え方（金額は非公開）
    columns: [費用がかかる所, 考え方]
    widths: [0.3, 0.7]
    rows:
      - [データ, ASTERは2016年4月から無償。データの費用はほぼかからない]
      - [解析の人件費, 大気の補正、バンド比の計算、変質鉱物の解釈、リニアメントの抽出。費用の中心]
      - [現地の検証, 絞った地区の地質調査、試料の分析、物理探査。絞り込みの目的は、この費用を減らすこと]
      - [別のデータが要る場合, 最近の変化やハイパースペクトルが要る対象は、データの費用の考え方が変わる。見積もりで確かめる]
    say: 費用の考え方です。JOGMECの解析にかかった金額は公開されていません。この事例では、データは無償なので、費用がかかる所は3つです。1つ目は解析の人件費で、大気の補正、バンド比の計算、変質鉱物の解釈、リニアメントの抽出にかかる人の時間。ここが費用の中心です。2つ目は現地の検証で、絞った地区の地質調査、試料の分析、物理探査にかかります。絞り込みの目的は、この費用を減らすことにあります。3つ目は、最近の変化を追いたい場合や、ハイパースペクトルが要る対象で、別のデータを買う場合です。その価格はこの記事では扱っていないので、有償のデータを使うなら、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [対象の鉱床, 斑岩銅鉱床など、熱水変質を伴うもの, 希土類、リチウムなど変質帯で捉えにくいもの]
      - [地表の状態, 乾燥して岩石が露出している, 植生、土壌、雪に覆われている]
      - [検証の手がかり, 既知の鉱床があり、解析を検証できる, 既知の鉱床がなく、色の違いを解釈できない]
      - [時期, 2008年以前の地表で足りる, 最近の変化（採掘跡、新しい露頭）を追いたい]
      - [段階, 権益を取る前の広域の絞り込み, 鉱床の品位や埋蔵量の評価]
    say: 最後に、向き不向きです。向いているのは、斑岩銅鉱床のように熱水変質を伴う鉱床で、乾燥して岩石が露出した地域、そして既知の鉱床があって解析を検証できる場合です。2008年以前の地表で足りる、権益を取る前の広域の絞り込みという段階も条件です。逆に、希土類やリチウム、植生や雪に覆われた地域、既知の鉱床がない地域、最近の変化を追いたい案件、品位や埋蔵量の評価には向きません。提案するときは、最初に対象地域の植生と既知の鉱床の有無を聞くこと、「衛星で鉱床が見つかる」と言わないこと、データの時期の制約を先に伝えることが要点です。

  - kind: cta
    heading: 自分の案件で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：矢島太郎（JOGMEC 資源探査部）「鉱物資源探査における光学センサデータの活用」JAXA ALOS-3ワークショップ（2012年12月13日）"
      - "出典URL：https://www.eorc.jaxa.jp/ALOS/conf/workshop/alos2-3ws4/ALOS3_3_5_YajimaTaro.pdf"
      - "仕様：産業技術総合研究所 ASTER Science Project「Characteristics of ASTER」（2026年10月閲覧）"
      - "短波長赤外の異常：NASA Earthdata「ASTER SWIR Anomaly」（2009年1月13日公開、2025年12月17日更新）"
      - "無償化：NASA Earthdata「Japan, NASA Provide Open Access to ASTER Data」（2016年4月1日付）"
      - "費用：この事例の金額は非公開。有償データの価格はこの動画では扱っていない"
    say: この事例をもとに、自分の案件や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
