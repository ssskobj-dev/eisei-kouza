      - "Source: MAFF JASMAI overview (PDF) https://www.maff.go.jp/j/zyukyu/jki/jasmai/attach/pdf/index-1.pdf"
      - "Satellite specs: JAXA GCOM-W (AMSR2), GCOM-C (SGLI), GSMaP"
    say: To watch your own sourcing regions, or your client's, here is the next step. We help you write the request for proposal and gather competitive quotes, independent of any satellite operator or analytics company. Use the form in the description to get in touch. Thanks for watching.
