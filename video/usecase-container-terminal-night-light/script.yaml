# ユースケース解説動画の台本。元の記事：casebook/container-terminal-night-light.qmd
title: 衛星データで港の夜間稼働を見分ける：東京港8ターミナルを夜の画像1枚で判定
series: CASEBOOK
kicker: ユースケース解説
number: 93
total: 221
thumb: 夜の港を1枚で
summary: 東京大学が東京港の8つのコンテナターミナルを、分解能5.1mの夜間の衛星画像1枚で「点灯」「消灯」に分けた研究の事例。船の位置情報（AIS）では分からない夜の稼働を照明の明るさから推定する方法と、画像1枚・港1つの検証という限界、無償の夜間光では足りない理由、費用の考え方を5分で解説します。
voice: もち子
readings:
  - {from: "CE-SAT-IIB", to: "シーイーサット ツービー"}
  - {from: "AIS", to: "エーアイエス"}
  - {from: "TEU", to: "ティーイーユー"}
  - {from: "LED", to: "エルイーディー"}
  - {from: "VIIRS", to: "ビアーズ"}
  - {from: "DMSP/OLS", to: "ディーエムエスピー オーエルエス"}
  - {from: "JL1-3B", to: "ジェイエルワン スリービー"}
  - {from: "珞珈一号", to: "らっかいちごう"}
  - {from: "T1", to: "ティーワン"}
  - {from: "T4", to: "ティーフォー"}
  - {from: "T7", to: "ティーセブン"}
  - {from: "T8", to: "ティーエイト"}
  - {from: "荷役", to: "にやく"}
scenes:
  - kind: cover
    heading: 衛星データで港の夜間稼働を見分ける
    sub: 東京港の8ターミナルを、夜の画像1枚で「点灯」「消灯」に分ける
    say: 港のコンテナターミナルが夜に動いているかを、現地に聞かずに知る方法はあるか。答えは、夜の衛星画像で照明の明るさを読むことです。東京大学の研究グループは、東京港の8つのターミナルを、分解能5.1メートルの夜間画像1枚で点灯と消灯に分けました。この動画では、誰が、業務のどこに入れて、何を決める材料にするのか。無償の衛星でどこまでできて、費用はどう考えるのかまでを、5分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。東京港のコンテナターミナル8か所
      - 誰が：東京大学の研究グループ（2023年に論文を公開）
      - 何のために：船の位置情報（AIS）では分からない「夜にターミナルが動いているか」を知る
      - 困りごと：世界中のターミナルの運営者に稼働を聞いて回るのは現実的ではない
    say: 舞台は、日本の東京港です。2021年に486万TEU、20フィートのコンテナ換算で486万個を扱った国内最大のコンテナ港で、2022年12月の調査では、ターミナルや作業の種類によって、トレーラーの平均の待ち時間が30分から2時間47分と報告されています。研究したのは東京大学のグループで、2023年に論文を公開しました。なぜ衛星でしょうか。船の位置を知らせる自動識別装置、AISのデータでは、船が港にいることは分かっても、ターミナルの中で夜にコンテナを扱っているかまでは分かりません。相手は国も会社も違う世界中のターミナルで、定期的に聞いて回るわけにもいきません。そこで、夜の照明の明るさを衛星から読む、という考え方です。なお、これは研究の段階で、業務として運用されている事例ではありません。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-container-terminal-night-light/flow.svg
    caption: 荷主の物流部門や調査会社が、稼働情報を出さない港を推定する場合の例
    say: 業務に入れるなら、どんな流れになるでしょうか。これは、この動画のもとになった記事で想定した例です。まず、対象の港を選んで、ターミナルの区画を地図の上に描きます。次に、夜の高分解能画像を、港と日時を指定して発注します。画像が届いたら、区画ごとに画素の明るさの分布を出します。画素というのは画像を作る1つ1つのマス目で、この衛星では5.1メートル四方です。画像は赤、緑、青の3つの色に分けて記録されていて、この1つ1つを色の帯域、バンドと呼びます。緑と赤の帯域にしきい値を置いて、点灯と消灯を分けます。最後に、AISや運営者の情報と突き合わせて、輸送網のモデルの処理能力や、寄港先の候補に反映します。つまり、衛星の判定は結論ではなく、輸送網の計算に入れる前の材料です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-container-terminal-night-light/split.svg
    say: 役割の分担です。衛星は、夜の照明の明るさを面で捉えるのが得意です。ところが、その光が荷役の光なのかまでは分かりません。だから、荷役の確認と、輸送網モデルの設定、寄港先の判断は、人の仕事として残ります。では、研究ではどう判定したのでしょうか。使った画像は、キヤノン電子の超小型衛星CE-SAT-IIBが2021年4月6日の夜9時3分に撮った1枚です。正解のデータはこう作りました。AISで船が着いていたと分かる3つのターミナルを点灯、運営者が消灯を確かめたT1を消灯とします。次に、T1の明るさの低い方から80パーセントの位置の値、80パーセンタイルをしきい値にします。緑の帯域で3,947、赤の帯域で7,167です。残りの4つのターミナルにこれを当てはめて、画素の90パーセント以上がしきい値を超えていれば稼働、としました。結果はどうだったでしょうか。4つとも、点灯と判定されました。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [ターミナルごとの点灯・消灯の判定（表、地図）, 夜間に稼働している可能性のあるターミナル。追加で確かめる対象]
      - [区画ごとの画素の明るさの分布, しきい値をどこに置くか。判定をどこまで信じるか]
      - [点灯の判定とAISの突き合わせ結果, 輸送網モデルで、そのターミナルの夜間の処理能力をどう置くか]
      - [照明の色の違い（白色LEDか否か）, 照明の更新状況。しきい値を港ごとに変える必要があるか]
    say: 受け取ったデータで、何が決められるでしょうか。1つ目は、点灯と消灯の判定です。たとえば東京港では、8つのうち1つが消灯でした。これが分かれば、追加で確かめる相手を1か所に絞れます。2つ目は、明るさの分布です。消灯と点灯の値がどれだけ離れているかで、判定をどこまで信じてよいかが決まります。3つ目は、AISとの突き合わせで、輸送網のモデルで夜の処理能力をどう置くかに使います。もう1つ、照明の色の違いも分かります。論文では、船から照明を撮影して見比べ、白色LEDの白い光と、高圧ナトリウム灯の黄色味のある光の、色の違いが画像に表れていると報告しています。ただし、灯具の種類そのものを画像から当てたわけではありません。大事なのは、判定は「照明が点いているか」まで、ということです。荷役の有無や処理量は、AISや運営者の情報と合わせて初めて推定できます。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-container-terminal-night-light/limits.svg
    say: では、この方法の限界はどこにあるでしょうか。論文には5つがはっきり書かれています。1つ目、画像1枚、港1つの検証です。しきい値は、センサーが記録した生の数値、デジタル値で決めていて、物理的な明るさに変換する式がありません。だから、別の日や別のセンサーの画像に同じ値を使えるかは分かりません。2つ目、照明が点いていても、荷役をしているとは限りません。たとえばT7は点灯と判定されましたが、次の船が着いたのは翌日の夕方でした。隣のT8の光が映り込んだ可能性も挙げられています。3つ目、無償の夜間光では粗すぎて、ターミナルを分けられません。4つ目、1枚の範囲は3.5キロメートルかける2.3キロメートルで、定期的に夜を撮る衛星の群はまだありません。5つ目、可視光で照明を見るので、雲に覆われた夜は撮れません。これは論文ではなく、一般的な知識からの説明です。

  - kind: figure
    heading: 無償の衛星で、どこまでできるか
    image: figures/usecase-container-terminal-night-light/resolution.svg
    say: では、無償の衛星でどこまでできるでしょうか。答えは、この使い方では足りない、です。論文が挙げる夜間光の衛星は、米国のDMSP/OLSが3,000メートル、VIIRSが740メートル、中国の珞珈一号が130メートルです。東京港のターミナルを1つずつ判定できたのは5.1メートルの画像だからで、論文は130メートルでも難しいだろうとしています。一方で、CE-SAT-IIBでも街灯1本ずつは取り出せず、それができるのは0.92メートルの中国のJL1-3Bです。つまり、港の中のターミナル単位で見るなら、有償の高分解能の画像が前提になります。

  - kind: table
    heading: 費用の考え方
    columns: [かかるもの, 中身]
    widths: [0.34, 0.66]
    rows:
      - [夜間画像の調達, CE-SAT-IIBの画像は商用データ。RESTECが2022年7月5日に販売を開始。金額は非公開で、港ごと、撮影ごとにかかる]
      - [区画としきい値の設計, 区画を描き、画像ごとに明るさの分布を出す人件費。しきい値は他の画像に移せず、画像ごとに検証が要る]
      - [突き合わせの情報, AISのデータは有償のサービスが多い。運営者への聞き取りは人の時間]
      - [この研究の費用, 公開されていない。研究費はRESTECの2022年の研究助成]
    say: 費用はどう考えればよいでしょうか。この研究の費用は公開されていません。研究費はRESTECの2022年の研究助成です。かかるのは3つです。1つ目は夜間画像の調達です。CE-SAT-IIBの画像は商用データで、金額は公開されていないので、この動画では概算を出しません。2つ目は、しきい値を決める手間です。東京港の1枚でも、しきい値を決めるには運営者への聞き取りとAISの突き合わせが要りました。しきい値を他の画像に移せない現状では、これが画像ごとに繰り返されます。3つ目は、突き合わせに使うAISのデータで、有償のサービスが多いです。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [知りたいこと, 夜に照明が点いているターミナルの当たり, 荷役の有無、処理量そのもの]
      - [対象の数, 稼働情報を出さない特定の港を数か所, 世界中の港を毎晩]
      - [画像, 5m級の夜間の高分解能画像を調達できる, 無償の夜間光（数百m）だけで済ませたい]
      - [突き合わせ, AISや運営者の情報と組み合わせられる, 衛星の判定だけで決めたい]
      - [天候, 晴れた夜を選べる, 雲の多い時期に毎回必要]
    say: 最後に、向き不向きです。分かれ目は、知りたいのが「照明が点いているか」なのか、「荷役をしているか」なのか、です。T7のように、点いていても船は翌日まで来ない例がありました。照明の当たりをつけて、AISや運営者の情報と組み合わせて読むなら向いています。逆に、荷役や処理量そのものを衛星だけで決めたい、世界中の港を毎晩見たい、無償の夜間光だけで済ませたい、という場合は向きません。あなたの案件は、どちらに近いでしょうか。提案するときの要点は3つです。最初に、AISで足りない部分は何かを聞くこと。「夜間の荷役が分かる」とは言わないこと。そして、画像1枚ごとの検証費用を見積もりに入れることです。

  - kind: cta
    heading: 自分の業務で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：Murata ほか「Identifying the operational status of container terminals from high-resolution nighttime-light satellite image」"
      - "　　　Frontiers in Remote Sensing, Vol.4, 2023（CC BY） https://doi.org/10.3389/frsen.2023.1229745"
      - "衛星の仕様：RESTEC「衛星情報データベース CE-SAT-IIB」（分解能5.1m、観測範囲3.5km×2.3km、2026年11月閲覧） https://www.restec.or.jp/satellite/ce-sat-2b.html"
      - "費用：この研究の費用と画像の価格は非公開のため、概算は置いていない"
      - "作例の数字は置いていない。「たとえば」で挙げた数字（8つのうち1つが消灯、T7の翌日の着岸）は出典の論文の記述"
    say: この事例をもとに、自分の業務や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
