# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第2部 第11章「衛星データの時系列解析：Sentinel-2の1年分の植生指数を筆ごとに並べ、雲の日を除き、欠けた日をつながず、作物の暦と照らす」（learn/codex/codex-2-11-time-series.qmd）
title: 衛星データの時系列解析：Sentinel-2の1年分でAIが誤る3点を見抜く
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 15
total: 30
thumb: 空白はつながない
summary: Sentinel-2の1年分の画像から、農地の区画（筆）ごとに植生の指数の推移を並べ、作物の暦と照らす「時系列解析」の章。2機で5日ごとの撮影から雲の日を除くと残る日は偏ること、筆の縁の画素を外すこと、欠けた日を線でつながないことを、しくみから見ます。画像全体の雲の割合で日を選ぶ、縁の画素を平均に混ぜる、欠けた期間を直線で補う、という3つの誤りを、AIが返したコードを一緒にレビューして見つけます。推移のグラフと表を手元で確かめる練習と、宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 時系列解析：1年分の推移を筆ごとに並べる
    sub: 雲を日ごとに除き、縁を外し、空白はつながない
    say: 衛星の画像を1年分並べれば、田植えや刈り取りの時期は分かるでしょうか。答えは、区画を決め、日ごとに雲と影を除き、区画の中の画素だけで平均し、残った日の点を並べ、地域の作物の暦と照らせば、山と谷の時期が分かる、です。ただし、グラフの形は、雲を除く条件と、欠けた日の扱いで変わります。コードを見ずにグラフだけを信じると、雲の形を「生育」と読むことになります。この動画では、点を並べる前に決める3つのことを見たあと、AIが返したコードを一緒にレビューして、3つの誤りを見つけます。手元で数分でできる確かめ方の練習と、最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 区画（筆）ごとに1年分の植生の指数の推移を出し、雲の日の除去と、欠けた日の扱いを確かめられる
      - Sentinel-2は2機で5日ごとに撮るが、雲を除くと残る日は季節で偏り、残った点の扱いで「生育の山」の位置が変わることが分かる
      - 欠けた期間を直線でつなぐ、区画の境目の画素を平均に混ぜる、1日だけ落ちた値を「収穫」と読む、の3つの誤りを見つけられる
    say: この章を終えると、3つのことができるようになります。1つ目、農地の区画、筆ごとに1年分の植生の指数の推移を出し、雲の日の除去と、欠けた日の扱いを確かめられること。2つ目、Sentinel-2は2機で5日ごとに同じ場所を撮りますが、雲を除くと残る日は季節で大きく偏ることと、残った点をどう扱うかで、生育の山の位置が変わることが分かること。3つ目、AIが、欠けた期間は前後の値で補いました、と自信をもって直線でつなぐ誤り、区画の境目の画素を平均に混ぜる誤り、1日だけ落ちた値を収穫と読む誤りを、グラフとコードから見つけられることです。

  - kind: figure
    heading: しくみ：点を並べる前に決める3つのこと
    image: figures/codex-2-11-time-series/flow.svg
    say: まず、しくみです。植物の葉は、赤い光を吸収し、近赤外の光を強く反射します。この差を使った植生の指数、NDVIは、近赤外から赤を引き、和で割った値で、マイナス1からプラス1に収まります。同じ筆を1年にわたって撮り続け、日ごとの指数を並べると、田植えで水が入って低く、葉が茂って高く、刈り取りで再び低くなる、という山の形が出ます。この形と時期を、その地域で田植えや刈り取りが行われるおおよその時期、作物の暦と照らすのが、時系列の解析です。図の5つの手順のうち、両端の、区画を決めることと、暦と照らすことは人、間の3つは解析です。点を並べる前に、3つのことが決まっていなければなりません。1つ目、どの画素を区画に入れるか。農林水産省が公開している農地の区画の情報、筆ポリゴンを画像に重ねると、縁の画素は、隣の筆や畦道や水路と混ざります。Sentinel-2の赤と近赤外の画素は10mなので、幅が20mの筆では、縁を外すと中の画素がほとんど残りません。縁を入れるか外すか、小さい筆をどう扱うかを、先に決めます。2つ目、どの日を使うか。Sentinel-2は1機で10日ごと、2機で5日ごとに同じ場所を撮ります。1年で70枚ほどが候補ですが、雲の日は使えません。Level-2Aの分類、SCLでは、3が雲の影、8と9が雲、10が薄い雲です。雲の縁は、分類に入らないのに値が変わっていることがあるので、日ごとに、区画の中で雲と影と縁を除き、残った画素の数が少なければ、その日は使いません。3つ目、欠けた日をどう扱うか。梅雨や台風の時期は、何週間も続けて雲ということがあります。空白を前後の点で直線でつなぐと、その期間に起きた田植えや刈り取りが、つないだ線の上の、なだらかな変化になり、起きた日が分からなくなります。空白は空白のまま残し、この期間は見えていない、とグラフに書きます。雲の日を減らすには、Landsat 8と9を足す方法もあります。NASAのHLSという製品は、Landsat 8と9とSentinel-2を30mでそろえ、平均で1.6日ごとの観測にしています。ただし、2つの衛星の波長帯は同じではないので、別の衛星の点を同じグラフに混ぜるときは、どの点がどの衛星かを色で分けます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.66]
    rows:
      - [1年分の指数の推移をグラフにして, 筆ごとに、雲と影を除いた残りの画素で平均し、残った画素の数も日ごとに表に]
      - [雲の日は飛ばして, SCLの3、8、9、10を2画素分広げて除き、残った画素が5より少ない日はその筆では使わない]
      - [欠けた日は補って, 補わずに空欄のまま。グラフは点だけで線でつながず、20日を超える空白は灰色で塗る]
    say: AIへの頼み方です。表の左があいまいな頼み方、右が直した頼み方です。1年分の指数の推移をグラフにして、とだけ頼むと、AIは見やすい線のグラフを返します。点と点の間を線でつなぎ、欠けた期間は前後の値から補います。見た目は滑らかですが、梅雨の間の田植えは、その線の上では起きていません。だから、筆ごとに、雲と影を除いた残りの画素で平均し、残った画素の数も日ごとに表に、と頼みます。雲の日は飛ばして、ではなく、SCLの3、8、9、10を2画素分広げて除き、残った画素が5より少ない日は、その筆では使わない。欠けた日は補って、ではなく、補わずに空欄のまま。グラフは点だけで線でつながず、20日を超える空白は灰色で塗る。指示の7項目のうち、確かめ方には、田植えの日が分かっている筆3つで、指数が下がる時期と田植えの日が合うことを示すこと、1日だけ前後の日より0.2以上低い点を数え、その日の分類で雲か影が区画の近くにあるかを示すことを入れます。なお、2画素、5、0.2、20日は、この章で例として置いた値です。基準は、田植えの日が分かっている筆で見直します。

  - kind: code
    heading: 一緒に：抜粋を読む
    code: |
      # 筆ごとの指数の推移（誤りあり）
      dates = scenes(tile="T54SUE", year=2026, cloud_cover_lt=20)   # 画像全体の雲の割合
      for d in dates:
          ndvi = (band(d,"B8") - band(d,"B4")) / (band(d,"B8") + band(d,"B4"))
          for p in parcels:
              series[p][d] = mean(ndvi[clip(p)])        # 縁の画素も入る
      series = interpolate_linear(series)               # 欠けた日を線でつなぐ
      plot_line(series)
    highlight: [2, 6, 7, 8]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードに、この章の観点を上から当てることです。用意するのは、AIが返したコードと説明だけです。今回、AIはこう説明してきました。雲の割合が20%未満の撮影日だけを使いました。欠けた期間は前後の値から線形に補完したので、推移は途切れません。筆ポリゴンで切り出した画素の平均なので、筆ごとの値です。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、雲と影。日ごとに、区画の中で除いているか。2、欠けた値。欠けた日を補っていないか。3、面積。筆の縁の画素を外しているか。小さい筆を別に数えているか。4、比べる条件。同じ衛星、同じ処理の段階で並べているか。波長帯の番号がSentinel-2のものか。まず、2行目を見てください。cloud、cover、lt、20。画像全体の雲の割合で日を選んでいます。区画の上に雲があるかは、見ていません。次に、6行目。mean、括弧、ndvi、clip、p。筆の形で切り出した画素を、全部平均しています。縁の画素も入ります。残った画素の数も出していません。7行目。interpolate、linear。欠けた日を、前後の値から直線で補っています。8行目。plot、line。線でつないで描いています。波長帯は、B8とB4で、Sentinel-2の10mの帯です。ここは問題ありません。このコードは、動かしても止まりません。きれいな線のグラフが出ます。だから、確かめる手順を、先に決めておきます。

  - kind: table
    heading: 一緒に：判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.10, 0.13, 0.31, 0.42]
    rows:
      - ["2", 雲と影, "cloud_cover_lt=20。「雲の割合が20%未満の日だけ」", "画像全体の雲で、筆の上の雲を見ていない。日ごとにSCLで除き、縁を広げ、筆ごとに残った画素の数を数える"]
      - ["6", 面積, "mean(ndvi[clip(p)])。「筆ごとの値です」", "縁の画素が混ざる。縁を1画素外し、残った画素の数を表に。5より少ない日は使わない。小さい筆は別に数える"]
      - ["7〜8", 欠けた値, "interpolate_linear、plot_line。「推移は途切れません」", "空白の中の田植えが線に化ける。補わずに点だけで描き、空白の長さを表に。補うなら別の色で"]
    say: 判定の結果が、この表です。誤りは3つです。1つ目、2行目。日を、画像全体の雲の割合で選んでいて、区画の上の雲を見ていません。全体で雲が2割未満でも、筆の上に雲があれば、その日の値は雲の値です。雲は、指数を通常より低くします。グラフには、1日だけ落ちた点が、雲の数だけ現れます。正しくは、日ごとにSCLで雲と影を除き、縁を広げてから、筆ごとに残った画素の数を数え、少なければその日は空欄にします。2つ目、6行目。筆の形で切り出した画素を全部平均していて、縁の画素が入ります。幅が20mの筆では、画素のほとんどが縁です。正しくは、縁を1画素外し、残った画素の数を表に出し、5より少ない日は使わない、のように基準を書きます。小さい筆は、この手順では判定できない、と別に数えます。3つ目、7行目と8行目。欠けた日を前後の値から直線で補い、線でつないで描いています。6月上旬から7月中旬まで雲が続いたとき、その間の田植えは、直線の上のなだらかな下降になります。正しくは、補わずに空欄のまま点だけを描き、空白の長さを表に出します。補う処理を入れるなら、補った点を別の色で描き、補った点は測っていない、と表に書きます。AIの説明の、欠けた期間は前後の値から線形に補完したので、推移は途切れません。途切れないのは線であって、観測ではありません。空白の期間に起きたことは、どんな補い方でも分かりません。判定が出たので、AIに、何が違うかを伝えて、直させます。

  - kind: steps
    heading: 一緒に：グラフと表を確かめる
    items:
      - 田植えの日が分かっている筆で、指数が下がる時期が合うか。合わなければ日付か筆の取り違え
      - 1日だけ、前後より0.2以上落ちた点がないか。あれば、その日の分類の地図を筆の周りで見る
      - 空白の期間が、どこにどれだけあるか。1か月を超える筆は「判定できない」に入れる
      - 小さい筆ほど山が低くないか。低いなら縁の画素の混ざり。残った画素の数と見比べる
      - 使えた日の数が筆ごとに表にあるか。70枚のうち10日なら、残りの60日は「見ていない」
    say: 判定を、手元でやってみます。AIに頼んだ人なら、筆ごとのグラフと、最大と最小の日の表を見ながら、数分でできます。まず、田植えの日が分かっている筆を開きます。指数が下がる時期が、田植えの日と合うか。合わなければ、撮影日と処理日の取り違えか、筆の取り違えです。2つ目、グラフの中に、1日だけ、前後より0.2以上落ちた点がないかを見ます。前後の点は高いのに、1点だけ低いなら、分類で拾えなかった雲か影の疑いです。その日の分類の地図を、筆の周りで見ます。本当の刈り取りなら、その後の点も低いままです。3つ目、空白の期間が、どこにどれだけあるか。空白が1か月を超える筆は、その間の変化を判定できません。判定できない、の一覧に入れます。線でつないだグラフでは空白が見えないので、点のグラフで見ます。4つ目、山の高さが、筆の大きさで変わっていないか。小さい筆ほど山が低いなら、縁の画素が混ざっています。縁を外した後の画素の数と、山の高さの関係を見ます。5つ目、使えた日の数が、筆ごとに表にあるか。1年で70枚ほどの候補のうち、使えたのが10日なら、残りの60日は、見ていない、です。点の数が少ないグラフほど、形を信じられません。この5つを、報告の前にやります。

  - kind: figure
    heading: 生育に見えてしまうものと、2つの例
    image: figures/codex-2-11-time-series/traps.svg
    say: 直したら、グラフと表を目で確かめます。図の4枚が、生育に見えてしまうものです。1日だけの飛び値は、拾えなかった雲か影。直線でつないだ形は、空白の中の田植えが、なだらかな線に化けたもの。境目の画素は、畦道が混ざり、小さい筆ほど山が低くなる。別の衛星の点は、波長帯と画素の大きさが違い、段差が出る。おかしな結果の例を2つ。例1、町の全部の筆で、7月8日だけ指数が0.1まで落ち、翌週には0.7に戻っている。AIは、7月8日に一斉に刈り取られた可能性があります、と説明しました。しかし、水稲が7月に刈り取られ、1週間で0.7に戻ることはありません。原因は、7月8日の画像の薄い雲です。分類で拾えなかった薄い雲は、指数を下げます。その日の分類の地図と、区画の周りの雲を見て、7月8日の点を、全部の筆から除きます。町の全部の筆が同じ日に同じ動き、は、作物ではなく、画像の側の出来事です。例2、幅が15mの細長い筆だけ、山の高さが周りの半分で、生育が悪い候補に入った。原因は、縁の画素の混ざりです。10mの画素で幅が15mの筆は、どの画素も、畦道か隣の筆と混ざります。縁を外すと、画素が残りません。この筆は、この手順では判定できない、の一覧に移し、現地で見るか、分解能の高い有償の画像を検討します。言えるのは、この筆で、雲と影を除いて残った日の指数の平均が、この日に最大、この日に最小で、この期間は見えていない、です。言えないのは、空白の期間に何が起きたか、と、指数の山の高さから収量がいくらか、です。雲が続いた期間の田植えの日は、前後の点から、この日からこの日の間、とだけ言えます。指数は葉の茂り方の目安で、密な葉では頭打ちになります。収量や品質は、現地の計測と合わせて初めて言えます。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 筆が小さい、細長いとき。10mの画素で幅30m未満の筆は、縁を外すと画素が残らない
      - 雲の多い時期の変化を日の単位で知りたいとき。梅雨の田植えは空白に入りやすい。レーダーを別に使う
      - 同じ筆で2つの作物が混じるとき。平均の推移は2つの山が混ざり、どちらの暦とも合わない
      - 1年の点が10日分も残らないとき。LandsatやHLSで点を増やすか、「判定できない」とする
      - 有償の商用データ。撮影の日が不定期で、空白の扱いがさらに重要。角度の違いで値も変わる
    say: 向かない条件も、押さえておきます。1つ目、筆が小さい、細長いとき。10mの画素で、幅が30m未満の筆は、縁を外すと画素がほとんど残りません。判定の対象から外すか、分解能の高い画像を検討します。2つ目、雲の多い時期に起きる変化を、日の単位で知りたいとき。梅雨の田植え、台風の後の倒伏は、光学の画像では空白の期間に入りやすいです。雲に左右されないレーダーの画像を別に使います。3つ目、同じ筆で2つの作物が混じるとき。平均の推移は、2つの作物の山が混ざった形になり、どちらの暦とも合いません。4つ目、1年の点が10日分も残らないとき。山と谷の時期を決められません。LandsatやHLSを足して点を増やすか、判定できない、とします。5つ目、有償の商用データを使うとき。考え方は同じですが、撮影の日が不定期なので、空白の期間の扱いがさらに重要になります。撮影の角度が日ごとに違うと、同じ筆でも値が変わります。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 区画と暦を決める。筆の形、知りたい問い、地域の作物の暦。出るのは使う筆の一覧と、山と谷が来るはずの時期（人）
      - 1年分の画像を集め、日ごとに雲と影を除かせる。期間、区画、Level-2A、除く番号、広げる画素数。出るのは残った画素の数の表（AI）
      - 筆ごとに平均させる。縁を外す画素数と「少ない日は使わない」の基準。出るのは筆×日付の表、使わない日は空欄（AI）
      - 残った日だけを点で並べさせる。出るのは点だけのグラフと、最大・最小の日、空白の最長の表（AI）
      - 作物の暦と照らす。出るのは「合う」「合わない」「判定できない」の3つの一覧と、現地で確かめる順番（人）
    say: 手順をまとめます。1、区画と暦を決める。入れるのは、筆の形、知りたい問い、地域の作物の暦。出るのは、使う筆の一覧と、山と谷が来るはずの時期の表です。人です。2、1年分の画像を集め、日ごとに雲と影を除かせる。入れるのは、期間、区画の番号、処理の段階、除く分類の番号、雲を広げる画素数。出るのは、日付ごとの、区画の中で残った画素の数の表です。AIです。3、筆ごとに平均させる。入れるのは、縁を外す画素数と、残った画素がこの数より少ない日は使わない、の基準。出るのは、筆と日付の表で、使わなかった日は空欄です。AIです。4、残った日だけを点で並べさせる。出るのは、筆ごとの点だけのグラフと、最大の値の日、最小の値の日、空白の最長の長さの表です。AIです。5、作物の暦と照らす。出るのは、山の時期が暦と合う筆、合わない筆、空白が長くて判定できない筆の、3つの一覧と、現地で確かめる筆の順番です。人です。この5つを、1年分を並べるごとに繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      dates = scenes(tile="T54SUE", year=2026, cloud_cover_lt=20)
      for d in dates:
          ndvi = (band(d,"B8") - band(d,"B4")) / (band(d,"B8") + band(d,"B4"))
          for p in parcels:
              series[p][d] = mean(ndvi[clip(p)])
      series = interpolate_linear(series)

      AIの説明：「雲の割合が20%未満の撮影日を34日分使いました。欠けた期間は線形に
      　補完したので、推移は途切れません。7月8日に全筆で指数が0.1前後まで下がって
      　おり、一斉に刈り取られた可能性があります」
      → グラフでは、7月8日は全部の筆で0.1前後。7月3日と7月13日は0.6〜0.7

      問い：この結果から最初に疑うべきことはどれか
      A. 7月8日に町の水田が一斉に刈り取られ、1週間で再び茂った
      B. 7月8日の画像の雲か影が筆の上にかかっているのに除かれず、全筆の値を下げた
      C. 筆の縁の画素が平均に混ざっていて、7月8日だけ畦道の値が強く出た
      D. 線形の補完が7月8日の点を作ってしまった
    highlight: [1, 5, 6, 11]
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、町の120筆の水田について、2026年3月から11月の植生の指数の推移をグラフにして、と頼みました。AIが返した説明とコードの抜粋が、画面のものです。雲の割合が20%未満の撮影日を、34日分使いました。欠けた期間は前後の値から線形に補完したので、推移は途切れません。7月8日に全筆で指数が0.1前後まで下がっており、一斉に刈り取られた可能性があります。グラフを見ると、7月8日の点は全部の筆で0.1前後ですが、7月3日と7月13日の点は、0.6から0.7でした。この結果から、最初に疑うべきことはどれでしょうか。A、7月8日に町の水田が一斉に刈り取られ、1週間で再び茂った。B、7月8日の画像の雲か影が、筆の上にかかっているのに除かれておらず、全部の筆の値を下げている。C、筆の縁の画素が平均に混ざっていて、7月8日だけ畦道の値が強く出た。D、線形の補完が、7月8日の点を作ってしまった。この動画でやった、1日だけの飛び値の見方と、町の全部の筆が同じ日に同じ動き、という目視の観点を思い出して、考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。同じ担当者が雲を日ごと筆ごとに除いたら、6月5日から7月18日まで、どの筆にも使える日が無く、AIが、この期間は線形に補完し、筆Aの田植えは6月20日ごろと推定されます、と説明した、という場面で、問題点と報告に書くべきことを2行で書く、問2の短答も、そこにあります。

