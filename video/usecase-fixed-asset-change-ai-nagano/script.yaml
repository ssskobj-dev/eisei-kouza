# ユースケース解説動画の台本。元の記事：casebook/fixed-asset-change-ai-nagano.qmd
title: 衛星データとAIで家屋の異動を判読：長野市の実証で精度88.3%、修正は人
series: CASEBOOK
kicker: ユースケース解説
number: 60
total: 221
thumb: 精度88.3%の読み方
summary: 長野市と民間企業が内閣府のモデル実証で行った、衛星画像と家形図をAIで比べて固定資産税の家屋の異動候補を出す事例。検出精度88.3%は人の修正が前提という意味、業務のどこに入れ何を決める材料になるか、撮影角度や解像度の限界、費用がかかる4つの所までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データとAIで家屋の異動を判読
    sub: 長野市の実証で検出精度88.3%。人の修正が前提
    say: 固定資産税のための家屋の新築や取り壊しの調査を、航空写真の代わりに衛星データとAIでできるか。答えは、候補を出すところまではできます。ただし、人の修正が前提です。長野市と民間企業の内閣府モデル実証では、建物の異動の検出精度は88.3パーセントでした。この動画では、市町村の資産税の担当者が、業務のどこに入れて、何を決める材料にするのか。2026年時点の限界と、無償の衛星でできるかどうか、費用がどこにかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。長野市と、AI解析を行う民間企業
      - 誰が：市町村の資産税の担当課（発注）と、解析の事業者
      - 何のために：家屋の新築、増築、取り壊しを毎年つかみ、課税台帳を直す
      - 困りごと：航空写真の取得と変化の検出に費用がかかり、目視確認の負担が大きい
    say: 事例の舞台は日本の長野市です。発注する側は市町村の資産税の担当課、解析するのはAIの解析を行う民間企業です。目的は、固定資産税を課すために、家屋の新築、増築、取り壊しを毎年つかみ、課税台帳を直すことです。この調査は固定資産異動判読調査と呼ばれ、従来は航空写真を撮って、過去の写真と高さや形、色の違いを見比べ、拾った候補を職員が目視で確かめてきました。困りごとは、航空写真の取得と変化の検出に費用がかかること、目視確認の負担が大きいこと、そしてカーポートのような課税対象外のものも拾ってしまうことです。固定資産税は、市町村の税収の約41パーセント、2022年度の数字ですが、それだけ大きな財源です。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-fixed-asset-change-ai-nagano/flow.svg
    caption: 毎年の家屋調査の前段に、衛星とAIの候補出しを入れる
    say: 業務の流れを見ます。入る位置は、毎年の家屋調査の前段です。まず、過去の家形図、つまり家屋の形を描いた図のデータと、前回の画像を揃えます。家形図が紙や古い形式なら、先にデジタル化が要ります。次に、市内全域の高解像度の衛星画像を撮ります。撮影角度と季節の条件は、仕様に書きます。そして、変化検出AIで、新築、増築、取り壊しの候補を、所在地の一覧にします。ここから先は人の仕事です。職員が候補を目視で確かめて、誤検出を外し、見逃しを足します。残った候補を現地で調べ、課税対象かを判断して、課税台帳を更新します。衛星とAIは調査の代わりではなく、どこを見に行くかを絞る道具です。

  - kind: figure
    heading: 衛星とAIに任せることと、人が行うこと
    image: figures/usecase-fixed-asset-change-ai-nagano/split.svg
    say: 役割の分担はこうなります。衛星とAIが行うのは、市内全域の画像を揃えること、家形図と比べて変化の候補を拾うこと、候補の所在地を一覧にすることです。資産税課が行うのは、候補を目視で確かめて修正すること、現地調査で課税対象かを判断すること、課税台帳を更新することです。長野市の実証は、2024年8月1日から2025年3月24日まで行われ、航空写真で行っている判読の業務の効率が、衛星データと変化検出AIで上がるかを、精度の比較を通して検討しました。段階は実証です。モデル実証事業は2024年度で終わり、内閣府が2025年4月にまとめたサービス開始済みの11件の一覧に、この案件は含まれていません。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.42, 0.58]
    rows:
      - [異動候補の所在地の一覧（GISで開ける）, どの家屋を現地調査するか。調査員を何人、何日出すか]
      - [変化の種類（新築、増築、取り壊し）, 取り壊しの候補を先に確かめ、課税の取り消しを急ぐか]
      - [職員の修正の記録（誤検出、見逃し）, 翌年も同じ方法を続けるか、画像の仕様を変えるか]
      - [「変化なし」と判定された家屋の一覧, 従来の全件の目視を、どこまで省くか]
    say: 受け取るデータと、それで決められることを整理します。異動候補の所在地の一覧は、どの家屋を現地調査するか、調査員を何人、何日出すかの根拠になります。候補ごとの変化の種類が分かれば、取り壊しの候補を先に確かめて、課税の取り消しを急ぐかを決められます。職員の修正の記録、つまり誤検出と見逃しの件数は、翌年も同じ方法を続けるか、画像の仕様を変えるかの判断材料です。そして4つ目、変化なしと判定された家屋の一覧が、この使い方の効果の大きさを決めます。変化なしの判定をどこまで信じて目視を省くかは、精度88.3パーセントの内訳、見逃しがどれだけかが分からないと決められません。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-fixed-asset-change-ai-nagano/limits.svg
    say: 限界は5つです。1つ目、88.3パーセントは人の修正が前提の数字です。長野市はそう添えて公表しています。残りの1割強は見逃しか誤検出で、一覧をそのまま課税には使えません。2つ目、撮影角度で家形を誤認します。長野市は、衛星写真の撮影角度による家形の誤認識で、精度が下がったことを課題に挙げています。どの角度まで使えるかの数字は公表されていません。3つ目、建物には高い解像度が要ります。内閣府のタスクフォースの整理では、違法建築の監視について、建築物の把握には30センチ以下の高解像度が必要とされています。4つ目、課税対象かどうかは衛星では分かりません。衛星が示すのは形が変わったことまでで、床面積や用途は現地と届出で確かめます。5つ目、精度の定義と条件は公表されていません。何件の家屋で、どの衛星で、どの季節に測った数字かは分からず、他の自治体で同じ数字になるとは限りません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 国の整理では、建物の把握に30cm以下の高解像度が必要とされる
      - 無償の衛星画像は中分解能。家屋の新築や増築の形は、画素より小さい
      - この事例の資料に、使った衛星と解像度の記載はない
      - 結論：家屋の異動判読は、無償データでは成り立たない【要確認】
    say: では、無償の衛星でどこまでできるでしょうか。この事例では、答えは厳しいです。国のタスクフォースの整理では、建物の把握に30センチ以下の高解像度が必要とされています。無償で使える衛星の画像は中分解能で、家屋の新築や増築で変わる形は、画素より小さくなります。この事例の公表資料には、使った衛星と解像度の記載がありません。ですので、家屋の異動判読は無償のデータでは成り立たない、というのが記事の見方です。ただし、30センチ以下という整理は違法建築の監視についてのもので、家屋の異動判読に同じ解像度が要るとしたのは推定です。この点は要確認として記事に書いています。

  - kind: table
    heading: 費用は、どこにかかるか（金額は非公表）
    columns: [かかる所, 中身と仮定]
    widths: [0.3, 0.7]
    rows:
      - [衛星画像, "仮定：市域全体を毎年、30cm以下の高解像度で撮る。費用の中心"]
      - [AI解析, 家形図との変化検出の委託費]
      - [家形図の整備, 紙や古い形式なら、最初の年にデジタル化の費用がかかる]
      - [目視と現地調査, なくならない。人の修正が前提なので、職員の時間として残る]
      - [削減の見込み, 事業者が実証の前に見込んだ「長野市で数千万円」。実績ではない]
    say: 費用の考え方です。この実証の費用は公表されていません。この記事では、公開された画像の価格を引ける資料がなかったため、金額の概算は出さず、費用がかかる4つの所を整理します。1つ目は衛星画像です。仮定として、市域全体を毎年、30センチ以下の高解像度で撮るとすると、有償の画像になり、ここが費用の中心になります。2つ目はAIの解析、家形図との変化検出の委託費です。3つ目は家形図の整備で、紙や古い形式なら、最初の年にデジタル化の費用がかかります。4つ目は目視と現地調査で、これはなくなりません。人の修正が前提なので、職員の時間として残ります。削減額については、事業者が実証の前に、長野市で数千万円、全国に広げれば数十億円と見込んでいましたが、これは見込みであり、実証の結果として公表された数字ではありません。金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [家屋の数, 数万棟以上で、全件の目視が負担, 小さな町村。航空写真の目視で足りる]
      - [家形図, デジタルの家形図がある, 紙の図面だけ]
      - [求めるもの, 現地調査の候補の絞り込み, 課税対象かの判断、床面積の確定]
      - [画像の条件, 撮影角度と時期を仕様で決められる, 撮影角度を選べず、家形の誤認が多い]
      - [体制, 修正を記録し、翌年の精度に生かす, AIの一覧をそのまま課税に使いたい]
    say: 最後に、向き不向きです。向いているのは、家屋が数万棟以上あって全件の目視が負担になっている、デジタルの家形図がある、求めるものが現地調査の候補の絞り込みである、撮影角度と時期を仕様で決められる、修正の記録を取って翌年の精度に生かせる、という市です。逆に、小さな町村で航空写真の目視で足りる、紙の図面しかない、課税対象かの判断や床面積の確定まで求める、撮影角度を選べない、AIの一覧をそのまま課税に使いたい、という場合は向きません。提案するときの要点は3つです。最初に家形図の形式と家屋の棟数を聞くこと。精度88.3パーセントを単独で言わず、人の修正が前提とセットで言うこと。削減額は、見込みと実績を分けて示すことです。

  - kind: cta
    heading: 自分の自治体で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：長野市「内閣府モデル実証事業（固定資産異動判読調査業務の効率化）」（2025年6月4日更新）"
      - "　　　https://www.city.nagano.nagano.jp/n140600/contents/p006170.html"
      - "出典：Ridge-i プレスリリース（2024年7月4日）、SPACE CONNECT（2024年7月15日、事業者の発表の報道）"
      - "出典：内閣府「モデル実証 事業成果のご紹介」（2025年4月）、「タスクフォース 案件整理リスト」（資料1-1、2024年3月）"
      - "費用：実証の費用は非公表。記事に公開価格の引用がないため、画像代の概算は出していない"
    say: この事例をもとに、自分の自治体や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、画像の解像度や撮影角度の条件の整理と、比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
