# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第3部「自治体が衛星サービスを導入するときの仕様書」（learn/agri/agri-municipal-spec.qmd）
title: 衛星データで農地の見回りを絞る：自治体の仕様書7つの手順
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 12
total: 30
thumb: 仕様書の7手順
summary: 農地の利用状況調査や交付金の現地確認に衛星サービスを入れるとき、仕様書に何を書くか。衛星の役割を「判定」ではなく「見に行く筆の絞り込み」と位置づけ、精度は数字で保証させず区分ごとに検証させる。国の資料と自治体の公開事例から7つの手順を組み立て、悪い例の仕様書を良い例に直すところまで一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 自治体が衛星サービスを導入するときの仕様書
    sub: 農地の調査で、見に行く筆を絞るための仕様を書く
    say: 仕様書に「衛星で遊休農地を判定すること」と書いてよいでしょうか。答えは、いいえです。衛星の役割は判定ではなく、見に行く筆の絞り込みです。遊休農地のおそれがある農地は、現地で一筆ごとに調べます。この動画では、農地の利用状況調査や交付金の現地確認に衛星サービスを入れるときの仕様書を、7つの手順で組み立て、悪い例を良い例に直すところまで一緒にやってみます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 農地の調査に衛星サービスを入れるときの、仕様書の骨格を書ける
      - 衛星の役割を「見に行く筆の絞り込み」と位置づけ、制度と矛盾しない仕様にできる
      - 事業者が示す精度や削減率を、保証させるのか検証させるのかを決められる
      - 複数の制度の現地確認で、1つの解析を共用する形を書ける
      - 1年目の実証から翌年度へ、データと検証を引き継ぐ条件を書ける
    say: この章を終えると、5つのことができるようになります。農地の利用状況調査や交付金の現地確認に衛星サービスを入れるときの、仕様書の骨格を書けること。衛星の役割を、判定ではなく見に行く筆の絞り込みと位置づけ、制度の要件と矛盾しない仕様にできること。事業者が示す精度や削減率を、保証させるのか検証させるのかを決められること。複数の制度の現地確認で、1つの解析を共用する形を書けること。そして、1年目の実証から翌年度以降へ、データと検証を引き継ぐ条件を書けることです。

  - kind: figure
    heading: 仕様書を組み立てる7つの手順
    image: figures/agri-municipal-spec/flow.svg
    caption: 青は衛星の解析に関わる手順、橙は自治体が決める手順
    say: 全体の流れです。目的と制度を決める。対象範囲と区画データを決める。推定の精度の扱いを決める。成果物を決める。現地調査との接続を決める。継続年度の扱いを決める。そして、仕様書に落として見積もりの内訳を取る。この7つです。農業委員会は農地法に基づいて毎年1回、区域内のすべての農地の利用状況を調べます。中山間地域等直接支払や多面的機能支払でも、市町村は毎年度、対象の農用地を確かめます。どれも一筆ずつ見て回る作業で、時期は夏に重なります。農林水産省の資料によると、衛星画像の活用を知っていた自治体は73パーセントで、そのうち205の自治体が現地確認に活用していました。同じ資料は、衛星活用の主な目的を、全農地の判定ではなく、現地見回りを行う農地を絞り込むことだと説明しています。

  - kind: bullets
    heading: 手順1と2：目的と制度、範囲と区画データ
    lead: 制度に固有の確認項目は、画像からは読み取れません
    items:
      - 対象になる制度は複数。福島市は3つの制度で共用し、重複した確認を減らした
      - 共用するなら「どの制度のどの項目を衛星で絞り、どの項目は現地で見るか」を先に決める
      - 解析は筆ごとの区画データ（ポリゴン）がなければ始まらない。出どころと担当を決める
      - 狭小な農地、果樹園や茶畑、田の畦畔は判定が難しい
      - 「全筆を判定する」ではなく「全筆を解析し、解析できない筆は区分として返す」と書く
    say: 手順の1つ目は、目的と、使う制度を決めることです。衛星サービスの対象になる制度は、農業委員会の利用状況調査だけではありません。中山間地域等直接支払、多面的機能支払、水田活用の直接支払なども挙げられています。福島市は、3つの制度で衛星サービスを共同で導入し、同じ農地の重複した確認を減らしました。ただし、制度ごとに固有の確認項目があります。農林水産省の令和4年度の実証では、農地かどうかや水稲の判定はできた一方、日本型直接支払や農業共済に固有の確認項目は、画像からは読み取れないとされました。共用するなら、どの制度のどの項目を衛星で絞り、どの項目は現地で見るかを、課をまたいで先に決めます。手順の2つ目は、対象範囲と区画データです。衛星の解析は、筆ごとの区画データがなければ始まりません。eMAFF農地ナビの農地ポリゴンを台帳にひも付ける方法が案内されています。範囲の中には、判定しにくい農地が混ざります。狭小な農地、果樹園や茶畑、田の畦畔の有無が、判定が難しいものとして挙げられています。だから仕様書では、全筆を判定する、とは書かず、全筆を対象に解析し、解析できない筆はその旨を区分として返す、と書きます。よくある抜けは、課ごとに別々に発注することと、区画データの整備を誰が行うかが決まっていないことです。

  - kind: figure
    heading: 手順3：推定の精度の扱いを決める
    image: figures/agri-municipal-spec/split.svg
    say: 手順の3つ目は、推定の精度の扱いです。事業者の資料には、削減率や精度の数字が並びます。農林水産省のサービス集もその数字を載せていますが、国が各サービスの効果を確認も認定もしていないと明記しています。令和4年度の実証では、正しく判別できた割合は、農地が90パーセント以上、非農地が95パーセント以上、水稲が約75から90パーセント、大豆が約50から85パーセントでした。仕様書で大事なのは、数字そのものより、何の割合かです。見回りを省く判断に効くのは、不要と判定された筆の中に、実は遊休農地だった筆がどれだけ混ざるか、つまり見逃しです。逆に、疑いありと判定された筆が現地では耕作されていた割合、空振りは、見回りの手間に効きます。精度を数字で保証させる仕様は、事業者が受けにくく、受けても検証できません。代わりに、耕作・管理されている、要確認、耕作放棄の疑い、解析対象外、といった判定の区分を決め、区分ごとに現地確認の結果と照らし合わせて、見逃しと空振りの割合を報告させます。伊万里市は本導入の後も、不要と判定された農地の数パーセントを見回って精度を確かめています。玖珠町は2年間の実証で精度を確かめました。

  - kind: table
    heading: 手順4と5：成果物と、現地調査との接続
    columns: [判定の区分, 現地で何をするか]
    widths: [0.36, 0.64]
    rows:
      - [要確認・耕作放棄の疑い, 現地で一筆ごとに判定し、写真を撮って記録する]
      - [解析対象外（狭小、果樹園など）, 現地で一筆ごとに判定する。理由は成果物に残す]
      - [耕作・管理されている, 見回りを省く。一部を抽出して確かめ、見逃しの割合を記録する]
      - [どの区分も, 筆ごとに区分、撮影日、理由を付け、台帳とGISに戻せる形式で]
    say: 手順の4つ目は、成果物です。成果物を何に流し込むか、農地台帳か、GISか、現地確認のアプリかを先に決め、それに合う形式を指定します。PDFの地図だけでは、台帳に戻せません。筆ごとに付ける情報は、判定の区分、根拠になった画像の撮影日、解析できなかった理由です。農地法の運用の通知は、衛星の画像を使うなら、調査の実施時期に撮影された、十分な解像度のものに限るとしています。撮影日が成果物にないと、この条件を満たしたことを後から示せません。帰属も書きます。自治体が渡したデータと、解析でできた筆ごとの判定を、翌年度に別の事業者でも使えるようにしておくと、事業者を替えるときの手戻りが減ります。手順の5つ目は、現地調査との接続です。区分ごとの扱いを表にします。要確認と疑いの筆、解析できない筆は、現地で一筆ごとに判定し、写真を撮ります。耕作されている筆は見回りを省きますが、一部を抽出して確かめ、見逃しの割合を記録します。現地の記録は、紙に戻さない形にします。農林水産省の現地確認アプリを使った笛吹市では、2、3日かかっていた行程が半日に短縮されました。よくある抜けは、衛星の判定と現地の判定が台帳の上で区別できないことと、省いた筆の理由が記録に残らないことです。

  - kind: bullets
    heading: 手順6と7：継続年度と、見積もりの内訳
    lead: 調査は毎年あり、画像も毎年の調査時期のものが要ります。1回買って終わりではありません
    items:
      - 1年目を実証と位置づけ、見逃しと空振りの割合を見てから2年目の運用を決める
      - 伊万里市は1年の実証を経て本導入。約4,000筆（約50%）の見回りを減らし、費用は年約50万円
      - 福島市は3つの制度で年約267万円。福山市は遊休農地と判断された調査対象が5,757haから2年で3,193haに
      - 要求水準は範囲、区分、成果物、検証、現地との接続。衛星の種類と解析の方法は事業者の提案に任せる
      - 見積もりは、区画データの整備、解析、端末やアプリ、報告書に分けて内訳を取る
    say: 手順の6つ目は、継続年度の扱いです。調査は毎年あり、画像も毎年の調査時期のものが要ります。だから衛星サービスは、1回買って終わりではなく、年ごとの運用になります。仕様書には、1年目を実証と位置づけ、見逃しと空振りの割合を見てから2年目の運用を決める、と書きます。2年目以降は、前年の現地確認の結果を事業者に渡して精度を上げること、区画データの更新、画像の撮影時期を、毎年の仕様に含めます。費用は、公開されている数字だけを挙げます。伊万里市は、1年の実証を経て本導入し、約4,000筆、およそ半分の見回りを減らし、費用は年約50万円で、推進交付金を使っています。福島市は3つの制度で年約267万円、補助金はなしです。福山市では、遊休農地と判断された調査対象が、導入前の2023年度の5,757ヘクタールから、2025年度には3,193ヘクタールに減っています。手順の7つ目は、仕様書に落とし、見積もりの内訳を取ることです。要求水準にするのは、対象範囲、判定の区分、成果物の形式と帰属、検証の方法と報告、現地調査との接続です。衛星の種類や解析の方法は、事業者の提案に任せます。見積もりは、区画データの整備、解析、現地調査の端末やアプリ、報告書に分けて内訳を取ります。内訳がないと、翌年度に、区画データの整備は済んだので安くなるはず、という交渉ができません。

  - kind: bullets
    heading: 一緒にやってみよう
    lead: 架空のC町の仕様書を、悪い例から良い例に直します
    items:
      - 案件：C町。農地約3,000筆、田と畑が中心、南部の丘陵に果樹園
      - 農業委員会の利用状況調査と、中山間地域等直接支払の現地確認で共用したい
      - 手元に用意するもの：紙1枚か文書のファイル。悪い例の4つの文を、1つずつ書き直す
      - 見る観点：精度は何の割合か、画像の時期、省く筆の扱い、成果物の形式、内訳
    say: ここからは、一緒にやってみましょう。架空のC町の仕様書を、悪い例から良い例に直します。C町は、農地が約3,000筆、田と畑が中心で、南部の丘陵に果樹園があります。農業委員会の利用状況調査と、中山間地域等直接支払の現地確認で、衛星サービスを共用したいと考えています。手元に、紙1枚か文書のファイルを用意してください。これから出す悪い例の4つの文を、1つずつ書き直していきます。見る観点は、精度は何の割合か、画像の時期、省く筆の扱い、成果物の形式、見積もりの内訳の5つです。

  - kind: prompt
    heading: 悪い例の仕様書
    label: 悪い例
    text: |
      受注者は、最新の衛星画像をAIで解析し、
      町内の遊休農地を精度95%以上で判定すること。
      判定結果は地図（PDF）で納品すること。
      判定の結果、耕作されていると判定された農地は、
      現地確認を不要とする。費用は一式とする。
    say: まず、悪い例です。受注者は、最新の衛星画像をAIで解析し、町内の遊休農地を精度95パーセント以上で判定すること。判定結果は地図のPDFで納品すること。耕作されていると判定された農地は、現地確認を不要とする。費用は一式とする。一見それらしく見えますが、問題だらけです。精度95パーセント以上は、何の割合か決まっていないので、検証できません。最新の衛星画像では、調査の実施時期に撮影されたという条件を満たすかが分かりません。現地確認を不要とする、は、省く理由と一部の抽出確認がなく、省略の判断を事業者に委ねた形です。PDFだけでは、台帳やGISに戻せません。一式では、翌年度の交渉ができません。そして、果樹園のある南部の扱いが書かれていないので、判定しにくい筆が大量に解析対象外で返ってきても、文句が言えません。

  - kind: prompt
    heading: 良い例に直す（8項目）
    label: 良い例
    text: |
      1. 対象は町内の全農地約3,000筆。町がポリゴンを貸与し、作業後のデータは町に帰属
      2. 利用状況調査と中山間の現地確認に共用。固有の項目は現地で確認
      3. 画像は調査の実施時期（8月頃）のもの。筆ごとに撮影日を記載
      4. 4区分で判定し、解析対象外には理由を付す。衛星と方法は受注者の提案
      5. 成果物はシェープファイルかGeoJSONとCSV。町のGISと端末で読める形式
      6. 要確認・疑い・対象外は町が現地で判定。耕作中の筆は一部を抽出して確認
      7. 現地判定と照らし、区分ごとの一致の割合を報告。初年度は実証
      8. 見積もりは区画データ、解析、端末、報告書に分けて内訳を示す
    say: 良い例に直します。紙に8つの項目で書いてみてください。1、対象は町内の全農地、約3,000筆。町が農地ポリゴンを貸与し、ポリゴンのない筆のひも付けは受注者の作業に含め、作業後のデータは町に帰属する。2、解析は利用状況調査と中山間地域等直接支払の現地確認に共用し、制度に固有の確認項目は現地で確認する。3、画像は調査の実施時期、8月頃に撮影されたものとし、筆ごとに撮影日を成果物に記載する。4、耕作・管理されている、要確認、耕作放棄の疑い、解析対象外の4区分で判定し、解析対象外の筆には理由を付す。衛星の種類と解析の方法は受注者の提案による。5、成果物は、区分、撮影日、理由を含むシェープファイルかGeoJSONと、同じ内容のCSVとし、町のGISと現地確認の端末で読める形式にする。6、要確認、疑い、解析対象外の筆は町が現地で一筆ごとに判定し、耕作・管理されている筆は一部を抽出して現地で確かめる。7、受注者は町の現地判定の結果と照らし、省いた筆のうち遊休農地だった割合を含む、区分ごとの一致の割合を報告する。初年度は実証と位置づけ、翌年度の運用はこの報告をもとに町が決める。8、見積もりは、区画データの整備、解析、端末やアプリ、報告書作成に分けて内訳を示す。良い例でも、衛星の種類や解析の方法は指定していません。要求水準は、判定の区分、成果物、検証、現地との接続に置いています。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 使う制度と担当する課を決め、固有の確認項目は現地で見ると書く
      - 全筆を解析し、解析できない筆は区分として返す。判定しにくい農地の扱いを先に決める
      - 精度は数字で保証させず、区分ごとに現地の結果と照らし、見逃しと空振りを報告させる
      - 成果物は台帳やGIS、現地の端末で使える形式にし、撮影日と帰属を書く
      - 区分ごとに現地で何をするかを表にし、省く筆の理由と抽出確認を書く
      - 1年目は実証と位置づけ、毎年の検証とデータの引き継ぎを仕様に入れる
      - 衛星の種類は指定せず、見積もりは区画データ、解析、端末、報告に分けて取る
    say: 手順をまとめます。1、使う制度と担当する課を決め、制度に固有の確認項目は現地で見ると書く。2、全筆を解析し、解析できない筆は区分として返す。判定しにくい農地の扱いを先に決める。3、精度は数字で保証させず、区分ごとに現地の結果と照らして、見逃しと空振りの割合を報告させる。4、成果物は、台帳やGIS、現地の端末で使える形式にし、撮影日と帰属を書く。5、区分ごとに現地で何をするかを表にし、省く筆の理由と抽出確認を書く。6、1年目は実証と位置づけ、毎年の検証とデータの引き継ぎを仕様に入れる。7、衛星の種類は指定せず、見積もりは区画データ、解析、端末、報告に分けて取る。財源が交付金の対象になるかも、早い段階で確かめます。

  - kind: bullets
    heading: 宿題：仕様書の問題点
    bold: true
    items:
      - 場面：全農地を4区分に分け、筆ごとの区分と撮影日を含むシェープファイルとCSVを町に帰属させ、「判定の精度は95%以上」と書いた仕様書の案
      - A. 4区分に「解析対象外」を入れている
      - B. 「精度95%以上」が何の割合かと、何と比べて確かめるかが書かれていない
      - C. 成果物を町に帰属させている
      - D. 撮影日を成果物に含めさせている
    say: 宿題です。ある町の農業委員会事務局が、利用状況調査に衛星サービスを入れるため、仕様書の案を作りました。受注者は、調査の実施時期に撮影された衛星画像を解析し、町内の全農地を、耕作・管理されている、要確認、耕作放棄の疑い、解析対象外の4区分に分けること。成果物は、筆ごとの区分と撮影日を含むシェープファイルとCSVとし、町に帰属する。判定の精度は95パーセント以上とすること。この仕様書の、最も大きな問題点はどれでしょうか。A、4区分に解析対象外を入れている。B、精度95パーセント以上が何の割合かと、何と比べて確かめるかが書かれていない。C、成果物を町に帰属させている。D、撮影日を成果物に含めさせている。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに2問あります。

