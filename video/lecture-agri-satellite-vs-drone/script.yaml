# 講義動画の台本。講座「衛星サービスの選び方と使いこなし（農業向け）」第3部「衛星データ、ドローン、見回りの使い分け」（learn/agri/agri-satellite-vs-drone.qmd）
title: 衛星データ・ドローン・見回りの使い分け：営農指導員の5つの観点と4つの場合分け
series: LEARN
kicker: 衛星サービスの選び方と使いこなし
number: 10
total: 30
thumb: 衛星かドローンか
summary: 農業の生育診断は、衛星データ、ドローン、見回りのどれか1つには決められません。衛星は幅290km、ドローンは1回30ha以下が目安、見回りは株ごと。面積、草丈と時期、天候、手間、費用の5つの観点で比べ、管内の規模と作物で軸にする手段を選ぶ4つの場合分けと、「衛星で順番、ドローンで細部、見回りで確定」の組み合わせ方を、一緒にやってみます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星、ドローン、見回りの使い分け
    sub: 面積、草丈、天候、手間、費用の5つで比べ、管内の規模と作物で選ぶ
    say: 農業の生育診断は、衛星データ、ドローン、人の見回りの、どれか1つに決められるでしょうか。答えは、決められません。管内の圃場の面積と作物で、軸にする手段が変わります。衛星は1回の観測で幅290キロメートルを撮り、ドローンは測量の安全基準の案で1回の飛行が30ヘクタール以下の目安、見回りは株ごとに測れますが、調べられる圃場の数に限りがあります。この動画では、5つの比べ方と、組み合わせ方を見ていきます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 圃場の面積、作物の草丈と時期、天候、手間、費用の5つで、衛星、ドローン、見回りを比べられる
      - 管内の圃場の規模と作物から、どの手段を軸にし、何を補いに使うかを決められる
      - 農家に「衛星で分かる圃場と分からない圃場」を、理由とともに説明できる
    say: この章を終えると、3つのことができるようになります。圃場の面積、作物の草丈と時期、天候、手間、費用の5つで、衛星、ドローン、見回りを比べられること。管内の圃場の規模と作物から、どの手段を軸にし、何を補いに使うかを決められること。そして、農家に、衛星で分かる圃場と分からない圃場を、理由とともに説明できることです。

  - kind: figure
    heading: 3つの手段：範囲と細かさ
    image: figures/agri-satellite-vs-drone/scale.svg
    caption: 高い所から測るほど広く、低い所から測るほど細かい
    say: 生育診断の手段は3つあります。見回りは、圃場に入り、草丈、茎数、葉色を測る従来の方法です。富山県の研究所は、人の手で測るため調べられる圃場の数に限りがあり、点での調査なので1筆全体の様子はつかみにくい、と書いています。ドローンは、空から撮った画像で、植生指数のNDVIなどを出します。好きな日に飛ばせ、低い高度で撮れば細かく見えます。ただし、国土地理院の測量の安全基準の案は、1回の運航範囲を30ヘクタール以下にすることが望ましいとしています。衛星は、決まった周期で広い範囲を同じ条件で撮ります。無償の光学衛星Sentinel-2は、10メートルの画素で幅290キロメートルを撮り、2機で5日に1回戻ってきます。管内の全圃場が1枚に入る代わりに、細かさは粗く、雲があると撮れません。どれか1つが正しいのではありません。ここから、面積、草丈と時期、天候、手間、費用の5つの観点で比べます。

  - kind: bullets
    heading: 観点1：面積
    lead: 管内の合計と枚数、そして1筆の大きさ。2つの面積を分けて考えます
    items:
      - 管内の合計が大きく、枚数が多いほど、衛星が効く
      - ドローンは100ha超を約2時間で撮れた例。圃場が点在すると効率が落ちる
      - 高度30mで約8a/分、高度100mで約89a/分。撮れる面積は約11倍違う
      - 20a未満の圃場は、衛星で欠測になる場合がある。筆の中のムラも衛星は苦手
    say: 1つ目は面積です。管内の圃場の合計と枚数、そして1筆の大きさ。この2つを分けて考えます。合計が大きく枚数が多いほど、衛星が効きます。ドローンは、農研機構の事例で、高度100メートル以上で飛ばし、100ヘクタールを超える面積を約2時間で撮れました。宮城県の試験では、高度30メートルで1分あたり約8アール、高度100メートルで約89アールと、撮れる面積が約11倍違いました。ただし、圃場が離れて点在すると効率が悪くなります。1筆の大きさは、衛星の画素との関係で効きます。Sentinel-2の画素は10メートル四方なので、小さな田では1筆に入る画素が少なくなります。青森県の収穫時期の仕組みは、20アール未満の圃場は欠測になる場合があるとしています。栃木県の現地試験では、衛星の圃場内のゾーン分けと、現地で測った生育量の間に、相関が見られませんでした。1筆の中のムラを見たいなら、ドローンか見回りです。

  - kind: bullets
    heading: 観点2：草丈と時期
    lead: 空から見る手段は、地面が見える時期と、茂りすぎた時期が苦手です
    items:
      - 6月上旬以前の水稲は植被が小さく、測定の精度が低い。水面の反射で異常値も出る
      - 移植後30日ごろのドローンの値は、生育と合う例（富山県）と合わない例（栃木県）がある
      - 7月中下旬以降は、NDVIが0.8〜0.9で飽和し、生育量の差をつかみにくい
      - 茂った時期の差は、葉色や穂の状態を見回りで確かめる
    say: 2つ目は、作物の草丈と時期です。空から見る手段は、作物が地面を覆っていないと、土や水面が混ざります。農研機構のマニュアルは、6月上旬以前は水稲の植被が小さく測定の精度が低いこと、水面の反射で異常値が出ることを注意しています。移植後30日ごろのドローンのNDVIは、栃木県の現地試験では生育量と相関がなく、富山県の試験では相関が安定して高いとされています。初期の生育を空から読めるかは、作物、品種、撮り方で変わるので、自分の管内で確かめる前提にします。逆に、茂りすぎても差が見えなくなります。宮城県の試験では、7月中下旬以降にNDVIが0.8から0.9で飽和しました。茂った時期の差は、葉色や穂の状態を見回りで確かめます。

  - kind: bullets
    heading: 観点3：天候
    lead: 光学衛星は晴れた日だけ。ドローンは風と雨、撮る時刻に制約があります
    items:
      - Sentinel-2の観測は、2018年4月8日〜6月7日の24回のうち、晴天は8回
      - 撮影時に雲があった圃場は欠測。有償の画像も、希望日に入手できない場合がある
      - ドローンは雲の下を飛べるが、耐風性は10〜15m/sが主流。撮る時刻を午前に限る例も
      - 見回りは、天候の影響が最も小さい
    say: 3つ目は天候です。光学衛星は、晴れた日にしか撮れません。農研機構の例では、2018年の4月8日から6月7日までにSentinel-2の観測が24回あり、晴天だったのは8回でした。青森県の仕組みは、撮影時に雲があった圃場は欠測と明記しています。内閣府の資料には、分解能の高い衛星画像を依頼しても、天候に左右されて希望日の画像を入手できない場合がある、という現場の声があります。ドローンは雲の下を飛べますが、風と雨に弱く、国土交通省の資料では、既存の機体の耐風性は秒速10から15メートルが主流です。千葉県の手順は、水面の反射を避けるため、午前10時から10時30分の間に撮るとしています。見回りは、天候の影響が最も小さい手段です。

  - kind: bullets
    heading: 観点4と5：手間と費用
    lead: 手間は種類が違います。費用は金額の大小ではなく、何に払うかで比べます
    items:
      - 見回り：人の時間と移動の費用。圃場の数に比例して増える
      - ドローン：操縦、バッテリー交換、画像の処理（数十GBで約2時間の例）、飛行の許可や承認
      - ドローンの機材は、そろえるだけで150万円程度の初期投資の例。委託が主流になる見込み
      - 衛星：配信サービスなら地図が届くだけで、払うのは利用料
      - 無償の衛星データは費用がかからないが、GISのソフトを使う技能が自分に要る
    say: 4つ目は手間、5つ目は費用です。見回りは、人の時間と移動の費用で、圃場の数に比例して増えます。ドローンは、飛ばす人、バッテリーの交換、撮った後の処理に手間がかかります。農研機構の事例では、広域の画像は数十ギガバイトになり、処理に約2時間かかりました。機材をそろえるだけで150万円程度の初期投資が要り、利用は事業者への委託が主流になると見込まれています。制度の手間もあります。地表から150メートル以上の上空や人口集中地区で飛ばすには、国土交通大臣の許可が要ります。ルールは変わるので、飛ばす前に国土交通省の最新の案内を確かめます。衛星は、配信サービスなら地図が届くだけで、払うのは利用料です。無償データは費用がかかりませんが、雲のない画像を選び、指標を計算する手間が自分に残ります。

  - kind: table
    heading: 比較表
    columns: [観点, 衛星, ドローン, 見回り]
    widths: [0.16, 0.28, 0.28, 0.28]
    rows:
      - [見られる範囲, 管内の全圃場が1枚に。幅290km, 1回30ha以下が目安, 歩ける範囲。圃場の数に限り]
      - [1筆の大きさ, 10mの画素。筆が20a未満だと欠測の場合, 高度で細かさを選べる, 株ごとに測れるが、点の調査]
      - [草丈と時期, 初期は精度が低い。茂ると飽和, 初期は読める例と読めない例。茂ると飽和, 時期を選ばない]
      - [天候, 晴れた日だけ。雲は欠測, 雲の下を飛べる。風と雨に弱い, 影響は最も小さい]
      - [手間, サービスなら届くだけ。無償はGISの技能, 操縦、画像処理、制度の手続き, 人の時間]
      - [費用の中身, 無償データか、利用料, 機材（150万円程度の例）と、人の時間, 人の時間と移動]
    say: ここまでを表にまとめます。衛星は、管内の全圃場が1枚に入りますが、小さな田と雲に弱い。ドローンは、高度で細かさを選べますが、1回に撮れる範囲と、風、処理の手間に限りがあります。見回りは、時期も天候も選びませんが、圃場の数に限りがあります。同じ管内でも、圃場の枚数と大きさで、順位は入れ替わります。

  - kind: figure
    heading: 条件別：軸にする手段
    image: figures/agri-satellite-vs-drone/cases.svg
    say: 条件別に、軸にする手段を4つの場合に分けます。1つ目、1筆20アール以上の水稲や小麦が、管内に数百枚ある場合。衛星を軸にします。全圃場を同じ日に見て、周りと比べて外れた圃場から見回ります。2つ目、1筆が小さく、集落ごとに点在している場合。見回りを軸にします。ドローンを飛ばすなら、まとまった一団を選びます。3つ目、生育初期の診断や、草丈の低い作物を見たい場合。衛星は後回しにし、ドローンと見回りで考えます。初期の値は、調査圃場で実測と照らしてから使います。4つ目、追肥の適期が数日しかなく、その時期に雲が多い場合。見回りの日程を先に決めておき、適期の前に晴天の画像が届いたら、順番を入れ替えます。届かなければ、予定どおり回ります。

  - kind: figure
    heading: 組み合わせ方の基本
    image: figures/agri-satellite-vs-drone/flow.svg
    caption: 広い手段で順番を付け、狭い手段で確かめる
    say: 実務では、広い手段で順番を付け、狭い手段で確かめる組み合わせが基本です。まず、衛星で管内の順番を付けます。同じ日の画像で全圃場を並べ、周りと比べて外れた圃場を拾います。出てくるのは順番であって、診断の結論ではありません。次に、ドローンで、気になる圃場の中を見ます。筆の中のムラは、ここで初めて見えます。最後に、見回りで基準の圃場を測り、判断します。調査圃場で草丈、茎数、葉色を測り、空からの値との関係を作ります。追肥の量や収穫の順番を決めるのは、圃場を見た人です。

  - kind: figure
    heading: 先に決めておく2つ
    image: figures/agri-satellite-vs-drone/split.svg
    say: 組み合わせるときに、先に決めておくことが2つあります。1つは、衛星の画像が欠けた日の扱いです。雲で欠測になった圃場を、問題なしと扱わず、見回りに回す決まりにします。もう1つは、見回りをどこまで減らすかです。衛星やドローンを足しただけでは、手間と費用が二重になります。基準の圃場の実測と、外れた圃場の確認は残し、全圃場を順に回る時間をどれだけ減らすかを、1作期の前に数字で決めます。農家に説明するときは、衛星で見ている圃場と、見回りで見ている圃場を分けて伝えます。

  - kind: steps
    heading: 一緒にやってみよう
    items:
      - 管内の圃場の一覧か地図を開き、枚数と、1筆の大きさを書く。20a以上が多いか、未満が多いか
      - 圃場がまとまっているか、集落ごとに点在しているかを書く
      - 見たい作物と時期を書く。生育の初期か、茂った時期か
      - 追肥の適期が何日あるか、その時期に雲が多いかを書く
      - 4つの場合に当てはめ、軸にする手段と補いの手段を1行で書く
    say: ここからは、一緒にやってみましょう。自分の管内を、4つの場合に当てはめます。紙1枚で、数分でできます。まず、管内の圃場の一覧か地図を開いて、枚数と、1筆の大きさを見ます。比べる目安は20アールです。20アール以上が多いか、未満が多いかを書きます。次に、圃場がまとまっているか、集落ごとに点在しているかを書きます。3つ目に、見たい作物と時期。生育の初期か、茂った時期かです。4つ目に、追肥の適期が何日あるか、その時期に雲が多いかを書きます。最後に、4つの場合に当てはめて、軸にする手段と、補いに使う手段を1行で書きます。

  - kind: prompt
    heading: 紙に書く型
    label: 記入の型
    text: |
      管内：圃場 ○枚　　1筆：20a以上が多い ／ 20a未満が多い
      並び方：まとまっている ／ 集落ごとに点在
      作物と見たい時期：○○、○月（生育の初期 ／ 茂った時期）
      追肥の適期：○日間　　その時期の雲：多い ／ 少ない

      当てはめ
      　20a以上が数百枚 → 衛星を軸に
      　小さな田が点在 → 見回りを軸に
      　生育初期、低い作物 → ドローンと見回り
      　適期が短く雲が多い → 見回りの日程を先に

      軸：○○　　補い：○○　　雲で欠けた圃場：見回りに回す
    say: 紙に、この型を書いてみてください。上の4行が、管内の様子です。真ん中が、当てはめです。20アール以上が数百枚なら、衛星を軸に。小さな田が点在するなら、見回りを軸に。生育初期や草丈の低い作物なら、ドローンと見回り。適期が短く雲が多いなら、見回りの日程を先に決めます。一番下に、軸にする手段と補いの手段、そして、雲で欠けた圃場は見回りに回す、と書きます。今日は枚数の欄が空欄でも構いません。どの数字を誰に聞けばよいかが分かることが、最初の一歩です。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 面積、草丈と時期、天候、手間、費用の5つで、3つの手段を比べる
      - 管内の規模と作物を4つの場合に当てはめ、軸にする手段を決める
      - 衛星で、管内の全圃場に順番を付ける。出てくるのは順番で、結論ではない
      - ドローンで、気になる圃場の中のムラを、まとまった一団から撮る
      - 見回りで、基準の圃場を測り、追肥や収穫を判断する
      - 雲で欠けた圃場の扱いと、見回りをどこまで減らすかを、先に決める
    say: 手順をまとめます。1、5つの観点で、3つの手段を比べる。2、管内の規模と作物を4つの場合に当てはめ、軸にする手段を決める。3、衛星で、管内の全圃場に順番を付ける。4、ドローンで、気になる圃場の中のムラを、まとまった一団から撮る。5、見回りで、基準の圃場を測り、追肥や収穫を判断する。6、雲で欠けた圃場の扱いと、見回りをどこまで減らすかを、先に決める。衛星で順番、ドローンで細部、見回りで確定、が基本です。

  - kind: bullets
    heading: 宿題：最も合う進め方
    bold: true
    items:
      - 場面：中山間の水稲地帯。1筆10〜15aが中心の約400枚が、8つの集落に分かれる。追肥前の7月上旬に全圃場を回るのが負担
      - A. 無償の衛星データで全圃場の生育マップを作り、値の低い圃場から回る
      - B. 見回りを軸にしたまま、まとまった1〜2の集落だけドローンで撮り、衛星は欠測の多さを1年記録する
      - C. 機材をそろえて、8つの集落すべてをドローンで撮る
      - D. 高解像度の商用の衛星画像を追肥前に依頼し、見回りをやめる
    say: 宿題です。場面は架空です。ある営農指導員の管内は、中山間の水稲地帯です。圃場は1筆10から15アールが中心で、約400枚が8つの集落に分かれています。追肥前の7月上旬に全圃場を回るのが毎年の負担で、無償の衛星データで順番を決められないかと考えています。最初の進め方として、最も適切なものはどれでしょうか。A、無償の衛星データで全圃場の生育マップを作り、値の低い圃場から回る。B、見回りを軸にしたまま、圃場がまとまっている1から2の集落だけドローンで撮り、衛星は欠測の多さを1年記録するにとどめる。C、機材をそろえて、8つの集落すべてをドローンで撮る。D、高解像度の商用の衛星画像を追肥前に依頼し、見回りをやめる。さきほどの型に、この場面を当てはめて考えてみてください。答えと解説は、サイトのケース問題で確かめてください。この章のケース問題は、ほかに2問あります。

  - kind: cta
    heading: 管内を当てはめたら、章のページへ
    action: 比較表の出典とケース問題3問は、章のページで
    url: ssskobj-dev.github.io/eisei-kouza/learn/agri/
    url_full: https://ssskobj-dev.github.io/eisei-kouza/learn/agri/agri-satellite-vs-drone.html
