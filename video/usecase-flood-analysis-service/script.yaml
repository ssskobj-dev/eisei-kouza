# ユースケース解説動画の台本。元の記事：casebook/flood-analysis-service.qmd
title: SAR衛星の浸水解析を保険会社が買う：損保ジャパンとICEYE、水害初動の判断
series: CASEBOOK
kicker: ユースケース解説
number: 19
total: 221
thumb: 浸水解析を買う
summary: 損害保険ジャパンが2026年9月、衛星事業者ICEYEの浸水解析サービスを水害対応に使う契約を結んだ事例。衛星データを自前で解析せず「サービスとして買う」型で、保険金支払いの初動の何が決められ、何が決められないかを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: SAR衛星の浸水解析を、保険会社が買う
    sub: 損保ジャパンとICEYEの契約から見る、水害の初動の決め方
    say: 大きな水害の直後に、どこで何件の契約者が被災したかを、連絡を待たずにつかむ方法はあるか。答えは、衛星事業者から浸水の範囲と深さの推定データを、サービスとして買うことです。損害保険ジャパンは2026年9月、フィンランドの衛星事業者ICEYEと、浸水解析サービスを水害対応に使う契約を結びました。この動画では、このデータが業務のどこに入り、何を決める材料になるのか。発表文に書かれていないことと、2026年時点の限界、無償の衛星でどこまでできるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。損害保険会社（損害保険ジャパン）
      - 相手：フィンランドの衛星事業者ICEYE（浸水解析サービスを提供）
      - 何のために：水害への対応を強め、被災した契約者を支える
      - 困りごと：契約者からの連絡を待つと、被害の全体像がそろうまでに時間がかかる
    say: 事例の舞台は日本の損害保険会社、損害保険ジャパンです。相手はフィンランドの衛星事業者ICEYEで、浸水解析サービス、フラッド・インサイツを使う契約を2026年9月7日に発表しました。目的は、水害への対応を強め、被災した契約者を支えることです。大きな水害の直後、保険会社は、どこでどれだけの契約者が被災したかを早くつかむ必要があります。全体像が分からないと、応援要員の派遣先も、事故受付の体制も、支払い準備金の規模も決められません。契約者からの連絡を待つ方法では、全体像がそろうまでに時間がかかります。

  - kind: bullets
    heading: 発表文に書かれていないこと
    items:
      - 書かれている：契約を結んだこと、サービスの名前、使う目的
      - 書かれていない：データが届くまでの時間、分解能、精度の数字
      - 書かれていない：実証か本格運用か、契約の期間や金額
      - 製品ページの説明：浸水のピークから数時間以内に提供。最中は6時間ごとに更新。建物の単位で範囲と深さを地図にする
    say: ここで、発表文を読むときの注意です。発表文に書かれているのは、契約を結んだこと、サービスの名前、使う目的の3つです。データが届くまでの時間、分解能、精度の数字は書かれていません。実証なのか本格運用なのか、契約の期間や金額も書かれていません。一方、ICEYEの保険向けの製品ページには、浸水のピークから数時間以内にデータを提供し、水害の最中は6時間ごとに範囲を更新し、建物の単位で最大の浸水範囲と深さを地図にする、とあります。ただしこれは事業者の説明で、損保ジャパンとの契約の条件ではありません。分解能や精度の数字、検証の結果も同じページにはありません。契約の発表と製品の説明は、分けて読む必要があります。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-flood-analysis-service/flow.svg
    caption: 衛星のデータが効くのは「体制を決める」工程。支払いの判断は残る
    say: 業務の流れを見ます。これは発表文と製品の説明から組み立てた想定で、実在のサービスの中身ではありません。まず平時に、契約物件の所在地データを地図に重ねられる形に整え、事業者のデータを受け取る仕組みを用意します。水害が起きたら、事業者から浸水の範囲と深さの推定データを受け取ります。それを契約物件と重ね、地区ごとの被災の見込み件数を出します。見込み件数から、応援要員の派遣先と人数、事故受付の体制、支払い準備金の初期値を決めます。最後に、契約者からの請求と現地の確認で支払いを決め、衛星の推定との当たり外れを記録します。衛星のデータが役に立つのは、主に体制を決める工程です。支払いの判断は従来どおり残ります。

  - kind: figure
    heading: 衛星事業者と保険会社の分担
    image: figures/usecase-flood-analysis-service/split.svg
    say: 役割の分担はこうなります。衛星事業者の解析が行うのは、自社の衛星で被災地を観測すること、浸水の範囲と深さを推定すること、地図データで届けることです。保険会社が行うのは、契約物件の所在地と重ねること、応援要員の派遣先と人数を決めること、そして支払いの可否を現地と書類で確かめることです。合成開口レーダ、SARを積んだ衛星は、雲や夜でも地表を観測でき、水面は画像の上で暗く写ります。この性質で浸水の範囲を推定する方法は、国の防災の手引きにも載っています。この事例の特徴は、保険会社が自前で画像を解析するのではなく、推定データをサービスとして受け取る型だということです。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [浸水の範囲（最大の広がり）。地図データ, どの地区に応援要員を送るか]
      - [建物ごとの浸水の深さの推定値, 床上の被害が多い地区。準備金の初期値]
      - [水害の最中の範囲の更新（6時間ごと）, 派遣先の追加や変更]
      - [契約物件との照合結果（自社で作る一覧）, 被災の見込み件数。連絡のない契約者への案内]
      - [推定と実績の当たり外れ（自社で記録）, 来年も同じ契約を続けるか]
    say: 受け取るデータと、それで決められることを整理します。浸水の範囲は、どの地区に応援要員を送るかの根拠になります。建物ごとの深さの推定値は、床上の被害が多い地区の見込みと、支払い準備金の初期値に使えます。水害の最中の範囲の更新は、派遣先の追加や変更に使えます。契約物件との照合結果は、被災の見込み件数と、連絡のない契約者への案内につながります。そして、推定と実績の当たり外れの記録が、来年も同じ契約を続けるかの判断材料になります。提供の形式は、製品ページでは画面とAPI、提携先のシステムとの連携が挙げられています。自社のシステムにどう取り込むかで、準備の規模が変わります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-flood-analysis-service/limits.svg
    say: 限界です。発表文と製品ページに限界の記述はないので、国の手引きと仕組みから言えることを挙げます。1つ目、都市部の浸水は判読が難しい。国土交通省とJAXAの手引きは、都市部では建物がすべて浸水しないと浸水域を抽出できず、判読が困難だとしています。高い建物の後ろ側に電波が届かないレーダシャドウも起きます。2つ目、小さな浸水は判読できない。手引きでは、判読できる規模はおおむね50メートル四方以上です。ただしこれは、だいち2号を使う手引きの数字で、ICEYEの衛星に同じ条件が当てはまるかは分かりません。3つ目、水が引く前に撮れるかは軌道次第です。4つ目、深さは推定値で、支払いの可否は別に確かめる必要があります。5つ目、精度の数字が公表されていません。導入する側が、当たり外れを自分で記録する必要があります。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-1はSAR衛星で、無償。浸水の範囲の抽出はできる
      - 観測は12日（1機あたり）の周期で決まり、水害の直後に撮れるとは限らない
      - この型の中心は「発災後すぐに届く」ことを買うこと。無償データは代わりになりにくい
      - この比較は発表文や手引きにはない。一般的な知識から言えること
    say: では、無償の衛星でどこまでできるでしょうか。欧州のSentinel-1は無償のSAR衛星で、浸水の範囲の抽出はできます。ただし、観測は1機あたり12日の周期で決まり、水害の直後に撮れるとは限りません。この事例で買っているものの中心は、発災後すぐに届くことです。だから、無償データは代わりになりにくいと考えます。なお、この無償データとの比較は、発表文や国の手引きにはなく、一般的な知識から言えることです。

  - kind: table
    heading: 費用の考え方
    columns: [費用がかかる所, 中身]
    widths: [0.34, 0.66]
    rows:
      - [サービスの利用料, 事業者との契約。金額、期間、条件は公開されていない]
      - [システムの連携, 浸水データを契約物件と重ねる仕組み。自社で作るか、提携先を使うか]
      - [所在地データの整備, 契約物件の位置を地図に落とせる状態にする。整っていなければ最初にかかる]
      - [当たり外れの記録, 支払いの実績と推定を照らす作業。人の時間として残る]
      - [概算, "仮定：公開された価格がないため、金額の概算は出さない。見積もりで確かめる"]
    say: 費用の考え方です。損保ジャパンとICEYEの契約の金額、期間、条件は公開されていません。公開された価格もないので、この動画では金額の概算は出しません。代わりに、費用がかかる所を4つに分けます。1つ目、サービスの利用料。事業者との契約で、金額は非公開です。2つ目、システムの連携。浸水データを契約物件のデータと重ねる仕組みを、自社で作るか、提携先の仕組みを使うかで変わります。3つ目、所在地データの整備。契約物件の位置を地図に落とせる状態にする費用で、整っていなければ最初にかかります。4つ目、当たり外れの記録。支払いの実績と推定を照らす作業で、人の時間として残ります。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向き不向き
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [水害の規模, 広い範囲が長い時間浸かる, 局地的で短時間、小さな浸水]
      - [場所, 田畑や住宅地が平らに広がる, 高い建物が密集する市街地]
      - [使う工程, 応援体制と準備金の初期値を決める, 支払いの可否と金額を決める]
      - [自社のデータ, 契約物件の所在地が地図に落ちている, 住所の文字列だけで位置が決まらない]
      - [体制, 推定と実績の当たり外れを記録できる, 精度の数字を事業者任せにしたい]
    say: 最後に、向き不向きです。向いているのは、広い範囲が長い時間浸かる水害で、田畑や住宅地が平らに広がる場所、応援体制と準備金の初期値を決める工程に使い、契約物件の所在地が地図に落ちていて、当たり外れを記録できる体制がある場合です。逆に、局地的で小さな浸水、高い建物が密集する市街地、支払いの可否と金額を衛星で決めたい、住所の文字列だけで位置が決まらない、精度の数字を事業者任せにしたい、という場合は向きません。提案するときの要点は3つです。最初に契約物件の所在地データの状態を聞くこと。支払いが自動になるとは言わないこと。そして、初年度は推定と実績を照らす記録の仕組みを契約に組み込み、精度の数字を自分で持つ提案にすることです。

  - kind: cta
    heading: 自社や顧客で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：ICEYE プレスリリース（損保ジャパンとの契約、2026年9月7日）"
      - "  https://www.iceye.com/newsroom/press-releases/sompo-japan-and-iceye-partner-to-accelerate-flood-claims-response-using-satellite-intelligence"
      - "出典：ICEYE \"Flood Rapid Impact\"（保険向けの製品ページ。2026年11月閲覧） https://www.iceye.com/solutions/insurance/flood-rapid-impact"
      - "出典：JAXA・国土交通省「災害時の人工衛星活用ガイドブック 水害版・浸水編」（平成30年3月）"
      - "  https://www.mlit.go.jp/river/shishin_guideline/bousai/jinkoueisei/guidebook_suigai.pdf"
      - "出典：損保ジャパン、ウェザーニューズ「HIKESHI DNA 2030 Project」 https://wxtech.weathernews.com/project/hikeshi/"
      - "費用：損保ジャパンとICEYEの契約の金額は非公開（出典1）。衛星の仕様：Copernicus SentiWiki「Sentinel-1 Mission」"
    say: この事例をもとに、自社や顧客の水害対応に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
