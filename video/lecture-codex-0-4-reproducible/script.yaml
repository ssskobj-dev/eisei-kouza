# 講義動画の台本。講座「衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる」第0部 第4章「再現できる形で残す：記録する8項目と版の固定」（learn/codex/codex-0-4-reproducible.qmd）
title: 衛星データ解析を再現する記録8項目：半年後も同じ地図を作る版の固定
series: LEARN
kicker: 衛星データ解析エンジニア 資格の教材
number: 4
total: 30
thumb: 記録の8項目
summary: AIに書かせた衛星データの解析を、半年後や後任者が同じ結果で作り直せるように残す型です。同じコードで値が変わる3つの原因（データの処理の版、道具の版、「最新の1枚」）、記録に残す8項目、報告に「AIが書き、人が何を確かめたか」を書く型を見たあと、AIが残した記録と抜粋を一緒にレビューして4つの誤りを見つけます。宿題つき。
voice: もち子
scenes:
  - kind: cover
    heading: 再現できる形で残す：記録の8項目と版の固定
    sub: 結果だけ残しても、半年後に同じ地図は作れない
    say: 去年AIに書かせた解析のコードを今年もう一度動かしたら、同じ場所の値が違っていました。どちらが正しいのでしょうか。答えは、どちらが正しいかは、記録がなければ決められない、です。結果を残すだけでは足りません。結果を出した条件を8項目で残し、版を固定し、人が何を確かめたかを報告に書きます。この動画では、値が変わる3つの原因、記録に残す8項目、報告の書き方を見たあと、AIが残した記録とコードを一緒にレビューして、4つの誤りを見つけます。最後に宿題があります。

  - kind: bullets
    heading: できるようになること
    items:
      - 使ったデータ、範囲、処理の段階と版、基準の値、道具の版、AIへの指示文を記録し、他人が同じ結果を出せる形で残せる
      - 同じコードを半年後に動かすと値が変わる理由（データの処理の版、道具の版、「最新の1枚」）を説明できる
      - 報告に「AIが書き、人が何を確かめたか」を書く型と、記録の例を使える
    say: この章を終えると、3つのことができるようになります。1つ目、使ったデータ、範囲、処理の段階と版、基準の値、道具の版、AIへの指示文を記録し、他人があとから同じ結果を出せる形で残せること。2つ目、同じコードを半年後に動かすと値が変わる理由を、データの処理の版、道具の版、最新の1枚、の3つで説明できること。3つ目、報告に、AIが書き、人が何を確かめたか、を書く型と、記録の例が手に入ることです。再現できない結果は、比べることも、引き継ぐことも、説明することもできません。

  - kind: bullets
    heading: しくみ：値が変わる3つの原因は、コードの外にある
    items:
      - データの処理の版：配る側が処理を更新し、同じ観測日の製品を作り直す
      - 道具の版：言語や部品の版が上がると、何も書かなかったときの振る舞いが変わる
      - 「最新の1枚」：動かした日に依存する指定。半年後には、別の日の画像が最新になる
    say: まず、しくみです。同じコードを同じ場所で動かしても、時間がたつと結果が変わることがあります。原因は、コードの外にあります。1つ目は、データの処理の版です。衛星のデータは、配る側が処理のやり方を更新し、同じ観測日の製品を作り直すことがあります。Sentinel-2では、処理の版04.00から、Level-2A、つまり大気の影響を補正した地表の反射率の画素の値に、波長帯ごとのずらしが加わりました。この版は、2022年1月25日に始まっています。ずらしを足してから倍率の10000で割る決まりなので、10000で割るだけのコードは、版が変わると値がずれます。処理の版は、製品の名前の中に、N0400のような形で入っています。Landsatでは、Collection 1の全データが2022年12月30日に利用できなくなり、Collection 2に置き換わりました。Collection 2では、欠けを示す値と倍率が、Collection 1と違います。2つ目は、道具の版です。コードが呼ぶ言語や部品は、版が上がると、何も書かなかったときの振る舞いが変わることがあります。コードは1文字も変わっていないのに、結果が変わります。3つ目は、最新の1枚、のような、動かした日に依存する指定です。半年後には、別の日の画像が最新です。

  - kind: figure
    heading: 記録に残す8項目
    image: figures/codex-0-4-reproducible/items.svg
    say: 記録に残すのは、この8項目です。1、製品の名前。使った製品の名前を、省略せずに全部。衛星、観測日時、処理の版、軌道、区画が名前に入っています。2、範囲。境界のファイルの名前と日付、座標の基準。3、期間。開始日と終了日で、最新、直近、とは書きません。4、処理の段階と版。Level-2Aのような段階の名前と、製品の名前に入った版の番号。5、基準の値。しきい値と、その出どころ。6、道具の版。言語と部品の名前と版の番号の一覧、それにAIの名前と使った日付。7、AIへの指示文。指示文の全文と、返ってきたコードそのもの。8、人が確かめたこと。確認の一覧と結果、そして確かめていないことです。8つとも、人が残します。

  - kind: table
    heading: 残さないと、何が起きるか
    columns: [項目, 残さないと起きること]
    widths: [0.30, 0.70]
    rows:
      - [1. 製品の名前, 「Sentinel-2、2025年夏」では、どの画像か特定できない]
      - [2. 範囲, 境界が更新されると、区画の数も面積も変わる]
      - [3. 期間, 動かした日で、使う画像が変わる]
      - [4. 処理の段階と版, 版が変わると、倍率とずらしが変わる]
      - [5. 基準の値, 「一般的な値」は、次の人が変えても気づけない]
      - [6. 道具の版, 版が上がると、同じコードで結果が変わる]
      - [7. AIへの指示文, 要約だけでは、同じコードを再び得られない]
      - [8. 人が確かめたこと, 「AIが書いた」だけでは、信じる根拠がない]
    say: 残さないと何が起きるかを、項目ごとに見ます。製品の名前がないと、Sentinel-2、2025年夏、ではどの画像か特定できません。範囲がないと、境界が更新されたとき、区画の数も面積も変わります。期間がないと、動かした日で使う画像が変わります。処理の段階と版がないと、版が変わったとき、倍率とずらしが変わります。基準の値の出どころがないと、一般的な値、は次の人が変えても気づけません。道具の版がないと、版が上がったとき、同じコードで結果が変わります。AIへの指示文が要約だけだと、同じコードを再び得られません。そして、人が確かめたことがないと、AIが書いた、だけでは信じる根拠がありません。

  - kind: steps
    heading: 手順：5つ
    items:
      - 8項目の空欄を作る（人）。解析の後ではなく、前に作る
      - コードに記録を書き出させる（AIと人）。製品の名前の一覧、ずらしと倍率、しきい値、道具の版を、結果と一緒に
      - 版を固定する（人）。次も同じ版の道具を使うと決める。データは製品の名前で同じ版を取り直せるか確かめる
      - 人が確かめたことを書く（人）。見た観点と結果、見ていない観点の表
      - 報告に添える（人）。報告の末尾に「再現のための条件」の節を置く
    say: 手順は5つです。1、8項目の空欄を作る。人の仕事です。入れるのは解析を始める前の指示文で、出るのは、8項目の見出しだけが並んだ記録の紙です。解析の後ではなく、前に作ります。2、コードに記録を書き出させる。AIと人です。使った製品の名前の一覧、ずらしと倍率、しきい値、道具の版を、結果と一緒に書き出して、と指示します。出るのは、結果の横に置かれた記録のファイルです。3、版を固定する。人です。記録の6の一覧から、次に動かすときも同じ版の道具を使う、と決めます。データ側は、製品の名前で同じ版を指定して取り直せることを確かめます。4、人が確かめたことを書く。人です。コードと結果のレビューの一覧から、見た観点と結果、見ていない観点、の2つの表を作ります。5、報告に添える。人です。8項目を、報告の末尾の、再現のための条件、の節にします。

  - kind: figure
    heading: 報告に書く2つのこと
    image: figures/codex-0-4-reproducible/report.svg
    say: 報告には、2つのことを対にして書きます。左が、AIが書いたこと。コードそのもの、指示文の全文、返ってきた説明。右が、人が確かめたこと。見た観点とその結果、見ていない観点、答えの分かっている場所の値です。報告に、AIが書いた、と書くことは、隠すことではありません。隠すと、次の人は、人が書いた、と思って読みます。書くときは、何をAIが書き、人が何を確かめたかを対にします。たとえば、AIが書いた。人は、波長帯の番号、倍率とずらし、雲の分類の番号を公式資料と突き合わせ、ため池と森の値を確かめた。欠けた値の扱いは確かめていない。このように書きます。

  - kind: table
    heading: AIへの頼み方
    columns: [あいまいな頼み方, 直した頼み方]
    widths: [0.30, 0.70]
    rows:
      - [使ったデータを記録して, 使った製品の名前を、省略せずに全部、記録のファイルに書き出して]
      - [最新の画像を使って, 2025年7月1日〜8月31日の画像を全部使って。動かす日で変わる指定はしないで]
      - [再現できるようにして, 道具の名前と版の番号の一覧と、この指示文の全文を、結果と同じフォルダに保存して]
    say: 記録のための頼み方です。表の左が、あいまいな頼み方。右が、直した頼み方です。使ったデータを記録して、と頼むと、AIは、Sentinel-2 L2A、2025年夏、のような要約を残します。要約は、次の人が同じ画像を取り直す手がかりになりません。代わりに、使った製品の名前を、省略せずに全部、記録のファイルに書き出して、と頼みます。最新の画像を使って、ではなく、2025年7月1日から8月31日の画像を全部使って。動かす日で変わる指定はしないで。再現できるようにして、ではなく、道具の名前と版の番号の一覧と、この指示文の全文を、結果と同じフォルダに保存して。指示の7項目を埋めた指示文に、この記録の項目を足します。

  - kind: code
    heading: 一緒に：記録を残したつもりの抜粋
    code: |
      # ため池の水の候補を出し、記録を残す（誤りあり）
      scenes = search(area, "2025-07-01", "2025-08-31", "S2 L2A", cloud_lt=20)
      scene = scenes[-1]                              # 一番新しい1枚
      green = read_band(scene, "B3") / 10000
      nir = read_band(scene, "B8") / 10000
      water = water_index(green, nir) > 0.3           # 一般的なしきい値
      log("データ: Sentinel-2 L2A, 2025年夏")
      log("しきい値: 0.3")
      save(water, "result.tif")
    highlight: [3, 4, 5, 6, 7, 8]
    say: ここからは、一緒にやってみましょう。やることは、AIが返したコードと記録に、この章の4つの観点を上から当てることです。手元で数分でできます。用意するのは、AIが返したコードと説明、そして章のページの出典にある、Sentinel-2の公式資料です。今回、AIはこう説明してきました。製品の名前のN0400は軌道の番号なので、記録には観測日だけあれば十分です。反射率は10000で割れば得られます。しきい値は一般的な0.3を使います。自信のある口調です。画面がそのコードです。当てる観点は4つ。1、動かす日に依存する指定がないか。2、製品の名前が省略されていないか。3、倍率とずらしを、付属情報から読んでいるか。4、しきい値に出どころがあるか。まず、3行目を見てください。期間内の画像のうち、一番新しい1枚、を使っています。次に、4行目と5行目。10000で割るだけです。次に、7行目。記録に書いているのは、Sentinel-2 L2A、2025年夏、という要約です。最後に、6行目と8行目。しきい値の0.3です。ここで1つ、大事なことがあります。このコードは、動かしても止まりません。地図はできて、記録のファイルもできます。だから、動いたかどうかでは、誤りに気づけません。

  - kind: table
    heading: 一緒に：4つの観点で判定する
    columns: [行, 観点, コードとAIの説明, 判定と、正しくは]
    widths: [0.09, 0.21, 0.34, 0.36]
    rows:
      - ["3", 動かす日の依存, 「一番新しい1枚」, 別の画像になる。期間内の全部を使うか、画像の名前を指定する]
      - ["4-5", 倍率とずらし, 10000で割るだけ, 版04.00以降はずらしが要る。付属情報から読む]
      - ["7", 製品の名前, 「S2 L2A、2025年夏」。N0400は軌道の番号, 要約で特定できない。N0400は処理の版、R031が軌道。全部書き出す]
      - ["6,8", 基準の値, 一般的な0.3, 出どころがない。資料の名前か、答えの分かる場所で決めた経緯を記録する]
    say: 判定の結果が、この表です。1つ目、3行目。一番新しい1枚、は、検索の結果の並びと、動かした日の保管の状態で、別の画像になります。正しくは、期間内の全部の画像を使うか、使う画像の名前を指定します。2つ目、4行目と5行目。10000で割るだけで、ずらしを足していません。処理の版04.00以降の製品では、付属情報のずらしを足してから倍率で割ります。正しくは、付属情報からずらしと倍率を読みます。3つ目、7行目。Sentinel-2 L2A、2025年夏、は要約で、製品の名前ではありません。AIの説明の、N0400は軌道の番号、も誤りです。製品の名前では、Nに続く4桁が処理の版、R031のようにRに続く3桁が軌道の番号です。正しくは、使った製品の名前を省略せずに全部書き出します。4つ目、6行目と8行目。しきい値の0.3に出どころがありません。正しくは、資料の名前か、答えの分かっている場所で決めた経緯を、値と一緒に記録します。4つとも、動かしても止まりません。記録があるように見えて、半年後に同じ地図を作れない記録です。判定が出たので、AIに、4つの行について、何が違うか、どこを見るかを伝えて、直させます。直し方を自分で書く必要はありません。

  - kind: bullets
    heading: 記録と報告の目視レビュー観点5つ
    items:
      - 製品の名前の一覧が、省略なしで並んでいるか。名前から観測日時と処理の版が読めるか
      - ずらしと倍率を、付属情報から読んだと書いてあるか。決め打ちの「10000」だけなら、版が変わると合わない
      - 「最新」「直近」の語が、記録と報告のどこにもないか
      - 道具の一覧に版の番号があるか。名前だけの一覧は、固定になっていない
      - 「人が確かめたこと」に、見ていない観点が書いてあるか。全部確かめた、という記録のほうが疑わしい
    say: 直したら、記録のファイルと報告の末尾を目で確かめます。見るのは5つ。1つ目、製品の名前の一覧が、省略なしで並んでいるか。名前から、観測日時と処理の版が読めるか。2つ目、ずらしと倍率を、付属情報から読んだと書いてあるか。決め打ちの10000だけなら、版が変わると合わなくなります。3つ目、最新、直近、の語が、記録と報告のどこにもないか。4つ目、道具の一覧に版の番号があるか。名前だけの一覧は、固定になっていません。5つ目、人が確かめたこと、に、見ていない観点が書いてあるか。全部確かめた、という記録のほうが疑わしいです。おかしな結果の例を2つ。例1、半年後に同じコードを動かしたら、全部のため池の値が一律に下がった。データ側で処理の版が変わり、ずらしが入った製品に置き換わっています。コードは10000で割るだけなので、ずらしの分だけ全体が低く出ます。製品の名前を記録していれば、名前の中の版の番号が違うことで原因が分かります。記録がないと、ため池が干上がった、と読み違えます。例2、前任者のLandsatの手順が、データの取得で止まる。記録にあるのがCollection 1の製品で、2022年12月30日に利用できなくなっています。Collection 2に置き換えると取得はできますが、欠けを示す値と倍率が違うので、前任者の結果とは数字が合いません。配布元も、両方を混ぜた比較はしないよう注意しています。この場合、同じ手順で作り直した、とは書けません。Collection 2で作り直し、前の結果とは直接比べられない、と書きます。言えるのは、この8項目のもとで、この結果が出た、ことです。言えないのは、別の版のデータや道具でも同じ結果になる、ことです。比べるときは、どちらかに版をそろえて作り直します。

  - kind: bullets
    heading: この型が向かない条件
    items:
      - 製品の名前を取り出せない取り方。画面で切り抜いた画像や、名前を付け替えた複製は、もとの製品を特定できない
      - 境界のファイルが日々更新されている。使った日の複製を保存しないと、範囲を再現できない
      - AIの返答を保存していない。指示文の全文と返ってきたコードがないと、同じコードを再び得られない
      - 有償の商用データ。8項目は同じ。名前と版の決まりは契約の仕様書、他人に渡せるかは利用条件で決まる
    say: 向かない条件も、押さえておきます。1つ目、製品の名前を取り出せない取り方をしているとき。画面で切り抜いた画像や、名前を付け替えた複製は、もとの製品を特定できません。2つ目、境界のファイルが日々更新されているとき。使った日の複製を保存しないと、範囲を再現できません。3つ目、AIの返答を保存していないとき。指示文の全文と返ってきたコードがないと、同じコードを再び得る手段がありません。AIは、同じ指示にも違うコードを返します。4つ目、有償の商用データを使うとき。8項目は変わりません。変わるのは、名前と版の決まりが契約の仕様書にあることと、データを他人に渡せるかが、利用条件で決まることです。

  - kind: steps
    heading: 手順のまとめ
    items:
      - 解析の前に、8項目の空欄を作る（人）
      - コードに、製品の名前の一覧、ずらしと倍率、しきい値、道具の版を書き出させる（AIと人）
      - 道具の版を固定し、データは製品の名前で同じ版を取り直せるか確かめる（人）
      - 「見た観点と結果」「見ていない観点」の2つの表を書く（人）
      - 報告の末尾に「再現のための条件」の節を添える（人）
    say: 手順をまとめます。1、解析の前に、8項目の空欄を作る。人です。2、コードに、製品の名前の一覧、ずらしと倍率、しきい値、道具の版を、結果と一緒に書き出させる。AIと人です。3、道具の版を固定し、データは製品の名前で同じ版を取り直せるか確かめる。人です。4、見た観点と結果、見ていない観点、の2つの表を書く。人です。5、報告の末尾に、再現のための条件、の節を添える。人です。この5つを、どの解析でも繰り返します。

  - kind: code
    heading: 宿題：ケース問題 問1
    code: |
      AIが残した記録のファイル：
      データ: Sentinel-2 L2A, 2025年7〜8月, 雲20%未満の中で一番新しい1枚
      反射率: 画素の値 / 10000
      しきい値: 0.3（一般的な値）
      道具: Python, rasterio, numpy
      指示文: 「ため池の水の候補を出して」（要約）

      問い：半年後に後任者が同じ地図を作ろうとした。
      この記録の最も大きな問題はどれか
      A. 道具の名前がPythonなので、別の言語の人には再現できない
      B. 使った画像を特定できず、
         半年後には別の画像が「一番新しい1枚」になる
      C. しきい値の0.3が低すぎて、ため池以外も水と判定される
      D. 雲20%未満という条件が厳しすぎて、夏には画像が残らない
    highlight: [8, 9]
    notes:
      - 答えは動画では言いません
      - 答えと解説はサイトで
    say: 宿題です。章のケース問題の問1を出します。ある町の担当者が、AIに、Sentinel-2のLevel-2Aで、2025年7月から8月のため池の水の候補を出して。再現できるように記録も残して、と頼みました。AIが返したコードを動かすと、結果の地図と一緒に、画面の記録のファイルができました。データは、Sentinel-2 L2A、2025年7月から8月、雲20%未満の中で一番新しい1枚。反射率は、画素の値を10000で割る。しきい値は、一般的な値の0.3。道具は、Python、rasterio、numpy。指示文は、ため池の水の候補を出して、の要約。半年後に、後任者がこの記録をもとに同じ地図を作ろうとしました。この記録の、最も大きな問題はどれでしょうか。A、道具の名前がPythonなので、別の言語の人には再現できない。B、使った画像を特定できず、半年後には別の画像が、一番新しい1枚、になる。C、しきい値の0.3が低すぎて、ため池以外も水と判定される。D、雲20%未満という条件が厳しすぎて、夏には画像が残らない。この動画で一緒に当てた4つの観点を思い出して、どれが、ほかを直しても同じ地図にならない問題か、を考えてください。答えは、ここでは言いません。答えと解説は、サイトのケース問題で確かめてください。報告の1文を、AIが書き、人が何を確かめたか、の型に直す問2の短答も、そこにあります。

