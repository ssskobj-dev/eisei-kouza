# ユースケース解説動画の台本。元の記事：casebook/conflict-damage-verification.qmd
title: 衛星データで紛争地の被害を裏付ける：入れない現場の報道検証
series: CASEBOOK
kicker: ユースケース解説
number: 22
total: 221
thumb: 入れない現場を衛星で
summary: 記者が入れないミャンマーの紛争地で、放送局が衛星データのAI解析で建物の変化を確かめ、2022年の番組で放送した事例。広い範囲は安価な画像、要所だけ高分解能で見る考え方と、画像だけでは原因が決められない限界、無償衛星でどこまでできるか、有償画像の概算までを6分で解説します。
voice: もち子
scenes:
  - kind: cover
    heading: 衛星データで紛争地の被害を裏付ける
    sub: 入れない現場の報道検証に、安価な画像と高分解能画像を使い分ける
    say: 記者が入れない紛争地の被害を、現地に行かずに確かめる方法はあるか。答えは、2つの時期の衛星画像を比べて、建物や道路が消えた場所をAIで拾い出すことです。日本の放送局は、この方法でミャンマーの紛争地の被害を確かめ、2022年の番組で放送しました。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。画像だけでは分からないことは何か。無償の衛星でどこまでできて、有償の画像を使うといくらかかるのかまでを、6分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：ミャンマー。2021年2月のクーデターの後の紛争地
      - 誰が：日本の放送局（NHK）と、解析会社（Ridge-i）
      - 何のために：SNSで届く市民の動画や証言を、別の方法で裏付ける
      - 困りごと：軍の緊急事態宣言で国際線が着陸できず、記者を派遣できない
    say: 事例の舞台は、ミャンマーです。2021年2月のクーデターの後、軍の緊急事態宣言で国際線が着陸できなくなり、放送局は記者やディレクターを派遣できませんでした。手元に届くのは、現地の市民がスマートフォンで撮り、SNSで発信した動画や写真です。番組にするには、その証言や映像が本当か、被害がどの範囲に及ぶかを、別の方法で確かめる必要があります。そこで、放送局と解析会社が共同で衛星画像を調べ、その結果が2022年4月のNHKスペシャルで放送されました。内閣府の宇宙開発利用大賞で、国土交通大臣賞を受けた事例です。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-conflict-damage-verification/flow.svg
    caption: 番組にする前の検証に、衛星の解析を入れる
    say: 業務の流れを見ます。入る位置は、番組にする前の検証です。まず、証言や動画から、対象の村と、いつからいつまでを見るかを決めます。次に、無償または安価な画像で、地域全体の変化を広く拾います。変化が集中する場所だけ、高分解能の画像を買って詳しく見ます。できた変化の地図と、証言や動画の位置を照らします。最後に、原因と背景を取材で確かめ、番組で示す範囲と表現を決めます。報道は納期が短いので、依頼してから何日で結果が出るかを先に決めておきます。この事例では、依頼から納品まで2週間だったと報じられています。

  - kind: figure
    heading: 衛星に任せることと、取材班が行うこと
    image: figures/usecase-conflict-damage-verification/split.svg
    say: 役割の分担はこうなります。衛星とAIが行うのは、2つの時期の画像から建物や道路の変化を広い範囲で拾うことと、変化の集中する場所を高分解能の画像で確かめることです。取材班が行うのは、証言や動画の位置と時期を照らすこと、変化の原因を取材で確かめること、そして放送で示す範囲と注記を決めることです。衛星が示すのは、変化まで。原因と被害の有無は、取材で決めます。この案件は、実証ではなく、番組として実際に放送された本番の利用です。同じ技術は、国土地理院の地図の更新の試行にも使われています。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.45, 0.55]
    rows:
      - [変化した建物や道路の位置（GISで開ける地図データ）, 被害がどの範囲に及ぶか。どの村を番組で扱うか]
      - [変化の前後の画像と撮影日, 証言の時期と合うか。画面で示せるか]
      - [変化が集中する場所の一覧, どこを高分解能で買い直すか。どこに取材を向けるか]
      - [解析の条件（使った画像、分解能、日付）, 放送で「衛星画像の解析による」とどう注記するか]
    say: 受け取るデータと、それで決められることを整理します。変化した建物や道路の位置の地図は、被害がどの範囲に及ぶか、どの村を番組で扱うかの根拠になります。変化の前後の画像と撮影日は、証言の時期と合うか、画面で示せるかを決めます。変化が集中する場所の一覧は、どこを高分解能で買い直すか、どこに取材を向けるかを決めます。そして、解析の条件を書いた文書です。放送で使うなら、これが欠かせません。どの日の画像を比べたか、どの程度の大きさの変化を拾えるかを注記しないと、視聴者に、衛星が被害を証明した、と伝わるおそれがあります。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-conflict-damage-verification/limits.svg
    say: 限界を4つ挙げます。1つ目、低分解能の画像では、家1軒の変化は拾えません。受賞の資料も、低解像度の画像では詳しい情報が得られず、高解像度の画像を取り直すことが多かったと書いています。2つ目、変化の原因は、画像だけでは決められません。建物が消えたことは分かっても、攻撃か、火災か、取り壊しかは分かりません。証言や現地の動画と照らして、初めて被害と言えます。3つ目、雲の多い季節は、光学衛星では撮れない期間が続きます。放送の締め切りに間に合う画像があるかは、事前に確かめる必要があります。4つ目、変化の日付は、2つの画像の間までしか絞れません。なお、建物の中の人の安否や、誰が行ったかは、衛星では分かりません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - 欧州のSentinel-2は無償。10mの画素で、村や地域の単位の変化を見る
      - 「広い範囲が変わった」と示すだけなら、無償の画像で足りる場合がある
      - 家屋の単位で被害を数えるには、有償の高分解能画像が要る
      - 光学衛星は雲の下を見られない。使える画像があるかは時期しだい
    say: では、無償の衛星でどこまでできるでしょうか。欧州のSentinel-2は無償で、10メートルの画素です。村や地域の単位で、広い範囲が変わった、と示すだけなら、無償の画像で足りる場合があります。この事例の資料も、無償または安価な低分解能の画像で大きな変化を素早くつかむ、という構成を書いています。一方で、家屋の単位で被害を数えるには、有償の高分解能の画像が要ります。光学衛星は雲の下を見られないので、使える画像があるかは時期しだいです。なお、この事例で実際にどの衛星を使ったかは、資料に書かれていません。

  - kind: table
    heading: 有償の画像を使うと、いくらか（概算）
    columns: [項目, 仮定と計算]
    widths: [0.36, 0.64]
    rows:
      - [この案件の金額, "非公表。公表は事業全体の売上（2022年度 約8,000万円）だけ"]
      - [広く見る画像, "3m級光学画像。公開価格 1.80ドル/km²、最小 250km²（2022年12月）"]
      - [範囲と回数, "仮定：対象の村を含む範囲が 250km² に収まり、前後の2時期を見る"]
      - [広く見る画像代, "250km² × 1.80ドル × 2時期 ＝ 900ドル。1ドル150円なら 約13.5万円"]
      - [要所の高分解能画像, 変化の集中する場所の数で変わる。上限を先に決める]
      - [別にかかるもの, AIの解析と地図化、証言と照らす人手、放送で使う権利の確認]
    say: 有償の画像を使う場合の概算です。この案件の金額は、公表されていません。公表されているのは、解析会社の衛星画像解析事業の売上が、2022年度に約8,000万円という、事業全体の数字だけです。ここからは、仮定を置いた計算で、見積もりではありません。広く見る画像として、3メートル級の光学画像に、1平方キロあたり1.80米ドル、最小発注250平方キロという公開価格があります。2022年12月の公開記事の値です。対象の村を含む範囲がこれに収まり、前後の2時期を見ると仮定すると、画像代は900ドル。1ドル150円なら、約13.5万円です。要所を見る高分解能の画像は、変化の集中する場所の数で変わるので、上限を先に決めておきます。これに、AIの解析と地図にする作業、証言と照らす人手、画像を放送で使う権利の確認が、別にかかります。価格は変わるので、実際の金額は必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [現場, 記者が入れない、入れても危険, 現地で直接確かめられる]
      - [確かめたいこと, 建物や道路がどの範囲で変わったか, 変化の原因、人の安否]
      - [対象の広さ, 村や地域の単位で、変化が集中している, 家1軒、小さな施設]
      - [手元の材料, 証言や動画があり、位置と時期を絞れる, 場所も時期も分からない]
      - [納期と天候, 撮れる季節で、2週間程度の余裕がある, 雨季に数日で結果が要る]
    say: 最後に、向き不向きです。向いているのは、記者が入れない現場で、建物や道路がどの範囲で変わったかを確かめたいときです。村や地域の単位で変化が集中していて、証言や動画から位置と時期を絞れることも条件です。画像が撮れる季節で、2週間程度の余裕があるとなおよいです。逆に、現地で直接確かめられる、変化の原因や人の安否を知りたい、家1軒だけを確かめたい、場所も時期も分からない、雨季に数日で結果が要る、という場合は向きません。提案するときは、最初に証言の位置と時期を聞くこと、衛星が被害を証明すると言わないこと、画像の費用を広く見る分と要所の分の二段構えで出すことが要点です。

  - kind: cta
    heading: 自分の業務で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：内閣府「第6回宇宙開発利用大賞 受賞事例集」（2024年3月） https://www8.cao.go.jp/space/prize/sixth/space_award_06.pdf"
      - "出典：SPACE CONNECT「Ridge-iが東証グロース市場に上場」（2023年5月5日） https://space-connect.jp/ridge-i-growth/"
      - "出典：早稲田大学「第22回 早稲田ジャーナリズム大賞 受賞者挨拶」（2022年12月19日） https://www.waseda.jp/top/news/86141"
      - "価格：Apollo Mapping（2022年12月6日） https://apollomapping.com/blog/product-update-simplified-ordering-options-for-3-m-planetscope-satellite-imagery"
      - "衛星の仕様：Copernicus SentiWiki「Sentinel-2 Mission」"
    say: この事例をもとに、自分の業務や顧客に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
