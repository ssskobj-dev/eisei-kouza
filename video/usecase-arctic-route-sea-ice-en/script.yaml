# English use-case video. Same facts as casebook/arctic-route-sea-ice.qmd; English narration & slides.
lang: en
title: Reading the Arctic shipping route with satellite sea ice
series: CASEBOOK
kicker: Use case
number: 35
total: 221
voice: Ryan
thumb: Forecast vs reality
summary: How a shipping line decides whether to route through the Arctic, using a satellite sea-ice forecast of when the route opens. In 2019 the summer forecast said "mid-August"; the route actually opened on August 20. Where it fits in the workflow, what it decides, the width of the forecast, and how far free data goes. 6 minutes.
scenes:
  - kind: cover
    heading: Reading the Arctic shipping route with satellite sea ice
    sub: The 2019 forecast said mid-August; the route opened August 20
    say: Is there a way, back in spring, to know when the Arctic shipping route will open this year? Yes. The answer is to receive a route-by-route opening forecast built from satellite sea-ice observation. In 2019, the summer forecast said mid-August, and the route actually opened on August 20. In this video, we look at who uses it, where it fits in the workflow, what decisions it supports, how wide the forecast really is, what satellites cannot tell you, and how far free data goes.

  - kind: bullets
    heading: Where, who, and why
    items:
      - "Route: the Northern Sea Route - about 13,000 km versus 21,000 km via Suez (about 60%)"
      - "Who: the shipping line's routing planner. A weather company issues the forecast"
      - "Why: to decide whether to route a voyage through the Arctic this year, and when to sail"
      - "The problem: the Arctic has few observation points, so confirming ice extent over a wide area is hard"
    say: The setting is the Northern Sea Route, linking East Asia and Europe across the Arctic. By Japan's transport ministry, it is about 13,000 kilometres, against about 21,000 the southern way through the Malacca Strait and the Suez Canal - roughly 60 percent of the distance. As sea ice has shrunk, the route is navigable in summer. The user is the shipping line's routing planner; the forecast comes from a weather company. The goal is to decide whether to route a voyage through the Arctic this year and when to sail. Because the Arctic has few observation points, confirming ice over a wide area is hard, and that wide, daily view is what the satellite provides.

  - kind: steps
    heading: Where it fits in the workflow
    items:
      - Early summer, receive the route-by-route opening forecast
      - Tentatively place the Arctic candidates, and a deadline to switch back to the Suez route
      - Confirm the sailing permit and whether icebreaker support is required, by ship ice class and sea area
      - Just before the go decision, check the latest ice map for the opening
      - During the voyage, take ice updates and decide on detours or waiting
    say: Here is where it fits. First, in June and July, the planner receives the route-by-route opening forecast. Second, the Arctic voyage candidates are placed tentatively, along with a deadline to switch back to the Suez route if needed. Third, the sailing permit application and the question of icebreaker support are confirmed, by the ship's ice class and the sea area. Fourth, just before the go decision, the latest ice map is checked for the opening. And during the voyage, ice updates are received, and detours or waiting are decided as needed. The satellite enters at the first step and the fourth.

  - kind: table
    heading: Satellite versus people
    columns: [The satellite does, The people do]
    widths: [0.5, 0.5]
    rows:
      - ["Capture the ice distribution, wide and daily", Decide Arctic route versus Suez route]
      - [Issue the route-by-route opening forecast, Decide the sailing timing and the ship]
      - ["", Confirm the sailing permit and icebreaker support]
    say: The split of roles looks like this. The satellite observation captures the ice distribution over a wide area, every day, and issues the route-by-route opening forecast. The people decide whether to go via the Arctic or via Suez, decide the timing and which ship, and confirm the sailing permit and icebreaker support. The weather company in this case combines its own ultra-small satellite, launched in 2017, with existing satellite imagery and analysis images from the AMSR2 microwave satellite. This is real operation, in service since 2011, and in 2019 it supported 13 voyages.

  - kind: table
    heading: The 2019 forecast and what happened
    columns: [Item, 2019 summer forecast, Actual (December summary)]
    widths: [0.30, 0.33, 0.37]
    rows:
      - [Northeast Passage (Russia side), Mid-August, "Opened Aug 20; stayed open to Oct 21, about 2 months"]
      - [Northwest Passage (Canada side), Early September, "Opened Sep 1 to Sep 29, about 1 month"]
      - [Annual minimum sea-ice area, About 4.4 million sq km (6th smallest), "3.96 million sq km (2nd smallest since 1979)"]
    say: Here are the 2019 numbers. The summer forecast said the Northeast Passage on the Russian side would open in mid-August, and the Northwest Passage on the Canadian side in early September. Opening here means the satellite judges the whole route passable without entering the ice. In reality, the Northeast Passage opened on August 20 and stayed open to October 21, about two months. The Northwest Passage ran from September 1 to September 29, about one month. The annual minimum sea-ice area was 3.96 million square kilometres against a forecast of about 4.4 million, the second smallest since records began in 1979. So the opening date was close to the forecast, while the area came in smaller than expected.

  - kind: table
    heading: What decisions it supports
    columns: [What you receive, What you can decide]
    widths: [0.45, 0.55]
    rows:
      - [Route-by-route opening forecast (early summer), Whether to route a voyage via the Arctic this year]
      - ["Daily ice maps (images, concentration grid)", "When to sail; where to avoid the ice edge"]
      - [Past years' open-period record (year-end summary), The navigable window to assume for next year's plan]
      - [Permit and icebreaker decision (route authority review), Whether your own ship may pass that sea area]
    say: Here is what you receive and what it lets you decide. The early-summer opening forecast tells you whether to route a voyage via the Arctic this year. The daily ice maps tell you when to sail and where to avoid the ice edge. Past years' open-period records give you the navigable window to assume in next year's plan. And the permit and icebreaker decision, from the route authority's review, tells you whether your own ship may pass that sea area. Recording the gap between the forecast, mid-August, and the actual, August 20, year by year is what sets the margin you build into your own decisions.

  - kind: bullets
    heading: Limits as of 2026
    items:
      - "Seasonal forecasts have width - expect the opening date off by a week, the area off by around 10 percent"
      - "The microwave radiometer grid is coarse - AMSR2 concentration is about 15 km (5 km for research)"
      - "Passage is not decided by ice alone - it needs a permit, and the ship's ice class and sea area"
      - "Ice thickness and drift are hard to read from images alone; that judgment needs sea-ice knowledge"
    say: The limits, as of 2026. First, seasonal forecasts have width. In the 2019 example, the mid-August forecast met an actual opening on August 20, and the area forecast of about 4.4 million met an actual 3.96 million. Expect the opening date off by about a week and the area off by around ten percent. Second, the microwave radiometer grid is coarse. The AMSR2 sea-ice concentration standard product is about 15 kilometres with plus or minus ten percent accuracy, and even the research product is 5 kilometres, so fine ice-edge shapes and thin-ice bands are not fully captured. Third, whether you can pass is not decided by ice alone. The Russian-side Northeast Passage is permit-based, applied for between 120 days and 15 business days before entry, and whether icebreaker support is required is set by the sea area, the ship's ice class, and the ice conditions. Ships with no ice strengthening may sail alone only where there is no sea ice. Fourth, ice thickness and drift are hard to read from images alone, and that judgment needs sea-ice knowledge.

  - kind: bullets
    heading: How far do free satellites go?
    items:
      - "AMSR2 sea-ice concentration is published by public agencies - NOAA posts it on a 10 km grid, daily"
      - "If you only want to view the distribution, the data cost is zero"
      - "The standard product is about 15 km resolution, plus or minus 10 percent; research-grade is 5 km"
      - "An opening forecast and a per-ship decision still need sea-area reading and sea-ice knowledge"
    say: So how far can free satellites take you? The underlying microwave sea-ice concentration is published by public agencies. In the United States, NOAA posts the AMSR2 sea-ice concentration on a ten-kilometre grid, daily. If you only want to view the distribution yourself, the data cost is zero. On the other hand, the standard product's resolution is about fifteen kilometres, and even the research-grade product is five. And the analysis that judges a route's opening, and the reading of each sea area, is a different job from viewing a map. A forecast and a per-ship decision still need a person with sea-ice knowledge, or a service.

  - kind: table
    heading: How to think about cost
    columns: [Item, What is known]
    widths: [0.34, 0.66]
    rows:
      - [Forecast and routing service, Price is not public; the press releases carry no fee]
      - [Sea-ice distribution data, Published free by public agencies; NOAA posts a 10 km grid daily]
      - [Voyage cost, Icebreaker fees are capped by gross tonnage and number of sea areas]
      - [About an estimate, "No public price, so no estimate is given here; confirm with a quote"]
    say: How to think about cost. For this case, we cannot give an estimate for paid imagery. The price of the forecast and routing-support service is not public, and the press releases carry no fee. The underlying sea-ice distribution data is published free by public agencies - NOAA posts it on a ten-kilometre grid, daily. As for the voyage itself, icebreaker fees are capped according to the ship's gross tonnage and the number of sea areas supported, and that can be larger than any satellite cost. Because there is no public price, we do not put an assumed estimate in this video. Always confirm the figure with a real quote.

  - kind: table
    heading: When it fits, and when it does not
    columns: [Factor, Fits, Does not fit]
    widths: [0.22, 0.39, 0.39]
    rows:
      - [Cargo, Carried repeatedly in summer; timing can shift, Arrival date is fixed]
      - [Plan margin, Can absorb a shift of about a week, Counts on the opening day to the day]
      - [Ship, Has an ice class and meets the permit terms, No ice strengthening; stuck when ice is present]
      - [Organisation, Can change the decision on ice updates, Hard to change a settled voyage plan]
      - [What you want, The whole route's opening timing, Local ice right in front of the port]
    say: Finally, where it fits. It fits where cargo is carried repeatedly in summer and the timing can shift, where the plan can absorb a shift of about a week, where the ship has an ice class and meets the permit terms, and where the organisation can change its decision on ice updates. It also fits when what you want is the whole route's opening timing. It does not fit where the arrival date is fixed, where you count on the opening day to the day, where the ship has no ice strengthening, where a settled plan is hard to change, or where you need the local ice right in front of the port. When you propose this, three points matter - confirm the ship's ice class and the permit terms first, never say the exact opening day is known, and explain that a forecast cannot be built from free data alone.

  - kind: cta
    heading: Considering it for your fleet?
    action: For an RFP and competitive quotes, contact us from the form
    url: ssskobj-dev.github.io/eisei-kouza/en/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/en/register.html
    credits:
      - "Source: Weathernews, '2019 Arctic sea ice summary' (20 Dec 2019) https://global.weathernews.com/wp-content/uploads/2019/12/20191220_3.pdf"
      - "Source: Weathernews, '2019 Arctic sea ice forecast' (4 Jul 2019) https://global.weathernews.com/wp-content/uploads/2019/07/20190704_2.pdf"
      - "Route distance and permit rules: MLIT Japan, 'Trends in use of the Northern Sea Route' (28 Jul 2021) https://www.mlit.go.jp/sogoseisaku/ocean_policy/content/001476544.pdf"
      - "Satellite spec: JAXA EORC, 'AMSR2 mission requirements' https://www.eorc.jaxa.jp/AMSR/datacatalog/am2_mission_ja.html"
      - "Data: NOAA CoastWatch, 'AMSR2 Sea Ice Concentration' https://coastwatch.noaa.gov/cwn/products/amsr2-sea-ice-concentration.html"
      - "Cost: the forecast service price is not public; no estimate is given in this video"
    say: To consider this for your own fleet or your client's, here is the next step. We help you write the specification, the RFP, and gather competitive quotes, from a position tied to no satellite operator and no analytics company. Use the form in the description to get in touch. Thanks for watching.
