# ユースケース解説動画の台本。元の記事：casebook/cabbage-forecast-ad-timing.qmd
title: 衛星データでキャベツの出荷量と価格を8週間前に予測し、広告と販促を連動させる
series: CASEBOOK
kicker: ユースケース解説
number: 71
total: 221
thumb: 8週間前に予測
summary: 電通・JAXA・JA嬬恋村が、衛星データで嬬恋村産キャベツの出荷量と卸売価格を8週間前に予測し、関連商品の広告と店頭販促の時期を合わせる事例。2026年8月に首都圏と関西の約50店舗で実験的市場投入を始めました。業務のどこに入れ、何を決める材料になるか、精度の数字がない限界、費用の考え方までを5分で解説します。
scenes:
  - kind: cover
    heading: 衛星データでキャベツの出荷量と価格を8週間前に予測、広告と販促を連動
    sub: 電通・JAXA・JA嬬恋村が約50店舗で実験的市場投入
    say: 野菜の出荷の山に合わせて、広告と売り場の時期を前から決める方法はあるか。答えは、衛星データで産地の生育を観測し、出荷量と価格を8週間前に予測することです。電通、JAXA、JA嬬恋村は、この予測に合わせてキャベツの関連商品の広告と店頭販促を動かす取り組みを、2026年8月に首都圏と関西の約50店舗で始めました。この動画では、誰が、業務のどこに入れて、何を決める材料にしているのか。精度の数字がない限界と、費用の考え方までを、5分で見ていきます。

  - kind: bullets
    heading: どこで、誰が、何のために
    items:
      - 国：日本。群馬県嬬恋村のキャベツの産地
      - 誰が：広告会社（電通）、JAXA、JA嬬恋村。食品メーカーと小売が協力
      - 何のために：出荷が集中する時期に合わせて、関連商品の広告と売り場をつくる
      - 困りごと：収穫の時期と量は天候で前後し、出荷の直前まで見通しが立たない
    say: 事例の舞台は、群馬県嬬恋村のキャベツの産地です。取り組むのは広告会社の電通と、JAXA、産地のJA嬬恋村で、食品メーカーと小売が協力しています。目的は、キャベツの出荷が多くなる時期に合わせて、調味料などの関連商品の広告と売り場をつくることです。困りごとは、収穫の時期と量が天候で前後し、出荷の直前まで見通しが立たないことでした。テレビ広告の枠は前から押さえるので、出荷の山と広告の時期がずれることがあります。そこで、衛星で産地の生育を観測し、数週間前に出荷の見込みを持つ、という使い方をしています。

  - kind: table
    heading: 事例の経緯
    columns: [時期, 出来事]
    widths: [0.22, 0.78]
    rows:
      - [2022年7月, 電通とJAXAが、J-SPARCの枠で共創活動を開始。衛星データでキャベツの生育を観測し、収穫時期を予測する手法の検討を始める]
      - [2023年度, JA嬬恋村で、衛星データの解析と現地調査を組み合わせた予測手法を開発。予測は実際の収穫量に「概ね近い結果」]
      - [2024年6月, JA嬬恋村が参画し、「事業共同実証」に移行。出荷時期・出荷量・市場価格の予測精度を高め、広告の出稿時期を最適化する方針]
      - [2025年産, 出荷量と卸売価格について、8週間前時点の予測を実績と比べ、「高い相関で予測できることを確認」]
      - [2026年8月, 首都圏と関西の量販店約50店舗で、予測に連動した広告と店頭販促の「実験的市場投入」を順次開始]
    say: 経緯を見ます。2022年7月、電通とJAXAが、JAXAの宇宙イノベーションパートナーシップ、J-SPARCの枠で共創活動を始めました。2023年度には、JA嬬恋村で、衛星データの解析と現地調査を組み合わせた予測手法を開発し、予測は実際の収穫量に概ね近い結果でした。2024年6月にJA嬬恋村が参画して事業共同実証に移り、2025年産では、出荷量と卸売価格の8週間前の予測が、実績と高い相関で予測できることを確認したとしています。そして2026年8月、首都圏と関西の量販店、約50店舗で、予測に連動した広告と店頭販促の実験的市場投入が始まりました。段階は、まだ実証です。

  - kind: figure
    heading: 業務の流れの、どこに入るか
    image: figures/usecase-cabbage-forecast-ad-timing/flow.svg
    caption: 記事の「自社の業務に入れるなら」の想定。実在のサービスの手順ではない
    say: 食品メーカーの販促部門と広告会社が、この予測を使うなら、という想定の流れです。まず、産地のJAと協定を結び、現地調査と出荷のデータの提供を受ける形を作ります。次に、衛星で生育を観測し、8週間前の時点で出荷時期、出荷量、卸売価格の予測を受け取ります。予測を見て、関連商品の広告枠と店頭販促の時期を仮に組みます。供給が増える週に広告と売り場を合わせ、減る週は規模を抑えます。出荷に近づくにつれて予測を更新し、広告枠の組み換えと売り場の調整を確定します。この事例では、電通が開発したテレビ広告枠を組み換える仕組みを使っています。最後に、出荷の後で予測と実績、売上を比べます。つまり、衛星が入るのは、広告と販促の計画を立てる前の、見込みを持つ段階です。

  - kind: figure
    heading: 衛星に任せることと、人が行うこと
    image: figures/usecase-cabbage-forecast-ad-timing/split.svg
    say: 役割の分担です。衛星が受け持つのは、産地の畑の生育の状況を、広く、定期的に観測することです。その観測は、現地調査と市場のデータに合わせる材料になります。雲があると、光学の観測は欠けます。人が行うのは、現地で生育と天候を記録すること、広告枠を組み換えること、売り場と販促を組むこと、そして予測の当たり外れを検証することです。この事例の役割分担では、電通が広告の設計と販促の企画、JAXAが衛星データの技術的な支援、JA嬬恋村が生産と出荷のデータの提供と現場との連携を担っています。予測モデルの構築は研究機関と解析会社、売り場の調整は卸売会社と全農の組織が協力しています。

  - kind: table
    heading: 何を決める材料になるか
    columns: [受け取るもの, 決められること]
    widths: [0.5, 0.5]
    rows:
      - [出荷時期と出荷量の予測（8週間前から、週ごと）, 関連商品の広告の出稿の時期と量。店頭販促の週]
      - [卸売価格の予測, 産地の出荷計画と販売先との交渉。値崩れの週の販促]
      - [生育予測のダッシュボードと現地調査の記録, 予測の根拠の確認。現地調査に行く畑と時期]
      - [予測と実績の比較, 翌年の継続と、広告を動かす判断の基準の見直し]
    say: 受け取るものと、それで決められることを整理します。出荷時期と出荷量の予測は、8週間前からの週ごとの見込みで、関連商品の広告の出稿の時期と量、店頭販促の週を決める根拠になります。卸売価格の予測は、産地の出荷計画と販売先との交渉、値崩れが見込まれる週の販促に使えます。生育予測のダッシュボードと現地調査の記録は、予測の根拠を確かめ、現地調査に行く畑と時期を決める材料です。そして予測と実績の比較が、翌年も続けるかと、どの程度の外れなら広告を動かすか、という基準の見直しにつながります。決められるのは、いつ、どの規模で売り場と広告を動かすか、です。売上の増加や廃棄の削減は、保証されるものではなく、これから検証されます。

  - kind: figure
    heading: 2026年時点の限界
    image: figures/usecase-cabbage-forecast-ad-timing/limits.svg
    say: 限界を5つ挙げます。1つ目、精度の数字は公表されていません。概ね近い、高い相関という表現だけで、誤差の幅や相関の値は示されていません。2つ目、雲で光学衛星のデータが欠けます。発表はこれを課題に挙げ、今後はだいち4号などの合成開口レーダ、SARのデータの活用を進めるとしています。3つ目、検証は1産地、1作物です。他の作物や地域への展開は、これからです。4つ目、現地調査と市場のデータがないと、予測は成り立ちません。衛星だけで出荷量が出るわけではなく、産地の協力が前提です。5つ目、衛星が見ているのは産地の畑で、価格は他の産地の出荷や需要でも動きます。発表も、予測を売り場に反映するための、流通・販売体制との連携の難しさを課題に挙げています。予測が当たっても、売り場が動かなければ効果は出ません。

  - kind: bullets
    heading: 無償の衛星で、どこまでできるか
    items:
      - この事例で使った衛星の名前は、発表に書かれていない
      - 仮定：欧州のSentinel-2は無償。10mの画素で、5日ごとに同じ場所を観測する
      - 産地全体の生育の傾向を見る用途なら、画像の費用をかけずに試せる可能性がある
      - 雲の多い夏は、無償の光学データでも欠損は同じように起こる
    say: では、無償の衛星でどこまでできるでしょうか。まず、この事例で使った衛星の名前は、どちらの発表にも書かれていません。ここからは仮定です。欧州のSentinel-2は無償で、10メートルの画素、5日ごとに同じ場所を観測します。産地全体の生育の傾向を見る用途なら、画像の費用をかけずに試せる可能性があります。ただし、この事例の予測が無償データで作られたかは分からず、精度がそのまま当てはまるわけでもありません。そして、雲の多い夏は、無償の光学データでも欠損は同じように起こります。

  - kind: table
    heading: 費用はどこにかかるか
    columns: [かかる所, 中身]
    widths: [0.34, 0.66]
    rows:
      - [衛星データ, 使った衛星は非公表。有償か無償かは、データの選び方で変わる]
      - [現地調査, 産地での生育の調査と、そのためのアプリの開発と運用]
      - [予測モデル, 生育・収穫量・出荷量と、価格・入荷量の予測モデルの構築と運用]
      - [広告枠の組み換えの仕組み, 予測に応じてテレビ広告枠を組み換えるシステム]
      - [売り場の調整, 卸売会社と小売との売り場の調整、店頭販促の費用]
    say: 費用の考え方です。この取り組みの費用は公表されていません。J-SPARCは、JAXAと民間事業者が事業化に向けて共同で検討と実証を行う枠組みで、個別の金額は示されていません。そのため、この動画では画像代の概算は出さず、費用がかかる所を5つ挙げます。衛星データ、産地での現地調査とアプリ、生育と価格の予測モデル、テレビ広告枠を組み換える仕組み、そして卸売会社と小売との売り場の調整です。衛星データの代金は、このうちの1つにすぎません。予測モデルと売り場の調整に、人の作業費がかかる構造です。実際の金額は、必ず見積もりで確かめてください。

  - kind: table
    heading: 向いている条件、向いていない条件
    columns: [観点, 向いている, 向いていない]
    widths: [0.2, 0.4, 0.4]
    rows:
      - [産地, 1か所にまとまり、JAが出荷データを共有できる, 産地が分散し、データが集まらない]
      - [作物, 露地で、畑の様子が生育を表す葉物, 施設栽培、樹冠の下で実が育つ果樹]
      - [判断の時間, 数週間前の見込みで動く広告と販促, 数日前の正確な量が要る物流の手配]
      - [価格の決まり方, 産地の出荷量が価格に大きく効く, 他産地や輸入の影響が大きい]
      - [体制, 卸売会社と小売まで売り場を調整する経路がある, 予測を受け取るだけで、売り場を動かせない]
    say: 最後に、向き不向きです。向いているのは、産地が1か所にまとまり、JAが出荷データを共有できて、露地で畑の様子が生育を表す葉物の作物です。数週間前の見込みで動かせる広告と販促で、産地の出荷量が価格に大きく効き、卸売会社と小売まで売り場を調整する経路があることも条件です。逆に、産地が分散している、施設栽培や果樹、数日前の正確な出荷量が要る物流の手配、他産地や輸入の影響が大きい、予測を受け取るだけで売り場を動かせない、という場合は向きません。提案するときの要点は3つです。最初に、売り場を動かせる経路があるかを確かめること。衛星で価格が分かる、と言わず、産地の出荷の見込みを数週間前に持てる、と言い換えること。そして、1産地1作物の実証だと伝えることです。

  - kind: cta
    heading: 自分の商品や産地で検討する方へ
    action: RFPの作成と相見積もりの相談は、フォームから
    url: ssskobj-dev.github.io/eisei-kouza/register.html
    url_full: https://ssskobj-dev.github.io/eisei-kouza/register.html
    credits:
      - "出典：電通「需給連携事業 JA嬬恋村参画による事業共同実証への移行」（2024年6月13日） https://kyodonewsprwire.jp/release/202406122057"
      - "出典：電通・JAXA・JA嬬恋村「キャベツの広告・店頭販促を予測と連動、約50店舗で開始」（2026年8月24日） https://kyodonewsprwire.jp/release/202608184309"
      - "費用：金額は出典に公表されていないため、画像代の概算は出していない。Sentinel-2の仕様はCopernicus SentiWiki「Sentinel-2 Mission」"
    say: この事例をもとに、自分の商品や産地に合わせて検討したい方へ。仕様書、いわゆるRFPの作成と、相見積もりの取り方をお手伝いします。どの衛星会社にも解析会社にも属さない立場で、条件の整理と比較をします。説明欄のリンクから、相談フォームへどうぞ。ご視聴ありがとうございました。
