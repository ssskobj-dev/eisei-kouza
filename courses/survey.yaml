# 講座の定義。部品（syllabus の id）を並べる順番を書くだけ。
id: survey
title: 衛星SARを自社サービスに加える（測量・建設コンサル向け）
public: true
sections:
  - name: 第1部 全体像
    lead: 衛星データの強みは5つあります。そして、どの強みにも限界があります。まず全体を見渡し、自分の課題がどこに当たるかをつかみます。
    parts:
      - common-strengths-limits
      - common-optical-sar
      - common-data-cost
  - name: 第2部 使い道ごとの限界と落とし所
    lead: 使い道ごとに、今の技術でどこまでできるかを見ていきます。どの章も、欲しい成果、強み、限界、落とし所の順に書いています。
    parts:
      - survey-road-slope-screening
      - survey-subsidence
      - survey-reclaimed-land
      - survey-dam-levee
      - survey-disaster-damage
  - name: 第3部 導入と受発注の実務
    lead: 自社のサービスに加えるための実務です。体制、データの調達、品質の確認、顧客への説明、提案と見積もりを扱います。
    parts:
      - survey-make-or-buy
      - survey-procurement
      - survey-quality-explain
      - survey-proposal-pricing
      - survey-first-project
