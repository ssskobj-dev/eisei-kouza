# 衛星データ解析エンジニア（資格）の教材＝解析教材。cert.qmd の分野と1対1。
id: codex
title: 衛星データ解析エンジニア 資格の教材：AIに書かせて、人が確かめる（2級・1級）
public: true
sections:
  - name: 2級 A. AIと進める解析の型（第0部）
    lead: AIにコードを書かせ、人が確かめる進め方の土台です。役割の分担、指示の7項目、コードの読み方、再現できる記録。
    parts:
      - codex-0-1-roles
      - codex-0-2-prompting
      - codex-0-3-code-review
      - codex-0-4-reproducible
  - name: 2級 B. 解析の前に（第1部）
    lead: 衛星画像が何を測っているかを押さえ、目的に合う画像を探して入手します。
    parts:
      - codex-1-1-what-pixels-measure
      - codex-1-2-optical-vs-radar-view
      - codex-1-3-resolution-revisit
      - codex-1-4-processing-levels
      - codex-1-5-open-data-access
  - name: 2級 C. 光学の解析（第2部）
    lead: 色の合成、指数、前後の比較、時系列。基本の解析をAIに頼み、確かめます。
    parts:
      - codex-2-6-color-composites
      - codex-2-7-vegetation-index
      - codex-2-8-water-snow-index
      - codex-2-9-burn-index
      - codex-2-10-change-detection
      - codex-2-11-time-series
  - name: 2級 D. レーダーの解析（第3部）
    lead: レーダー画像の明るさの意味を押さえ、浸水や変位の基本の読み取りを確かめます。
    parts:
      - codex-3-12-radar-brightness
      - codex-3-13-flood-mapping
      - codex-3-14-insar-concepts
      - codex-3-15-displacement-series
      - codex-3-16-objects-at-sea
  - name: 1級 A. 分類と検出（第4部）
    lead: 正解データを正しく作り、機械学習の分類の当たり具合を正しく測ります。
    parts:
      - codex-4-17-training-data
      - codex-4-18-ml-classification
      - codex-4-19-accuracy
  - name: 1級 B. 水と大気（第5部）
    lead: 水の色と大気のガス。品質の低い観測を除き、単位と限界を押さえます。
    parts:
      - codex-5-20-water-quality
      - codex-5-21-atmospheric-gas
  - name: 1級 C〜E. 結果を使う（第6部）
    lead: 現地確認と組み合わせ、台帳の単位にまとめ、言えることを報告し、依頼文に直す。最後は総合問題。
    parts:
      - codex-6-22-field-check-combo
      - codex-6-23-maps-and-tables
      - codex-6-24-what-can-be-said
      - codex-6-25-briefing-vendors
      - codex-6-26-common-failures
