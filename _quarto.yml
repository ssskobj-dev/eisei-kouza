project:
  type: website
  output-dir: _site
  # 公開するのはここに書いたものだけ。patterns、note、custom などは載らない。
  render:
    - index.qmd
    - about.qmd
    - register.qmd
    - privacy.qmd
    - tokushoho.qmd
    - cert.qmd
    - guide.qmd
    - en/**/*.qmd
    - landscape/**/*.qmd
    - casebook/*.qmd
    - learn/**/*.qmd
    - themes/*.qmd
    - news/*.qmd

# メニュー。scripts/build.py nav が作る。
metadata-files:
  - _sidebar.yml

lang: ja

# 記事ごとのPDFと、サイト内の検索は、有料版の機能。公開するサイトでは作らない。

website:
  search: false
  title: "Satellite to Decision"
  description: "衛星データの市場レポート、活用事例、解析の学習プログラム、資格。遊休農地、地盤変位、災害、インフラ監視など、衛星データを仕事の判断に使うための知識を、使う側の立場で整理します。"
  # 公開先のアドレス。独自ドメインにしたら書き換える（検索エンジン向けのサイトマップに使われる）
  site-url: "https://ssskobj-dev.github.io/eisei-kouza/"
  favicon: design/brand/icon.png
  # SNSなどで共有されたときに出る画像と説明
  open-graph:
    image: design/brand/og.png
  twitter-card:
    image: design/brand/og.png
    card-style: summary_large_image
  navbar:
    collapse-below: xl
    logo: design/brand/logo.svg
    logo-alt: "Satellite to Decision"
    left:
      - text: 活用ガイド
        href: guide.qmd
      - text: 市場レポート
        href: landscape/index.qmd
      - text: ユースケース集
        href: casebook/index.qmd
      - text: 学習プログラム
        href: learn/index.qmd
      - text: 資格
        href: cert.qmd
      - text: 時事解説
        href: news/index.qmd
    right:
      - text: このサイトについて
        href: about.qmd
      - text: 有料登録
        href: register.qmd
      - text: English
        href: en/index.qmd
  # 訪問者数の計測は design/analytics.html（Google Analytics 4）。
  # 下の cookie-consent で同意した人のブラウザでだけ動く。
  cookie-consent:
    type: express
    style: simple
    palette: dark
    policy-url: "https://ssskobj-dev.github.io/eisei-kouza/privacy.html"
    prefs-text: "クッキーの設定"
  # 各ページの本文の下に出る、有料登録のボタン
  body-footer: |
    <div class="s2d-register"><a class="s2d-button" data-s2d-register="page-bottom" href="/register.html">サイトに有料登録する</a></div>
  page-footer:
    center: "どの衛星会社にも解析会社にも属さない立場で書いています。"
    left:
      - text: "運営：Spacify合同会社"
        href: about.qmd
    right:
      - text: "プライバシーポリシー"
        href: privacy.qmd
      - text: "特定商取引法に基づく表記"
        href: tokushoho.qmd

format:
  html:
    # サイトのデザイン。色や見出しの形は design/site.scss で変える。
    theme:
      light: [cosmo, design/site.scss]
      dark: [darkly, design/site.scss, design/site-dark.scss]
    include-in-header: design/analytics.html
    include-after-body: design/track.html
    toc: true
    toc-title: このページの内容
    number-sections: false
