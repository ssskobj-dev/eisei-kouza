project:
  type: website
  output-dir: _site
  # 公開するのはここに書いたものだけ。patterns、note、custom などは載らない。
  render:
    - index.qmd
    - about.qmd
    - register.qmd
    - privacy.qmd
    - tokushoho.qmd
    - en/**/*.qmd
    - landscape/**/*.qmd
    - casebook/*.qmd
    - learn/**/*.qmd
    - themes/*.qmd
    - news/*.qmd

# メニュー。scripts/build.py nav が作る。
metadata-files:
  - _sidebar.yml

lang: ja

# 章のページ右側に出る、PDFへのリンクの表示名
language:
  related-formats-title: PDFで読む
format-links:
  - format: typst
    text: PDFを開く
    icon: file-pdf

website:
  title: "Satellite to Decision"
  description: "地球観測データを、事業の意思決定へ。市場、ユースケース、解析の知識を、使う側の立場で整理します。"
  # 公開先のアドレス。独自ドメインにしたら書き換える（検索エンジン向けのサイトマップに使われる）
  site-url: "https://ssskobj-dev.github.io/eisei-kouza/"
  favicon: design/brand/icon.png
  # SNSなどで共有されたときに出る画像と説明
  open-graph:
    image: design/brand/og.png
  twitter-card:
    image: design/brand/og.png
    card-style: summary_large_image
  navbar:
    collapse-below: xl
    logo: design/brand/logo.svg
    logo-alt: "Satellite to Decision"
    left:
      - text: 市場ガイド
        href: landscape/index.qmd
      - text: ユースケース集
        href: casebook/index.qmd
      - text: 学習プログラム
        href: learn/index.qmd
      - text: 時事解説
        href: news/index.qmd
      - text: テーマから探す
        href: themes/index.qmd
    right:
      - text: このサイトについて
        href: about.qmd
      - text: 有料登録
        href: register.qmd
      - text: English
        href: en/index.qmd
  # 訪問者数の計測は design/analytics.html（Google Analytics 4）。
  # 下の cookie-consent で同意した人のブラウザでだけ動く。
  cookie-consent:
    type: express
    style: simple
    palette: dark
    policy-url: "https://ssskobj-dev.github.io/eisei-kouza/privacy.html"
    prefs-text: "クッキーの設定"
  # 各ページの本文の下に出る、有料登録のボタン
  body-footer: |
    <div class="s2d-register"><a class="s2d-button" data-s2d-register="page-bottom" href="/register.html">サイトに有料登録する</a></div>
  page-footer:
    center: "どの衛星会社にも解析会社にも属さない立場で書いています。"
    left:
      - text: "運営：Spacify合同会社"
        href: about.qmd
    right:
      - text: "プライバシーポリシー"
        href: privacy.qmd
      - text: "特定商取引法に基づく表記"
        href: tokushoho.qmd

format:
  html:
    # サイトのデザイン。色や見出しの形は design/site.scss で変える。
    theme:
      light: [cosmo, design/site.scss]
      dark: [darkly, design/site.scss, design/site-dark.scss]
    include-in-header: design/analytics.html
    include-after-body: design/track.html
    toc: true
    toc-title: このページの内容
    number-sections: false
  # 章ごとのPDF。ページ右側の「他の形式」から開ける。
  typst:
    papersize: a4
    mainfont: "Noto Sans CJK JP"
    toc: false
    # PDFのデザイン。色や見出しの形は design/typst-template.typ で変える。
    template-partials:
      - design/typst-template.typ
      - design/typst-show.typ
