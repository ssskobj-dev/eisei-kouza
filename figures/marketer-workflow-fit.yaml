# 「業務の流れのどこに入れ、何を決める材料にするか」の章の図。型は patterns/figures.md を参照。
# scripts/figures.py が、ここから figures/marketer-workflow-fit/<id>.svg を作る。

figures:
  - id: flow
    type: flow
    alt: 農地の現地確認に衛星を入れた後の流れ
    steps:
      - title: 一覧を作る
        text: 対象の地図データを用意
        who: human
      - title: 解析して分ける
        text: 4区分に色分けする
        who: satellite
      - title: 要確認を見回る
        text: 候補の農地だけ現地へ
        who: human
      - title: 抜き取り確認
        text: 不要判定の数%を見回る
        who: human
      - title: 確定して記録
        text: 判定は人が決める
        who: human

  - id: pairs
    type: split
    alt: 成果物と、それで決めること
    link: →
    left:
      title: 受け取る成果物
      items:
        - 4区分に色分けした地図とデータ
        - 点ごとの変動量と経緯グラフ
        - 現地調査候補箇所図
        - 沈下量の分布図と一覧表
    right:
      title: それで決めること
      items:
        - どの農地を見回るか
        - どの斜面から現地調査するか
        - 来年度の水準測量の路線
        - 省く範囲と抜き取りの対象
    note: 対にならない成果物は、受け取らないか、形を変えてもらう

  - id: pilot
    type: cards
    alt: 小さく試す範囲の決め方
    columns: 2
    items:
      - title: 期間
        text: 1〜2年。本導入の前に精度を確かめる
        mark: "1"
      - title: 範囲
        text: 向いた対象の一部。苦手な対象は後に回す
        mark: "2"
      - title: 評価
        text: 省く側から抜き取り、見逃しを数える
        mark: "3"
      - title: 本導入の条件
        text: 精度の数字と、関係者の合意を先に決める
        mark: "4"
