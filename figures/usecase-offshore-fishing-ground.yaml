# ユースケースの記事「沖合の漁場探しを、衛星の水温図で短くする」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、漁業者が行うこと
    link: ＋
    left:
      title: 衛星と解析が行う
      items:
        - 広い海の表面の水温を測る
        - 漁場になりそうな海域を予測する
        - 風と波の予測を届ける
    right:
      title: 漁業者が行う
      items:
        - 向かう海域と出漁を決める
        - 魚群を探して確かめる
        - 漁獲と水温を記録する
    note: 衛星が見ているのは魚の好む条件で、魚そのものではない

  - id: effect
    type: range
    alt: 利用者アンケートで答えられた効果の幅
    title: 利用者が答えた効果の幅（2018年）
    unit: "%"
    source: 漁業情報サービスセンター「スマート水産業と衛星利用」（2022年）。利用漁船452隻へのアンケート、回答150隻。計器で測った値ではない
    items:
      - label: 漁場を探す時間の短縮
        low: 15
        high: 33
      - label: 漁獲量の増加
        low: 10
        high: 25
      - label: 給油の削減
        low: 4
        high: 23

  - id: limits
    type: cards
    alt: この使い方の4つの限界
    columns: 2
    items:
      - title: 雲の下は見えにくい
        text: 光や赤外線で測る衛星は、雲があると海が見えない
        role: none
      - title: 沖合では通信が細い
        text: 大きなデータを自由に受け取れない
        role: none
      - title: 沿岸の赤潮は別
        text: 衛星データに求められる条件が厳しい
        role: none
      - title: 海の中は見えない
        text: 測るのは表面。中は数値モデルで補う
        role: none

  - id: flow
    type: flow
    alt: 出漁前と操業中に、水温図を見る手順
    steps:
      - title: 魚と水温を整理
        text: 好む水温の範囲
        who: human
      - title: 水温図と予測
        text: 出漁前に見る
        who: satellite
      - title: 海域を決める
        text: 出漁の判断も
        who: human
      - title: 船上で更新を見る
        text: 操業中に移動を判断
        who: satellite
      - title: 記録する
        text: 漁獲と水温
        who: human
