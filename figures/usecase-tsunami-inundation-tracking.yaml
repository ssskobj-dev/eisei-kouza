# ユースケースの記事「津波の後に残った水を、衛星データで日ごとに測る」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星が行う
      items:
        - 災害前後の画像から水に浸かった範囲を抜き出す
        - 県や市区町村ごとの面積を日を追って出す
    right:
      title: 人が行う
      items:
        - 排水ポンプの配置と排水の順番を決める
        - 水が引いた農地から除塩と復旧の計画を立てる
        - 水深、塩分、農地の損傷は現地で確かめる
    note: 衛星が出すのは水面の広がりと面積。排水の日数と復旧工法は現地と合わせて

  - id: bar
    type: bar
    alt: 宮城県の湛水面積の推移（だいちAVNIR-2による算出）
    unit: km²（県単位の算出値）
    source: JAXA「東日本大震災対応報告書」2.1.3.5 冠水・湛水（2011年）
    items:
      - label: 3月14日
        value: 109.09
      - label: 3月19日
        value: 64.68
      - label: 4月5日
        value: 22.28
      - label: 4月12日
        value: 14.21
      - label: 4月17日
        value: 7.61
      - label: 4月18日
        value: 4.28

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 雲の日は「0」と同じ
        text: 水が引いたのか見えないのか区別がつかない
        role: none
      - title: 最初の光学は3日後
        text: 沿岸の全域がそろったのは3月14日
        role: none
      - title: 2時期の比較に補正
        text: レーダーの入射角が違うと地形補正が要る
        role: none
      - title: 面積は観測日の値
        text: 日ごとに減るので観測の日付で変わる
        role: none
      - title: 水深と損傷は不明
        text: 塩分、がれき、土砂は現地で確かめる
        role: none

  - id: flow
    type: flow
    alt: 湛水面積の推移を、排水と復旧の計画に入れる手順
    steps:
      - title: 平時に地図を整える
        text: 農地と排水施設
        who: human
      - title: 面積を受け取る
        text: 地区ごと、日ごと
        who: satellite
      - title: 排水の順番を決める
        text: ポンプの配置
        who: human
      - title: 推移を追う
        text: 雲の日は欠けと扱う
        who: satellite
      - title: 現地で確かめる
        text: 水深、塩分、損傷
        who: human

  - id: scale
    type: scale
    alt: 効きやすい条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 排水区ごとの面積
        text: 県や市区町村の単位
      - title: 排水の進み方
        text: 数週間の推移
      - title: 1枚の水田の中
        text: 分解能10mでは粗い
      - title: 水深と塩分
        text: 画像からは出ない
