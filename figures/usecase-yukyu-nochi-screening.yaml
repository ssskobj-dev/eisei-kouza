# ユースケースの記事「遊休農地の調査で、現地に行く農地を衛星で絞る」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、農業委員会が行うこと
    link: ＋
    left:
      title: 衛星の解析が行う
      items:
        - 全部の農地に、耕作放棄の可能性の点数を付ける
        - 現地に行く農地の候補を絞る
    right:
      title: 農業委員会が行う
      items:
        - おそれのある農地を、一筆ごとに現地で見る
        - 遊休農地かどうかを判断する
        - 結果を台帳に戻す
    note: 画像の判定で済むのは、おそれがないと確実に言える農地だけ

  - id: limits
    type: cards
    alt: この使い方の4つの限界
    columns: 2
    items:
      - title: 可能性で、確定ではない
        text: おそれのある農地は、一筆ごとに現地で確かめる
        role: none
      - title: 狭い農地は難しい
        text: ごく小さな区画は「解析対象外」になる
        role: none
      - title: 果樹園と茶畑
        text: 衛星画像では見分けにくい
        role: none
      - title: 精度の基準に数字がない
        text: 通知が求めるのは「十分な水準」
        role: none

  - id: flow
    type: flow
    alt: 農地パトロールの前に、衛星の点数を入れる手順
    steps:
      - title: 地図と台帳
        text: 地番をそろえる
        who: human
      - title: 点数を付ける
        text: 衛星で解析
        who: satellite
      - title: 行く農地を決める
        text: 点数で線引き
        who: human
      - title: 現地で見る
        text: 結果と写真を登録
        who: human
      - title: 台帳に戻す
        text: 次の調査へ
        who: human

  - id: scale
    type: scale
    alt: 衛星の判定に向く農地から、向かない農地まで
    left: 判定しやすい
    right: 現地で見る
    items:
      - title: 広い田畑
        text: まとまった区画
      - title: 小さめの田畑
        text: 見回りが残りやすい
      - title: 果樹園、茶畑
        text: 見分けにくい
      - title: ごく小さな区画
        text: 解析対象外
