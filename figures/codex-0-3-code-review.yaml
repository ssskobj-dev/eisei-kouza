# 「コードの読み方とレビューの基本：書けなくても確かめられる」の章の図。型は patterns/figures.md を参照。
# scripts/figures.py が、ここから figures/codex-0-3-code-review/<id>.svg を作る。

figures:
  - id: blocks
    type: flow
    alt: コードを5つの塊に分けて読む
    steps:
      - title: 取る
        text: 衛星、段階、波長帯、倍率とずらし
        who: satellite
      - title: 選ぶ
        text: 雲と影、期間、範囲、座標
        who: satellite
      - title: 計算する
        text: 式の向き、分母、基準の値
        who: satellite
      - title: まとめる
        text: 欠けた値、画素の数と面積
        who: satellite
      - title: 出す
        text: 表の単位と件数、隠れた失敗
        who: satellite

  - id: flow
    type: flow
    alt: 全部を読まずに確かめる4つの手順
    steps:
      - title: 5つに区切る
        text: 境目に印を付ける
        who: human
      - title: 1行ずつ説明させる
        text: 何を入れて何を出すか
        who: satellite
      - title: 12項目を当てる
        text: 公式資料と突き合わせる
        who: human
      - title: もう一度書かせる
        text: 違う箇所がAIの補った箇所
        who: satellite
