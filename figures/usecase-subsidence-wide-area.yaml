# ユースケースの記事「地盤沈下の監視を、測量と衛星の組み合わせに変える」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、県が行うこと
    link: ＋
    left:
      title: 衛星の干渉解析が行う
      items:
        - 地盤の動きを面で捉える
        - 水準点のない場所の沈下を見つける
        - 過去にさかのぼって推移を調べる
    right:
      title: 県が行う
      items:
        - 幹線の水準測量を毎年続ける
        - 衛星の結果を水準測量で検証する
        - 地下水の規制と測量路線を決める
    note: 衛星は水準測量の代わりではなく、併用する位置付け（環境省のマニュアル）

  - id: area
    type: bar
    alt: 静岡県の地盤沈下調査の対象面積
    title: 静岡県の調査対象の面積（概数）
    unit: km²
    source: 静岡県の地盤沈下調査の資料（2024年度）
    items:
      - label: 衛星の導入前
        value: 100
      - label: 衛星の導入後
        value: 1380

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 測量なしでは精度を確かめられない
        text: 較差の標準偏差0.5cmが目安
        role: none
      - title: 観測の回数が足りないことがある
        text: だいち2号は年4回が基本
        role: none
      - title: 雨の日のデータは外す
        text: 水蒸気と降雨が信号を悪くする
        role: none
      - title: 植生の変化が大きい時期は向かない
        text: 被覆の変化が少ない時期を組む
        role: none
      - title: 測れるのは視線方向の動き
        text: 上下の量にするには補正が要る
        role: none

  - id: flow
    type: flow
    alt: 年次の地盤沈下調査に衛星を組み込む手順
    steps:
      - title: 路線を見直す
        text: 幹線は毎年、支線は数年に1回
        who: human
      - title: 解析を委託
        text: 衛星とシーン数を指定
        who: satellite
      - title: 測量で検証
        text: 較差を確かめる
        who: human
      - title: 分布図を受領
        text: 年間と累積の沈下量
        who: satellite
      - title: 規制を決める
        text: 次の年の計画
        who: human

  - id: scale
    type: scale
    alt: 衛星の解析が効く地域から、効きにくい地域まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 平野の市街地と農地
        text: 面で捉えやすい
      - title: 水準点の少ない地域
        text: 監視範囲を広げられる
      - title: 森林が多い地域
        text: 計測点が得にくい
      - title: 急な動き
        text: 短期の変動は読みにくい
