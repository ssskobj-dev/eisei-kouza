# 「精度の条件と、現地確認の役割」の章の図。型は patterns/figures.md を参照。
# scripts/figures.py が、ここから figures/marketer-accuracy-field-check/<id>.svg を作る。

figures:
  - id: conditions
    type: cards
    alt: 精度を決める3つの条件
    columns: 3
    items:
      - title: 測れた点の密度
        text: 都市部と山地で、測れる割合が大きく違う
        mark: "1"
      - title: 期間と枚数
        text: 枚数が増えるほど誤差が減る。1枚では粗い
        mark: "2"
      - title: 何と比べたか
        text: 水準測量、光波測量、現地確認。点の数も
        mark: "3"

  - id: two-stage
    type: flow
    alt: 二段構えの手順と、誰が行うか
    steps:
      - title: 全体を解析
        text: 同じ条件で面を見る
        who: satellite
      - title: 順位を付ける
        text: 動きや疑いの大きい順
        who: satellite
      - title: 抜き取り確認
        text: 省く側から数%を見回る
        who: human
      - title: 上位から確定
        text: 現地で判定する
        who: human
      - title: 点検は続ける
        text: 法定点検と水準測量
        who: human

  - id: split
    type: split
    alt: 衛星が担うことと、現地が担うこと
    link: ＋
    left:
      title: 衛星が担う
      items:
        - 全体を同じ条件で解析する
        - 動きや疑いの大きい順に並べる
        - 過去の傾向を示す
    right:
      title: 現地が担う
      items:
        - 抜き取りで精度を確かめる
        - 上位から現地で確定する
        - 法定点検と水準測量を続ける
    note: 衛星は「どこを詳しく見るか」を決める道具。点検の代わりではない
