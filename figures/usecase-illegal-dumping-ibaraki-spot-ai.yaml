# ユースケースの記事「不法投棄と残土の埋立ての疑いがある場所を衛星データとAIで拾う」の図。
figures:
  - id: split
    type: split
    alt: 衛星とAIに任せることと、職員が行うこと
    link: ＋
    left:
      title: 衛星とAIが行う
      items:
        - 新旧の画像を比べて変わった場所を拾う
        - 過去の不法投棄情報で学習し候補を出す
        - 県全域を一度に見る
    right:
      title: 職員が行う
      items:
        - 候補を事案の情報と台帳に突き合わせる
        - 現地で確かめる
        - 行為者を指導し、経路を組む
    note: 茨城県は分解能1.5mの光学衛星で実証。投棄かどうかは現地で決まる

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 小さな投棄は拾いにくい
        text: 分解能1.5m。数m四方は画素数個分
        role: none
      - title: 拾えるのは地表の変化
        text: 工事も造成も同じに写る。台帳と現地で
        role: none
      - title: 林の中と屋根の下は見えない
        text: 雲の日の画像は使えない
        role: none
      - title: 過去の事案の台帳が要る
        text: AIの学習と精度の評価の両方に
        role: none
      - title: 精度の数字は未公表
        text: 一致率、現地確認の結果は非公開
        role: none

  - id: flow
    type: flow
    alt: 地表の変化の抽出を監視パトロールに入れる手順
    steps:
      - title: 台帳を整える
        text: 事案と許可の位置
        who: human
      - title: 画像を手配
        text: 新旧2時期の光学
        who: satellite
      - title: 変化を抽出
        text: AIで一覧と地図
        who: satellite
      - title: 台帳と照合
        text: 許可外を残す
        who: human
      - title: 現地確認
        text: 結果を翌年に戻す
        who: human

  - id: scale
    type: scale
    alt: 衛星とAIの抽出が効く条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 開けた土地の広い変化
        text: 画素の数倍以上の広さ
      - title: 台帳が整っている
        text: 候補を減らして渡せる
      - title: 数m四方の投棄
        text: 1.5mでは画素数個分
      - title: 林の中、屋根の下
        text: 光学衛星では見えない
