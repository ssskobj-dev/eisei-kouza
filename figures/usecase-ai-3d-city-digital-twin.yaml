# ユースケースの記事「衛星データとAIで3Dの街を自動生成し、浸水の模擬を住民に見せる」の図。
figures:
  - id: split
    type: split
    alt: 衛星とAIに任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星とAIが行う
      items:
        - 高分解能の画像と標高データを取る
        - 建物の高さ、被覆、材質を推定する
        - 写実的な3Dの街を生成する
    right:
      title: 人が行う
      items:
        - 浸水の条件を決めて模擬を重ねる
        - 避難経路と訓練の内容を見直す
        - 測量や排水の情報で確かめる
    note: 3Dは「想定の街」。精度の数字は公表されていない

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 精度は未公表
        text: 誤差や一致率、検証の数字がない
        role: none
      - title: 側面と材質は推定
        text: 真上の画像からAIが補う。看板は除外
        role: none
      - title: 高分解能が前提
        text: トンガは15cm・30cmの有償画像
        role: none
      - title: 模擬は見せる映像
        text: 海面上昇の値や排水の扱いは不明
        role: none
      - title: 地下と構造は写らない
        text: 排水路、基礎、堤防の差は現地で
        role: none

  - id: flow
    type: flow
    alt: 3Dの街と浸水の模擬を、防災の啓発に入れる手順
    steps:
      - title: 場面を決める
        text: どの地区を誰に見せるか
        who: human
      - title: データを手配
        text: 高分解能画像と標高
        who: satellite
      - title: 3Dを生成
        text: AIで街の形を作る
        who: satellite
      - title: 模擬を重ねる
        text: 浸水の条件を決める
        who: human
      - title: 現地で照合
        text: 排水路と避難所
        who: human

  - id: scale
    type: scale
    alt: 3Dの街の自動生成が効く条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 3D地図のない地域
        text: 島の国、途上国の都市
      - title: 住民への啓発
        text: 浸水を見せて伝える
      - title: 建物ごとの判定
        text: 精度の数字がない
      - title: 設計・測量の根拠
        text: cm単位の精度が要る
