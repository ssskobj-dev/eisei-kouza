# ユースケースの記事「小規模森林のJ-クレジットを衛星データで安くできるか」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せたいことと、人と制度が決めること
    link: ＋
    left:
      title: 衛星データとAI補正で目指す
      items:
        - 森林の成長量を低コストで推定する
        - 航空レーザの間の年を埋める
        - 次の計測の時期を決める材料にする
    right:
      title: 人と制度が決める
      items:
        - 制度が認める計測で地位を確定する
        - 森林簿と計画図を現況に直す
        - 登録と審査の手続き
    note: 申請量を決めるのは制度が認める計測。衛星は見込みと計測の時期を決める材料

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 制度が認めていない
        text: 樹高の計測は地上か航空レーザ
        role: none
      - title: 精度は目標の段階
        text: 「航空レーザ並み」の達成報告はない
        role: none
      - title: 台帳が現況と合わない
        text: 森林簿と計画図のずれが最初の壁
        role: none
      - title: 林齢と樹種は分からない
        text: 計画の資料と航空写真が要る
        role: none
      - title: 審査の費用は下がらない
        text: 妥当性確認と検証は計測と別
        role: none

  - id: flow
    type: flow
    alt: 計画のモニタリングに、衛星の推定を入れる手順
    steps:
      - title: 台帳を直す
        text: 森林簿と計画図
        who: human
      - title: 地位を確定
        text: 地上か航空レーザ
        who: human
      - title: 成長量を推定
        text: 衛星とAI補正で毎年
        who: satellite
      - title: ずれを記録
        text: 推定と計測を比べる
        who: satellite
      - title: 次の計測を決める
        text: 時期と場所
        who: human

  - id: scale
    type: scale
    alt: 衛星の推定が効く条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 計測の間の年
        text: 成長の見込みを出す
      - title: 数十ha以上の人工林
        text: 計測の頻度が費用に効く
      - title: 数haの森林
        text: 審査の固定費が支配的
      - title: 今年の申請の確定値
        text: 制度が認めていない
