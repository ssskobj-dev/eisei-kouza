# ユースケースの記事「海洋保護区の候補を、無料の衛星データ地図で絞る」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星と解析が行う
      items:
        - 浅い海の底質を5mの画素で6つに分ける
        - 礁の地形を区分する
        - 世界の海域を同じ方法で比べられるようにする
    right:
      title: 人が行う
      items:
        - 地域の検証データで精度を確かめる
        - 潜水調査の地点を選ぶ
        - サンゴの健康と種を現地で調べる
        - 保護区の境界を決める
    note: 地図は無償。精度は地域で60〜90%と幅があり、現地の検証は省けない

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 水深10mまで
        text: 底質は10m、地形は15mまで
        role: none
      - title: 精度は60〜90%
        text: 地域で違う。20〜67%の検証例も
        role: none
      - title: サンゴと藻類は同じ区分
        text: 健康や種は分からない
        role: none
      - title: 濁った海は対象外
        text: 緯度30度より極側も対象外
        role: none
      - title: 画像は2018〜2020年
        text: その後の白化や台風は未反映
        role: none

  - id: flow
    type: flow
    alt: 保護区の区域案に地図を入れる手順
    steps:
      - title: 地図を切り出す
        text: 底質と地形
        who: satellite
      - title: 面積を集計
        text: 区分と地形ごとに
        who: human
      - title: 精度を確かめる
        text: 地域の検証データで
        who: human
      - title: 潜水地点を選ぶ
        text: 被度と種を調べる
        who: human
      - title: 区域案を比べる
        text: 保護される割合で
        who: human

  - id: scale
    type: scale
    alt: 衛星の地図が効く条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 調査の乏しい熱帯の海
        text: 澄んだ浅い海域
      - title: 国や地域の間で比べる
        text: 同じ基準の地図
      - title: サンゴの被度や健康
        text: 現地調査が要る
      - title: 濁った海、高緯度
        text: 緯度30度の外は対象外
