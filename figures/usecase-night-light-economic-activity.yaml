# ユースケースの記事「夜間光の衛星データで地域の経済活動を推計する」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星と解析が行う
      items:
        - 500m格子で夜の明るさの増減を面で見る
        - 日次のデータで統計より早くつかむ
        - 統計が粗い地域の動きを補う
    right:
      title: 人が行う
      items:
        - 店舗や事業所の位置データと重ねる
        - 増減の原因を現地や統計で確かめる
        - 政策の効果の判断と調査の設計
    note: 衛星は増減の当たりまで。原因と効果の判断は人が

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 光のない活動
        text: 農園や鉱山は土地被覆で補う
        role: none
      - title: 1店は見えない
        text: 500m格子の光はまとめた値
        role: none
      - title: 原因は分からない
        text: 減った理由は光だけでは不明
        role: none
      - title: NO2は山火事も
        text: 経済活動以外の影響が大きい
        role: none
      - title: 位置データの網羅性
        text: 公開の地図は店の一部
        role: none

  - id: flow
    type: flow
    alt: 統計の前に夜間光の増減を見る手順
    steps:
      - title: 取得する
        text: 日次の公開データ
        who: satellite
      - title: 日を選ぶ
        text: 月明かりと雲の品質の印
        who: satellite
      - title: 地域を分ける
        text: 店舗や事業所の位置と重ねる
        who: human
      - title: 増減を地図に
        text: 前年や前月との差と時系列
        who: satellite
      - title: 原因を確認
        text: 現地と統計で深掘りを決める
        who: human

  - id: scale
    type: scale
    alt: 効きやすい条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 商業地の前後比較
        text: 同じ格子の時間の変化
      - title: 位置データがある
        text: 業種の動きとして読める
      - title: 明かりの少ない活動
        text: 農園や鉱山は見えにくい
      - title: 1店の営業の有無
        text: 格子の値では分からない
