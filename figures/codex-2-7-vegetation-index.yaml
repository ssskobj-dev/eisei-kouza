# 「植生の指数：雲を除いて、区画ごとに平均する」の章の図。型は patterns/figures.md を参照。
# scripts/figures.py が、ここから figures/codex-2-7-vegetation-index/<id>.svg を作る。
# 値の目安は NASA Earth Observatory「Measuring Vegetation (NDVI & EVI)」による。

figures:
  - id: scale
    type: scale
    alt: 植生の指数の値の目安
    left: +1に近い（密な葉）
    right: 0以下（葉がない）
    items:
      - title: 0.8〜0.9
        text: 最も密な緑の葉
      - title: 0.6〜0.8
        text: 温帯と熱帯の森
      - title: 0.2〜0.3
        text: 低木と草地
      - title: 0.1以下
        text: 岩、砂、雪
      - title: 0
        text: 緑の葉がない

  - id: shadow
    type: split
    alt: 雲の影と生育不良の見分け方
    link: ⇔
    left:
      title: 雲の影
      role: none
      items:
        - 低い値が区画の境界と無関係
        - 雲の横にずれた帯の形
        - 同じ日の別の区画も同じ向き
        - 別の日には消える
    right:
      title: 生育不良
      role: human
      items:
        - 低い値が区画の形に沿う
        - 別の日にも同じ区画が低い
        - 除いた割合が低い
        - 現地で確かめて初めて言える

  # ---- 絵で見る図（講義動画でも使う）
  - id: leaf-light
    type: scene
    alt: 元気な葉は赤い光を吸い、近赤外の光を強く跳ね返すので、NDVIが高い（近赤外0.5、赤0.1で約0.67）。裸地は赤も近赤外もそこそこ返すので、NDVIが低い（近赤外0.44、赤0.36で0.10）
    height: 220
    between: vs
    panels:
      - title: 元気な葉：赤は吸い、近赤外は返す
        role: satellite
        sky: day
        ground: grass
        draw:
          - {icon: sun, x: 0.12, y: 0.15, size: 46}
          - {icon: satellite, x: 0.84, y: 0.14, size: 50}
          - {beam: [0.17, 0.25, 0.37, 0.50], style: solid, color: red}
          - {beam: [0.21, 0.20, 0.42, 0.40], style: solid, color: nir}
          - {beam: [0.56, 0.38, 0.78, 0.22], style: wavy, color: nir, head: true, amp: 5, step: 10}
          - {icon: leaf, x: 0.47, y: 0.60, size: 92, mood: happy}
          - {label: 赤はごくん, x: 0.17, y: 0.58, size: 13, color: red}
          - {label: 近赤外はポーン！, x: 0.70, y: 0.40, size: 13, color: nir}
          - {icon: gauge, x: 0.84, y: 0.66, size: 74, value: 0.67}
        items:
          - 近赤外0.5、赤0.1
          - （0.5−0.1）÷（0.5＋0.1）≒ 0.67
      - title: 裸地：どちらもそこそこ返す
        role: none
        sky: day
        ground: sand
        draw:
          - {icon: sun, x: 0.12, y: 0.15, size: 46}
          - {icon: satellite, x: 0.84, y: 0.14, size: 50}
          - {beam: [0.17, 0.25, 0.38, 0.76], style: solid, color: red}
          - {beam: [0.21, 0.20, 0.44, 0.76], style: solid, color: nir}
          - {beam: [0.46, 0.76, 0.74, 0.26], style: dashed, color: red, width: 2.5}
          - {beam: [0.51, 0.76, 0.78, 0.30], style: dashed, color: nir, width: 2.5}
          - {label: 赤も近赤外も、ほどほどに返す, x: 0.36, y: 0.90, size: 12.5, units: 16}
          - {icon: gauge, x: 0.84, y: 0.66, size: 74, value: 0.10}
        items:
          - 近赤外0.44、赤0.36
          - （0.44−0.36）÷（0.44＋0.36）＝ 0.10
    note: 近赤外の光は目に見えないので、仮に紫で描いた（本当は赤より波長の長い側の光）。出典：NASA Earth Observatory「Measuring Vegetation (NDVI & EVI)」。数字は説明のための作例

  - id: offset-trap
    type: scene
    alt: ずらしを直してから割ると、反射率0.5と0.1でNDVIは0.67。ずらしを直さずに画素の値6000と2000のまま割ると、差は4000で同じなのに和が8000に増え、0.50に縮む
    height: 210
    between: vs
    panels:
      - title: ずらしを直してから割る
        role: satellite
        sky: white
        ground: none
        draw:
          - {icon: leaf, x: 0.26, y: 0.46, size: 96, mood: happy}
          - {icon: gauge, x: 0.72, y: 0.44, size: 110, value: 0.67}
          - {label: 反射率 0.5 と 0.1, x: 0.5, y: 0.90, size: 14, units: 20}
        items:
          - 差0.4 ÷ 和0.6 ≒ 0.67
      - title: ずらしを忘れて割る
        role: human
        sky: white
        ground: none
        draw:
          - {icon: weight, x: 0.26, y: 0.25, size: 60, text: "+1000×2"}
          - {icon: leaf, x: 0.26, y: 0.60, size: 76, mood: sweat}
          - {icon: gauge, x: 0.72, y: 0.44, size: 110, value: 0.50, color: "#c2410c"}
          - {label: 画素の値 6000 と 2000 のまま, x: 0.5, y: 0.90, size: 14, units: 20, color: warm}
        items:
          - 差4000 ÷ 和8000 ＝ 0.50
          - 差は同じ。和だけ2000増えて、0に向かって縮む
    note: 作例。L2A（処理の版04.00以降）の反射率は（画素の値−1000）÷10000（ESA「S2 Products」）

  - id: scl-mixup
    type: scene
    alt: SCLで除くのは0、1、3（雲の影）、8と9（雲）、10（薄い雲）。4は植物なので残す。scl != 4 と書くと、植物だけを除いて、雲と影が残る
    height: 210
    between: vs
    panels:
      - title: 正しく：雲と影を除き、葉を残す
        role: satellite
        sky: day
        ground: grass
        draw:
          - {icon: cloud, x: 0.22, y: 0.22, size: 74}
          - {icon: tag, x: 0.22, y: 0.46, size: 46, text: "8・9", color: "#8a949c"}
          - {icon: shadow, x: 0.26, y: 0.80, size: 100}
          - {icon: tag, x: 0.26, y: 0.80, size: 40, text: "3", color: "#3a4250"}
          - {label: 除く, x: 0.38, y: 0.20, mark: cross, color: warm, size: 12, mark_size: 22}
          - {label: 除く, x: 0.43, y: 0.80, mark: cross, color: warm, size: 12, mark_size: 22}
          - {icon: leaf, x: 0.74, y: 0.62, size: 74, mood: happy}
          - {icon: tag, x: 0.74, y: 0.31, size: 44, text: "4", color: "#5aa553"}
          - {label: 残す, x: 0.64, y: 0.94, mark: check, color: satellite, size: 12, mark_size: 20}
        items:
          - 除く：0、1、3 影、8・9 雲、10 薄い雲
          - 4は植物。ここが主役
      - title: scl != 4：4だけを除いた
        role: human
        sky: day
        ground: grass
        draw:
          - {icon: cloud, x: 0.22, y: 0.22, size: 74}
          - {icon: tag, x: 0.22, y: 0.46, size: 46, text: "8・9", color: "#8a949c"}
          - {icon: shadow, x: 0.26, y: 0.80, size: 100}
          - {icon: tag, x: 0.26, y: 0.80, size: 40, text: "3", color: "#3a4250"}
          - {label: 残る, x: 0.44, y: 0.22, size: 13, color: warm}
          - {label: 残る, x: 0.50, y: 0.80, size: 13, color: warm}
          - {icon: leaf, x: 0.74, y: 0.62, size: 74, mood: surprised}
          - {icon: tag, x: 0.74, y: 0.31, size: 44, text: "4", color: "#5aa553"}
          - {label: 消える, x: 0.64, y: 0.94, mark: cross, color: warm, size: 12, mark_size: 20}
          - {label: えっ、ぼく？, x: 0.74, y: 0.13, size: 12, color: warm}
        items:
          - 葉が消えて、雲と影が残る
          - 茂った区画ほど使う画素が減る
    note: 出典：ESA「Sentinel-2 Level-2A ATBD」V2.10.0（SCL の番号）

  - id: zero-ghost
    type: scene
    alt: 区画の4画素のうち1画素が雲で除かれたとき、欠けのまま平均すると0.6が3画素で平均0.60。除いた画素を0で埋めると、0が紛れ込んで4画素で平均0.45に下がる
    height: 200
    between: vs
    panels:
      - title: 欠けのまま平均
        role: satellite
        sky: white
        ground: none
        draw:
          - {icon: leaf, x: 0.15, y: 0.36, size: 56, mood: happy}
          - {icon: leaf, x: 0.37, y: 0.36, size: 56, mood: happy}
          - {icon: leaf, x: 0.59, y: 0.36, size: 56, mood: happy}
          - {label: （欠け）, x: 0.83, y: 0.36, size: 13, color: gray}
          - {label: 0.6, x: 0.15, y: 0.62, size: 13}
          - {label: 0.6, x: 0.37, y: 0.62, size: 13}
          - {label: 0.6, x: 0.59, y: 0.62, size: 13}
          - {label: 数えない, x: 0.83, y: 0.62, size: 12, color: gray}
          - {label: 平均 0.60（3画素）, x: 0.5, y: 0.86, size: 18, units: 16}
        items:
          - 使った画素数と、除いた割合も表に出す
      - title: 除いた画素を0で埋めて平均
        role: human
        sky: white
        ground: none
        draw:
          - {icon: leaf, x: 0.15, y: 0.36, size: 56, mood: sweat}
          - {icon: leaf, x: 0.37, y: 0.36, size: 56, mood: sweat}
          - {icon: leaf, x: 0.59, y: 0.36, size: 56, mood: sweat}
          - {icon: ghost, x: 0.83, y: 0.36, size: 62, text: "0"}
          - {label: 0.6, x: 0.15, y: 0.62, size: 13}
          - {label: 0.6, x: 0.37, y: 0.62, size: 13}
          - {label: 0.6, x: 0.59, y: 0.62, size: 13}
          - {label: 紛れ込む, x: 0.83, y: 0.62, size: 12, color: warm}
          - {label: 平均 0.45（4画素）, x: 0.5, y: 0.86, size: 18, units: 16, color: warm}
        items:
          - 雲の多い区画ほど0が増え、順位が下がる
    note: 作例。（0.6×3）÷3＝0.60、（0.6×3＋0）÷4＝0.45
