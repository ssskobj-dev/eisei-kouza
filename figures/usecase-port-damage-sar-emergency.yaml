# ユースケースの記事「港湾施設の被災状況を衛星データで把握する」の図。
figures:
  - id: split
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星と解析が行う
      items:
        - 夜間や悪天候でも港湾を撮る
        - 前後の画像から変化した場所を抜き出す
        - 被害の疑いのある施設を一覧にする
    right:
      title: 人が行う
      items:
        - 点検班を送る施設の順番を決める
        - 移動量と損傷を現地で測る
        - 港の利用の可否を判断する
    note: 衛星で分かるのは「変わった場所」。動いた量と使えるかは現地

  - id: limits
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 移動の向きと距離は不明
        text: 変状は見えるが変位量は測れない
        role: none
      - title: 被害以外も検出
        text: 施設と重ねて読む作業が残る
        role: none
      - title: 結果まで数時間〜数日
        text: 指示、観測、受信にそれぞれ時間
        role: none
      - title: 災害時だけでは成り立たない
        text: 費用と体制の面で平時から
        role: none
      - title: 使えるかは現地で
        text: 段差、水深、荷役機械
        role: none

  - id: flow
    type: flow
    alt: 発災直後の点検計画に、衛星の変化検出を入れる手順
    steps:
      - title: 平時に準備
        text: 施設の位置と平常時の画像
        who: human
      - title: 緊急観測を要請
        text: 協定の経路か定期観測
        who: human
      - title: 変化を抽出
        text: 前後の画像の差分
        who: satellite
      - title: 点検の順番を決める
        text: 施設と重ねて読む
        who: human
      - title: 現地で測る
        text: 移動量と水深
        who: human

  - id: scale
    type: scale
    alt: 効きやすい条件から、効きにくい条件まで
    left: 効きやすい
    right: 効きにくい
    items:
      - title: 入れない間の当たり
        text: 警報中、離島
      - title: 広い港の優先順位
        text: 点検班の配分
      - title: 数時間以内の判断
        text: 結果が間に合わない
      - title: 移動量の計測
        text: 向きと距離は測れない
