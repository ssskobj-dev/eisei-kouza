# 「再現できる形で残す：あとから同じ結果を出せる記録」の章の図。型は patterns/figures.md を参照。
# scripts/figures.py が、ここから figures/codex-0-4-reproducible/<id>.svg を作る。

figures:
  - id: items
    type: cards
    alt: 記録に残す8項目
    columns: 4
    items:
      - title: 製品の名前
        text: 省略せずに全部。版と軌道と区画が入る
        role: human
      - title: 範囲
        text: 境界のファイルの名前と日付、座標の基準
        role: human
      - title: 期間
        text: 開始日と終了日。「最新」と書かない
        role: human
      - title: 処理の段階と版
        text: 段階の名前と、名前に入った版の番号
        role: human
      - title: 基準の値
        text: しきい値と、その出どころ
        role: human
      - title: 道具の版
        text: 名前と版の番号の一覧。AIの名前と日付
        role: human
      - title: AIへの指示文
        text: 全文と、返ってきたコードそのもの
        role: human
      - title: 人が確かめたこと
        text: 見た観点と結果。見ていない観点
        role: human

  - id: report
    type: split
    alt: 報告に書く2つのこと
    link: ＋
    left:
      title: AIが書いたこと
      items:
        - コードそのもの
        - 指示文の全文
        - 返ってきた説明
    right:
      title: 人が確かめたこと
      items:
        - 見た観点と、その結果
        - 見ていない観点
        - 答えの分かっている場所の値
