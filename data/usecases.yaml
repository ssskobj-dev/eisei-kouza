- 'no': 216
  name: 氷河湖の決壊リスクの順位付け
  theme: 環境・水
  field: 環境・気候
  stage: 研究
  region: 海外
  what: 山岳国の防災当局が、多数の氷河湖のうち先に調べる湖を、無償の衛星データで絞り込む。
  data: SAR（Sentinel-1）、光学（Sentinel-2）、衛星雨量
  buyer: 防災当局、水力発電の事業者
  example: コーネル大学など、2026年にヒマラヤで無償データを検証し、ネパールの47湖の監視リストを作成
  limits_2026: いつ決壊するかは当てられない。雪崩が引き金の決壊は天気に前兆が出ない。湖の水量は衛星で見えない。0.016〜0.05km²の小さな湖が近年の被害を起こしたが、中分解能では見落とす。雨季は雲で光学が使えない。
  service_example: 氷河湖の台帳づくりと点検計画に入れる。地形と雨量で順位を付け、上位の湖に現地調査と警報装置を回す。
  decision_data: 氷河湖ごとの危険度の順位と、湖の面積の変化。どの湖に警報装置を置くか、下流の発電所や橋の避難計画を作るかを決める。
  cost: 無償データだけで順位付けはできる、というのが論文の主張。費用は現地調査と警報装置の設置にかかる。小さな湖を追うための高分解能画像の金額は非公開。
  cost_source_url: ''
  source_title: 'Which Site, and When: A Free-Satellite-Data Test of Himalayan Glacial Lake Bursts, Landslides, and Ice Floods'
  source_url: https://arxiv.org/abs/2608.12422
  source_type: 論文
  verified: true
