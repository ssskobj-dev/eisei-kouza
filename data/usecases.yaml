  decision_data: 海藻・海草の分布図、蓄積量の推定、生育に向く場所の地図。どこに藻場を造るか、どこを潜って確かめるかを決める。
  cost: 費用は有償画像（PlanetScopeなど）、現地調査、解析にかかる。目的別のプランがあるが金額は非公開。Landsat-8の無償データも使うが、それだけでは細かさが足りない。
