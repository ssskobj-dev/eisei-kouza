  buyer: 河川・ダムの管理者、水文の研究者
  example: NASA JPL、SWOTでオハイオ川流域の湖の水位を2023年7月〜2024年11月に計測し公開
  limits_2026: 同じ場所の観測は21日に1回以上にとどまり、洪水の時間変化は追えない。川は幅約100m以上が対象で、貯水池の分解能は250m。乾季の水位は取りにくい。水量の推定は開発中で、現地の水位計での補正が要る。
  service_example: 流域の水収支の把握に入れる。水位計のある地点で補正し、計器のない貯水池の水位の傾向を月単位で追う。
  decision_data: 湖と川の区間ごとの水位と水面の広がりの一覧。どこに水位計を増やすか、上流の貯留の状況を放流計画に入れるかを決める。
  cost: データは無償で公開されている。費用は、大量のデータを処理する計算環境と、現地の水位計での検証にかかる。商用のサービスとしての金額は確認できなかった。
