  name: 鉱滓ダムの変位の監視
  theme: 環境・水
  field: 環境・気候
  stage: 研究
  region: 海外
  what: 鉱山会社や監督当局が、鉱滓ダムの堤体の変位を衛星で追い、崩壊の前兆を拾う。
  data: SAR（Sentinel-1のInSAR）
  buyer: 鉱山会社、保険会社、監督当局
  example: ノッティンガム大学など、ブラジルのブルマジーニョの崩壊（2019年）の前の変位を事後に解析
  limits_2026: 解析は崩壊の後に行ったもので、実際の運用での検証はない。観測は12日おき、分解能は20m。植生や水面では測れず、衛星に対して南北の向きの動きは捉えにくい。急な崩壊は観測の間に起こりうる。
  service_example: 鉱滓ダムの定期点検に入れる。衛星で変位が速まった区画を拾い、地上の計器と目視の点検をそこに集める。
  decision_data: 堤体の地点ごとの変位の時系列と、速度が変わった時期。操業を止めるか、下流の避難計画を動かすかを判断する。
  cost: Sentinel-1は無償で、解析できれば成り立つ。費用は、InSARの解析の委託か専門人材にかかる。金額の公開情報はない。細かく見るための高分解能SARは有償で、金額は非公開。
