  name: 自治体の広域地盤沈下の監視
  theme: インフラ・建設
  field: インフラ維持管理
  stage: 商用
  region: 国内
  what: 自治体の環境部局が、水準測量の負担を減らすため、SARで地盤高の変化を面で観測する。
  data: LバンドSAR（ALOS-2、ALOS-4）の干渉解析
  buyer: 都道府県・市の環境部局
  example: 環境省（日本、2026年3月）、地盤沈下観測の衛星活用マニュアルを改訂しALOS-4の情報を追加
  limits_2026: 改訂の発表に精度や費用の数値はない。SARが測るのは衛星の視線方向の動きで、基準になる水準測量やGNSSとの組み合わせが要る。植生の濃い場所は計測点が得にくい。
  service_example: 毎年の地盤沈下調査で、水準測量の路線の間を衛星で埋め、測量する路線を絞る工程に入れる。
  decision_data: 市域全体の年間の沈下量の地図。水準測量を続ける路線と、地下水の採取規制を見直す地域を決める。
  cost: 金額は非公開。主に解析の委託費。マニュアルはALOS-2とALOS-4を挙げており、無償のSentinel-1で足りるかは発表からは確認できない。
  cost_source_url: ''
