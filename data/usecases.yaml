- 'no': 215
  name: ハイパースペクトルの鉱物同定
  theme: エネルギー・資源
  field: 鉱業・資源
  stage: 研究
  region: 海外
  what: 資源会社が、試錐の位置を絞るために、ハイパースペクトル衛星で鉱物の種類と組成の分布を地図にする。
  data: ハイパースペクトル（EnMAP、30m）
  buyer: 資源会社、探鉱会社、地質調査機関
  example: 独GFZ（2025年）がチリ、イラン、米国マクダーミットのリチウム鉱床など8地域でEnMAPを検証
  limits_2026: 露岩地に限られ、植生や土に覆われた所は使えない。画素は30mで細い脈は拾えない。見えるのは地表だけで、深部の鉱体は推定になる。
  service_example: 探鉱の絞り込みから試錐の計画までに入れ、変質の分帯と流体の通り道を読んで、掘る位置の候補を出す。
  decision_data: 白雲母、カオリナイト、明ばん石など約20鉱物の分布と組成の地図。どこを試錐の候補にし、どこを外すかを決める。
  cost: EnMAPは研究用の政府衛星で、申請により無償で使える。Sentinel-2やLandsatでは波長の数が足りない。費用は解析の専門人材。金額は非公開。
