  region: 海外
  what: 海域の管理者や研究者が、洋上の開発の実態を知るために、SARで風車や石油施設の位置を拾う。
  data: SAR（Sentinel-1）、光学（Sentinel-2、10m）
  buyer: 海洋空間計画の担当、エネルギー当局
  example: Global Fishing Watchが2021年末時点で約2.8万基の洋上構造物を地図化（Nature、2024年）
  limits_2026: 岸から1km以内は分類の対象外。海氷のある極域は誤検出が多く除外。分かるのは位置と種別までで、稼働中か廃止済みかは分からない。
  service_example: 海洋空間計画や洋上風力の区域選定で、既存の構造物と船の活動を重ねて競合を洗い出す工程に入れる。
  decision_data: 構造物の位置、種別（風車、石油、その他）、設置時期の一覧。新しい区域の候補から外す範囲を決める。
  cost: 無償のSentinel-1/2だけで成り立つ。費用は全球を処理する計算基盤と学習データの整備。成果のデータは公開されている。金額は非公開。
  cost_source_url: ''
  source_title: Satellite mapping reveals extensive industrial activity at sea（Nature, 2024）
  source_url: https://www.nature.com/articles/s41586-023-06825-8
  source_type: 論文
