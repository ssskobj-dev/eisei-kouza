  limits_2026: 精度の数字は公開されていない。衛星で分かるのは面積と樹冠の変化で、炭素量は現地調査で補正する。水田の湛水は稲が茂ると光学では見えず、SARが要る。認証機関の方法論が認める範囲に限られる。
  service_example: クレジット事業の企画段階に入れる。候補地の過去の森林変化を調べ、プロジェクト設計書の解析の章に使う。
  decision_data: 候補地ごとの森林変化の履歴、伐採リスク、地上部バイオマスの推定値。どの土地で事業を起こすかを決める。
  cost: 金額は非公開。受賞資料は「低コスト」とするが数字はない。面積変化は無償データで成り立つ。費用は解析の人件費と、認証に必要な現地調査にかかる。
