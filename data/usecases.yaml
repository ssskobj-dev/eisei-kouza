  theme: 防災
  field: 防災・災害対応
  stage: 商用
  region: 国内
  what: 河川管理者が排水ポンプ車の配置を決めるため、夜間・雨天でもSARで浸水範囲を把握する。
  data: SAR（だいち2号。緊急観測）
  buyer: 国土交通省の地方整備局、自治体
  example: 国土交通省とJAXA、2023年6月の台風2号。18時要請、23時44分観測、翌2時40分に結果を受領。
  limits_2026: 衛星が通る時刻まで観測できず、この例でも要請から提供まで約8時間40分。判読は概ね50m四方以上の浸水が目安とされ、建物が密集する市街地や田植え期の水田は見分けにくい。
  service_example: 水害時の初動で、ヘリ調査の前に浸水の広がりをつかみ、翌朝の排水作業計画と調査班の行き先を決める工程に入れる。
  decision_data: 推定浸水範囲の地図と浸水面積。面積から排水量を概算し、排水ポンプ車の台数と配置、ヘリの調査ルートを決める。
  cost: 防災機関はJAXAの緊急観測を使う形で、金額は非公開。無償のSentinel-1でも浸水域は抽出できるが、観測日を選べず初動には間に合わないことが多い。
  cost_source_url: ''
