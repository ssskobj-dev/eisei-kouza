  theme: 環境・水
  field: 環境・気候
  stage: 商用
  region: 国内
  what: 気象庁と自治体が、静止気象衛星の観測を予測モデルに取り込み、黄砂や煙の飛来の予測を良くする。
  data: 気象衛星（ひまわり8号・9号）
  buyer: 気象庁、自治体、健康・交通の事業者
  example: 気象庁・JAXA・九州大学、2020年1月にひまわりのデータを使う黄砂解析予測図の提供を開始
  limits_2026: 雲の下と夜間は、可視光でエアロゾルを測れない。予測誤差の約29%改善は、2016年の森林火災の煙の1事例の数字。衛星が見るのは気柱全体の濁りで、地上の濃度はモデルで推定する。
  service_example: 自治体の注意喚起や、学校・屋外作業の判断に入れる。3日先までの予測図を見て、飛来の前日に知らせを出す。
  decision_data: 3時間ごとの黄砂の分布と、3日先までの予測図。注意喚起を出すか、屋外の行事や作業を変えるかを決める。
  cost: 予測図は気象庁が無償で公開している。ひまわりのデータも無償。費用は、自社の業務システムに取り込む開発にかかる。独自の予測を作る場合の金額は非公開。
