  name: 尾鉱ダムの変位の監視
  theme: エネルギー・資源
  field: 鉱業・資源
  stage: 研究
  region: 海外
  what: 鉱山会社や規制当局が、決壊の前兆をつかむために、干渉SARでダム堤体の変位速度を面で追う。
  data: SAR（Sentinel-1、干渉SAR、12日ごと）
  buyer: 鉱山会社、規制当局、保険会社
  example: ノッティンガム大学など（2021年）がブラジル・ブルマジーニョのダム決壊前の変位を事後に解析
  limits_2026: 12日ごとの観測より速い崩壊は捉えられない。植生や水面では測点が減る。見えるのは視線方向の動き。事後の解析で、運用中の予測が当たった例ではない。
  service_example: ダムの安全管理に入れ、現地の計器を補う面的な監視として、加速の兆しがある箇所を点検の対象に挙げる。
  decision_data: 堤体の測点ごとの変位速度（年数mm級）と累積変位の時系列。臨時の点検、水位の引き下げ、下流への警戒を判断する。
  cost: 無償のSentinel-1で成り立つ（この研究も無償データ）。費用は時系列の解析と専門家の判読。より頻度や分解能が要るなら商用SAR。金額は非公開。
  cost_source_url: ''
  source_title: Advanced analysis of satellite data reveals ground deformation precursors to the Brumadinho Tailings Dam collapse
  source_url: https://link.springer.com/10.1038/s43247-020-00079-2
  source_type: 論文
  verified: true
