  buyer: 都道府県の環境・残土対策の部局
  example: 千葉県（日本）、衛星画像で不適正盛土を監視し、計画外の森林伐採を見つけて是正を指導
  limits_2026: 県は衛星の種類、頻度、件数を公表していない。東京都の検証では、SARで検出できる盛土は約50m×100mまでで、盛土以外の地表の変化も拾う。
  service_example: 許可事業場の監視と無許可の埋立ての発見に入れ、変化が出た場所に職員が立入調査する。
  decision_data: 土地改変の疑い箇所の位置と前後の画像。立入調査と事業者への指導の対象を決める。
  cost: 金額は非公開。衛星の種類が非公表で、無償データで成り立つかは確認できない。佐賀県の実証は無償データ中心の構成だった。
