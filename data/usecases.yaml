- 'no': 1
  name: 遊休農地調査の絞り込み
  slug: yukyu-nochi-screening
  theme: 農業・食料
  field: 農業
  stage: 商用
  region: 国内
  what: 農業委員会が、利用状況調査で現地に行く農地を減らすため、衛星で耕作放棄の可能性を筆ごとに点数化する。
  data: 光学の時系列＋農地区画（衛星名は出典に記載なし）
  buyer: 市町村、農業委員会
  example: サグリ「アクタバ」、国内、令和7年度に20以上の自治体で本運用。調査対象農地を40%削減（同社掲載値）。
  limits_2026: 出るのは耕作放棄の可能性で、確定ではない。狭小な農地、果樹園、茶畑は判定が難しい。農地区画のデジタル地図と台帳の地番の統一が前提。作物の判定は対象外。
  service_example: 農地利用状況調査の事前準備に入れ、放棄地率の高い筆だけを調査員に割り当てる。結果はタブレットで登録し台帳に戻す。
  decision_data: 筆ごとの耕作放棄地率の地図と一覧。どの筆を現地で見るか、調査員を何人何日出すかを決める。
  cost: 年間のシステム利用料が中心。平均で年約100万円（税別）、初期費用なし、市町村により変動（事業者の掲載値）。解析に使う衛星は出典に記載がなく、無償データだけで成り立つかは不明。
  cost_source_url: https://www.maff.go.jp/j/kanbo/dx/attach/pdf/eisei-5.pdf
  source_title: 農林水産省「衛星活用サービス集」
  source_url: https://www.maff.go.jp/j/kanbo/dx/attach/pdf/eisei-5.pdf
