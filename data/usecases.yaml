  name: 沖合漁場の探索
  slug: offshore-fishing-ground
  theme: 水産・海洋
  field: 水産・養殖
  stage: 商用
  region: 国内
  what: 沖合の漁船が、魚群を探す時間と燃油を減らすため、衛星の水温や海色から作った海況図と予測漁場図を船上で見る。
  data: 熱赤外・海色・マイクロ波（しきさい、しずく、ひまわり）
  buyer: 漁業者、漁業会社、漁協
  example: 漁業情報サービスセンター「エビスくん」、国内、2008年開始。452隻が利用。燃油4〜23%削減の調査結果。
  limits_2026: 赤外の水温は雲の下が見えない。沖合では通信が最大の制約で、重いデータは送れない。沿岸の赤潮などは要求が厳しく、同じデータでは足りないとされる。
  service_example: 出漁前と操業中の漁場選びに入れる。水温の境目（潮目）と予測漁場図で向かう海域を決める。
  decision_data: 日々の海面水温図、潮流、波、予測漁場図。どの海域へ向かうか、出漁するかを決める。
  cost: 元の衛星データは公的機関の無償データ。費用は情報サービスの利用料と船の通信費にかかる。利用料は出典に記載がなく、金額は非公開。
  cost_source_url: ''
  source_title: スマート水産業と衛星利用（JAFICにおけるスマート水産業の取組みと衛星データの活用）
