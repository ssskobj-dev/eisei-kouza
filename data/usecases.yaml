  name: 大型動物の個体数の計数
  theme: 環境・水
  field: 生物多様性
  stage: 研究
  region: 海外
  what: 保護区の管理者が、航空機を飛ばさずに、広い範囲のゾウの数を衛星画像とAIで数える。
  data: 超高分解能光学（WorldView-3）
  buyer: 保護区の管理者、自然保護団体
  example: バース大学・オックスフォード大学など、南アフリカのアド・エレファント国立公園で検証（2021年）
  limits_2026: 数えられるのは、数十cmの画像で形が分かる大型の動物に限られる。木の下にいる個体は写らない。雲があると撮れない。動物は動くので、撮影した時刻の数しか分からない。精度は人の目視と同程度とされる。
  service_example: 保護区の個体数調査に入れる。航空機での調査の合間に衛星画像を買い、国境をまたぐ群れの数を数える。
  decision_data: 画像ごとの検出位置と頭数。保護区の頭数の傾向から、密猟対策の人員の配置や、群れの移送を決める。
  cost: 金額は非公開。数十cmの有償画像が必要で、無償の10m画像では成り立たない。費用は画像の購入が中心で、対象の面積が広いほど増える。検出モデルの学習データも要る。
  cost_source_url: ''
  source_title: Counting elephants from space（Belgian Earth Observation）
  source_url: https://eo.belspo.be/en/news/counting-elephants-space
  source_type: 研究機関の報告
  verified: true
