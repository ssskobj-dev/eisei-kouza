  name: 海に浮かぶごみの帯の検出
  theme: 環境・水
  field: 環境・気候
  stage: 研究
  region: 海外
  what: 海洋ごみ対策の当局が、ごみが集まる海域と時期を衛星で把握し、流出源の対策や回収を決める。
  data: 光学（Sentinel-2）
  buyer: 環境当局、国際機関、清掃の団体
  example: ESAとカディス大学など、地中海の6年分・約30万枚の画像から、ごみの帯を数千本検出（2024年）
  limits_2026: 10mの画像で見えるのは、数十mの幅でごみが密に集まった帯だけ。多くは長さ1km以上で、短い時間で消える。散らばったごみや沈んだごみ、マイクロプラスチックは見えない。材質の判別もできない。
  service_example: 海洋ごみの発生源の調査に入れる。帯が多く出る海域と季節を地図にし、近くの河口や都市の対策の優先度を付ける。
  decision_data: ごみの帯の位置と長さ、出現の頻度の地図。どの河川の流域で対策をするか、回収船をどの海域に出すかを決める。
  cost: Sentinel-2の無償データで成り立つ。費用は大量の画像の処理と検出モデルの開発にかかる。金額の公開情報はない。約1mのものを見分ける専用の小型衛星は構想の段階。
  cost_source_url: ''
  source_title: Monitoring marine litter from space is now a reality（ESA）
  source_url: https://www.esa.int/Enabling_Support/Space_Engineering_Technology/Monitoring_marine_litter_from_space_is_now_a_reality
