  what: ゴルフ場の管理者が、水を節約するため、フェアウェイの土壌水分を衛星で毎日推定して散水を決める。
  data: 複数衛星の融合による土壌水分（3m・毎日を目標）
  buyer: ゴルフ場、ゴルフ団体
  example: 北欧のゴルフ研究財団STERFが米ノースカロライナ州立大などに委託（米国・ノルウェー、2026〜28年）。
  limits_2026: 2026年3月に始まったばかりで結果はまだない。出典は「今の衛星の分解能は芝の管理に足りない」ことを動機に挙げる。グリーンは数百m²で、3mでも粗い。
  service_example: （仮）コース管理者の朝の散水計画に入れ、水収支モデルと合わせて、その日に水をまく区画を決める。
  decision_data: フェアウェイの日ごとの土壌水分の地図。区画ごとの散水量と、散水を見送る日を決める。
  cost: 研究費は3年で総額451,303ユーロ（うちR&Aが249,525ユーロ）。商用化後の料金は未定。無償データだけで3m・毎日が出せるかは未公表。
