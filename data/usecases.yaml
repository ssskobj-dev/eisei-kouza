  name: 水災の保険金支払いの迅速化
  theme: 保険・金融
  field: 保険
  stage: 商用
  region: 国内
  what: 損害保険会社が保険金を早く払うため、SAR画像とAIで浸水範囲と浸水高を推定し、契約者の所在地と照合する。
  data: SAR（主）、光学、標高データ、過去の支払実績
  buyer: 損害保険会社
  example: 東京海上日動、2017年7月から実証。被害の連絡がない契約者を見つけて請求を案内し、支払いに至った例がある。
  limits_2026: 支払い基準は床上浸水または地盤面から45cm以上で、この境目を衛星だけで判定するのは難しい。解析の精度と速さは両立しにくい。光学は雲があると使えない。短縮できた日数は非公表。
  service_example: 大規模水害の直後に、浸水した契約物件の一覧を作り、立会調査の要否の振り分けと、未請求の契約者への案内に使う。
  decision_data: 契約物件ごとの推定浸水高と、支払い対象の見込みの一覧。調査員を送る物件、書面だけで払う物件、請求を案内する先を決める。
  cost: 解析の委託と自社システムへの組み込みに費用がかかり、金額は非公開。商用SARを新たに撮る場合の参考として、Umbraの公開価格は1m・5km四方で675ドル。
