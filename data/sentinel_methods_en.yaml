# data/sentinel_methods.yaml の英語版。英語のページ（en/learn/sentinel.qmd）に使う。
# 手法の id と、ユースケースの割り当て（cases）は日本語版のものを使う。ここには英語の文だけを書く。
# 日本語版を直したら、ここも合わせて直す。

satellites:
  - name: Sentinel-1
    kind: Radar (C-band SAR)
    sees: Surface roughness, water, ships and ground motion. Works at night and through cloud
    spec: In the main land mode, a 250 km swath at 5 m × 20 m resolution. One satellite repeats every 12 days, two satellites every 6 days\[1\]
  - name: Sentinel-2
    kind: Optical
    sees: Vegetation health, shorelines, land use, burn scars and snow
    spec: 13 spectral bands at 10 m, 20 m and 60 m resolution. Two satellites revisit every 5 days at the equator\[2\]
  - name: Sentinel-3
    kind: Ocean and land colour, temperature
    sees: Colour of seas and lakes (phytoplankton, algal blooms), sea and land surface temperature
    spec: The colour instrument has 21 bands at 300 m resolution. The temperature instrument measures thermal infrared at 1 km\[3\]
  - name: Sentinel-5P
    kind: Atmosphere
    sees: Nitrogen dioxide, methane, carbon monoxide, sulphur dioxide, ozone and other gases
    spec: A 2,600 km swath gives near-daily global coverage. Each pixel is several kilometres across\[4\]

methods:
  sar-change:
    name: Before-and-after comparison of radar images
    satellite: Sentinel-1
    answers: Where did the surface change after a disaster or construction work?
    examples: Flood extent, oil slicks, avalanche debris, timing of paddy flooding
    steps:
      - Pair images from before and after the event, taken from the same orbit direction
      - Smooth the speckle noise in the images
      - Take the ratio of brightness before and after, and flag pixels above a threshold as changed
      - Remove permanent water, steep slopes and small isolated pixels
    weak:
      - Flooding in built-up areas tends to be underestimated\[5\]
      - The threshold is set by trial and error and needs tuning for each area\[5\]
      - Changes that appear and vanish between two passes are missed
  insar:
    name: InSAR (measuring ground motion)
    satellite: Sentinel-1
    answers: Where is the ground or a structure moving, and how fast?
    examples: Land subsidence, displacement of dams and embankments, estimating damage extent after an earthquake
    steps:
      - Collect many images of the same place taken under the same conditions
      - Use the phase difference between two images to tell whether the surface moved towards or away from the satellite
      - Stack several years of data and build a displacement time series for each stable reflecting point
      - With both ascending and descending orbits, split the motion into vertical and east-west components\[7\]
    weak:
      - North-south motion cannot be measured\[7\]
      - Results can be unreliable during snow cover\[7\]
      - In steep terrain, some places cannot be measured\[7\]
      - Using a drop in similarity between two images as a sign of damage also picks up snow, vegetation and construction
  optical-index:
    name: Optical indices and time series
    satellite: Sentinel-2
    answers: Where are vegetation, water, snow or burn scars, and how did they change?
    examples: Crop and forest condition, dieback detection, shoreline change, snow extent, burn severity
    steps:
      - Select cloud-free images
      - Combine two bands into an index. Red and near-infrared for vegetation, near-infrared and shortwave infrared for burn scars
      - Take the difference between before and after, or against the same season of the previous year
      - Classify by the size of the difference. For burn severity, a practice using the USGS classification is published\[6\]
    weak:
      - Cloud hides the surface
      - Other causes such as logging or windthrow produce the same signal
      - Accuracy is best checked with a field assessment\[6\]
  classify:
    name: Classification with machine learning
    satellite: Sentinel-1, Sentinel-2
    answers: What is at this location (crop type, forest or farmland, presence of an installation)?
    examples: Checking declared crops, land cover maps, deforestation alerts, mapping solar panels
    steps:
      - Prepare reference data (field surveys, declared parcels, interpretation of finer imagery)
      - Extract seasonal patterns from a year of images
      - Train a model on the reference data and classify the whole area
      - Check accuracy against reference data not used for training
    weak:
      - With 10 m pixels, small or narrow parcels are hard to classify
      - Objects that look different from the training data are missed
      - The quality of the reference data limits the quality of the result
    note: A global 10 m land cover map based on both radar and optical data is publicly available\[8\]
  detect:
    name: Detecting objects at sea
    satellite: Sentinel-1 (supported by Sentinel-2)
    answers: Where are ships or structures, and how many?
    examples: Vessels not broadcasting their position, icebergs, offshore structures, estimating oil tank inventories
    steps:
      - Pick out points that return a stronger radar signal than the sea surface
      - Remove land, known structures and noise
      - Match against vessel position data (AIS) and keep unmatched points as candidates
    weak:
      - Small vessels are easily missed
      - Areas close to shore may be excluded
      - The result is a list of candidates. It does not show whether an activity is illegal
  water-color:
    name: Estimating water quality from water colour
    satellite: Sentinel-3, Sentinel-2
    answers: Where are plankton, algal blooms or turbidity spreading in a lake or sea?
    examples: Algal bloom monitoring, reservoir turbidity, aquaculture decisions
    steps:
      - Remove the effect of the atmosphere on colour
      - Estimate the amount of phytoplankton or cyanobacteria from water colour
      - Compare with water samples taken on site
    weak:
      - At 300 m resolution, small lakes and rivers cannot be measured
      - Cloud leaves gaps
      - The result is an indication of abundance. Toxin levels cannot be measured
  atmosphere:
    name: Mapping gases in the atmosphere
    satellite: Sentinel-5P
    answers: Where are gas concentrations high, and how do they change over time?
    examples: Nitrogen dioxide across a city, emissions from ships
    steps:
      - Collect cloud-free values from daily observations
      - Average over a long period to make a finer map
      - Compare with ground monitoring stations
    weak:
      - Pixels are several kilometres across, so differences between roads are not visible
      - The measurement is the total amount in the air column, not the concentration at ground level
      - One observation per day, with gaps under cloud
  combined:
    name: Combining several data sources
    satellite: Several Sentinel satellites and other data
    answers: Questions that one satellite alone cannot answer
    examples: Glacial lake outburst risk, offshore wind estimates, early warning of disease, school teaching materials

