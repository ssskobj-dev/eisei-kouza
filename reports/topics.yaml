# 市場レポートのテーマ（ユースケース）。ここに書いた順に、上から作られる。
#
# 書き方：name に日本語の名前を書くだけ。id（英字の短い名前）は、最初に作るときに自動で付く。
#   memo  ：こだわりたい点、入れてほしい事例、外したい内容（任意）
#   angles：作る切り口を絞りたいときだけ書く（書かなければ全部の切り口を作る）
#   skip  ：true にすると、そのテーマは飛ばす
#
# 1つのテーマにつき、切り口は8つ（patterns/report_angles.yaml）。1日2本なので、1テーマは4日で終わる。
# 週10本を続けるには、5週間で6テーマ強が必要。

topics:
  - name: インフラ・地盤監視
    id: infra
    memo: 道路、鉄道、ダム、埋立地、上下水道。測量会社や建設コンサルが関わる領域

