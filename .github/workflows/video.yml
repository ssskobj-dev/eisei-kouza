# 動画を作ってYouTubeに投稿する。
# 考え方：main にある台本（video/<id>/script.yaml）のうち、まだ投稿していないもの（youtube.json が無いもの）を
#         見つけて、作って、投稿する。マージのされ方（人・自動）に関係なく、取りこぼさない。
#
# 3つの動かし方：
#  (1) 毎時の見回り（schedule）：未投稿の台本を最大4本まで作って投稿する。残りは次の見回りで
#  (2) main への push：台本が増えたら、すぐ同じ見回りをする
#  (3) 手動（workflow_dispatch）：動画のid・公開範囲・チャンネルを指定して1本だけ作る（投稿済みでもやり直せる）
#
# チャンネルと公開範囲（見回りのとき）：
#  - フォルダ名が -en で終わる台本 → 英語チャンネル（Secret は YT_*_EN）
#  - それ以外                     → 日本語チャンネル（Secret は YT_*）。声は video/voices.yaml から動画ごとに自動で選ぶ（Style-Bert-VITS2）
#  - 公開範囲は public
#  - 台本に publish: false と書いてあるものは投稿しない（試作など）
#
# 投稿が終わるたびに youtube.json 等を main に書き戻すので、途中で落ちても二重投稿にならない。
name: video

on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - "video/*/script.yaml"
  workflow_dispatch:
    inputs:
      video_id:
        description: "動画のid（例：usecase-chusankan-patrol）"
        required: true
      privacy:
        description: "unlisted（限定公開）、private、public"
        default: public
      channel:
        description: "投稿先：ja（日本語）または en（英語）"
        default: ja

permissions:
  contents: write

# 動画の実行は1つずつ（同時に走らせない。見回りと push が重なっても順番に処理）
concurrency:
  group: video-publish
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: 作る動画を決める
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            vid="${{ github.event.inputs.video_id }}"
            echo "pairs=$vid:${{ github.event.inputs.channel }}:${{ github.event.inputs.privacy }}" >> "$GITHUB_OUTPUT"
          else
            pairs=""
            n=0
            for s in video/*/script.yaml; do
              d=$(dirname "$s"); id=$(basename "$d")
              [ -f "$d/youtube.json" ] && continue
              if python - "$s" <<'EOF'
          import sys, yaml
          doc = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          sys.exit(0 if doc.get("publish", True) is False else 1)
          EOF
              then echo "skip（publish: false）: $id"; continue; fi
              case "$id" in *-en) ch=en ;; *) ch=ja ;; esac
              pairs="$pairs $id:$ch:public"
              n=$((n+1)); [ "$n" -ge 4 ] && break
            done
            echo "pairs=$(echo $pairs | xargs)" >> "$GITHUB_OUTPUT"
          fi
      - name: 対象があるか確かめる
        id: gate
        shell: bash
        run: |
          pairs="${{ steps.plan.outputs.pairs }}"
          if [ -z "$pairs" ]; then
            echo "未投稿の動画はありません。終わります。"
            echo "go=no" >> "$GITHUB_OUTPUT"; echo "need_en=no" >> "$GITHUB_OUTPUT"
          else
            echo "作る動画：$pairs"
            echo "go=yes" >> "$GITHUB_OUTPUT"
            case " $pairs " in *":en:"*) echo "need_en=yes" >> "$GITHUB_OUTPUT" ;; *) echo "need_en=no" >> "$GITHUB_OUTPUT" ;; esac
          fi
      - name: 投稿の鍵（YouTube）が生きているか先に確かめる
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        env:
          YT_CLIENT_ID_EN: ${{ secrets.YT_CLIENT_ID_EN }}
          YT_CLIENT_SECRET_EN: ${{ secrets.YT_CLIENT_SECRET_EN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-auth requests
          python - <<'EOF'
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          pairs = "${{ steps.plan.outputs.pairs }}".split()
          chans = sorted({p.split(":")[1] for p in pairs})
          bad = []
          for ch in chans:
              suf = "_EN" if ch == "en" else ""
              creds = Credentials(None, refresh_token=os.environ.get("YT_REFRESH_TOKEN" + suf),
                                  token_uri="https://oauth2.googleapis.com/token",
                                  client_id=os.environ.get("YT_CLIENT_ID" + suf), client_secret=os.environ.get("YT_CLIENT_SECRET" + suf))
              try:
                  creds.refresh(Request())
                  print(f"{ch}: 鍵は有効です")
              except Exception as e:
                  bad.append(ch)
                  print(f"::error::{ch} チャンネルの投稿の鍵（YT_REFRESH_TOKEN{suf}）が使えません：{e}")
          if bad:
              print("::error::docs/youtube-setup.md の手順4で鍵を作り直し、手順5で Secrets を登録し直してください。同意画面が「テスト」のままだと鍵は7日で切れます（「本番」に切り替えると切れません）")
              sys.exit(1)
          EOF
      - name: 日本語フォントと ffmpeg を入れる
        if: steps.gate.outputs.go == 'yes'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg chromium-browser || sudo apt-get install -y chromium
      - if: steps.gate.outputs.go == 'yes'
        run: pip install pillow numpy qrcode google-api-python-client google-auth google-auth-oauthlib
      - name: 英語の音声（Piper）を用意する
        if: steps.gate.outputs.go == 'yes' && steps.gate.outputs.need_en == 'yes'
        run: |
          pip install piper-tts
          mkdir -p piper_voices && cd piper_voices
          for v in en_US-ryan-medium en_US-joe-medium; do python -m piper.download_voices $v --data-dir . ; done
      - name: 合成音声（VOICEVOX）の前回の準備結果を取り出す
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache/restore@v4
        id: vv
        with:
          path: vv
          key: voicevox-0.15.7-copies-v2
      - name: 合成音声（VOICEVOX）を確かめ、無いか壊れていれば作り直す
        if: steps.gate.outputs.go == 'yes'
        id: vv_build
        shell: bash
        run: |
          # venv の python が実行できて、本体のライブラリと辞書がそろっていれば、前回の準備結果を使う。
          # （venv を symlink で作ると、ランナーの Python の更新で壊れる。--copies で作って依存をなくす）
          if [ -x vv/venv/bin/python ] && vv/venv/bin/python -c "import numpy" >/dev/null 2>&1 \
             && [ -d vv/voicevox_core-linux-x64-cpu-0.15.7 ] && [ -d vv/open_jtalk_dic_utf_8-1.11 ]; then
            echo "前回の準備結果を使います"
            echo "built=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VOICEVOX を準備し直します"
          rm -rf vv && mkdir -p vv && cd vv
          curl -sSL -o core.zip https://github.com/VOICEVOX/voicevox_core/releases/download/0.15.7/voicevox_core-linux-x64-cpu-0.15.7.zip
          curl -sSL -o "voicevox_core-0.15.7+cpu-cp38-abi3-linux_x86_64.whl" "https://github.com/VOICEVOX/voicevox_core/releases/download/0.15.7/voicevox_core-0.15.7+cpu-cp38-abi3-linux_x86_64.whl"
          curl -sSL -o dic.tgz https://github.com/r9y9/open_jtalk/releases/download/v1.11.1/open_jtalk_dic_utf_8-1.11.tar.gz
          unzip -q core.zip && tar xzf dic.tgz && rm core.zip dic.tgz
          python -m venv --copies venv && ./venv/bin/pip install -q "voicevox_core-0.15.7+cpu-cp38-abi3-linux_x86_64.whl" numpy
          ./venv/bin/python -c "import numpy"
          echo "built=yes" >> "$GITHUB_OUTPUT"
      - name: 合成音声（VOICEVOX）の準備結果を保存する（作り直したときだけ）
        if: steps.gate.outputs.go == 'yes' && steps.vv_build.outputs.built == 'yes'
        uses: actions/cache/save@v4
        with:
          path: vv
          key: voicevox-0.15.7-copies-v2
      - name: 合成音声（Style-Bert-VITS2）の前回の準備結果を取り出す
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: |
            sbv2
            ~/.cache/huggingface
          key: sbv2-v1-${{ hashFiles('video/voices.yaml') }}
          restore-keys: |
            sbv2-v1-
      - name: 合成音声（Style-Bert-VITS2）を確かめ、無いか足りなければ作る
        if: steps.gate.outputs.go == 'yes'
        id: sbv2_build
        shell: bash
        env:
          SBV2_MODELS: ${{ github.workspace }}/sbv2/models
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          # 日本語の声（voices.yaml の engine: sbv2）。AivisHub と Hugging Face から声のモデルを取り、BERT と一緒に保存しておく。
          # venv は --copies（ランナーの Python の更新で壊れないように）
          built=no
          if ! [ -x sbv2/venv/bin/python ] || ! sbv2/venv/bin/python -c "import style_bert_vits2, torch, scipy" >/dev/null 2>&1; then
            echo "Style-Bert-VITS2 を準備し直します"
            rm -rf sbv2/venv && mkdir -p sbv2
            python -m venv --copies sbv2/venv
            sbv2/venv/bin/python -m pip install --upgrade pip
            echo "::group::torch（CPU 版）"
            sbv2/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
            echo "::endgroup::"
            echo "::group::style-bert-vits2"
            sbv2/venv/bin/pip install style-bert-vits2 scipy pyyaml
            echo "::endgroup::"
            sbv2/venv/bin/python -c "import style_bert_vits2, torch, scipy; print('torch', torch.__version__)"
            built=yes
          fi
          # 声のモデル（足りない分だけ取る）。1つでも新しく取ったら保存し直す
          mkdir -p sbv2/models
          before=$(ls sbv2/models | wc -l)
          echo "::group::声のモデルと BERT"
          sbv2/venv/bin/python scripts/sbv2_tts.py prepare
          echo "::endgroup::"
          after=$(ls sbv2/models | wc -l)
          if [ "$before" != "$after" ]; then built=yes; fi
          echo "built=$built" >> "$GITHUB_OUTPUT"
      - name: 合成音声（Style-Bert-VITS2）の準備結果を保存する（作り直したときだけ）
        if: steps.gate.outputs.go == 'yes' && steps.sbv2_build.outputs.built == 'yes'
        uses: actions/cache/save@v4
        with:
          path: |
            sbv2
            ~/.cache/huggingface
          key: sbv2-v1-${{ hashFiles('video/voices.yaml') }}
      - name: 動画を作って投稿し、1本ごとに書き戻す
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        env:
          VOICEVOX_PY: ${{ github.workspace }}/vv/venv/bin/python
          VOICEVOX_LIB: ${{ github.workspace }}/vv/voicevox_core-linux-x64-cpu-0.15.7
          OPEN_JTALK_DICT: ${{ github.workspace }}/vv/open_jtalk_dic_utf_8-1.11
          PIPER_VOICE_DIR: ${{ github.workspace }}/piper_voices
          SBV2_PY: ${{ github.workspace }}/sbv2/venv/bin/python
          SBV2_MODELS: ${{ github.workspace }}/sbv2/models
          YT_CLIENT_ID_EN: ${{ secrets.YT_CLIENT_ID_EN }}
          YT_CLIENT_SECRET_EN: ${{ secrets.YT_CLIENT_SECRET_EN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          python scripts/figures.py
          failed=""
          for p in ${{ steps.plan.outputs.pairs }}; do
            vid=${p%%:*}; rest=${p#*:}; ch=${rest%%:*}; priv=${rest#*:}
            echo "::group::$vid を作って投稿（$ch、$priv）"
            if python scripts/video.py "$vid" && python scripts/youtube_upload.py "$vid" --privacy "$priv" --channel "$ch"; then
              git add "video/$vid/youtube.json" "video/$vid/description.txt" "video/$vid/transcript.md" "video/$vid/thumbnail.png" 2>/dev/null || true
              git commit -m "動画を投稿：$vid" >/dev/null 2>&1 || true
              pushed=no
              for i in 1 2 3 4 5; do
                git fetch origin main -q
                git rebase --autostash origin/main -q && git push origin HEAD:main -q && { pushed=yes; break; }
                git rebase --abort 2>/dev/null || true
                sleep $((RANDOM % 5 + 3))
              done
              if [ "$pushed" != "yes" ]; then
                echo "::error::$vid は投稿できましたが、投稿済みの記録を main に書き戻せませんでした。重複を防ぐため、ここで止めます。youtube.json を手で入れてください：$(cat video/$vid/youtube.json 2>/dev/null)"
                exit 1
              fi
            else
              failed="$failed $vid"
              echo "::error::$vid の生成または投稿に失敗"
            fi
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "失敗：$failed"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: videos
          path: video/*/*.mp4
          retention-days: 7
