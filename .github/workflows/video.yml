# 動画を作ってYouTubeに投稿する。
# 2つの動かし方：
#  (1) 自動：英語動画（video/<id>-en/script.yaml）が main にマージされると、その動画を作って
#      英語チャンネルに「公開（public）」で投稿する。
#  (2) 手動：Actions → video → Run workflow で、動画のid・公開範囲・チャンネルを選んで実行する。
# 鍵は Settings → Secrets and variables → Actions に、YT_CLIENT_ID(_EN) などを登録しておく。
name: video

on:
  push:
    branches: [main]
    paths:
      - "video/*/script.yaml"
  workflow_dispatch:
    inputs:
      video_id:
        description: "動画のid（例：usecase-chusankan-patrol）"
        required: true
      privacy:
        description: "unlisted（限定公開）、private、public"
        default: unlisted
      channel:
        description: "投稿先：ja（日本語）または en（英語）"
        default: ja

permissions:
  contents: write

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 作る動画を決める
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "vids=${{ github.event.inputs.video_id }}" >> "$GITHUB_OUTPUT"
            echo "ch=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "priv=${{ github.event.inputs.privacy }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="${{ github.sha }}^"
            fi
            changed=$(git diff --name-only "$base" "${{ github.sha }}" -- 'video/*/script.yaml' || true)
            vids=""
            for f in $changed; do
              id=$(basename "$(dirname "$f")")
              case "$id" in
                *-en) vids="$vids $id" ;;
              esac
            done
            vids=$(echo "$vids" | xargs || true)
            echo "vids=$vids" >> "$GITHUB_OUTPUT"
            echo "ch=en" >> "$GITHUB_OUTPUT"
            echo "priv=public" >> "$GITHUB_OUTPUT"
          fi
      - name: 対象があるか確かめる
        id: gate
        run: |
          if [ -z "${{ steps.plan.outputs.vids }}" ]; then
            echo "作る動画がありません（英語動画の script.yaml の追加・変更なし）。終わります。"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "作る動画：${{ steps.plan.outputs.vids }}（チャンネル：${{ steps.plan.outputs.ch }}、公開範囲：${{ steps.plan.outputs.priv }}）"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: 日本語フォントと ffmpeg を入れる
        if: steps.gate.outputs.go == 'yes'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg chromium-browser || sudo apt-get install -y chromium
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
      - if: steps.gate.outputs.go == 'yes'
        run: pip install pyyaml pillow numpy google-api-python-client google-auth google-auth-oauthlib
      - name: 英語の音声（Piper）を用意する
        if: steps.gate.outputs.go == 'yes' && steps.plan.outputs.ch == 'en'
        run: |
          pip install piper-tts
          mkdir -p piper_voices && cd piper_voices
          for v in en_US-ryan-medium en_US-joe-medium; do python -m piper.download_voices $v --data-dir . ; done
      - name: 合成音声（VOICEVOX）を用意する
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        id: vv
        with:
          path: vv
          key: voicevox-0.15.7
      - if: steps.gate.outputs.go == 'yes' && steps.vv.outputs.cache-hit != 'true'
        run: |
          mkdir -p vv && cd vv
          curl -sSL -o core.zip https://github.com/VOICEVOX/voicevox_core/releases/download/0.15.7/voicevox_core-linux-x64-cpu-0.15.7.zip
          curl -sSL -o "voicevox_core-0.15.7+cpu-cp38-abi3-linux_x86_64.whl" "https://github.com/VOICEVOX/voicevox_core/releases/download/0.15.7/voicevox_core-0.15.7+cpu-cp38-abi3-linux_x86_64.whl"
          curl -sSL -o dic.tgz https://github.com/r9y9/open_jtalk/releases/download/v1.11.1/open_jtalk_dic_utf_8-1.11.tar.gz
          unzip -q core.zip && tar xzf dic.tgz && rm core.zip dic.tgz
          python -m venv venv && ./venv/bin/pip install -q "voicevox_core-0.15.7+cpu-cp38-abi3-linux_x86_64.whl" numpy
      - name: 動画を作る
        if: steps.gate.outputs.go == 'yes'
        env:
          VOICEVOX_PY: ${{ github.workspace }}/vv/venv/bin/python
          VOICEVOX_LIB: ${{ github.workspace }}/vv/voicevox_core-linux-x64-cpu-0.15.7
          OPEN_JTALK_DICT: ${{ github.workspace }}/vv/open_jtalk_dic_utf_8-1.11
          PIPER_VOICE_DIR: ${{ github.workspace }}/piper_voices
        run: |
          python scripts/figures.py
          for vid in ${{ steps.plan.outputs.vids }}; do
            echo "::group::$vid を作る"
            python scripts/video.py "$vid"
            echo "::endgroup::"
          done
      - name: YouTubeに投稿する
        if: steps.gate.outputs.go == 'yes'
        env:
          YT_CLIENT_ID_EN: ${{ secrets.YT_CLIENT_ID_EN }}
          YT_CLIENT_SECRET_EN: ${{ secrets.YT_CLIENT_SECRET_EN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIPER_VOICE_DIR: ${{ github.workspace }}/piper_voices
        run: |
          for vid in ${{ steps.plan.outputs.vids }}; do
            echo "::group::$vid を投稿する"
            python scripts/youtube_upload.py "$vid" --privacy "${{ steps.plan.outputs.priv }}" --channel "${{ steps.plan.outputs.ch }}"
            echo "::endgroup::"
          done
      - name: 動画のURLをリポジトリに書き戻す
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add video/*/youtube.json video/*/description.txt video/*/transcript.md video/*/thumbnail.png
          git commit -m "動画を投稿：${{ steps.plan.outputs.vids }}" || echo "変更なし"
          git push
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: videos
          path: video/*/*.mp4
          retention-days: 7
