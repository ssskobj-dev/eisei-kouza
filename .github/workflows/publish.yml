# main が更新されるたびに、サイトとPDFを作り直して GitHub Pages に公開する。
# 準備：リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 日本語フォントを入れる
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: 章立てを点検し、図とメニューを作る
        run: |
          python scripts/build.py check
          python scripts/figures.py
          python scripts/build.py nav

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - name: サイトとPDFを作る
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
