# note記事「伐採の届出、全部は山に行けない。衛星の変化通知でどこまで絞れるか」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 林業・カーボン
    title: 伐採跡地と再造林を衛星の通知で
    sub: 1.5mの画像で0.1haから。53自治体が採用、更新は不定期

  - id: fig-1
    type: split
    alt: 衛星に任せることと、林務担当が行うこと
    link: ＋
    left:
      title: 衛星とAIが行う
      items:
        - 2時期の画像から伐採跡地と再造林地の変化を拾う
        - 変化した場所を通知し、ブラウザで見られる形にする
    right:
      title: 林務担当が行う
      items:
        - 届出の範囲と重ねて照らす
        - 合わない場所だけ現地に行く
        - 指導や勧告の要否を決める
    note: 出てくるのは「候補」。無届かどうかは届出と現地で決める

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 更新は不定期
        text: 数か月ごとの確認には向かない
        role: none
      - title: 誤検出がある
        text: 太陽光用地や崩壊地も混じる
        role: none
      - title: 面積は実測と一致しない
        text: 届出との差は幅を見込む
        role: none
      - title: 日付は2時期の間まで
        text: いつ伐られたかは分からない
        role: none
      - title: 再造林の精度は検証がない
        text: 国の事業は伐採のみが対象
        role: none
