        - 道路の斜面と盛土
        - ダムの変位計測
        - 鉄道、電力など民間インフラ会社の取り組み
    note: 顧客が見た事例が、どちらの段階のものかを先に確かめる

  - id: fig-2
    type: flow
    alt: 国内の事例に共通する3つの手順
    steps:
      - title: 広い範囲を解析する
        text: 動きのある場所を拾う
        who: satellite
      - title: 順位を付ける
        text: 動きの大きさで分ける
        who: satellite
      - title: 現地で確かめる
        text: 順位の高い所から、人が判定する
        who: human
