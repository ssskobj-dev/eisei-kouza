<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>静岡市UNITE 2026の森林チームの3つの要点。約200件から7チーム、衛星で優先順位を決める実証、支援金と日程</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="242" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">7チームが実証へ</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">応募は約200件。市</tspan><tspan x="80.0" y="102.7">が示した課題は18テー</tspan><tspan x="80.0" y="122.9">マと自由テーマ。一</tspan><tspan x="80.0" y="143.2">次審査を通った11チー</tspan><tspan x="80.0" y="163.4">ムが11月11日にピッ</tspan><tspan x="80.0" y="183.7">チし、7チームが実証</tspan><tspan x="80.0" y="203.9">フェーズへ</tspan></text><rect x="252.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">整備の順番を衛星で</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">森林経営管理課と解析</tspan><tspan x="310.0" y="102.7">企業のチーム。衛星デー</tspan><tspan x="310.0" y="122.9">タで森林の状態を判断</tspan><tspan x="310.0" y="143.2">し、整備の優先順位を</tspan><tspan x="310.0" y="163.4">付けられるかを市内の</tspan><tspan x="310.0" y="183.7">一部地区で確かめる</tspan></text><rect x="482.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">支援金と日程</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">チームあたり最大500</tspan><tspan x="540.0" y="102.7">万円程度の実証支援金</tspan><tspan x="540.0" y="122.9">と市内のフィールド。</tspan><tspan x="540.0" y="143.2">実証は約1年、中間発表</tspan><tspan x="540.0" y="163.4">2027年3月15日、成果</tspan><tspan x="540.0" y="183.7">報告2028年3月</tspan></text></svg>
