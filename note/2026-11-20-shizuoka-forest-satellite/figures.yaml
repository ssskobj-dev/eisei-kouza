# 時事記事「静岡市のUNITE 2026で、衛星データで森林整備の優先順位を決める実証が実証フェーズへ」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 自治体・森林
    title: どの森から整備するかを衛星で
    sub: 静岡市の共創コンテスト。支援金は最大500万円程度、約1年の実証

  - id: fig-1
    type: cards
    alt: 静岡市UNITE 2026の森林チームの3つの要点。約200件から7チーム、衛星で優先順位を決める実証、支援金と日程
    columns: 3
    items:
      - title: 7チームが実証へ
        text: 応募は約200件。市が示した課題は18テーマと自由テーマ。一次審査を通った11チームが11月11日にピッチし、7チームが実証フェーズへ
      - title: 整備の順番を衛星で
        text: 森林経営管理課と解析企業のチーム。衛星データで森林の状態を判断し、整備の優先順位を付けられるかを市内の一部地区で確かめる
      - title: 支援金と日程
        text: チームあたり最大500万円程度の実証支援金と市内のフィールド。実証は約1年、中間発表2027年3月15日、成果報告2028年3月

  - id: fig-2
    type: split
    alt: 衛星データで見えることと、現場の情報が必要なこと。実証の3つの確認点との対応
    link: ＋
    left:
      title: 衛星で見えること（見える）
      items:
        - 樹冠の高さと被覆、伐採の有無のように、上から見えるもの
        - 広い面を同じ基準で、繰り返し見る
        - 航空レーザ測量より繰り返しやすい
    right:
      title: 現場が必要なこと（重なる・つながる）
      role: human
      items:
        - 林齢、所有者、境界、作業道の状態。森林簿の中身
        - 倒木や作業道の損傷を、林業事業体が市に伝える経路
        - 担当者が替わっても残る、判断の経緯
    note: 3つの確認点のうち2つは現場との「重なり」と「つながり」。衛星だけでは森林簿のずれは埋まらない
