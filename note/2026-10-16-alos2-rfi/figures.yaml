# 時事記事「JAXAが、だいち2号の運用を民間に委ねる案で情報提供を募集」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 衛星の運用
    title: だいち2号の運用を民間へ
    sub: データを使う側は、何を確かめるか

  - id: fig-1
    type: cards
    alt: JAXAの情報提供要請の要点
    columns: 3
    items:
      - title: 運用の一部を民間へ
        text: 観測計画とデータ活用の権利を民間事業者に付与する案
      - title: まだ決まっていない
        text: 情報提供要請の段階。受付は11月30日まで
      - title: 募集するのは3点
        text: 事業の成立性、課題と参画条件、ほかの連携のアイデア

  - id: fig-2
    type: split
    alt: 変わるかもしれないことと、まだ書かれていないこと
    link: ⇔
    left:
      title: 変わるかもしれないこと
      items:
        - データの入手先、価格、観測の依頼先
        - 任意の地点と時期で観測を頼める道
        - 自治体やインフラ管理者は「調達する側」
    right:
      title: まだ書かれていないこと
      role: none
      items:
        - 運用を移す範囲と時期
        - 災害時の観測や、国・自治体の利用の扱い
        - これまで無償だったデータの扱い
    note: 衛星は打ち上げから12年以上。運用の形が変わっても寿命は延びない
