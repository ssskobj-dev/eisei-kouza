<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 171" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>分野ごとの段階：本格運用から技術開発まで</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="171" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><defs><linearGradient id="sg"><stop offset="0" stop-color="#2f5d94"/><stop offset="1" stop-color="#eef1f3"/></linearGradient></defs><rect x="32.0" y="56.0" width="656.0" height="14.0" rx="7" fill="url(#sg)" stroke="none" stroke-width="1.5"/><text font-size="14" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="32.0" y="44.0">本格運用（約束できる）</tspan></text><text font-size="14" fill="#8a949c" font-weight="bold" text-anchor="end"><tspan x="688.0" y="44.0">技術開発（約束しない）</tspan></text><circle cx="114.0" cy="63" r="8" fill="#fff" stroke="#0b1524" stroke-width="2.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="114.0" y="100.0">農地の現地確認</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="114.0" y="122.6">205自治体が活用。漏水の</tspan><tspan x="114.0" y="140.7">絞り込み、地盤沈下も</tspan></text><circle cx="278.0" cy="63" r="8" fill="#fff" stroke="#0b1524" stroke-width="2.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="278.0" y="100.0">被災状況の把握</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="278.0" y="122.6">国の施策集で「実証」。ダ</tspan><tspan x="278.0" y="140.7">ムの変位も</tspan></text><circle cx="442.0" cy="63" r="8" fill="#fff" stroke="#0b1524" stroke-width="2.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="442.0" y="100.0">固定資産、森林</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="442.0" y="122.6">経産省の地域実証の段階</tspan></text><circle cx="606.0" cy="63" r="8" fill="#fff" stroke="#0b1524" stroke-width="2.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="606.0" y="100.0">河川水位、火災、</tspan><tspan x="606.0" y="119.6">海岸線</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="606.0" y="142.2">国の施策集で「技術開発」</tspan></text></svg>
