# note記事「工場や社有林の周りの植生と生物を、衛星データとAIで推定する」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 環境・水
    title: 拠点の植生と生物を衛星で推定
    sub: 1エリア250万円から。精度は公表されていない

  - id: fig-1
    type: split
    alt: 衛星とAIに任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星とAIが行う
      items:
        - 衛星画像から、植生の分布を推定する
        - 観察記録と組み合わせ、生物の生息しやすさを地図にする
    right:
      title: 人が行う
      items:
        - 対象の範囲と、見たい種を決める
        - 重要な拠点は、現地調査で確かめる
        - 開示の内容と、保全の対策を決める
    note: 推定の地図は、どこを詳しく調べるかを決める材料

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 精度の数字がない
        text: 正解率や誤差は公表されていない
        role: none
      - title: 衛星の名前と分解能
        text: 提供開始の発表に書かれていない
        role: none
      - title: 生物は推定
        text: 「いる」確認でなく、生息しやすさ
        role: none
      - title: 現地調査は残る
        text: 人が歩く調査を補う位置づけ
        role: none
      - title: 上から見えない場所
        text: 林の下、土の中、水の中は写らない
        role: none
