# note記事「農地の調査に衛星を入れたい。仕様書に「精度95%」と書いてはいけない理由」の見出し画像と図。
# python scripts/figures.py agri-municipal-spec で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 農業委員会・自治体向け
    title: 農地の調査に衛星を入れたい
    sub: 仕様書に「精度95%」と書いてはいけない理由

  - id: fig-1
    type: split
    alt: 衛星の推定で分かること、現地で確かめること
    link: "→"
    left:
      title: 衛星の推定が受け持つこと
      items:
        - 全筆を解析し、4つの区分に分ける
        - 耕作・管理されている筆を見分ける
        - 要確認、疑いのある筆を挙げる
        - 解析できない筆を区分として返す
    right:
      title: 人が受け持つこと
      items:
        - 疑いと解析不能の筆を、現地で一筆ごとに判定する
        - 省いた筆も一部を抽出して確かめる
        - 見逃しの割合を記録し、翌年の運用を決める
        - 制度に固有の確認項目を見る
    note: 衛星が決めるのは「見に行かなくてよい筆」の候補。遊休農地の判定は現地で行う

  - id: fig-2
    type: flow
    alt: 仕様書を組み立てる7つの手順
    steps:
      - title: 目的と制度
        text: どの制度で、共用するか
        who: human
      - title: 範囲と区画
        text: 全筆。ポリゴンの出どころ
        who: human
      - title: 精度の扱い
        text: 区分と、見逃しの割合
        who: satellite
      - title: 成果物
        text: 形式、撮影日、帰属
        who: satellite
      - title: 現地との接続
        text: 区分ごとに何をするか
        who: human
      - title: 継続年度
        text: 実証、毎年の検証
        who: human
      - title: 仕様と内訳
        text: 要求水準と任せる範囲
        who: satellite
