# note記事「AIが出した衛星データ解析の数字、反射率なのか整数なのか。最初の1枚で確かめる3つのこと」の見出し画像と図。
# python scripts/figures.py codex-1-1-what-pixels-measure で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 解析教材
    title: その数字、反射率か整数か
    sub: 最初の1枚で確かめる3つのこと

  - id: fig-1
    type: flow
    alt: 画素の値から反射率へ
    steps:
      - title: 明るさを測る
        text: 波長帯ごとに、地表からの反射
        who: satellite
      - title: 整数で保存
        text: 画素の値。0は欠けた値
        who: satellite
      - title: ずらしと倍率
        text: 付属情報から読む。足してから割る
        who: satellite
      - title: 反射率
        text: 0〜1の小数。比べられる値
        who: satellite
      - title: 分布を見る
        text: 森と湖で、もっともらしいか
        who: human

  - id: fig-2
    type: cards
    alt: 植物と水の見え方
    columns: 3
    items:
      - title: 植物
        text: 赤は低く、近赤外は高い
        role: satellite
      - title: 水
        text: 近赤外と短波赤外で暗い
        role: satellite
      - title: 裸の土
        text: 短波赤外で明るい
        role: satellite
