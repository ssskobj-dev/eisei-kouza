<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>内閣府の資料に載った3つの災害での衛星利用。熊本地震では当日夜に建物被害の推計と斜面崩壊の候補の抽出、東北の大雨では観測から約2時間半で浸水の推定範囲、台風25号では内閣衛星情報センターの加工処理画像をのべ148枚公開</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="222" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">熊本地震（7月）</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">当日夜から官民の衛星</tspan><tspan x="80.0" y="102.7">が緊急観測。JAXAが夜</tspan><tspan x="80.0" y="122.9">のうちに建物被害を推</tspan><tspan x="80.0" y="143.2">計し県へ。国交省は斜</tspan><tspan x="80.0" y="163.4">面崩壊の候補をSARで</tspan><tspan x="80.0" y="183.7">絞り、現地で確認</tspan></text><rect x="252.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">台風25号（9月）</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">内閣衛星情報センター</tspan><tspan x="310.0" y="102.7">が光学とSARで撮像。</tspan><tspan x="310.0" y="122.9">加工処理した光学画像</tspan><tspan x="310.0" y="143.2">を一般公開、11月2日</tspan><tspan x="310.0" y="163.4">時点でのべ148枚</tspan></text><rect x="482.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">東北の大雨（10月）</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">子吉川の越水。19時45</tspan><tspan x="540.0" y="102.7">分に警報、21時25分に</tspan><tspan x="540.0" y="122.9">民間SAR衛星が観測、</tspan><tspan x="540.0" y="143.2">翌0時3分に解析結果。</tspan><tspan x="540.0" y="163.4">観測から約2時間半で浸</tspan><tspan x="540.0" y="183.7">水の推定範囲</tspan></text></svg>
