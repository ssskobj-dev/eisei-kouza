# 時事記事「内閣府が直近の災害での衛星利用事例を公表」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害・自治体
    title: 災害時の衛星利用、国が実例公表
    sub: 観測から約2時間半で浸水範囲。平時に何を用意するか

  - id: fig-1
    type: cards
    alt: 内閣府の資料に載った3つの災害での衛星利用。熊本地震では当日夜に建物被害の推計と斜面崩壊の候補の抽出、東北の大雨では観測から約2時間半で浸水の推定範囲、台風25号では内閣衛星情報センターの加工処理画像をのべ148枚公開
    columns: 3
    items:
      - title: 熊本地震（7月）
        text: 当日夜から官民の衛星が緊急観測。JAXAが夜のうちに建物被害を推計し県へ。国交省は斜面崩壊の候補をSARで絞り、現地で確認
      - title: 台風25号（9月）
        text: 内閣衛星情報センターが光学とSARで撮像。加工処理した光学画像を一般公開、11月2日時点でのべ148枚
      - title: 東北の大雨（10月）
        text: 子吉川の越水。19時45分に警報、21時25分に民間SAR衛星が観測、翌0時3分に解析結果。観測から約2時間半で浸水の推定範囲

  - id: fig-2
    type: split
    alt: 衛星の解析が出したものと、人が現地で行ったこと。衛星は建物被害の推計、斜面崩壊の可能性のある箇所、浸水の推定範囲、地盤沈下の分布を出す。人は現地調査で確定し、排水や調査の優先順位を決め、復旧事業の資料に使う
    link: →
    left:
      title: 衛星の解析が出したもの
      items:
        - 建物被害の箇所と被害数の推計（当日夜）
        - 斜面崩壊の可能性のある箇所
        - 浸水の推定範囲（観測から約2時間半）
        - 最大60cmの地盤沈下の分布
    right:
      title: 人が現地で行ったこと
      items:
        - 判読箇所を現地調査で確定（否定の例も）
        - 排水ポンプ車、ヘリ調査の優先順位を決める
        - 想定氾濫区域と比べて調査箇所を抽出
        - 農業用水路や海岸堤防の被害と照合
    note: 衛星が出すのは「可能性のある箇所」と「推定」。確定は現地で行う
