# 時事記事「内水浸水想定区域のデータをAPIで提供開始」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害データ
    title: 内水の浸水想定区域をAPIで提供
    sub: 衛星の浸水推定図と、何を重ねるか

  - id: fig-1
    type: cards
    alt: 発表の3つの要点。内水浸水想定区域を地図とAPIで提供開始、洪水浸水想定区域（想定最大規模）と土砂災害警戒区域のAPIデータを更新、APIは利用申請と承認が必要
    columns: 3
    items:
      - title: 新規追加
        text: 内水の浸水想定区域を地図とAPIで提供開始
      - title: 更新
        text: 洪水の浸水想定区域と土砂災害警戒区域のデータを更新
      - title: 使い方
        text: 申請と承認を経てAPIキーの発行。連続の呼び出しは避ける

  - id: fig-2
    type: split
    alt: 変わることと、変わらないこと。変わるのは、照合用の想定区域を全国同じ形式で一つの窓口から取れる、内水と洪水の両方と重ねられる、出典と年度を納品物に書ける。変わらないのは、下水道区域外などの空白域、衛星の推定図の誤り、申請と承認の手間
    link: ⇔
    left:
      title: 変わること
      items:
        - 照合用の想定区域を、全国同じ形式で一つの窓口から取れる
        - 洪水だけでなく、内水の想定とも重ねられる
        - 出典と年度を、納品物に書き添えられる
    right:
      title: 変わらないこと
      role: none
      items:
        - 下水道区域外などの空白域は埋まらない
        - 衛星の推定図は実際の浸水と異なることがある
        - APIは申請と承認が要る
    note: 国の使い方は、衛星の推定図を想定区域と重ね、想定の外の浸水を見つけること
