# note記事「森林の材積、標準地調査だけでは追いつかない。衛星データでどこまで推定できるか。北海道の実証と森林管理の現地調査」の見出し画像と図。
figures:
- id: thumbnail
  type: thumbnail
  kind: usecase
  tag: 林業・カーボン
  title: 森林の材積を衛星で推定する
  sub: 北海道が光学4種とSAR2種を比較。結果はこれから
- id: fig-1
  type: split
  alt: 衛星に任せることと、人が行うこと
  link: ＋
  left:
    title: 衛星の解析が行う
    items:
    - 林班ごとのバイオマス量を全域で推定
    - 伐採の候補地の優先順位の材料を出す
    - 毎年同じ条件で更新する
  right:
    title: 人が行う
    items:
    - 航空レーザーと地上調査で正解を整える
    - 候補地だけ現地で測る
    - 売買と計画の根拠を決める
  note: 北海道の実証は2026年8月に開始。結果はまだ公表されていない
