# 時事記事「農水省の、衛星による現地確認のセミナー」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 農業
    title: 農水省が衛星活用の事例を紹介
    sub: 自治体は、何を準備するか

  - id: fig-1
    type: cards
    alt: セミナーのプログラムの3つの柱
    columns: 3
    items:
      - title: 民間のサービス
        text: 8つの事業者が、農地の調査を助けるサービスを紹介
      - title: 自治体の事例
        text: 3つの市が登壇。制度をまたいで同じ解析を使う例も
      - title: 地図づくりの道具
        text: 農地の区画をデジタル地図に整える作業を助ける

  - id: fig-2
    type: split
    alt: 衛星の解析で減らせることと、残ること
    link: ⇔
    left:
      title: 衛星で減らせること
      items:
        - 行かなくてよい農地を先に外す
        - 1つの解析を複数の制度で使う
        - 結果をタブレットに入れて見回る
    right:
      title: 残ること
      role: none
      items:
        - 農地の区画のデジタル地図化
        - 省略できない農地の現地確認
        - 制度に固有の項目の確認
    note: 解析の前に、農地の地図の整備が要る
