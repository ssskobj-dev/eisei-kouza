# 時事記事「米国とインドの無償LバンドSAR衛星NISAR、正式版の衛星データ提供を11月6日に開始」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 地盤変位
    title: 無償のLバンドSAR、正式版に
    sub: だいち2号の保守中、何を確かめるか

  - id: fig-1
    type: flow
    alt: NISARのデータ提供の歩み。2025年7月30日に打ち上げ、2026年1〜2月に試験版（BETA）を公開、7月20日に暫定版（PROVISIONAL）を公開、10月23日に製品の作成を一時停止、11月6日に正式版（VALIDATED）の提供を開始、2027年に10月21日より前のデータを作り直す予定
    steps:
      - title: 2025年7月
        text: 打ち上げ。12日ごとに観測
      - title: 2026年7月
        text: 暫定版を公開
      - title: 10月23日〜
        text: ソフト更新で作成を停止
      - title: 11月6日
        text: 正式版の提供を開始
      - title: 2027年
        text: 10月21日より前を作り直し

  - id: fig-2
    type: split
    alt: 正式版の提供で決まったことと、まだ残ること
    link: ⇔
    left:
      title: 決まったこと
      items:
        - 10月21日以降の観測は正式版（P05036）
        - 地図に重ねられる干渉図（80m間隔）も無償
        - 10月21日より前の分は2027年に作り直し
    right:
      title: まだ残ること
      role: none
      items:
        - 正式版にも既知の問題が残る
        - 土壌水分（レベル3）の正式版は未提供
        - 停止中（10/23〜11/6）の製品は追いつき待ち
    note: 成果を受け取るときは、製品の版（P05023かP05036か）を書いてもらう
