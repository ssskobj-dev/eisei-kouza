<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 363" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>この使い方の5つの限界</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="363" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="331.0" height="96.9" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">観測は年3〜4回</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">同じ条件のLバンドの観測は約3〜4か</tspan><tspan x="80.0" y="102.7">月に1回</tspan></text><rect x="367.0" y="22.0" width="331.0" height="96.9" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="58.5">2</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="425.0" y="56.0">南北向きは苦手</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="82.4">主側線が南北の構造物は解析が難しい</tspan></text><rect x="22.0" y="132.9" width="331.0" height="96.9" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="163.9" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="169.4">3</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="166.9">大きな変位は小さく出る</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="193.3">50mmを超えると実測より小さく解析</tspan><tspan x="80.0" y="213.6">された</tspan></text><rect x="367.0" y="132.9" width="331.0" height="96.9" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="163.9" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="169.4">4</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="425.0" y="166.9">誤差で「変状あり」</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="193.3">電離層や大気の影響。時系列で傾向を見る</tspan></text><rect x="22.0" y="243.8" width="331.0" height="96.9" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="274.8" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="280.3">5</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="277.8">前兆のない崩壊は予知できない</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="304.2">豪雨や地震で一気に崩れる斜面は分か</tspan><tspan x="80.0" y="324.4">らない</tspan></text></svg>
