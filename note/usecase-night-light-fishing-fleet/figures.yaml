# note記事「夜の海で漁船はどこに集まっているか。衛星の「光の分布図」で分かること、分からないこと」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 水産・海洋
    title: 夜の衛星データで漁船の集まりを捉える
    sub: 水産庁の取締り資料に見る、光の分布図の使い方と限界

  - id: fig-1
    type: split
    alt: 衛星に任せることと、取締りの現場が行うこと
    link: ＋
    left:
      title: 衛星の夜間画像が行う
      items:
        - 広い海域の光点を毎晩拾う
        - 明るさの階級で船の種類を推測する
    right:
      title: 取締りの現場が行う
      items:
        - 光点の海域に取締船を向ける
        - 船を目で確かめ、退去警告と放水を行う
        - 放棄された漁具を回収する
    note: 光点には航行中の船も混じる。違法かどうかを決めるのは現場

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 光点は漁船とは限らない
        text: 航行中の船や一般船舶も含まれる
        role: none
      - title: 雲と月明かりで変わる
        text: 雲は欠損と「偽の灯り」を作る
        role: none
      - title: 灯火を使わない船は写らない
        text: 捉えるのは光だけ
        role: none
      - title: 1日1回、数百m
        text: 深夜の1時点、分解能は750m
        role: none
      - title: 国籍や違法かは決まらない
        text: 色と船種の対応は「推測」
        role: none
