pan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="252.5" y="56.0">場所</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="252.5" y="82.4">緯度と経度</tspan><tspan x="252.5" y="102.7">の範囲、区</tspan><tspan x="252.5" y="122.9">画の境界</tspan></text><rect x="367.0" y="22.0" width="158.5" height="139.6" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="425.0" y="56.0">期間</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="82.4">開始日と終</tspan><tspan x="425.0" y="102.7">了日、季節</tspan><tspan x="425.0" y="122.9">の意味</tspan></text><rect x="539.5" y="22.0" width="158.5" height="139.6" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="568.5" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="568.5" y="58.5">4</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="597.5" y="56.0">衛星と処理</tspan><tspan x="597.5" y="78.4">の段階</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="597.5" y="104.8">衛星の名前</tspan><tspan x="597.5" y="125.0">と段階の正</tspan><tspan x="597.5" y="145.3">式な名前</tspan></text><rect x="22.0" y="175.6" width="158.5" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="206.6" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="212.1">5</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="209.6">手順</tspan></text><text font-size="13.5" fill="#1