# 時事記事「Sentinel-1 の処理ソフトが 4.1.1 に更新」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 衛星データの入手
    title: Sentinel-1の処理ソフト更新
    sub: 成果を受け取る側は、何を確かめるか

  - id: fig-1
    type: cards
    alt: 2026年10月21日の更新で変わった3つのこと
    columns: 3
    items:
      - title: 位置ずれの修正
        text: SMモードの製品で、距離方向の位置のずれを修正。陸域の標準はIW
      - title: 付属情報の追加
        text: 処理に使った標高データの種類と、軌道情報の品質の印を記録
      - title: 海の製品の改良
        text: 混信の可能性がある範囲は、外さずに印を付けて提供

  - id: fig-2
    type: split
    alt: 更新で変わることと、更新があっても変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 製品に処理ソフトの版 4.1.1 が記録される
        - どの標高データで処理したかを聞ける
        - 10月21日の前後で作り方が変わる
    right:
      title: 変わらないこと
      role: none
      items:
        - 観測の頻度や細かさは変わらない
        - 過去の製品の作り直しは書かれていない
        - 結果の検証は、使う側の仕事
    note: 成果を受け取る仕様書に「処理ソフトの版」と「標高データの種類」の項目を足す
