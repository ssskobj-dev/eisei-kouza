# note記事「記者が入れない紛争地、被害をどう裏付けるか。衛星データでできることと残ること」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 生活・文化・その他
    title: 紛争地の被害を衛星で裏付ける
    sub: 広い範囲は安価な画像、要所だけ高分解能。原因は取材で

  - id: fig-1
    type: split
    alt: 衛星に任せることと、取材班が行うこと
    link: ＋
    left:
      title: 衛星とAIが行う
      items:
        - 2時期の画像から建物や道路の変化を広く拾う
        - 変化の集中する場所を高分解能で確かめる
    right:
      title: 取材班が行う
      items:
        - 証言や動画の位置と時期を照らす
        - 変化の原因を取材で確かめる
        - 放送で示す範囲と注記を決める
    note: 衛星が示すのは「変化」まで。原因と被害の有無は取材で決める

  - id: fig-2
    type: cards
    alt: この使い方の4つの限界
    columns: 2
    items:
      - title: 家1軒の変化は拾えない
        text: 低分解能は広く見る用。要所は高分解能で
        role: none
      - title: 原因は画像で決められない
        text: 攻撃か火災か取り壊しかは分からない
        role: none
      - title: 雲の季節は撮れない
        text: 雨季は使える画像が途切れる
        role: none
      - title: 日付は2時期の間まで
        text: いつ起きたかは画像の間隔で決まる
        role: none
