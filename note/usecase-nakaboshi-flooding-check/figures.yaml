# note記事「中干しの延長、農家の写真だけで足りるか。農業の衛星データで水張りをどこまで点検できるか」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 農業・食料
    title: 中干しの延長を衛星で点検
    sub: 証跡は記録と写真。衛星は申告と合わない圃場を拾う

  - id: fig-1
    type: split
    alt: 衛星に任せることと、事業者が行うこと
    link: ＋
    left:
      title: 衛星が担う
      items:
        - 広い範囲の水田の水張りを繰り返し見る
        - 申告と合わない圃場を拾う
        - 過去の落水の時期を遡って推定する
    right:
      title: 事業者と農家が行う
      items:
        - 記録と写真を揃えて審査に出す
        - 拾われた圃場に追加の確認を求める
        - 差し水や減収の判断をする
    note: 衛星は「証明」ではなく「点検」。制度の証跡は記録と写真

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 証跡は記録と写真
        text: 制度は衛星データを証跡に挙げていない
        role: none
      - title: 観測の間隔が粗い
        text: 連続7日の要件に対し、観測は12〜14日おき
        role: none
      - title: 稲の下の水面は期待の段階
        text: 茂った稲の下の落水は確かめている途中
        role: none
      - title: 精度は未公表
        text: 現地センサとの比較は2025年に始まった
        role: none
      - title: 差し水と減収は分からない
        text: 延ばすか止めるかは人が決める
        role: none
