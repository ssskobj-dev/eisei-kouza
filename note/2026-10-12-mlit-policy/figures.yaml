# 時事記事「国交省の衛星データ取組方針」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ
    title: 国交省が衛星データの方針を策定
    sub: 発注する側は、何を読み取るか

  - id: fig-1
    type: cards
    alt: 取組方針が示す3つの分野
    columns: 3
    items:
      - title: 災害対応
        text: 浸水、土砂、道路、港湾の被害把握。ダムの変位計測
      - title: 点検・環境
        text: 変状の把握、水道管の漏水調査の絞り込み
      - title: 国土管理
        text: 地殻・地盤変動の監視、地図作成、海岸線の把握

  - id: fig-2
    type: split
    alt: 方針で変わることと、方針が出ても変わらない限界
    link: ⇔
    left:
      title: 変わること
      items:
        - 国が民間衛星のデータを積極的に使う
        - 国の衛星と民間衛星を組み合わせて使う
        - 施策ごとに実証、開発、実装の年次が示された
    right:
      title: 変わらない限界
      role: none
      items:
        - 撮りたい時に撮れるとは限らない
        - 撮った後の解析と判読に時間がかかる
        - 実測による検証が要る
    note: 方針そのものが、限界と課題を明記している
