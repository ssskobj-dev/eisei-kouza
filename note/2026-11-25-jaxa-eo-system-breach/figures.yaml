# 時事記事「JAXAの地球観測データ公開システムに不正アクセス」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: データの提供
    title: JAXAの公開システムが停止中
    sub: 不正アクセスで2,000名分の情報が漏洩。何を確かめるか

  - id: fig-1
    type: flow
    alt: 2026年11月18日の経緯（JAXAの発表による）。10時20分ごろから13時ごろにWebサーバからネットワークを探る通信、13時15分ごろに運用者が知らないアカウントが作られネットワーク機器へのログインが試みられて失敗、15時過ぎに不審な挙動を確認、16時30分までにWebサーバを停止しシステムも停止、11月24日に公表
    steps:
      - title: 10時20分ごろ
        text: Webサーバから探索の通信
      - title: 13時15分ごろ
        text: 不明なIDの作成
      - title: 15時過ぎ
        text: 不審な挙動を確認
      - title: 16時30分
        text: システムを停止
      - title: 11月24日
        text: 調査結果を公表

  - id: fig-2
    type: split
    alt: 発表で分かっていることと、発表には書かれていないこと。分かっていることは、2,000名分のアカウント名と暗号化されたパスワードが漏洩、観測データは公開情報で攻撃者が触れた痕跡はない、原因はWebアプリケーションの脆弱性。書かれていないのは、止まっている個別のサービスの名前、復旧の時期、氏名やメールアドレスが漏れたかどうか
    link: ⇔
    left:
      title: 発表で分かっていること
      items:
        - 2,000名分のアカウント名と暗号化されたパスワードが漏洩
        - 観測データは公開情報。攻撃者が触れた痕跡はない
        - 原因はWebアプリケーションの脆弱性
    right:
      title: 発表に書かれていないこと
      role: none
      items:
        - 止まっている個別のサービスの名前
        - 復旧の時期
        - 氏名やメールアドレスが漏れたか
    note: 新たな事実が判明した場合は速やかに公表、とJAXAは書いている
