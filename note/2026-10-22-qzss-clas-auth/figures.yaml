# 時事記事「みちびきのCLAS、補強信号のなりすまし対策」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 衛星測位
    title: みちびき補強信号に認証へ
    sub: 自動操舵や情報化施工で、何を確かめるか

  - id: fig-1
    type: cards
    alt: 2026年10月14日の発表で公開された3つのこと
    columns: 3
    items:
      - title: なりすまし対策
        text: 補強信号が本物かを受信機の側で検証する認証サービスを整備
      - title: 仕様書の案
        text: 信号認証サービスの仕様書2版の案に、CLASの認証を追加
      - title: 試験用ライブラリ
        text: 受信機を作る側が参照する CLASLIB 0.9.0 を公開

  - id: fig-2
    type: split
    alt: 認証で変わることと、認証があっても変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 補強信号が本物かを確かめられる
        - 受信機の対応予定を聞く材料ができた
        - 安全の説明に「認証の有無」を書ける
    right:
      title: 変わらないこと
      role: none
      items:
        - 精度は上がらない（静止で水平6cm以内）
        - 電離圏の乱れによる精度の低下は残る
        - 専用の受信機が要る。仕様書はまだ案
    note: 試験サービスは2027年度の予定。来年度以降の機械の調達計画に関わる
