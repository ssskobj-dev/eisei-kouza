# 時事記事「だいち2号の11年分のデータで、木の下の湛水を地図に」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害データ
    title: 衛星の浸水図、見落とし4割
    sub: 浸水の把握に衛星を使う側は、何を読み取るか

  - id: fig-1
    type: cards
    alt: JAXAが公開した熱帯湿地湛水域データセットの、精度に関する4つの数字
    columns: 2
    items:
      - title: 全体精度 91.3%
        text: 南米の6,863点の目視判読と比べた結果。浸かっていない面積が多いと高く出やすい
      - title: 誤検出 2.9%
        text: 水があると出た場所は、ほぼ本当に水がある
      - title: 見落とし 41.5%
        text: 水があるのに出てこない場所が多い。作った側は「下限として使う」と明記
      - title: 欠測 約7.6%
        text: 観測の成功率は平均約82%。欠測は前後の観測と水文モデルで補う

  - id: fig-2
    type: split
    alt: 衛星の浸水図に期待してよいことと、期待してはいけないこと
    link: ⇔
    left:
      title: 期待してよいこと
      items:
        - 「少なくともここは浸かった」の範囲
        - 年に何回、どの時期に浸かるかの傾向
        - 無償で、手法が公開されている土台
    right:
      title: 期待してはいけないこと
      role: none
      items:
        - 浸かった範囲の「全部」
        - 図に出ない場所を「浸かっていない」と断定すること
        - 別の地域で、同じ精度の数字
    note: 仕様書には、全体精度ではなく「誤検出」と「見落とし」を、検証した地点の数とあわせて書かせる
