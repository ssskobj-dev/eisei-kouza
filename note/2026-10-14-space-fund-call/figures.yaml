# 時事記事「宇宙戦略基金の追加公募（衛星データ利用システム実装加速化事業）」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 公募
    title: 宇宙戦略基金が追加公募
    sub: 発注する側は、どう関わるか

  - id: fig-1
    type: cards
    alt: 追加公募の要点
    columns: 3
    items:
      - title: 対象
        text: 開発・実証（補助）だけ。締切は11月26日
      - title: 支援額
        text: 1件0.15億〜20億円程度。補助率は2分の1か3分の2
      - title: 期間
        text: 2年目に途中の評価。最大5年程度まで

  - id: fig-2
    type: split
    alt: 事業者が行うことと、発注する側ができること
    link: ⇔
    left:
      title: 応募する事業者
      items:
        - 提案書を書き、e-Radで応募する
        - 想定する顧客のニーズを明確にする
        - 使う衛星データの選定を説明する
    right:
      title: 発注する側
      items:
        - 評価シートに課題と価値を書く（任意）
        - 課題を場所、頻度、細かさで言葉にする
        - 採択された案件を自分の仕事と比べる
    note: 補助金は開発を支える。成果の品質は保証しない
