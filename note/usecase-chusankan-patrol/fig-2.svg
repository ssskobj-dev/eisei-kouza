<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>この使い方の4つの限界</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="234" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="331.0" height="99.0" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">小さな区画は解析できない</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">「解析対象外」として残り、従来どおり</tspan><tspan x="80.0" y="102.7">見回る</tspan></text><rect x="367.0" y="22.0" width="331.0" height="99.0" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="58.5">2</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="425.0" y="56.0">狭い農地が多い集落では効果が</tspan><tspan x="425.0" y="78.4">小さい</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="104.8">見回りの要る農地が多く残る</tspan></text><rect x="22.0" y="135.1" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="166.1" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="171.6">3</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="169.1">分かるのは耕作や管理の有無まで</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="195.5">作物の種類や活動の中身は分からない</tspan></text><rect x="367.0" y="135.1" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="166.1" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="171.6">4</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="425.0" y="169.1">抜き取りの確認は続く</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="195.5">不要と判定した農地の数%を見回っている</tspan></text></svg>
