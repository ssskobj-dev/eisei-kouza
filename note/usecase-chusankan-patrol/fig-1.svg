<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 273" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>衛星に任せることと、職員が行うこと</title><defs><marker id="ah-2b8fd6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8fd6"/></marker><marker id="ah-e8943a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8943a"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-14609c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14609c"/></marker><marker id="ah-1f2a33" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker></defs><rect width="720" height="273" rx="14" fill="#ffffff" stroke="#dcedfa" stroke-width="2"/><rect x="22.0" y="22.0" width="311.0" height="178.2" rx="10" fill="#dcedfa" stroke="none" stroke-width="1.5"/><rect x="22.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#2b8fd6" stroke="none" stroke-width="1.5"/><rect x="22.0" y="48" width="311.0" height="16" fill="#2b8fd6"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="177.5" y="50.0">衛星の解析が行う</tspan></text><circle cx="46.0" cy="87.0" r="4" fill="#2b8fd6"/><text font-size="14" fill="#1f2a33" font-weight="normal" text-anchor="start"><tspan x="60.0" y="92.0">農地を4段階に色分けする</tspan></text><circle cx="46.0" cy="116.3" r="4" fill="#2b8fd6"/><text font-size="14" fill="#1f2a33" font-weight="normal" text-anchor="start"><tspan x="60.0" y="121.3">見回り不要の農地を外す</tspan></text><rect x="387.0" y="22.0" width="311.0" height="178.2" rx="10" fill="#fdf0e0" stroke="none" stroke-width="1.5"/><rect x="387.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#e8943a" stroke="none" stroke-width="1.5"/><rect x="387.0" y="48" width="311.0" height="16" fill="#e8943a"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="542.5" y="50.0">職員が行う</tspan></text><circle cx="411.0" cy="87.0" r="4" fill="#e8943a"/><text font-size="14" fill="#1f2a33" font-weight="normal" text-anchor="start"><tspan x="425.0" y="92.0">「要調査」の農地を見回る</tspan></text><circle cx="411.0" cy="116.3" r="4" fill="#e8943a"/><text font-size="14" fill="#1f2a33" font-weight="normal" text-anchor="start"><tspan x="425.0" y="121.3">不要と判定された農地の数%を抜き取り</tspan><tspan x="425.0" y="141.6">で確かめる</tspan></text><circle cx="411.0" cy="165.9" r="4" fill="#e8943a"/><text font-size="14" fill="#1f2a33" font-weight="normal" text-anchor="start"><tspan x="425.0" y="170.9">集落に説明する</tspan></text><circle cx="360.0" cy="111.1" r="21" fill="#fff" stroke="#14609c" stroke-width="2"/><text font-size="19" fill="#14609c" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="118.1">＋</tspan></text><rect x="22.0" y="214.2" width="676.0" height="37.0" rx="8" fill="#eef1f3" stroke="none" stroke-width="1.5"/><text font-size="14" fill="#1f2a33" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="240.2">見回りはなくならない。公表されている効果は、約50%の削減</tspan></text></svg>
