<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>落とし所：衛星で絞り、現地で確かめる</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="250" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><polygon points="28.0,22 408.0,22 369.7,84 66.3,84" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5" stroke-linejoin="round"/><text font-size="17" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="218.0" y="60.0">全体を見る</tspan></text><line x1="394.8" y1="53.0" x2="426" y2="53.0" stroke="#2f5d94" stroke-width="1.5" stroke-dasharray="3 4"/><text font-size="15" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="436.0" y="47.8">衛星で広い範囲を同じ条件で見る</tspan></text><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="436.0" y="68.0">県をまたぐ広さも1回の観測で</tspan></text><polygon points="66.3,94 369.7,94 331.3,156 104.7,156" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5" stroke-linejoin="round"/><text font-size="17" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="218.0" y="132.0">候補を絞る</tspan></text><line x1="356.5" y1="125.0" x2="426" y2="125.0" stroke="#2f5d94" stroke-width="1.5" stroke-dasharray="3 4"/><text font-size="15" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="436.0" y="119.8">気になる場所だけを候補にする</tspan></text><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="436.0" y="140.0">候補であって、確定ではない</tspan></text><polygon points="104.7,166 331.3,166 293.0,228 143.0,228" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5" stroke-linejoin="round"/><text font-size="17" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="218.0" y="204.0">現地で確かめる</tspan></text><line x1="318.2" y1="197.0" x2="426" y2="197.0" stroke="#ff6b2c" stroke-width="1.5" stroke-dasharray="3 4"/><text font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="436.0" y="191.8">人が現地で判定して確定する</tspan></text><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="436.0" y="212.0">拾わなかった場所も「問題なし」ではない</tspan></text></svg>
