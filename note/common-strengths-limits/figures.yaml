# note記事「衛星で何ができるのか。5つの強みと、その裏にある限界」の見出し画像と図。
# python scripts/figures.py common-strengths-limits で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 基礎
    title: 衛星の強みは5つ、裏も5つ
    sub: 広く、過去に、行かずに、見えないものを、客観的に

  - id: fig-1
    type: cards
    alt: 衛星データの5つの強み
    columns: 3
    items:
      - title: 広く見られる
        text: 一度に県をまたぐ広さを同じ条件で
        mark: "1"
      - title: 過去に遡れる
        text: 頼まれなくても撮り続けている
        mark: "2"
      - title: 行かずに分かる
        text: 現地に行く場所と回数を減らせる
        mark: "3"
      - title: 見えないものを見る
        text: 目で分からない沈下や作物の勢い
        mark: "4"
      - title: 客観的に示せる
        text: 誰が撮っても同じ材料になる
        mark: "5"

  - id: fig-2
    type: funnel
    alt: 落とし所：衛星で絞り、現地で確かめる
    stages:
      - label: 全体を見る
        title: 衛星で広い範囲を同じ条件で見る
        text: 県をまたぐ広さも1回の観測で
        who: satellite
      - label: 候補を絞る
        title: 気になる場所だけを候補にする
        text: 候補であって、確定ではない
        who: satellite
      - label: 現地で確かめる
        title: 人が現地で判定して確定する
        text: 拾わなかった場所も「問題なし」ではない
        who: human
