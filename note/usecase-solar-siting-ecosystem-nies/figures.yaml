# note記事「太陽光発電施設はどこに建ち、何を潰してきたか。国立環境研究所が衛星画像と航空写真で8,725施設を地図化した研究と、範囲を人が描く限界」の見出し画像と図。
figures:
- id: thumbnail
  type: thumbnail
  kind: usecase
  tag: 環境・水
  title: 太陽光発電の立地を衛星で見る
  sub: 国内8,725施設を地図化。自然保護区の中に1,027施設
- id: fig-1
  type: split
  alt: 衛星と航空写真に任せることと、人が行うこと
  link: ＋
  left:
    title: 衛星画像と航空写真から
    items:
    - 施設の範囲を全国で一様に地図データにする
    - 建設前の土地被覆と重ねて失われた面積を数える
    - 保護区と重ねて中の施設を数える
  right:
    title: 人が行う
    items:
    - 画像から範囲をなぞって描く
    - どこを規制しどこへ誘導するかを決める
    - 個々の場所の生物への影響を評価する
  note: 分かるのは面積まで。生物への影響の質は現地の調査で
- id: fig-2
  type: cards
  alt: この使い方の5つの限界
  columns: 2
  items:
  - title: 0.5MW未満は対象外
    text: 屋根や小さな野立ては数えない
    role: none
  - title: 範囲は人が描く
    text: 8,725施設。更新に手間がかかる
    role: none
  - title: 建設前は地図から推定
    text: 地図の年と建設の時期のずれ
    role: none
  - title: 影響の質は分からない
    text: 分かるのは土地被覆ごとの面積
    role: none
  - title: 一覧にない施設
    text: データベース漏れは対象外
    role: none
