<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 204" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>環境省の検討業務の3つの要点。苦手な地形、検証の方法、配点</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="204" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="159.8" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">苦手な地形を明記</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">高層ビルのある市街地、</tspan><tspan x="80.0" y="102.7">起伏のある地形、発災</tspan><tspan x="80.0" y="122.9">前から水のある田んぼ・</tspan><tspan x="80.0" y="143.2">池。ここで浸水判定の</tspan><tspan x="80.0" y="163.4">精度を上げる</tspan></text><rect x="252.0" y="22.0" width="216.0" height="159.8" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">公表値と比べて検証</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">過去の災害の衛星デー</tspan><tspan x="310.0" y="102.7">タを、消防庁や自治体</tspan><tspan x="310.0" y="122.9">の被害結果と比べる。</tspan><tspan x="310.0" y="143.2">最低5災害程度を推奨</tspan></text><rect x="482.0" y="22.0" width="216.0" height="159.8" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">配点は精度の検証</tspan><tspan x="540.0" y="78.4">に厚い</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="104.8">技術点200点のうち、</tspan><tspan x="540.0" y="125.0">浸水域の判定精度に30</tspan><tspan x="540.0" y="145.3">点、閾値の検証に30点。</tspan><tspan x="540.0" y="165.6">提案書は12月4日まで</tspan></text></svg>
