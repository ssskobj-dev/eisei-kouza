# 時事記事「環境省がSAR衛星で災害廃棄物の発生量を推計する検討業務を公告」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害データ・被害把握
    title: SAR衛星で災害廃棄物を推計
    sub: 環境省が公告。「苦手」な3つの地形を、自治体はどう読むか

  - id: fig-1
    type: cards
    alt: 環境省の検討業務の3つの要点。苦手な地形、検証の方法、配点
    columns: 3
    items:
      - title: 苦手な地形を明記
        text: 高層ビルのある市街地、起伏のある地形、発災前から水のある田んぼ・池。ここで浸水判定の精度を上げる
      - title: 公表値と比べて検証
        text: 過去の災害の衛星データを、消防庁や自治体の被害結果と比べる。最低5災害程度を推奨
      - title: 配点は精度の検証に厚い
        text: 技術点200点のうち、浸水域の判定精度に30点、閾値の検証に30点。提案書は12月4日まで

  - id: fig-2
    type: split
    alt: 衛星の推計が受け持つことと、受け持たないこと
    link: ⇔
    left:
      title: 衛星が受け持つ
      items:
        - 発災直後の被害棟数（浸水の範囲と深さ）の推計
        - 現地に入れない間の、仮置場と処理先の初動の目安
        - 公表値との比較で、外れ方の傾向を知る
    right:
      title: 衛星では決まらない
      role: none
      items:
        - 発生原単位（片付けごみ1棟1.7トンなど）の当たり外れ
        - 1,000棟未満の水害（目安500トン程度と決まっている）
        - 罹災証明の被害認定。推計は初動の材料
    note: 発生量＝被害量×原単位。衛星は式の「被害量」の側だけを受け持つ
