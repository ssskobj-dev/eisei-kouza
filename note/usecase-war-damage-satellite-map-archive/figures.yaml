# note記事「戦災の記録、写真だけでは場所とつながらない。衛星データでどこまで残せるか。東京大学の立体地図と教育・報道での使い方」の見出し画像と図。
figures:
- id: thumbnail
  type: thumbnail
  kind: usecase
  tag: 生活・文化・その他
  title: 戦災の記録を衛星で地図に残す
  sub: 東京大学の研究室が約130点を地図化。位置の特定は手作業
- id: fig-1
  type: split
  alt: 衛星画像に任せることと、制作チームが行うこと
  link: ＋
  left:
    title: 衛星画像が示す
    items:
    - 入れない場所の被害を上から記録する
    - 同じ縮尺で面として示す
    - 撮影時点の姿を残す
  right:
    title: 制作チームが行う
    items:
    - 出どころと利用条件を確かめる
    - 地点を手作業で特定して重ねる
    - 証言や3Dモデルと束ねて公開する
  note: 東京大学の研究室は1か月で約130点を地図化。いつ誰が壊したかは別の情報で
- id: fig-2
  type: cards
  alt: この使い方の5つの限界
  columns: 2
  items:
  - title: 載せられるのは公開画像
    text: 提供元が公開した範囲と時期に縛られる
    role: none
  - title: 地点の特定は手作業
    text: 住宅地は難しく、1地点30分の例も
    role: none
  - title: 画像は撮影時点の姿
    text: いつ誰が壊したかは証言と調査で
    role: none
  - title: 信頼性の見極めが要る
    text: 場所や日付の違う画像が混じる
    role: none
  - title: 無償の10mでは建物は無理
    text: 広い焼失や浸水は示せる
    role: none
