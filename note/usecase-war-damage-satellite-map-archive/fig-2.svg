<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>この使い方の5つの限界</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="302" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">載せられるのは公開画像</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">提供元が公開した範囲と時期に縛られる</tspan></text><rect x="367.0" y="22.0" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="58.5">2</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="425.0" y="56.0">地点の特定は手作業</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="82.4">住宅地は難しく、1地点30分の例も</tspan></text><rect x="22.0" y="112.7" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="143.7" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="149.2">3</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="146.7">画像は撮影時点の姿</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="173.1">いつ誰が壊したかは証言と調査で</tspan></text><rect x="367.0" y="112.7" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="143.7" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="149.2">4</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="425.0" y="146.7">信頼性の見極めが要る</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="173.1">場所や日付の違う画像が混じる</tspan></text><rect x="22.0" y="203.3" width="331.0" height="76.7" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="234.3" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="239.8">5</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="80.0" y="237.3">無償の10mでは建物は無理</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="263.7">広い焼失や浸水は示せる</tspan></text></svg>
