# 時事記事「農水省がスマート農業技術活用促進法の開発供給実施計画を2件認定、1件はみちびきで水田を自走する除草ロボ」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 農業
    title: みちびきで走る除草ロボを認定
    sub: 農業法人は、計画認定の制度をどう使うか

  - id: fig-1
    type: cards
    alt: 11月6日に認定された開発供給実施計画。水田の除草装置、施設イチゴの自動送風受粉システム、2025年5月認定の計画の変更
    columns: 3
    items:
      - title: 水田の除草装置
        text: みちびきの衛星測位で自動運転し、除草ブラシで土をかき混ぜる。水田作の除草で労働時間80%削減に資する技術。実施期間3年
      - title: イチゴの受粉装置
        text: 自動送風で受粉。適した風向きと風速を保ち、温室を自律走行する。施設野菜・花き作で付加価値額30%向上に資する技術。実施期間5年
      - title: 計画の変更を認定
        text: 2025年5月に認定された計画の変更。変更の内容は発表に書かれていない
        role: none

  - id: fig-2
    type: split
    alt: 今回の認定で農業法人に変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - みちびきの測位で水田を自走する除草装置が、認定された計画に加わった
        - 農業者は、自分の経営の計画（生産方式革新実施計画）の認定で、融資や税制の支援を受けられる
        - 作業そのものを機械が代わる技術の選択肢が、水田と施設で1つずつ増えた
    right:
      title: 変わらないこと
      role: none
      items:
        - 認定は計画の審査。自分の圃場で何割減るかは別
        - 供給の時期と価格は、概要に書かれていない
        - みちびきは位置を知る衛星。生育や雑草を見るのは衛星データ
    note: 「作業を機械が代わる」技術と「見回りの手間を減らす」技術を分けて比べる
