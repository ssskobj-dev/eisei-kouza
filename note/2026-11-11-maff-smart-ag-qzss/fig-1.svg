<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>11月6日に認定された開発供給実施計画。水田の除草装置、施設イチゴの自動送風受粉システム、2025年5月認定の計画の変更</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="222" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">水田の除草装置</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">みちびきの衛星測位で</tspan><tspan x="80.0" y="102.7">自動運転し、除草ブラ</tspan><tspan x="80.0" y="122.9">シで土をかき混ぜる。</tspan><tspan x="80.0" y="143.2">水田作の除草で労働時</tspan><tspan x="80.0" y="163.4">間80%削減に資する技</tspan><tspan x="80.0" y="183.7">術。実施期間3年</tspan></text><rect x="252.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">イチゴの受粉装置</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">自動送風で受粉。適し</tspan><tspan x="310.0" y="102.7">た風向きと風速を保ち、</tspan><tspan x="310.0" y="122.9">温室を自律走行する。</tspan><tspan x="310.0" y="143.2">施設野菜・花き作で付</tspan><tspan x="310.0" y="163.4">加価値額30%向上に資</tspan><tspan x="310.0" y="183.7">する技術。実施期間5年</tspan></text><rect x="482.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">計画の変更を認定</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">2025年5月に認定され</tspan><tspan x="540.0" y="102.7">た計画の変更。変更の</tspan><tspan x="540.0" y="122.9">内容は発表に書かれて</tspan><tspan x="540.0" y="143.2">いない</tspan></text></svg>
