# note記事「光学とSAR、どちらを使えばいいのか」の見出し画像と図。
# python scripts/figures.py common-optical-sar で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 基礎
    title: 光学か、SARか
    sub: 太陽の光で撮るか、自分で電波を出すか

  - id: fig-1
    type: split
    alt: 光学衛星とSAR衛星の違い
    link: vs
    left:
      title: 光学衛星
      items:
        - 太陽光の反射を写す
        - 人の目に近い写真
        - 雲と夜は撮れない
        - 見た目の判別に強い
    right:
      title: SAR衛星
      items:
        - 自分で電波を出す
        - 雲や夜でも撮れる
        - 写真とは別物。読み方に慣れが要る
        - 地面の動きや水の有無に強い
    note: どちらも、細かく撮るほど一度に撮れる幅は狭く、同じ場所に戻る回数は減る

  - id: fig-2
    type: scale
    alt: 細かさ、幅、頻度の関係
    left: 細かい・狭い・まれ
    right: 粗い・広い・頻繁
    items:
      - title: スポットライト
        text: だいち2号。1〜3m、幅25km
      - title: 高分解能
        text: だいち2号。3m、幅50km
      - title: 標準モード
        text: Sentinel-1。5m×20m、幅250km
      - title: 広域観測
        text: だいち2号。100m、幅350km
