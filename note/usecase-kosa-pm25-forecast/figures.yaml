# note記事「黄砂の注意喚起、当日では遅い。衛星を取り込んだ予測図で前日にどこまで言えるか」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 環境・水
    title: 黄砂の飛来を前日に知らせる
    sub: ひまわりの観測を取り込んだ、3日先までの予測図

  - id: fig-1
    type: split
    alt: 衛星と予測モデルが行うことと、自治体や事業者が行うこと
    link: ＋
    left:
      title: 衛星と予測モデルが行う
      items:
        - 大陸から日本まで高頻度で観測する
        - 観測で予測の濃度を補正する
        - 3日先までの分布図を毎朝出す
    right:
      title: 自治体や事業者が行う
      items:
        - 知らせを出す基準を決める
        - 屋外の行事や作業を変える
        - 地上の観測値で振り返る
    note: 図は数値モデルの計算値。地点の濃度は地上の観測で確かめる

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 雲の下は観測しにくい
        text: 時系列で一部を補う
        role: none
      - title: 夜間は観測できない
        text: 太陽光の反射を使うため
        role: none
      - title: 地上の濃度は計算値
        text: 衛星が測るのは柱全体の濁り
        role: none
      - title: 改善の数字は1事例
        text: 2016年5月の煙で約29%
        role: none
      - title: 濃度の確定は地上の観測
        text: 目視、ライダー、SPM
        role: none
