# note記事「衛星の地図をもらったが、見て終わり。業務の流れのどこに入れれば、判断の材料になるか」の見出し画像と図。
# python scripts/figures.py marketer-workflow-fit で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 衛星データマーケッター 2級
    title: 衛星の地図、見て終わりにしない
    sub: 業務の流れのどこに入れ、何を決める材料にするか

  - id: fig-1
    type: flow
    alt: 農地の現地確認に衛星を入れた後の流れ
    steps:
      - title: 一覧を作る
        text: 対象の地図データを用意
        who: human
      - title: 解析して分ける
        text: 4区分に色分けする
        who: satellite
      - title: 要確認を見回る
        text: 候補の農地だけ現地へ
        who: human
      - title: 抜き取り確認
        text: 不要判定の数%を見回る
        who: human
      - title: 確定して記録
        text: 判定は人が決める
        who: human

  - id: fig-2
    type: split
    alt: 成果物と、それで決めること
    link: →
    left:
      title: 受け取る成果物
      items:
        - 4区分に色分けした地図とデータ
        - 点ごとの変動量と経緯グラフ
        - 現地調査候補箇所図
        - 沈下量の分布図と一覧表
    right:
      title: それで決めること
      items:
        - どの農地を見回るか
        - どの斜面から現地調査するか
        - 来年度の水準測量の路線
        - 省く範囲と抜き取りの対象
    note: 対にならない成果物は、受け取らないか、形を変えてもらう
