# note記事「管内の圃場、全部は回れない」の見出し画像と図。
# python scripts/figures.py agri-growth-patrol で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 農業向け
    title: 生育マップで回る順番を決める
    sub: 管内の圃場、全部は回れない。衛星でどこまで絞れるか

  - id: fig-1
    type: split
    alt: 衛星に任せられることと、人が行うことの分担
    link: ＋
    left:
      title: 衛星に任せられる
      items:
        - 管内の全圃場を、同じ日に見る
        - 生育の濃い薄いで、回る順番を付ける
        - 晴れた日ごとに更新する
    right:
      title: 人が行う
      items:
        - 現地で草丈、茎数、葉色を測る
        - ムラの原因を見分ける
        - 追肥や水管理を決めて伝える
    note: 生育マップは「診断の代わり」ではなく「見に行く順番を決める道具」

  - id: fig-2
    type: flow
    alt: 巡回の順番を決める5つの手順
    steps:
      - title: 画像を選ぶ
        text: 晴れた日、雲なし
        who: satellite
      - title: 筆ごとに平均
        text: 筆の中は見ない
        who: satellite
      - title: 外れた筆を拾う
        text: 管内の平均と比べる
        who: satellite
      - title: 実測して関係式
        text: 高低から数筆ずつ
        who: human
      - title: 順番に回る
        text: 原因と対策を決める
        who: human
