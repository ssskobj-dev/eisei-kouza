# 時事記事「国交省が上下水道DX技術カタログの追加募集を開始、要素技術の例に「人工衛星」を明記」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ監視
    title: 上下水道DXカタログ追加募集
    sub: 「人工衛星」の技術を、自治体は何として読むか

  - id: fig-1
    type: cards
    alt: 2026年11月13日の募集の3つの要点。対象の分野、実績の条件、費用の記載
    columns: 3
    items:
      - title: 対象
        text: 点検・調査・診断と、台帳の管理の2分野。要素技術の例に「人工衛星」
      - title: 実績
        text: 公的な現場での導入か実証が必須。民間の施設や「試行中」は数えない
      - title: 費用
        text: 初期と運用の費用を試算の条件つきで必ず書く。「要相談」は不可

  - id: fig-2
    type: split
    alt: カタログに載っていることで分かることと、分からないこと
    link: ⇔
    left:
      title: カタログで分かる
      items:
        - 費用の目安と、試算の条件
        - どの自治体の現場で試したか
        - 実用化の想定時期と、問い合わせ先
    right:
      title: カタログでは分からない
      role: none
      items:
        - 精度（国は評価・審査・認証をしていない）
        - 自分の管路で現地調査をどれだけ減らせるか
        - 漏水の場所の確定（現地の作業が残る）
    note: 載っていることは「候補に入れる理由」。「選ぶ理由」は事業者に確かめて作る
