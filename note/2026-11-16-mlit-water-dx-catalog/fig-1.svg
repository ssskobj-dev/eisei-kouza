l="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">実績</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">公的な現場での導入</tspan><tspan x="310.0" y="102.7">か実証が必須。民間</tspan><tspan x="310.0" y="122.9">の施設や「試行中」</tspan><tspan x="310.0" y="143.2">は数えない</tspan></text><rect x="482.0" y="22.0" width="216.0" height="137.4" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">費用</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">初期と運用の費用を試</tspan><tspan x="540.0" y="102.7">算の条件つきで必ず書</tspan><tspan x="540.0" y="122.9">く。「要相談」は不可</tspan></text></svg>
