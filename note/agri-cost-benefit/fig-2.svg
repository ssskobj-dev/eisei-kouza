<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>導入前に決めておく6つの項目</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="272" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="117.2" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">目的</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">使う目的を1つに絞り、</tspan><tspan x="80.0" y="102.7">比べる項目を決めた</tspan></text><rect x="252.0" y="22.0" width="216.0" height="117.2" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">基準の記録</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">導入前の巡回時間、</tspan><tspan x="310.0" y="102.7">資材費、収量を圃場</tspan><tspan x="310.0" y="122.9">ごとに</tspan></text><rect x="482.0" y="22.0" width="216.0" height="117.2" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">費用の全体</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">利用料のほか、農機、</tspan><tspan x="540.0" y="102.7">研修、通信、見る時間</tspan></text><rect x="22.0" y="153.2" width="216.0" height="96.9" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="184.2" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="189.7">4</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="80.0" y="187.2">比べ方</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="213.6">前年か、同じ年に使わ</tspan><tspan x="80.0" y="233.8">ない圃場と分けるか</tspan></text><rect x="252.0" y="153.2" width="216.0" height="96.9" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="184.2" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="189.7">5</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="310.0" y="187.2">欠測の扱い</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="213.6">雲で届かない回数と、</tspan><tspan x="310.0" y="233.8">代わりに回る時間</tspan></text><rect x="482.0" y="153.2" width="216.0" height="96.9" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="184.2" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="189.7">6</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="540.0" y="187.2">続ける基準</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="213.6">1年後に何がどうなって</tspan><tspan x="540.0" y="233.8">いたら続けるか</tspan></text></svg>
