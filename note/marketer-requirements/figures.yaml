# note記事「「衛星で農地の状況を把握したい」は要求ではない」の見出し画像と図。
# python scripts/figures.py marketer-requirements で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 衛星データマーケッター 1級
    title: 「把握したい」は要求ではない
    sub: 対象、範囲、頻度、精度、納期の書き方

  - id: fig-1
    type: cards
    alt: 要求の文の型：7つの項目
    columns: 2
    items:
      - title: 用途
        text: 誰が何を決めるか。確定は誰が行うか
        mark: "1"
      - title: 対象
        text: 判断の単位の一覧。台帳から出す
        mark: "2"
      - title: 範囲
        text: 図面で示す広がりと、切り出しの範囲
        mark: "3"
      - title: 頻度
        text: 更新の間隔と、観測の期間・回数
        mark: "4"
      - title: 精度
        text: 見逃しと誤検出の許容と、比べる相手
        mark: "5"
      - title: 納期
        text: 観測の期限と納品日。データ数が変わる時の扱い
        mark: "6"
      - title: 検証
        text: 抜き取りの割合と、誰が行うか
        mark: "7"
        role: human

  - id: fig-2
    type: split
    alt: 精度の要求は2つの数字で書く
    link: ＋
    left:
      title: 見逃し
      items:
        - 実際にあるのに拾えなかった割合
        - 省いた側（不要判定）の抜き取りで数える
        - 見逃すと損失が出る業務で重く見る
    right:
      title: 誤検出
      items:
        - 拾ったが実際にはなかった割合
        - 候補（要確認）の現地確認で数える
        - 誤報で現場の手間が増える業務で重く見る
    note: どちらを重く見るかは業務で決める。地域・季節・対象・比べた相手を必ず添える
