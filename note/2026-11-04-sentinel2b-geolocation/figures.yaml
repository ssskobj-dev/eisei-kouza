# 時事記事「無償の光学衛星Sentinel-2B、10月20〜22日の画像に大きな位置ずれ」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 農地調査
    title: Sentinel-2B、3日分に位置ずれ
    sub: 作付け確認や変化の検出で、手元の画像をどう扱うか

  - id: fig-1
    type: cards
    alt: Sentinel-2Bの位置ずれの知らせについて、出典に書かれた4つの要点
    columns: 2
    items:
      - title: 何が起きたか
        text: 10月20〜22日に撮った2Bの一部の画像に、大きな位置のずれ。2Aと2Cの記述はない
      - title: 配布元の対応
        text: 該当の画像を配布から削除中。専用の再処理を含めて回復の方法を調査。時期は未定
      - title: 影響の範囲
        text: 影響のある撮影の一覧は111件の識別子。地域は一覧だけでは読めない
      - title: 本来の精度
        text: 位置の精度の要求は基準点なしで20m（2σ）、画像どうしの重ね合わせは0.3画素

  - id: fig-2
    type: split
    alt: この知らせで変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 10月20〜22日の2Bの画像を使った判定は、別の日の画像で確かめるまで確定させない
        - 10月下旬に急に「変化あり」が出た場所は、まず位置ずれを疑う
        - 削除後は再取得できない。手元の画像に印を付けて根拠から外す
    right:
      title: 変わらないこと
      role: none
      items:
        - Sentinel-2のデータは無償のまま。対象は2Bの3日分だけ
        - ずれの大きさと原因は公表されていない
        - 該当の有無を確かめる仕事は、使う側に残る
    note: 報告書に「衛星名と撮影日の一覧」があれば、受け取る側で該当の有無を確かめられる
