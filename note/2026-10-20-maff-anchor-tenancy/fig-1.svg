<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 184" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>農水省と内閣府の資料の要点</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="184" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="139.6" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">要求額は136.3億円</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">農水省の宇宙関連予</tspan><tspan x="80.0" y="102.7">算。令和8年度当初は</tspan><tspan x="80.0" y="122.9">35.2億円</tspan></text><rect x="252.0" y="22.0" width="216.0" height="139.6" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">課題はバラバラ</tspan><tspan x="310.0" y="78.4">な調達</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="104.8">部署や自治体が個別に</tspan><tspan x="310.0" y="125.0">買い、衛星の特性を活</tspan><tspan x="310.0" y="145.3">かしきれない</tspan></text><rect x="482.0" y="22.0" width="216.0" height="139.6" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">国がまとめて買う案</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">政府調達の戦略的活用</tspan><tspan x="540.0" y="102.7">も含め、全国・制度横</tspan><tspan x="540.0" y="122.9">断で検討</tspan></text></svg>
