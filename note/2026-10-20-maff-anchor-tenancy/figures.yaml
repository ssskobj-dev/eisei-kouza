# 時事記事「農水省が『衛星データを国がまとめて買う』方向で来年度予算を要求」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 国の方針
    title: 衛星データ、国がまとめて買う
    sub: 現地確認の発注はどう変わるか

  - id: fig-1
    type: cards
    alt: 農水省と内閣府の資料の要点
    columns: 3
    items:
      - title: 要求額は136.3億円
        text: 農水省の宇宙関連予算。令和8年度当初は35.2億円
      - title: 課題はバラバラな調達
        text: 部署や自治体が個別に買い、衛星の特性を活かしきれない
      - title: 国がまとめて買う案
        text: 政府調達の戦略的活用も含め、全国・制度横断で検討

  - id: fig-2
    type: split
    alt: 国の一括調達の方向で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わるかもしれないこと
      items:
        - 自治体が単独で買う部分が減る
        - 買い手の単位が全国・制度横断になる
        - 小型SARの政府調達を国の機関が試す
    right:
      title: 変わらないこと
      role: none
      items:
        - まだ要望の段階。仕組みも時期も未定
        - 現地の確認はゼロにならない
        - 判読の基準と精度の条件は使う側が決める
    note: 来年度に単独調達を予定する自治体は、国の対象になるかを先に確かめる
