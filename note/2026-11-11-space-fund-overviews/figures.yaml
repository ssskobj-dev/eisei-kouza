# 時事記事「宇宙戦略基金の衛星データ利用システム実装加速化事業、採択17件の技術開発課題の概要を公表」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ
    title: 衛星データ利用、採択17件の概要
    sub: 発注する側は、数年後に何が来るかをどう読むか

  - id: fig-1
    type: cards
    alt: 採択された17件の区分。国内向けの開発・実証（補助）10件、海外での開発・実証と基盤整備（委託）6件、開発・実証の環境整備（委託）1件
    columns: 3
    items:
      - title: 国内向け 10件
        text: 開発・実証（補助）。盛土の検知、地盤変動の要因の推定、SARと地上センサーの組み合わせ、地理空間基盤モデルなど
      - title: 海外向け 6件
        text: 開発・実証（委託）。欧米、ASEAN、インド、中東、太平洋島嶼国、アフリカの市場開拓や社会課題
      - title: 環境整備 1件
        text: 委託。国産小型衛星のデータの評価、校正、検証、補正の手法と、利用者向けの手引き

  - id: fig-2
    type: split
    alt: 概要の公表で発注する側に変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 課題ごとの目的と「想定する利用者」が、提案を受ける前に読める
        - 国産小型衛星のデータを確かめる手引きが整備される予定
        - 追加公募は11月26日正午締切。次の採択が続く
    right:
      title: 変わらないこと
      role: none
      items:
        - 概要は計画。精度、費用、成果はこれから
        - 17件のうち5件は、契約後まで未公表
        - 「自治体向け」とあっても、自分の業務で使える保証はない
    note: 自分の業務に近い課題を1つ選び、想定する利用者に自分の組織が入っているか確かめる
