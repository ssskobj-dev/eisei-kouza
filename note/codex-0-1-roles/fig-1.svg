<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 181" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>AIに任せること、人が決めること、人が確かめることの3つの役割</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="181" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="137.4" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">AIに任せる</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">コードを書く。エラー</tspan><tspan x="80.0" y="102.7">を直す。1行ずつ説明す</tspan><tspan x="80.0" y="122.9">る。別の書き方を示す</tspan></text><rect x="252.0" y="22.0" width="216.0" height="137.4" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">人が決める</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">問い。衛星とデータ。</tspan><tspan x="310.0" y="102.7">期間、範囲、雲の条件。</tspan><tspan x="310.0" y="122.9">何が出れば合格か</tspan></text><rect x="482.0" y="22.0" width="216.0" height="137.4" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">人が確かめる</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">コードが決めたとおり</tspan><tspan x="540.0" y="102.7">か。値と地図が妥当か。</tspan><tspan x="540.0" y="122.9">何が言えて、何が言え</tspan><tspan x="540.0" y="143.2">ないか</tspan></text></svg>
