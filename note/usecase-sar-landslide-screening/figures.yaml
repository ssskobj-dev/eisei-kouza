# note記事「大雨の直後、ヘリが飛べない。衛星データのSAR判読で崩壊斜面はどこまで拾えるか」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 防災
    title: 崩壊斜面を衛星のSAR判読で絞る
    sub: 2023年度の15災害に見る、効き目と見逃しの条件

  - id: fig-1
    type: split
    alt: 衛星に任せることと、砂防部局が行うこと
    link: ＋
    left:
      title: 衛星のSAR判読が行う
      items:
        - 夜間や悪天候でも地表の変化を捉える
        - 崩壊の疑い箇所を位置図にする
        - 広い範囲を一度に見る
    right:
      title: 砂防部局が行う
      items:
        - ヘリや現地調査の行き先を決める
        - 河道閉塞の恐れがある場所を先に確かめる
        - 見逃しを前提に別の手段で補う
    note: 拾った箇所は当たりやすいが、拾えない箇所が多い（砂防学会2024年度の発表）

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 小さな崩壊は対象外
        text: 5,000m²未満は判読しない
        role: none
      - title: 電波の角度で見逃す
        text: 局所入射角が約60度以上で増える
        role: none
      - title: 倒木が残ると見逃す
        text: 裸地なら拾いやすい
        role: none
      - title: 古い災害前画像は空振り
        text: 約5年前だと非常に多い
        role: none
      - title: 大規模崩壊でも見逃し
        text: 能登では再現率6%
        role: none
