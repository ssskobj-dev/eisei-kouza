<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 273" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>衛星に任せることと、砂防部局が行うこと</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="273" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="311.0" height="178.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><rect x="22.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#2f5d94" stroke="none" stroke-width="1.5"/><rect x="22.0" y="48" width="311.0" height="16" fill="#2f5d94"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="177.5" y="50.0">衛星のSAR判読が行う</tspan></text><circle cx="46.0" cy="87.0" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="92.0">夜間や悪天候でも地表の変化を捉える</tspan></text><circle cx="46.0" cy="116.3" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="121.3">崩壊の疑い箇所を位置図にする</tspan></text><circle cx="46.0" cy="145.6" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="150.6">広い範囲を一度に見る</tspan></text><rect x="387.0" y="22.0" width="311.0" height="178.2" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><rect x="387.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#ff6b2c" stroke="none" stroke-width="1.5"/><rect x="387.0" y="48" width="311.0" height="16" fill="#ff6b2c"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="542.5" y="50.0">砂防部局が行う</tspan></text><circle cx="411.0" cy="87.0" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="92.0">ヘリや現地調査の行き先を決める</tspan></text><circle cx="411.0" cy="116.3" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="121.3">河道閉塞の恐れがある場所を先に確</tspan><tspan x="425.0" y="141.6">かめる</tspan></text><circle cx="411.0" cy="165.9" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="170.9">見逃しを前提に別の手段で補う</tspan></text><circle cx="360.0" cy="111.1" r="21" fill="#fff" stroke="#0b1524" stroke-width="2"/><text font-size="19" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="118.1">＋</tspan></text><rect x="22.0" y="214.2" width="676.0" height="37.0" rx="8" fill="#eef1f3" stroke="none" stroke-width="1.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="240.2">拾った箇所は当たりやすいが、拾えない箇所が多い（砂防学会2024年度の発表）</tspan></text></svg>
