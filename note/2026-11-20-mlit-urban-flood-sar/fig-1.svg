<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>国交省の都市型水害対策とりまとめの3つの要点。衛星で浸水範囲を把握する仕組み、千葉豪雨では民間小型SARを使った、観測から解析まで約1時間</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="242" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">仕組みの構築を明記</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">参考資料に「衛星画像</tspan><tspan x="80.0" y="102.7">の活用等による、浸水</tspan><tspan x="80.0" y="122.9">範囲を迅速に把握する</tspan><tspan x="80.0" y="143.2">仕組みの構築」。官民</tspan><tspan x="80.0" y="163.4">の衛星で観測機会を確</tspan><tspan x="80.0" y="183.7">保し、予約から解析を</tspan><tspan x="80.0" y="203.9">ワンストップで</tspan></text><rect x="252.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">JAXA衛星は撮れず</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">千葉豪雨では国の衛星</tspan><tspan x="310.0" y="102.7">の観測機会が得られず、</tspan><tspan x="310.0" y="122.9">民間の小型レーダ衛星</tspan><tspan x="310.0" y="143.2">で浸水域を把握。だい</tspan><tspan x="310.0" y="163.4">ち4号・2号の観測機会</tspan><tspan x="310.0" y="183.7">は1日2回</tspan></text><rect x="482.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">撮像から65分</tspan><tspan x="540.0" y="78.4">で解析</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="104.8">8月14日の例。3時42分</tspan><tspan x="540.0" y="125.0">に予約、7時35分に撮</tspan><tspan x="540.0" y="145.3">像、8時40分に解析完</tspan><tspan x="540.0" y="165.6">了。予約は撮像の約3時</tspan><tspan x="540.0" y="185.8">間半前まで</tspan></text></svg>
