<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>衛星の推定図で分かることと、現地確認やセンサが必要なこと</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="314" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="311.0" height="218.8" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><rect x="22.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#2f5d94" stroke="none" stroke-width="1.5"/><rect x="22.0" y="48" width="311.0" height="16" fill="#2f5d94"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="177.5" y="50.0">衛星の推定図で分かること</tspan></text><circle cx="46.0" cy="87.0" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="92.0">浸水した範囲のおおまかな広がり。排水</tspan><tspan x="60.0" y="112.3">や通行止めの計画に</tspan></text><circle cx="46.0" cy="136.6" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="141.6">浸水想定区域と重ねて、想定の外の浸水</tspan><tspan x="60.0" y="161.9">を見つける</tspan></text><circle cx="46.0" cy="186.2" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="191.2">夜や雨雲の下でも撮れる（SAR）</tspan></text><rect x="387.0" y="22.0" width="311.0" height="218.8" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><rect x="387.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#ff6b2c" stroke="none" stroke-width="1.5"/><rect x="387.0" y="48" width="311.0" height="16" fill="#ff6b2c"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="542.5" y="50.0">衛星だけでは足りないこと</tspan></text><circle cx="411.0" cy="87.0" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="92.0">実際の浸水範囲と異なる可能性。被害の</tspan><tspan x="425.0" y="112.3">認定は現地確認で</tspan></text><circle cx="411.0" cy="136.6" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="141.6">密集市街地は建物の反射が強く、画像だ</tspan><tspan x="425.0" y="161.9">けでは検出しにくい</tspan></text><circle cx="411.0" cy="186.2" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="191.2">浸水センサとSNSのデータを、時間と空</tspan><tspan x="425.0" y="211.5">間で組み合わせる</tspan></text><circle cx="360.0" cy="131.4" r="21" fill="#fff" stroke="#0b1524" stroke-width="2"/><text font-size="19" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="138.4">＋</tspan></text><rect x="22.0" y="254.8" width="676.0" height="37.0" rx="8" fill="#eef1f3" stroke="none" stroke-width="1.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="280.8">国交省の参考資料が示した組み合わせ。衛星データは単独で答えを出す道具ではない</tspan></text></svg>
