# 時事記事「国交省が都市型水害の対策方針をとりまとめ、衛星画像で浸水範囲を把握する仕組みの構築を明記」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害・水害
    title: 浸水範囲を衛星で、国の方針に
    sub: 千葉豪雨はJAXA衛星に観測機会なし。民間小型SARで把握

  - id: fig-1
    type: cards
    alt: 国交省の都市型水害対策とりまとめの3つの要点。衛星で浸水範囲を把握する仕組み、千葉豪雨では民間小型SARを使った、観測から解析まで約1時間
    columns: 3
    items:
      - title: 仕組みの構築を明記
        text: 参考資料に「衛星画像の活用等による、浸水範囲を迅速に把握する仕組みの構築」。官民の衛星で観測機会を確保し、予約から解析をワンストップで
      - title: JAXA衛星は撮れず
        text: 千葉豪雨では国の衛星の観測機会が得られず、民間の小型レーダ衛星で浸水域を把握。だいち4号・2号の観測機会は1日2回
      - title: 撮像から65分で解析
        text: 8月14日の例。3時42分に予約、7時35分に撮像、8時40分に解析完了。予約は撮像の約3時間半前まで

  - id: fig-2
    type: split
    alt: 衛星の推定図で分かることと、現地確認やセンサが必要なこと
    link: ＋
    left:
      title: 衛星の推定図で分かること
      items:
        - 浸水した範囲のおおまかな広がり。排水や通行止めの計画に
        - 浸水想定区域と重ねて、想定の外の浸水を見つける
        - 夜や雨雲の下でも撮れる（SAR）
    right:
      title: 衛星だけでは足りないこと
      role: human
      items:
        - 実際の浸水範囲と異なる可能性。被害の認定は現地確認で
        - 密集市街地は建物の反射が強く、画像だけでは検出しにくい
        - 浸水センサとSNSのデータを、時間と空間で組み合わせる
    note: 国交省の参考資料が示した組み合わせ。衛星データは単独で答えを出す道具ではない
