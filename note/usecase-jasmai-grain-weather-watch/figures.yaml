    items:
      - title: 土壌水分
        text: 「しずく」GCOM-Wなど。格子0.1度、約11km
      - title: 降水量
        text: 全球降水マップGSMaP。格子0.1度。日・週の地図も
      - title: 植生指標・温度・日射
        text: 「しきさい」GCOM-C。格子0.05度、約5.5km
      - title: 単収・作付面積
        text: USDAの統計。国別と米国の州別
        role: human

  - id: fig-2
    type: cards
