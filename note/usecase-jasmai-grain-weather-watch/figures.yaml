    type: thumbnail
    kind: usecase
    tag: 農業・食料
    title: 穀物産地の干ばつを衛星で見る
    sub: 農林水産省が無料で公開。半月ごとの平年差、収量は出ない

  - id: fig-1
    type: cards
    alt: JASMAIが配るデータと、その出どころ
