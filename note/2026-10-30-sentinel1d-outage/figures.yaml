# 時事記事「無償のレーダー衛星Sentinel-1D、10月26〜27日の観測データが取り戻せず」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 地盤変位
    title: Sentinel-1D、2日分の欠け
    sub: 地盤変位の監視で、欠けた日をどう扱うか

  - id: fig-1
    type: cards
    alt: Sentinel-1Dの不具合の発表と、現在のSentinel-1の体制について、出典に書かれた4つの要点
    columns: 2
    items:
      - title: 何が起きたか
        text: 2026年10月26日に衛星の不具合。翌27日までのデータは取り戻せない。原因の記述はない
      - title: 今の体制
        text: 6月29日に1Aが運用を終え、1Cと1Dの2機。2機で6日ごと、1機なら12日ごとの観測
      - title: 今年2回目
        text: 5月29日にも、取り戻せないデータの欠けがあった。10月28日にも「使えない可能性」の報告
      - title: 影響の公表
        text: どの軌道・地域が欠けたかは、運用状況の公開ページ（ダッシュボード）のイベント欄に載る

  - id: fig-2
    type: split
    alt: この不具合で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 10月26〜27日の観測が対象地を含めば、地盤変位の時系列に穴が開く
        - 次の観測までの間隔が、いつもより長くなる
        - 成果の報告書に「衛星名と撮影日の一覧」を付けてもらう意味が増す
    right:
      title: 変わらないこと
      role: none
      items:
        - Sentinel-1のデータは無償のまま。今回の知らせは1Dについてだけ
        - 原因は公表されていない。見通しは読み取れない
        - 欠けた範囲を確かめる仕事は、使う側に残る
    note: 継続中の監視があれば、10月26日以降の観測が対象地の時系列に含まれる予定だったかを、事業者に確かめる
