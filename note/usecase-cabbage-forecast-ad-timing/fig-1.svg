<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>衛星に任せることと、人が行うこと</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="282" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="311.0" height="187.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><rect x="22.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#2f5d94" stroke="none" stroke-width="1.5"/><rect x="22.0" y="48" width="311.0" height="16" fill="#2f5d94"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="177.5" y="50.0">衛星が行う</tspan></text><circle cx="46.0" cy="87.0" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="92.0">産地の畑の生育を定期的に観測する</tspan></text><circle cx="46.0" cy="116.3" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="121.3">現地調査と市場データに合わせる材料</tspan><tspan x="60.0" y="141.6">になる</tspan></text><circle cx="46.0" cy="165.9" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="170.9">雲があると光学の観測は欠ける</tspan></text><rect x="387.0" y="22.0" width="311.0" height="187.2" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><rect x="387.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#ff6b2c" stroke="none" stroke-width="1.5"/><rect x="387.0" y="48" width="311.0" height="16" fill="#ff6b2c"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="542.5" y="50.0">人が行う</tspan></text><circle cx="411.0" cy="87.0" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="92.0">現地で生育と天候を記録する</tspan></text><circle cx="411.0" cy="116.3" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="121.3">広告枠を組み換える</tspan></text><circle cx="411.0" cy="145.6" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="150.6">売り場と販促を組む</tspan></text><circle cx="411.0" cy="174.9" r="4" fill="#ff6b2c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="179.9">予測の当たり外れを検証する</tspan></text><circle cx="360.0" cy="115.6" r="21" fill="#fff" stroke="#0b1524" stroke-width="2"/><text font-size="19" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="122.6">＋</tspan></text><rect x="22.0" y="223.2" width="676.0" height="37.0" rx="8" fill="#eef1f3" stroke="none" stroke-width="1.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="249.2">8週間前の予測で広告と売り場の時期を合わせる。精度の数字は非公表</tspan></text></svg>
