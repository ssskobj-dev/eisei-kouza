# note記事「交付金の現地確認、1制度では衛星が割に合わない。福島市は3制度でまとめた」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 農業・食料
    title: 3つの交付金の現地確認を衛星で
    sub: 福島市は約23,000筆減、年約267万円。鍵は3制度の横断

  - id: fig-1
    type: split
    alt: 衛星に任せることと、職員が行うこと
    link: ＋
    left:
      title: 衛星の解析が行う
      items:
        - 筆ごとに耕作か不耕作かを判定する
        - 耕作地は作物の一致率、不耕作地は保全管理の状況を解析する
    right:
      title: 職員が行う
      items:
        - 荒廃の可能性がある農地を中心に見回る
        - 不要と判定された農地の一部も見回る
        - 結果をGISに反映し、制度をまたいで共有する
    note: 3制度の合計で、見回りは約23,000筆減った。見回りはなくならない

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 狭い農地は解析できない
        text: 見回りが残り、中山間では効果が小さい
        role: none
      - title: 果樹園や茶畑は判別しにくい
        text: 画像で耕作の有無が分かりにくい
        role: none
      - title: 畦畔やかんがいは直接見えない
        text: 水張りで田とみなす運用が多い
        role: none
      - title: 精度はサービスで異なる
        text: 90%超は福島市の例。注記つき
        role: none
      - title: 台帳と地図の整備が先
        text: 地名地番の表記をそろえてから
        role: none
