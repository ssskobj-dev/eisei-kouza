<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>港湾技術行動計画で衛星が書かれた3つの施策。衛星三次元測位の実用化、人工衛星による土砂のデータ取得、衛星・ドローン・カメラによる災害情報の収集</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="222" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">工事の衛星測位</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">衛星三次元測位で位置</tspan><tspan x="80.0" y="102.7">と高さを測る。令和12</tspan><tspan x="80.0" y="122.9">年度に「実用化を開始」</tspan><tspan x="80.0" y="143.2">が目標。それまでは検</tspan><tspan x="80.0" y="163.4">討の段階</tspan></text><rect x="252.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">土砂データの取得</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">人工衛星やレーザー</tspan><tspan x="310.0" y="102.7">測距（LiDAR）にフ</tspan><tspan x="310.0" y="122.9">ォーカスしたデータ</tspan><tspan x="310.0" y="143.2">取得。解析技術を融</tspan><tspan x="310.0" y="163.4">合した「データ駆動</tspan><tspan x="310.0" y="183.7">型」の予測手法</tspan></text><rect x="482.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">災害情報の収集</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">衛星やドローン、カメ</tspan><tspan x="540.0" y="102.7">ラ等で災害関連情報を</tspan><tspan x="540.0" y="122.9">収集・集積。災害監視</tspan><tspan x="540.0" y="143.2">システムの整備完了率</tspan><tspan x="540.0" y="163.4">を123か所中39%に（令</tspan><tspan x="540.0" y="183.7">和12年度）</tspan></text></svg>
