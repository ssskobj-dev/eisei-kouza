# 時事記事「国交省港湾局が5年間の港湾技術行動計画を策定」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 港湾・インフラ
    title: 港湾の5年計画に衛星が3つ
    sub: 測位の実用化、土砂データ、災害情報の収集。関わり方は

  - id: fig-1
    type: cards
    alt: 港湾技術行動計画で衛星が書かれた3つの施策。衛星三次元測位の実用化、人工衛星による土砂のデータ取得、衛星・ドローン・カメラによる災害情報の収集
    columns: 3
    items:
      - title: 工事の衛星測位
        text: 衛星三次元測位で位置と高さを測る。令和12年度に「実用化を開始」が目標。それまでは検討の段階
      - title: 土砂データの取得
        text: 人工衛星やレーザー測距（LiDAR）にフォーカスしたデータ取得。解析技術を融合した「データ駆動型」の予測手法
      - title: 災害情報の収集
        text: 衛星やドローン、カメラ等で災害関連情報を収集・集積。災害監視システムの整備完了率を123か所中39%に（令和12年度）

  - id: fig-2
    type: split
    alt: 港湾技術行動計画に書かれていることと、書かれていないこと
    link: ⇔
    left:
      title: 計画に書かれていること
      items:
        - 4分野66施策、令和8〜12年度の5年間
        - 衛星三次元測位、人工衛星による土砂データ、災害情報の収集
        - ドローン点検の講習会を年1回以上。管理者の30%程度以上が導入を検討・試行
        - 点検技術はカタログの活用を促進
    right:
      title: 計画に書かれていないこと
      role: none
      items:
        - SAR、干渉SAR、GNSSの語は本文にない
        - どの港で、いつ、いくらで発注するか
        - 衛星三次元測位と土砂データ取得の数字の目標
        - 衛星データが利用可否判断の指針でどう扱われるか
    note: 衛星の使い道を「測位」と「観測」に分けて書く。計画はその分け方の手本になる
