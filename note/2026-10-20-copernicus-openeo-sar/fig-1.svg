<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 161" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>公開された2本の手本と、その仕組み</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="161" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">収穫の時期を読む</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">2回の観測の似ている度</tspan><tspan x="80.0" y="102.7">合いが急に上がる時期</tspan><tspan x="80.0" y="122.9">を地図にする</tspan></text><rect x="252.0" y="22.0" width="216.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">地震の変位を読む</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">6日間隔のペアから干渉</tspan><tspan x="310.0" y="102.7">画像を作り、視線方向</tspan><tspan x="310.0" y="122.9">の動きに換算</tspan></text><rect x="482.0" y="22.0" width="216.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">計算は基盤の側で</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">openEOで重い処理を預</tspan><tspan x="540.0" y="102.7">け、手元は結果だけ。</tspan><tspan x="540.0" y="122.9">生データは落とさない</tspan></text></svg>
