# 時事記事「コペルニクスの公式クラウドに、SARの解析手順が公開」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 衛星データの入手
    title: SARの解析手順、公式クラウドに
    sub: 無償で、どこまでできるか

  - id: fig-1
    type: cards
    alt: 公開された2本の手本と、その仕組み
    columns: 3
    items:
      - title: 収穫の時期を読む
        text: 2回の観測の似ている度合いが急に上がる時期を地図にする
      - title: 地震の変位を読む
        text: 6日間隔のペアから干渉画像を作り、視線方向の動きに換算
      - title: 計算は基盤の側で
        text: openEOで重い処理を預け、手元は結果だけ。生データは落とさない

  - id: fig-2
    type: split
    alt: 公開された手順でできることと、変わらない限界
    link: ⇔
    left:
      title: できること
      items:
        - 提案を受ける前に、小さな範囲で自分で試す
        - 事業者の成果を、公開された手順と比べる
        - 雲や夜に左右されずに広い範囲を見る
    right:
      title: 変わらない限界
      role: none
      items:
        - 収穫以外の地表の変化も拾う
        - ノイズ、大気、幾何の影響は残る
        - 検証は使う側の仕事。精度の保証はない
    note: 無料枠は毎月1万クレジット、同時に動かせる処理は2つまで。業務で回すなら費用の見積もりが要る
