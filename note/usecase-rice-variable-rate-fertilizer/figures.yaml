# note記事「水稲の可変施肥を、衛星データの施肥マップと田植機の連携で行う」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 農業・食料
    title: 衛星の地図で田植機が可変施肥
    sub: 実証は4〜5%増収、県の試験は差なし

  - id: fig-1
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星と解析が行う
      items:
        - 衛星画像から、圃場の中の地力と生育のムラを推定する
        - 場所ごとの施肥量を指定した、可変施肥マップを作る
    right:
      title: 人と農機が行う
      items:
        - 基準の施肥量と、増減の幅を決める
        - 対応する田植機で、マップどおりに施肥する
        - 収量を測り、翌年の設計を見直す
    note: 実証は4〜5%の増収。県の試験では差が出なかった例もある

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 対応する田植機が要る
        text: 方式はメーカーごとに違う
        role: none
      - title: 増収は条件しだい
        text: 収量の高い圃場では差が出なかった
        role: none
      - title: 雲があると撮れない
        text: 梅雨の時期は取れない日が多い
        role: none
      - title: 土を測った地図ではない
        text: 過去の生育の傾向からの区分け
        role: none
      - title: 肥料で直らないムラ
        text: 水の管理、雑草、苗の量が原因のもの
        role: none
