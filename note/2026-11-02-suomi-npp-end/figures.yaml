# 時事記事「米国の衛星Suomi NPP、11月2日にデータ配信を終了」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害データ
    title: Suomi NPP、配信終了へ
    sub: 11月2日。無料の火点情報を使う側は、何を切り替えるか

  - id: fig-1
    type: cards
    alt: Suomi NPPのデータ配信の終了について、出典に書かれた4つの要点
    columns: 2
    items:
      - title: 何が起きるか
        text: 2026年11月2日13時（世界時）に、利用者へのデータ配信が終わる。復旧の予定はない
      - title: 後継の衛星
        text: NOAA-21（主）とNOAA-20（副）へ。同じVIIRSを積み、火点の画素は同じ375m
      - title: 止まる製品
        text: 火点、日中の画像、夜間の光の画像、焼けた範囲、エアロゾル指標。過去のデータは残る
      - title: 設定の変更
        text: 地図の既定の衛星、メール通知、自動取り込みの衛星の指定を、11月2日までに変える

  - id: fig-2
    type: split
    alt: 配信の終了で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - Suomi NPPの火点と夜間の光は、11月2日以降は更新されない
        - 残る2機の通過の時刻は、約50分ずれる
        - 長い時系列は、11月2日を境に別の衛星になる
    right:
      title: 変わらないこと
      role: none
      items:
        - 火点情報は無料のまま。後継の2機はすでに公開
        - 画素は375mのまま。建物1棟の被害は分からない
        - 過去のデータは残る。新旧の比較は使う側が確かめる
    note: 事業者から火点や夜間の光の解析を受け取っていれば、どの衛星のデータかを文書で確かめる
