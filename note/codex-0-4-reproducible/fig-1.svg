<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 337" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>記録に残す8項目</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="337" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">製品の名前</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">省略せずに全</tspan><tspan x="80.0" y="102.7">部。版と軌道</tspan><tspan x="80.0" y="122.9">と区画が入る</tspan></text><rect x="194.5" y="22.0" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="223.5" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="223.5" y="58.5">2</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="252.5" y="56.0">範囲</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="252.5" y="82.4">境界のファ</tspan><tspan x="252.5" y="102.7">イルの名前</tspan><tspan x="252.5" y="122.9">と日付、座</tspan><tspan x="252.5" y="143.2">標の基準</tspan></text><rect x="367.0" y="22.0" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="58.5">3</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="425.0" y="56.0">期間</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="82.4">開始日と終了</tspan><tspan x="425.0" y="102.7">日。「最新」</tspan><tspan x="425.0" y="122.9">と書かない</tspan></text><rect x="539.5" y="22.0" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="568.5" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="568.5" y="58.5">4</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="597.5" y="56.0">処理の段</tspan><tspan x="597.5" y="78.4">階と版</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="597.5" y="104.8">段階の名前と、</tspan><tspan x="597.5" y="125.0">名前に入った</tspan><tspan x="597.5" y="145.3">版の番号</tspan></text><rect x="22.0" y="175.6" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="206.6" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="212.1">5</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="80.0" y="209.6">基準の値</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="236.0">しきい値と、</tspan><tspan x="80.0" y="256.2">その出どころ</tspan></text><rect x="194.5" y="175.6" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="223.5" cy="206.6" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="223.5" y="212.1">6</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="252.5" y="209.6">道具の版</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="252.5" y="236.0">名前と版の番</tspan><tspan x="252.5" y="256.2">号の一覧。AI</tspan><tspan x="252.5" y="276.5">の名前と日付</tspan></text><rect x="367.0" y="175.6" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="206.6" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="212.1">7</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="425.0" y="209.6">AIへの</tspan><tspan x="425.0" y="232.0">指示文</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="258.4">全文と、返っ</tspan><tspan x="425.0" y="278.6">てきたコード</tspan><tspan x="425.0" y="298.9">そのもの</tspan></text><rect x="539.5" y="175.6" width="158.5" height="139.6" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="568.5" cy="206.6" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="568.5" y="212.1">8</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="597.5" y="209.6">人が確かめ</tspan><tspan x="597.5" y="232.0">たこと</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="597.5" y="258.4">見た観点と結</tspan><tspan x="597.5" y="278.6">果。見ていな</tspan><tspan x="597.5" y="298.9">い観点</tspan></text></svg>
