# note記事「「衛星の精度は何ミリですか」。この質問に、数字だけで答えてはいけない」の見出し画像と図。
# python scripts/figures.py marketer-accuracy-field-check で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 衛星データマーケッター 2級
    title: 精度は何ミリですか
    sub: 条件を添えて答え、現地確認と二段構えにする

  - id: fig-1
    type: cards
    alt: 精度を決める3つの条件
    columns: 3
    items:
      - title: 測れた点の密度
        text: 都市部と山地で、測れる割合が大きく違う
        mark: "1"
      - title: 期間と枚数
        text: 枚数が増えるほど誤差が減る。1枚では粗い
        mark: "2"
      - title: 何と比べたか
        text: 水準測量、光波測量、現地確認。点の数も
        mark: "3"

  - id: fig-2
    type: flow
    alt: 二段構えの手順と、誰が行うか
    steps:
      - title: 全体を解析
        text: 同じ条件で面を見る
        who: satellite
      - title: 順位を付ける
        text: 動きや疑いの大きい順
        who: satellite
      - title: 抜き取り確認
        text: 省く側から数%を見回る
        who: human
      - title: 上位から確定
        text: 現地で判定する
        who: human
      - title: 点検は続ける
        text: 法定点検と水準測量
        who: human
