 cx="219.6" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="219.6" y="32.5">2</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="219.6" y="66.0">順位を付ける</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="219.6" y="92.3">動きや疑いの大</tspan><tspan x="219.6" y="110.4">きい順</tspan></text><line x1="281.8" y1="81.3" x2="294.8" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="302.8" y="26.0" width="114.4" height="110.5" rx="10" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><circle cx="360.0" cy="27.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="32.5">3</tspan></text><text font-size="14.5" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="66.0">抜き取り確認</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="360.0" y="92.3">省く側から数%</tspan><tspan x="360.0" y="110.4">を見回る</tspan></text><line x1="422.2" y1="81.3" x2="435.2" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="443.2" y="26.0" width="114.4" height="110.5" rx="10" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><circle cx="500.4" cy="27.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="500.4" y="32.5">4</tspan></text><text font-size="14.5" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="500.4" y="66.0">上位から確定</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="500.4" y="92.3">現地で判定する</tspan></text><line x1="562.6" y1="81.3" x2="575.6" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="583.6" y="26.0" width="114.4" height="110.5" rx="10" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><circle cx="640.8" cy="27.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="32.5">5</tspan></text><text font-size="14.5" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="66.0">点検は続ける</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="640.8" y="92.3">法定点検と水</tspan><tspan x="640.8" y="110.4">準測量</tspan></text><rect x="22.0" y="154.6" width="16.0" height="16.0" rx="4" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="45.0" y="167.6">衛星・解析</tspan></text><rect x="132.0" y="154.6" width="16.0" height="16.0" rx="4" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="155.0" y="167.6">人・現地</tspan></text></svg>
