# note記事「違反の埋立て、気づいたときには山になっている。衛星でどこまで先に見つけられるか」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 都市・行政
    title: 違反の埋立てを衛星で見つける
    sub: 千葉県の監視と、国のガイドライン

  - id: fig-1
    type: split
    alt: 衛星に任せることと、職員が行うこと
    link: ＋
    left:
      title: 衛星画像の解析が行う
      items:
        - 県内の地表の変化を定期的に抜き出す
        - 人目につかない場所も含めて広く見る
    right:
      title: 職員が行う
      items:
        - 許可や届出の記録と照合する
        - 疑いのある場所に立ち入って確かめる
        - 違反なら是正を指導する
    note: 衛星が見つけるのは地表の変化。違反かどうかは、照合と現地確認で決まる

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 小さな盛土は拾えない
        text: 無償の光学画像で1,000m²以上が目安
        role: none
      - title: 盛土以外の変化も拾う
        text: 造成や伐採も変化として出る
        role: none
      - title: 分かるのは地表の変化まで
        text: 土砂の高さや量は分からない
        role: none
      - title: 画像の種類ごとに弱点がある
        text: 無償の光学は頻度と精度が劣る
        role: none
      - title: 違反かどうかは決まらない
        text: 許可の有無は台帳と現地で確かめる
        role: none
