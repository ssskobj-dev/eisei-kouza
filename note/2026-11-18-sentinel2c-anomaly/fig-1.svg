<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>Sentinel-2Cの異常の通知の3つの要点。取り戻せない、続いている、どこで確かめるか</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="222" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">取り戻せない</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">11月17日08時25分（世</tspan><tspan x="80.0" y="102.7">界時）以降に取得した</tspan><tspan x="80.0" y="122.9">データは、あとで再処</tspan><tspan x="80.0" y="143.2">理しても出てこない</tspan></text><rect x="252.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">異常は続いている</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">通知の時点で対策の途</tspan><tspan x="310.0" y="102.7">中。その間の観測もさ</tspan><tspan x="310.0" y="122.9">らに影響を受けること</tspan><tspan x="310.0" y="143.2">がある。復旧の日付の</tspan><tspan x="310.0" y="163.4">約束はない</tspan></text><rect x="482.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">欠けた撮影の確認先</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">運用ダッシュボード</tspan><tspan x="540.0" y="102.7">の「Events」に、影</tspan><tspan x="540.0" y="122.9">響を受けた撮影の一</tspan><tspan x="540.0" y="143.2">覧が載る。製品名の</tspan><tspan x="540.0" y="163.4">先頭の衛星名（S2C）</tspan><tspan x="540.0" y="183.7">で見分ける</tspan></text></svg>
