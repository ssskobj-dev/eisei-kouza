# 時事記事「無償の光学衛星Sentinel-2Cに機上の異常、11月17日以降の観測データが取り戻せず」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 農業・作付け確認
    title: Sentinel-2Cに機上の異常
    sub: 17日以降のデータが取り戻せず。2Bだけの期間をどう扱うか

  - id: fig-1
    type: cards
    alt: Sentinel-2Cの異常の通知の3つの要点。取り戻せない、続いている、どこで確かめるか
    columns: 3
    items:
      - title: 取り戻せない
        text: 11月17日08時25分（世界時）以降に取得したデータは、あとで再処理しても出てこない
      - title: 異常は続いている
        text: 通知の時点で対策の途中。その間の観測もさらに影響を受けることがある。復旧の日付の約束はない
      - title: 欠けた撮影の確認先
        text: 運用ダッシュボードの「Events」に、影響を受けた撮影の一覧が載る。製品名の先頭の衛星名（S2C）で見分ける

  - id: fig-2
    type: split
    alt: 今回の異常で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 2Cが止まる間、同じ条件の再訪は設計上5日から10日に
        - 11月17日以降の画像を使う業務は、待ち時間を見直す
        - 納品物に、使った画像の衛星名と取得日時を残す
    right:
      title: 変わらないこと
      role: none
      items:
        - 11月17日より前の画像と、過去の時系列はそのまま使える
        - 2Bと2Aの観測は、この通知の対象外
        - 雲の下の圃場は、衛星が2機でも見えない
    note: 原因と復旧の見込みは未公表。Sentinel Onlineの続報を確かめる
