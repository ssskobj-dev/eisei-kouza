# 時事記事「大阪広域水道企業団の4水道事業が衛星の漏水リスク診断を共同発注」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ監視
    title: 4水道事業が衛星診断を共同発注
    sub: 自治体は「共同発注」の何を確かめるか

  - id: fig-1
    type: cards
    alt: 発表の3つの要点。4水道事業（八尾・岸和田・富田林・柏原）が共同発注し、全給水区域を診断。導入したのは音聴調査の支援の機能だけ。結果は音聴調査の優先づけと、複数年の調査・更新計画に使う
    columns: 3
    items:
      - title: 共同発注
        text: 4水道事業が1つの発注で、全給水区域を診断
      - title: 機能は1つ
        text: 音聴調査の優先エリアを絞る支援だけを導入
      - title: 使い道
        text: 今年の調査の順番と、複数年の調査・更新計画

  - id: fig-2
    type: split
    alt: 変わることと、変わらないこと。変わるのは、仕様書と評価の基準を4事業で共有できる、全区域から調べる順番を決められる、前年の結果と照らし合わせられる。変わらないのは、漏水の確定は現地の音聴調査、精度や件数の数字は発表にない、管路台帳が前提
    link: ⇔
    left:
      title: 変わること
      items:
        - 仕様書と評価の基準を、4事業で共有できる
        - 全区域から「調べる順番」を決められる
        - 継続利用なら、前年の結果と照らし合わせられる
    right:
      title: 変わらないこと
      role: none
      items:
        - 漏水の確定は、現地の音聴調査
        - 精度や見つけた件数は、発表にない
        - 管路台帳が整っていることが前提
    note: 衛星の診断は絞り込み。使い道を1つに決めてから、機能と仕様を選ぶ
