# 時事記事「国交省の道路陥没の技術公募で、衛星データの干渉SARを使う技術が選定に」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ監視
    title: 道路陥没の技術公募、衛星が選定
    sub: 深さ2m超の空洞。「選ばれた」と「使える」の間に何があるか

  - id: fig-1
    type: cards
    alt: 国土交通省の道路陥没の技術公募について、出典に書かれた4つの要点
    columns: 2
    items:
      - title: 公募の狙い
        text: 今の探査車は深さ約1.5〜2.0mまで。2mを超える深さの空洞と、陥没の危険がある場所を見つける技術を募集
      - title: 衛星の位置づけ
        text: SAR衛星などで広い範囲の地表や地中の変状を見張り、危険がある場所を検知する監視の技術として募集
      - title: 選定の結果
        text: 応募した事業者の発表では、時系列InSARの技術を含む11の技術が選定。有識者の審査による
      - title: この後の手順
        text: 性能確認の試験 → 技術検討委員会の審議 → 技術の概要と性能をカタログなどで公表（予定）

  - id: fig-2
    type: split
    alt: 選定で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 衛星の監視が、国の公募の性能確認の試験を受ける
        - 試験の条件と結果が公表されれば、提案を比べるものさしになる
        - 「候補を衛星で絞り、現地で確かめる」流れが前提になる
    right:
      title: 変わらないこと
      role: none
      items:
        - 衛星が測るのは地表の動き。空洞の有無と深さは現地で確かめる
        - 性能の数字は、公表されるまで仕様書に書けない
        - 現地点検と調査はなくならない。発表した側も「補完」と書く
    note: 仕様書には「選定された技術」ではなく、求める性能（深さ、変状、期間、現地確認）を書く
