<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>国土交通省の道路陥没の技術公募について、出典に書かれた4つの要点</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="292" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="331.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">公募の狙い</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">今の探査車は深さ約1.5〜2.0mまで。2mを</tspan><tspan x="80.0" y="102.7">超える深さの空洞と、陥没の危険がある場</tspan><tspan x="80.0" y="122.9">所を見つける技術を募集</tspan></text><rect x="367.0" y="22.0" width="331.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="425.0" y="56.0">衛星の位置づけ</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="82.4">SAR衛星などで広い範囲の地表や地中の変</tspan><tspan x="425.0" y="102.7">状を見張り、危険がある場所を検知する監</tspan><tspan x="425.0" y="122.9">視の技術として募集</tspan></text><rect x="22.0" y="153.2" width="331.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="184.2" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="189.7">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="187.2">選定の結果</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="213.6">応募した事業者の発表では、時系列InSAR</tspan><tspan x="80.0" y="233.8">の技術を含む11の技術が選定。有識者の審</tspan><tspan x="80.0" y="254.1">査による</tspan></text><rect x="367.0" y="153.2" width="331.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="396.0" cy="184.2" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="396.0" y="189.7">4</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="425.0" y="187.2">この後の手順</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="213.6">性能確認の試験 → 技術検討委員会の審議</tspan><tspan x="425.0" y="233.8"> → 技術の概要と性能をカタログなどで公</tspan><tspan x="425.0" y="254.1">表（予定）</tspan></text></svg>
