    title: 水田の水管理を衛星で見る協定
    sub: 中干しのクレジットに、どうつながるか

  - id: fig-1
    type: cards
    alt: JAXAとBRINの協定の3つの要点。農業分野では水田の湛水・非湛水を衛星で見てメタン削減のMRVに使う、防災分野ではセンチネルアジアの枠組みで緊急観測に協力、ALOS-4が加わり観測頻度が上がる
    columns: 3
    items:
      - title: 農業
        text: 水田の湛水・非湛水を衛星で把握し、メタン削減のMRVを効率化
      - title: 防災
        text: センチネルアジアの枠組みで緊急観測に協力。2026年8月の地震で活用
      - title: 観測頻度
        text: だいち4号が新たに加わり、2機の組み合わせで頻度が上がる

  - id: fig-2
    type: split
    alt: 協定で分かることと、協定があっても変わらないこと。分かることは、水面の有無を衛星で見る技術が海外でもMRVに使われ始めた、国内でも同じ2機で実証中、観測頻度が上がる。変わらないのは、J－クレジットの証跡の要件（写真など）、7日間を日単位で示すには頻度が足りない、稲が茂ると水面が隠れる
    link: ⇔
    left:
      title: 協定で分かること
      items:
        - 水面の有無を衛星で見る技術が、海外のMRVに使われ始めた
        - 国内でも同じ2機で実証中
        - 2機の組み合わせで観測頻度が上がる
    right:
      title: 変わらないこと
      role: none
      items:
        - J－クレジットの証跡は写真などの資料
        - 7日間を日単位で示すには頻度が足りない
        - 稲が茂ると水面が隠れる
    note: 衛星は、申告が疑わしい圃場を絞る点検の道具として考える
