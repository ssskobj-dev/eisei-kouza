# note記事「北極海航路の開通時期を、衛星データの海氷分布から読む」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: 水産・海洋
    title: 北極海航路はいつ通れるか
    sub: 衛星の海氷データで見通す。見通しの幅と限界

  - id: fig-1
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星の観測が行う
      items:
        - 海氷の分布を広く毎日捉える
        - 航路ごとの開通の見通しを出す
    right:
      title: 人が行う
      items:
        - 北極経由かスエズ経由かを決める
        - 出航の時期と船を決める
        - 航行許可と砕氷支援を確かめる
    note: 見通しは週の単位で幅がある。2019年は「8月中旬」の見通しに対し8月20日に開通

  - id: fig-2
    type: cards
    alt: この使い方の4つの限界
    columns: 2
    items:
      - title: 見通しには幅がある
        text: 開通日は週の単位、面積は1割程度ずれる
        role: none
      - title: 放射計の格子は粗い
        text: 海氷密接度の標準は概略15km
        role: none
      - title: 航行の可否は氷況だけで決まらない
        text: 許可、船の氷海船級、砕氷支援の要否
        role: none
      - title: 厚さと流動は画像だけで読みにくい
        text: 海域ごとの読み取りに知識が要る
        role: none
