# note記事「衛星で見るべきか、ドローンか、人が行くべきか」の見出し画像と図。
# python scripts/figures.py common-vs-other-means で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 基礎
    title: 衛星か、ドローンか、人か
    sub: 範囲、頻度、精度、費用、天候の5つで決める

  - id: fig-1
    type: scale
    alt: 現地調査から衛星まで、見られる範囲と細かさの並び
    left: 狭く、細かく
    right: 広く、粗く
    items:
      - title: 現地調査
        text: 1ha程度、1〜10cm
      - title: ドローン
        text: 10〜100ha、5cm〜1m
      - title: 航空機
        text: 2,000ha以上、0.1〜5m
      - title: 衛星
        text: 10万ha以上、0.5〜50m

  - id: fig-2
    type: flow
    alt: 広い手段で絞り、狭い手段で確かめる3つの手順
    steps:
      - title: 衛星で候補を拾う
        text: 全体から、定期的に
        who: satellite
      - title: 細かく見る
        text: 航空機かドローン
        who: satellite
      - title: 現地で判定する
        text: 対策と報告を決める
        who: human
