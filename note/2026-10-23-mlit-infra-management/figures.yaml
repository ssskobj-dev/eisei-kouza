# 時事記事「インフラマネジメントへの転換、中間答申」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ管理
    title: 人工衛星を点検の新技術に
    sub: 中間答申が示す自治体の実態と、発注の変化

  - id: fig-1
    type: cards
    alt: 中間答申が引く地方公共団体の調査結果。4つの数字
    columns: 2
    items:
      - title: 技術職員ゼロ
        text: 約4分の1の市区町村に技術系職員がいない。約5割は5人以下
      - title: 新技術なし
        text: 約8割の機関・部署で導入なし。理由は費用と人材
      - title: メリハリなし
        text: 約7割の機関・部署で、重点化や軽量化の取組なし
      - title: 公表なし
        text: 地方公共団体の半数が、インフラの状況を住民に公表していない

  - id: fig-2
    type: split
    alt: 中間答申で変わることと、答申が出ても変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 人工衛星が点検の新技術として答申に明記
        - 性能カタログの拡充と、アドバイザーの派遣
        - 点検は「全部同じ」から「メリハリ」へ
    right:
      title: 変わらないこと
      role: none
      items:
        - 制度と予算は、これからの検討
        - 技術職員の不足は、すぐには解消しない
        - 衛星は新技術の1つ。点検の代わりではない
    note: 群マネの実施・検討は約1割。広域で衛星を使う体制は、まだ少数
