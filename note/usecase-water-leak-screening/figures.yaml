# note記事「水道管の漏水調査、市内を全部は歩けない。衛星でどこまで絞れるか」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: インフラ・建設
    title: 水道管の漏水調査を衛星で約3割に絞る
    sub: 新居浜市の実装検証と、「疑い」までという限界

  - id: fig-1
    type: bar
    alt: 新居浜市の実装検証で公表された数字
