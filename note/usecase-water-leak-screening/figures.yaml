      - label: ロガー調査の対象
        value: 203
      - label: 音聴調査の対象
        value: 74
      - label: 漏水の疑義箇所
        value: 22
      - label: 見つかった漏水
        value: 3

  - id: fig-2
    type: cards
    alt: この使い方の4つの限界
