<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>形式変更で変わることと、変わらないこと</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="294" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="311.0" height="198.5" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><rect x="22.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#2f5d94" stroke="none" stroke-width="1.5"/><rect x="22.0" y="48" width="311.0" height="16" fill="#2f5d94"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="177.5" y="50.0">変わること</tspan></text><circle cx="46.0" cy="87.0" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="92.0">11月下旬に、BeiDou補強のメッセー</tspan><tspan x="60.0" y="112.3">ジ形式</tspan></text><circle cx="46.0" cy="136.6" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="141.6">受信機やソフトに対応の更新が要るかを</tspan><tspan x="60.0" y="161.9">確かめる必要</tspan></text><circle cx="46.0" cy="186.2" r="4" fill="#2f5d94"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="60.0" y="191.2">先行配信で、切り替え前に試せる</tspan></text><rect x="387.0" y="22.0" width="311.0" height="198.5" rx="10" fill="#eef1f3" stroke="none" stroke-width="1.5"/><rect x="387.0" y="22.0" width="311.0" height="42.0" rx="10" fill="#8a949c" stroke="none" stroke-width="1.5"/><rect x="387.0" y="48" width="311.0" height="16" fill="#8a949c"/><text font-size="16" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="542.5" y="50.0">変わらないこと</tspan></text><circle cx="411.0" cy="87.0" r="4" fill="#8a949c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="92.0">精度の仕様（水平30cm・垂直50cm以</tspan><tspan x="425.0" y="112.3">下、95%）</tspan></text><circle cx="411.0" cy="136.6" r="4" fill="#8a949c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="141.6">収束に20〜30分かかること</tspan></text><circle cx="411.0" cy="165.9" r="4" fill="#8a949c"/><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="425.0" y="170.9">L6に対応した受信機が要ること</tspan></text><circle cx="360.0" cy="121.25" r="21" fill="#fff" stroke="#0b1524" stroke-width="2"/><text font-size="19" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="128.2">⇔</tspan></text><rect x="22.0" y="234.5" width="676.0" height="37.0" rx="8" fill="#eef1f3" stroke="none" stroke-width="1.5"/><text font-size="14" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="260.5">対応するのは受信機のメーカー。利用者は「対応予定」と「切り替えの日時」を確かめる</tspan></text></svg>
