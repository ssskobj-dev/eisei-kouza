# 時事記事「みちびきのMADOCA-PPP、BeiDou補強のメッセージ形式を11月下旬に切り替え」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 衛星測位
    title: MADOCA-PPPが形式変更へ
    sub: 自動操舵や情報化施工で、受信機の何を確かめるか

  - id: fig-1
    type: cards
    alt: 2026年10月27日の発表の3つの要点。目的、先行配信、切り替えの時期
    columns: 3
    items:
      - title: 目的
        text: PPPでBeiDouの衛星をより多く使えるように、補強メッセージの形式を変える
      - title: 先行配信
        text: 10月30日から、1系統（PRN207）だけで先行配信。仕様書の案と試験用ライブラリも公開
      - title: 切り替え
        text: 運用中の配信の切り替えは11月下旬の予定。日時はまだ公表されていない

  - id: fig-2
    type: split
    alt: 形式変更で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 11月下旬に、BeiDou補強のメッセージ形式
        - 受信機やソフトに対応の更新が要るかを確かめる必要
        - 先行配信で、切り替え前に試せる
    right:
      title: 変わらないこと
      role: none
      items:
        - 精度の仕様（水平30cm・垂直50cm以下、95%）
        - 収束に20〜30分かかること
        - L6に対応した受信機が要ること
    note: 対応するのは受信機のメーカー。利用者は「対応予定」と「切り替えの日時」を確かめる
