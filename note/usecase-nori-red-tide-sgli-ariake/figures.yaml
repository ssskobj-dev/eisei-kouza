# note記事「ノリの色落ち、赤潮を先に見つけたい。佐賀県が有明海の湾奥で衛星のクロロフィル画像を現場観測と見比べて分かったこと」の見出し画像と図。
figures:
- id: thumbnail
  type: thumbnail
  kind: usecase
  tag: 水産・海洋
  title: ノリの赤潮を衛星で見張れるか
  sub: 有明海の湾奥で、しきさいの画像と現場観測を比べた結果
- id: fig-1
  type: split
  alt: 衛星に任せることと、人が行うこと
  link: ＋
  left:
    title: 衛星と解析が行う
    items:
    - 250mの格子でクロロフィルを面で見る
    - 1〜2日おきに広がりの変化を追う
    - 観測点の少ない沖合を補う
  right:
    title: 人が行う
    items:
    - 約35地点を週1〜2回観測する
    - 採水して種類と密度を確かめる
    - 漁業者に知らせ摘み取りを決める
  note: 衛星は着色の広がりまで。種類と密度は採水で
- id: fig-2
  type: cards
  alt: この使い方の5つの限界
  columns: 2
  items:
  - title: 雲で欠ける
    text: 冬の漁期は不明瞭や欠測が多い
    role: none
  - title: 濁りで高く出る
    text: 懸濁物を植物プランクトンと取り違える
    role: none
  - title: 網1枚は見えない
    text: 250mは湾の広がりを見る粗さ
    role: none
  - title: 種類と密度は不明
    text: 色落ちを起こす種かは採水で
    role: none
  - title: 精度の数字がない
    text: 合う頻度は資料にない
    role: none
