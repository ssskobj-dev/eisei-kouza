# 時事記事「だいち2号のメンテナンス運用と、基本観測シナリオの改訂」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 衛星データの入手
    title: だいち2号、約1か月観測停止
    sub: 地盤変位や災害データを使う側は、何を確かめるか

  - id: fig-1
    type: cards
    alt: 2026年10月にJAXAが知らせた、だいち2号の3つのこと
    columns: 3
    items:
      - title: 観測の停止
        text: 10月18日〜11月15日はメンテナンス運用。新しい観測要求は受け付けない
      - title: 未校正データ
        text: 期間中に観測したデータは、品質を保証しない未校正データ
      - title: シナリオの改訂
        text: 海外向けの全球10m観測を終了。日本域は左観測が基本。6か月ごとに見直し

  - id: fig-2
    type: split
    alt: 今回の文書で変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 約1か月、だいち2号には新しく撮ってもらえない
        - 成果に未校正データが混ざっていないかの確認が増える
        - 日本はだいち4号が右観測、だいち2号は左観測
    right:
      title: 変わらないこと
      role: none
      items:
        - 運用の終了時期は、今回の文書に書かれていない
        - 日本の観測モード（3m、6m、350km）は同じ
        - 計画どおり撮れない前提は、後期運用から続く
    note: 納品の仕様書に「使った観測日の一覧」の項目を足し、10月18日〜11月15日の日付を確かめる
