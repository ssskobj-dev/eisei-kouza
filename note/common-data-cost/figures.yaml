# note記事「衛星データは、いくらで、どこから手に入るのか」の見出し画像と図。
# python scripts/figures.py common-data-cost で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 基礎
    title: データは、どこから、いくらで
    sub: 衛星データを買う前に知っておく2つの軸

  - id: fig-1
    type: split
    alt: 無償データと商用データの違い
    link: vs
    left:
      title: 無償データ
      items:
        - 世界中を決まった計画で撮り続ける
        - 過去の蓄積が厚い
        - 細かさは中くらい
        - 撮る場所や時期は頼めない
    right:
      title: 商用データ
      items:
        - 細かく撮れる
        - 新しく撮る注文ができる
        - 利用条件は契約で決まる
        - 価格は配布事業者が決める
    note: どちらも出所の表示と利用条件がある。無償は「質が低い」ではなく「頼めない」

  - id: fig-2
    type: cards
    alt: 費用を分けて考える3つの項目
    columns: 3
    items:
      - title: データ代
        text: 無償か商用か。何枚か。単位は何か
        mark: A
      - title: 解析
        text: 自社で行うか、解析会社に頼むか
        mark: B
      - title: 確認
        text: 現地で何か所を見に行くか
        mark: C
        role: human
