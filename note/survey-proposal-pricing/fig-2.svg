<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>見積もりの内訳と、初年度と運用年度の違い</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="294" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="119.3" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">直接人件費</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">計画、解析、精度検証、</tspan><tspan x="80.0" y="102.7">成果物、打合せ、照査</tspan></text><rect x="252.0" y="22.0" width="216.0" height="119.3" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">直接経費</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">衛星データ（単価と時</tspan><tspan x="310.0" y="102.7">点）、交通費、成果物</tspan><tspan x="310.0" y="122.9">作成費</tspan></text><rect x="482.0" y="22.0" width="216.0" height="119.3" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">その他原価、管</tspan><tspan x="540.0" y="78.4">理費等</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="104.8">積算基準の率で計</tspan><tspan x="540.0" y="125.0">上する</tspan></text><rect x="22.0" y="155.3" width="216.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="186.3" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="191.8">A</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="189.3">初年度</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="215.7">過去に遡る分のデー</tspan><tspan x="80.0" y="236.0">タ購入と解析の工数</tspan><tspan x="80.0" y="256.2">が大きい</tspan></text><rect x="252.0" y="155.3" width="216.0" height="117.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="186.3" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="191.8">B</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="189.3">運用年度</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="215.7">新しい画像だけを買い</tspan><tspan x="310.0" y="236.0">足し、既存のデータに</tspan><tspan x="310.0" y="256.2">加える</tspan></text><rect x="482.0" y="155.3" width="216.0" height="117.2" rx="10" fill="#ffeee5" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="186.3" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="191.8">C</tspan></text><text font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="540.0" y="189.3">変更の条件</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="215.7">干渉不可、緊急観測は</tspan><tspan x="540.0" y="236.0">契約変更。データは発</tspan><tspan x="540.0" y="256.2">注者に帰属</tspan></text></svg>
