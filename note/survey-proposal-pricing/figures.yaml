# note記事「衛星の業務、精度を何ミリと約束できない」の見出し画像と図。
# python scripts/figures.py survey-proposal-pricing で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 測量・建設コンサル向け
    title: 衛星の業務、精度を何ミリと約束できない
    sub: 提案書と見積もりで、代わりに書くこと

  - id: fig-1
    type: split
    alt: 精度について、約束することと、約束しないこと
    link: vs
    left:
      title: 約束すること
      role: satellite
      items:
        - 比べる相手（水準測量、GNSS）と指標
        - 解析の方法（時系列解析、両軌道）
        - 報告する値の単位と区分（mm/年など）
        - 解析できない場所を先に図で示す
    right:
      title: 約束しないこと
      role: none
      items:
        - 「精度何ミリ」の保証
        - 全箇所の検出（誤検出も見逃しもある）
        - 前兆のない崩壊の予知
        - 観測計画に合わない固定の枚数
    note: 精度は、実測と比べて初めて言える。比べ方を約束する

  - id: fig-2
    type: cards
    alt: 見積もりの内訳と、初年度と運用年度の違い
    columns: 3
    items:
      - title: 直接人件費
        text: 計画、解析、精度検証、成果物、打合せ、照査
        mark: "1"
        role: human
      - title: 直接経費
        text: 衛星データ（単価と時点）、交通費、成果物作成費
        mark: "2"
      - title: その他原価、管理費等
        text: 積算基準の率で計上する
        mark: "3"
        role: human
      - title: 初年度
        text: 過去に遡る分のデータ購入と解析の工数が大きい
        mark: "A"
      - title: 運用年度
        text: 新しい画像だけを買い足し、既存のデータに加える
        mark: "B"
      - title: 変更の条件
        text: 干渉不可、緊急観測は契約変更。データは発注者に帰属
        mark: "C"
        role: human
