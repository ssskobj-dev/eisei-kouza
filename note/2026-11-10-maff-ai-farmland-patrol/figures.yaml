# 時事記事「農水省の「AI×農山漁村」プログラム、選定20件のうち4件が農地パトロールや農地情報の効率化」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 農業
    title: 農地パトロールにAIの実証
    sub: 衛星で絞る前に、自治体は何を出すか

  - id: fig-1
    type: cards
    alt: 農水省のプログラムが選定企業に用意する3つの支援。企業とのマッチング、地域金融機関の伴走支援、現場実装に係る人件費等の支援
    columns: 3
    items:
      - title: 企業とのマッチング
        text: 農業関連の企業や、農山漁村の活性化に取り組む企業につなぐ
      - title: 金融機関の伴走支援
        text: 地域の金融機関が伴走し、農業者や自治体とのマッチングを支える
      - title: 人件費等の支援
        text: 現場に入れるときの人件費等を支援。金額と期間はページに未記載

  - id: fig-2
    type: split
    alt: このプログラムで自治体に変わることと、変わらないこと
    link: ⇔
    left:
      title: 変わること
      items:
        - 費用の補助つきで、衛星AIの実証に手を挙げられる
        - 農地に関わる選定は4件。複数の企業を比べられる
        - 実証は、過去の調査結果とAIの判定の突き合わせから始まる
    right:
      title: 変わらないこと
      role: none
      items:
        - 衛星は「推定」。判定は農業委員と職員に残る
        - 支援の金額と期間は、ページだけでは分からない
        - 精度は、自分の地域の農地で確かめるまで分からない
    note: 準備するのは、筆ごとの過去の判定と、筆の地図データ
