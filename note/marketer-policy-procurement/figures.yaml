# note記事「「国が衛星データを買う」は本当か。閣議決定で決まったことと、まだ要望の段階のことを分ける」の見出し画像と図。
# python scripts/figures.py marketer-policy-procurement で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 衛星データマーケッター 2級
    title: 国が衛星データを買う、は本当か
    sub: 閣議決定で決まったことと、まだ要望の段階のこと

  - id: fig-1
    type: cards
    alt: 国の方針の3層
    columns: 3
    items:
      - title: 宇宙基本計画
        text: 10年の基本方針。閣議決定。2023年6月
        mark: "1"
      - title: 工程表
        text: 施策と年次の目標。毎年12月に改訂
        mark: "2"
      - title: 各省の取組方針
        text: タスクフォース、国交省の方針など
        mark: "3"

  - id: fig-2
    type: split
    alt: 決まっていることと、まだ決まっていないこと
    link: ／
    left:
      title: 決まっていること
      items:
        - 民間から可能な限り調達する方向
        - 2024〜2026年度の活用拡大期間
        - アンカーテナンシーの強化（成長戦略）
        - 国交省の分野別の取組方針と段階
    right:
      title: まだ決まっていないこと
      role: none
      items:
        - 来年度の予算の額と事業
        - 国がまとめて買う仕組みと時期
        - どの業務が対象になるか
        - 小型SAR衛星の試行の後の調達
    note: 閣議決定と大臣会合で決まったことと、概算要求（要望）を分けて話す
