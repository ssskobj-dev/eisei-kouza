<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 325" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>利用者アンケートで答えられた効果の幅</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="325" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><text font-size="16" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="22.0" y="42.0">利用者が答えた効果の幅（2018年）</tspan></text><text font-size="12.5" fill="#8a949c" font-weight="normal" text-anchor="start"><tspan x="22.0" y="66.0">単位：%</tspan></text><text font-size="12" fill="#8a949c" font-weight="normal" text-anchor="start"><tspan x="22.0" y="276.0">出どころ：漁業情報サービスセンター「スマート水産業と衛星利用」（2022年）。利用漁船452隻へのアンケート、回答150</tspan><tspan x="22.0" y="293.4">隻。計器で測った値ではない</tspan></text><line x1="182.0" y1="224" x2="668" y2="224" stroke="#8a949c" stroke-width="1"/><line x1="182.0" y1="82" x2="182.0" y2="224" stroke="#eef1f3" stroke-width="1"/><text font-size="12" fill="#8a949c" font-weight="normal" text-anchor="middle"><tspan x="182.0" y="242.0">0</tspan></text><line x1="407.0" y1="82" x2="407.0" y2="224" stroke="#eef1f3" stroke-width="1"/><text font-size="12" fill="#8a949c" font-weight="normal" text-anchor="middle"><tspan x="407.0" y="242.0">16.5</tspan></text><line x1="632.0" y1="82" x2="632.0" y2="224" stroke="#eef1f3" stroke-width="1"/><text font-size="12" fill="#8a949c" font-weight="normal" text-anchor="middle"><tspan x="632.0" y="242.0">33</tspan></text><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="end"><tspan x="170.0" y="110.0">漁場を探す時間の短縮</tspan></text><rect x="386.5" y="98.0" width="245.5" height="14.0" rx="7" fill="#2f5d94" stroke="none" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="bold" text-anchor="end"><tspan x="632.0" y="92.0">15〜33</tspan></text><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="end"><tspan x="170.0" y="156.0">漁獲量の増加</tspan></text><rect x="318.4" y="144.0" width="204.5" height="14.0" rx="7" fill="#2f5d94" stroke="none" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="534.9" y="156.0">10〜25</tspan></text><text font-size="14" fill="#1a2433" font-weight="normal" text-anchor="end"><tspan x="170.0" y="202.0">給油の削減</tspan></text><rect x="236.5" y="190.0" width="259.1" height="14.0" rx="7" fill="#2f5d94" stroke="none" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="507.6" y="202.0">4〜23</tspan></text></svg>
