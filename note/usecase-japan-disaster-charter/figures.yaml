# note記事「災害の直後、どの衛星に頼めばいいか分からない。衛星の手配を事務局に任せる「日本版災害チャータ」で、災害データはどこまで早く届くか」の見出し画像と図。
figures:
- id: thumbnail
  type: thumbnail
  kind: usecase
  tag: 防災
  title: 災害時の衛星の手配を任せる
  sub: 日本版災害チャータ。15回発動、費用は非公表
- id: fig-1
  type: split
  alt: 事務局に任せることと、災害対応の機関が行うこと
  link: ＋
  left:
    title: 事務局と衛星が行う
    items:
    - 災害に合う衛星を選ぶ
    - 撮影と解析を手配する
    - 被災の箇所の解析データを届ける
  right:
    title: 災害対応の機関が行う
    items:
    - 災害の種類と場所を伝える
    - 推定の範囲を現地の情報で確かめる
    - 初動の配置と復旧の順番を決める
  note: 2024年7月から2025年12月までに15回発動。有償のサービスで、金額は非公表
- id: fig-2
  type: cards
  alt: この使い方の5つの限界
  columns: 2
  items:
  - title: 通過より早くは撮れない
    text: 依頼から観測までは衛星の軌道で決まる
    role: none
  - title: 3時間以内は目標
    text: 発生から届くまでの実績の時間は非公表
    role: none
  - title: 24時間365日はこれから
    text: 将来のサービス拡張の目標
    role: none
  - title: 有償で金額は非公表
    text: 発動1回の費用、契約の形は未公開
    role: none
  - title: 推定は現地で確かめる
    text: 水深、建物の内部、安否は分からない
    role: none
