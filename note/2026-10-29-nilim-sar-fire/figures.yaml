# 時事記事「国総研が小型SAR衛星2社と、火災の被害把握の共同研究を開始」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害データ
    title: 火災の被害、SAR衛星で把握へ
    sub: 自治体は、災害データの初動に何を期待できるか

  - id: fig-1
    type: cards
    alt: 国総研の公募資料と発表に書かれた、火災被害検出の共同研究の4つの要点
    columns: 2
    items:
      - title: 目的
        text: 延焼の範囲を早くつかむ。観測モードごとの解析手法と精度、観測の計画の最適化を明らかにする
      - title: 検証
        text: 過去の広域火災の被災状況や現地調査の結果と、SAR衛星のデータの関係を分析する
      - title: 期間
        text: 協定の締結（2026年10月予定）の後から、期限は2028年3月31日
      - title: 衛星の条件
        text: 地上分解能0.8m以上で撮れる衛星を3機以上運用。費用は各者が負担

  - id: fig-2
    type: split
    alt: この共同研究に期待してよいことと、研究が進んでも変わらないこと
    link: ⇔
    left:
      title: 期待してよいこと
      items:
        - 夜や悪天候でも、火災で焼けた範囲の図が衛星から出る可能性
        - 国が求めた水準（0.8m、3機以上）が数字で公開されている
        - 過去の火災の現地調査と照らして、精度が明らかになる
    right:
      title: 変わらないこと
      role: none
      items:
        - 衛星が示すのは「変化」。被害と結び付ける方法はこれから
        - 撮れる時刻は、衛星の軌道と予約で決まる
        - 成果は2028年以降。今すぐ使えるサービスではない
    note: 自分の火災対応の手順で、「焼けた範囲」を誰が、いつ、どの手段で把握するかを確かめておく
