<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 209" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>一つの窓口で衛星の撮影を頼む流れ。撮れる機会を照会し、注文し、各社の衛星が撮影し、画像が納品され、解析する。照会から納品までは窓口が担い、撮影は各衛星の軌道と運用で決まり、解析は発注側が誰が行うかを決める</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="209" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="26.0" width="114.4" height="128.7" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="79.2" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="79.2" y="32.5">1</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="79.2" y="66.0">照会</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="79.2" y="92.3">複数の衛星の撮</tspan><tspan x="79.2" y="110.4">れる機会を一括</tspan><tspan x="79.2" y="128.6">で見る</tspan></text><line x1="141.4" y1="90.3" x2="154.4" y2="90.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="162.4" y="26.0" width="114.4" height="128.7" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="219.6" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="219.6" y="32.5">2</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="219.6" y="66.0">注文</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="219.6" y="92.3">事業者ごとの個</tspan><tspan x="219.6" y="110.4">別調整は不要</tspan></text><line x1="281.8" y1="90.3" x2="294.8" y2="90.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="302.8" y="26.0" width="114.4" height="128.7" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="360.0" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="32.5">3</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="66.0">撮影</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="360.0" y="92.3">各社の衛星が軌</tspan><tspan x="360.0" y="110.4">道どおりに撮る</tspan></text><line x1="422.2" y1="90.3" x2="435.2" y2="90.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="443.2" y="26.0" width="114.4" height="128.7" rx="10" fill="#eef1f3" stroke="#8a949c" stroke-width="1.5"/><circle cx="500.4" cy="27.0" r="14" fill="#8a949c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="500.4" y="32.5">4</tspan></text><text font-size="14.5" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="500.4" y="66.0">納品</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="500.4" y="92.3">料金・納期・条</tspan><tspan x="500.4" y="110.4">件は発表にない</tspan></text><line x1="562.6" y1="90.3" x2="575.6" y2="90.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="583.6" y="26.0" width="114.4" height="128.7" rx="10" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><circle cx="640.8" cy="27.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="32.5">5</tspan></text><text font-size="14.5" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="66.0">解析</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="640.8" y="92.3">誰が行うかを発</tspan><tspan x="640.8" y="110.4">注の前に決める</tspan></text><rect x="22.0" y="172.7" width="16.0" height="16.0" rx="4" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="45.0" y="185.7">衛星・解析</tspan></text><rect x="132.0" y="172.7" width="16.0" height="16.0" rx="4" fill="#eef1f3" stroke="#8a949c" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="155.0" y="185.7"></tspan></text><rect x="177.0" y="172.7" width="16.0" height="16.0" rx="4" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="200.0" y="185.7">人・現地</tspan></text></svg>
