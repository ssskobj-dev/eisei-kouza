# 時事記事「Tellus Pro で国産の小型SAR衛星2社の新規撮影を照会・注文できるように」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害データ
    title: SAR衛星の撮影も一つの窓口に
    sub: 発注する側は「窓口が一つ」の何を確かめるか

  - id: fig-1
    type: flow
    alt: 一つの窓口で衛星の撮影を頼む流れ。撮れる機会を照会し、注文し、各社の衛星が撮影し、画像が納品され、解析する。照会から納品までは窓口が担い、撮影は各衛星の軌道と運用で決まり、解析は発注側が誰が行うかを決める
    steps:
      - title: 照会
        text: 複数の衛星の撮れる機会を一括で見る
        who: satellite
      - title: 注文
        text: 事業者ごとの個別調整は不要
        who: satellite
      - title: 撮影
        text: 各社の衛星が軌道どおりに撮る
        who: satellite
      - title: 納品
        text: 料金・納期・条件は発表にない
        who: none
      - title: 解析
        text: 誰が行うかを発注の前に決める
        who: human

  - id: fig-2
    type: split
    alt: 変わることと、変わらないこと。変わるのは、いつ撮れるかを発注の前に自分で照会できる、光学とSARを同じ手順で頼める、災害時に複数の衛星の計画を一度に見られる。変わらないのは、撮れる日は軌道で決まる、料金・納期・条件は発表にない、SARの画像は解析が要る
    link: ⇔
    left:
      title: 変わること
      items:
        - 「いつ撮れるか」を発注の前に自分で照会できる
        - 光学とSARを、同じ手順で頼める
        - 災害時に、複数の衛星の計画を一度に見られる
    right:
      title: 変わらないこと
      role: none
      items:
        - 撮れる日は、衛星の軌道で決まる
        - 料金、納期、利用条件は発表にない
        - SARの画像は、解析が要る
    note: 窓口が一つでも、衛星を運用するのは各社。手続きは平時に済ませる
