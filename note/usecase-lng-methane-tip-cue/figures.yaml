# note記事「調達先のメタン排出、申告値を信じるしかないのか。LNG供給網を衛星データで確かめる技術検証」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: usecase
    tag: エネルギー・資源
    title: LNGのメタンを衛星で裏づける
    sub: 広域10kmの政府衛星と高解像度の商用衛星を組み合わせる

  - id: fig-1
    type: split
    alt: 衛星に任せることと、人が行うこと
    link: ＋
    left:
      title: 衛星が行う
      items:
        - 広域観測で排出が疑われる場所を見つける
        - 高解像度の衛星でその場所を詳しく観測する
        - 排出源の位置と量を推定する
    right:
      title: 人が行う
      items:
        - 観測の対象と時期を決める
        - 推定値を売り手の申告値と突き合わせる
        - 調達や融資の条件に反映する
    note: 衛星の数字は「説明を求めるきっかけ」。確定値ではない

  - id: fig-2
    type: cards
    alt: この使い方の5つの限界
    columns: 2
    items:
      - title: 性能は検証中
        text: 検出と定量の結果は未公表。対象施設も未定
        role: none
      - title: 施設は分けられない
        text: 10kmと3kmの画素。施設の特定は商用衛星で
        role: none
      - title: 小さな漏れは見えない
        text: 検出限界は風速3m/sで毎時100kg
        role: none
      - title: 見えるのは瞬間だけ
        text: 断続的な漏れや夜間は記録に残らない
        role: none
      - title: 衛星だけでは測定にならない
        text: OGMP 2.0のレベル5は施設単位の測定が要る
        role: none
