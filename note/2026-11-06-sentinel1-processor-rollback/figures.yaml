# 時事記事「無償のレーダー衛星Sentinel-1、更新したばかりの処理ソフトを前の版4.0.3に一時的に戻す」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 地盤変位
    title: 処理ソフトを前の版に戻す
    sub: 10月下旬のSentinel-1をどう扱うか

  - id: fig-1
    type: flow
    alt: 10月下旬から11月初めのSentinel-1の出来事。10月21日に処理ソフトが4.1.1に更新、10月26〜27日にSentinel-1Dのデータが取り戻せない欠け、10月28〜29日に同じ衛星で2回目の欠け、10月29日付で処理ソフトを4.0.3に戻す知らせ、11月1日から配信の遅れ
    steps:
      - title: 10月21日
        text: 新しい版4.1.1に更新
      - title: 26〜27日
        text: 1Dのデータが取り戻せず
      - title: 28〜29日
        text: 1Dで2回目の欠け
      - title: 29日付
        text: 前の版4.0.3に戻す
      - title: 11月1日〜
        text: 配信に遅れ。原因は調査中

  - id: fig-2
    type: split
    alt: 知らせに書かれていることと、書かれていないこと
    link: ⇔
    left:
      title: 書かれていること
      items:
        - 処理ソフトを前の版4.0.3に一時的に戻した
        - 理由は、注意書き422番と423番の品質の問題
        - 新しい版が動き出したら、あらためて知らせる
    right:
      title: 書かれていないこと
      role: none
      items:
        - 品質の問題の中身と、対象になる製品の範囲
        - 4.1.1で作った製品を、あとで作り直すかどうか
        - 新しい版が動き出す時期
    note: 10月下旬の画像は、衛星名、撮影日、処理ソフトの版を一覧で確かめる
