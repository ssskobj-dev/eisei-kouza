# note記事「のり面の点検、全部は回れない」の見出し画像と図。
# python scripts/figures.py survey-road-slope-screening で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 測量・建設コンサル向け
    title: のり面の点検、全部は回れない
    sub: 衛星でどこまで絞れるか

  - id: fig-1
    type: split
    alt: 衛星に任せられることと、人が行うことの分担
    link: ＋
    left:
      title: 衛星に任せられる
      items:
        - 路線全体から、動きのある箇所を拾う
        - 動きの大きさで順番を付ける
        - いつから動いていたかを過去に遡る
    right:
      title: 人が行う
      items:
        - 現地を見て、変状かどうかを判定する
        - 通常の点検を続ける
        - 対策や詳細調査の要否を決める
    note: 衛星は「監視の代わり」ではなく「見に行く順番を決める道具」

  - id: fig-2
    type: funnel
    alt: 路線全体から現地確認の箇所へ絞り込む流れ
    stages:
      - label: 路線の全箇所
        title: 全部を同じ密度では見られない
        text: のり面、切土、盛土が数百か所
        who: none
      - label: 動きのある候補
        title: 衛星で候補を拾い、順番を付ける
        text: 候補であって、変状の確定ではない
        who: satellite
      - label: 現地で確認
        title: 技術者が現地で判定する
        text: 候補から外れた箇所も「安全」とは扱わない
        who: human
