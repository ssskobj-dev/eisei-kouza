<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>路線全体から現地確認の箇所へ絞り込む流れ</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="250" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><polygon points="28.0,22 408.0,22 369.7,84 66.3,84" fill="#eef1f3" stroke="#8a949c" stroke-width="1.5" stroke-linejoin="round"/><text font-size="17" fill="#1a2433" font-weight="bold" text-anchor="middle"><tspan x="218.0" y="60.0">路線の全箇所</tspan></text><line x1="394.8" y1="53.0" x2="426" y2="53.0" stroke="#8a949c" stroke-width="1.5" stroke-dasharray="3 4"/><text font-size="15" fill="#1a2433" font-weight="bold" text-anchor="start"><tspan x="436.0" y="47.8">全部を同じ密度では見られない</tspan></text><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="436.0" y="68.0">のり面、切土、盛土が数百か所</tspan></text><polygon points="66.3,94 369.7,94 331.3,156 104.7,156" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5" stroke-linejoin="round"/><text font-size="17" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="218.0" y="132.0">動きのある候補</tspan></text><line x1="356.5" y1="125.0" x2="426" y2="125.0" stroke="#2f5d94" stroke-width="1.5" stroke-dasharray="3 4"/><text font-size="15" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="436.0" y="119.8">衛星で候補を拾い、順番を付ける</tspan></text><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="436.0" y="140.0">候補であって、変状の確定ではない</tspan></text><polygon points="104.7,166 331.3,166 293.0,228 143.0,228" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5" stroke-linejoin="round"/><text font-size="17" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="218.0" y="204.0">現地で確認</tspan></text><line x1="318.2" y1="197.0" x2="426" y2="197.0" stroke="#ff6b2c" stroke-width="1.5" stroke-dasharray="3 4"/><text font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start"><tspan x="436.0" y="191.8">技術者が現地で判定する</tspan></text><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="436.0" y="212.0">候補から外れた箇所も「安全」とは扱わない</tspan></text></svg>
