<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 191" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>打ち上げから画像の提供までの段階。打ち上げ、分離、初交信、アンテナ展開までは11月3日の発表で確認済み。初画像の取得はこれから。調整・較正と提供開始の時期は発表に書かれていない</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="191" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="26.0" width="114.4" height="110.5" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="79.2" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="79.2" y="32.5">1</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="79.2" y="66.0">打ち上げ</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="79.2" y="92.3">3日の1時41分</tspan></text><line x1="141.4" y1="81.3" x2="154.4" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="162.4" y="26.0" width="114.4" height="110.5" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="219.6" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="219.6" y="32.5">2</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="219.6" y="66.0">分離</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="219.6" y="92.3">約50分後に成功</tspan></text><line x1="281.8" y1="81.3" x2="294.8" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="302.8" y="26.0" width="114.4" height="110.5" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="360.0" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="32.5">3</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="360.0" y="66.0">初交信</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="360.0" y="92.3">分離の約30分後。</tspan><tspan x="360.0" y="110.4">機器は正常</tspan></text><line x1="422.2" y1="81.3" x2="435.2" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="443.2" y="26.0" width="114.4" height="110.5" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="500.4" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="500.4" y="32.5">4</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="500.4" y="66.0">展開</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="500.4" y="92.3">アンテナ。3日</tspan><tspan x="500.4" y="110.4">早朝に確認</tspan></text><line x1="562.6" y1="81.3" x2="575.6" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="583.6" y="26.0" width="114.4" height="110.5" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="640.8" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="32.5">5</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="66.0">初画像</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="640.8" y="92.3">これから。時期</tspan><tspan x="640.8" y="110.4">は未記載</tspan></text><rect x="22.0" y="154.6" width="16.0" height="16.0" rx="4" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="45.0" y="167.6">衛星・解析</tspan></text></svg>
