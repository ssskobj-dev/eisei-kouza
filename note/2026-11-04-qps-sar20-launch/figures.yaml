  - id: fig-1
    type: flow
    alt: 打ち上げから画像の提供までの段階。打ち上げ、分離、初交信、アンテナ展開までは11月3日の発表で確認済み。初画像の取得はこれから。調整・較正と提供開始の時期は発表に書かれていない
    steps:
      - title: 打ち上げ
        text: 3日の1時41分
      - title: 分離
        text: 約50分後に成功
      - title: 初交信
        text: 分離の約30分後。機器は正常
      - title: 展開
        text: アンテナ。3日早朝に確認
      - title: 初画像
        text: これから。時期は未記載

  - id: fig-2
    type: split
    alt: 打ち上げで変わることと、変わらないこと
    link: ⇔
    left:
      title: 発表から読み取れること
      items:
        - 分離、初交信、アンテナ展開まで成功。次は初画像
        - 会社の計画は24機（2028年5月末）、平均10分間隔を目指す
        - 国は民間衛星の活用拡大期間（2024〜2026年度）の途中
    right:
      title: 読み取れないこと
      role: none
      items:
        - この衛星の画像がいつから提供されるか
        - 今の体制で、自分の対象地を何日おきに撮れるか
        - 46cmが、どの観測モード・撮影幅での数字か
    note: 提案書の「将来の計画の頻度」は、「今の体制で何日おきか」に言い換えてもらう
