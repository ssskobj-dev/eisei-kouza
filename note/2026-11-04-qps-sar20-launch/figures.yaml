# 時事記事「国産の小型SAR衛星QPS-SAR20号機が11月3日に打ち上げ、初交信とアンテナ展開に成功」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: インフラ監視
    title: 国産SAR衛星、20号機が軌道へ
