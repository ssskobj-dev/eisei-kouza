# 時事記事「無償の衛星Sentinelの観測計画の基準文書（HLOP）が第4版に」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 地盤変位・インフラ監視
    title: Sentinelの観測計画が第4版に
    sub: 日本は「12日に1回・片方向」が基本。頻度の確かめ方

  - id: fig-1
    type: cards
    alt: HLOP第4版の3つの要点。2機の構成、欧州以外の基本の頻度、計画の公開
    columns: 3
    items:
      - title: 2機で継続
        text: Sentinel-1は1Cと1Dの2機。同じ軌道に180度離れ、2機で6日の回帰周期
      - title: 欧州の外は12日
        text: 欧州は6日ごと・両方向。それ以外の陸地は1機で12日ごと・片方向が基本の目標
      - title: 計画は公開
        text: 観測の地図とKMLの計画ファイルで、対象地域の方向と間隔を自分で見られる

  - id: fig-2
    type: split
    alt: 無償のSentinel-1に頼める観測と、頼めない観測
    link: ⇔
    left:
      title: 基本の計画で頼める
      items:
        - 12日ごと・1方向の干渉SAR向けの観測
        - 月に2〜3回の、地盤の動きの傾向
        - 公開された計画で、頻度を自分で確認
    right:
      title: 基本の計画の外
      role: none
      items:
        - 6日ごと・両方向の観測（欧州だけ）
        - 災害直後の数日おきの観測（増えることはあっても約束ではない）
        - 文書に反映されない日々の変更（欠落、延長）
    note: 頻度は文書とKMLで確かめ、足りない分は国内や商用の衛星で設計する
