ound" marker-end="url(#ah-0b1524)"/><rect x="583.6" y="26.0" width="114.4" height="128.7" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="640.8" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="32.5">5</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="640.8" y="66.0">出す</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="640.8" y="92.3">表の単位と件数、</tspan><tspan x="640.8" y="110.4">隠れた失敗</tspan></text><rect x="22.0" y="172.7" width="16.0" height="16.0" rx="4" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="45.0" y="185.7">衛星・解析</tspan></text></svg>
