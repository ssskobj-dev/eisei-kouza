# note記事「衛星データ、何枚買えばいいのか」の見出し画像と図。
# python scripts/figures.py survey-procurement で、このフォルダにSVGとPNGができる。
figures:
  - id: thumbnail
    type: thumbnail
    kind: course
    tag: 測量・建設コンサル向け
    title: 衛星データ、何枚買えばいいのか
    sub: 発注する側が先に決める4つのこと

  - id: fig-1
    type: flow
    alt: データの選定から発注までの6つの手順
    steps:
      - title: 対象と目的
        text: 動きの向き、速さ、範囲
        who: human
      - title: 波長を選ぶ
        text: 植生ならL、短い間隔ならC
        who: satellite
      - title: 観測方向
        text: 北行か南行か、両方か
        who: satellite
      - title: 期間と枚数
        text: 解析の方法から逆算
        who: satellite
      - title: 蓄積を確認
        text: 仕様のそろう枚数があるか
        who: satellite
      - title: 条件と発注
        text: 帰属、精度の指標、内訳
        who: human

  - id: fig-2
    type: sightline
    alt: 衛星SARが捉えやすい動きと、捉えにくい動き（上から見た図）
    note: 測れるのは、衛星に近づく動きと遠ざかる動きだけ。南北の動きは捉えにくい
