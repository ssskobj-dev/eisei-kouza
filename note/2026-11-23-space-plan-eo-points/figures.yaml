# 時事記事「宇宙基本計画の改定に向けた論点整理案」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 国の方針
    title: 宇宙基本計画の改定、論点が出た
    sub: 国が買い手に。自治体の衛星データは国がまとめ買いか

  - id: fig-1
    type: cards
    alt: 論点整理案のうち、衛星データを調達する側に関わる3点。国が買い手になるアンカーテナンシーは利用者側の需要とスペックの明確化が前提、自治体の衛星データ利用は地域差が大きく広域の分野は国がまとめて調達する案、大型の地球観測衛星を公共衛星と位置づけ国が安定して開発・運用する案
    columns: 3
    items:
      - title: 国が買い手に
        text: 政府調達（アンカーテナンシー）を一層促進。前提は、利用者側の具体的な需要とスペックの明確化
      - title: 国がまとめ買い
        text: 自治体の衛星データ利用は地域差が大きい。広域で調達した方が効率的な分野は、国が一定程度まとめて調達する案
      - title: 「公共衛星」
        text: 大型の地球観測衛星など、公的インフラとして使われている衛星を公共衛星と位置づけ、国が安定して開発・運用

  - id: fig-2
    type: flow
    alt: 宇宙基本計画の改定の日程（内閣府の見通し）。2026年11月に部会・小委員会で分野別に議論、12月ごろに論点整理、2027年1〜2月ごろに骨子案、4月ごろに案、5月ごろに了承して閣議決定
    steps:
      - title: 2026年11月
        text: 小委員会で議論中
      - title: 12月ごろ
        text: 論点整理
      - title: 2027年1〜2月
        text: 骨子案を議論
      - title: 4月ごろ
        text: 計画案を議論
      - title: 5月ごろ
        text: 了承、閣議決定
