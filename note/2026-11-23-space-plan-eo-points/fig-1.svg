<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>論点整理案のうち、衛星データを調達する側に関わる3点。国が買い手になるアンカーテナンシーは利用者側の需要とスペックの明確化が前提、自治体の衛星データ利用は地域差が大きく広域の分野は国がまとめて調達する案、大型の地球観測衛星を公共衛星と位置づけ国が安定して開発・運用する案</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="222" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">国が買い手に</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">政府調達（アンカーテ</tspan><tspan x="80.0" y="102.7">ナンシー）を一層促進。</tspan><tspan x="80.0" y="122.9">前提は、利用者側の具</tspan><tspan x="80.0" y="143.2">体的な需要とスペック</tspan><tspan x="80.0" y="163.4">の明確化</tspan></text><rect x="252.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">国がまとめ買い</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">自治体の衛星データ</tspan><tspan x="310.0" y="102.7">利用は地域差が大き</tspan><tspan x="310.0" y="122.9">い。広域で調達した</tspan><tspan x="310.0" y="143.2">方が効率的な分野は、</tspan><tspan x="310.0" y="163.4">国が一定程度まとめ</tspan><tspan x="310.0" y="183.7">て調達する案</tspan></text><rect x="482.0" y="22.0" width="216.0" height="177.9" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">「公共衛星」</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">大型の地球観測衛星</tspan><tspan x="540.0" y="102.7">など、公的インフラ</tspan><tspan x="540.0" y="122.9">として使われている</tspan><tspan x="540.0" y="143.2">衛星を公共衛星と位</tspan><tspan x="540.0" y="163.4">置づけ、国が安定し</tspan><tspan x="540.0" y="183.7">て開発・運用</tspan></text></svg>
