<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img"><title>国土地理院の硫黄島のSAR強度画像の公表の3つの要点。強度画像である、噴煙を通す、同じ向きの3枚</title><defs><marker id="ah-2f5d94" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d94"/></marker><marker id="ah-ff6b2c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b2c"/></marker><marker id="ah-8a949c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a949c"/></marker><marker id="ah-0b1524" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1524"/></marker><marker id="ah-1a2433" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2433"/></marker></defs><rect width="720" height="242" rx="14" fill="#ffffff" stroke="#e6edf6" stroke-width="2"/><rect x="22.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="51.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="58.5">1</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="80.0" y="56.0">干渉画像ではない</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="80.0" y="82.4">公表は「強度画像」。</tspan><tspan x="80.0" y="102.7">電波の返りの強さを明</tspan><tspan x="80.0" y="122.9">るさで表した画像。翁</tspan><tspan x="80.0" y="143.2">浜沖の明るい領域を「</tspan><tspan x="80.0" y="163.4">噴出物とみられる」と</tspan><tspan x="80.0" y="183.7">記載。地盤が何cm動い</tspan><tspan x="80.0" y="203.9">たかは示していない</tspan></text><rect x="252.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="281.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="281.0" y="58.5">2</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="310.0" y="56.0">噴煙を通り抜ける</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="310.0" y="82.4">噴火中でも地形の変</tspan><tspan x="310.0" y="102.7">化を把握できると注</tspan><tspan x="310.0" y="122.9">記。光学衛星や航空</tspan><tspan x="310.0" y="143.2">写真では噴煙と雲の</tspan><tspan x="310.0" y="163.4">下は見えない</tspan></text><rect x="482.0" y="22.0" width="216.0" height="198.2" rx="10" fill="#e6edf6" stroke="none" stroke-width="1.5"/><circle cx="511.0" cy="53.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="511.0" y="58.5">3</tspan></text><text font-size="16" fill="#0b1524" font-weight="bold" text-anchor="start"><tspan x="540.0" y="56.0">3枚とも南行で統一</tspan></text><text font-size="13.5" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="540.0" y="82.4">11月3日・6日・14日</tspan><tspan x="540.0" y="102.7">の画像はすべて南行。</tspan><tspan x="540.0" y="122.9">見え方は衛星の進行</tspan><tspan x="540.0" y="143.2">方向と電波の方向で</tspan><tspan x="540.0" y="163.4">変わるので、同じ向</tspan><tspan x="540.0" y="183.7">きで並べる</tspan></text></svg>
