# 時事記事「国土地理院が噴火中の硫黄島をだいち2号・4号のSAR強度画像で解析」の見出し画像と図。
figures:
  - id: thumbnail
    type: thumbnail
    kind: news
    tag: 災害・火山
    title: 噴火中の硫黄島をSARで見る
    sub: 国土地理院が強度画像を公表。干渉SARとの違いをどう読むか

  - id: fig-1
    type: cards
    alt: 国土地理院の硫黄島のSAR強度画像の公表の3つの要点。強度画像である、噴煙を通す、同じ向きの3枚
    columns: 3
    items:
      - title: 干渉画像ではない
        text: 公表は「強度画像」。電波の返りの強さを明るさで表した画像。翁浜沖の明るい領域を「噴出物とみられる」と記載。地盤が何cm動いたかは示していない
      - title: 噴煙を通り抜ける
        text: 噴火中でも地形の変化を把握できると注記。光学衛星や航空写真では噴煙と雲の下は見えない
      - title: 3枚とも南行で統一
        text: 11月3日・6日・14日の画像はすべて南行。見え方は衛星の進行方向と電波の方向で変わるので、同じ向きで並べる

  - id: fig-2
    type: split
    alt: 強度画像と干渉SARで、答えられる問いの違い
    link: ⇔
    left:
      title: 強度画像（今回の公表）
      items:
        - 分かること：地形が変わった場所。新しい陸地、噴出物、海岸線の変化
        - 1枚でも「明るい領域が増えた」と示せる
        - 噴火の最中に使えるのは、まずこちら
    right:
      title: 干渉SAR（今回は含まれない）
      role: none
      items:
        - 分かること：地盤が動いた量と向き。数cmの単位
        - 2回の観測を比べる。地表が大きく変わった場所は縞が乱れて読めない
        - 隆起や沈降を知りたいときはこちら、またはGNSS
    note: どちらも同じレーダー衛星のデータから作る。仕様書では、どちらを頼むかを分けて書く
