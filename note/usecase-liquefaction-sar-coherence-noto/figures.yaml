# note記事「地震のあと、どの街区から液状化の調査に入るか。能登半島地震の内灘町で、無償の衛星データが埋立地の範囲と概ね一致した報告と、的中率の数字がない限界」の見出し画像と図。
figures:
- id: thumbnail
  type: thumbnail
  kind: usecase
  tag: 防災
  title: 液状化の範囲を衛星で推定する
  sub: 能登半島地震の内灘町。地震の10日後の画像で埋立地と一致
- id: fig-1
  type: split
  alt: 衛星に任せることと、人が行うこと
  link: ＋
  left:
    title: 衛星と解析が行う
    items:
    - 地震の前後でコヒーレンスの低下を面で抜き出す
    - 変状の可能性が高い範囲を地図にする
    - 旧地形図の埋立地と重ねる
  right:
    title: 人が行う
    items:
    - 家屋の調査に入る街区の順番を決める
    - 貫入試験や表面波探査で地盤の緩みを確かめる
    - 罹災証明と復旧の判断
  note: 衛星は「可能性が高い範囲」まで。液状化の判定は現地で
- id: fig-2
  type: cards
  alt: この使い方の5つの限界
  columns: 2
  items:
  - title: 的中率の数字がない
    text: 検証は旧地形図との目視の比較
    role: none
  - title: 液状化以外でも下がる
    text: 倒壊、がれき、積雪でも変わる
    role: none
  - title: 次の観測を待つ
    text: この事例は地震の10日後の画像
    role: none
  - title: 可能性が高い範囲まで
    text: 沈下量や家屋の傾きは分からない
    role: none
  - title: 地盤の中は見えない
    text: 埋立層の深さは現地の調査で
    role: none
