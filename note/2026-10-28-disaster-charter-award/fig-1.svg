h-0b1524)"/><rect x="490.0" y="26.0" width="91.0" height="110.5" rx="10" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><circle cx="535.5" cy="27.0" r="14" fill="#2f5d94"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="535.5" y="32.5">5</tspan></text><text font-size="14.5" fill="#0b1524" font-weight="bold" text-anchor="middle"><tspan x="535.5" y="66.0">変位の図</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="535.5" y="92.3">30日〜8月5</tspan><tspan x="535.5" y="110.4">日に順次</tspan></text><line x1="586.0" y1="81.3" x2="599.0" y2="81.3" stroke="#0b1524" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-0b1524)"/><rect x="607.0" y="26.0" width="91.0" height="110.5" rx="10" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><circle cx="652.5" cy="27.0" r="14" fill="#ff6b2c"/><text font-size="15" fill="#fff" font-weight="bold" text-anchor="middle"><tspan x="652.5" y="32.5">6</tspan></text><text font-size="14.5" fill="#c2410c" font-weight="bold" text-anchor="middle"><tspan x="652.5" y="66.0">現場へ</tspan></text><text font-size="12.5" fill="#1a2433" font-weight="normal" text-anchor="middle"><tspan x="652.5" y="92.3">国の防災機</tspan><tspan x="652.5" y="110.4">関を経て</tspan></text><rect x="22.0" y="154.6" width="16.0" height="16.0" rx="4" fill="#ffeee5" stroke="#ff6b2c" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="45.0" y="167.6">人・現地</tspan></text><rect x="119.0" y="154.6" width="16.0" height="16.0" rx="4" fill="#e6edf6" stroke="#2f5d94" stroke-width="1.5"/><text font-size="13" fill="#1a2433" font-weight="normal" text-anchor="start"><tspan x="142.0" y="167.6">衛星・解析</tspan></text></svg>
